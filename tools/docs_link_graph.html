<style>

<body>
<div id="view"><div id="labels"></div><div id="tip"></div></div>
<aside>
  <h1>Docs link graph</h1>
  <div class="sub" id="summary"></div>
  <h2>Find</h2>
  <input type="search" id="search" placeholder="page, transcript, file or package…" autocomplete="off">
  <div id="matches"></div>
  <h2>Show</h2>
  <div id="layers"></div>
  <div id="edges"></div>
  <label class="check"><input type="checkbox" id="spin"> turn slowly</label>
  <h2>Colour</h2>
  <select id="colour">
    <option value="system">Pages by section</option>
    <option value="age">Days since last substantive edit</option>

  </select>
  <div id="legend"></div>

<script type="text/plain" id="three-core">/*THREE_CORE*/</script>
<script type="text/plain" id="three-module">/*THREE_MODULE*/</script>
<script type="text/plain" id="three-orbit">/*THREE_ORBIT*/</script>
<script>/*FORCE*/</script>
<script>const GRAPH = /*GRAPH*/null;</script>
<script type="module">
// three.js arrives as text so the page needs no server; each module imports the previous one by blob URL.
const source = id => document.getElementById(id).textContent;
const blob = text => URL.createObjectURL(new Blob([text], { type: "text/javascript" }));
const coreUrl = blob(source("three-core"));
const threeUrl = blob(source("three-module").replaceAll("'./three.core.js'", `'${coreUrl}'`));
const orbitUrl = blob(source("three-orbit").replaceAll("from 'three'", `from '${threeUrl}'`));
const THREE = await import(threeUrl);
const { OrbitControls } = await import(orbitUrl);

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const view = document.getElementById("view"), labelLayer = document.getElementById("labels"), tip = document.getElementById("tip");
const nodes = GRAPH.nodes, kinds = GRAPH.edgeKinds, packages = GRAPH.packages || [];
const bit = Object.fromEntries(kinds.map((k, i) => [k, 1 << i]));
const DAY = 86400, now = Date.now() / 1000;

// ---- adjacency
const out = nodes.map(() => []), inc = nodes.map(() => []);
for (const [s, t, m] of GRAPH.links) { out[s].push([t, m]); inc[t].push([s, m]); }

// ---- layers and edge kinds
const layerOf = n => n.index ? "index" : n.kind;
const LAYERS = [["page", "pages"], ["transcript", "transcripts"], ["code", "code"], ["reference", "reference"], ["index", "catalogues"]];
const shown = { page: true, transcript: true, code: true, reference: false, index: false };
const EDGE_LABELS = { links: "links", opens: "opens transcript", documents: "transcript → page", cites: "cites file",
                      calls: "calls (fences)", mentions: "mentions (prose)", reference: "reference → file", usedIn: "used in" };
// Code edges start off: a selected node shows all its own edges anyway, and 7,000 lines from the
// core to the shell are a haze. Switched on, they draw at a fraction of the docs edges' strength.
const edgeOn = { links: true, opens: true, documents: true, cites: false, calls: false, mentions: false, reference: false, usedIn: false };
const present = new Set(nodes.map(layerOf)), presentKinds = new Set();
for (const [, , m] of GRAPH.links) kinds.forEach(k => { if (m & bit[k]) presentKinds.add(k); });
function checkboxes(host, entries, state) {
  for (const [key, label] of entries) {
    const l = document.createElement("label"); l.className = "check";
    const c = document.createElement("input"); c.type = "checkbox"; c.checked = state[key];
    c.onchange = () => { state[key] = c.checked; legend(); simulate(0.6); rebuild(); };
    l.append(c, " " + label); host.append(l);
  }
}
checkboxes(document.getElementById("layers"), LAYERS.filter(([k]) => present.has(k)), shown);
checkboxes(document.getElementById("edges"), kinds.filter(k => presentKinds.has(k)).map(k => [k, EDGE_LABELS[k] || k]), edgeOn);
const edgeMask = () => kinds.reduce((m, k) => edgeOn[k] ? m | bit[k] : m, 0);
const visible = n => shown[layerOf(n)];

// ---- colour
// Sections in fixed order by page count; the first eight get the categorical slots, the rest are "other".
const sectionCount = {};
for (const n of nodes) if (n.kind === "page" && !n.index) sectionCount[n.system] = (sectionCount[n.system] || 0) + 1;
const sections = Object.keys(sectionCount).sort((a, b) => sectionCount[b] - sectionCount[a] || a.localeCompare(b));
const slot = {}; sections.slice(0, 8).forEach((s, i) => slot[s] = i + 1);
let colours = {};
function readColours() {
  colours = { other: css("--other"), edge: css("--edge"), edgeAlpha: parseFloat(css("--edge-alpha")), text: css("--text"),
              surface: css("--surface"), ramp: ["--q0", "--q1", "--q2", "--q3", "--q4"].map(css) };
  for (let i = 1; i <= 8; i++) colours["s" + i] = css("--s" + i);
}
readColours();
let mode = "system", focusSection = null;
const ageDays = n => { const t = n.lastEdit || n.created; return t ? (now - t) / DAY : null; };
const metric = { age: ageDays, drift: n => n.codeDriftDays ?? null };
// Fixed bands, not a stretch to the maximum: one ancient file would otherwise put every page in the first step.
const bands = { age: [7, 14, 30, 60], drift: [3, 7, 14, 30] };
const bandOf = (v, edges) => { let i = 0; while (i < edges.length && v >= edges[i]) i++; return i; };
function colourOf(n) {
  if (mode === "system") return n.kind === "page" && slot[n.system] ? colours["s" + slot[n.system]] : colours.other;
  const v = metric[mode](n);
  return v == null ? colours.other : colours.ramp[bandOf(v, bands[mode])];
}
function legend() {
  const host = document.getElementById("legend"); host.innerHTML = "";
  const ul = document.createElement("ul"); ul.className = "legend"; host.append(ul);
  if (mode === "system") {
    const rows = sections.slice(0, 8).map(s => [s, colours["s" + slot[s]], sectionCount[s]]);
    const rest = sections.slice(8);
    if (rest.length) rows.push([null, colours.other, rest.reduce((a, s) => a + sectionCount[s], 0), "other: " + rest.join(", ")]);
    for (const [s, c, count, title] of rows) {
      const li = document.createElement("li");
      li.title = title || "click to pick out this section";
      li.className = focusSection === null ? "" : focusSection === s ? "on" : "off";
      li.innerHTML = `<span class="swatch" style="background:${c}"></span><span></span><span class="n">${count}</span>`;
      li.children[1].textContent = s ?? "Other sections";
      li.onclick = () => { focusSection = focusSection === s ? null : s; legend(); restyle(); };
      ul.append(li);
    }
    return;
  }
  const edges = bands[mode], counts = colours.ramp.map(() => 0);
  for (const n of nodes) if (visible(n)) { const v = metric[mode](n); if (v != null) counts[bandOf(v, edges)]++; }
  const names = edges.map((e, i) => `${i ? edges[i - 1] : 0}–${e} days`).concat(`${edges[edges.length - 1]}+ days`);
  names.forEach((name, i) => {
    const li = document.createElement("li"); li.style.cursor = "default";
    li.innerHTML = `<span class="swatch" style="background:${colours.ramp[i]};border-radius:2px"></span><span>${name}</span><span class="n">${counts[i]}</span>`;
    ul.append(li);
  });
  const hint = document.createElement("div"); hint.className = "hint";
  hint.textContent = mode === "drift" ? "Pages only: how long after the page's last edit the code it cites or calls was changed. Grey: none of it was."
                                      : "Since the last edit that was not a sweep (a commit touching 30+ files). Grey: no history.";
  host.append(hint);
}
document.getElementById("colour").onchange = e => { mode = e.target.value; focusSection = null; legend(); restyle(); };
for (const option of [...document.getElementById("colour").options])
  if (metric[option.value] && !nodes.some(n => metric[option.value](n) != null)) option.remove();
if (document.getElementById("colour").options.length < 2) document.getElementById("colour").style.display = "none";

// ---- size (world units: the layout puts linked pages about 1 apart)
const maxRank = Math.max(...nodes.map(n => n.pagerank || 0), 1e-9);
function radius(n) {
  if (n.kind === "page") return n.index ? 0.09 : 0.05 + 0.26 * Math.sqrt((n.pagerank || 0) / maxRank);
  if (n.kind === "transcript") return 0.05;
  if (n.kind === "reference") return 0.09;
  return 0.025 + Math.min(0.06, Math.sqrt(n.apiSize || 0) * 0.006);
}
const R = nodes.map(radius);
const P = nodes.map(n => new THREE.Vector3(n.p[0], n.p[1], n.p[2]));

// ---- scene
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(colours.surface, 10, 60);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.autoRotateSpeed = 0.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(1, 2, 1.5); scene.add(sun);

const SHAPES = { page: new THREE.SphereGeometry(1, 18, 12), transcript: new THREE.OctahedronGeometry(1.25), code: new THREE.BoxGeometry(1.5, 1.5, 1.5) };
const shapeOf = n => n.kind === "page" ? "page" : n.kind === "transcript" ? "transcript" : "code";
const meshes = {}, slotOf = new Array(nodes.length);
for (const shape in SHAPES) {
  const members = nodes.map((n, i) => i).filter(i => shapeOf(nodes[i]) === shape);
  const mesh = new THREE.InstancedMesh(SHAPES[shape], new THREE.MeshLambertMaterial(), Math.max(1, members.length));
  mesh.count = members.length; mesh.userData.members = members;
  members.forEach((i, k) => slotOf[i] = [shape, k]);
  mesh.frustumCulled = false; scene.add(mesh); meshes[shape] = mesh;
}
const edgeMaterial = new THREE.LineBasicMaterial({ transparent: true, depthWrite: false });
const hiMaterial = new THREE.LineBasicMaterial({ transparent: true, depthWrite: false, opacity: 0.9 });
const codeMaterial = new THREE.LineBasicMaterial({ transparent: true, depthWrite: false });
const edgeLines = new THREE.LineSegments(new THREE.BufferGeometry(), edgeMaterial);
const codeLines = new THREE.LineSegments(new THREE.BufferGeometry(), codeMaterial);
const hiLines = new THREE.LineSegments(new THREE.BufferGeometry(), hiMaterial);
edgeLines.frustumCulled = codeLines.frustumCulled = hiLines.frustumCulled = false;
scene.add(edgeLines, codeLines, hiLines);

// ---- selection state
let selected = -1, hovered = -1, near = new Set();
const dim = i => (selected >= 0 && i !== selected && !near.has(i)) ||
                 (focusSection !== null && !(nodes[i].kind === "page" && nodes[i].system === focusSection));

const matrix = new THREE.Matrix4(), colour = new THREE.Color(), surface = new THREE.Color();
function restyle() {
  if (!layoutMoving()) readColours();
  surface.set(colours.surface);
  scene.background = surface.clone(); scene.fog.color.copy(surface);
  for (const shape in meshes) {
    const mesh = meshes[shape];
    mesh.userData.members.forEach((i, k) => {
      const r = visible(nodes[i]) ? R[i] : 0;
      matrix.makeScale(r, r, r).setPosition(P[i]);
      mesh.setMatrixAt(k, matrix);
      colour.set(colourOf(nodes[i]));
      if (dim(i)) colour.lerp(surface, 0.86);
      mesh.setColorAt(k, colour);
    });
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  }
  edgeMaterial.color.set(colours.edge); codeMaterial.color.set(colours.edge); hiMaterial.color.set(colours.text);
  edgeMaterial.opacity = colours.edgeAlpha * (selected >= 0 || focusSection !== null ? 0.35 : 1);
  codeMaterial.opacity = edgeMaterial.opacity * 0.4;
  const isDoc = i => nodes[i].kind === "page" || nodes[i].kind === "transcript";
  const mask = edgeMask(), quiet = [], quietCode = [], hi = [];
  for (const [s, t, m] of GRAPH.links) {
    if (!visible(nodes[s]) || !visible(nodes[t])) continue;
    if (s === selected || t === selected) { hi.push(P[s].x, P[s].y, P[s].z, P[t].x, P[t].y, P[t].z); continue; }
    if (!(m & mask)) continue;
    if (focusSection !== null && (dim(s) || dim(t))) continue;
    (isDoc(s) && isDoc(t) ? quiet : quietCode).push(P[s].x, P[s].y, P[s].z, P[t].x, P[t].y, P[t].z);
  }
  edgeLines.geometry.setAttribute("position", new THREE.Float32BufferAttribute(quiet, 3));
  codeLines.geometry.setAttribute("position", new THREE.Float32BufferAttribute(quietCode, 3));
  hiLines.geometry.setAttribute("position", new THREE.Float32BufferAttribute(hi, 3));
  dirty = true;
}
const rebuild = restyle;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColours(); legend(); restyle(); });

// ---- camera framing
// Frames the points' middle 95 % (all of them when there are few), so one stray node does not shrink the rest.
function frame(points, animate) {
  const pts = points.length ? points : [new THREE.Vector3()];
  const centre = pts.reduce((c, p) => c.add(p), new THREE.Vector3()).divideScalar(pts.length);
  const reach = pts.map(p => p.distanceTo(centre)).sort((a, b) => a - b);
  const sphere = new THREE.Sphere(centre, reach[pts.length < 20 ? pts.length - 1 : Math.floor(0.95 * (pts.length - 1))]);
  const dist = Math.max(0.8, sphere.radius) / Math.tan(THREE.MathUtils.degToRad(Math.min(camera.fov, camera.fov * camera.aspect) / 2)) * 1.15;
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (dir.lengthSq() === 0 || !isFinite(dir.x)) dir.set(0.35, 0.25, 1).normalize();
  flyTo(sphere.center, sphere.center.clone().addScaledVector(dir, dist), animate);
}
let flight = null;
function flyTo(target, position, animate) {
  if (!animate) { controls.target.copy(target); camera.position.copy(position); controls.update(); dirty = true; return; }
  flight = { t0: performance.now(), fromT: controls.target.clone(), fromP: camera.position.clone(), toT: target.clone(), toP: position.clone() };
}
function centreOn(i) {
  const offset = camera.position.clone().sub(controls.target);
  const want = Math.min(offset.length(), 6 + 20 * R[i]);
  flyTo(P[i], P[i].clone().addScaledVector(offset.normalize(), want), true);
}

// ---- layout: a live force simulation
// d3-force-3d (vendored as d3-force-3d-webgpu): link springs, an octree Barnes–Hut many-body
// force and centring, run as WebGPU compute shaders when the browser has WebGPU and on the CPU
// otherwise. Every visible node takes part. Pages are held by the links a reader follows; a
// source file hangs from its directory, and each directory from its parent, by invisible tree
// links, so code nothing reaches still sits with its siblings; the code edge kinds that are
// switched on (cites, calls, mentions, ...) tie files to the pages that use them. Turning a layer
// or an edge kind on or off rebuilds the forces and reheats the simulation from where things are.
// The positions the page was built with are only where it starts.
const SCALE = 30;  // d3's forces are tuned for links about 30 apart; the scene puts them about 1 apart
const packageIndex = new Map(packages.map((p, k) => [p.id, k]));
const packageOfNode = n => { const path = n.id.slice("code:".length); return packageIndex.get("package:" + path.slice(0, path.lastIndexOf("/"))); };
const parentPackage = id => { const up = id.slice(0, id.lastIndexOf("/")); return packageIndex.has(up) ? packageIndex.get(up) : null; };
const bodies = nodes.map((n, i) => ({ node: i, x: P[i].x * SCALE, y: P[i].y * SCALE, z: P[i].z * SCALE }));
const packageBodies = packages.map((p, k) => ({ pkg: k, x: p.p[0] * SCALE, y: p.p[1] * SCALE, z: p.p[2] * SCALE }));
const GRAVITY = 0.02, FOCUS_LENGTH = 9, FOCUS_STRENGTH = 0.8, FOCUS_SLACK = 0.05;
const CHARGE = { page: -60, transcript: -25, reference: -60, code: -10 };
const LINK_LENGTH = { links: 30, opens: 24, documents: 24, cites: 14, calls: 14, mentions: 18, reference: 40, usedIn: 18 };
let sim = null, settled = false, backend = "";
function simulate(alpha = 1) {
  if (sim) sim.destroy();
  const live = bodies.filter(b => visible(nodes[b.node]));
  const withCode = shown.code;
  const pkgs = withCode ? packageBodies : [];
  const mask = edgeMask(), links = [];
  for (const [s, t, m] of GRAPH.links) {
    if (!(m & mask) || !visible(nodes[s]) || !visible(nodes[t])) continue;
    const length = Math.min(...kinds.filter(k => m & mask & bit[k]).map(k => LINK_LENGTH[k] ?? 30));
    links.push({ source: bodies[s], target: bodies[t], length });
  }
  if (withCode) {
    for (const b of live) if (nodes[b.node].kind === "code") {
      const k = packageOfNode(nodes[b.node]);
      if (k != null) links.push({ source: b, target: packageBodies[k], length: 5, tree: true });
    }
    packages.forEach((p, k) => { const up = parentPackage(p.id); if (up != null) links.push({ source: packageBodies[k], target: packageBodies[up], length: 10, tree: true }); });
  }
  // A selected node gathers its neighbourhood: a short, stiff spring to every visible neighbour,
  // with the node itself held where it is, so what it links to comes to it instead of spanning
  // the map. Deselecting drops the springs and lets the map relax.
  for (const b of bodies) b.fx = b.fy = b.fz = undefined;
  const gathered = new Set();
  if (selected >= 0 && visible(nodes[selected])) {
    const centre = bodies[selected];
    centre.fx = centre.x; centre.fy = centre.y; centre.fz = centre.z;
    for (const j of near) if (visible(nodes[j])) { gathered.add(bodies[j]); links.push({ source: centre, target: bodies[j], length: FOCUS_LENGTH, focus: true }); }
  }
  // A gathered node's other links go slack, or they hold it out where it was.
  const slack = l => gathered.has(l.source) || gathered.has(l.target) ? FOCUS_SLACK : 1;
  const degree = new Map();
  for (const l of links) for (const end of [l.source, l.target]) degree.set(end, (degree.get(end) || 0) + 1);
  settled = false;
  sim = d3.forceSimulationGPU([...live, ...pkgs], 3)
    .alpha(alpha)
    // d3's own default strength (1 / the smaller degree), except a focus spring, which wins.
    .force("link", d3.forceLink(links).distance(l => l.length)
      .strength(l => l.focus ? FOCUS_STRENGTH : slack(l) / Math.min(degree.get(l.source), degree.get(l.target))))
    .force("charge", d3.forceManyBody().strength(b => b.pkg != null ? -3 : CHARGE[nodes[b.node].kind] ?? -20).theta(0.9))
    .force("centre", d3.forceCenter(0, 0, 0))
    // Gravity, as in ForceAtlas2: without it a page that links nothing drifts off for ever.
    .force("x", d3.forceX(0).strength(GRAVITY)).force("y", d3.forceY(0).strength(GRAVITY)).force("z", d3.forceZ(0).strength(GRAVITY))
    .on("tick", moved)
    .on("end", () => { settled = true; moved(); readColours(); restyle(); followFocus(true); if (!userMoved) fitVisible(true); });
  sim.gpuReady().then(onGPU => { backend = onGPU ? "laid out on the GPU" : "laid out on the CPU"; summary(); });
}
// While a neighbourhood gathers, the camera follows it, unless the reader takes the camera.
let following = -1, ticksSinceFollow = 0;
function followFocus(last) {
  if (following < 0 || following !== selected) return;
  if (!last && ++ticksSinceFollow < 25) return;
  ticksSinceFollow = 0;
  frame([following, ...near].filter(j => visible(nodes[j])).map(j => P[j]), true);
  if (last) following = -1;
}
function moved() {
  followFocus(false);
  for (const b of bodies) if (visible(nodes[b.node])) P[b.node].set(b.x / SCALE, b.y / SCALE, b.z / SCALE);
  for (const b of packageBodies) packages[b.pkg].p = [b.x / SCALE, b.y / SCALE, b.z / SCALE];
  restyle();
}
function layoutMoving() { return sim && !settled; }
let userMoved = false;
controls.addEventListener("start", () => { userMoved = true; following = -1; });
const fitVisible = animate => frame(nodes.map((n, i) => i).filter(i => visible(nodes[i])).map(i => P[i]), animate);

// ---- labels: an HTML overlay, placed most important first, skipping any that would overlap. Each
// label keeps its own span, which fades in and out (CSS, 300 ms) as it wins or loses its place, so
// turning the view does not flicker labels on and off frame by frame.
const shownLabels = new Map();  // key → { span, isPackage, i, off: time it lost its place, or 0 }
const projected = new THREE.Vector3();
function screenOf(i, w, h) {
  projected.copy(P[i]).project(camera);
  if (projected.z > 1 || projected.z < -1) return null;
  return [(projected.x + 1) / 2 * w, (1 - projected.y) / 2 * h, projected.z];
}
function pixelRadius(i, w, h) {
  const d = camera.position.distanceTo(P[i]);
  return R[i] * (h / 2) / (d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
function labels() {
  const w = view.clientWidth, h = view.clientHeight, placed = [], wanted = [];
  for (let i = 0; i < nodes.length; i++) {
    if (!visible(nodes[i])) continue;
    let rank;
    if (i === selected || i === hovered) rank = 1e9;
    else if (selected >= 0) rank = near.has(i) ? 1e6 + R[i] : -1;
    else rank = nodes[i].kind === "page" && !dim(i) ? pixelRadius(i, w, h) : -1;
    if (rank > 2.5) wanted.push([rank, i, false]);
  }
  if (shown.code && selected < 0) packages.forEach((p, k) => { if (p.label.split("/").length <= 2) wanted.push([2.6 + Math.sqrt(p.files) * 0.3, k, true]); });
  wanted.sort((a, b) => b[0] - a[0]);
  const where = (isPackage, i) => {
    let s, r = 0;
    if (isPackage) { projected.set(...packages[i].p).project(camera); if (projected.z > 1) return null; s = [(projected.x + 1) / 2 * w, (1 - projected.y) / 2 * h]; }
    else { s = screenOf(i, w, h); if (!s) return null; r = pixelRadius(i, w, h); }
    return [s[0] + r + 3, s[1]];
  };
  const won = new Set(), t = performance.now();
  ctx2d.font = "12px system-ui, sans-serif";
  for (const [, i, isPackage] of wanted) {
    if (won.size >= 90) break;
    const at = where(isPackage, i); if (!at) continue;
    const [x, y] = at, text = isPackage ? packages[i].label : nodes[i].label;
    if (x < -200 || y < 0 || x > w || y > h) continue;
    const box = [x - 1, y - 8, x + ctx2d.measureText(text).width + 1, y + 8];
    const forced = !isPackage && (i === selected || i === hovered);
    if (!forced && placed.some(b => box[0] < b[2] && b[0] < box[2] && box[1] < b[3] && b[1] < box[3])) continue;
    placed.push(box);
    const key = (isPackage ? "p" : "n") + i;
    won.add(key);
    let entry = shownLabels.get(key);
    if (!entry) {
      const span = document.createElement("span"); span.textContent = text; labelLayer.append(span);
      entry = { span, isPackage, i, off: 0, placed: false }; shownLabels.set(key, entry);
    }
  }
  for (const [key, entry] of shownLabels) {
    const at = where(entry.isPackage, entry.i);
    if (at) { entry.span.style.left = at[0] + "px"; entry.span.style.top = at[1] + "px"; }
    const base = entry.isPackage ? "pkg" : entry.i === selected ? "sel" : "";
    if (won.has(key) && at) {
      entry.off = 0;
      // A new span is placed first and turned on the next frame, so it fades in from 0.
      if (!entry.placed) { entry.placed = true; requestAnimationFrame(() => { dirty = true; }); entry.span.className = base; }
      else entry.span.className = base + " on";
    } else {
      if (!entry.off) entry.off = t;
      entry.span.className = base;
      if (t - entry.off > 320 || !at) { entry.span.remove(); shownLabels.delete(key); }
      else requestAnimationFrame(() => { dirty = true; });
    }
  }
}
const ctx2d = document.createElement("canvas").getContext("2d");

// ---- loop
let dirty = true;
controls.addEventListener("change", () => { dirty = true; });
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return false;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); dirty = true;
  return true;
}
let framed = false;
new ResizeObserver(() => { if (resize() && !framed) { frame(nodes.map((n, i) => i).filter(i => visible(nodes[i])).map(i => P[i]), false); framed = true; } }).observe(view);
function tick(t) {
  requestAnimationFrame(tick);
  if (flight) {
    const f = Math.min(1, (t - flight.t0) / 450), e = f < 0.5 ? 2 * f * f : 1 - (-2 * f + 2) ** 2 / 2;
    controls.target.lerpVectors(flight.fromT, flight.toT, e); camera.position.lerpVectors(flight.fromP, flight.toP, e);
    if (f >= 1) flight = null;
    dirty = true;
  }
  if (controls.update()) dirty = true;
  if (!dirty || !framed) return;
  const dist = camera.position.distanceTo(controls.target);
  scene.fog.near = dist * 0.7; scene.fog.far = dist * 2.4;
  renderer.render(scene, camera);
  labels();
  dirty = false;
}

// ---- picking: nearest node on screen within its drawn radius
function hit(px, py) {
  const w = view.clientWidth, h = view.clientHeight;
  let best = -1, bestZ = Infinity;
  for (let i = 0; i < nodes.length; i++) {
    if (!visible(nodes[i])) continue;
    const s = screenOf(i, w, h); if (!s) continue;
    const r = Math.max(4, pixelRadius(i, w, h) + 2);
    if (Math.hypot(s[0] - px, s[1] - py) <= r && s[2] < bestZ) { best = i; bestZ = s[2]; }
  }
  return best;
}
let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = [e.offsetX, e.offsetY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (down && Math.hypot(e.offsetX - down[0], e.offsetY - down[1]) < 4) select(hit(e.offsetX, e.offsetY), false);
  down = null;
});
renderer.domElement.addEventListener("dblclick", e => {
  const i = hit(e.offsetX, e.offsetY); if (i < 0) return;
  select(i, false);
  frame([i, ...near].filter(j => visible(nodes[j])).map(j => P[j]), true);
});
renderer.domElement.addEventListener("pointermove", e => {
  if (e.buttons) { tip.style.display = "none"; return; }
  const i = hit(e.offsetX, e.offsetY);
  if (i !== hovered) { hovered = i; dirty = true; }
  if (i < 0) { tip.style.display = "none"; return; }
  tip.innerHTML = "<b></b><br><small></small>";
  tip.children[0].textContent = nodes[i].label; tip.children[2].textContent = describe(nodes[i]);
  tip.style.display = "block";
  tip.style.left = Math.min(e.offsetX + 14, view.clientWidth - tip.offsetWidth - 4) + "px";
  tip.style.top = (e.offsetY + 14) + "px";
});
renderer.domElement.addEventListener("pointerleave", () => { tip.style.display = "none"; hovered = -1; dirty = true; });
window.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.activeElement !== search) { select(-1); focusSection = null; legend(); restyle(); }
});
document.getElementById("spin").onchange = e => { controls.autoRotate = e.target.checked; };

function select(i, centre) {
  const changed = i !== selected;
  selected = i; near = new Set();
  if (i >= 0) {
    for (const [j] of out[i]) near.add(j);
    for (const [j] of inc[i]) near.add(j);
    if (!visible(nodes[i])) { shown[layerOf(nodes[i])] = true; syncLayerBoxes(); legend(); }
    if (centre) centreOn(i);
  }
  details(); restyle();
  if (changed) { following = i; ticksSinceFollow = 0; userMoved = userMoved || i >= 0; simulate(i >= 0 ? 0.5 : 0.35); }
}
function syncLayerBoxes() {
  const boxes = document.querySelectorAll("#layers input");
  LAYERS.filter(([k]) => present.has(k)).forEach(([k], i) => boxes[i].checked = shown[k]);
}

// ---- text
const date = t => t ? new Date(t * 1000).toISOString().slice(0, 10) : "—";
function describe(n) {
  if (n.kind === "page") return `${n.index ? "catalogue" : n.system} · ${n.words ?? 0} words · ${n.inLinks ?? 0} in / ${n.outLinks ?? 0} out`;
  if (n.kind === "code") return `${n.system} · ${n.apiSize ?? 0} public symbols`;
  return n.kind;
}
function nodeRow(j, kindsMask) {
  const div = document.createElement("div"), n = nodes[j];
  div.textContent = n.label;
  const k = document.createElement("span"); k.className = "k";
  k.textContent = kinds.filter(x => kindsMask & bit[x]).join(", "); div.append(k);
  div.title = n.id; div.onclick = () => select(j, true);
  return div;
}
function details() {
  const host = document.getElementById("details"); host.innerHTML = "";
  if (selected < 0) return;
  const n = nodes[selected];
  const h = document.createElement("h2"); h.textContent = n.kind === "page" && n.index ? "catalogue page" : n.kind; host.append(h);
  const title = document.createElement("div"); title.style.fontWeight = "600";
  if (n.href) { const a = document.createElement("a"); a.href = n.href; a.textContent = n.label; if (GRAPH.site) a.target = "_top"; title.append(a); } else title.textContent = n.label;
  host.append(title);
  const dl = document.createElement("dl");
  const row = (k, v) => { if (v == null || v === "") return; const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); };
  row("section", n.navPath || n.system); row("words", n.words); row("fences", n.fences);
  row("links in / out", n.kind === "page" && !n.index ? `${n.inLinks ?? 0} / ${n.outLinks ?? 0}` : null);
  row("PageRank", n.pagerank != null ? n.pagerank.toFixed(4) : null);
  row("created", n.created ? date(n.created) : null); row("last edit", n.lastEdit ? date(n.lastEdit) : (n.created ? "never since" : null));
  row("code moved on", n.codeDriftDays != null ? `${Math.round(n.codeDriftDays)} days` : null);
  row("public symbols", n.apiSize); row("lines", n.lines);
  host.append(dl);
  const group = (title, list) => {
    if (!list.length) return;
    const g = document.createElement("h2"); g.textContent = `${title} (${list.length})`; host.append(g);
    const box = document.createElement("div"); box.className = "nbrs";
    list.sort((a, b) => nodes[a[0]].label.localeCompare(nodes[b[0]].label)).slice(0, 300).forEach(([j, m]) => box.append(nodeRow(j, m)));
    host.append(box);
  };
  const split = (list, pred) => list.filter(([j]) => pred(nodes[j]));
  const handWritten = m => m.kind === "page" && !m.index, generated = m => m.kind === "reference" || m.index;
  group("Links to pages", split(out[selected], handWritten));
  group("Linked from", split(inc[selected], handWritten));
  group("Reference and catalogues", split(out[selected].concat(inc[selected]), generated));
  group("Transcripts", split(out[selected].concat(inc[selected]), m => m.kind === "transcript"));
  group("Code", split(out[selected].concat(inc[selected]), m => m.kind === "code"));
}

// ---- search: nodes, and packages (which fly the camera there)
const search = document.getElementById("search"), matches = document.getElementById("matches");
search.addEventListener("input", () => {
  matches.innerHTML = "";
  const q = search.value.trim().toLowerCase(); if (!q) return;
  const found = [];
  for (let i = 0; i < nodes.length && found.length < 30; i++)
    if (nodes[i].label.toLowerCase().includes(q) || nodes[i].id.toLowerCase().includes(q)) found.push(i);
  found.sort((a, b) => (nodes[a].kind !== "page") - (nodes[b].kind !== "page") || R[b] - R[a]);
  for (const i of found) matches.append(nodeRow(i, 0));
  for (const p of packages.filter(p => p.label.toLowerCase().includes(q)).slice(0, 8)) {
    const div = document.createElement("div"); div.textContent = p.label + "/";
    const k = document.createElement("span"); k.className = "k"; k.textContent = `package, ${p.files} files`; div.append(k);
    div.onclick = () => {
      select(-1);
      const prefix = p.id.slice("package:".length) + "/";
      frame(nodes.map((n, i) => i).filter(i => nodes[i].kind === "code" && nodes[i].id.startsWith("code:" + prefix)).map(i => P[i]), true);
      shown.code = true; syncLayerBoxes(); restyle();
    };
    matches.append(div);
  }
});
search.addEventListener("keydown", e => { if (e.key === "Enter" && matches.firstChild) matches.firstChild.click(); });

// ---- start
if (GRAPH.site) { document.title = "Map of the docs"; document.querySelector("aside h1").textContent = "Map of the docs"; }
const pageCount = nodes.filter(n => n.kind === "page" && !n.index).length;
const handLinks = GRAPH.links.filter(([s, t, m]) => (m & bit.links) && nodes[s].kind === "page" && !nodes[s].index && nodes[t].kind === "page" && !nodes[t].index).length;
function summary() {
  document.getElementById("summary").textContent = [`${pageCount} pages, ${handLinks} hand-written links`, GRAPH.generated, backend].filter(Boolean).join(" · ");
}
summary(); legend(); restyle(); resize();
simulate(1);
requestAnimationFrame(tick);
window.GRAPH_VIEW = { select, frame, camera, controls, nodes, P, hit, restyle, simulate, moved, fitVisible, get sim() { return sim; }, get settled() { return settled; }, get selected() { return selected; } };
</script>
</body>
</html>
