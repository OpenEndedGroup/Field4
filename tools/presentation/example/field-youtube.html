<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube</title>
<style>html,body,#player{margin:0;width:100%;height:100%;background:#000}</style></head><body><div id="player"></div><script type="module">
const videoId=new URLSearchParams(location.search).get('id');
if(!/^[A-Za-z0-9_-]{11}$/.test(videoId||'')) throw Error('Invalid YouTube video ID');
const frame=document.createElement('iframe');frame.id='player';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';frame.src=`https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;document.querySelector('#player').replaceWith(frame);
</script></body></html>
