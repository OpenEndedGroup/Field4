<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Field presenter controls</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Iosevka,monospace;padding:20px}h1{font-size:16px;font-weight:500;letter-spacing:.08em;margin:0 0 22px}button,input{font:inherit}button{background:#111;border:1px solid #555;color:#eee;padding:12px 18px;cursor:pointer}button:hover{background:#272727}button:disabled{opacity:.38;cursor:default}button:focus-visible{outline:2px solid white}#status{color:#aaa;margin:16px 0}#slides{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}#slides button.active{background:#eee;color:#050505}[hidden]{display:none!important}.row{display:flex;flex-wrap:wrap;gap:8px}#error{color:#ff8b8b;white-space:pre-wrap}
</style></head><body><h1>FIELD / PRESENT</h1><div id="status">Starting…</div><div class="row"><button id="previous">← Previous</button><button id="next">Next →</button><button id="reload">Reload source</button><button id="show-audience">Show audience</button><button id="fullscreen">Fullscreen audience</button></div><div id="slides"></div><div class="row"><button id="show-guide" disabled>Show Field guide</button><button id="run-macro" disabled>Run cue macro</button><button id="attach-sources">Attach source files to Field</button></div><div id="interactive-guide" class="row" hidden style="margin-top:12px"><button id="start-guide">Start interactive guide</button><button id="guide-previous">← Guide back</button><button id="guide-next">Guide next →</button><button id="stop-guide">Close guide</button></div><p id="error"></p><script type="module" src="/src/field-control.ts"></script></body></html>
