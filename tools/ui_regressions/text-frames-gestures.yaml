name: text_frame_gestures
operations:
  - drive:
      warmCompletion: false
      script: |
        ui.eval("window.setAutoDisplayEditor(false); return true;")
        ui.pause(600)
        ui.eval("document.activeElement?.blur(); return true;")
        ui.clickAt(1040.0, 100.0)
        ui.moveMouse(820.0, 160.0)
        ui.press("Shift+N")
        ui.waitForSelector(".text-frame-rich-block:focus", 10000.0)
        ui.type("Another thread")
        ui.clickSelector(".text-frame-rich-toolbar button[aria-label='Heading 2']")
        ui.clickAt(1100.0, 100.0)
        ui.pause(350)
        ui.eval("""window.__shortcutFrame = [...document.querySelectorAll('.text-frame-box')].find(b => !Object.values(window.__textFrameTest).includes(b.uid)); return true;""")
        check(ui.eval("return !!window.__shortcutFrame;").toString() == "true") { "Shift+N did not make a text frame: " + ui.eval("return JSON.stringify({focus:document.activeElement?.tagName,quickPick:!!window.globalIS,actions:window.allActions.builtin.filter(a=>a.id==='new-text-frame').map(a=>({keys:a.keys,predicate:typeof a.canvasKeybinding})),frames:[...document.querySelectorAll('.text-frame-box')].map(b=>({uid:b.uid,name:b.name}))});") }
        check(ui.eval("return window.__shortcutFrame.contents.startsWith('## Another thread') && !!window.__shortcutFrame.querySelector('.text-frame-preview h2');").toString() == "true") { "Shift+N leaked its triggering character into Markdown" }
        check(ui.eval("return window.__shortcutFrame.querySelector('.text-frame-rich').hidden;").toString() == "true") { "Clicking away did not release visual editing" }
        ui.clickAt(160.0, 170.0)
        ui.clickAt(700.0, 140.0, "Shift")
        ui.pause(150)
        ui.press("g")
        ui.pause(500)
        check(ui.eval("""const source = [...document.querySelectorAll('.text-frame-box')].find(b => b.uid === window.__textFrameTest.source); for(let i=0;i<200;i++){if(source.box_children.includes(window.__shortcutFrame.uid))return true;await new Promise(r=>setTimeout(r,50));}return false;""").toString() == "true") { "Shift selection and g did not connect text frames" }
        ui.moveMouse(700.0, 140.0)
        ui.down("Alt")
        ui.mouseDown()
        ui.waitForSelector(".markingButton:has-text('New text frame below')", 10000.0)
        check(ui.eval("const r = [...document.querySelectorAll('.markingButton')].find(b=>b.textContent==='New text frame below').getBoundingClientRect(); return r.top > 160;").toString() == "true") { "New text frame below is not below the marking origin" }
        check(ui.eval("const r = [...document.querySelectorAll('.markingButton')].find(b=>b.textContent==='Open settings').getBoundingClientRect(); return r.left > 720;").toString() == "true") { "Open settings is not right of the marking origin" }
        ui.hoverSelector(".markingButton:has-text('New text frame below')")
        ui.mouseUp()
        ui.up("Alt")
        ui.waitForSelector(".text-frame-rich-block:focus", 10000.0)
        ui.type("Follow-up")
        ui.press("Escape")
        ui.pause(500)
        check(ui.eval("for(let i=0;i<100;i++){if(window.__shortcutFrame.box_children.length===1)return true;await new Promise(r=>setTimeout(r,50));}return false;").toString() == "true") { "Marking-menu child state: " + ui.eval("return JSON.stringify({source:window.__shortcutFrame.uid,children:window.__shortcutFrame.box_children,frames:[...document.querySelectorAll('.text-frame-box')].map(b=>({uid:b.uid,x:b.data_x,y:b.data_y,children:b.box_children}))});") }
        ui.eval("window.setAutoDisplayEditor(true); return true;")
        ui.clickAt(160.0, 170.0)
        ui.pause(500)
        check(ui.eval("""return window.currentSelectedProperty === 'contents' && getComputedStyle(document.querySelector('.monaco-editor-container')).visibility === 'visible';""").toString() == "true") { "Frame selection did not honor automatic editor opening" }
        ui.eval("""const box = [...document.querySelectorAll('.text-frame-box')].find(b => b.uid === window.__textFrameTest.source); window.globalEditor.getModel().setValue(box.contents + '\n\nA last property-editor keystroke.'); box.querySelector('.text-frame-preview').dispatchEvent(new MouseEvent('dblclick', {bubbles:true,shiftKey:true})); return true;""")
        ui.waitForSelector(".text-frame-editor:focus", 10000.0)
        check(ui.eval("return document.activeElement.value.includes('A last property-editor keystroke.');").toString() == "true") { "Switching surfaces lost an unpolled property-editor edit" }
        ui.pause(500)
        check(ui.eval("return document.activeElement.classList.contains('text-frame-editor');").toString() == "true") { "Monaco stole keyboard focus from canvas writing" }
        ui.type("\n\nThe editor preference is shared with ordinary boxes.")
        ui.press("Escape")
        ui.pause(500)
        check(ui.eval("return document.querySelector('.text-frame-box.selected .text-frame-editor').hidden;").toString() == "true") { "Escape did not release the inline editor with the property editor open" }
        check(ui.eval("""return window.currentSelectedProperty === 'contents' && window.globalEditor.getModel().getValue() === [...document.querySelectorAll('.text-frame-box')].find(b => b.uid === window.__textFrameTest.source).contents;""").toString() == "true") { "Monaco/canvas state: " + ui.eval("""const box = [...document.querySelectorAll('.text-frame-box')].find(b => b.uid === window.__textFrameTest.source); return JSON.stringify({model:window.globalEditor.getModel().getValue(),box:box.contents,inline:box.querySelector('.text-frame-editor').value,selected:window.currentSelectedCode?.map(b=>b.uid),property:window.currentSelectedProperty});""") }
        ui.eval("window.setAutoDisplayEditor(false); return true;")
        ui.clickAt(1100.0, 100.0)
        ui.clickAt(700.0, 320.0)
        ui.pause(250)
  - drive:
      warmCompletion: false
      script: |
        ui.eval("window.__shortcutFrame.dataset.settingsTarget='true'; return true;")
        ui.hoverSelector("[data-settings-target='true'] .text-frame-preview")
        ui.down("Alt")
        ui.mouseDown()
        ui.waitForSelector(".markingButton:has-text('Open settings')", 10000.0)
        ui.hoverSelector(".markingButton:has-text('Open settings')")
        ui.mouseUp()
        ui.up("Alt")
        ui.pause(600)
        check(ui.eval("return window.currentSelectedProperty==='textFrame' && window.globalEditor.getModel().getLanguageId()==='yaml' && getComputedStyle(document.querySelector('.monaco-editor-container')).visibility==='visible';").toString() == "true") { "Marking-menu settings did not force open the YAML property editor" }
        check(ui.eval("return window.fieldAutoDisplayEditor===false && window.globalEditor.getModel().getValue().includes('connectionBorderLength: 100') && window.globalEditor.getModel().getValue().includes('reflow: true');").toString() == "true") { "Settings did not populate defaults, or changed the editor preference" }
        ui.eval("""window.globalEditor.getModel().setValue('# My reading settings\nfontSize: 21\nsizing: fixed\nextraNote: \"notes: #1\"\n'); return true;""")
        ui.pause(700)
        check(ui.eval("return getComputedStyle(window.__shortcutFrame.querySelector('.text-frame-preview')).fontSize==='21px';").toString() == "true") { "Editing YAML in Monaco did not update the reader" }
        ui.eval("window.openTextFrameSettings(window.__shortcutFrame.uid); return true;")
        ui.pause(400)
        check(ui.eval("return window.globalEditor.getModel().getValue().startsWith('# My reading settings') && window.globalEditor.getModel().getValue().includes('extraNote:') && window.globalEditor.getModel().getValue().includes('fontWeight: 400');").toString() == "true") { "Settings lost comments or unknown YAML keys when filling defaults" }
        ui.eval("""window.globalEditor.getModel().setValue('fontSize: ['); return true;""")
        ui.pause(500)
        check(ui.eval("return window.globalMonaco.editor.getModelMarkers({owner:'text-frame-settings'}).length > 0 && getComputedStyle(window.__shortcutFrame.querySelector('.text-frame-preview')).fontSize==='21px';").toString() == "true") { "Invalid YAML did not retain the reader and report an editor diagnostic" }
        ui.eval("""window.globalEditor.getModel().setValue('fontSize: 18\nsizing: grow\n'); return true;""")
        ui.pause(600)
        ui.clickAt(1100.0, 830.0)
        ui.pause(300)
