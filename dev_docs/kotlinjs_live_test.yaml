# KotlinJS live test — drop-in operation transcript.
#
# Run it with the field MCP:  field_run_transcript(yaml=<this file's contents>)
# or the backdoor:            macro run kotlinjs-live  (after writing it as a macro)
#
# To SEE output you need a connected "head". Open ONE of these in a browser first:
#   http://localhost:19092/extensions/remote_ar/index.html      (plain HTTP automation port = devport+10000)
#   https://localhost:9092/extensions/remote_ar/index.html      (accept the self-signed cert)
# The head's console (and each box's output) shows what the compiled Kotlin logs.
#
# What this proves: a box under a mainLanguage=kotlinjs root has its Kotlin compiled to JS
# in-process (PLAIN_DCE, ~5KB, tree-shaken) and shipped to the head — native operator
# overloading (no ASTA), real types, kotlin.math + collections, compile errors at the source line.
#
# Box code needs NO `fun main()` wrapper: top-level statements are auto-wrapped, and
# import/package/@file:/external declarations are hoisted to file scope automatically.

operations:
  # 1. A root box that makes its children "Kotlin -> head".
  - create:
      box: kjs_root
      name: kotlin head
      frame: {x: 60, y: 60, w: 200, h: 110}
      properties:
        mainLanguage: kotlinjs
        isKotlinJsRoot: true

  # 2. Vectors via native operator overloading — the thing ASTA fakes for raw JS.
  - create:
      box: kjs_vec
      name: vectors
      frame: {x: 60, y: 200, w: 360, h: 220}
      properties:
        code: |
          // No `fun main()` needed — top-level statements are auto-wrapped.
          external val console: dynamic
          data class V(val x: Double, val y: Double) {
              operator fun plus(o: V) = V(x + o.x, y + o.y)
              operator fun times(k: Double) = V(x * k, y * k)
          }
          val a = V(1.0, 2.0) + V(10.0, 20.0)   // real operator+, compiled to JS
          val b = a * 0.5
          console.log("vectors: a=" + a + " b=" + b)

  # 3. stdlib (kotlin.math + collections + sequences) surviving DCE.
  - create:
      box: kjs_math
      name: ring
      frame: {x: 60, y: 450, w: 360, h: 260}
      properties:
        code: |
          external val console: dynamic
          data class P(val x: Double, val y: Double) {
              operator fun plus(o: P) = P(x + o.x, y + o.y)
              fun len() = kotlin.math.sqrt(x * x + y * y)
          }
          fun ring(n: Int, r: Double): List<P> = (0 until n).map { i ->
              val a = 2.0 * kotlin.math.PI * i / n
              P(kotlin.math.cos(a) * r, kotlin.math.sin(a) * r)
          }
          val pts = ring(32, 10.0)
          val centroid = pts.reduce { u, v -> u + v }
          val perimeter = pts.zipWithNext { u, v -> (u + P(-v.x, -v.y)).len() }.sum()
          console.log("ring: n=" + pts.size + " sum=(" + centroid.x + "," + centroid.y + ") perimeter=" + perimeter)

  # 4. Parent the Kotlin boxes under the kotlinjs root, let the runtime toggle settle, then run.
  - connect: {parent: kjs_root, child: kjs_vec}
  - connect: {parent: kjs_root, child: kjs_math}
  # Runtime assignment (Kotlin -> KotlinJsExecution) happens on the topology watcher's
  # next tick (a ~5ms poll on the runloop), so settle a couple of frames before running or
  # the box races and compiles as JVM Kotlin ("Modifier 'external' is not applicable to
  # 'property'"). NB: the key is `frames` — `numberOfRunloopFrames` is silently ignored.
  - wait: {frames: 2}
  - await: {wait: pending}
  - execute: {box: kjs_vec, property: code}
  - execute: {box: kjs_math, property: code}
  - await: {wait: pending}
