        void main() {
            vec4 c = sampleOffset(0.0) * 0.2270270270;
            c += (sampleOffset(1.3846153846) + sampleOffset(-1.3846153846)) * 0.3162162162;
            c += (sampleOffset(3.2307692308) + sampleOffset(-3.2307692308)) * 0.0702702703;
            outColor = c * pc.tapStep.w;
        }
