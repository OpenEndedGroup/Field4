            float bY=aaLuma(b);
            vec3 edge=(bY<low||bY>high)?a:b;
            float averageY=(nY+sY+eY+wY)*0.25;
            float subpixel=clamp((abs(averageY-mY)/max(contrast,1e-6)-0.25)/0.75,0.0,1.0);
