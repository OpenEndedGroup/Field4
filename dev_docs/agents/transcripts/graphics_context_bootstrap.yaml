name: graphics_context_bootstrap
description: Bootstrap a launched renderer parent and a child graphics smoke box from a blank canvas.
operations:
  - create:
      box: agent_graphics_context
      name: renderer
      frame:
        x: 60.0
        y: 60.0
        w: 180.0
        h: 95.0
      properties:
        code: |
          import afield.four.util.Options

          prop<Window>(window)
          prop<Renderer>(renderer)

          Options.enableHDR = false
          Options.profiling = false

          once.renderer {
              window = Window("Field")
              Renderer(window)
          }

          println("agent graphics renderer ready")
          start(renderer::run)
  - launch:
      box: agent_graphics_context
      property: code
      type: code
      strand: renderer
      code: |
        import afield.four.util.Options

        prop<Window>(window)
        prop<Renderer>(renderer)

        Options.enableHDR = false
        Options.profiling = false

        once.renderer {
            window = Window("Field")
            Renderer(window)
        }

        println("agent graphics renderer ready")
        start(renderer::run)
  - wait:
      frames: 3
  - create:
      box: agent_graphics_smoke
      name: Agent Graphics Smoke
      frame:
        x: 320.0
        y: 60.0
        w: 260.0
        h: 120.0
      properties:
        code: |
          println("renderer inherited: ${renderer::class.simpleName}")
  - connect:
      parent: agent_graphics_context
      child: agent_graphics_smoke
  - execute:
      box: agent_graphics_smoke
      property: code
      type: fragment
      code: |
        println("renderer inherited: ${renderer::class.simpleName}")
  - wait:
      millis: 500
