name: polytope_layer_stack_path_trace
description: Real NVIDIA path-traced documentation figure.
docs:
  - page: chain_ceres_manifold_contours.md
    why: "Walks through the contour-stack chain this render belongs to."
operations:
- create:
    box: chain_renderer
    name: path tracing renderer
    frame:
      x: 40.0
      y: 40.0
      w: 220.0
      h: 60.0
    properties:
      code: |
        import afield.graphics.vulkan.util.Options

        prop<Window>(window)
        prop<Renderer>(renderer)
        Options.enableHDR = false
        once.renderer {
            window = Window("Field · polytope_layer_stack_path_trace")
            Renderer(window)
        }
        start(renderer::run)
- create:
    box: layer_stack_trace
    name: polytope_layer_stack_path_trace
    frame:
      x: 320.0
      y: 140.0
      w: 300.0
      h: 70.0
    properties:
      code: |
        import afield.geometry.solid.manifold.*
        import afield.graphics.scene.fabricated.*
        import afield.graphics.vulkan.util.Camera
        import java.io.File

        prop<PathTracingRenderer>(tracer)
        require(ManifoldLibrary.isAvailable) { ManifoldLibrary.describe() }
        val scene = PathTraceScene()
        Solid.scope {
            val mesh =
                conway("gC").polyhedron.canonicalize().polyhedron.triangulate(normals = NormalPolicy.Flat).mesh.weld(1e-6)
            val original = mesh.toSolid()
            val scaled = original.scaled(1.0 / Math.cbrt(original.volume))
            val bounds = scaled.bounds
            val solid = scaled.translated(-bounds.center.x.toDouble(), -bounds.center.y.toDouble(), -bounds.min.z.toDouble())
            val height = solid.bounds.max.z.toDouble()
            val count = 48
            val dz = height / count
            repeat(count) { i ->
                val t = i.toFloat() / (count - 1)
                val material =
                    scene.material(PathTraceMaterial.plastic(0.08f + 0.8f * t, 0.65f - 0.4f * t, 0.8f - 0.72f * t, 0.32f))
                val slab =
                    solid
                        .slice(dz * (i + 0.5))
                        .use { it.extruded(dz * 0.92) }
                        .translated(0.0, 0.0, dz * i)
                        .rotated(-90.0, 0.0, 0.0)
                scene.importTriMesh(slab.toTriMesh(normals = true, minSharpAngle = 20.0), material)
            }
            println("48 canonical gC layers, source volume ${solid.volume}")
        }
        val floor = scene.material(PathTraceMaterial.plastic(0.55f, 0.56f, 0.58f, 0.55f))
        scene.quad(
            Vector3f(-6f, -0.03f, -6f),
            Vector3f(6f, -0.03f, -6f),
            Vector3f(6f, -0.03f, 6f),
            Vector3f(-6f, -0.03f, 6f),
            floor,
        )
        val environment =
            PathTraceEnvironment.fromFile(File("public/docs/assets/fabricate_demo/venice_sunset_1k.exr").absolutePath)
        val camera = Camera(renderer).also {
            it.at.set(2.45f, 2.8f, 3.6f)
            it.target.set(0f, 0.45f, 0f)
            it.p.fov = 0.52
        }
        tracer = PathTracingRenderer(renderer, scene, environment, 1000, 614, camera).install()
        tracer.samplesPerFrame = 4
        tracer.maxBounces = 8
        tracer.exposure = 1.35f
        tracer.environmentRotation = 2.1f
        tracer.indirectClamp = 10f
        tracer.blitToScreen()
        println("${tracer.backend}: ${tracer.triangleCount} triangles")
        frames {
            while (tracer.samples < 900) {
                frame()
            }
            println("layer_stack_trace study converged: ${tracer.samples} samples")
        }
- connect:
    parent: chain_renderer
    child: layer_stack_trace
- launch:
    box: chain_renderer
    property: code
    strand: renderer
- await:
    wait: pending
- wait:
    frames: 3
- launch:
    box: layer_stack_trace
    property: code
- await:
    wait: pending
