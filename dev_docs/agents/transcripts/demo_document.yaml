name: demo_document
description: >
  The demo document: one canvas that shows off most of what Field does, built from a blank document
  by this transcript. A palette box pushes a value down connections to three children, one of which
  holds two nested boxes; a three.js gyroid and an editable FLine flower sit in output panels; a
  Vulkan renderer streams a turning spiral into a box's output panel and runs a compute shader whose
  values a Field probe plots; a keyframe curve plays with its playhead running; a box shows inline
  editor visualizers; a time slider stands ready to be scrubbed across a row of cue boxes; and a
  notation box draws on the Excalidraw drawing layer over all of it.

  Three jobs. It exercises the operation-transcript system end to end (create, connect, nested
  connect, execute, launch, await). `tools/feel_bench.py`'s `demo-document` scenario times it in a
  fresh document. And `public/docs/demo_document.md` replays it in Field's Electron app and films a
  drive across it, which is the video behind the docs home page.

  Needs Vulkan for the renderer, the spiral view and the probe. The spiral's frames only reach a
  page in Field's Electron app; a plain browser shows a message in that panel instead.
operations:
  # ---------------------------------------------------------------- the graph: connected and nested
  - create:
      box: demo_palette
      name: palette
      frame: { x: 40.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // Everything connected beneath this box sees `petals`, and reruns when it changes.
          propDown<Int>(petals) = 7
          markdown("Pushing **" + petals + " petals** down to every box connected beneath this one.")
          displayOpen("main")
  - create:
      box: demo_swatch
      name: swatch
      frame: { x: 40.0, y: 330.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          markdown("A flower with " + petals + " petals: " + "✿".repeat(petals))
          displayOpen("main")
  - create:
      box: demo_rosette
      name: rosette
      frame: { x: 640.0, y: 330.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // The same `petals`, drawn as FLines.
          val rings =
              (0 until petals).map { i ->
                  val a = i * 2 * PI / petals
                  fline {
                      color = vec(0.35 + 0.6 * i / petals, 0.7, 1.0 - 0.5 * i / petals, 0.8)
                      thickness = 1.5
                      moveTo(vec(0.0, 0.0, 0.0))
                      cubicTo(
                          vec(120 * cos(a - 0.5), 120 * sin(a - 0.5), 0.0),
                          vec(160 * cos(a + 0.5), 160 * sin(a + 0.5), 0.0),
                          vec(0.0, 0.0, 0.0),
                      )
                  }
              }
          lines(rings, w = 300.0, h = 300.0, fitToSize = true)
  - create:
      box: demo_sketch
      name: sketch
      frame: { x: 40.0, y: 760.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // Two helpers are nested inside this box: open its "nested" panel to see them.
          markdown("sketch holds " + nested.size + " nested helpers, and " + petals + " petals from above")
          displayOpen("main")
          displayOpen("nested")
  - create:
      box: demo_leaf
      name: leaf
      frame: { x: 20.0, y: 20.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          println("a nested leaf, " + petals + " petals above it")
  - create:
      box: demo_bud
      name: bud
      frame: { x: 20.0, y: 110.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          println("a nested bud")
  - connect: { parent: demo_palette, child: demo_swatch }
  - connect: { parent: demo_palette, child: demo_rosette }
  - connect: { parent: demo_palette, child: demo_sketch }
  - connect: { parent: demo_sketch, child: demo_leaf, nested: true }
  - connect: { parent: demo_sketch, child: demo_bud, nested: true }

  # ---------------------------------------------------------------- 3D and editable 2D in outputs
  - create:
      box: demo_gyroid
      name: gyroid
      frame: { x: 1300.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // A marched gyroid and its open rims, as one three.js scene in the output panel.
          val surface = marchingCubes(sdfGyroid(4.0, 0.3), boundsAround(radius = 1.0), 56)
          val rims =
              surface.toFLines(MeshLines.BOUNDARY).map { ring ->
                  ring.color = vec(1.0, 0.45, 0.12, 1.0)
                  ring.thickness = 2.6
                  ring
              }
          three(channel = "gyroid", height = 420, width = 640) {
              mesh(surface, wireframe = false)
              lines(rims)
              camera(yaw = 32.0, pitch = 20.0, padding = 1.02)
          }
  - create:
      box: demo_flower
      name: editable flower
      frame: { x: 1300.0, y: 760.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // Click a point and drag it: the edit changes these FLines.
          val petal = fline {
              moveTo(0, -120)
              cubicTo(90, -100, 140, -20, 0, 120)
              cubicTo(-140, -20, -90, -100, 0, -120)
              close()
              filled = true
              stroked = true
              thickness = 1.0
              color = vec(0.95, 0.42, 0.6, 0.34)
          }
          val stem = fline {
              moveTo(0, 120)
              cubicTo(10, 180, -20, 230, 0, 300)
              thickness = 1.0
              color = vec(0.45, 0.95, 0.62, 1.0)
          }
          lines(petal, stem, w = 420.0, h = 420.0, fitToSize = true, editable = true)
          displayOpen("lines")

  # ---------------------------------------------------------------- Vulkan: streamed view and a probe
  - create:
      box: demo_renderer
      name: renderer
      frame: { x: 2300.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          import afield.graphics.vulkan.util.Options

          prop<Window>(window)
          prop<Renderer>(renderer)
          Options.enableHDR = false
          Options.profiling = false
          once.renderer {
              window = Window("Field demo document")
              Renderer(window)
          }
          println("renderer ready")
          start(renderer::run)
  - create:
      box: demo_spiral
      name: streamed spiral
      frame: { x: 2300.0, y: 240.0, w: 300.0, h: 100.0 }
      properties:
        vertex: |
          #version 450
          layout (location = 0) in vec3 pos;
          layout (location = 1) in vec2 tc;

          layout (location = 1) out vec2 ftc;

          void main()
          {
              gl_Position = vec4(pos, 1);
              ftc = tc;
          }
        fragment: |
          #version 450
          layout(location = 0) out vec4 uFragColor;
          layout(location = 1) in vec2 ftc;

          layout(push_constant) uniform constants {
              float time;
          } pc;

          void main()
          {
              vec2 p = ftc * 2.0 - 1.0;
              float r = length(p);
              float rings = 0.5 + 0.5 * sin(24.0 * r - 3.0 * pc.time + 5.0 * atan(p.y, p.x));
              vec3 col = mix(vec3(0.05, 0.10, 0.30), vec3(1.0, 0.65, 0.25), rings);
              uFragColor = vec4(col, 1.0);
          }
        code: |
          import afield.media.stream.ElectronRTTView

          // Drawn by Vulkan, streamed into this box's output panel.
          val view = ElectronRTTView(640, 360)
          val started = AnimationClock.nowSeconds()

          view += "content" to moduleHere {
              +view
              +Mesh("square") {
                  set(4, 2) {
                      pos.add(-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, 1, 0)
                      tc.add(0, 0, 1, 0, 1, 1, 0, 1)
                      tri.add(0, 1, 2)
                      tri.add(0, 2, 3)
                  }
                  time = { AnimationClock.nowSeconds() - started }
              }
          }

          display("main", view.html())
          displayOpen("main")
  - create:
      box: demo_particles
      name: probed particles
      frame: { x: 3300.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        compute: |
          #version 450
          #extension GL_EXT_buffer_reference : require
          layout(local_size_x = 64) in;
          layout(std430, buffer_reference) buffer inData {
              vec4 a[];
          };
          layout(std430, buffer_reference) buffer outData {
              vec4 a[];
          };
          layout(push_constant) uniform dat {
              inData inData;
              outData outData;
              float something;
              uint particleCount;
          } pc;
          {% property "fieldProbe" %}
          void main() {
              uint idx = gl_GlobalInvocationID.x;
              if (idx >= pc.particleCount) return;
              vec4 seed = pc.inData.a[idx];
              float phaseZ = pc.something * seed.z;
              float phaseW = pc.something * seed.w;
              vec2 moved = vec2(
              seed.x * cos(phaseZ) + seed.y * sin(phaseW),
              -seed.x * sin(phaseW) + seed.y * cos(phaseZ * 0.03)
              );
              pc.outData.a[idx] = vec4(moved, seed.zw);
              fieldProbe(length(moved - seed.xy));
          }
        code: |
          // A compute shader moves 100,000 particles; the probe plots how far each one moved.
          var module = computeModuleHere {}
          var m = ComputeMesh()
          module += "step" to m
          renderer += "compute" to module
          val N = 100000
          var inData = defaultBuffer { size = N.vec4s }.buffer
          var outData = defaultBuffer { size = N.vec4s }.buffer
          m.inData = { inData }
          m.outData = { outData }
          m.particleCount = { N }
          m.something = { (AnimationClock.nowSeconds() * 0.6).f }
          fieldProbeHere(samples = 100000).display("probe")
          displayOpen("probe")
          prop<FrameBufferGroup>(outputPositions) = outData
          m.x = (N + 63) / 64
          m.y = 1
          m.z = 1
          val seeded = kotlin.random.Random(0x4f1e1d)
          inData.write {
              for (i in 0 until N) {
                  put(vec(seeded.nextDouble(), seeded.nextDouble(), seeded.nextDouble(), seeded.nextDouble()))
              }
          }
          println("compute launched, N=" + N)
  - create:
      box: demo_draw
      name: draw particles
      frame: { x: 3300.0, y: 680.0, w: 300.0, h: 100.0 }
      properties:
        vertex: |
          #version 450
          #extension GL_EXT_buffer_reference : require
          layout(std430, buffer_reference) buffer inData {
              vec4 pos[];
          };
          layout(location = 0) out vec2 tc;
          layout(push_constant) uniform push {
              inData inData;
              float aspectRatio;
          } pc;
          const vec3[6] part = vec3[6](vec3(0,0,0),vec3(1,0,0),vec3(1,1,0),vec3(0,0,0),vec3(1,1,0),vec3(0,1,0));
          void main() {
              float scale = 1.0 * pc.inData.pos[gl_VertexIndex/6].w;
              vec3 p = (part[gl_VertexIndex%6]-vec3(0.5,0.5,0))*scale;
              p.xy += pc.inData.pos[gl_VertexIndex/6].xy*10.0;
              p.xy *= vec2(1/pc.aspectRatio, 1);
              gl_Position = vec4(p*0.04, 1);
              tc = part[gl_VertexIndex%6].xy;
          }
        fragment: |
          #version 450
          layout(location = 0) out vec4 uFragColor;
          layout(location = 0) in vec2 tc;
          void main() {
              float d = max(0.0, 0.5-length(tc-vec2(0.5)));
              float w = fwidth(d);
              d = smoothstep(0.1, 0.1+w, d)*smoothstep(0.14+w, 0.14, d);
              uFragColor = vec4(1.0, 0.8, 0.4, d*0.2);
              if (d<0.01) discard;
          }
        code: |
          // Draws the particles the compute box publishes as `outputPositions`, in the renderer's window.
          var module = moduleHere { primitiveType = triangles }
          var m = Mesh()
          module += "mesh" to m
          renderer += "draw" to module
          val N = 100000
          m.inData = { outputPositions }
          m.aspectRatio = { window.width / window.height.toFloat() }
          m.set(N * 2 * 3, 0) {}
          println("draw launched")
  - connect: { parent: demo_renderer, child: demo_spiral }
  - connect: { parent: demo_renderer, child: demo_particles }
  - connect: { parent: demo_particles, child: demo_draw }

  # ---------------------------------------------------------------- time: keyframes and visualizers
  - create:
      box: demo_brightness
      name: brightness
      frame: { x: 2300.0, y: 860.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // A keyframe curve with its playhead running, and a meter it drives.
          val brightness = keyframes(name = "brightness", defaults = [vec(0.0, 0.1), vec(1.0, 0.9), vec(2.5, 0.4), vec(4.0, 0.1)])

          lateinit var level: MeterHandle
          controlGroup("level") { level = meter("brightness") }
          displayOpen("level")

          val start = System.nanoTime()
          loop {
              val t = ((System.nanoTime() - start) / 1e9) % 4.0
              brightness.setTime(t)
              level.set(brightness.evaluateValueAt(t))
          }
  - create:
      box: demo_metrics
      name: metrics
      frame: { x: 3300.0, y: 860.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // Open this box's editor, then launch it: the three calls draw beside their own lines.
          var tick = 0.0
          var visualizerFrame = 0

          println("inline metrics ready")

          loop {
              tick += 0.4
              visualizerFrame += 1

              if (visualizerFrame % 2 == 0) {
                  val value = sin(tick * 0.22) * 0.7 + cos(tick * 0.11) * 0.2 + tick * 0.01

                  __m("histogram").histogram(value, dur = 120)
                  __m("trail").history(value, dur = 48)
                  __m("summary").stats(value, dur = 48)
              }
              frame()
          }

  # ---------------------------------------------------------------- a timeline to scrub
  - create:
      box: demo_timeline
      name: t
      frame: { x: 4300.0, y: -80.0, w: 40.0, h: 1400.0 }
      properties:
        code: |
          // A time slider: drag it sideways and it starts each box it enters and stops each box it leaves.
          rootProp<Box>(execution) = thisBox

          fun launchFrom(was: Double, now: Double) {
              val all = root.children - thisBox
              val a = all.filter { it.frame.intersects(was) }
              val b = all.filter { it.frame.intersects(was, now) }
              val c = all.filter { it.frame.intersects(now) }

              val incoming = c - a
              val outgoing = a - c
              val onlyOne = b - (a + c)

              incoming.forEach(Box::begin)
              outgoing.forEach(Box::end)
              onlyOne.forEach {
                  inMain {
                      it.begin()
                      yield()
                      it.end()
                  }
              }
          }

          onViewportChange +=
              "lock_x" to
                  { inside, a, b ->
                      frame = frame.copy(y = -b.y - 100, h = b.h * 2 - 50, w = 40.0)
                  }

          onFrameChange +=
              "lock_x" to
                  { inside, a, b ->
                      launchFrom(a.x, b.x)
                      b.copy(y = -inside.viewport.y - 100, w = 40.0)
                  }

          frame = frame.copy(w = 40.0)

          customization =
              """
              this.style.border = "0px solid transparent"
              this.style.borderLeft = "3px solid red"
              this.style.background = "transparent"
              this.style.marginTop = "0px"
              this.style.paddingTop = "0px"
              this.style.setProperty("--box-border", "0")
              this.style.fontStyle = "italic"
              this.style.color = "white"
              this.lock_w = true
              this.lock_h = true
          """
  - create:
      box: demo_cue_1
      name: cue 1
      frame: { x: 4420.0, y: 80.0, w: 260.0, h: 100.0 }
      properties:
        code: |
          // Runs while the time slider is over it.
          display("main", "<div style='width:300px;height:26px;border-radius:4px;background:linear-gradient(90deg,#1971c2,#4dabf7)'></div>")
          displayOpen("main")
          loop { }
  - create:
      box: demo_cue_2
      name: cue 2
      frame: { x: 4640.0, y: 300.0, w: 260.0, h: 100.0 }
      properties:
        code: |
          // Runs while the time slider is over it.
          display("main", "<div style='width:300px;height:26px;border-radius:4px;background:linear-gradient(90deg,#2f9e44,#8ce99a)'></div>")
          displayOpen("main")
          loop { }
  - create:
      box: demo_cue_3
      name: cue 3
      frame: { x: 4860.0, y: 520.0, w: 260.0, h: 100.0 }
      properties:
        code: |
          // Runs while the time slider is over it.
          display("main", "<div style='width:300px;height:26px;border-radius:4px;background:linear-gradient(90deg,#e8590c,#ffc078)'></div>")
          displayOpen("main")
          loop { }
  - create:
      box: demo_cue_4
      name: cue 4
      frame: { x: 5080.0, y: 740.0, w: 260.0, h: 100.0 }
      properties:
        code: |
          // Runs while the time slider is over it.
          display("main", "<div style='width:300px;height:26px;border-radius:4px;background:linear-gradient(90deg,#ae3ec9,#e599f7)'></div>")
          displayOpen("main")
          loop { }

  # ---------------------------------------------------------------- the drawing layer
  - create:
      box: demo_notes
      name: notes
      frame: { x: 1300.0, y: 1500.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // Marks on the drawing layer (alt/option-D), owned by this box and redrawn when it reruns.
          fun boxNamed(n: String) = inside.boxes.values.first { it.name == n }
          notation {
              stroke = "#1971c2"
              ellipse(10, 10, 360, 160)
              text("one value, pushed down", 40, -30)
              arrow(from = boxNamed("palette"), to = boxNamed("gyroid"), label = "and beside it, 3D")
              stroke = "#e8590c"
              rect(2270, 10, 740, 700, label = "Vulkan, streamed into the page")
              arrow(from = boxNamed("probed particles"), to = boxNamed("streamed spiral"), label = "probed")
              stroke = "#2f9e44"
              rect(4380, 40, 1000, 860, label = "a timeline to scrub")
              stroke((0..80).map { k -> vec(1300 + k * 12.0, 1440 + 30 * sin(k / 5.0)) }, stroke = "#2f9e44")
          }
          markdown("marks", "" + notation.mine.size + " marks drawn on the drawing layer")

  # ---------------------------------------------------------------- run it
  - execute: { box: demo_palette }
  - execute: { box: demo_swatch }
  - execute: { box: demo_rosette }
  - execute: { box: demo_sketch }
  - execute: { box: demo_gyroid }
  - execute: { box: demo_flower }
  - launch: { box: demo_renderer, property: code, strand: renderer }
  - await: { wait: pending }
  - launch: { box: demo_spiral }
  - launch: { box: demo_particles }
  - await: { wait: pending }
  - launch: { box: demo_draw }
  - launch: { box: demo_brightness }
  - launch: { box: demo_metrics }
  - execute: { box: demo_timeline }
  - execute: { box: demo_notes }
  - await: { wait: pending }
