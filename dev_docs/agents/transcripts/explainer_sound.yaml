  - create:
      box: es_beats
      name: beats
      frame: { x: 700.0, y: 300.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          // Two sine tones a few hertz apart. Hold one key, then both: the sum swells and fades as the two
          // drift in and out of step. The picture is one second of what you hear; each column spans the
          // wave's highest and lowest points in a 640th of a second, so the outline is the loudness.
          var difference = 3.0
          val held = BooleanArray(2)
          val gates = 2 { Gate() }
          val second = Param(223f)

          fun draw() {
              val f = [220.0, 220.0 + difference]
              val columns = (0 until 640).map { x ->
                  val values = (0 until 24).map { k ->
                      val t = (x + k / 24.0) / 640
                      (0..1).sumOf { i -> if (held[i]) sin(2 * PI * f[i] * t) else 0.0 }
                  }
                  fline {
                      moveTo(x.toDouble(), 120 - 50 * values.max())
                      lineTo(x.toDouble(), 120 - 50 * values.min() + 0.5)
                      thickness = 1.0
                      color = vec(0.4, 0.9, 1.0, 1.0)
                  }
              }
              val axis = fline { moveTo(0.0, 120.0); lineTo(640.0, 120.0); thickness = 1.0; color = vec(1.0, 1.0, 1.0, 0.35) }
              lines([axis] + columns, channel = "sum", w = 640.0, h = 240.0)
          }

          draw()
          controlGroup {
              keys("220 Hz", "220 Hz + difference", letters = "we") { key, down ->
                  held[key] = down
                  if (down) gates[key].open() else gates[key].close()
                  draw()
              }
              slider("difference", 0.5, 20.0, step = 0.1, initialValue = 3.0) {
                  difference = it
                  second.base = (220 + it).toFloat()
                  draw()
              }
          }

          val tones = listOf(SineOsc(Param(220f)), SineOsc(second))
          audio(2 { i -> tones[i] * adsr(0.01, 0.05, 1.0, 0.25, gates[i]) }.reduce { a, b -> a + b } / 2.0, gain = 0.15f)
  - create:
      box: es_square_partials
      name: square_partials
      frame: { x: 900.0, y: 300.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          // Sines at 1, 3, 5, 7… times a base frequency, each 1/n as tall, add up to a square wave. "sines" is
          // how many are in the sum; the faint line is the square they are approaching.
          var count = 1
          var on = false
          val level = Param(0f)
          val weights = 50 { Param(0f) }

          fun partial(i: Int) = 2 * i + 1                      // 1, 3, 5, …
          fun sum(t: Double) = (0 until count).sumOf { i -> 4 / PI / partial(i) * sin(2 * PI * partial(i) * t) }
          fun square(t: Double) = if (t - floor(t) < 0.5) 1.0 else -1.0

          fun update() {
              weights.forEachIndexed { i, w -> w.base = if (i < count) (4 / PI / partial(i)).toFloat() else 0f }
              level.base = if (on) 0.12f else 0f
              // Two cycles across the figure.
              fun wave(f: (Double) -> Double, c: Vec4, width: Double) = fline {
                  moveTo(0.0, 130 - 90 * f(0.0))
                  for (x in 1..640) lineTo(x.toDouble(), 130 - 90 * f(2.0 * x / 640))
                  thickness = width
                  color = c
              }
              lines(wave(::square, vec(1.0, 1.0, 1.0, 0.35), 1.5), wave(::sum, vec(0.4, 0.9, 1.0, 1.0), 2.0), channel = "wave", w = 640.0, h = 260.0)
          }

          update()
          controlGroup {
              slider("sines", 1.0, 50.0, step = 1.0, initialValue = 1.0) { count = it.toInt(); update() }
              checkbox("sound") { on = it; update() }
          }

          // One oscillator per odd multiple of 110 Hz, each at the weight the sum gives it.
          audio(50 { i -> SineOsc(Param(110f * partial(i))) * weights[i] }.reduce { a, b -> a + b } / 1.25, gain = level)
  - create:
      box: es_microphone
      name: microphone
      frame: { x: 300.0, y: 380.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          // What the microphone hears, taken apart into sines. Tick "listen"; each bar is how much of one
          // frequency, 20 Hz wide, is in the last tenth of a second, from 0 to 2,500 Hz. A whistle stands up
          // as one bar; a sung vowel as a row of bars at whole multiples of the note. Nothing is played back.
          var listening = false
          val mic = audioIn.scope(4096)

          fun bars(amps: List<Double>) {
              // Scaled to the loudest bar, but never so far that room noise fills the picture.
              val top = amps.maxOrNull()?.coerceAtLeast(2e-3) ?: 2e-3
              val shapes = amps.mapIndexed { i, a ->
                  val h = 200 * (a / top).coerceIn(0.0, 1.0)
                  fline { rect(i * 5.0, 220 - h, 4.0, h.coerceAtLeast(0.5)); filled = true; stroked = false; color = vec(0.4, 0.9, 1.0, 1.0) }
              }
              // A tick every 500 Hz along the bottom.
              val ticks = fline { (0..5).forEach { k -> moveTo(k * 125.0, 224.0); lineTo(k * 125.0, 234.0) }; thickness = 1.0; color = vec(1.0, 1.0, 1.0, 0.35) }
              val frame = fline { rect(0.0, 0.0, 640.0, 240.0); thickness = 1.0; color = vec(1.0, 1.0, 1.0, 0.08) }
              lines([frame, ticks] + shapes, channel = "spectrum", w = 640.0, h = 240.0)
          }

          bars(List(128) { 0.0 })
          controlGroup {
              checkbox("listen") { listening = it }
          }

          loop {
              if (listening) {
                  val snap = mic.snapshot()
                  val x = snap.left
                  val n = x.size
                  if (n > 0) {
                      // A Hann window, then the strength of each 20 Hz step: a slow Fourier transform, 128 bins.
                      val windowed = DoubleArray(n) { x[it] * (0.5 - 0.5 * cos(2 * PI * it / n)) }
                      bars(List(128) { b ->
                          val f = (b + 0.5) * 20.0 / snap.sampleRate
                          var re = 0.0
                          var im = 0.0
                          for (i in 0 until n) { re += windowed[i] * cos(2 * PI * f * i); im -= windowed[i] * sin(2 * PI * f * i) }
                          sqrt(re * re + im * im) / n
                      })
                  }
              }
              delay(60)
          } + audio(mic, gain = 0f)
  - create:
      box: es_normal_modes
      name: normal_modes
      frame: { x: 500.0, y: 380.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          // Masses on a line of springs between two walls. Each "mode" slider sets how much of one normal
          // mode is in the motion; a system has as many modes as masses, so sliders past that do nothing.
          var masses = 1
          val amount = DoubleArray(5).also { it[0] = 0.8 }
          var time = 0.0

          // Mode k of n masses: mass j moves as sin(k π j / (n + 1)), at a frequency that rises with k.
          fun shape(k: Int, j: Int) = sin(k * PI * j / (masses + 1))
          fun rate(k: Int) = 2 * sin(k * PI / (2 * (masses + 1)))

          fun spring(x0: Double, y0: Double, x1: Double, y1: Double) = fline {
              moveTo(x0, y0)
              for (i in 1..11) {
                  val t = i / 12.0
                  val side = if (i % 2 == 0) 8.0 else -8.0
                  lineTo(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t + side)
              }
              lineTo(x1, y1)
              thickness = 1.5
              color = vec(1.0, 1.0, 1.0, 0.55)
          }

          fun draw() {
              val xs = (0..masses + 1).map { 20.0 + 600.0 * it / (masses + 1) }
              val ys = (0..masses + 1).map { j ->
                  if (j == 0 || j == masses + 1) 140.0
                  else 140 - 90 * (1..masses).sumOf { k -> amount[k - 1] * shape(k, j) * cos(2 * PI * 0.6 * rate(k) * time) }
              }
              val walls = fline { moveTo(20.0, 40.0); lineTo(20.0, 240.0); moveTo(620.0, 40.0); lineTo(620.0, 240.0); thickness = 3.0; color = vec(1.0, 1.0, 1.0, 0.35) }
              val springs = (0..masses).map { spring(xs[it], ys[it], xs[it + 1], ys[it + 1]) }
              val balls = (1..masses).map { j -> fline { circle(xs[j], ys[j], 14.0); filled = true; stroked = false; color = vec(1.0, 0.6, 0.2, 1.0) } }
              lines([walls] + springs + balls, channel = "springs", w = 640.0, h = 280.0)
          }

          draw()
          controlGroup {
              slider("masses", 1.0, 5.0, step = 1.0, initialValue = 1.0) { masses = it.toInt() }
              5 { k -> slider("mode ${k + 1}", 0.0, 1.0, step = 0.01, initialValue = if (k == 0) 0.8 else 0.0) { amount[k] = it } }
          }

          var clock = AnimationClock.nowSeconds()
          loop {
              val now = AnimationClock.nowSeconds()
              time += now - clock
              clock = now
              draw()
          }
  - create:
      box: es_pluck
      name: pluck
      frame: { x: 700.0, y: 380.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          // A string held at both ends. "pluck" pulls it aside at "pluck at" and lets go; what follows is a sum
          // of its modes, each a whole number of half waves, ringing at whole multiples of the lowest
          // frequency and dying away, the high ones faster. "mode" shows one mode alone (0 shows the pluck).
          // "length" stops the string short, as a finger on a fret does; "thickness" makes it heavier.
          val n = 30
          var at = 0.25
          var length = 1.0
          var gauge = 1.0
          var mode = 0
          var plucked = -1.0         // when the pluck happened, in seconds since launch
          var time = 0.0

          fun weight(k: Int) = 2 / (k * k * PI * PI * at * (1 - at)) * sin(k * PI * at)   // a triangle pulled to height 1
          fun decay(k: Int) = 2.5 / k.toDouble().pow(0.7)
          fun base() = 110 / length / gauge

          // The sound: one sine per mode, its loudness set by the pluck and its own decay.
          var audioPluck = -1f       // audio time of the latest pluck; NaN asks the audio thread to stamp it
          val partials = (1..n).map { k ->
              SineOsc(Param { (k * base()).toFloat() }) * Param {
                  if (audioPluck.isNaN()) audioPluck = time
                  if (audioPluck < 0) 0f else (weight(k) * exp(-(time - audioPluck) / decay(k))).toFloat()
              }
          }

          fun draw() {
              val end = 20 + 600 * length
              val since = time - plucked
              // Shown slowed down: the lowest mode takes two seconds a swing.
              fun y(x: Double): Double = when {
                  mode > 0 -> sin(mode * PI * x) * cos(PI * mode * time)
                  plucked < 0 -> 0.0
                  else -> (1..n).sumOf { k -> weight(k) * sin(k * PI * x) * cos(PI * k * since) * exp(-since / decay(k)) }
              }
              val string = fline {
                  moveTo(20.0, 140.0)
                  for (i in 1..300) lineTo(20 + (end - 20) * i / 300, 140 - 90 * y(i / 300.0))
                  thickness = 1.0 + gauge * 1.5
                  color = vec(0.4, 0.9, 1.0, 1.0)
              }
              val rest = fline { moveTo(end, 140.0); lineTo(620.0, 140.0); thickness = 1.0; color = vec(1.0, 1.0, 1.0, 0.35) }
              val pegs = fline { circle(20.0, 140.0, 5.0); circle(end, 140.0, 5.0); filled = true; stroked = false; color = vec(1.0, 0.6, 0.2, 1.0) }
              val mark = fline { moveTo(20 + (end - 20) * at, 210.0); lineTo(20 + (end - 20) * at, 230.0); thickness = 2.0; color = vec(1.0, 0.6, 0.2, 1.0) }
              lines(rest, string, pegs, mark, channel = "string", w = 640.0, h = 260.0)
          }

          draw()
          controlGroup {
              keys("pluck", letters = "p") { _, down ->
                  if (down) { plucked = time; mode = 0; audioPluck = Float.NaN }
              }
              slider("pluck at", 0.05, 0.5, step = 0.01, initialValue = 0.25) { at = it }
              slider("mode", 0.0, 6.0, step = 1.0, initialValue = 0.0) { mode = it.toInt() }
              slider("length", 0.5, 1.0, step = 0.01, initialValue = 1.0) { length = it }
              slider("thickness", 1.0, 2.0, step = 0.01, initialValue = 1.0) { gauge = it }
          }

          val start = AnimationClock.nowSeconds()
          loop {
              time = AnimationClock.nowSeconds() - start
              draw()
          } + audio(partials.reduce { a, b -> a + b }, gain = 0.15f)
  - create:
      box: es_pulsing_sphere
      name: pulsing_sphere
      frame: { x: 900.0, y: 380.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          import afield.media.image.util.PngEncoder

          // A sphere swelling and shrinking, seen in cross-section: red is pressure above the usual, blue below.
          // The picture is four metres across, and the bar at the bottom is one metre. Time runs slowed down,
          // half a cycle a second whatever the frequency, so only the spacing of the rings changes with it.
          val imageW = 640
          val imageH = 300
          val px = IntArray(imageW * imageH)
          var hz = 343.0
          var phase = 0.0

          fun frame() {
              val wavelength = 160 * 343 / hz          // pixels: 160 to the metre
              val cx = 160.0
              val cy = 150.0
              val r0 = 18 + 4 * sin(2 * PI * phase)
              for (j in 0 until imageH) for (i in 0 until imageW) {
                  val r = sqrt((i - cx) * (i - cx) + (j - cy) * (j - cy))
                  px[j * imageW + i] = if (r < r0) 0xff9aa4ad.toInt() else {
                      // The swing falls with distance; in a flat picture of a sphere, as one over the distance.
                      val p = (60 / r).coerceAtMost(1.0) * sin(2 * PI * ((r - r0) / wavelength - phase))
                      val red = (255 * p.coerceAtLeast(0.0)).toInt()
                      val blue = (255 * (-p).coerceAtLeast(0.0)).toInt()
                      (0xff shl 24) or (red shl 16) or (((red + blue) / 4) shl 8) or blue
                  }
              }
              for (j in 284..287) for (i in 20..180) px[j * imageW + i] = -1
              display("field", PngEncoder.encode(px, imageW, imageH))
          }

          frame()
          controlGroup {
              slider("frequency", 86.0, 1372.0, step = 1.0, initialValue = 343.0, law = ControlLaw.LOGARITHMIC) { hz = it }
          }

          var clock = AnimationClock.nowSeconds()
          loop {
              val now = AnimationClock.nowSeconds()
              phase += 0.5 * (now - clock)
              clock = now
              frame()
          }
  - create:
      box: es_speaker_ear
      name: speaker_ear
      frame: { x: 300.0, y: 460.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          // A speaker on the left sends out a click every half second, and the rings are the clicks
          // spreading at the speed of sound, shown 1/30 as fast. Move "listener" to place the ear: the
          // meters say how late the sound arrives and how much quieter it is than one metre away.
          val metre = 64.0               // pixels per metre; the picture is ten metres across
          var ear = Vector2f(3f, 0f)     // metres from the speaker
          var time = 0.0
          lateinit var delay: MeterHandle
          lateinit var level: MeterHandle

          // A circle, kept to the part inside the picture so the drawing keeps its size.
          fun ring(cx: Double, cy: Double, r: Double) = fline {
              var drawing = false
              for (i in 0..360) {
                  val a = 2 * PI * i / 360
                  val x = cx + r * cos(a)
                  val y = cy + r * sin(a)
                  val inside = x in 0.0..640.0 && y in 0.0..300.0
                  if (inside && drawing) lineTo(x, y) else if (inside) moveTo(x, y)
                  drawing = inside
              }
          }

          fun draw() {
              val sx = 40.0
              val sy = 150.0
              val ex = sx + metre * ear.x
              val ey = sy - metre * ear.y
              // A ring for each click still in the picture; it has travelled 343 m/s × age, slowed 30 times.
              val rings = (0 until 8).mapNotNull { i ->
                  val age = (time % 0.5) + 0.5 * i
                  val radius = metre * 343 / 30 * age
                  if (radius > 720) null else ring(sx, sy, radius).apply {
                      thickness = 2.0
                      color = vec(0.4, 0.9, 1.0, (4.0 / (4 + radius / metre)).coerceIn(0.2, 1.0))
                  }
              }
              val speaker = fline { rect(sx - 14, sy - 18, 14.0, 36.0); filled = true; stroked = false; color = vec(1.0, 1.0, 1.0, 0.8) }
              val listener = fline { circle(ex, ey, 9.0); filled = true; stroked = false; color = vec(1.0, 0.6, 0.2, 1.0) }
              val path = fline { moveTo(sx, sy); lineTo(ex, ey); thickness = 1.0; color = vec(1.0, 1.0, 1.0, 0.35) }
              val scale = fline { moveTo(20.0, 285.0); lineTo(20 + metre, 285.0); thickness = 3.0; color = vec(1.0, 1.0, 1.0, 0.8) }
              // A faint frame, so the picture keeps its full size however few rings are in it.
              val frame = fline { rect(0.0, 0.0, 640.0, 300.0); thickness = 1.0; color = vec(1.0, 1.0, 1.0, 0.08) }
              lines([frame] + rings + path + speaker + listener + scale, channel = "room", w = 640.0, h = 300.0)
          }

          fun measure() {
              val d = ear.length().toDouble().coerceAtLeast(0.1)
              delay.set(1000 * d / 343)
              level.set(-20 * log10(d))
          }

          draw()
          controlGroup {
              vec2Control("listener", Vector2f(3f, 0f), xRange = 0.5 to 9.5, yRange = -2.0 to 2.0) { ear = Vector2f(it); measure() }
              delay = meter("delay, milliseconds", 0.0, 30.0, initialValue = 1000 * 3.0 / 343)
              level = meter("level, dB from 1 m", -20.0, 6.0, initialValue = -20 * log10(3.0))
          }
          measure()

          var clock = AnimationClock.nowSeconds()
          loop {
              val now = AnimationClock.nowSeconds()
              time += now - clock
              clock = now
              draw()
          }
  - create:
      box: es_decibels
      name: decibels
      frame: { x: 500.0, y: 460.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          // Sound pressure level: 20 × log10 of the pressure swing over 20 micropascals, the quietest a
          // young ear hears at 1 kHz. Drag "pressure" (a logarithmic slider, in pascals) and read the level.
          fun level(pa: Double) = 20 * log10(pa / 20e-6)

          fun show(pa: Double) {
              val db = level(pa)
              val marks = listOf(0.0 to "hearing just begins", 60.0 to "talking, a metre away", 120.0 to "it starts to hurt")
              // Each mark hangs below the bar on its own row, so the labels never run into each other.
              val ticks = marks.mapIndexed { i, (d, label) ->
                  val anchor = if (d > 100) "transform:translateX(-100%);border-right" else "border-left"
                  "<div style='position:absolute;left:${d / 140 * 100}%;top:${66 + 26 * i}px;$anchor:1px solid #fff6;padding:0 6px;font-size:15px;color:#fffa;white-space:nowrap'>${d.toInt()} dB: $label</div>"
              }.joinToString("")
              display("level", """
                  <div style='width:640px;height:150px;position:relative;font-family:var(--field-font, monospace);color:#e6f6ff'>
                    <div style='font-size:34px'>${"%.3g".format(pa)} Pa &rarr; ${"%.1f".format(db)} dB</div>
                    <div style='position:absolute;left:0;right:0;top:56px;height:6px;background:#fff2'></div>
                    <div style='position:absolute;left:0;top:56px;height:6px;width:${(db / 140 * 100).coerceIn(0.0, 100.0)}%;background:#66e6ff'></div>
                    $ticks
                  </div>
              """.trimIndent())
          }

          show(0.02)
          controlGroup {
              slider("pressure", 0.00002, 200.0, step = 0.00001, initialValue = 0.02, law = ControlLaw.LOGARITHMIC) { show(it) }
          }
  - create:
      box: es_doppler
      name: doppler
      frame: { x: 700.0, y: 460.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          // A source moving left to right past a listener (orange), sending out rings that spread at the
          // speed of sound. Time is slowed thirty times. Ahead of the source the rings crowd together, behind
          // it they spread out. With "sound" on you hear a 440 Hz tone at the pitch the listener receives.
          val metre = 64.0
          val c = 343.0
          var speed = 150.0          // metres per second
          var on = false
          var time = 0.0
          val emitted = mutableListOf<Pair<Double, Double>>()   // (time, x in metres) of each ring
          var x = 0.0
          var nextRing = 0.0
          val pitch = Param(440f)
          val level = Param(0f)
          val listener = Pair(6.0, -2.5)  // metres: right of centre, below the path

          fun ring(cx: Double, cy: Double, r: Double) = fline {
              var drawing = false
              for (i in 0..240) {
                  val a = 2 * PI * i / 240
                  val px = cx + r * cos(a)
                  val py = cy + r * sin(a)
                  val inside = px in 0.0..640.0 && py in 0.0..300.0
                  if (inside && drawing) lineTo(px, py) else if (inside) moveTo(px, py)
                  drawing = inside
              }
          }

          fun step(dt: Double) {
              time += dt
              x += speed / 30 * dt
              if (x > 10.5) { x = -0.5; emitted.clear(); nextRing = time }
              // A ring every 0.08 s of picture time, placed where the source was when it left.
              while (nextRing <= time) {
                  emitted += nextRing to x - speed / 30 * (time - nextRing)
                  nextRing += 0.08
              }
              emitted.removeAll { (t0, _) -> c / 30 * (time - t0) * metre > 800 }
              // The pitch heard now, from the source's motion towards the listener.
              val dx = listener.first - x
              val dy = listener.second
              val towards = speed * dx / sqrt(dx * dx + dy * dy)
              pitch.base = (440 * c / (c - towards.coerceAtMost(0.95 * c))).toFloat()
              level.base = if (on) 0.15f else 0f
          }

          fun draw() {
              val y = 130.0
              val rings = emitted.map { (t0, x0) -> ring(metre * x0, y, c / 30 * (time - t0) * metre).apply { thickness = 1.5; color = vec(0.4, 0.9, 1.0, 0.8) } }
              val source = fline { circle(metre * x, y, 8.0); filled = true; stroked = false; color = vec(1.0, 1.0, 1.0, 0.9) }
              val ear = fline { circle(metre * listener.first, y - metre * listener.second, 9.0); filled = true; stroked = false; color = vec(1.0, 0.6, 0.2, 1.0) }
              val frame = fline { rect(0.0, 0.0, 640.0, 300.0); thickness = 1.0; color = vec(1.0, 1.0, 1.0, 0.08) }
              lines([frame] + rings + source + ear, channel = "street", w = 640.0, h = 300.0)
          }

          draw()
          controlGroup {
              slider("speed", 0.0, 300.0, step = 1.0, initialValue = 150.0) { speed = it }
              checkbox("sound") { on = it }
          }

          var clock = AnimationClock.nowSeconds()
          loop {
              val now = AnimationClock.nowSeconds()
              step(now - clock)
              clock = now
              draw()
          } + audio(SineOsc(pitch), gain = level)
  - create:
      box: es_two_speakers
      name: two_speakers
      frame: { x: 900.0, y: 460.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          import afield.media.image.util.PngEncoder

          // Two speakers on the left play the same tone. Bright is loud, dark is quiet: where the two waves
          // arrive in step they add, where one's push meets the other's pull they cancel. The picture is ten
          // metres across. "listener" places the ear; with "sound" on you hear the tone at its loudness there.
          val imageW = 640
          val imageH = 300
          val metre = 64.0
          val px = IntArray(imageW * imageH)
          var hz = 343.0
          var ear = Vector2f(5f, 0.6f)        // metres, from the midpoint between the speakers
          var on = false
          val pitch = Param(343f)
          val level = Param(0f)
          val speakers = listOf(0.3 to -0.9, 0.3 to 0.9)    // metres

          // How big the pressure swing is at (x, y): the two waves added with their phases.
          fun loudness(x: Double, y: Double): Double {
              val k = 2 * PI * hz / 343
              var re = 0.0
              var im = 0.0
              speakers.forEach { (sx, sy) ->
                  val r = sqrt((x - sx) * (x - sx) + (y - sy) * (y - sy)).coerceAtLeast(0.1)
                  re += cos(k * r) / sqrt(r)
                  im += sin(k * r) / sqrt(r)
              }
              return sqrt(re * re + im * im)
          }

          fun update() {
              for (j in 0 until imageH) for (i in 0 until imageW) {
                  val a = (loudness(i / metre, (150 - j) / metre) / 1.6).coerceIn(0.0, 1.0)
                  val g = (255 * a).toInt()
                  px[j * imageW + i] = (0xff shl 24) or ((g * 0.4).toInt() shl 16) or ((g * 0.9).toInt() shl 8) or g
              }
              speakers.forEach { (sx, sy) ->
                  for (j in -10..10) for (i in -4..4) px[(150 - (sy * metre).toInt() + j) * imageW + (sx * metre).toInt() + i] = -1
              }
              val ex = (ear.x * metre).toInt()
              val ey = (150 - ear.y * metre).toInt()
              for (j in -7..7) for (i in -7..7) if (i * i + j * j <= 49 && ex + i in 0 until imageW && ey + j in 0 until imageH) px[(ey + j) * imageW + ex + i] = 0xffff9933.toInt()
              display("field", PngEncoder.encode(px, imageW, imageH))
              pitch.base = hz.toFloat()
              level.base = if (on) (0.15 * (loudness(ear.x.toDouble(), ear.y.toDouble()) / 1.6).coerceAtMost(1.0)).toFloat() else 0f
          }

          update()
          controlGroup {
              vec2Control("listener", Vector2f(5f, 0.6f), xRange = 1.0 to 9.5, yRange = -2.2 to 2.2) { ear = Vector2f(it); update() }
              slider("frequency", 100.0, 1000.0, step = 1.0, initialValue = 343.0, law = ControlLaw.LOGARITHMIC) { hz = it; update() }
              checkbox("sound") { on = it; update() }
          }

          audio(SineOsc(pitch), gain = level)
  - create:
      box: es_echo
      name: echo
      frame: { x: 300.0, y: 540.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          // You clap, standing "distance to the wall" metres from a wall. The pulse travels there and back at
          // 343 m/s, shown at its real speed. Below, a timeline: the clap at 0, its echo when it returns; the
          // shaded part is the first 50 ms, inside which the ear hears the two as one sound.
          var distance = 20.0
          var clapped = -10.0
          var time = 0.0
          val gate = Gate()
          val lag = Param(2 * 20f / 343)
          val echoLevel = Param(0.15f)

          fun echoGain(d: Double) = (0.6 * 4 / (2 * d)).coerceAtMost(0.6)

          fun draw() {
              val metre = 600 / 60.0                        // sixty metres across
              val wall = 20 + metre * distance
              val travelled = 343 * (time - clapped)        // metres the pulse has gone
              val out = travelled <= distance
              val front = if (out) 20 + metre * travelled else wall - metre * (travelled - distance)
              val pulse = if (travelled > 2 * distance) null else fline {
                  moveTo(front, 40.0); lineTo(front, 160.0)
                  thickness = 3.0
                  color = if (out) vec(0.4, 0.9, 1.0, 1.0) else vec(1.0, 0.6, 0.2, 1.0)
              }
              val wallLine = fline { rect(wall, 30.0, 8.0, 140.0); filled = true; stroked = false; color = vec(1.0, 1.0, 1.0, 0.7) }
              val you = fline { circle(20.0, 100.0, 8.0); filled = true; stroked = false; color = vec(1.0, 1.0, 1.0, 0.9) }
              // The timeline: 0 to 400 ms across the figure.
              val ms = 600 / 400.0
              val returns = 1000 * 2 * distance / 343
              val merged = fline { rect(20.0, 205.0, 50 * ms, 50.0); filled = true; stroked = false; color = vec(1.0, 1.0, 1.0, 0.12) }
              val axis = fline { moveTo(20.0, 255.0); lineTo(620.0, 255.0); thickness = 1.0; color = vec(1.0, 1.0, 1.0, 0.35) }
              val clap = fline { moveTo(20.0, 255.0); lineTo(20.0, 210.0); thickness = 3.0; color = vec(0.4, 0.9, 1.0, 1.0) }
              val echo = fline {
                  moveTo(20 + ms * returns.coerceAtMost(400.0), 255.0)
                  lineTo(20 + ms * returns.coerceAtMost(400.0), 255 - 45 * (echoGain(distance) / 0.6).coerceAtLeast(0.3))
                  thickness = 3.0
                  color = vec(1.0, 0.6, 0.2, 1.0)
              }
              val frame = fline { rect(0.0, 0.0, 640.0, 280.0); thickness = 1.0; color = vec(1.0, 1.0, 1.0, 0.08) }
              lines(listOfNotNull(frame, wallLine, you, pulse, merged, axis, clap, echo), channel = "wall", w = 640.0, h = 280.0)
          }

          draw()
          controlGroup {
              keys("clap", letters = "c") { _, down ->
                  if (down) { clapped = time; gate.open() } else gate.close()
              }
              slider("distance to the wall", 2.0, 60.0, step = 0.5, initialValue = 20.0) {
                  distance = it
                  lag.base = (2 * it / 343).toFloat()
                  echoLevel.base = echoGain(it).toFloat()
              }
          }

          val start = AnimationClock.nowSeconds()
          // A clap is a short burst of noise; its echo is the same burst, later and quieter.
          val burst = WhiteNoise() * perc(0.06, 0.001, gate)
          loop {
              time = AnimationClock.nowSeconds() - start
              draw()
          } + audio(burst + burst / Delay(lag, Param(0f), Param(1f), maxDelaySec = 1f) * echoLevel, gain = 0.15f)
  - create:
      box: es_reverb
      name: reverb
      frame: { x: 500.0, y: 540.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          // A room seen from above, and when its echoes reach the listener (orange) after a sound from the
          // source (white): each tick is one path off the walls, its height how much of the sound is left.
          // A bigger room spaces them out and stretches the tail; softer walls make each bounce lose more.
          // The keys play short notes through a reverberator set from the same two sliders.
          var size = 0.4
          var soft = 0.3
          val gates = 3 { Gate() }
          val roomSize = Param(0.6f)
          val damping = Param(0.4f)

          fun draw() {
              val w = 4 + 16 * size                  // metres
              val h = 0.6 * w
              val reflect = 1 - 0.6 * soft
              val sx = 0.3 * w
              val sy = 0.45 * h
              val lx = 0.7 * w
              val ly = 0.55 * h
              // Mirror the room in its walls again and again: each mirrored source is one bouncing path.
              val direct = sqrt((sx - lx) * (sx - lx) + (sy - ly) * (sy - ly))
              val ticks = mutableListOf<FLine>()
              for (i in -12..12) for (j in -12..12) {
                  val ix = i * w + if (i % 2 == 0) sx else w - sx
                  val iy = j * h + if (j % 2 == 0) sy else h - sy
                  val d = sqrt((ix - lx) * (ix - lx) + (iy - ly) * (iy - ly))
                  val t = d / 343
                  if (t > 0.6) continue
                  // What is left of the sound, against the direct path; drawn as a square root so the tail shows.
                  val a = reflect.pow(abs(i) + abs(j)) * direct / d
                  ticks += fline { moveTo(20 + 1000 * t, 270.0); lineTo(20 + 1000 * t, 270 - 100 * sqrt(a)); thickness = 1.5; color = vec(0.4, 0.9, 1.0, 1.0) }
              }
              val scale = 7.0                        // the plan: pixels per metre
              val plan = fline { rect(20.0, 10.0, scale * w, scale * h); thickness = 2.0; color = vec(1.0, 1.0, 1.0, 0.35 + 0.5 * (1 - soft)) }
              val source = fline { circle(20 + scale * sx, 10 + scale * sy, 4.0); filled = true; stroked = false; color = vec(1.0, 1.0, 1.0, 0.9) }
              val ear = fline { circle(20 + scale * lx, 10 + scale * ly, 4.0); filled = true; stroked = false; color = vec(1.0, 0.6, 0.2, 1.0) }
              val axis = fline { moveTo(20.0, 270.0); lineTo(620.0, 270.0); thickness = 1.0; color = vec(1.0, 1.0, 1.0, 0.35) }
              val frame = fline { rect(0.0, 0.0, 640.0, 280.0); thickness = 1.0; color = vec(1.0, 1.0, 1.0, 0.08) }
              lines([frame, plan, source, ear, axis] + ticks, channel = "room", w = 640.0, h = 280.0)
              roomSize.base = (0.5 + 0.48 * size).toFloat()
              damping.base = (0.2 + 0.7 * soft).toFloat()
          }

          draw()
          controlGroup {
              keys("low", "middle", "high", letters = "wer") { key, down -> if (down) gates[key].open() else gates[key].close() }
              slider("room size", 0.0, 1.0, step = 0.01, initialValue = 0.4) { size = it; draw() }
              slider("soft walls", 0.0, 1.0, step = 0.01, initialValue = 0.3) { soft = it; draw() }
          }

          val notes = [196f, 247f, 294f].mapIndexed { i, hz -> SawOsc(Param(hz)) / lpf(1800) * perc(0.25, 0.005, gates[i]) }
          audio(notes.reduce { a, b -> a + b } / 2.0 / FreeVerb(roomSize, damping, Param(0.45f)), gain = 0.15f)
  - create:
      box: es_deck
      name: deck
      frame: { x: 60.0, y: 140.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          import kotlinx.html.*

          // The talk. Each figure is a box of the same name in this document; the deck starts a figure
          // when its slide comes up and stops it when the talk moves on. Nothing sounds until someone
          // holds a key or ticks "sound".

          presentation(title = "Sound") {
                  section("Sound") {
                      step("Sound", id = "opening") {
                          audience {
                              +"""
                              # Sound

                              Everything we hear is air pressing on our ears a little harder, then a little
                              softer, many times a second.

                              This talk builds that idea up from molecules: how air carries a push, how a
                              repeated push becomes a note, how notes combine, how strings make them, and how
                              sound spreads through a room.
                          """
                                  .md
                              p(classes = "muted") {
                                  +"After “Sound” by Bartosz Ciechanowski, ciechanow.ski/sound. Words and figures made in Field."
                              }
                          }
                          markdownNote("Every figure in this talk is a live box. Sound starts only when someone holds a key or ticks **sound**. [[next]]")
                      }
                      step("Three keys", id = "keyboard") {
                          audience {
                              figureBeside("keyboard") {
                                  +"""
                                  ## Three keys

                                  Hold a key to hear it. Each one moves the air in a different
                                  repeating pattern, drawn above the keys.

                                  By the end of the talk we will know why the three sound different,
                                  even when they play the same note.
                              """
                                      .md
                              }
                          }
                          markdownNote("Hold a key with the mouse, or click the figure and use W, E and R. [[back]] [[next]]")
                      }
                  }
                  section("Air") {
                      step("Air is a crowd", id = "air-crowd") {
                          audience {
                              figureBeside("pressure_box") {
                                  +"""
                                  ## Air is a crowd

                                  Air is molecules, mostly nitrogen and oxygen, flying in straight lines
                                  at around 500 metres a second until they hit something.

                                  The figure is a flat cartoon of a few hundred of them. The real thing
                                  has about 25 billion billion in every cubic centimetre.
                              """
                                      .md
                              }
                          }
                          control("pressure_box", "length", 1.0)
                          control("pressure_box", "follow one", false)
                          markdownNote("Drag **speed** to slow time down. [[back]] [[next]]")
                      }
                      step("Pressure is hits on a wall", id = "air-pressure") {
                          audience {
                              figureBeside("pressure_box") {
                                  +"""
                                  ## Pressure is hits on a wall

                                  Every molecule that bounces off a wall gives it a tiny push. The
                                  walls flash where they are hit.

                                  Pressure is the total push per area of wall: how often molecules
                                  arrive, and how hard. The plot counts the hits.
                              """
                                      .md
                              }
                          }
                          control("pressure_box", "length", 1.0)
                          control("pressure_box", "follow one", false)
                          markdownNote("The plot is hits per unit of wall per unit of time. [[back]] [[next]]")
                      }
                      step("Squeeze it", id = "air-squeeze") {
                          audience {
                              figureBeside("pressure_box") {
                                  +"""
                                  ## Squeeze it

                                  Make the box shorter and the same molecules cross it more often,
                                  so each piece of wall is hit more often.

                                  Half the length, twice the hits: the pressure doubles.
                              """
                                      .md
                              }
                          }
                          control("pressure_box", "length", 1.0)
                          control("pressure_box", "follow one", false)
                          cue("Halve the box") { control("pressure_box", "length", 0.5, glideMs = 2000) }
                          markdownNote("Next squeezes the box to half its length over two seconds. [[back]] [[next]]")
                      }
                      step("Nobody goes far", id = "air-one-molecule") {
                          audience {
                              figureBeside("pressure_box") {
                                  +"""
                                  ## Nobody goes far

                                  Follow one molecule. It is knocked off course again and again, and
                                  after many collisions it has hardly left home.

                                  So when air carries a push, it is not the molecules that travel. The
                                  push is handed from neighbour to neighbour.
                              """
                                      .md
                              }
                          }
                          control("pressure_box", "length", 1.0)
                          control("pressure_box", "follow one", true)
                          markdownNote("The orange trail is one molecule's path. [[back]] [[next]]")
                      }
                      step("A plate in a tube", id = "air-tube") {
                          audience {
                              figureBeside("tube_plate") {
                                  +"""
                                  ## A plate in a tube

                                  Fill a tube with air and put a plate at one end. Each line is a thin
                                  slice of air.

                                  Push the plate and the nearest slices crowd together. They push on
                                  the next ones, and the crowding runs down the tube, while each slice
                                  only shuffles a little way and back.
                              """
                                      .md
                              }
                          }
                          control("tube_plate", "plate", 0.0)
                          control("tube_plate", "colour", false)
                          cue("Push") { control("tube_plate", "plate", 12.0, glideMs = 300) }
                          markdownNote("Next pushes the plate; or drag **plate** quickly one way, then back. [[back]] [[next]]")
                      }
                      step("Squeezed and stretched", id = "air-compression") {
                          audience {
                              figureBeside("tube_plate") {
                                  +"""
                                  ## Squeezed and stretched

                                  Red slices are squeezed, above the usual pressure; blue ones are
                                  stretched, below it.

                                  Pulling the plate back sends a stretch down the tube just as pushing
                                  sends a squeeze. Either way, the disturbance moves at the speed of
                                  sound: about 343 metres a second in room-temperature air.
                              """
                                      .md
                              }
                          }
                          control("tube_plate", "plate", 0.0)
                          control("tube_plate", "colour", true)
                          cue("Push") { control("tube_plate", "plate", 12.0, glideMs = 300) }
                          cue("Pull back") { control("tube_plate", "plate", -12.0, glideMs = 600) }
                          markdownNote("Colour is pressure: red above, blue below. Next pushes the plate, then Next pulls it back. [[back]] [[next]]")
                      }
                  }
                  section("Making sounds") {
                      step("A jump is a pop", id = "sounds-pop") {
                          audience {
                              figureBeside("repeated_jumps") {
                                  +"""
                                  ## A jump is a pop

                                  Hold **jump** and the plate leaps forward; let go and it leaps back.
                                  Each leap sends one squeeze or one stretch towards your ear, and you
                                  hear a pop.

                                  A bigger leap is a bigger pressure change, and a louder pop.
                              """
                                      .md
                              }
                          }
                          control("repeated_jumps", "repeat", false)
                          control("repeated_jumps", "distance", 0.5)
                          control("repeated_jumps", "rate", 4.0)
                          control("repeated_jumps", "sound", false)
                          markdownNote("Tick **sound**, then hold **jump**; drag **distance** to change how far it moves. [[back]] [[next]]")
                      }
                      step("Repeat it and it becomes a note", id = "sounds-repeat") {
                          audience {
                              figureBeside("repeated_jumps") {
                                  +"""
                                  ## Repeat it and it becomes a note

                                  Make the plate jump back and forth by itself. A few times a second
                                  we hear separate pops. Past about twenty a second they blur into one
                                  buzzing tone.

                                  The faster it repeats, the higher the tone. How many times it repeats
                                  each second is its frequency, in hertz.
                              """
                                      .md
                              }
                          }
                          control("repeated_jumps", "rate", 4.0)
                          control("repeated_jumps", "repeat", false)
                          control("repeated_jumps", "sound", false)
                          cue("Repeat") { control("repeated_jumps", "repeat", true) }
                          cue("Faster") { control("repeated_jumps", "rate", 220.0, glideMs = 4000) }
                          markdownNote("Tick **sound** to hear it. Next starts the repeats at 4 per second, then Next glides to 220. [[back]] [[next]]")
                      }
                      step("Sounds add", id = "sounds-add") {
                          audience {
                              figureBeside("wave_synth") {
                                  +"""
                                  ## Sounds add

                                  Each key moves the plate in its own repeating pattern, plotted beside
                                  it. Hold two at once and the plate makes both motions at the same
                                  time: the two patterns add.

                                  The bottom line is the sum, which is what reaches your ear.
                              """
                                      .md
                              }
                          }
                          markdownNote("Hold one key, then two. [[back]] [[next]]")
                      }
                      step("One key, two sounds", id = "sounds-sum-key") {
                          audience {
                              figureBeside("wave_synth") {
                                  +"""
                                  ## One key, two sounds

                                  The last key plays a single pattern: the sum of the first two, worked
                                  out in advance.

                                  It sounds the same as holding both. The ear cannot tell two sources
                                  from one that makes the same motion.
                              """
                                      .md
                              }
                          }
                          markdownNote("Hold the first two keys together, then the fourth alone. [[back]] [[next]]")
                      }
                      step("Three numbers for a shape", id = "sounds-triangle") {
                          audience {
                              figureBeside("triangle_params") {
                                  +"""
                                  ## Three numbers for a repeating shape

                                  Take one shape, a triangle, and repeat it. Three numbers say how:

                                  - **amplitude**: how far it swings, which we hear as loudness;
                                  - **frequency**: how often it repeats, which we hear as pitch;
                                  - **phase**: where in its cycle it starts, which on its own we cannot hear.
                              """
                                      .md
                              }
                          }
                          control("triangle_params", "amplitude", 0.6)
                          control("triangle_params", "frequency", 220.0)
                          control("triangle_params", "phase", 0.0)
                          control("triangle_params", "sound", false)
                          cue("Louder") { control("triangle_params", "amplitude", 1.0, glideMs = 1500) }
                          cue("Higher") { control("triangle_params", "frequency", 440.0, glideMs = 1500) }
                          cue("Shift") { control("triangle_params", "phase", 0.5, glideMs = 1500) }
                          markdownNote("Tick **sound** first if you want it heard. Next: amplitude up, then frequency up, then phase shifted. [[back]] [[next]]")
                      }
                      step("Half a cycle apart, they cancel", id = "sounds-cancel") {
                          audience {
                              figureBeside("phase_cancel") {
                                  +"""
                                  ## Half a cycle apart, they cancel

                                  Phase matters when two sounds meet. Two identical tones that start
                                  together add to one twice as tall.

                                  Shift one by half a cycle and every push meets an equal pull. The
                                  sum is flat, and there is nothing to hear.
                              """
                                      .md
                              }
                          }
                          control("phase_cancel", "shift", 0.0)
                          control("phase_cancel", "sound", false)
                          cue("Shift half a cycle") { control("phase_cancel", "shift", 0.5, glideMs = 2500) }
                          markdownNote("Tick **sound**, then Next slides the second tone half a cycle along. [[back]] [[next]]")
                      }
                      step("Draw a shape, hear it", id = "sounds-draw") {
                          audience {
                              figureBeside("draw_wave", "wave", "controls") {
                                  +"""
                                  ## Draw a shape, hear it

                                  Any shape can be repeated. Drag the points to draw one cycle, then
                                  hold a key to hear it repeated at that key's pitch.

                                  Smooth shapes sound soft; sharp corners and jumps sound bright and
                                  buzzy.
                              """
                                      .md
                              }
                          }
                          markdownNote("Drag points on the curve, then hold a key. [[back]] [[next]]")
                      }
                  }
                  section("Pure tones") {
                      step("A turning circle", id = "tones-circle") {
                          audience {
                              figureBeside("circle_sine") {
                                  +"""
                                  ## A sine wave is a turning circle

                                  A point going round a circle at a steady speed, watched only for its
                                  height, traces a sine wave.

                                  The circle's radius is the amplitude, how fast it turns is the
                                  frequency, and where it starts is the phase.
                              """
                                      .md
                              }
                          }
                          control("circle_sine", "radius", 0.8)
                          control("circle_sine", "turns per second", 0.5)
                          control("circle_sine", "start", 0.0)
                          markdownNote("Drag the sliders; the newest part of the trace is beside the circle. [[back]] [[next]]")
                      }
                      step("The range of hearing", id = "tones-sweep") {
                          audience {
                              figureBeside("sine_sweep") {
                                  +"""
                                  ## The range of hearing

                                  A sine wave is the purest tone there is. Young ears hear from about
                                  20 Hz to 20,000 Hz; the top falls with age.

                                  Near either end a tone fades out even at the same amplitude: our
                                  hearing is most sensitive between about 1,000 and 5,000 Hz.
                              """
                                      .md
                              }
                          }
                          control("sine_sweep", "frequency", 220.0)
                          control("sine_sweep", "sound", false)
                          cue("Up an octave") { control("sine_sweep", "frequency", 440.0, glideMs = 1500) }
                          markdownNote("Tick **sound**, then Next glides up an octave. Keep the room's volume low. [[back]] [[next]]")
                      }
                      step("Close tones beat", id = "tones-beats") {
                          audience {
                              figureBeside("beats") {
                                  +"""
                                  ## Two close tones beat

                                  Two sines a few hertz apart drift in and out of step. In step they
                                  add; out of step they cancel.

                                  We hear one tone that swells and fades, as often per second as the
                                  two frequencies differ.
                              """
                                      .md
                              }
                          }
                          markdownNote("Hold both keys; drag **difference**. [[back]] [[next]]")
                      }
                      step("Every shape is a sum of sines", id = "tones-square") {
                          audience {
                              figureBeside("square_partials") {
                                  +"""
                                  ## Every shape is a sum of sines

                                  Add sines at 1, 3, 5, 7… times a base frequency, each smaller than
                                  the last, and a square wave appears.

                                  Fourier showed that any repeating shape is a sum like this. The
                                  ripples by the corners shrink in width but never in height: they
                                  are the Gibbs phenomenon.
                              """
                                      .md
                              }
                          }
                          control("square_partials", "sines", 1.0)
                          control("square_partials", "sound", false)
                          cue("Add sines") { control("square_partials", "sines", 25.0, glideMs = 4000) }
                          markdownNote("Next adds sines one by one up to 25. [[back]] [[next]]")
                      }
                      step("Taking a drawing apart", id = "tones-fourier") {
                          audience {
                              figureBeside("draw_wave", "wave", "partials", "controls") {
                                  +"""
                                  ## Taking a drawing apart

                                  The shape you drew is also a sum of sines. The bars are how much of
                                  each multiple of the base frequency it holds.

                                  Smooth shapes need only the first few; corners need many.
                              """
                                      .md
                              }
                          }
                          markdownNote("Redraw the shape and watch the bars. [[back]] [[next]]")
                      }
                      step("Listening back", id = "tones-microphone") {
                          audience {
                              figureBeside("microphone") {
                                  +"""
                                  ## Listening back

                                  The same analysis works on sound from a microphone. Whistle and one
                                  bar stands up; sing a vowel and a row of them appears, at whole
                                  multiples of the note you sing.
                              """
                                      .md
                              }
                          }
                          control("microphone", "listen", false)
                          markdownNote("Tick **listen** to open the microphone. [[back]] [[next]]")
                      }
                  }
                  section("Masses and springs") {
                      step("A mass between springs", id = "springs-one") {
                          audience {
                              figureBeside("normal_modes") {
                                  +"""
                                  ## A mass between springs

                                  Pull a mass held between two springs and let go. It swings back and
                                  forth in a sine wave, at a frequency set by the stiffness of the
                                  springs and the weight of the mass, however far it was pulled.
                              """
                                      .md
                              }
                          }
                          control("normal_modes", "masses", 1.0)
                          control("normal_modes", "mode 1", 0.8)
                          (2..5).forEach { control("normal_modes", "mode $it", 0.0) }
                          markdownNote("Drag **mode 1** to change how far the mass swings. [[back]] [[next]]")
                      }
                      step("Two masses, two ways to move", id = "springs-modes") {
                          audience {
                              figureBeside("normal_modes") {
                                  +"""
                                  ## Two masses, two ways to move

                                  With two masses there are two special motions, the normal modes: both
                                  swinging together, or swinging against each other, a little faster.

                                  Any motion of the pair is a mix of the two.
                              """
                                      .md
                              }
                          }
                          control("normal_modes", "masses", 2.0)
                          control("normal_modes", "mode 1", 0.8)
                          (2..5).forEach { control("normal_modes", "mode $it", 0.0) }
                          cue("The other mode") {
                              control("normal_modes", "mode 1", 0.0, glideMs = 1500)
                              control("normal_modes", "mode 2", 0.8, glideMs = 1500)
                          }
                          cue("Both at once") { control("normal_modes", "mode 1", 0.8, glideMs = 1500) }
                          markdownNote("Next swaps mode 1 for mode 2, then Next mixes both. [[back]] [[next]]")
                      }
                      step("More masses, more modes", id = "springs-five") {
                          audience {
                              figureBeside("normal_modes") {
                                  +"""
                                  ## More masses, more modes

                                  Five masses have five modes. Each has a frequency of its own, and
                                  the higher modes wiggle more.
                              """
                                      .md
                              }
                          }
                          control("normal_modes", "masses", 5.0)
                          control("normal_modes", "mode 1", 0.0)
                          control("normal_modes", "mode 3", 0.8)
                          listOf(2, 4, 5).forEach { control("normal_modes", "mode $it", 0.0) }
                          markdownNote("This is mode 3 of 5. Try the others one at a time. [[back]] [[next]]")
                      }
                      step("A string is many masses", id = "springs-string") {
                          audience {
                              figureBeside("pluck") {
                                  +"""
                                  ## A string is many masses

                                  A string is the limit of very many tiny masses. Its modes are whole
                                  numbers of half waves along its length, at whole multiples of the
                                  lowest frequency: the harmonics.
                              """
                                      .md
                              }
                          }
                          control("pluck", "mode", 1.0)
                          control("pluck", "length", 1.0)
                          cue("Second mode") { control("pluck", "mode", 2.0) }
                          cue("Third mode") { control("pluck", "mode", 3.0) }
                          markdownNote("The string is shown slowed down. Next shows mode 2, then mode 3. [[back]] [[next]]")
                      }
                      step("Pluck it", id = "springs-pluck") {
                          audience {
                              figureBeside("pluck") {
                                  +"""
                                  ## Pluck it

                                  A pluck is a mix of every mode at once. Plucked near the middle, the
                                  low harmonics dominate and the note is round; near the end, the high
                                  ones join in and it turns bright.
                              """
                                      .md
                              }
                          }
                          control("pluck", "mode", 0.0)
                          control("pluck", "length", 1.0)
                          control("pluck", "pluck at", 0.25)
                          markdownNote("Press **pluck** (or P), then move **pluck at** and pluck again. [[back]] [[next]]")
                      }
                      step("Shorter, tighter, lighter", id = "springs-fret") {
                          audience {
                              figureBeside("pluck") {
                                  +"""
                                  ## Shorter, tighter, lighter: higher

                                  Halve the string and every mode doubles in frequency: an octave up.
                                  Tightening it raises the pitch too; a heavier, thicker string lowers it.
                              """
                                      .md
                              }
                          }
                          control("pluck", "mode", 0.0)
                          control("pluck", "length", 1.0)
                          control("pluck", "thickness", 1.0)
                          cue("Half the length") { control("pluck", "length", 0.5, glideMs = 1500) }
                          markdownNote("Pluck, then Next halves the string; pluck again an octave up. [[back]] [[next]]")
                      }
                  }
                  section("Pressure waves") {
                      step("A pulsing sphere", id = "waves-sphere") {
                          audience {
                              figureBeside("pulsing_sphere") {
                                  +"""
                                  ## A pulsing sphere

                                  The simplest source swells and shrinks evenly. Rings of high and low
                                  pressure spread out from it.

                                  The distance between rings is the wavelength: the speed of sound
                                  divided by the frequency. At 343 Hz it is a metre.
                              """
                                      .md
                              }
                          }
                          control("pulsing_sphere", "frequency", 343.0)
                          markdownNote("Drag **frequency**; the rings crowd closer. [[back]] [[next]]")
                      }
                      step("Later and quieter", id = "waves-distance") {
                          audience {
                              figureBeside("speaker_ear") {
                                  +"""
                                  ## Further away: later and quieter

                                  Sound takes about three milliseconds to cross a metre. As each ring
                                  spreads its push is shared over a larger sphere, so the pressure swing
                                  falls as one over the distance: twice as far, half as big.
                              """
                                      .md
                              }
                          }
                          markdownNote("Drag **listener**; the meters give the delay and the level. [[back]] [[next]]")
                      }
                      step("Decibels", id = "waves-decibels") {
                          audience {
                              figureBeside("decibels") {
                                  +"""
                                  ## Decibels

                                  The loudest sound we can bear has a million times the pressure swing
                                  of the quietest we can hear. Decibels compress that range: every ten
                                  times the pressure adds 20 dB.

                                  Twice the distance from a source takes off about 6 dB.
                              """
                                      .md
                              }
                          }
                          control("decibels", "pressure", 0.02)
                          cue("Ten times the pressure") { control("decibels", "pressure", 0.2, glideMs = 1500) }
                          markdownNote("Next multiplies the pressure by ten: 20 dB more. [[back]] [[next]]")
                      }
                      step("A moving source", id = "waves-doppler") {
                          audience {
                              figureBeside("doppler") {
                                  +"""
                                  ## A moving source

                                  A source moving towards you squeezes its own rings together, so they
                                  arrive more often and the pitch is higher. Moving away, they spread
                                  and the pitch falls. This is the Doppler effect.
                              """
                                      .md
                              }
                          }
                          control("doppler", "speed", 150.0)
                          control("doppler", "sound", false)
                          markdownNote("Drag **speed**. Tick **sound** to hear it pass. [[back]] [[next]]")
                      }
                      step("Two speakers", id = "waves-two-speakers") {
                          audience {
                              figureBeside("two_speakers") {
                                  +"""
                                  ## Two speakers

                                  Two speakers play the same tone. Where their rings arrive in step the
                                  sound is louder; where one's peak meets the other's trough it nearly
                                  vanishes.

                                  Move the listener through the pattern.
                              """
                                      .md
                              }
                          }
                          control("two_speakers", "sound", false)
                          markdownNote("Drag the listener. Tick **sound** to hear the level change. [[back]] [[next]]")
                      }
                      step("Echo", id = "waves-echo") {
                          audience {
                              figureBeside("echo") {
                                  +"""
                                  ## Echo

                                  A wall sends sound back. Far from the wall the reflection arrives
                                  late enough to hear as a second clap. Closer than about eight metres,
                                  it returns within fifty milliseconds and merges with the first.
                              """
                                      .md
                              }
                          }
                          markdownNote("Drag **distance to the wall**, then **clap**. [[back]] [[next]]")
                      }
                      step("A room", id = "waves-reverb") {
                          audience {
                              figureBeside("reverb") {
                                  +"""
                                  ## A room

                                  In a room, sound bounces off every wall, again and again, losing a
                                  little each time. The reflections pile up into a tail that lingers
                                  after the sound stops: reverberation.

                                  Bigger, harder rooms ring longer; curtains, carpets and people soak
                                  it up.
                              """
                                      .md
                              }
                          }
                          control("reverb", "room size", 0.4)
                          control("reverb", "soft walls", 0.3)
                          cue("A big hall") { control("reverb", "room size", 0.9, glideMs = 1500) }
                          markdownNote("Hold a key, then Next makes the room a hall. [[back]] [[next]]")
                      }
                  }
                  section("Further reading") {
                      step("Further reading", id = "further-reading") {
                          audience {
                              +"""
                              # Further reading

                              - Eric J. Heller, *Why You Hear What You Hear* (Princeton, 2013): the physics
                                of sound and its perception, with experiments to try.
                              - Neville H. Fletcher and Thomas D. Rossing, *The Physics of Musical
                                Instruments* (Springer, 1998): strings, plates, pipes and rooms in depth.
                              - Julius O. Smith III, *Physical Audio Signal Processing*, free at
                                ccrma.stanford.edu/~jos/pasp: from waves on strings to digital models of them.
                          """
                                  .md
                              p(classes = "muted") {
                                  +"After “Sound” by Bartosz Ciechanowski, https://ciechanow.ski/sound/. Words and figures made in Field."
                              }
                          }
                          markdownNote("The end. [[back]] [[finish]]")
                      }
                  }
              }
              .present()
  - execute:
      box: es_deck
      property: code
