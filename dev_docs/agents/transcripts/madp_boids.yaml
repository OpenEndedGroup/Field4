name: madp_boids
description: >
  boids, the classroom flocking sketchbook, on Field's Vulkan renderer: kinds of boid, each a
  count, speed limits, a field of view, a look and a list of Reynolds steering rules, all stepped
  together on the GPU over a neighbour grid and drawn with tapered trails. Eight boxes: a
  renderer, then seven flocks beneath it -- murmuration (the three classic rules, launched),
  hawks (predators that chase and eat), fireflies (two swarms seeking moving points, additive
  light), ink (a noise flow field that keeps every stroke), bait ball (an orbiting mill with
  sharks), two tribes (segregation by kind) and conga (a hand-written rule). Each flock box is the
  page's flock({...}) spec as BoidFlock settings in its code, and its look as GLSL on
  `#include "boids/flock"` in its compute tab, with the page's fps, steps, trail and fade controls,
  an inspector and a metrics card. Launching a flock box replaces the one showing. Requires a
  GPU/Vulkan window; capture it with `native-screenshot <path> --uid boids_renderer`.
operations:
  - create:
      box: boids_renderer
      name: renderer
      frame: { x: 40.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          import afield.graphics.vulkan.util.Options

          prop<Window>(window)
          prop<Renderer>(renderer)
          Options.enableHDR = false
          Options.profiling = false
          // once: re-running this box keeps the existing window and renderer
          once.renderer {
              window = Window("Boids", initialDimensions = Rect(80.0, 80.0, 960.0, 720.0))
              Renderer(window)
          }
          // the frame loop runs as this box's coroutine; stopping the box stops rendering
          start(renderer::run)
  - create:
      box: boids_murmuration
      name: murmuration
      frame: { x: 40.0, y: 200.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          Murmuration: the three original rules. Keep your distance, match your neighbours' heading,
          drift toward their centre. Colour is heading, so turning waves show as colour waves. The pointer
          is a hawk: move it over the window and the flock parts around it.

          The flock is this box's code: kinds of boid, each a count, speed limits, a field of view and a
          list of rules. A rule is a Reynolds steering force times a weight, and a boid's acceleration is
          their sum. How the boids look is the compute tab's color().
          */
          var module = computeModuleHere {}

          val sim = BoidFlock(module) {
              background = hexColor("#06080b")
              edges = BoidEdges.WRAP
              trail = 14
              fade = 1.0
              kind("starling") {
                  count = 800
                  maxSpeed = 3.2; minSpeed = 1.6; maxForce = 0.07
                  fov = 280.0 // degrees; boids can't see directly behind
                  rules(
                      separate(12, 1.7),
                      align(32, 1.1),
                      cohere(44, 0.95),
                      wander(0.15),
                      mouse(-3, 110), // negative weight: flee the pointer
                  )
                  shape = BoidShape.ARROW; size = 3.2
                  trailAlpha = 0.45
              }
          }
          showControls(sim)
        compute: |
          #version 450
          #include "boids/flock"

          // A boid's colour, sRGB with straight alpha. b.heading, b.speed, b.n (flockmates in view),
          // b.r (0..1, its own), b.cool (rest after eating) and b.kind are there to use.

          vec4 color(Boid b) {
              return hsl(deg(b.heading) + 190.0, 65.0, 62.0);
          }
  - create:
      box: boids_hawks
      name: hawks
      frame: { x: 640.0, y: 200.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          Hawks: two hawks chase the nearest starling and eat it on contact, then rest a while. Starlings
          flee anything hawk-shaped within 90 pixels; the flock splits and heals around each pass. Rules
          see other kinds by name: flee("hawk", ...), chase("starling", ...).
          */
          var module = computeModuleHere {}

          val sim = BoidFlock(module) {
              background = hexColor("#07070a")
              trail = 12
              kind("starling") {
                  count = 700
                  maxSpeed = 3.0; minSpeed = 1.4; maxForce = 0.08; fov = 300.0
                  rules(
                      separate(11, 1.8),
                      align(30, 1.0),
                      cohere(42, 0.9),
                      flee("hawk", 90, 4.5),
                      wander(0.1),
                  )
                  shape = BoidShape.ARROW; size = 2.8
                  trailAlpha = 0.35
              }
              kind("hawk") {
                  count = 2
                  maxSpeed = 3.7; minSpeed = 2.2; maxForce = 0.05
                  rules(
                      chase("starling", 260, 1.3),
                      eat("starling", 7, 90), // reach 7 px, then rest 90 steps
                      separate(90, 1.5, among = "same"),
                      wander(0.5),
                  )
                  shape = BoidShape.ARROW; size = 7.0
                  trail = 3.0; trailAlpha = 0.8; trailWidth = 1.5
              }
          }
          showControls(sim)
        compute: |
          #version 450
          #include "boids/flock"

          const int STARLING = 0;
          const int HAWK = 1;

          vec4 color(Boid b) {
              if (b.kind == HAWK) return b.cool > 0.0 ? hex(0x7a4038u) : hex(0xff6b5au);
              return hsl(210.0, 20.0 + float(b.n), 50.0 + float(b.n) * 0.4);
          }
  - create:
      box: boids_fireflies
      name: fireflies
      frame: { x: 1240.0, y: 200.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          Fireflies: two swarms each chase a point running a Lissajous curve. Weak alignment and a lot of
          wander keep them loose; additive blending turns overlapping trails into light. The point is a
          function of t, the step count, evaluated every frame.
          */
          var module = computeModuleHere {}

          val sim = BoidFlock(module) {
              background = hexColor("#040306")
              blend = BoidBlend.LIGHTER
              trail = 48
              kind("gold") {
                  count = 220
                  maxSpeed = 2.6; minSpeed = 0.8; maxForce = 0.05
                  rules(
                      seek(0.7) { t -> vec(0.5 + 0.32 * cos(t * 0.0082), 0.5 + 0.3 * sin(t * 0.0131)) },
                      separate(10, 1.2),
                      align(24, 0.25),
                      wander(0.9, 0.5),
                  )
                  shape = BoidShape.DOT; size = 1.4
                  trailAlpha = 0.5; trailWidth = 1.2
              }
              kind("green") {
                  count = 220
                  maxSpeed = 2.6; minSpeed = 0.8; maxForce = 0.05
                  rules(
                      seek(0.7) { t -> vec(0.5 + 0.3 * sin(t * 0.0107), 0.5 + 0.32 * cos(t * 0.0073)) },
                      separate(10, 1.2),
                      align(24, 0.25),
                      wander(0.9, 0.5),
                  )
                  shape = BoidShape.DOT; size = 1.4
                  trailAlpha = 0.5; trailWidth = 1.2
              }
          }
          showControls(sim)
        compute: |
          #version 450
          #include "boids/flock"

          const int GOLD = 0;
          const int GREEN = 1;

          vec4 color(Boid b) {
              if (b.kind == GOLD) return hsl(38.0 + b.r * 18.0, 100.0, 58.0, 0.9);
              return hsl(110.0 + b.r * 30.0, 90.0, 55.0, 0.9);
          }
  - create:
      box: boids_ink
      name: ink
      frame: { x: 40.0, y: 660.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          Ink: boids ride a slowly changing noise field and barely flock at all. No bodies are drawn and
          fade is near zero, so the window keeps every stroke; reset in the controls starts a new page.
          The field is flowAngle() in the compute tab, a function of position and time.
          */
          var module = computeModuleHere {}

          val sim = BoidFlock(module) {
              background = hexColor("#efe9dc")
              trail = 6
              fade = 0.01
              kind("ink") {
                  count = 900
                  maxSpeed = 1.8; minSpeed = 0.8; maxForce = 0.09
                  rules(
                      flow(1.0),
                      separate(8, 0.9),
                      align(18, 0.25),
                  )
                  shape = BoidShape.NONE
                  trailAlpha = 0.8; trailWidth = 0.8
              }
          }
          showControls(sim)
        compute: |
          #version 450
          #define FLOW_FIELD
          #include "boids/flock"

          // The heading, in radians, at uv (0..1 across the window) and step t.
          float flowAngle(vec2 uv, float t) {
              return noise(uv.x * 2.2, uv.y * 2.2, t * 0.0015) * TAU * 2.0;
          }

          vec4 color(Boid b) {
              return b.r < 0.85 ? hsl(220.0, 45.0, 22.0, 0.35) : hsl(8.0, 75.0, 48.0, 0.5);
          }
  - create:
      box: boids_bait_ball
      name: bait ball
      frame: { x: 640.0, y: 660.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          Bait ball: sardines circle a point in a tight mill. Three sharks cruise through; the ball blows
          open where they pass and re-forms behind them. orbit() circles a point given as fractions of
          the window, at a radius in pixels.
          */
          var module = computeModuleHere {}

          val sim = BoidFlock(module) {
              background = hexColor("#02101a")
              blend = BoidBlend.LIGHTER
              trail = 20
              kind("sardine") {
                  count = 700
                  maxSpeed = 3.2; minSpeed = 1.6; maxForce = 0.09; fov = 280.0
                  rules(
                      orbit(0.5, 0.5, 80, 1.0),
                      separate(8, 1.6),
                      align(22, 0.9),
                      cohere(30, 0.5),
                      flee("shark", 70, 5),
                  )
                  shape = BoidShape.LINE; size = 4.0
                  trailAlpha = 0.25
              }
              kind("shark") {
                  count = 3
                  maxSpeed = 3.0; minSpeed = 2.0; maxForce = 0.035
                  rules(
                      orbit(0.5, 0.5, 130, 0.8), // a wide lap that clips the ball
                      chase("sardine", 90, 0.7),
                      separate(140, 1.0, among = "same"),
                      wander(0.5),
                  )
                  shape = BoidShape.KITE; size = 10.0
                  trail = 2.0; trailAlpha = 0.4; trailWidth = 2.0
              }
          }
          showControls(sim)
        compute: |
          #version 450
          #include "boids/flock"

          const int SARDINE = 0;
          const int SHARK = 1;

          vec4 color(Boid b) {
              if (b.kind == SHARK) return hex(0xa9c2d2u);
              return hsl(195.0 + b.r * 25.0, 50.0, 45.0 + b.speed * 6.0, 0.85);
          }
  - create:
      box: boids_two_tribes
      name: two tribes
      frame: { x: 1240.0, y: 660.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          Two tribes: everyone separates from everyone, but alignment and cohesion only count your own
          colour, and the other colour is mildly repellent. Mixed flocks sort themselves out within a few
          hundred steps. align and cohere see only their own kind unless told otherwise.
          */
          var module = computeModuleHere {}

          val sim = BoidFlock(module) {
              background = hexColor("#0a0808")
              steps = 2
              trail = 16
              kind("red") {
                  count = 450
                  maxSpeed = 2.8; minSpeed = 1.2; maxForce = 0.07; fov = 300.0
                  rules(
                      separate(12, 1.6, among = "all"),
                      align(32, 1.0), // align and cohere default to "same"
                      cohere(44, 0.9),
                      flee("blue", 36, 1.1),
                      wander(0.1),
                  )
                  shape = BoidShape.ARROW; size = 3.0
                  trailAlpha = 0.4
              }
              kind("blue") {
                  count = 450
                  maxSpeed = 2.8; minSpeed = 1.2; maxForce = 0.07; fov = 300.0
                  rules(
                      separate(12, 1.6, among = "all"),
                      align(32, 1.0),
                      cohere(44, 0.9),
                      flee("red", 36, 1.1),
                      wander(0.1),
                  )
                  shape = BoidShape.ARROW; size = 3.0
                  trailAlpha = 0.4
              }
          }
          showControls(sim)
        compute: |
          #version 450
          #include "boids/flock"

          const int RED = 0;
          const int BLUE = 1;

          vec4 color(Boid b) {
              if (b.kind == RED) return hsl(4.0, 80.0, 48.0 + float(b.n) * 0.5);
              return hsl(212.0, 80.0, 50.0 + float(b.n) * 0.5);
          }
  - create:
      box: boids_conga
      name: conga
      frame: { x: 40.0, y: 1120.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          Conga: no alignment, no cohesion. One hand-written rule: find the closest boid ahead of you and
          aim just behind it. Chains form, merge and chase their own tails. The rule's body is the three
          custom hooks in the compute tab; rule(46, 1.6) says how far it looks and how much it counts.
          */
          var module = computeModuleHere {}

          val sim = BoidFlock(module) {
              background = hexColor("#0b0710")
              steps = 2
              trail = 24
              kind("dancer") {
                  count = 360
                  maxSpeed = 2.6; minSpeed = 1.2; maxForce = 0.08; fov = 200.0
                  rules(
                      rule(46, 1.6),
                      separate(7, 2.0),
                      wander(0.35),
                  )
                  shape = BoidShape.ARROW; size = 3.0
                  trailAlpha = 0.5
              }
          }
          showControls(sim)
        compute: |
          #version 450
          #define CUSTOM_RULE
          #include "boids/flock"

          // The custom rule, in three parts: start, every neighbour in reach, then the force.
          // Here: the closest boid ahead, and a point 9 pixels behind it along its heading.

          float bestDist;
          vec2 bestAim;
          bool found;

          void customStart(int rule, Boid me) {
              bestDist = 1e9;
              found = false;
          }

          void customNeighbour(int rule, Boid me, Boid other, vec2 d, float dist) {
              vec2 ahead = vec2(cos(me.heading), sin(me.heading));
              if (dot(d, ahead) > 0.0 && dist < bestDist) {
                  bestDist = dist;
                  bestAim = d - vec2(cos(other.heading), sin(other.heading)) * 9.0;
                  found = true;
              }
          }

          vec2 customForce(int rule, Boid me) {
              return found ? steer(me, bestAim) : vec2(0.0);
          }

          vec4 color(Boid b) {
              return hsl(280.0 + float(b.n) * 25.0, 75.0, 65.0);
          }
  - connect: { parent: boids_renderer, child: boids_murmuration }
  - connect: { parent: boids_renderer, child: boids_hawks }
  - connect: { parent: boids_renderer, child: boids_fireflies }
  - connect: { parent: boids_renderer, child: boids_ink }
  - connect: { parent: boids_renderer, child: boids_bait_ball }
  - connect: { parent: boids_renderer, child: boids_two_tribes }
  - connect: { parent: boids_renderer, child: boids_conga }
  - launch: { box: boids_renderer, property: code, strand: renderer }  # renderer first — it owns the loop
  - await: {}
  - launch: { box: boids_murmuration, property: code }
  - await: {}
