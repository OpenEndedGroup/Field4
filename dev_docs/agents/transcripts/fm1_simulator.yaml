name: fm1_simulator
description: >
  Loadable demo of FM1Sim (afield/audio/synth/FM1Sim.kt): the M-VAVE FM-1 pocket synth's browser
  simulator, compiled from its open firmware (github.com/m-vave/fm1_open) to a WebAssembly module with
  no imports, running in the GraalVM js+wasm context Faust uses.
    1. FM-1, playing     — a factory project with its sequencer running, returned as the box's last
       expression so launching the box puts it in the mix and stopping it takes it out. Re-running
       keeps the same simulator, so the pattern carries on while you edit.
    2. offline, four projects — each factory project rendered offline for three seconds after PLAY,
       printed as a level trace in 100 ms steps, so the patterns are visible without a sound card.
  Only box 2 is executed by this transcript; box 1 opens an audio device, so click it yourself.
  The simulator is not the hardware: the device runs a closed engine library the web build leaves out.
docs:
  - page: faust.md
    why: "The same GraalWasm hosting, explained for Faust."
operations:
  - create:
      box: fm1_play
      name: FM-1, playing
      frame: { x: 80.0, y: 80.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          The M-VAVE FM-1's open-firmware simulator in Field's audio engine. Launch this box to hear
          it; stop the box and it leaves the mix.

          Change the project slot (0..3) and re-run: the simulator is shared, so the new project
          loads while the transport keeps its state. PLAY/STOP is a toggle, hence the check.
          */
          val fm1 = FM1Sim.shared

          fm1.preset(1)
          if (!fm1.isPlaying) fm1.play()
          fm1.level(0.8)

          fm1.node
  - create:
      box: fm1_offline
      name: offline, four projects
      frame: { x: 480.0, y: 80.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          Each factory project rendered offline: load it, let it settle for half a second, press
          PLAY, then render three seconds at 48 kHz and print the level of every 100 ms as a bar.
          No audio device is involved, so this runs anywhere.

          Each project gets its own simulator, closed at the end, so nothing here touches the shared
          one the box to the left plays.
          */
          val bars = " ▁▂▃▄▅▆▇█"
          val l = FloatArray(4800)
          val r = FloatArray(4800)

          for (slot in 0 until 4) {
              val sim = FM1Sim.create()
              sim.preset(slot)
              repeat(5) { sim.render(l, r, 4800, 48000f) }
              sim.play()
              val levels = (0 until 30).map {
                  sim.render(l, r, 4800, 48000f)
                  kotlin.math.sqrt(l.indices.sumOf { i -> (l[i] * l[i] + r[i] * r[i]).toDouble() } / (2 * l.size))
              }
              val trace = levels.joinToString("") { bars[(it / 0.14 * 8).toInt().coerceIn(0, 8)].toString() }
              println("project $slot  playing=${sim.isPlaying}  $trace")
              sim.close()
          }
  - execute:
      box: fm1_offline
  - await:
      wait: pending
