  - connect: { parent: flg_layers, child: flg_stroke_lines }
  - connect: { parent: flg_layers, child: flg_strokes_joined }
  - connect: { parent: flg_layers, child: flg_scene }
  - launch: { box: flg_renderer, property: code, strand: renderer }
  - wait: { frames: 3 }
