      box: alife_bridges_moving
      name: "10 — A field and its contours, live — launch me"
      frame:
        x: 1440.0
        y: 760.0
        w: 420.0
        h: 100.0
      properties:
        code: |
          // LAUNCH this box rather than merely running it (undo stops it). The last expression is a
