name: path_tracing_glass
description: Progressive compute path tracer with an OpenEXR environment, clear, tinted, frosted and thin glass, and optional KHR ray queries.
operations:
  - create:
      box: path_trace_renderer
      name: path tracing renderer
      frame: { x: 40.0, y: 40.0, w: 320.0, h: 110.0 }
      properties:
        code: |
          import afield.four.util.Options
          prop<Window>(window)
          prop<Renderer>(renderer)
          Options.enableHDR = false
          once.renderer {
              window = Window("Field · Path tracing")
              Renderer(window)
          }
          start(renderer::run)
  - create:
      box: path_trace_glass
      name: glass material study
      frame: { x: 320.0, y: 180.0, w: 350.0, h: 120.0 }
      properties:
        code: |
          import afield.four.fabricated.PathTraceGlassDemo
          import afield.four.fabricated.PathTracingRenderer
          import afield.four.modules.fromContext
          import java.io.File
          val renderer: Renderer = fromContext()
          prop<PathTracingRenderer>(tracer)
          tracer = PathTraceGlassDemo.install(renderer,
              File("public/docs/assets/fabricate_demo/venice_sunset_1k.exr").absolutePath)
          tracer.samplesPerFrame = 1
          tracer.maxBounces = 10
          tracer.exposure = 1.5f
          println("${tracer.backend}: ${tracer.triangleCount} triangles, ${tracer.width} x ${tracer.height}")
          tracer.blitToScreen()
          // This coroutine only announces capture readiness; the named scene owns the tracer.
          frames {
              while (tracer.samples < 2048) { frame() }
              println("glass study converged: ${tracer.samples} samples")
          }
  - connect: { parent: path_trace_renderer, child: path_trace_glass }
  - launch: { box: path_trace_renderer, property: code, strand: renderer }
  - await: { wait: pending }
  - wait: { frames: 3 }
  - launch: { box: path_trace_glass, property: code }
  - await: { wait: pending }
