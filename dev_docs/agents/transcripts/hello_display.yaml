name: hello_display
description: Minimal blank-canvas macro that creates one runnable output box.
operations:
  - create:
      box: agent_hello_display
      name: Agent Hello Display
      frame:
        x: 80.0
        y: 80.0
        w: 260.0
        h: 120.0
      properties:
        code: |
          display("main", "<div style=\"padding:16px;border:1px solid #6b8fb3;background:#eef7ff;color:#1b2a38\">hello from OperationTranscript</div>")
  - execute:
      box: agent_hello_display
      property: code
      type: fragment
      code: |
        display("main", "<div style=\"padding:16px;border:1px solid #6b8fb3;background:#eef7ff;color:#1b2a38\">hello from OperationTranscript</div>")
  - wait:
      millis: 250
