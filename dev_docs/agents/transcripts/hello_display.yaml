name: hello_display
description: Minimal blank-canvas macro that creates one runnable output box.
operations:
  - create:
      box: agent_hello_display
      name: Agent Hello Display
      frame:
        x: 80.0
        y: 80.0
        w: 200.0
        h: 50.0
      properties:
        code: |
          markdown("main", "hello from OperationTranscript")
  - execute:
      box: agent_hello_display
      property: code
      type: fragment
      code: |
        markdown("main", "hello from OperationTranscript")
  - wait:
      millis: 250
