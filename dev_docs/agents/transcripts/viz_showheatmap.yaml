name: viz_showheatmap
description: >
  Loadable demo of the Box.showHeatmap(...) / showImage(...) visualization helper
  (afield.visualization/heatmap.kt) — the raster counterpart of showSignals(...). Four pure-compute
  boxes, each turning a 2-D field into a colour-mapped image with one call (no manual PngEncoder /
  ARGB / bilinear / flipY boilerplate; display(...) shows the PNG bytes inline):
    1. gaussian (viridis) — a smooth 2-D Gaussian bump, default viridis colormap, data-normalized.
    2. diverging (coolwarm) — a sin·sin field in [-1,1] shown with a fixed vmin/vmax=-1/1 so the
       white midpoint sits at zero (normalize=false).
    3. spectrogram (magma) — a synthetic [frame][bin] rising ridge: transpose=true puts time on x
       and frequency on y, flipY=true keeps low frequency at the bottom, logScale=true gives the
       dB-like view a magnitude spectrum wants.
    4. image (showImage) — a hand-built ARGB gradient buffer shown directly via showImage(...).
  No Window or Renderer: every box executes headless and paints into its own output display. Replay
  this file into a fresh Field with the agent backdoor (field_run_transcript) to see all four on
  screen, then swap a colormap ("viridis"/"magma"/"inferno"/"plasma"/"turbo"/"coolwarm"/"grayscale")
  or toggle logScale / smooth / flipY and re-run a box to change it live. Each `execute` op omits
  inline code, so it runs the box's stored `code` property.
operations:
  - create:
      box: heatmap_gaussian
      name: gaussian (viridis)
      frame: { x: 80.0, y: 80.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // A smooth 2-D Gaussian bump -> viridis heatmap. showHeatmap min-max normalizes,
          // bilinear-upsamples the coarse grid, and displays the PNG inline in one call.
          val bump = Array(48) { row ->
              DoubleArray(64) { col ->
                  val dx = (col - 32) / 16.0
                  val dy = (row - 24) / 12.0
                  exp(-(dx * dx + dy * dy))
              }
          }
          showHeatmap(bump, colormap = "viridis", width = 640)
  - create:
      box: heatmap_diverging
      name: diverging (coolwarm)
      frame: { x: 80.0, y: 500.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // A sin*sin field in [-1,1]. A fixed vmin/vmax with normalize=false anchors the coolwarm
          // white midpoint at zero, so blue = negative, red = positive.
          val field = Array(48) { row ->
              DoubleArray(64) { col -> sin(col * 0.18) * sin(row * 0.22) }
          }
          showHeatmap(field, colormap = "coolwarm", width = 640, vmin = -1.0, vmax = 1.0, normalize = false)
  - create:
      box: heatmap_spectrogram
      name: spectrogram (magma)
      frame: { x: 820.0, y: 80.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // A synthetic [frame][bin] magnitude spectrogram with a rising ridge. transpose=true puts
          // time on x and frequency on y; flipY keeps low frequency at the bottom; logScale gives a
          // dB-like view. This is exactly the shape the spectral docs hand-rolled by hand before.
          val frames = 120; val bins = 80
          val spec = Array(frames) { f ->
              DoubleArray(bins) { bin ->
                  val ridge = (bins * (0.15 + 0.7 * f / frames)).toInt()
                  val d = (bin - ridge).toDouble()
                  (0.001 + exp(-d * d / 12.0)) * (1.0 + 0.3 * sin(f * 0.3))
              }
          }
          showHeatmap(spec, colormap = "magma", width = 900, transpose = true, flipY = true, logScale = true)
  - create:
      box: heatmap_image
      name: image (showImage)
      frame: { x: 820.0, y: 540.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // showImage displays a ready-made ARGB IntArray directly (encode + display), for when you
          // already have a pixel buffer rather than a scalar field.
          val w = 512; val h = 256
          val px = IntArray(w * h)
          for (y in 0 until h) for (x in 0 until w) {
              val r = x * 255 / (w - 1)
              val b = y * 255 / (h - 1)
              px[x + y * w] = (0xFF shl 24) or (r shl 16) or (0x40 shl 8) or b
          }
          showImage(px, w, h)
  - execute: { box: heatmap_gaussian, property: code }
  - execute: { box: heatmap_diverging, property: code }
  - execute: { box: heatmap_spectrogram, property: code }
  - execute: { box: heatmap_image, property: code }
  - await:
      wait: pending
