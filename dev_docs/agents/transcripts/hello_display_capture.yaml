name: hello_display_capture
description: >-
  Blank-canvas macro that creates one display box and runs it. Pair it with the backdoor
  capture commands (wait-output / output / screenshot-box) to collect its output events and a
  cropped screenshot — capture is a transport concern, so it lives in backdoor commands, not
  in the macro. See transcripts/README.md "Capturing output and screenshots".
operations:
  - create:
      box: agent_hello_display_capture
      name: Agent Hello Display Capture
      frame:
        x: 80.0
        y: 80.0
        w: 300.0
        h: 100.0
      properties:
        code: |
          markdown("main", "hello from OperationTranscript")
  - execute:
      box: agent_hello_display_capture
      property: code
      type: fragment
      code: |
        markdown("main", "hello from OperationTranscript")
  - wait:
      millis: 250
