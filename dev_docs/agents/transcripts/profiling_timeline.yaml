name: profiling_timeline
description: >
  A three-second recording you can immediately brush and explore. Three editable workloads:
  steady arithmetic, periodic CPU bursts separated by suspension, and vector allocation versus
  reuse. A fourth box starts a capture with JVM stacks and opens the profiling timeline. The macro
  waits for real launch startup, warms the workloads, records, checks the resulting samples,
  and stops its workers. Replay it to repeat the demo; no GPU or personal sources required.
operations:
  - create:
      box: profile_steady
      name: 1. Steady work
      frame: { x: 80.0, y: 80.0, w: 220.0, h: 55.0 }
      properties:
        code: |
          // A small amount of CPU work at roughly 60 Hz. Increase iterations to widen the bars.
          val iterations = 18000
          var checksum = 0.0
          loop {
              repeat(iterations) { checksum += kotlin.math.sin(it.toDouble()) }
              delay(16) // suspension should be a gap, not charged CPU time
          }
  - create:
      box: profile_bursts
      name: 2. Periodic bursts
      frame: { x: 80.0, y: 200.0, w: 220.0, h: 55.0 }
      properties:
        code: |
          // Sparse, longer CPU bars. Try 800000 iterations, or shorten the quiet interval.
          val iterations = 350000
          val quietMillis = 240
          var checksum = 0.0
          frames {
              while (frame()) {
                  repeat(iterations) { checksum += kotlin.math.cos(it.toDouble()) }
                  delay(quietMillis)
              }
          }
  - create:
      box: profile_vectors
      name: 3. Allocate or reuse
      frame: { x: 80.0, y: 320.0, w: 220.0, h: 55.0 }
      properties:
        code: |
          // Flip reuse to true, relaunch, and record again. Both paths update the same vectors.
          // vec is Field's linalg constructor; set writes into an existing vector.
          val reuse = false
          val count = 8192
          var positions = Array(count) { vec(0f, 0f, 0f) }
          var phase = 0f
          loop {
              phase += 0.01f
              if (reuse) {
                  for (i in positions.indices) positions[i].set(i.toFloat(), phase, 0f)
              } else {
                  positions = Array(count) { vec(it.toFloat(), phase, 0f) }
              }
              delay(16)
          }
  - create:
      box: profile_capture
      name: 4. Record and explore
      frame: { x: 420.0, y: 200.0, w: 250.0, h: 55.0 }
      properties:
        code: |
          // Run the three workload boxes first, then run this box. The macro does that for you.
          // Drag the overview, Zoom to selection, choose Allocated bytes, and click a lane.
          // Open current box code returns you to the code behind a measured coroutine.
          // Hot code adds sampled classes, methods and box lines, including background threads.
          CoroutineProfiles.request(thisBox.inside.filename, CoroutineProfileRequest("start", 3.0, stacks = true))
          thisBox.inBrowser("window.showProfilingTimeline()")
          println("Recording three seconds. The timeline will latch automatically.")
  # Stop previous instances before a replay. All targets now exist even on the first run.
  - stop: { box: profile_steady }
  - stop: { box: profile_bursts }
  - stop: { box: profile_vectors }
  - launch: { box: profile_steady, property: code }
  - launch: { box: profile_bursts, property: code }
  - launch: { box: profile_vectors, property: code }
  - await: { wait: pending }
  - wait: { millis: 700 }
  - execute: { box: profile_capture, property: code }
  - wait: { millis: 3400 }
  - stop: { box: profile_steady }
  - stop: { box: profile_bursts }
  - stop: { box: profile_vectors }
  - execute:
      box: profile_capture
      code: |
        // Verify the actual backend capture, including the deliberately allocation-heavy lane.
        val captured = CoroutineProfiles.request(thisBox.inside.filename, CoroutineProfileRequest())
        check(!captured.recording) { "Capture did not latch" }
        val expected = setOf("profile_steady", "profile_bursts", "profile_vectors")
        check(captured.lanes.map { it.boxId }.containsAll(expected)) { "Missing workload lanes" }
        check(captured.spans.size > 30) { "Too few real resumes" }
        val vectorLanes = captured.lanes.filter { it.boxId == "profile_vectors" }.map { it.id }.toSet()
        check(captured.spans.any { it.lane in vectorLanes && it.allocatedBytes > 131072 }) {
            "Vector allocation was not observed (this demo needs JVM allocation counters)"
        }
        println("PROFILE_DEMO_READY: ${captured.lanes.size} lanes, ${captured.spans.size} resumes. Workers stopped; explore the latched timeline.")
