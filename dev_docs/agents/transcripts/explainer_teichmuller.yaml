name: explainer_teichmuller
description: >
  An explainer deck on Teichmüller maps, from scratch: conformal maps, quasi-conformal maps and the
  Beltrami coefficient (small circles become small ellipses), extremal or Teichmüller maps (the
  same distortion everywhere), and the Teichmüller distance as a way to compare shapes, after
  Gary P. T. Choi and L. Mahadevan's planar morphometrics. Five figure boxes compute everything
  live with afield.geometry.conformal: the Beltrami coefficient of a piecewise-linear map, the
  linear Beltrami solver, and the quasi-conformal iteration of Lui, Lam, Yau and Gu. Run deck in
  Field's Electron app to give the talk; each figure box also runs on its own.
docs:
  - page: presentation_studio.md
    why: "Live figures beside prose: the template the explainer decks are built from."
operations:
  - create:
      box: etm_circles
      name: circles
      frame: { x: 800.0, y: 140.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          import afield.geometry.conformal.*

          // A grid of small circles pushed through a map. Each comes out as a small ellipse,
          // coloured by |μ|: dark blue is still a circle, orange is a long ellipse.
          var which = 0
          var amount = 0.6
          val names = ["z + a·z², conformal", "a stretch along x", "a twist near the middle"]

          fun map(x: Double, y: Double): DoubleArray = when (which) {
              0 -> doubleArrayOf(x + 0.35 * amount * (x * x - y * y), y + 0.35 * amount * 2 * x * y)
              1 -> doubleArrayOf(x * (1 + amount), y)
              else -> {
                  val turn = 1.8 * amount * exp(-1.5 * (x * x + y * y))
                  doubleArrayOf(x * cos(turn) - y * sin(turn), x * sin(turn) + y * cos(turn))
              }
          }

          // |μ| = |f_z̄| / |f_z|, from the map's derivatives at (x, y).
          fun distortion(x: Double, y: Double): Double {
              val h = 1e-5
              val a = map(x + h, y)
              val b = map(x - h, y)
              val c = map(x, y + h)
              val d = map(x, y - h)
              val ux = (a[0] - b[0]) / (2 * h)
              val vx = (a[1] - b[1]) / (2 * h)
              val uy = (c[0] - d[0]) / (2 * h)
              val vy = (c[1] - d[1]) / (2 * h)
              return hypot(ux - vy, vx + uy) / hypot(ux + vy, vx - uy)
          }

          fun colour(argb: Int) =
              vec(((argb shr 16) and 255) / 255.0, ((argb shr 8) and 255) / 255.0, (argb and 255) / 255.0, 1.0)
          // World coordinates to the 640 × 360 picture, y up.
          fun sx(x: Double) = 300 + 175 * x
          fun sy(y: Double) = 180 - 175 * y

          fun draw() {
              val drawn = mutableListOf<FLine>()
              // The square grid the circles sit on, carried by the map.
              for (k in -5..5) for (vertical in [true, false]) drawn += fline {
                  for (s in 0..60) {
                      val t = -1.0 + 2.0 * s / 60
                      val p = if (vertical) map(0.2 * k, 0.7 * t) else map(t, 0.14 * k)
                      if (s == 0) moveTo(sx(p[0]), sy(p[1])) else lineTo(sx(p[0]), sy(p[1]))
                  }
                  thickness = 1.0
                  color = vec(1.0, 1.0, 1.0, 0.35)
              }
              var largest = 0.0
              for (i in -5..5) for (j in -3..3) {
                  val cx = 0.2 * i
                  val cy = 0.2 * j
                  val k = distortion(cx, cy)
                  largest = max(largest, k)
                  drawn += fline {
                      for (s in 0..32) {
                          val p = map(cx + 0.07 * cos(2 * PI * s / 32), cy + 0.07 * sin(2 * PI * s / 32))
                          if (s == 0) moveTo(sx(p[0]), sy(p[1])) else lineTo(sx(p[0]), sy(p[1]))
                      }
                      thickness = 2.0
                      color = colour(MeshPicture.distortionColor(k, 0.6))
                  }
              }
              lines(drawn, channel = "map", w = 640.0, h = 360.0, framing = LinesFraming.fixed(0.0, 0.0, 640.0, 360.0))
              markdown(
                  "readout",
                  "**${names[which]}**: largest |μ| = ${largest.f2}, so the longest ellipse is ${dilatation(min(largest, 0.99)).f2} times as long as it is wide",
              )
          }

          draw()
          controlGroup {
              slider("map", 0.0, 2.0, step = 1.0, initialValue = 0.0) {
                  which = it.toInt()
                  draw()
              }
              slider("amount", 0.0, 1.0, initialValue = amount) {
                  amount = it
                  draw()
              }
          }
  - create:
      box: etm_ellipse
      name: ellipse
      frame: { x: 1540.0, y: 140.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          import afield.geometry.conformal.*

          // One small circle under the map z ↦ z + μ·z̄, the simplest map with a given μ.
          // The size of μ sets how long the ellipse is; its angle sets which way it points.
          var size = 0.4
          var degrees = 30.0

          fun draw() {
              val angle = degrees * PI / 180
              val mr = size * cos(angle)
              val mi = size * sin(angle)
              // z + μ z̄ for z = x + iy.
              fun map(x: Double, y: Double) = doubleArrayOf(x + mr * x + mi * y, y + mi * x - mr * y)
              fun sx(x: Double) = 320 + 110 * x
              fun sy(y: Double) = 180 - 110 * y
              fun curve(thick: Double, isGuide: Boolean, at: (Double) -> DoubleArray) = fline {
                  for (s in 0..96) {
                      val p = at(2 * PI * s / 96)
                      if (s == 0) moveTo(sx(p[0]), sy(p[1])) else lineTo(sx(p[0]), sy(p[1]))
                  }
                  thickness = thick
                  color = if (isGuide) vec(1.0, 1.0, 1.0, 0.35) else vec(0.4, 0.9, 1.0, 1.0)
              }
              val drawn = mutableListOf(
                  curve(1.5, true) { doubleArrayOf(cos(it), sin(it)) },
                  curve(3.0, false) { map(cos(it), sin(it)) },
              )
              // The direction stretched most, and the one squeezed most: half the angle of μ, and a right angle from it.
              val long = map(cos(angle / 2), sin(angle / 2))
              val short = map(-sin(angle / 2), cos(angle / 2))
              drawn += fline {
                  moveTo(sx(-long[0]), sy(-long[1]))
                  lineTo(sx(long[0]), sy(long[1]))
                  thickness = 2.0
                  color = vec(1.0, 0.6, 0.2, 1.0)
              }
              drawn += fline {
                  moveTo(sx(-short[0]), sy(-short[1]))
                  lineTo(sx(short[0]), sy(short[1]))
                  thickness = 1.0
                  color = vec(1.0, 0.6, 0.2, 0.6)
              }
              lines(drawn, channel = "circle", w = 640.0, h = 360.0, framing = LinesFraming.fixed(0.0, 0.0, 640.0, 360.0))
              markdown(
                  "readout",
                  "μ = ${size.f2} at ${degrees.f0}°: stretched by **${(1 + size).f2}**, squeezed to **${(1 - size).f2}**, ratio K = **${dilatation(size).f2}**",
              )
          }

          draw()
          controlGroup {
              slider("size", 0.0, 0.9, initialValue = size) {
                  size = it
                  draw()
              }
              slider("angle", 0.0, 360.0, step = 1.0, initialValue = degrees) {
                  degrees = it
                  draw()
              }
          }
  - create:
      box: etm_landmark
      name: landmark
      frame: { x: 2280.0, y: 140.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          import afield.geometry.conformal.*
          import afield.media.image.util.PngEncoder

          /*
          A square whose edges stay put while one point inside is dragged somewhere else.
          Left: the harmonic map (the solver with μ = 0). Right: the Teichmüller map, found by
          the quasi-conformal iteration. Colour is |μ| on each triangle.
          */
          val mesh = PlanarMesh.grid(20)
          val solver = LinearBeltramiSolver(mesh)
          val pinned = mesh.nearest(0.3, 0.5)
          var toX = 0.6
          var toY = 0.55

          fun draw() {
              val fixed = mesh.boundaryIdentity() + (pinned to doubleArrayOf(toX, toY))
              val harmonic = harmonicMap(mesh, fixed, solver)
              val teich = teichmullerMap(mesh, fixed, iterations = 150, solver = solver)
              val picture = MeshPicture(640, 320, -0.05, -0.05, 2.15, 1.05)
              for ((offset, m) in [0.0 to harmonic, 1.1 to teich]) {
                  val shifted = DoubleArray(mesh.vertexCount) { m.u[it] + offset }
                  picture.mesh(
                      mesh,
                      shifted,
                      m.v,
                      IntArray(mesh.triangleCount) { MeshPicture.distortionColor(m.moduli[it], 0.5) },
                  )
                  picture.dot(mesh.x[pinned] + offset, mesh.y[pinned], 3.0, 0xFFFFFFFF.toInt())
                  picture.dot(toX + offset, toY, 5.0, 0xFFFF9933.toInt())
              }
              display("maps", PngEncoder.encode(picture.pixels, 640, 320))
              markdown(
                  "readout",
                  "harmonic, left: |μ| from ${harmonic.minModulus.f2} to **${harmonic.maxModulus.f2}**, ${harmonic.flipped} triangles turned over · " +
                      "Teichmüller, right: |μ| from ${teich.minModulus.f2} to **${teich.maxModulus.f2}**, K = ${teich.dilatation.f2} after ${teich.iterations} iterations",
              )
          }

          draw()
          controlGroup {
              slider("landmark x", 0.15, 0.85, initialValue = toX) {
                  toX = it
                  draw()
              }
              slider("landmark y", 0.15, 0.85, initialValue = toY) {
                  toY = it
                  draw()
              }
          }
  - create:
      box: etm_leaf_compare
      name: leaf_compare
      frame: { x: 3020.0, y: 140.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          import afield.geometry.conformal.*
          import afield.media.image.util.PngEncoder

          /*
          Two leaf outlines and the Teichmüller map from the first to the second. Six landmarks
          match: tip, base, and the margin a third and two thirds of the way up on each side. The
          outline between landmarks is free to slide. Colour is |μ| of the map: the distortion field.
          */
          val names = ["elliptic", "lanceolate", "ovate", "heart-shaped", "round"]

          // Each leaf as a distance from its middle in every direction; the tip points up.
          fun oval(a: Double, b: Double, t: Double) = a * b / sqrt((b * cos(t)).pow(2) + (a * sin(t)).pow(2))
          fun leaf(kind: Int): (Double) -> Double = { t ->
              when (kind) {
                  0 -> oval(0.5, 1.0, t)
                  1 -> oval(0.27, 1.0, t) * (1 + 0.15 * max(0.0, sin(t)).pow(6))
                  2 -> oval(0.62 * (1 - 0.22 * sin(t)), 0.95, t)
                  3 ->
                      oval(0.75 * (1 - 0.15 * sin(t)), 0.9, t) *
                          (1 + 0.2 * max(0.0, sin(t)).pow(8)) *
                          (1 - 0.45 * exp(-(1 + sin(t)) / 0.024)) // the notch at the base, the same however t wraps
                  else -> oval(0.85, 0.95, t)
              }
          }

          var first = 0
          var second = 3

          fun draw() {
              // The map is mirror-symmetric, so it is computed on the right halves and drawn twice.
              val c = MirrorShapeComparison(leaf(first), leaf(second))
              val mesh = c.half
              val picture = MeshPicture(640, 360, -2.2, -1.24, 2.2, 1.24)
              val colours = IntArray(mesh.triangleCount) { MeshPicture.distortionColor(c.map.moduli[it], 0.6) }
              for (side in [1.0, -1.0]) {
                  picture.mesh(mesh, DoubleArray(mesh.vertexCount) { side * mesh.x[it] - 1.1 }, mesh.y, colours, edgeAlpha = 0.25)
                  picture.mesh(
                      mesh,
                      DoubleArray(mesh.vertexCount) { side * c.map.u[it] + 1.1 },
                      c.map.v,
                      colours,
                      edgeAlpha = 0.25,
                  )
                  for (k in 0 until 4) {
                      picture.dot(side * mesh.x[c.landmarks[k]] - 1.1, mesh.y[c.landmarks[k]], 4.0, 0xFFFF9933.toInt())
                      picture.dot(side * c.targetLandmarks[k][0] + 1.1, c.targetLandmarks[k][1], 4.0, 0xFFFF9933.toInt())
                  }
              }
              display("leaves", PngEncoder.encode(picture.pixels, 640, 360))
              markdown(
                  "readout",
                  "**${names[first]} → ${names[second]}**: Teichmüller distance **${c.distance.f2}** (K = ${exp(2 * c.distance).f2}); " +
                      "|μ| is ${c.map.medianModulus.f2} over half the leaf, ${c.map.minModulus.f2} to ${c.map.maxModulus.f2} at the extremes",
              )
          }

          draw()
          controlGroup {
              slider("first leaf", 0.0, 4.0, step = 1.0, initialValue = 0.0) {
                  first = it.toInt()
                  draw()
              }
              slider("second leaf", 0.0, 4.0, step = 1.0, initialValue = 3.0) {
                  second = it.toInt()
                  draw()
              }
          }
  - create:
      box: etm_leaf_distances
      name: leaf_distances
      frame: { x: 3760.0, y: 140.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          import afield.geometry.conformal.*
          import afield.media.image.util.PngEncoder

          // Every pair of five leaves, compared by Teichmüller distance with the same six landmarks.
          // A shape scaled up is the same shape: scaling is conformal, so it costs nothing.
          val names = ["elliptic", "lanceolate", "ovate", "heart-shaped", "round"]
          fun oval(a: Double, b: Double, t: Double) = a * b / sqrt((b * cos(t)).pow(2) + (a * sin(t)).pow(2))
          fun leaf(kind: Int): (Double) -> Double = { t ->
              when (kind) {
                  0 -> oval(0.5, 1.0, t)
                  1 -> oval(0.27, 1.0, t) * (1 + 0.15 * max(0.0, sin(t)).pow(6))
                  2 -> oval(0.62 * (1 - 0.22 * sin(t)), 0.95, t)
                  3 ->
                      oval(0.75 * (1 - 0.15 * sin(t)), 0.9, t) *
                          (1 + 0.2 * max(0.0, sin(t)).pow(8)) *
                          (1 - 0.45 * exp(-(1 + sin(t)) / 0.024)) // the notch at the base, the same however t wraps
                  else -> oval(0.85, 0.95, t)
              }
          }

          val d = Array(5) { DoubleArray(5) }
          for (a in 0 until 5) for (b in a + 1 until 5) {
              d[a][b] = MirrorShapeComparison(leaf(a), leaf(b)).distance
              d[b][a] = d[a][b]
          }

          // The five leaves in a row, then the table of distances.
          val picture = MeshPicture(640, 150, 0.0, -0.7, 6.0, 0.7)
          for (k in 0 until 5) {
              val n = 200
              val r = leaf(k)
              val mesh = PlanarMesh.outline(
                  DoubleArray(n) { 0.6 * r(2 * PI * it / n) * cos(2 * PI * it / n) + 0.6 + 1.2 * k },
                  DoubleArray(n) { 0.6 * r(2 * PI * it / n) * sin(2 * PI * it / n) },
                  0.04,
              )
              picture.mesh(mesh, colors = IntArray(mesh.triangleCount) { 0xFF2E8BBF.toInt() }, edgeAlpha = 0.0)
          }
          display("row", PngEncoder.encode(picture.pixels, 640, 150))
          val table = StringBuilder("| | " + names.joinToString(" | ") + " |\n|---" + "|---".repeat(5) + "|\n")
          for (a in 0 until 5) table.append(
              "| **${names[a]}** | " + (0 until 5).joinToString(" | ") { if (it == a) "·" else d[a][it].f2 } + " |\n",
          )
          markdown("readout", table.toString())
  - create:
      box: etm_deck
      name: deck
      frame: { x: 60.0, y: 140.0, w: 150.0, h: 50.0 }
      properties:
        code: |
          import kotlinx.html.*

          // The talk. Every figure is a box beside this one, named as in figureBeside(...).
          presentation(title = "Teichmüller maps") {
              step("Teichmüller maps", id = "opening") {
                  audience {
                      +"""
                          # Teichmüller maps

                          How different are two leaves? One answer: bend one onto the other, and
                          measure how much the bending had to distort it. Teichmüller maps are the
                          bendings that distort as little as possible.

                          This talk builds the idea from nothing: maps that keep angles, maps that
                          turn circles into ellipses, the map with the least distortion, and the
                          distance between shapes that comes out of it.""".md
                      p(classes = "muted") {
                          +"After the work of Gary P. T. Choi, L. Mahadevan, Lok Ming Lui and co-authors. Words and figures made in Field."
                      }
                  }
                  markdownNote("Where we are going: a number for how different two outlines are. [[next]]")
              }

              section("Conformal maps") {
                  step("Maps that keep angles", id = "conformal") {
                      audience {
                          figureBeside("circles") {
                              +"""
                                  ## Maps that keep angles

                                  A map moves every point of the plane somewhere else. This one bends
                                  the grid, yet wherever two grid lines cross, they still cross at a
                                  right angle.

                                  A map that keeps every angle is called **conformal**. Look closely and
                                  each small circle is still a circle: it has grown or shrunk and turned,
                                  but kept its shape.""".md
                          }
                      }
                      control("circles", "map", 0.0)
                      control("circles", "amount", 0.0)
                      cue("Bend") { control("circles", "amount", 0.9, glideMs = 2000) }
                      markdownNote("Next bends the plane with z + a·z². The circles stay round and blue. [[back]] [[next]]")
                  }
              }

              section("Quasi-conformal maps") {
                  step("Circles become ellipses", id = "stretch") {
                      audience {
                          figureBeside("circles") {
                              +"""
                                  ## Circles become ellipses

                                  Most maps are not conformal. Stretch the plane sideways and every
                                  small circle becomes an ellipse.

                                  Seen closely enough, any smooth map is a stretch: a small enough
                                  circle always comes out as an ellipse. A map whose ellipses never get
                                  infinitely thin is **quasi-conformal**.""".md
                          }
                      }
                      control("circles", "map", 1.0)
                      control("circles", "amount", 0.0)
                      cue("Stretch") { control("circles", "amount", 0.8, glideMs = 2000) }
                      cue("Twist") {
                          control("circles", "map", 2.0)
                          control("circles", "amount", 0.8)
                      }
                      markdownNote(
                          "Next stretches; the one after twists the middle, where the ellipses differ from place to place. [[back]] [[next]]",
                      )
                  }
                  step("The Beltrami coefficient", id = "beltrami") {
                      audience {
                          figureBeside("ellipse") {
                              +"""
                                  ## The Beltrami coefficient

                                  One complex number says which ellipse a map makes at a point: the
                                  **Beltrami coefficient** μ. Writing the map as f(z),
                                  μ = (∂f/∂z̄) ÷ (∂f/∂z).

                                  Its size, between 0 and 1, sets the shape: the ellipse is
                                  K = (1 + |μ|) ÷ (1 − |μ|) times as long as it is wide. Its angle sets
                                  the direction: half of it. μ = 0 is a circle, a conformal map.""".md
                          }
                      }
                      control("ellipse", "size", 0.0)
                      control("ellipse", "angle", 30.0)
                      cue("Grow μ") { control("ellipse", "size", 0.6, glideMs = 1500) }
                      cue("Turn μ") { control("ellipse", "angle", 210.0, glideMs = 2500) }
                      markdownNote(
                          "Next grows |μ| to 0.6 (K = 4); then turning μ by 180° turns the ellipse by 90°. [[back]] [[next]]",
                      )
                  }
                  step("A μ at every point", id = "field") {
                      audience {
                          figureBeside("circles") {
                              +"""
                                  ## A μ at every point

                                  The twist has a different μ at every point. The colours are its
                                  size: blue where circles stay round, orange where they stretch.

                                  The remarkable fact runs the other way. Choose any μ, anywhere below 1,
                                  and there is a map with exactly those ellipses, unique once you fix
                                  where three points go. μ is a complete description of the map.""".md
                          }
                      }
                      control("circles", "map", 2.0)
                      control("circles", "amount", 0.9)
                      markdownNote("The measurable Riemann mapping theorem, in one sentence. [[back]] [[next]]")
                  }
              }

              section("Teichmüller maps") {
                  step("From μ back to a map", id = "solver") {
                      audience {
                          figureBeside("landmark") {
                              +"""
                                  ## From μ back to a map

                                  On a computer the plane is a mesh of triangles and a map moves each
                                  vertex. Given μ on every triangle, the **linear Beltrami solver**
                                  finds the map: each coordinate solves one sparse linear system.

                                  Here the square's edges are held and one point inside is dragged.
                                  The left map asks for μ = 0, as conformal as it can be.""".md
                          }
                      }
                      control("landmark", "landmark x", 0.3)
                      control("landmark", "landmark y", 0.5)
                      cue("Drag the point") {
                          control("landmark", "landmark x", 0.65, glideMs = 2000)
                          control("landmark", "landmark y", 0.6, glideMs = 2000)
                      }
                      markdownNote("Starts undisturbed; Next drags the white point to the orange one. [[back]] [[next]]")
                  }
                  step("No conformal map exists", id = "harmonic") {
                      audience {
                          figureBeside("landmark") {
                              +"""
                                  ## No conformal map exists

                                  Fix the edges and move a point, and no map can keep every angle.
                                  The μ = 0 request gives the harmonic map on the left. Its
                                  distortion piles up around the dragged point, and where |μ| passes 1
                                  triangles turn over: the map folds.

                                  So ask a better question: of all maps that move the point there,
                                  which has the smallest worst ellipse?""".md
                          }
                      }
                      control("landmark", "landmark x", 0.65)
                      control("landmark", "landmark y", 0.6)
                      markdownNote("Point out the orange ring round the landmark on the left. [[back]] [[next]]")
                  }
                  step("Spread the distortion evenly", id = "teichmuller") {
                      audience {
                          figureBeside("landmark") {
                              +"""
                                  ## Spread the distortion evenly

                                  That map is the **extremal** map, and Teichmüller showed it usually
                                  has the same |μ| everywhere: only the direction of stretch changes.
                                  Such a map is a **Teichmüller map**.

                                  The right map is found by iterating: solve, measure μ, smooth it,
                                  give every triangle the mean size, solve again (Lui, Lam, Yau and
                                  Gu, 2014). Its colour is even, and its worst |μ| is lower.""".md
                          }
                      }
                      control("landmark", "landmark x", 0.65)
                      control("landmark", "landmark y", 0.6)
                      cue("Further") {
                          control("landmark", "landmark x", 0.7, glideMs = 2000)
                          control("landmark", "landmark y", 0.38, glideMs = 2000)
                      }
                      markdownNote("Compare the two readouts. Next drags the landmark further. [[back]] [[next]]")
                  }
              }

              section("Comparing shapes") {
                  step("A distance between shapes", id = "distance") {
                      audience {
                          figureBeside("ellipse") {
                              +"""
                                  ## A distance between shapes

                                  A Teichmüller map has one number, K, its ellipses' shape. The
                                  **Teichmüller distance** between two shapes is ½ log K of the
                                  Teichmüller map from one to the other.

                                  It is a true distance: zero only for shapes one conformal map
                                  apart, the same both ways, and never shorter than going via a third
                                  shape. Growing or shrinking a shape is conformal, so size is free.""".md
                          }
                      }
                      control("ellipse", "size", 0.33)
                      control("ellipse", "angle", 0.0)
                      markdownNote("|μ| = 0.33 means K = 2 and distance ½ log 2 ≈ 0.35. [[back]] [[next]]")
                  }
                  step("Two leaves", id = "leaves") {
                      audience {
                          figureBeside("leaf_compare") {
                              +"""
                                  ## Two leaves

                                  Choi and Mahadevan compare planar shapes this way: leaves, insect
                                  wings, the outlines of organs. Mark matching landmarks, let the
                                  outline slide between them, find the Teichmüller map.

                                  Here the landmarks are the tip, the base, and the margin a third and
                                  two thirds of the way up. The colour is even: the same stretch
                                  everywhere, only its direction changes. Choose two leaves.""".md
                          }
                      }
                      control("leaf_compare", "first leaf", 0.0)
                      control("leaf_compare", "second leaf", 3.0)
                      cue("Lanceolate") { control("leaf_compare", "second leaf", 1.0) }
                      markdownNote("Elliptic to heart-shaped; Next compares elliptic with lanceolate. [[back]] [[next]]")
                  }
                  step("A table of distances", id = "table") {
                      audience {
                          figureBeside("leaf_distances") {
                              +"""
                                  ## A table of distances

                                  Every pair of five leaves. With distances in hand, the usual tools
                                  apply: nearest neighbours, clusters, a tree of similarity.

                                  Biologists can compare outlines without choosing a coordinate
                                  system or a scale, and see where on the shape the difference
                                  lies.""".md
                          }
                      }
                      markdownNote("The table takes a few seconds to compute on first show. [[back]] [[next]]")
                  }
                  step("What this version leaves out", id = "caveats") {
                      audience {
                          +"""
                              ## What this version leaves out

                              - Our leaves are mirror-symmetric, and we use it: the best map is then
                                symmetric too, each half is a four-cornered region, and the map between
                                two of those goes through rectangles, with an exact distance. Leaves
                                that are not symmetric need the general sliding-boundary iteration.
                              - With only four landmarks, tip, base and one pair, every symmetric leaf
                                is at distance zero from every other: the landmarks decide what the
                                distance can see.
                              - Our outlines are formulas; real ones come from photographs.
                              - The same machinery works on point clouds without a mesh (Choi, Liu
                                and Lui) and, with density instead of angle, gives density-equalizing
                                maps (Choi and Rycroft).""".md
                      }
                      markdownNote("Questions for Gary go here. [[back]] [[next]]")
                  }
              }

              step("Further reading", id = "further-reading") {
                  audience {
                      +"""
                          ## Further reading

                          - Gary P. T. Choi and L. Mahadevan, “Planar morphometrics using Teichmüller maps”, *Proc. R. Soc. A* 474 (2018), doi 10.1098/rspa.2017.0905.
                          - Lok Ming Lui, Ka Chun Lam, Shing-Tung Yau and Xianfeng Gu, “Teichmüller mapping (T-map) and its applications to landmark matching registration”, *SIAM J. Imaging Sciences* 7 (2014), doi 10.1137/120900186.
                          - Gary P. T. Choi, Yechen Liu and Lok Ming Lui, “Free-boundary conformal parameterization of point clouds”, *J. Sci. Comput.* 90 (2022), doi 10.1007/s10915-021-01641-6.
                          - Gary P. T. Choi and Chris H. Rycroft, “Density-equalizing maps for simply connected open surfaces”, *SIAM J. Imaging Sciences* 11 (2018), doi 10.1137/17M1124796.""".md
                      p(classes = "muted") {
                          +"After the work of Gary P. T. Choi, L. Mahadevan, Lok Ming Lui and co-authors. Words and figures made in Field."
                      }
                  }
                  markdownNote("The end. [[back]] [[finish]]")
              }
          }.arrangeBoxes().present()
