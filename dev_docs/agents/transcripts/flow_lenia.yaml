name: flow_lenia
description: >
  Flow Lenia (Plantec et al., ALIFE 2023), as four pure-CPU boxes from the Flow Lenia sections of
  public/docs/alife_examples.md. Box 0 runs three species for 200 steps and prints the worst relative
  change in total mass. Boxes 1 to 3 are the page's three clips: three species side by side with a
  flat total-mass plot, rings meeting a cell under SAMPLED mixing with per-species mass, and the same
  pair under MEAN mixing with the parameter field drawn. No Window, no Renderer.
docs:
  - page: alife_examples.md
    why: "The Flow Lenia sections these boxes come from."
operations:
  - create:
      box: flow_lenia_conservation
      name: "0 — Flow Lenia: mass conserved over 200 steps"
      frame:
        x: 60.0
        y: 60.0
        w: 420.0
        h: 100.0
      properties:
        code: |
          val world = flowLeniaWorld(
              64,
              64,
              [FlowLeniaPresets.wanderers(), FlowLeniaPresets.rings(), FlowLeniaPresets.cell()],
              seedRadius = 10.0,
          )
          val m0 = world.totalMass()
          var worst = 0.0
          repeat(200) {
              world.step()
              worst = maxOf(worst, kotlin.math.abs(world.totalMass() - m0) / m0)
          }
          println(world)
          println("worst relative change in total mass over 200 steps: " + worst)
  - create:
      box: flow_lenia_species
      name: "1 — Flow Lenia: three species, total mass flat"
      frame:
        x: 560.0
        y: 60.0
        w: 420.0
        h: 100.0
      properties:
        code: |
          val world = flowLeniaWorld(96, 96, [FlowLeniaPresets.wanderers(), FlowLeniaPresets.rings(), FlowLeniaPresets.cell()])

          animateEvolution(
              world,
              totalSteps = 1200,
              seconds = 9.0,
              columns = 2,
              cellSide = 384,
              step = { it.step() },
              panels = { w, n ->
                  [
                      ("step " + n) to w.speciesImg().upscaleNearest(4),
                      ("total mass %.6f".format(w.totalMass())) to w.massPlot(384, 384),
                  ]
              },
          )
  - create:
      box: flow_lenia_collision
      name: "2 — Rings meet a cell (SAMPLED mixing)"
      frame:
        x: 60.0
        y: 240.0
        w: 420.0
        h: 100.0
      properties:
        code: |
          val world = flowLeniaWorld(
              96,
              64,
              [FlowLeniaPresets.rings(), FlowLeniaPresets.cell()],
              positions = [38.0 to 32.0, 58.0 to 32.0],
              mixing = FlowLeniaMixing.SAMPLED,
          )

          animateEvolution(
              world,
              totalSteps = 1200,
              seconds = 9.0,
              columns = 2,
              cellSide = 384,
              step = { it.step() },
              panels = { w, n ->
                  [
                      ("step " + n) to w.speciesImg().upscaleNearest(4),
                      ("rings %.0f, cell %.0f".format(w.speciesMass(0), w.speciesMass(1))) to w.massPlot(384, 256),
                  ]
              },
          )
  - create:
      box: flow_lenia_drift
      name: "3 — The parameter field blending (MEAN mixing)"
      frame:
        x: 560.0
        y: 240.0
        w: 420.0
        h: 100.0
      properties:
        code: |
          val world = flowLeniaWorld(
              96,
              64,
              [FlowLeniaPresets.rings(), FlowLeniaPresets.cell()],
              positions = [38.0 to 32.0, 58.0 to 32.0],
          )

          animateEvolution(
              world,
              totalSteps = 1200,
              seconds = 9.0,
              columns = 2,
              cellSide = 384,
              step = { it.step() },
              panels = { w, n ->
                  [
                      ("step " + n) to w.speciesImg().upscaleNearest(4),
                      ("hybrid %.0f of %.0f".format(w.mixedMass(), w.totalMass())) to
                          w.weightImg(0).colormap("viridis", 0f, 0.4f).upscaleNearest(4),
                  ]
              },
          )
  - execute:
      box: flow_lenia_conservation
      property: code
      type: fragment
  - launch: { box: flow_lenia_species, property: code }
  - launch: { box: flow_lenia_collision, property: code }
  - launch: { box: flow_lenia_drift, property: code }
  - await:
      wait: pending
  - wait:
      millis: 400
