name: remotear_scene_motion
description: >
  KotlinJS "code in the head": a small AR scene exercising the new motion / assets / richer-scene
  surface. First line `// {{ remoteAR }}` selects the RemoteAR head; the body is Kotlin compiled to
  JavaScript and shipped to a connected browser/visionOS head (which installs THREE + the Field
  globals). It builds a lit torus-knot rig (richer geometry/materials/lights + Object3D props), an
  orbit ring drawn with an FLine transformed by the new `+`/`*` transform operators, and loads +
  animates a glTF asset whose `play()` drives the auto AnimationMixer. Every name is bound by
  afield.graphics.RemoteArKotlinJs and grounded against extensions/remote_ar/*. Replay compiles the
  box Kotlin -> JS through the real KotlinToJsCompiler (examples.demo-transcript.exec).
operations:
  - create:
      box: agent_remotear_scene_motion
      name: RemoteAR Scene + Motion
      frame: { x: 80.0, y: 80.0, w: 200.0, h: 50.0 }
      properties:
        mainLanguage: kotlinjs
        code: |
          // {{ remoteAR }}
          // A lit torus-knot rig, an FLine orbit ring transformed by rotate()/+vec/*scale, and a
          // glTF asset loaded + animated through the auto AnimationMixer.
          onStart {
              // --- richer materials / geometries / lights (roadmap item 3) ---
              val gold = THREE.MeshStandardMaterial()
              gold.metalness = 0.9
              gold.roughness = 0.25
              gold.color.setRGB(0.85, 0.65, 0.2)

              val knot = THREE.Mesh(THREE.TorusKnotGeometry(0.4, 0.12, 96, 12), gold)
              knot.name = "knot"
              knot.castShadow = true
              knot.position.set(0.0, 1.2, -1.5)
              knot.lookAt(0.0, 1.6, 0.0)

              val rig = THREE.Group()
              rig.name = "rig"
              rig.add(knot)
              SCENE.add(rig)

              val key = THREE.DirectionalLight(0xffffff, 1.4)
              key.position.set(2.0, 4.0, 2.0)
              SCENE.add(key)
              SCENE.add(THREE.AmbientLight(0x404050, 0.7))

              // --- FLine transform operators (roadmap item 1) ---
              var ring = FLine()
              ring.moveTo(0.6, 0.0, 0.0)
              var a = 0.0
              while (a < 6.3) {
                  ring.lineTo(0.6 * kotlin.math.cos(a), 0.0, 0.6 * kotlin.math.sin(a))
                  a += 0.3
              }
              // rotate the whole ring, lift + push it back, then shrink it: `+ Matrix4`, `+ Vector3`, `* scalar`
              val orbit = ((ring + rotate(0.4)) + vec(0.0, 1.2, -1.5)) * 0.9
              orbit.stroked = true
              orbit.pointed = false
              stage.orbit = orbit

              // --- assets + animation (roadmap item 2): load a glTF and drive the mixer via play() ---
              mapDirectory("/abs/assets", "/assets")
              loadGLTF("/assets/robot.glb", "robot") { g ->
                  g.scene.position.set(0.0, 0.0, -1.5)
                  g.scene.scale.set(0.5, 0.5, 0.5)
                  log("robot loaded: meshes " + g.meshes + ", anims " + g.animations)
                  g.play()          // clipAction(clip).play() on every clip, updated by the XR AnimationMixer
              }

              // gently spin the rig on the head's own render clock
              onFrame { rig.rotation.y += 0.01 }
              log("AR scene + motion ready")
          }
  - launch:
      box: agent_remotear_scene_motion
      property: code
  - await:
      wait: pending
