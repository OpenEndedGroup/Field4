      \ }\n}\nval quad=Mesh(renderer,guideModule)\nquad.resize(3,0,guideModule)\nguideModule += \"convert\" to quad\n\
      guides += \"guides\" to guideModule\n\n// Remove independent scheduling: this pass now owns their order.\n\
