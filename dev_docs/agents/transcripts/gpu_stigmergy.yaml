name: gpu_stigmergy
description: >
  Multi-species stigmergy on the GPU: two Physarum species on one TrailField, each attracted by
  its own channel and repelled by the others' (the attraction matrix), so they divide the field into
  interleaved territories; a cloud of gradient-following particles (TrailFollowers) that rides
  species 0's roads and keeps out of species 1's; and a chase box that rewrites the attraction and
  deposit matrices live so species 1 marks species 0's channel and species 0 flees it. Five boxes: a
  renderer; a slime box publishing the prop `physarum`; followers, chase and reset boxes beneath it.
  Jones' exclusion (`exclusive = true`) needs a lower density than this one-agent-per-pixel scene;
  the smoke alife.physarum-gpu.smoke measures it at 15%. Requires a GPU/Vulkan window; capture with a follow-on
  `native-screenshot <path> --uid stigmergy_renderer`. Design: dev_docs/GPU_STIGMERGY_FIELD.md.
docs:
  - page: alife_examples.md
    why: "Section 7's 'Several species on one field' subsection is the slime and followers boxes of this document."
operations:
  - create:
      box: stigmergy_renderer
      name: renderer
      frame: { x: 40.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          import afield.graphics.vulkan.util.Options

          prop<Window>(window)
          prop<Renderer>(renderer)
          Options.enableHDR = false
          Options.profiling = false
          // once: re-running this box keeps the existing window and renderer
          once.renderer {
              window = Window("Stigmergy", initialDimensions = Rect(80.0, 80.0, 768.0, 768.0))
              Renderer(window)
          }
          println("renderer ready")
          // the frame loop runs as this box's coroutine; stopping the box stops rendering
          start(renderer::run)
  - create:
      box: stigmergy_slime
      name: three species
      frame: { x: 340.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          Two species on one 512 x 512 trail, one channel each. Row s of `attraction` is how
          species s weighs the four channels when it senses: +1 for its own, -1 for the other's.
          Each follows its own roads and turns away from the other's, so the field divides into
          amber and cyan territories that keep re-negotiating their borders.
          */
          prop<ShaderPhysarumSystem>(physarum) = ShaderPhysarumSystem() {
              width = 512
              height = 512
              agentCount = 250_000
              speciesCount = 2
              exposure = 0.06f
              attraction = listOf(
                  vec(1f, -1f, 0f, 0f),
                  vec(-1f, 1f, 0f, 0f),
              )
          }

          // steps once a frame and draws the trail, one colour per species
          physarum.installInto()
          println("${physarum.settings.agentCount} agents, ${physarum.settings.speciesCount} species")
  - create:
      box: stigmergy_followers
      name: followers
      frame: { x: 680.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          A second particle system that only reads the field. Each particle climbs the gradient
          of dot(trail, weights): up species 0's channel (amber) and down species 1's (cyan), so
          the magenta dots gather on amber roads and slide off cyan ones.
          */
          var followers = TrailFollowers(physarum.trail) {
              count = 20_000
              weights = vec(1f, -1f, 0f, 0f)
              steering = 0.4f
              pointSize = 3f
          }
          // draws after the trail's preview, so the points sit on top of it
          followers.installInto()
          println("${followers.settings.count} followers on the trail")
  - create:
      box: stigmergy_chase
      name: chase
      frame: { x: 340.0, y: 160.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          Species may write into each other's channels. Here species 1 (cyan) also lays half a
          mark of species 0's scent wherever it goes, and species 0 (amber) is repelled twice as
          hard by cyan as before. Re-run with other numbers: both matrices are read every frame.
          */
          physarum.settings.depositInto = listOf(
              vec(1f, 0f, 0f, 0f),
              vec(0.5f, 1f, 0f, 0f),
          )
          physarum.settings.attraction = listOf(
              vec(1f, -2f, 0f, 0f),
              vec(1f, 1f, 0f, 0f),
          )
          println("chase: species 1 follows species 0 and marks its channel")
  - create:
      box: stigmergy_reset
      name: reset
      frame: { x: 340.0, y: 400.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // empty the trail, restore the territorial matrices, and scatter the agents again
          physarum.settings.depositInto = null
          physarum.settings.attraction = listOf(
              vec(1f, -1f, 0f, 0f),
              vec(-1f, 1f, 0f, 0f),
          )
          physarum.trail.clear()
          physarum.resetAgents(System.nanoTime())
          println("reset")
  - connect: { parent: stigmergy_renderer, child: stigmergy_slime }
  - connect: { parent: stigmergy_slime, child: stigmergy_followers }
  - connect: { parent: stigmergy_slime, child: stigmergy_chase }
  - connect: { parent: stigmergy_slime, child: stigmergy_reset }
  - launch: { box: stigmergy_renderer, property: code, strand: renderer }  # renderer first — it owns the loop
  - await: {}
  - launch: { box: stigmergy_slime, property: code }
  - await: {}
