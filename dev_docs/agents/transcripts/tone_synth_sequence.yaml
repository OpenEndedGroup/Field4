name: tone_synth_sequence
description: >
  KotlinJS "code in the head", made self-contained: a Tone.js polyphonic synth playing a short
  arpeggio through a reverb, scheduled on the Transport — with the browser head embedded right in the
  document so you can open it and HEAR it. Box 1 opens an embedded RemoteAR head
  (/extensions/remote_ar/index.html), which loads the vendored Tone.js and connects back over the
  RemoteJS transport. Box 3, under the KotlinJS root (box 2), has the first line `// {{ tone }}` which
  selects the Tone computer-music head profile; its Kotlin body is compiled to JavaScript and shipped
  to the connected head, where `Tone` is the global. To hear audio, click once inside the head (a
  user gesture is required to resume the browser AudioContext). Replaying this transcript compiles the
  `// {{ tone }}` box Kotlin -> JS through the real KotlinToJsCompiler.
operations:
  # 1. Embedded RemoteAR head (a normal Field/Kotlin box). Opening it loads Tone.js
  #    (vendor/tone/15.1.22, pulled in by index.html) and connects to Field, ready to receive the
  #    compiled Kotlin from the // {{ tone }} box below. Click inside it once to enable audio.
  - create:
      box: agent_tone_head
      name: RemoteAR Head (open me — then click to enable audio)
      frame: { x: 80.0, y: 80.0, w: 450.0, h: 100.0 }
      properties:
        code: |
          // The head that plays the sound. It loads Tone.js and connects over the RemoteJS
          // transport; the // {{ tone }} box below compiles to JS and runs in here.
          display("tone-head", """
          <iframe
            src="/extensions/remote_ar/index.html?debug=1"
            allow="xr-spatial-tracking; fullscreen; autoplay"
            data-afield-autosize="off"
            style="display:block; width:640px; height:400px; border:0; background:#000">
          </iframe>
          """.trimIndent())
          displayOpen("tone-head")
  # 2. The KotlinJS language root: boxes beneath it are compiled Kotlin -> JS and shipped to the head.
  - create:
      box: agent_tone_synth_sequence_root
      name: KotlinJS → Tone
      frame: { x: 80.0, y: 580.0, w: 300.0, h: 100.0 }
      properties:
        mainLanguage: kotlinjs
        isKotlinJsRoot: true
  # 3. The music. First line selects the tone head profile; the body is Kotlin compiled to JS.
  - create:
      box: agent_tone_synth_sequence
      name: Tone Synth Sequence
      frame: { x: 120.0, y: 690.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          // {{ tone }}
          // A tiny chord arpeggio played through a reverb, scheduled on the Transport.
          // Tone is installed as the global `Tone` in the RemoteAR head; every name below is
          // bound by afield.graphics.ToneKotlinJs and grounded against the vendored Tone.js.
          onStart {
              val synth = Tone.PolySynth()
              val reverb = Tone.Reverb(2.5)
              reverb.toDestination()
              synth.connect(reverb)
              synth.volume.value = -8.0

              val transport = Tone.getTransport()
              transport.bpm.value = 96.0

              val chord = arrayOf("C4", "E4", "G4", "B4")
              var step = 0
              val event = transport.scheduleRepeat({ time ->
                  val note = chord[step % chord.size]
                  synth.triggerAttackRelease(note, "8n", time)
                  step += 1
              }, "8n")

              // Tone.start() resumes the AudioContext; this follows the click inside the head.
              Tone.start()
              transport.start()
              log("tone: arpeggio scheduled at " + transport.bpm.value + " bpm")

              onStop {
                  transport.clear(event)
                  transport.stop()
                  synth.dispose()
                  reverb.dispose()
              }
          }
  # Nest the music box under the KotlinJS root so it compiles to JS for the head.
  - connect:
      parent: agent_tone_synth_sequence_root
      child: agent_tone_synth_sequence
  # Open the head first so it is connected before the music ships.
  - execute:
      box: agent_tone_head
      property: code
  - wait:
      frames: 2
  # Compile the // {{ tone }} box Kotlin -> JS and ship it to the connected head.
  - launch:
      box: agent_tone_synth_sequence
      property: code
  - await:
      wait: pending
