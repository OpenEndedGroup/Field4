name: uncrossed_leapers
description: |-
  Uncrossed leaper paths: knight paths and cycles whose moves never cross, by exhaustive branch and bound (afield.geometry.leaper), checked against OEIS A003192 and A157416; best found against the known optimum on 8×8 and 9×9; a gallery of five leapers on a rectangle, cylinder and torus; a sweep of how much of the board each covers; the longest 7×7 paths fed into the knight-tour workshop's line and arc views; a pen-plotter SVG sheet; and a box that checks a path drawn on the drawing layer. Pure CPU. Docs page: public/docs/uncrossed_leapers.md.
docs:
- page: uncrossed_leapers.md
  why: The search, the known values, the gallery and sweep, and how the paths feed the workshop.
- page: knight_tour_workshop.md
  why: The line and arc views boxes 6a and 6b come from.
operations:
- create:
    box: ul_knight
    name: 1 - longest uncrossed knight paths
    frame:
      x: 60.0
      y: 60.0
      w: 300.0
      h: 100.0
    properties:
      code: |
        import afield.geometry.leaper.*

        // The longest uncrossed knight path on each board from 3×3 to 7×7, by exhaustive search.
        // The table sets each result beside OEIS A003192, the known maxima.
        val sizes = 3..7
        val cell = 10.0
        var x = 0.0
        val results = sizes.map { n -> LeaperBoard(n, n).longestUncrossedPath() }
        val tiles = results.flatMap { r ->
            val tile = r.best!!.uncrossedTile(cell, x, 0.0) + leaperLabel("${r.board.w}×${r.board.w}  ${r.length}", x, -4.0)
            x += r.board.w * cell + 14.0
            tile
        }
        lines(tiles, w = 900.0, h = 230.0, fitToSize = true)
        markdown(
            "| board | moves found | A003192 | proved | nodes searched | ms |\n|---|---|---|---|---|---|\n" +
                results.joinToString("\n") { r ->
                    "| ${r.board.w}×${r.board.w} | ${r.length} | ${UNCROSSED_KNIGHT_PATH_MAXIMA[r.board.w - 1]} | " +
                        "${if (r.exhaustive) "yes" else "no"} | ${r.nodes} | ${r.millis} |"
                },
        )
- create:
    box: ul_big
    name: 2 - 8×8 and 9×9 against the known optimum
    frame:
      x: 760.0
      y: 60.0
      w: 300.0
      h: 100.0
    properties:
      code: |
        import afield.geometry.leaper.*

        // With a budget of node expansions the search stops early and reports the best path so far,
        // here against the known optima, 35 and 47. Proving 35 on 8×8 takes about 340 million nodes.
        val nodeBudget = 20_000_000L
        val cell = 10.0
        var x = 0.0
        val results = [8, 9].map { n -> LeaperBoard(n, n).longestUncrossedPath(nodeBudget = nodeBudget) }
        val tiles = results.flatMap { r ->
            val known = UNCROSSED_KNIGHT_PATH_MAXIMA[r.board.w - 1]
            val tile = r.best!!.uncrossedTile(cell, x, 0.0) + leaperLabel("${r.board.w}×${r.board.w}  ${r.length} of $known", x, -4.0)
            x += r.board.w * cell + 16.0
            tile
        }
        lines(tiles, w = 700.0, h = 360.0, fitToSize = true)
        results.forEach { r ->
            println("${r.board}: ${r.length} moves after ${r.nodes} nodes (${r.millis} ms); known optimum ${UNCROSSED_KNIGHT_PATH_MAXIMA[r.board.w - 1]}")
        }
- create:
    box: ul_cycles
    name: 3 - longest uncrossed knight cycles
    frame:
      x: 1460.0
      y: 60.0
      w: 300.0
      h: 100.0
    properties:
      code: |
        import afield.geometry.leaper.*

        // Closed tours: the path must come back to its first square, and the closing move may not
        // cross either. The known maxima are OEIS A157416.
        val sizes = 4..7
        val cell = 10.0
        var x = 0.0
        val results = sizes.map { n -> LeaperBoard(n, n).longestUncrossedPath(closed = true) }
        val tiles = results.flatMap { r ->
            val tile = r.best!!.uncrossedTile(cell, x, 0.0) + leaperLabel("${r.board.w}×${r.board.w}  ${r.length}", x, -4.0)
            x += r.board.w * cell + 14.0
            tile
        }
        lines(tiles, w = 900.0, h = 250.0, fitToSize = true)
        println(results.joinToString("; ") { r -> "${r.board.w}×${r.board.w}: ${r.length} (A157416 ${UNCROSSED_KNIGHT_CYCLE_MAXIMA[r.board.w - 1]}, ${r.nodes} nodes)" })
- create:
    box: ul_gallery
    name: 4 - five leapers on three surfaces
    frame:
      x: 60.0
      y: 900.0
      w: 300.0
      h: 100.0
    properties:
      code: |
        import afield.geometry.leaper.*

        // Five leapers on three surfaces, n×n. A cylinder joins the left and right edges; a torus also
        // joins top and bottom; a move may leave through a joined edge and come back through the other,
        // and "uncrossed" is judged on that surface. Dashed blue edges are joined.
        val n = 7
        val nodeBudget = 2_000_000L
        val leapers = [Leaper.KNIGHT, Leaper.CAMEL, Leaper.ZEBRA, Leaper.GIRAFFE, Leaper.ANTELOPE]
        val topologies = BoardTopology.entries
        val cell = 10.0
        val step = n * cell + 16.0
        val out = ArrayList<FLine>()
        val rows = ArrayList<String>()
        topologies.forEachIndexed { c, t -> out += leaperLabel(t.name.lowercase(), 34.0 + c * step, -6.0, 6.0) }
        leapers.forEachIndexed { r, leaper ->
            out += leaperLabel(leaper.name, 0.0, r * step + n * cell / 2, 5.0)
            val cellsText = topologies.mapIndexed { c, t ->
                val result = LeaperBoard(n, n, leaper, t).longestUncrossedPath(nodeBudget = nodeBudget)
                val x = 34.0 + c * step
                val y = r * step
                val path = result.best
                if (path != null) out += path.uncrossedTile(cell, x, y) else out += LeaperBoard(n, n, leaper, t).boardLines(cell, x, y)
                "${result.length}${if (result.exhaustive) "" else "?"}"
            }
            rows += "| ${leaper} | ${cellsText.joinToString(" | ")} |"
        }
        lines(out, w = 640.0, h = 1000.0, fitToSize = true)
        markdown("| $n×$n | rectangle | cylinder | torus |\n|---|---|---|---|\n" + rows.joinToString("\n") + "\n\n? = best found in $nodeBudget nodes, not proved")
- create:
    box: ul_sweep
    name: 5 - how much of the board each leaper covers
    frame:
      x: 760.0
      y: 900.0
      w: 300.0
      h: 100.0
    properties:
      code: |
        import afield.geometry.leaper.*

        // How much of the board each leaper can cover without crossing itself: the share of the n×n
        // squares its longest uncrossed path visits, for n = 4..9, on each surface. A hollow dot is a
        // best-found value (the search ran out of budget), a filled one is proved.
        val sizes = 4..9
        val nodeBudget = 300_000L
        val leapers = [Leaper.KNIGHT, Leaper.CAMEL, Leaper.ZEBRA, Leaper.GIRAFFE, Leaper.ANTELOPE]
        val colours = [vec(0.98, 0.85, 0.3, 1.0), vec(0.45, 0.8, 1.0, 1.0), vec(0.95, 0.45, 0.45, 1.0), vec(0.6, 0.9, 0.5, 1.0), vec(0.8, 0.6, 1.0, 1.0)]
        val panelW = 150.0
        val panelH = 100.0
        val out = ArrayList<FLine>()
        val table = StringBuilder("| surface | leaper | " + sizes.joinToString(" | ") { "$it×$it" } + " |\n|---|---|" + sizes.joinToString("") { "---|" } + "\n")
        BoardTopology.entries.forEachIndexed { p, t ->
            val ox = p * (panelW + 30.0)
            out += fline {
                moveTo(ox, 0.0)
                lineTo(ox, panelH)
                lineTo(ox + panelW, panelH)
                color = vec(1.0, 1.0, 1.0, 0.5)
                thickness = 0.8
            }
            out += leaperLabel(t.name.lowercase(), ox + 4.0, -6.0, 6.0)
            out += leaperLabel("100%", ox - 22.0, 2.0, 4.0)
            out += leaperLabel("n = ${sizes.first}", ox, panelH + 9.0, 4.0)
            out += leaperLabel("${sizes.last}", ox + panelW - 4.0, panelH + 9.0, 4.0)
            leapers.forEachIndexed { k, leaper ->
                val results = sizes.map { n -> LeaperBoard(n, n, leaper, t).longestUncrossedPath(nodeBudget = nodeBudget) }
                val pts = results.mapIndexed { i, r ->
                    val share = (if (r.best == null) 0.0 else r.length + 1.0) / (r.board.cells)
                    Triple(ox + i * panelW / (sizes.count() - 1), panelH * (1 - share), r)
                }
                out += fline {
                    pts.forEachIndexed { i, (x, y, _) -> if (i == 0) moveTo(x, y) else lineTo(x, y) }
                    color = colours[k]
                    thickness = 1.2
                }
                pts.forEach { (x, y, r) ->
                    out += fline {
                        circle(x, y, 2.2)
                        color = colours[k]
                        filled = r.exhaustive
                        thickness = 1.0
                    }
                }
                table.append("| ${t.name.lowercase()} | ${leaper.name} | " + results.joinToString(" | ") { "${it.length}${if (it.exhaustive) "" else "?"}" } + " |\n")
            }
        }
        leapers.forEachIndexed { k, leaper -> out += leaperLabel(leaper.name, k * 70.0, panelH + 24.0, 5.0, colours[k]) }
        lines(out, w = 900.0, h = 260.0, fitToSize = true)
        markdown(table.toString() + "\nMoves in the longest path found; ? = not proved within $nodeBudget nodes.")
- create:
    box: ul_tours
    name: 6 - uncrossed paths into the workshop views
    frame:
      x: 60.0
      y: 2000.0
      w: 300.0
      h: 100.0
    properties:
      code: |
        import afield.geometry.leaper.*
        import afield.runtime.execution.begin
        import kotlin.math.*
        import kotlin.random.Random

        // Longest uncrossed knight paths and cycles on 7×7, published under the knight-tour workshop's
        // property names, so the workshop's line and arc views connected below draw them unchanged.
        val w = 7
        val cell = 10.0
        val board = LeaperBoard(w, w)
        // The first four different results from seeds 1, 2, 3, ...: the search stops at the first path of `stopAt` moves.
        fun longest(closed: Boolean) = generateSequence(1) { it + 1 }
            .map { seed -> board.longestUncrossedPath(closed = closed, random = Random(seed), atLeast = 23, stopAt = 24).best!! }
            .distinctBy { it.cells.toList() }
            .take(4)
            .toList()
        // Row 1: open paths of the proved maximum, 24 moves. Row 2: closed cycles of 24 moves, with the
        // first square repeated at the end so the closing move is drawn.
        val paths = longest(closed = false)
        val cycles = longest(closed = true)
        val rows = [paths.map { it.cells }, cycles.map { it.cells + it.cells[0] }]

        // Sample the circumcircle A -> B -> C, choosing the sweep that passes through B.
        // Split at B so all three original points occur exactly in the sampled stroke.
        fun threePointArc(
            a: Pair<Double, Double>,
            b: Pair<Double, Double>,
            c: Pair<Double, Double>,
        ): List<Pair<Double, Double>> {
            val (ax, ay) = a
            val bx = b.first - ax
            val by = b.second - ay
            val cx = c.first - ax
            val cy = c.second - ay
            val cross = bx * cy - by * cx
            if (abs(cross) < 1e-9) return listOf(a, b, c)
            val bb = bx * bx + by * by
            val cc = cx * cx + cy * cy
            val ux = (bb * cy - cc * by) / (2 * cross)
            val uy = (bx * cc - cx * bb) / (2 * cross)
            val radius = hypot(ux, uy)
            val start = atan2(-uy, -ux)
            val middle = atan2(by - uy, bx - ux)
            val end = atan2(cy - uy, cx - ux)
            val tau = 2 * PI
            fun positive(angle: Double) = ((angle % tau) + tau) % tau
            val toMiddle = positive(middle - start)
            val toEnd = positive(end - start)
            val sweep = if (toMiddle <= toEnd) toEnd else toEnd - tau
            val firstSweep = if (sweep > 0) toMiddle else toMiddle - tau
            val result = mutableListOf(a)
            fun segment(angle: Double, delta: Double, endpoint: Pair<Double, Double>) {
                val steps = max(1, ceil(abs(delta) / (PI / 48)).toInt())
                for (j in 1 until steps) {
                    val theta = angle + delta * j / steps
                    result.add((ax + ux + radius * cos(theta)) to (ay + uy + radius * sin(theta)))
                }
                result.add(endpoint)
            }
            segment(start, firstSweep, b)
            segment(middle, sweep - firstSweep, c)
            return result
        }

        val arcRows = rows.map { row ->
            row.map { tour ->
                val points = tour.map { i -> ((i % w + 0.5) * cell) to ((i / w + 0.5) * cell) }
                points.windowed(3).map { q -> threePointArc(q[0], q[1], q[2]) }
            }
        }
        prop<List<List<IntArray>>>(knightTourRows) = rows
        prop<List<List<List<List<Pair<Double, Double>>>>>>(knightArcRows) = arcRows
        prop<Int>(knightBoardWidth) = w
        prop<Int>(knightBoardHeight) = w
        prop<Double>(knightCellSize) = cell

        val gap = 12.0
        val tiles = [paths, cycles].flatMapIndexed { r, row ->
            row.flatMapIndexed { c, path -> path.uncrossedTile(cell, c * (w * cell + gap), r * (w * cell + gap)) }
        }
        lines(tiles, fitToSize = true)
        println("Published ${paths.size} different 24-move paths and ${cycles.size} different 24-move cycles on 7×7.")
        children.forEach { it.begin() }
      preamble: |-
        var Box.knightTourRows by Inheritance<List<List<IntArray>>>() /**/
        val Once.knightTourRows by Onceing<List<List<IntArray>>>() /**/
        val Why.knightTourRows by Whying() /**/
        var Box.knightArcRows by Inheritance<List<List<List<List<Pair<Double, Double>>>>>>() /**/
        val Once.knightArcRows by Onceing<List<List<List<List<Pair<Double, Double>>>>>>() /**/
        val Why.knightArcRows by Whying() /**/
        var Box.knightBoardWidth by Inheritance<Int>() /**/
        val Once.knightBoardWidth by Onceing<Int>() /**/
        val Why.knightBoardWidth by Whying() /**/
        var Box.knightBoardHeight by Inheritance<Int>() /**/
        val Once.knightBoardHeight by Onceing<Int>() /**/
        val Why.knightBoardHeight by Whying() /**/
        var Box.knightCellSize by Inheritance<Double>() /**/
        val Once.knightCellSize by Onceing<Double>() /**/
        val Why.knightCellSize by Whying() /**/
- create:
    box: ul_lines
    name: 6a - workshop line experiments
    frame:
      x: 760.0
      y: 2000.0
      w: 300.0
      h: 100.0
    properties:
      code: |-
        import afield.math.linalg.*
        import kotlin.math.*

        /*
        Zipped layers: use [a, b, c] or a scalar. Short lists hold their last value.
        All geometry parameters are deliberately UNCLAMPED.
        Trims are fractions of the original move removed from each end.
        */
        val startTrim = [0]
        val endTrim = [0]
        val nextPull = [5.0]
        val previousPull = [-15.0, -10.0, -5.0, 0, 5.0, 10.0, 15.0]
        val rotationRadians = [0]
        val perpendicularOffset = [0.0]
        val alongSlide = 7 { it * 4 }
        val strokeWidth = 7 { 1 / (1 + it.d) }
        val gap = 12.0
        val cell = knightCellSize
        val w = knightBoardWidth
        val h = knightBoardHeight
        val boardW = w * cell
        val boardH = h * cell

        data class StrokeParameters(
            val startTrim: Double = 0.0,
            val endTrim: Double = 0.0,
            val nextPull: Double = 0.0,
            val previousPull: Double = 0.0,
            val rotation: Double = 0.0,
            val offset: Double = 0.0,
            val slide: Double = 0.0,
        )
        data class QuadraticStroke(val start: Vector2f, val control: Vector2f, val end: Vector2f)
        // Convert only at the parameter boundary; geometry stays strongly typed.
        fun parameterValues(value: Any): List<Double> = when (value) {
            is Number -> [value.toDouble()]
            is List<*> -> {
                require(value.isNotEmpty()) { "Parameter lists need at least one value." }
                value.map {
                    require(it is Number) { "Parameter values must be numbers." }
                    it.toDouble()
                }
            }
            else -> error("Use a number or a nonempty list of numbers.")
        }
        fun held(values: List<Double>, index: Int) = values.getOrElse(index) { values.last() }
        val channels = [startTrim, endTrim, nextPull, previousPull, rotationRadians, perpendicularOffset, alongSlide, strokeWidth].map {
            parameterValues(it)
        }
        val layerCount = channels.maxOf { it.size }
        val parameterSets =
            (0 until layerCount).map { i ->
                StrokeParameters(
                    held(channels[0], i),
                    held(channels[1], i),
                    held(channels[2], i),
                    held(channels[3], i),
                    held(channels[4], i),
                    held(channels[5], i),
                    held(channels[6], i),
                )
            }
        val layerWidths = (0 until layerCount).map { held(channels[7], it) }
        // Hold-last and scalar checks, including deliberately out-of-range values.
        check(parameterValues(-1.0) == [-1.0])
        check((0..3).map { held(parameterValues([11.0, -1.0]), it) } == [11.0, -1.0, -1.0, -1.0])
        check((0..2).map { held(parameterValues(4.0), it) } == [4.0, 4.0, 4.0])

        /*
        For move A->B, previous means the point before A; next means the point after B.
        Control pulls use unit directions from the trimmed midpoint to those ORIGINAL neighbours.
        Zero-length pull directions contribute zero; neither pulls nor trims are restricted.
        */
        fun makeStroke(a: Vector2f, b: Vector2f, previous: Vector2f?, next: Vector2f?, p: StrokeParameters): QuadraticStroke {
            val delta = b - a
            val start = a + delta * p.startTrim
            val end = b - delta * p.endTrim
            val middle = (start + end) * 0.5
            var control = middle
            if (next != null) control = control + (next - middle).normalized(1e-12f) * p.nextPull
            if (previous != null) control = control + (previous - middle).normalized(1e-12f) * p.previousPull
            // Axes follow the ORIGINAL A->B orientation, then rotate. Over-trimming does not flip them.
            val rotation = quat(p.rotation)
            val axis = delta.normalized(1e-12f) * rotation
            val normal = vec(-axis.y(), axis.x())
            val translation = normal * p.offset + axis * p.slide
            fun transform(q: Vector2f) = middle + (q - middle) * rotation + translation
            return QuadraticStroke(transform(start), transform(control), transform(end))
        }

        // Mathematical checks include extension, reversed endpoints and parameters outside [0,1].
        fun near(a: Vector2f, b: Vector2f) = (a - b).length() < 1e-5
        val aTest = vec(0.0, 0.0)
        val bTest = vec(10.0, 0.0)
        val identity = makeStroke(aTest, bTest, null, null, StrokeParameters())
        check(near(identity.start, aTest) && near(identity.end, bTest) && near(identity.control, vec(5.0, 0.0)))
        val extended = makeStroke(aTest, bTest, null, null, StrokeParameters(startTrim = -1.0, endTrim = -1.0))
        check(near(extended.start, vec(-10.0, 0.0)) && near(extended.end, vec(20.0, 0.0)))
        val reversed = makeStroke(aTest, bTest, null, null, StrokeParameters(startTrim = 2.0, endTrim = 2.0))
        check(near(reversed.start, vec(20.0, 0.0)) && near(reversed.end, vec(-10.0, 0.0)))
        val moved = makeStroke(aTest, bTest, null, null, StrokeParameters(rotation = PI / 2, offset = 2.0, slide = 3.0))
        check(near(moved.start, vec(3.0, -2.0)) && near(moved.end, vec(3.0, 8.0)))
        val pulled = makeStroke(aTest, bTest, null, vec(10.0, 10.0), StrokeParameters(nextPull = 11.0))
        check(abs((pulled.control - vec(5.0, 0.0)).length() - 11.0) < 1e-5)
        val pushed = makeStroke(aTest, bTest, vec(0.0, 10.0), null, StrokeParameters(previousPull = -11.0))
        check(near(pushed.control, vec(5.0, 0.0) + (vec(5.0, -10.0).normalized(1e-12f) * 11.0)))

        val pointRows = knightTourRows.map { row ->
            row.map { tour ->
                tour.map { i -> vec((i % w + 0.5) * cell, (i / w + 0.5) * cell) }
            }
        }
        val strokeRows = pointRows.map { row ->
            row.map { points ->
                parameterSets.map { parameters ->
                    (0 until points.size - 1).map { k ->
                        makeStroke(points[k], points[k + 1], points.getOrNull(k - 1), points.getOrNull(k + 2), parameters)
                    }
                }
            }
        }
        val tiles = strokeRows.flatMapIndexed { r, row ->
            row.flatMapIndexed { c, layers ->
                val background = fline {
                    moveTo(0, 0)
                    lineTo(boardW, 0)
                    lineTo(boardW, boardH)
                    lineTo(0, boardH)
                    close()
                    filled = true
                    stroked = false
                    color = vec(1.0, 1.0, 1.0, 0.06)
                }
                val paths = layers.mapIndexed { layerIndex, strokes ->
                    fline {
                        for (q in strokes) {
                            moveTo(q.start.x, q.start.y)
                            // Exact quadratic represented as a cubic (no sampling approximation).
                            val c1 = q.start + (q.control - q.start) * (2.0 / 3.0)
                            val c2 = q.end + (q.control - q.end) * (2.0 / 3.0)
                            cubicTo(c1.x, c1.y, c2.x, c2.y, q.end.x, q.end.y)
                        }
                        thickness = layerWidths[layerIndex]
                        color = vec(9.98 / (10 + r + c), 0.65, 0.3, 0.9)
                    }
                }
                (listOf(background) + paths).map { it + vec(c * (w * cell + gap), r * (h * cell + gap), 0.0) }
            }
        }
        lines(*tiles.toTypedArray(), fitToSize = true)
        println(
            "Parametric quadratic moves: " +
                strokeRows.sumOf { row -> row.sumOf { layers -> layers.sumOf { it.size } } } +
                ". " +
                parameterSets +
                ". Layers: $layerCount. Unclamped geometry and hold-last checks passed; inherited tours unchanged.",
        )
      preamble: |-
        var Box.knightTourRows by Inheritance<List<List<IntArray>>>() /*from:ul_tours*/ /**/
        val Once.knightTourRows by Onceing<List<List<IntArray>>>() /*from:ul_tours*/ /**/
        val Why.knightTourRows by Whying() /*from:ul_tours*/ /**/
        var Box.knightArcRows by Inheritance<List<List<List<List<Pair<Double, Double>>>>>>() /*from:ul_tours*/ /**/
        val Once.knightArcRows by Onceing<List<List<List<List<Pair<Double, Double>>>>>>() /*from:ul_tours*/ /**/
        val Why.knightArcRows by Whying() /*from:ul_tours*/ /**/
        var Box.knightBoardWidth by Inheritance<Int>() /*from:ul_tours*/ /**/
        val Once.knightBoardWidth by Onceing<Int>() /*from:ul_tours*/ /**/
        val Why.knightBoardWidth by Whying() /*from:ul_tours*/ /**/
        var Box.knightBoardHeight by Inheritance<Int>() /*from:ul_tours*/ /**/
        val Once.knightBoardHeight by Onceing<Int>() /*from:ul_tours*/ /**/
        val Why.knightBoardHeight by Whying() /*from:ul_tours*/ /**/
        var Box.knightCellSize by Inheritance<Double>() /*from:ul_tours*/ /**/
        val Once.knightCellSize by Onceing<Double>() /*from:ul_tours*/ /**/
        val Why.knightCellSize by Whying() /*from:ul_tours*/ /**/
- create:
    box: ul_arcs
    name: 6b - workshop perpendicular arcs
    frame:
      x: 1460.0
      y: 2000.0
      w: 300.0
      h: 100.0
    properties:
      code: |-
        import kotlin.math.*

        // Uniform scale about each triple's original B. 1.0 restores the source arcs.
        val arcScale = 0.5
        // Signed shift along the original A-to-C normal, applied after scaling.
        val arcPush = 0.0
        require(arcScale > 0.0)
        val boardWidth = knightBoardWidth
        val boardHeight = knightBoardHeight
        val cell = knightCellSize
        val boardW = boardWidth * cell
        val boardH = boardHeight * cell
        val gap = 12.0

        // B is tour[k+1], not the midpoint of the sampled arc's list.
        val arcCentres = knightArcRows.mapIndexed { r, row ->
            row.mapIndexed { t, arcs ->
                val tour = knightTourRows[r][t]
                check(arcs.size == tour.size - 2)
                arcs.indices.map { k ->
                    val b = tour[k + 1]
                    ((b % boardWidth + 0.5) * cell) to ((b / boardWidth + 0.5) * cell)
                }
            }
        }
        val arcOffsets = knightArcRows.map { row ->
            row.map { arcs ->
                arcs.map { arc ->
                    val dx = arc.last().first - arc.first().first
                    val dy = arc.last().second - arc.first().second
                    val length = hypot(dx, dy)
                    require(length > 1e-9)
                    (-dy / length * arcPush) to (dx / length * arcPush)
                }
            }
        }
        // Reuse the parent's sampling without mutating it or fitting circles again.
        val scaledRows = knightArcRows.mapIndexed { r, row ->
            row.mapIndexed { t, arcs ->
                arcs.mapIndexed { k, arc ->
                    val b = arcCentres[r][t][k]
                    val offset = arcOffsets[r][t][k]
                    arc.map { p ->
                        (b.first + arcScale * (p.first - b.first) + offset.first) to
                            (b.second + arcScale * (p.second - b.second) + offset.second)
                    }
                }
            }
        }

        var checkedArcs = 0
        var maxScaleError = 0.0
        var maxAnchorError = 0.0
        knightArcRows.forEachIndexed { r, row ->
            row.forEachIndexed { t, arcs ->
                arcs.forEachIndexed { k, arc ->
                    val b = arcCentres[r][t][k]
                    val offset = arcOffsets[r][t][k]
                    val shiftedB = (b.first + offset.first) to (b.second + offset.second)
                    val scaled = scaledRows[r][t][k]
                    check(scaled.size == arc.size)
                    val bIndex = arc.indexOf(b)
                    check(bIndex >= 0) { "The source arc must contain B exactly" }
                    val anchorError = hypot(scaled[bIndex].first - shiftedB.first, scaled[bIndex].second - shiftedB.second)
                    maxAnchorError = max(maxAnchorError, anchorError)
                    scaled.zip(arc).forEach { (q, p) ->
                        val error = abs(
                            hypot(q.first - shiftedB.first, q.second - shiftedB.second) -
                                arcScale * hypot(p.first - b.first, p.second - b.second),
                        )
                        maxScaleError = max(maxScaleError, error)
                        check(error < 1e-9)
                    }
                    check(anchorError < 1e-9)
                    checkedArcs++
                }
            }
        }

        val tiles = scaledRows.flatMapIndexed { r, row ->
            row.flatMapIndexed { t, arcs ->
                val background = fline {
                    moveTo(0, 0)
                    lineTo(boardW, 0)
                    lineTo(boardW, boardH)
                    lineTo(0, boardH)
                    close()
                    filled = true
                    stroked = false
                    color = vec(1.0, 1.0, 1.0, 0.06)
                }
                val path = fline {
                    for (arc in arcs) arc.forEachIndexed { k, p ->
                        if (k == 0) moveTo(p.first, p.second) else lineTo(p.first, p.second)
                    }
                    thickness = 0.7
                    color = vec(0.98, 0.85, 0.3, 0.8)
                }
                val offset = vec(t * (boardW + gap), r * (boardH + gap) + 24.0, 0.0)
                listOf(background, path).map { it + offset }
            }
        }
        val title =
            afield.ai.learning.pen.HersheyFont.load("futural")
                .text("Arc scale / " + arcScale + " about B / push " + arcPush, size = 7.0)
                .apply {
                    thickness = 0.5
                    color = vec(0.85, 0.85, 0.85, 1.0)
                }
        lines(listOf(title) + tiles, w = 900.0, h = 500.0, fitToSize = true)
        println(
            "Scaled " +
                checkedArcs +
                " arcs about B by " +
                arcScale +
                ". Maximum scale error: " +
                maxScaleError +
                "; B anchor error: " +
                maxAnchorError,
        )
      preamble: |-
        var Box.knightTourRows by Inheritance<List<List<IntArray>>>() /*from:ul_tours*/ /**/
        val Once.knightTourRows by Onceing<List<List<IntArray>>>() /*from:ul_tours*/ /**/
        val Why.knightTourRows by Whying() /*from:ul_tours*/ /**/
        var Box.knightArcRows by Inheritance<List<List<List<List<Pair<Double, Double>>>>>>() /*from:ul_tours*/ /**/
        val Once.knightArcRows by Onceing<List<List<List<List<Pair<Double, Double>>>>>>() /*from:ul_tours*/ /**/
        val Why.knightArcRows by Whying() /*from:ul_tours*/ /**/
        var Box.knightBoardWidth by Inheritance<Int>() /*from:ul_tours*/ /**/
        val Once.knightBoardWidth by Onceing<Int>() /*from:ul_tours*/ /**/
        val Why.knightBoardWidth by Whying() /*from:ul_tours*/ /**/
        var Box.knightBoardHeight by Inheritance<Int>() /*from:ul_tours*/ /**/
        val Once.knightBoardHeight by Onceing<Int>() /*from:ul_tours*/ /**/
        val Why.knightBoardHeight by Whying() /*from:ul_tours*/ /**/
        var Box.knightCellSize by Inheritance<Double>() /*from:ul_tours*/ /**/
        val Once.knightCellSize by Onceing<Double>() /*from:ul_tours*/ /**/
        val Why.knightCellSize by Whying() /*from:ul_tours*/ /**/
- create:
    box: ul_plotter
    name: 7 - a pen-plotter sheet
    frame:
      x: 60.0
      y: 2900.0
      w: 300.0
      h: 100.0
    properties:
      code: |
        import afield.geometry.leaper.*

        // A plotter sheet: the longest uncrossed knight paths on a 6×6 rectangle, cylinder and torus,
        // with their labels, as stroke-only SVG (board squares left out, the joined edges kept as dashes).
        val n = 6
        val cell = 10.0
        val sheet = ArrayList<FLine>()
        BoardTopology.entries.forEachIndexed { c, t ->
            val board = LeaperBoard(n, n, Leaper.KNIGHT, t)
            val r = board.longestUncrossedPath(nodeBudget = 3_000_000)
            val x = c * (n * cell + 20.0)
            sheet += board.boardLines(cell, x, 0.0)
            sheet += r.best!!.pathLine(cell, x, 0.0)
            sheet += leaperLabel("${t.name.lowercase()}  ${r.length}${if (r.exhaustive) "" else "?"}", x, n * cell + 10.0, 5.0)
        }
        val svg = plotterSvg(sheet, widthMm = 297.0, heightMm = 120.0, marginMm = 12.0)
        val file = java.io.File(System.getProperty("java.io.tmpdir"), "uncrossed_knights.svg")
        file.writeText(svg)
        display("plotter sheet", svg)
        println("${svg.lines().count { it.startsWith("<path") }} pen paths, ${svg.length} bytes -> $file")
- create:
    box: ul_draw
    name: 8 - is my drawing an uncrossed path?
    frame:
      x: 760.0
      y: 2900.0
      w: 300.0
      h: 100.0
    properties:
      code: |
        import afield.geometry.leaper.*

        // Draw a knight path on the board this box puts on the drawing layer (Alt+D, then the pen),
        // one stroke through the centres of the squares, and run the box again. It reads the newest
        // hand-drawn stroke over the board, snaps it to squares and says whether it is a legal
        // uncrossed path. Until you draw one it checks a demonstration stroke of its own.
        val n = 6
        val cell = 40.0
        val left = frame.x + frame.w + 60.0
        val top = frame.y
        val board = LeaperBoard(n, n)
        // The newest hand-drawn stroke that lies over the board (with a square's slack all round).
        val drawn = notation.strokes.lastOrNull { m ->
            val b = m.bounds
            m.handDrawn && b.x >= left - cell && b.y >= top - cell && b.x + b.w <= left + (n + 1) * cell && b.y + b.h <= top + (n + 1) * cell
        }
        // The demonstration: a1 b3 c5 e4 c3 d5 — the last move crosses the third.
        val demoCells = intArrayOf(0, 13, 26, 22, 14, 27)
        notation("board") {
            stroke = "#5c7cfa"
            for (i in 0 until n) for (j in 0 until n) if ((i + j) % 2 == 0) {
                rect(left + i * cell, top + j * cell, cell, cell, fill = "#dbe4ff", stroke = "transparent")
            }
            rect(left, top, n * cell, n * cell, fill = "transparent")
            if (drawn == null) {
                val pts = demoCells.map { c -> vec(left + (c % n + 0.5) * cell, top + (c / n + 0.5) * cell) }
                stroke(pts.zipWithNext().flatMap { (a, b) -> (0 until 12).map { k -> a + (b - a) * (k / 12.0) } } + pts.last(), name = "demo path", stroke = "#e8590c")
            }
        }
        val mark = drawn ?: notation.named("demo path")!!
        val pts = mark.points
        val cells = board.readDrawnPath(pts.map { it.x.toDouble() }.toDoubleArray(), pts.map { it.y.toDouble() }.toDoubleArray(), cell, left, top)
        val verdict = board.check(cells)
        val names = cells.joinToString(" ") { board.cellName(it) }
        val source = if (drawn == null) "the demonstration stroke" else "your stroke"
        markdown(
            if (verdict == null) "**Legal.** $source visits $names: an uncrossed path of ${cells.size - 1} moves " +
                "(the longest on $n×$n is ${UNCROSSED_KNIGHT_PATH_MAXIMA[n - 1]})."
            else "**Not legal.** $source visits $names: $verdict.",
        )
