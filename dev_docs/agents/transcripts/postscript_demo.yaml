name: postscript_demo
description: |
  **PostScript in a box.** A Kotlin root whose children are PostScript (see public/docs/postscript.md).
  Run each child box (Alt-Enter on the whole box). double and arrays print stacks; tree and rosette
  draw into their postscript panel; error marks line 3.
docs:
  - page: postscript.md
    why: "Explains PostScript boxes."
operations:
  - create:
      box: ps_root
      name: "postscript — children of this box are PostScript"
      frame: { x: 40.0, y: 40.0, w: 420.0, h: 80.0 }
      properties:
        mainLanguage: postscript
        isPostScriptRoot: true
        code: |
          // This root stays Kotlin; its `mainLanguage` makes the boxes under it PostScript.
          println("PostScript root")
  - create:
      box: ps_double
      name: "double"
      frame: { x: 180.0, y: 200.0, w: 220.0, h: 80.0 }
      properties:
        code_language: PostScript
        code: |
          % Run the box: ok · <1> 6
          /double {2 mul} def
          3 double
  - create:
      box: ps_arrays
      name: "arrays and control flow"
      frame: { x: 180.0, y: 320.0, w: 220.0, h: 80.0 }
      properties:
        code_language: PostScript
        code: |
          /fib {dup 2 ge {1 sub dup 1 sub fib exch fib add} {} ifelse} def
          [0 1 10 {fib} for] ==
          [0 1 9 {2 copy add} repeat] ==
          /reverse {[exch dup length 1 sub -1 0 {1 index exch get exch} for pop]} def
          [11 22 33] reverse ==
          0 { 1 add dup 10 ge {exit} if } loop
  - create:
      box: ps_tree
      name: "tree"
      frame: { x: 440.0, y: 200.0, w: 220.0, h: 80.0 }
      properties:
        code_language: PostScript
        code: |
          /branch { % length depth branch
            dup 0 gt {
              exch dup 0 0 moveto 0 exch lineto stroke
              dup 0 exch translate
              0.7 mul exch 1 sub
              gsave 25 rotate 2 copy branch grestore
              gsave -25 rotate branch grestore
            } { pop pop } ifelse
          } def

          0.55 0.85 0.4 setrgbcolor
          2 setlinewidth
          300 50 translate
          100 8 branch
  - create:
      box: ps_rosette
      name: "rosette"
      frame: { x: 440.0, y: 320.0, w: 220.0, h: 80.0 }
      properties:
        code_language: PostScript
        code: |
          200 200 translate
          1.5 setlinewidth
          0 1 35 {
            36 div 1 1 sethsbcolor
            newpath 0 0 moveto 120 0 60 40 0 60 curveto stroke
            10 rotate
          } for
  - create:
      box: ps_error
      name: "error"
      frame: { x: 700.0, y: 200.0, w: 220.0, h: 80.0 }
      properties:
        code_language: PostScript
        code: |
          % lineto with no current point: line 3 is marked
          newpath
          10 10 lineto
          stroke
  - connect: { parent: ps_root, child: ps_double }
  - connect: { parent: ps_root, child: ps_arrays }
  - connect: { parent: ps_root, child: ps_tree }
  - connect: { parent: ps_root, child: ps_rosette }
  - connect: { parent: ps_root, child: ps_error }
