name: audio_curve_explorer
description: >
  Rolling perceptual audio curves: a recording analysed into one moving curve per channel (mel
  spectra, Wasserstein distances, MDS, Procrustes alignment), drawn as FLines in the Three.js viewer
  at whatever time Field's waveform player is playing or scrubbing.
docs:
  - page: audio_curves.md
    why: "Explains rolling audio curves, how they are computed and the .f4curve file."
operations:
  - create:
      box: audio_curve_voice
      name: 1 · a film voice — play or scrub the waveform
      frame: { x: 40.0, y: 40.0, w: 460.0, h: 100.0 }
      properties:
        code: |
          val wav = "%docs/assets/subharmonic_sound/notld-barbara-source.wav".path
          val curve = audioCurves(wav).first()
          val scale = 100 / curve.extent()

          // The player keeps the audio clock and tells us where it is, or where you are scrubbing.
          var t = 2.0
          displayAudioBytes(
              wav.toFile().readBytes(),
              options = AudioVisualizerOptions(initialPositionSeconds = t, onTime = { t = it }),
          )

          // A faint box around where the curve lives: something to orbit against.
          val room = fline {
              for (z in [-150.0, 0.0]) {
                  moveTo(-120, -120, z); lineTo(120, -120, z); lineTo(120, 120, z); lineTo(-120, 120, z); lineTo(-120, -120, z)
              }
              for (x in [-120, 120]) for (y in [-120, 120]) { moveTo(x, y, -150); lineTo(x, y, 0) }
              color = vec(1, 1, 1, 0.12)
          }

          var shown = Double.NaN
          loop {
              val frame = curve.frameAt(t)
              if (frame != null && frame.timeSeconds != shown) {
                  shown = frame.timeSeconds
                  threeLines(frame.flines(scale, depth = 150.0) + room, channel = "curve", height = 560)
              }
          }.end { curve.close() }
  - create:
      box: audio_curve_music
      name: 2 · stereo music, one curve per channel
      frame: { x: 1240.0, y: 40.0, w: 460.0, h: 100.0 }
      properties:
        code: |
          val wav = "%docs/assets/audio_ai_muscriptor/source.wav".path
          val curves = audioCurves(wav)
          val colors = [vec(0.39, 0.78, 0.86, 1.0), vec(0.96, 0.70, 0.36, 1.0)]

          var t = 3.0
          displayAudioBytes(
              wav.toFile().readBytes(),
              options = AudioVisualizerOptions(initialPositionSeconds = t, onTime = { t = it }),
          )

          var shown = Double.NaN
          loop {
              val frames = curves.map { it.frameAt(t) }
              val time = frames.firstOrNull()?.timeSeconds
              if (time != null && time != shown) {
                  shown = time
                  // Left channel on the left, right on the right; each channel has its own axes.
                  val lines = frames.flatMapIndexed { i, frame ->
                      val offset = vec(if (i == 0) -110.0 else 110.0, 0.0, 0.0)
                      frame!!.flines(80 / curves[i].extent(), depth = 150.0, color = colors[i]).map { it + offset }
                  }
                  threeLines(lines, channel = "curves", height = 520)
              }
          }.end { curves.forEach { it.close() } }
  - create:
      box: audio_curve_dense
      name: 3 · finer hop, longer memory
      frame: { x: 2440.0, y: 40.0, w: 460.0, h: 100.0 }
      properties:
        code: |
          val wav = "%docs/assets/subharmonic_sound/notld-barbara-source.wav".path
          // A curve every 256 samples (5.3 ms at 48 kHz) that remembers 384 spectra (2 s).
          val curve = audioCurves(wav, AudioCurveSettings(hopSize = 256, history = 384)).first()
          val scale = 100 / curve.extent()

          var t = 2.0
          displayAudioBytes(
              wav.toFile().readBytes(),
              options = AudioVisualizerOptions(initialPositionSeconds = t, onTime = { t = it }),
          )

          var shown = Double.NaN
          loop {
              val frame = curve.frameAt(t)
              if (frame != null && frame.timeSeconds != shown) {
                  shown = frame.timeSeconds
                  threeLines(frame.flines(scale, depth = 300.0, bands = 16), channel = "curve", height = 560)
              }
          }.end { curve.close() }
