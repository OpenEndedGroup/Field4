name: learned_shader
description: 'A user-trained function in a shader: original, approximation and error; ordinary arithmetic or cooperative
  vectors.'
operations:
- create:
    box: agent_graphics_context
    name: renderer
    frame:
      x: 40.0
      y: 40.0
      w: 300.0
      h: 100.0
    properties:
      code: "import afield.four.util.Options\n\nprop<Window>(window)\nprop<Renderer>(renderer)\n\nOptions.enableVR\
        \ = false\nOptions.enableHDR = false\nOptions.profiling = false\n\nonce.renderer {\n    window = Window(\"\
        Field\")\n    Renderer(window)\n}\n\nprintln(\"agent graphics renderer ready\")\nstart(renderer::run)\n"
- launch:
    box: agent_graphics_context
    property: code
    type: code
    strand: renderer
    code: "import afield.four.util.Options\n\nprop<Window>(window)\nprop<Renderer>(renderer)\n\nOptions.enableVR\
      \ = false\nOptions.enableHDR = false\nOptions.profiling = false\n\nonce.renderer {\n    window = Window(\"\
      Field\")\n    Renderer(window)\n}\n\nprintln(\"agent graphics renderer ready\")\nstart(renderer::run)\n"
- wait:
    frames: 3
- create:
    box: learned_shader
    name: learned shader
    frame:
      x: 400.0
      y: 160.0
      w: 420.0
      h: 100.0
    properties:
      code: "import afield.controlGroup\nimport afield.displayOpen\nimport afield.four.neural.*\nimport afield.four.modules.fromContextWithNameOrNull\n\
        \nprop<LearnedShader>(lab)\nfromContextWithNameOrNull<LearnedShader>(\"lab\")?.close()\nvar cooperative=renderer.device.supportsCooperativeVector\n\
        var active=cooperative\nvar requestedView=2\nvar animate=true\nvar reload=false\nlab=LearnedShader(renderer,cooperative=cooperative)\n\
        controlGroup(\"learned shader\") {\n    checkbox(\"Cooperative vectors\",initialValue=cooperative) { cooperative=it\
        \ }\n    slider(\"0: Original · 1: Learned · 2: Compare\",min=0.0,max=2.0,step=1.0,initialValue=2.0) { requestedView=it.toInt()\
        \ }\n    checkbox(\"Animate time\",initialValue=true) { animate=it }\n    button(\"Reload trained weights\"\
        ) { if(it)reload=true }\n}\ndisplayOpen(\"learned shader\")\nprintln(\"Compare: original / learned / absolute\
        \ RGB error × 8. Weights describe a 16 → 32 → 32 → 3 network.\")\nframes {\n    var time=0.0\n    while(true)\
        \ {\n        if(cooperative!=active || reload) {\n            runCatching {\n                val next=LearnedShader(renderer,cooperative=cooperative,attach=false)\n\
        \                lab.close();lab=next.attach();active=cooperative\n            }.onFailure { println(\"\
        Keeping working shader: ${it.message}\");cooperative=active }\n            reload=false\n        }\n   \
        \     lab.view=requestedView\n        if(animate)time+=.01\n        lab.time=kotlin.math.sin(time).toFloat()\n\
        \        frame()\n    }\n}.end { lab.close() }\n"
- connect:
    parent: agent_graphics_context
    child: learned_shader
- launch:
    box: learned_shader
    property: code
    type: code
    strand: scene
    code: "import afield.controlGroup\nimport afield.displayOpen\nimport afield.four.neural.*\nimport afield.four.modules.fromContextWithNameOrNull\n\
      \nprop<LearnedShader>(lab)\nfromContextWithNameOrNull<LearnedShader>(\"lab\")?.close()\nvar cooperative=renderer.device.supportsCooperativeVector\n\
      var active=cooperative\nvar requestedView=2\nvar animate=true\nvar reload=false\nlab=LearnedShader(renderer,cooperative=cooperative)\n\
      controlGroup(\"learned shader\") {\n    checkbox(\"Cooperative vectors\",initialValue=cooperative) { cooperative=it\
      \ }\n    slider(\"0: Original · 1: Learned · 2: Compare\",min=0.0,max=2.0,step=1.0,initialValue=2.0) { requestedView=it.toInt()\
      \ }\n    checkbox(\"Animate time\",initialValue=true) { animate=it }\n    button(\"Reload trained weights\"\
      ) { if(it)reload=true }\n}\ndisplayOpen(\"learned shader\")\nprintln(\"Compare: original / learned / absolute\
      \ RGB error × 8. Weights describe a 16 → 32 → 32 → 3 network.\")\nframes {\n    var time=0.0\n    while(true)\
      \ {\n        if(cooperative!=active || reload) {\n            runCatching {\n                val next=LearnedShader(renderer,cooperative=cooperative,attach=false)\n\
      \                lab.close();lab=next.attach();active=cooperative\n            }.onFailure { println(\"Keeping\
      \ working shader: ${it.message}\");cooperative=active }\n            reload=false\n        }\n        lab.view=requestedView\n\
      \        if(animate)time+=.01\n        lab.time=kotlin.math.sin(time).toFloat()\n        frame()\n    }\n\
      }.end { lab.close() }\n"
- wait:
    frames: 12
- create:
    box: learned_material
    name: editable learned material
    frame:
      x: 400.0
      y: 340.0
      w: 420.0
      h: 100.0
    properties:
      code: "import afield.four.neural.LearnedShader\nimport afield.four.modules.fromContextWithNameOrNull\n\n//\
        \ A separate scene: stop the original learned-shader box before launching this one.\n// Edit this box's\
        \ fragment property while it runs; the network stays allocated.\nprop<AutoCloseable>(materialSession)\n\
        fromContextWithNameOrNull<AutoCloseable>(\"materialSession\")?.close()\nval owner=renderer\nval passName=\"\
        editable learned material\"\nval learned=LearnedShader(owner,name=passName,attach=false)\nlearned.view=1\n\
        learned.setParameter(.25f)\nprop<RenderToTexture>(learnedImage)=learned.output\nval material=moduleHere\
        \ { depthTest=false; depthWrite=false; blend=false }\nval triangle=Mesh(owner,material)\ntriangle.resize(3,0,material)\n\
        material += \"fullscreen\" to triangle\n\n// Compute and resolve run before this ordinary fragment shader\
        \ samples their RTT.\nowner.renderList.preTargets[passName]=learned\nowner.renderList.modules[passName]=material\n\
        var closed=false\nmaterialSession=AutoCloseable {\n    if(!closed) {\n        closed=true\n        owner.renderList.modules.remove(passName,material)\n\
        \        if(!owner.isClosed) {\n            learned.close()\n            owner.cleanup+=Runnable { material.current.cleanup()\
        \ }\n        }\n    }\n}\nval ownedSession=materialSession\nprintln(\"Edit fragment: the learnedImage texture\
        \ comes from the unchanged network. Stop the original comparison box to avoid rendering it too.\")\nframes\
        \ { while(!closed && !owner.isClosed)frame() }.end { ownedSession.close() }\n"
      vertex: "#version 460\nlayout(location=0) out vec2 uv;\nvoid main() {\n    vec2 p=vec2((gl_VertexIndex<<1)&2,gl_VertexIndex&2);\n\
        \    uv=vec2(p.x,1-p.y);\n    gl_Position=vec4(p*2-1,0,1);\n}\n"
      fragment: "#version 460\nlayout(set=0,binding=0) uniform sampler2D learnedImage;\nlayout(location=0) in vec2\
        \ uv;\nlayout(location=0) out vec4 color;\nvoid main() {\n    // The left half is the model's RGB; the right\
        \ is an editable treatment.\n    vec2 st=vec2(fract(uv.x*2),uv.y);\n    vec3 base=texture(learnedImage,st).rgb;\n\
        \    vec3 treatment=mix(base,base.gbr,.65);\n    treatment*=.85+.15*sin(st.y*160);\n    color=vec4(uv.x<.5\
        \ ? base : treatment,1);\n}\n"
- connect:
    parent: agent_graphics_context
    child: learned_material
