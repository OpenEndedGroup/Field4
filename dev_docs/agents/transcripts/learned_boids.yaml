name: learned_boids
description: |
  A flock whose interaction rule is a **trained network**, running beside the hand-written rule it
  learned from. Four boxes — a renderer, a training step, and two flocks.

  The left flock is classical Reynolds boids: separation, alignment, cohesion, three numbers you
  can edit. The right flock is a Deep Sets network, about a thousand parameters, that was shown the
  left flock's rule for a few seconds and fitted it:

  ```
  a_i = phi( v_i, SUM_j psi(x_j - x_i, v_j - v_i), MEAN_j psi(...) )
  ```

  Nothing else differs. Same buffer layout, same neighbour search, same integration, same speed
  limit — `ShaderBoids` takes a `learned` argument and branches only where the force is computed,
  so the two boxes are an A/B of the rule and of nothing else.

  **The neighbour search is the reason this is possible at all.** A flocking rule is a sum over
  *nearby* particles, and finding those without looking at everybody needs a sort: hash each boid
  to a grid cell, sort the pairs with `GpuRadixSort` so a cell's members land in one contiguous
  run, then walk the 3x3 block of cells around your own. That is `GpuNeighbourGrid`, and
  `four.neighbour-grid.smoke` checks its answers against brute force as *sets* — not as forces,
  because a query that quietly misses a tenth of its neighbours produces a force a few percent out
  and a flock that still looks like a flock.

  Things worth trying, all live:

    - `separation`, `alignment`, `cohesion` on the left box. Note the values: `0.02 / 3 / 200`.
      Separation matches the textbook `0.02 / 1.2 / 0.8`; alignment and cohesion are far above it.
      The weights are not scale-free — separation *sums* over neighbours while the other two take
      *means*, so their relative strength depends on the density and on the interaction radius.
      Measured here, the textbook numbers put separation 27x above alignment and 4600x above
      cohesion, and the flock spreads out evenly instead of gathering. The right box does not
      follow — it learned the rule as it was when you trained it, so the two flocks diverge the
      moment you edit one. To catch it up, put the same three numbers in the training box (it
      hard-codes them), run it, then run the right box: it builds a new flock on the new rule.
    - `driverStrength` from `-0.9f` (flee) through `0f` (nothing) to `+0.9f` (chase). At zero both
      flocks settle within a few seconds into something that reads as static, and that is not a
      bug — the motion you would otherwise be admiring in the learned flock used to come from its
      broken rotational symmetry shoving it along. Whether the settled state is genuinely *still*
      or only looks it is a different question: on a smaller CPU flock at these weights the
      residual force oscillates without trending, so "settled" there is steady churn, not rest.
    - `containment` down to `0f` on either box. The flock leaves. There is no boundary in Reynolds
      boids and nothing conserved; the containment term is scaffolding, not physics.
    - `dt` from `1/60f` down to `1/240f`. Boids is chaotic, so the two flocks separate visibly
      within a few seconds whatever you do — which is exactly why the tests grade the *force* at
      `dt = 0` and never a trajectory.
    - `steps` in the training box, from `4000` down to `300`. Under-trained, the right flock still
      flocks. That is the trap this whole exercise is about: almost any attraction-and-repulsion
      rule with a speed limit produces something an audience accepts, so "it flocks" is not
      evidence of anything. The number that means something is in `DeepSetsInteractionTest`:
      relative error against the true force, 0.106, where predicting the average scores 0.999.

  One honest note on what was handed to the network. `psi` is not fed the raw offset — it gets the
  unit direction times a small radial basis, because separation goes as `1/r` over a four-hundred
  fold range and a `tanh` net cannot build that product out of Cartesian components. Fed raw
  offsets it scores 0.71, which is barely better than predicting the mean. The feature map is a
  claim about radial interactions in general rather than about boids, but it is help, and it was
  found by ablating the target term by term rather than by guessing.

  `tools/run_field_tests.py --id four.shader-boids.smoke` grades both rules against a CPU brute
  force, and `--id four.neighbour-grid.smoke` grades the search underneath them.
docs:
  - page: neural_particles.md
    why: "Explains training an interaction rule and running it as a flock."
operations:
  - create:
      box: lb_renderer
      name: renderer
      frame: { x: 40.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          import afield.graphics.vulkan.util.Options

          prop<Window>(window)
          prop<Renderer>(renderer)
          Options.enableHDR = false
          Options.profiling = false
          // One window and renderer, published to every child as `renderer`.
          once.renderer {
              window = Window("Learned boids")
              Renderer(window)
          }
          println("renderer ready")
          start(renderer::run)
  - create:
      box: lb_train
      name: train the rule
      frame: { x: 380.0, y: 40.0, w: 320.0, h: 100.0 }
      properties:
        code: |
          prop<afield.ai.learning.EquivariantWeights>(learnedRule)

          val radius = 2f / 64f
          val minSeparation = radius * 0.05f
          val velocityScale = 0.4f
          val random = java.util.Random(5)

          /*
          The rule being imitated, evaluated on random neighbourhoods. No simulation is needed
          to generate training data when you already have the law -- and having the law is what
          makes the result gradeable at all.
          */
          fun sample(): InteractionExample {
              val v = floatArrayOf(
                  (random.nextDouble() * 2 - 1).toFloat() * velocityScale,
                  (random.nextDouble() * 2 - 1).toFloat() * velocityScale,
              )
              /*
              Up to 70 neighbours: the gathered flock runs at about 57 per boid, so train on the
              density you will run at. Cohesion weights the *mean* offset by 200, so a small error
              in the meaned branch becomes a large force.
              */
              val neighbours = (0..random.nextInt(70)).map {
                  val r = radius * Math.sqrt(random.nextDouble()).toFloat()
                  val a = random.nextDouble() * 2 * Math.PI
                  floatArrayOf(
                      (r * Math.cos(a)).toFloat(),
                      (r * Math.sin(a)).toFloat(),
                      (random.nextDouble() * 2 - 1).toFloat() * velocityScale,
                      (random.nextDouble() * 2 - 1).toFloat() * velocityScale,
                  )
              }
              var sx = 0f
              var sy = 0f
              var dvx = 0f
              var dvy = 0f
              var dx = 0f
              var dy = 0f
              for (n in neighbours) {
                  val d = Math.hypot(n[0].toDouble(), n[1].toDouble()).toFloat()
                  // Separation is short range; cohesion and alignment see the whole radius. One
                  // radius for all three cannot clump -- see BoidSettings.separationRadiusFraction.
                  if (d <= radius * 0.25f) {
                      val soft = maxOf(d, minSeparation)
                      sx -= n[0] / (soft * soft)
                      sy -= n[1] / (soft * soft)
                  }
                  dvx += n[2]
                  dvy += n[3]
                  dx += n[0]
                  dy += n[1]
              }
              // Same weights as the written box: separation summed, alignment and cohesion meaned.
              val c = neighbours.size.toFloat()
              return InteractionExample(
                  v,
                  neighbours,
                  floatArrayOf(
                      0.02f * sx + 3.0f * dvx / c + 200f * dx / c,
                      0.02f * sy + 3.0f * dvy / c + 200f * dy / c,
                  ),
              )
          }

          // Published to the children as `learnedRule`; rerun this box to retrain.
          learnedRule = trainEquivariant(
              radius = radius,
              velocityScale = velocityScale,
              accelScale = 20f,
              sumScale = 8f,
              minSeparation = minSeparation,
              /*
              The *equivariant* form: psi emits scalars that multiply the neighbour's own
              direction and velocity difference, so rotating the flock rotates the force
              exactly and a symmetric neighbourhood gives identically zero. Without that, a
              fixed-direction residual grows with crowding and drifts the flock out of its
              containment.

              psi runs once per neighbour per boid, so it is nearly all of this scene's GPU cost.
              8x8 with a 4-wide message (library default 16x16 and 6) is about three times
              cheaper for a slightly worse fit. Keep two layers: one layer of 16 costs more and
              fits worse.
              */
              options = DeepSetsOptions(
                  steps = 4000,
                  batch = 16,
                  seed = 5,
                  psiHidden = intArrayOf(8, 8),
                  messageWidth = 4,
              ),
          ) {
                  List(16) { sample() }
              }

          println("trained ${learnedRule.parameterCount} parameters: ${learnedRule}")
  - create:
      box: lb_written
      name: written rule
      frame: { x: 740.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          import afield.simulation.physics.ShaderBoids

          prop<afield.simulation.physics.ShaderBoids>(written)

          // Built once: GPU buffers, neighbour grid and draw pass. Everything below is live.
          once.written {
              val grid = GpuNeighbourGrid(
                  capacity = 12000,
                  cellsPerSide = 64,
                  domainMin = Vector2f(-1f, -1f),
                  domainSize = 2f,
                  renderer = renderer,
                  name = "writtenGrid",
              )
              ShaderBoids(grid, 12000, renderer) {
                      name = "written"
                      radius = 2f / 64f
                  }
                  .also {
                      it.reset(Vector2f(-0.95f, -0.5f), 1.0f, speed = 0.2f, seed = 3)
                      it.install(renderer.renderList.others)
                      it.installDrawInto()
                  }
          }

          /*
          The rule's weights. Live: the push buffer re-reads these every frame, so edit and
          rerun. They are far from the textbook 0.02/1.2/0.8 because separation *sums* over
          ~57 neighbours while alignment and cohesion take *means*; these bring the three
          terms to the same order at this density and radius. The training box hard-codes the
          same three numbers -- rerun it after changing them.
          */
          written.settings.separation = 0.02f
          written.settings.separationRadiusFraction = 0.25f
          written.settings.alignment = 3.0f
          written.settings.cohesion = 200f
          written.settings.maxSpeed = 0.25f
          /*
          Weak and wide on purpose. A stiff containment squeezes everything into one disc;
          give the flock room and cohesion only reaches one interaction radius, so groups that
          drift apart can never find each other again and you get several clumps instead of one.
          */
          written.settings.containment = 1.5f
          written.settings.containmentRadius = 0.44f
          written.settings.containmentCenter = Vector2f(-0.45f, 0f)
          written.settings.dt = 1f / 60f
          written.settings.pointSize = 3f
          written.settings.intensity = 1.5f

          /*
          A wandering point the flock flees (negative driverStrength). Left alone the flock
          settles into a near-static disc, so the motion comes from outside the rule. The
          learned box runs the identical walk about its own centre, so the A/B stays fair.

          Called every frame. It is stateless: a seeded random target every 70 frames,
          smoothstepped between, so calling it twice in a frame gives the same point.
          */
          written.driver = {
              val t = renderer.frameCounter / 70.0
              val i = Math.floor(t).toLong()
              fun at(k: Long): Vector2f {
                  val r = java.util.Random(k * 0x9E3779B9L)
                  return Vector2f(
                      -0.45f + (r.nextFloat() * 2 - 1) * 0.30f,
                      0f + (r.nextFloat() * 2 - 1) * 0.30f,
                  )
              }
              val a = at(i)
              val b = at(i + 1)
              val f = (t - i).toFloat()
              val e = f * f * (3 - 2 * f)
              Vector2f(a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e)
          }
          written.settings.driverStrength = -0.9f
          written.settings.driverRadius = 0.22f

          println("written rule: ${written.count} boids")
  - create:
      box: lb_learned
      name: learned rule
      frame: { x: 1080.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          import afield.simulation.physics.ShaderBoids

          /*
          `learnedRule` is the trained network from the parent box. The only difference from
          the written flock is this argument.

          A flock compiles its rule into its shaders, so it is cached on the rule: retrain the
          parent and the next run builds a new flock, releasing the old one.
          */
          val learned = cached<ShaderBoids>(learnedRule, renderer) {
              val grid = GpuNeighbourGrid(
                  capacity = 12000,
                  cellsPerSide = 64,
                  domainMin = Vector2f(-1f, -1f),
                  domainSize = 2f,
                  renderer = renderer,
                  name = "learnedGrid",
              )
              ShaderBoids(grid, 12000, renderer, equivariant = learnedRule) {
                      name = "learned"
                      radius = 2f / 64f
                  }
                  .also {
                      it.reset(Vector2f(-0.05f, -0.5f), 1.0f, speed = 0.2f, seed = 3)
                      it.install(renderer.renderList.others)
                      it.installDrawInto()
                  }
          }

          // The identical walk about this flock's own centre, so the two see the same forcing.
          learned.driver = {
              val t = renderer.frameCounter / 70.0
              val i = Math.floor(t).toLong()
              fun at(k: Long): Vector2f {
                  val r = java.util.Random(k * 0x9E3779B9L)
                  return Vector2f(
                      0.45f + (r.nextFloat() * 2 - 1) * 0.30f,
                      0f + (r.nextFloat() * 2 - 1) * 0.30f,
                  )
              }
              val a = at(i)
              val b = at(i + 1)
              val f = (t - i).toFloat()
              val e = f * f * (3 - 2 * f)
              Vector2f(a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e)
          }
          learned.settings.driverStrength = -0.9f
          learned.settings.driverRadius = 0.22f

          // Everything except the force rule matches the written box; only the colours differ.
          learned.settings.separationRadiusFraction = 0.25f
          learned.settings.maxSpeed = 0.25f
          learned.settings.containment = 1.5f
          learned.settings.containmentRadius = 0.44f
          learned.settings.containmentCenter = Vector2f(0.45f, 0f)
          learned.settings.dt = 1f / 60f
          learned.settings.pointSize = 3f
          learned.settings.intensity = 1.5f
          learned.settings.slowColor = vec(0.95, 0.25, 0.45, 1.0)
          learned.settings.fastColor = vec(1.0, 0.85, 0.45, 1.0)
          println("learned rule: ${learned.count} boids")
  - connect: { parent: lb_renderer, child: lb_train }
  - connect: { parent: lb_train, child: lb_written }
  - connect: { parent: lb_train, child: lb_learned }
  - launch: { box: lb_renderer, property: code }
  - await: { wait: pending }
  - launch: { box: lb_train, property: code }
  - await: { wait: pending }
  - launch: { box: lb_written, property: code }
  - await: { wait: pending }
  - launch: { box: lb_learned, property: code }
  - await: { wait: pending }
