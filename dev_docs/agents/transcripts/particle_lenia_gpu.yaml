name: particle_lenia_gpu
description: >
  Particle Lenia on the GPU (public/docs/particle_lenia.md, "Thousands of particles on the GPU"):
  a renderer box and, beneath it, ShaderParticleLenia running 6400 particles (64 clusters of 100)
  under the rotator rule (sigmaK 0.6, cRep 0.3) over a GpuNeighbourGrid, 20 steps per frame, drawn
  as points tinted by energy in the native window.
docs:
  - page: particle_lenia.md
    why: "The GPU section's native-window capture is taken from this scene."
operations:
  - create:
      box: plg_renderer
      name: renderer
      frame: { x: 40.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          import afield.graphics.vulkan.util.Options

          prop<Window>(window)
          prop<Renderer>(renderer)
          Options.enableHDR = false
          Options.profiling = false
          once.renderer {
              window = Window("Particle Lenia")
              Renderer(window)
          }
          println("renderer ready")
          start(renderer::run)
  - create:
      box: plg_lenia
      name: "6400 Particle Lenia particles"
      frame: { x: 40.0, y: 200.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          import afield.simulation.physics.ShaderParticleLenia

          prop<ShaderParticleLenia>(lenia)

          // 64 clusters of 100 particles under the rotator rule: 6400 particles, one creature per cluster.
          once.lenia {
              val grid = GpuNeighbourGrid(
                  capacity = 6400,
                  cellsPerSide = 40,
                  domainMin = Vector2f(-120f, -120f),
                  domainSize = 240f,
                  renderer = renderer,
                  name = "leniaGrid",
              )
              ShaderParticleLenia(grid, 6400, renderer, ParticleLeniaParams(sigmaK = 0.6, cRep = 0.3), name = "lenia")
                  .also {
                      it.reset(creatures = 64, perCreature = 100, side = 8.5f, spacing = 26f, seed = 1)
                      it.install(renderer.renderList.others)
                      it.installDrawInto()
                  }
          }

          lenia.substeps = 20
          lenia.pointSize = 3f
          lenia.viewScale = 110f
          println("particles: " + lenia.count + ", cutoff " + lenia.cutoff + ", cell " + lenia.grid.cellSize)
  - connect: { parent: plg_renderer, child: plg_lenia }
  - launch: { box: plg_renderer, property: code }
  - await: { wait: pending }
  - launch: { box: plg_lenia, property: code }
  - await: { wait: pending }
