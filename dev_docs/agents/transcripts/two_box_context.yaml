name: two_box_context
description: Create a parent/child pair and verify inherited graph context from the child.
docs:
  - page: running_code.md#property-inheritance-how-children-see-a-parents-values
    why: "How a child box sees the values and context its parents publish."
operations:
  - create:
      box: agent_context_parent
      name: Agent Context Parent
      frame:
        x: 80.0
        y: 260.0
        w: 300.0
        h: 100.0
      properties:
        code: |
          prop<String>(greeting) = "value from parent"
          println("parent context ready")
  - create:
      box: agent_context_child
      name: Agent Context Child
      frame:
        x: 460.0
        y: 260.0
        w: 300.0
        h: 100.0
      properties:
        code: |
          println("child inherited: $greeting")
  - connect:
      parent: agent_context_parent
      child: agent_context_child
  - execute:
      box: agent_context_parent
      property: code
      type: fragment
      code: |
        prop<String>(greeting) = "value from parent"
        println("parent context ready")
  - execute:
      box: agent_context_child
      property: code
      type: fragment
      code: |
        println("child inherited: $greeting")
  - wait:
      millis: 250
