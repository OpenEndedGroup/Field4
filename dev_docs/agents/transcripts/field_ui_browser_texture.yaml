name: field_ui_browser_texture
description: |
  The recursive proof: Field's own live browser UI arrives from Electron as a GPU shared texture
  and is sampled by a mesh in Field's Vulkan renderer. The producer is a hidden offscreen Chromium
  window pointed at this same document; on macOS its IOSurface crosses processes as a Mach right,
  on Linux its dma-buf crosses as SCM_RIGHTS, and Electron's paint lease is released only after
  Field's resident-texture copy completes.

  Run this in a *named* document, not a scratch one. The producer opens a second browser view of
  the document it lives in, and an agent scratch document is private to the session that made it —
  a second client asking for `?file=scratch` gets its own empty one, attaches offline, and the
  readiness gate then waits for a box that will never appear. Through the backdoor that means
  `--document <name>`. Note also that `wait-output --kind all` is the wrong wait for this graph:
  the panel emits empty error events on its `vertex_fragment` (Slang) property, which abort the
  wait while the box is in fact running. Use `sleep` then `output`.

  On Linux the transport works end to end — descriptors cross, frames import, `PRESENTED` comes
  back after the fence — but the panel is black, because Chromium exports a dma-buf it never fills.
  That is upstream (electron#49247), and it survives a real Xorg session, so it is not the
  Wayland/Vulkan incoherence that issue is about. See dev_docs/external_browser_surfaces.md.
operations:
  - create:
      box: field_ui_texture_renderer
      name: renderer — Field UI texture
      frame: { x: 140.0, y: 180.0, w: 250.0, h: 55.0 }
      properties:
        code: |
          import afield.four.util.Options

          prop<Window>(window)
          prop<Renderer>(renderer)

          Options.enableHDR = false
          Options.profiling = false

          once.renderer {
              window = Window("Field UI on a texture")
              Renderer(window)
          }

          println("Field UI texture renderer ready")
          start(renderer::run)
  - create:
      box: field_ui_texture_panel
      name: Field's UI — live Chromium texture
      frame: { x: 460.0, y: 180.0, w: 330.0, h: 55.0 }
      properties:
        code: |
          import afield.four.browser.FieldUiBrowserTexture
          import afield.four.modules.fromContext

          val renderer: Renderer = fromContext()
          val browser = FieldUiBrowserTexture(
              renderer = renderer,
              url = FieldUiBrowserTexture.fieldDocumentUrl(thisBox),
              width = 1280,
              height = 720,
              readyBoxUid = thisBox.id
          )
          renderer.renderList.preTargets["field-ui-browser-upload"] =
              afield.four.Target { command, _ -> browser.prepareSampledImagesFor(command) }

          val material = moduleHere {
              textures("fieldUi" to browser)
          }
          val panel = Mesh()
          material += "field-ui-panel" to panel
          renderer += "field-ui-browser-texture" to material

          panel.set(4, 2) {
              pos.add(
                  -0.96, -0.96, 0.0,
                   0.96, -0.96, 0.0,
                   0.96,  0.96, 0.0,
                  -0.96,  0.96, 0.0
              )
              tc.add(0, 0, 1, 0, 1, 1, 0, 1)
              tri.add(0, 1, 2, 0, 2, 3)
          }

          var announced = false
          loop {
              if (!announced && browser.pageReady) {
                  announced = true
                  println("Field UI browser texture is live: ${browser.presentedFrame}")
              }
              frame()
          }.end {
              renderer.renderList.modules.remove("field-ui-browser-texture")
              renderer.renderList.preTargets.remove("field-ui-browser-upload")
              browser.close()
          }
        vertex: |
          #version 450
          layout(location = 0) in vec3 pos;
          layout(location = 1) in vec2 tc;
          layout(location = 1) out vec2 ftc;

          void main() {
              gl_Position = vec4(pos, 1.0);
              ftc = tc;
          }
        fragment: |
          #version 450
          layout(location = 0) out vec4 color;
          layout(location = 1) in vec2 ftc;
          layout(set = 0, binding = 0) uniform sampler2D fieldUi;

          void main() {
              color = vec4(texture(fieldUi, vec2(ftc.x, 1.0 - ftc.y)).rgb, 1.0);
          }
  - connect: { parent: field_ui_texture_renderer, child: field_ui_texture_panel }
  - launch:
      box: field_ui_texture_renderer
      property: code
      type: code
      strand: renderer
      code: |
        import afield.four.util.Options

        prop<Window>(window)
        prop<Renderer>(renderer)

        Options.enableHDR = false
        Options.profiling = false

        once.renderer {
            window = Window("Field UI on a texture")
            Renderer(window)
        }

        println("Field UI texture renderer ready")
        start(renderer::run)
  - wait: { frames: 3 }
  - launch:
      box: field_ui_texture_panel
      property: code
      type: code
      strand: browser-texture
      code: |
        import afield.four.browser.FieldUiBrowserTexture
        import afield.four.modules.fromContext

        val renderer: Renderer = fromContext()
        val browser = FieldUiBrowserTexture(
            renderer = renderer,
            url = FieldUiBrowserTexture.fieldDocumentUrl(thisBox),
            width = 1280,
            height = 720,
            readyBoxUid = thisBox.id
        )
        renderer.renderList.preTargets["field-ui-browser-upload"] =
            afield.four.Target { command, _ -> browser.prepareSampledImagesFor(command) }

        val material = moduleHere {
            textures("fieldUi" to browser)
        }
        val panel = Mesh()
        material += "field-ui-panel" to panel
        renderer += "field-ui-browser-texture" to material

        panel.set(4, 2) {
            pos.add(
                -0.96, -0.96, 0.0,
                 0.96, -0.96, 0.0,
                 0.96,  0.96, 0.0,
                -0.96,  0.96, 0.0
            )
            tc.add(0, 0, 1, 0, 1, 1, 0, 1)
            tri.add(0, 1, 2, 0, 2, 3)
        }

        var announced = false
        loop {
            if (!announced && browser.pageReady) {
                announced = true
                println("Field UI browser texture is live: ${browser.presentedFrame}")
            }
            frame()
        }.end {
            renderer.renderList.modules.remove("field-ui-browser-texture")
            renderer.renderList.preTargets.remove("field-ui-browser-upload")
            browser.close()
        }
