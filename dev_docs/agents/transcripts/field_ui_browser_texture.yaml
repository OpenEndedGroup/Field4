name: field_ui_browser_texture
description: |
  The recursive and interactive proof: Field's own live browser UI arrives from Electron as a GPU
  shared texture and is sampled by a mesh in Field's Vulkan renderer. Mouse and keyboard input in
  the native window are routed back into hidden Chromium, while a page-to-Field request and its
  JavaScript promise result prove the bidirectional control channel. On macOS each IOSurface crosses
  processes as a Mach right and its lease is released after Field's resident-texture copy completes.
operations:
  - create:
      box: field_ui_texture_renderer
      name: renderer — Field UI texture
      frame: { x: 140.0, y: 180.0, w: 250.0, h: 55.0 }
      properties:
        code: |
          import afield.four.util.Options

          prop<Window>(window)
          prop<Renderer>(renderer)

          Options.enableHDR = false
          Options.profiling = false

          once.renderer {
              window = Window("Field UI on a texture")
              Renderer(window)
          }

          println("Field UI texture renderer ready")
          start(renderer::run)
  - create:
      box: field_ui_texture_panel
      name: Field's UI — live Chromium texture
      frame: { x: 460.0, y: 180.0, w: 330.0, h: 55.0 }
      properties:
        code: |
          import afield.four.browser.FieldUiBrowserTexture
          import afield.four.browser.PuppetBrowser
          import afield.four.browser.PuppetBrowserUvInput
          import afield.four.browser.PuppetBrowserWindowInput
          import afield.four.modules.fromContext
          import kotlinx.serialization.json.JsonElement
          import kotlinx.serialization.json.buildJsonObject
          import kotlinx.serialization.json.put
          import java.util.concurrent.CompletableFuture

          val renderer: Renderer = fromContext()
          prop<afield.four.browser.PuppetBrowser>(browserControl)
          val browser = FieldUiBrowserTexture(
              renderer = renderer,
              url = FieldUiBrowserTexture.fieldDocumentUrl(thisBox),
              width = 1280,
              height = 720,
              readyBoxUid = thisBox.id
          )
          browserControl = browser
          val interaction = PuppetBrowserWindowInput(browser, renderer.window)
          val scriptedInput = PuppetBrowserUvInput(browser)
          val removeReadyBridge = browser.onPageRequest("field-ready") { payload ->
              println("Field UI page called Field: $payload")
              CompletableFuture.completedFuture<JsonElement>(buildJsonObject {
                  put("accepted", true)
                  put("echo", payload)
              })
          }
          renderer.renderList.preTargets["field-ui-browser-upload"] =
              afield.four.Target { command, _ -> browser.prepareSampledImagesFor(command) }

          val material = moduleHere {
              textures("fieldUi" to browser)
          }
          val panel = Mesh()
          material += "field-ui-panel" to panel
          renderer += "field-ui-browser-texture" to material

          panel.set(4, 2) {
              pos.add(
                  -0.96, -0.96, 0.0,
                   0.96, -0.96, 0.0,
                   0.96,  0.96, 0.0,
                  -0.96,  0.96, 0.0
              )
              tc.add(0, 0, 1, 0, 1, 1, 0, 1)
              tri.add(0, 1, 2, 0, 2, 3)
          }

          var announced = false
          loop {
              if (!announced && browser.pageReady) {
                  announced = true
                  println("Field UI browser texture is live: ${browser.presentedFrame}")
                  browser.evaluate("""
                      (() => {
                          const probe = document.createElement("input")
                          probe.id = "field-puppet-input-probe"
                          probe.style.cssText = "position:fixed;left:8px;top:8px;width:280px;height:40px;z-index:2147483647;opacity:.01"
                          document.body.appendChild(probe)
                          return true
                      })()
                  """).thenCompose {
                      scriptedInput.move(40.0 / scriptedInput.cssWidth, 28.0 / scriptedInput.cssHeight)
                      scriptedInput.down()
                      scriptedInput.up()
                      browser.insertText("always available in VR")
                      browser.flushInput()
                  }.thenCompose {
                      browser.evaluate("""
                          (() => {
                              const probe = document.getElementById("field-puppet-input-probe")
                              const input = probe.value
                              probe.remove()
                              return window.fieldPuppet.request("field-ready", {
                                  title: document.title,
                                  location: location.href,
                                  input
                              })
                          })()
                      """)
                  }.whenComplete { result, error ->
                      if (error == null) println("Puppet page/Field/JavaScript round trip: ${result.value}")
                      else error.printStackTrace()
                  }
              }
              frame()
          }.end {
              renderer.renderList.modules.remove("field-ui-browser-texture")
              renderer.renderList.preTargets.remove("field-ui-browser-upload")
              removeReadyBridge()
              interaction.close()
              browser.close()
          }
        vertex: |
          #version 450
          layout(location = 0) in vec3 pos;
          layout(location = 1) in vec2 tc;
          layout(location = 1) out vec2 ftc;

          void main() {
              gl_Position = vec4(pos, 1.0);
              ftc = tc;
          }
        fragment: |
          #version 450
          layout(location = 0) out vec4 color;
          layout(location = 1) in vec2 ftc;
          layout(set = 0, binding = 0) uniform sampler2D fieldUi;

          void main() {
              color = vec4(texture(fieldUi, vec2(ftc.x, 1.0 - ftc.y)).rgb, 1.0);
          }
  - connect: { parent: field_ui_texture_renderer, child: field_ui_texture_panel }
  - launch:
      box: field_ui_texture_renderer
      property: code
      type: code
      strand: renderer
      code: |
        import afield.four.util.Options

        prop<Window>(window)
        prop<Renderer>(renderer)

        Options.enableHDR = false
        Options.profiling = false

        once.renderer {
            window = Window("Field UI on a texture")
            Renderer(window)
        }

        println("Field UI texture renderer ready")
        start(renderer::run)
  - wait: { frames: 3 }
  - launch:
      box: field_ui_texture_panel
      property: code
      type: code
      strand: browser-texture
      code: |
        import afield.four.browser.FieldUiBrowserTexture
        import afield.four.browser.PuppetBrowser
        import afield.four.browser.PuppetBrowserUvInput
        import afield.four.browser.PuppetBrowserWindowInput
        import afield.four.modules.fromContext
        import kotlinx.serialization.json.JsonElement
        import kotlinx.serialization.json.buildJsonObject
        import kotlinx.serialization.json.put
        import java.util.concurrent.CompletableFuture

        val renderer: Renderer = fromContext()
        prop<afield.four.browser.PuppetBrowser>(browserControl)
        val browser = FieldUiBrowserTexture(
            renderer = renderer,
            url = FieldUiBrowserTexture.fieldDocumentUrl(thisBox),
            width = 1280,
            height = 720,
            readyBoxUid = thisBox.id
        )
        browserControl = browser
        val interaction = PuppetBrowserWindowInput(browser, renderer.window)
        val scriptedInput = PuppetBrowserUvInput(browser)
        val removeReadyBridge = browser.onPageRequest("field-ready") { payload ->
            println("Field UI page called Field: $payload")
            CompletableFuture.completedFuture<JsonElement>(buildJsonObject {
                put("accepted", true)
                put("echo", payload)
            })
        }
        renderer.renderList.preTargets["field-ui-browser-upload"] =
            afield.four.Target { command, _ -> browser.prepareSampledImagesFor(command) }

        val material = moduleHere {
            textures("fieldUi" to browser)
        }
        val panel = Mesh()
        material += "field-ui-panel" to panel
        renderer += "field-ui-browser-texture" to material

        panel.set(4, 2) {
            pos.add(
                -0.96, -0.96, 0.0,
                 0.96, -0.96, 0.0,
                 0.96,  0.96, 0.0,
                -0.96,  0.96, 0.0
            )
            tc.add(0, 0, 1, 0, 1, 1, 0, 1)
            tri.add(0, 1, 2, 0, 2, 3)
        }

        var announced = false
        loop {
            if (!announced && browser.pageReady) {
                announced = true
                println("Field UI browser texture is live: ${browser.presentedFrame}")
                browser.evaluate("""
                    (() => {
                        const probe = document.createElement("input")
                        probe.id = "field-puppet-input-probe"
                        probe.style.cssText = "position:fixed;left:8px;top:8px;width:280px;height:40px;z-index:2147483647;opacity:.01"
                        document.body.appendChild(probe)
                        return true
                    })()
                """).thenCompose {
                    scriptedInput.move(40.0 / scriptedInput.cssWidth, 28.0 / scriptedInput.cssHeight)
                    scriptedInput.down()
                    scriptedInput.up()
                    browser.insertText("always available in VR")
                    browser.flushInput()
                }.thenCompose {
                    browser.evaluate("""
                        (() => {
                            const probe = document.getElementById("field-puppet-input-probe")
                            const input = probe.value
                            probe.remove()
                            return window.fieldPuppet.request("field-ready", {
                                title: document.title,
                                location: location.href,
                                input
                            })
                        })()
                    """)
                }.whenComplete { result, error ->
                    if (error == null) println("Puppet page/Field/JavaScript round trip: ${result.value}")
                    else error.printStackTrace()
                }
            }
            frame()
        }.end {
            renderer.renderList.modules.remove("field-ui-browser-texture")
            renderer.renderList.preTargets.remove("field-ui-browser-upload")
            removeReadyBridge()
            interaction.close()
            browser.close()
        }
