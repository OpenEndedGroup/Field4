name: gpu_shader_learning
description: Train on moduleHere RGB directly on the GPU, freeze the fit, and save portable learned weights.
operations:
- create:
    box: agent_graphics_context
    name: renderer
    frame:
      x: 40.0
      y: 40.0
      w: 300.0
      h: 100.0
    properties:
      code: "import afield.four.util.Options\n\nprop<Window>(window)\nprop<Renderer>(renderer)\n\nOptions.enableRayTracing\
        \ = true\nOptions.enableVR = false\nOptions.enableHDR = false\nOptions.profiling = false\n\nonce.renderer\
        \ {\n    window = Window(\"Field\")\n    Renderer(window)\n}\n\nprintln(\"agent graphics renderer ready\"\
        )\nstart(renderer::run)\n"
- launch:
    box: agent_graphics_context
    property: code
    type: code
    strand: renderer
    code: "import afield.four.util.Options\n\nprop<Window>(window)\nprop<Renderer>(renderer)\n\nOptions.enableRayTracing\
      \ = true\nOptions.enableVR = false\nOptions.enableHDR = false\nOptions.profiling = false\n\nonce.renderer\
      \ {\n    window = Window(\"Field\")\n    Renderer(window)\n}\n\nprintln(\"agent graphics renderer ready\"\
      )\nstart(renderer::run)\n"
- wait:
    frames: 3
- create:
    box: gpu_shader_learning
    name: gpu shader learning
    frame:
      x: 400.0
      y: 160.0
      w: 420.0
      h: 100.0
    properties:
      code: "import afield.controlGroup\nimport afield.displayOpen\nimport afield.four.neural.*\nimport afield.four.modules.fromContextWithNameOrNull\n\
        import org.lwjgl.vulkan.VK13.*\nimport java.io.File\n\nprop<GpuShaderLearningView>(lab)\nfromContextWithNameOrNull<GpuShaderLearningView>(\"\
        lab\")?.close()\ncheck(renderer.device.supportsCooperativeVectorTraining) {\n    \"GPU learning needs enabled\
        \ cooperative-vector training. learned_from_module provides offline training.\"\n}\nval source=RenderToTexture(renderer)\
        \ {\n    width=1920;height=1080;useDepth=false;format=VK_FORMAT_R32G32B32A32_SFLOAT\n}\nval teacher=moduleHere\
        \ { source.apply();depthTest=false;depthWrite=false;blend=false }\nval mesh=Mesh(renderer,teacher)\nmesh.resize(3,0,teacher)\n\
        mesh.push.setMembers(teacher.current.fi.pushConstants.single().members)\nteacher += \"fullscreen\" to mesh\n\
        source += \"teacher\" to teacher\nlab=GpuShaderLearningView(renderer,source) { t -> mesh.push[\"state\"\
        ]=vec(source.width,source.height,t,0) }.install()\nvar learn=true\nvar view=2\nvar reset=false\nvar save=false\n\
        var iterations=8\ncontrolGroup(\"GPU shader learning\") {\n    checkbox(\"Learn on GPU\",initialValue=true)\
        \ { learn=it }\n    slider(\"Updates per frame\",min=1.0,max=32.0,step=1.0,initialValue=8.0) { iterations=it.toInt()\
        \ }\n    slider(\"0: Source · 1: Learned · 2: Compare\",min=0.0,max=2.0,step=1.0,initialValue=2.0) { view=it.toInt()\
        \ }\n    button(\"Reset model and optimizer\") { if(it)reset=true }\n    button(\"Save frozen weights\"\
        ) { if(it)save=true }\n}\ndisplayOpen(\"GPU shader learning\")\nprintln(\"Edit fragment; training samples\
        \ actual linear RGB. Freeze learning and choose Learned to stop the teacher pass. Compare is source / learned\
        \ / error × 8.\")\nval owner=renderer\nframes {\n    var phase=0\n    var sourceHash=ShaderTraining.sourceDigest(source)\n\
        \    while(true) {\n        val hash=ShaderTraining.sourceDigest(source)\n        if(hash!=sourceHash) {\
        \ sourceHash=hash;reset=true;println(\"Teacher changed; restarting the fit.\") }\n        if(reset){lab.model.reset();reset=false}\n\
        \        lab.learning=learn;lab.iterationsPerFrame=iterations;lab.view=view\n        lab.parameter=if(learn)(phase%13)/6f-1\
        \ else kotlin.math.sin(phase*.018f)\n        if(save) {\n            save=false\n            runCatching\
        \ {\n                val directory=File(\"build/shader-learning/gpu-${System.currentTimeMillis()}\")\n \
        \               lab.model.save(directory,sourceHash,\"Fullscreen module; camera, textures and other controls\
        \ fixed; normalized time varies\")\n                println(\"FROZEN MODEL SAVED: $directory — load weights.f16\
        \ and weights.json with LearnedShader.\")\n            }.onFailure { println(\"Save failed: ${it.message}\"\
        ) }\n        }\n        phase++;frame()\n    }\n}.end {\n    lab.close()\n    owner.cleanup+=Runnable {\n\
        \        teacher.current.cleanup();source.imageViewArray.forEach { it.imageView.cleanup() }\n        source.colorImageRefs.forEach\
        \ { it?.cleanup() };source.defaultSampler?.cleanup()\n    }\n}\n"
      vertex: "#version 460\nvoid main() {\n    vec2 p=vec2((gl_VertexIndex<<1)&2,gl_VertexIndex&2);\n    gl_Position=vec4(p*2-1,0,1);\n\
        }\n"
      fragment: "#version 460\nlayout(push_constant) uniform P { vec4 state; } p;\nlayout(location=0) out vec4 color;\n\
        void main() {\n    // This is the teacher. Edit it here; there is no Python version to keep in sync.\n \
        \   vec2 xy=gl_FragCoord.xy/p.state.xy*2-1;\n    float t=p.state.z;\n    vec3 rgb=.5+.22*cos(vec3(xy.x*2+t,xy.y*2-t*.7,xy.x+xy.y+t*.5)+vec3(0,2,4));\n\
        \    for(int k=1;k<=96;k++) {\n        float a=float(k)*.61803399;\n        rgb+=.028/float(k)*sin(vec3(xy.x*cos(a)+xy.y*sin(a))*3+t+vec3(0,2,4)+a);\n\
        \    }\n    // Two hard edges: a deliberately discontinuous target for the small network.\n    float stripe=step(-.12,xy.x)*(1-step(.12,xy.x));\n\
        \    color=vec4(mix(rgb,vec3(.95,.04,.8),stripe),1);\n}\n"
- connect:
    parent: agent_graphics_context
    child: gpu_shader_learning
- launch:
    box: gpu_shader_learning
    property: code
    type: code
    strand: scene
    code: "import afield.controlGroup\nimport afield.displayOpen\nimport afield.four.neural.*\nimport afield.four.modules.fromContextWithNameOrNull\n\
      import org.lwjgl.vulkan.VK13.*\nimport java.io.File\n\nprop<GpuShaderLearningView>(lab)\nfromContextWithNameOrNull<GpuShaderLearningView>(\"\
      lab\")?.close()\ncheck(renderer.device.supportsCooperativeVectorTraining) {\n    \"GPU learning needs enabled\
      \ cooperative-vector training. learned_from_module provides offline training.\"\n}\nval source=RenderToTexture(renderer)\
      \ {\n    width=1920;height=1080;useDepth=false;format=VK_FORMAT_R32G32B32A32_SFLOAT\n}\nval teacher=moduleHere\
      \ { source.apply();depthTest=false;depthWrite=false;blend=false }\nval mesh=Mesh(renderer,teacher)\nmesh.resize(3,0,teacher)\n\
      mesh.push.setMembers(teacher.current.fi.pushConstants.single().members)\nteacher += \"fullscreen\" to mesh\n\
      source += \"teacher\" to teacher\nlab=GpuShaderLearningView(renderer,source) { t -> mesh.push[\"state\"]=vec(source.width,source.height,t,0)\
      \ }.install()\nvar learn=true\nvar view=2\nvar reset=false\nvar save=false\nvar iterations=8\ncontrolGroup(\"\
      GPU shader learning\") {\n    checkbox(\"Learn on GPU\",initialValue=true) { learn=it }\n    slider(\"Updates\
      \ per frame\",min=1.0,max=32.0,step=1.0,initialValue=8.0) { iterations=it.toInt() }\n    slider(\"0: Source\
      \ · 1: Learned · 2: Compare\",min=0.0,max=2.0,step=1.0,initialValue=2.0) { view=it.toInt() }\n    button(\"\
      Reset model and optimizer\") { if(it)reset=true }\n    button(\"Save frozen weights\") { if(it)save=true }\n\
      }\ndisplayOpen(\"GPU shader learning\")\nprintln(\"Edit fragment; training samples actual linear RGB. Freeze\
      \ learning and choose Learned to stop the teacher pass. Compare is source / learned / error × 8.\")\nval owner=renderer\n\
      frames {\n    var phase=0\n    var sourceHash=ShaderTraining.sourceDigest(source)\n    while(true) {\n   \
      \     val hash=ShaderTraining.sourceDigest(source)\n        if(hash!=sourceHash) { sourceHash=hash;reset=true;println(\"\
      Teacher changed; restarting the fit.\") }\n        if(reset){lab.model.reset();reset=false}\n        lab.learning=learn;lab.iterationsPerFrame=iterations;lab.view=view\n\
      \        lab.parameter=if(learn)(phase%13)/6f-1 else kotlin.math.sin(phase*.018f)\n        if(save) {\n  \
      \          save=false\n            runCatching {\n                val directory=File(\"build/shader-learning/gpu-${System.currentTimeMillis()}\"\
      )\n                lab.model.save(directory,sourceHash,\"Fullscreen module; camera, textures and other controls\
      \ fixed; normalized time varies\")\n                println(\"FROZEN MODEL SAVED: $directory — load weights.f16\
      \ and weights.json with LearnedShader.\")\n            }.onFailure { println(\"Save failed: ${it.message}\"\
      ) }\n        }\n        phase++;frame()\n    }\n}.end {\n    lab.close()\n    owner.cleanup+=Runnable {\n\
      \        teacher.current.cleanup();source.imageViewArray.forEach { it.imageView.cleanup() }\n        source.colorImageRefs.forEach\
      \ { it?.cleanup() };source.defaultSampler?.cleanup()\n    }\n}\n"
- wait:
    frames: 12
