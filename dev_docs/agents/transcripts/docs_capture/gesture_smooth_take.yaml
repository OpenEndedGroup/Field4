name: gesture_smooth_take
description: >
  The gesture_to_keyframes box with a shakier hand (a tremor of 0.05 pad units rather than 0.008),
  launched, for the video in `public/docs/keyframe_editor.md` of its "smooth take" button: the
  baked lanes and the pad's trail before, then after, smoothing and baking again.

  Capture-only, so it lives under transcripts/docs_capture/: AgentTranscriptMaterializer scans the
  transcripts/ directory itself and would expect a committed starting-point bundle for anything
  directly inside it.
operations:
  - create:
      box: gk_shaky
      name: gesture to keyframes
      frame: { x: 40.0, y: 30.0, w: 320.0, h: 60.0 }
      properties:
        code: |
          var p = Vector2f(0f, 0f)
          lateinit var pad: GestureHandle

          // A figure eight drawn by a shaky hand: 240 samples over two seconds.
          val rnd = java.util.Random(7)
          val eight = 240 { i ->
              val a = i / 239.0 * 2 * Math.PI
              val wobble = { 0.05 * (rnd.nextDouble() - 0.5) }
              i / 239.0 * 2.0 to Vector2f((0.7 * Math.sin(a) + wobble()).toFloat(), (0.5 * Math.sin(2 * a) + wobble()).toFloat())
          }

          val x = keyframes("lanes", "x")
          val y = keyframes("lanes", "y")

          fun bake() {
              val (bx, by) = bakeGesture(pad, tolerance = 0.02, channel = "lanes")
              println("baked: ${pad.fit(bx, by)}")
          }

          // Takes the tremor out of the take: every sample as keys, smoothed over 40 ms, played back
          // through the pad, then baked again, so both lanes still have their keys at the same times.
          fun smoothTake() {
              val (sx, sy) = bakeGesture(pad, tolerance = 0.0, channel = "lanes")
              sx.smooth(0.04)
              sy.smooth(0.04)
              pad.setTake(sx, sy)
              bake()
          }

          controlGroup("gesture") {
              pad = gesture("take", initialTake = eight) { p = it }
              button("bake take") { if (it) bake() }
              button("smooth take") { if (it) smoothTake() }
              button("replay lanes") {
                  if (it) {
                      pad.setTake(x, y)
                      println("pad now plays the lanes: ${pad.samples.size} samples")
                  }
              }
          }
          displayOpen("gesture")

          if (x.isEmpty() || y.isEmpty()) bake() else println("lanes kept: ${pad.fit(x, y)}")

          val start = System.nanoTime()
          loop {
              val d = pad.duration
              if (d > 0) {
                  val t = ((System.nanoTime() - start) / 1e9) % d
                  pad.at(t)?.let { p = it }
                  pad.playhead(t)
                  x.setTime(t)
                  y.setTime(t)
              }
          }
  - launch: { box: gk_shaky }
  # Before the recording starts: time for a cold compile, the bake, and both lanes to show their keys.
  - wait:
      millis: 12000
