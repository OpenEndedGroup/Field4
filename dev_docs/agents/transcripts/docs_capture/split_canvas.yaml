name: split_canvas
description: >
  A sequencer-shaped document for the split-canvas figure on
  `public/docs/moving_around_the_canvas.md`: a row of bar headers along the top, a column of
  instrument labels down the left, and a sparse grid of pattern boxes, so that once the canvas is
  split at the corner between them and the body is scrolled, the headers and labels stay lined up
  with the body.

  Capture-only, so it lives under transcripts/docs_capture/ (see bookmarks_panel.yaml).
