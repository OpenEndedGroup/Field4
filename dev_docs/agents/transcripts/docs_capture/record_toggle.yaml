name: record_toggle
description: 'The presets panel from visualizers.md, for the recordToggle capture: rec size records a slider sweep into a keyframe curve.'
operations:
- create:
    box: record_toggle
    name: record a slider
    frame:
      x: 80.0
      y: 100.0
      w: 230.0
      h: 105.0
    properties:
      code: |
        val keys = KeyframeScope()
        var size by keys.slider(0.4, 0.1..1.0)
        var offset by keys.vec2(Vector2f(0f, 0f))
        var tint by keys.color(Vector4f(0.2f, 0.6f, 1f, 1f))
        var ring by keys.checkbox(false)

        fun draw() {
            val radius = (20 + size * 60).toInt()
            val cx = 110 + (offset.x * 60).toInt()
            val cy = 90 - (offset.y * 50).toInt()
            val disc = fline {
                circle(cx, cy, radius)
                filled = true
                stroked = false
                color = Vector4f(tint)
            }
            val outline = fline {
                circle(cx, cy, radius)
                thickness = 6.0
                color = vec(1.0, 1.0, 1.0, 1.0)
            }
            // Keep the frame fixed while the controls move or resize the circle.
            val figure: List<FLine> = if (ring) [disc, outline] else [disc]
            lines(
                figure,
                channel = "main",
                w = 220.0,
                h = 180.0,
                framing = LinesFraming.fixed(0.0, 0.0, 220.0, 180.0),
            )
        }
        keys.onChange { draw() }

        val dir = presetDirectory("look")

        // Two keys to start from, written once; after that the stored ones are used.
        if (keys.savedKeyNames(dir).isEmpty()) {
            keys
                .Key("size" to 0.25, "offset" to Vector2f(-0.5f, 0.3f), "tint" to Vector4f(0.2f, 0.6f, 1f, 1f), "ring" to 0f)
                .save(dir.resolve("calm"))
            keys
                .Key("size" to 0.95, "offset" to Vector2f(0.6f, -0.4f), "tint" to Vector4f(1f, 0.25f, 0.1f, 1f), "ring" to 1f)
                .save(dir.resolve("storm"))
        }

        controlGroup("look") {
            keys.controls()
            presetBar(keys)
            recordToggle("size")
            midiLearnButton()
        }

        draw()
        displayOpen("look")
        displayOpen("main")
- launch:
    box: record_toggle
- wait:
    millis: 1000
