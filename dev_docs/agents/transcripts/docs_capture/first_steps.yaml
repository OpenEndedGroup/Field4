name: first_steps
description: Capture the first-steps template, using its shipped code.
operations:
- create:
    box: first_steps_drawing
    name: First steps · a moving drawing
    frame:
      x: 70.0
      y: 70.0
      w: 350.0
      h: 100.0
    properties:
      code: "// Launch: Alt+Up. Stop: Alt+Down. On a Mac, Alt is Option.\nvar petals\
        \ = 5 // Change 5 to 8, then launch again.\nprintln(petals) // Field shows\
        \ this value beside the code.\nvar phase = 0.0\n\nloop {\n    phase += 0.045\n\
        \    // Each curve is a little further into the wave: together they make a\
        \ ribbon.\n    val ribbon = (0..23).map { layer ->\n        val depth = layer\
        \ / 23.0\n        fline {\n            for (i in 0..180) {\n             \
        \   val angle = i * Math.PI / 90.0\n                val wave = Math.sin(petals\
        \ * angle + phase - 4.0 * depth)\n                val radius = 35.0 + 90.0\
        \ * depth + 18.0 * wave\n                val twist = angle + 0.4 * Math.sin(phase\
        \ + 2.0 * depth)\n                val x = 160.0 + radius * Math.cos(twist)\n\
        \                val y = 160.0 + radius * Math.sin(twist)\n              \
        \  if (i == 0) moveTo(x, y) else lineTo(x, y)\n            }\n           \
        \ thickness = 0.8\n            color = vec(0.55 + 0.4 * depth, 0.85 + 0.15\
        \ * depth, 1.0, 0.8)\n        }\n    }\n    lines(ribbon, w = 320.0, h = 320.0)\n\
        \    true\n}\n\n// Field autosaves edits. Stop, close this tab, then reopen\
        \ your copy\n// from Welcome: your edited code is there; launch it to animate\
        \ again.\n"
