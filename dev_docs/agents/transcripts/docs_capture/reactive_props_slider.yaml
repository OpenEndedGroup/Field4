name: reactive_props_slider
description: |
  Setup for `public/docs/reactive_properties.md`, "Controls". "Gain" declares
  `propDown<Double>(gain)` and binds it to a slider with `syncToProperty`; "Meter", under Gain,
  draws a bar `gain` long. Both run once. Dragging the slider reruns Meter (checked live with
  `sendSliderUpdate`, and by ReactivePropsTest.aRawWriteToADeclaredDownPropertyIsAChange).
operations:
  - create:
      box: rp_gain
      name: Gain
      frame: { x: 40.0, y: 40.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          propDown<Double>(gain)
          syncToProperty("gain", 0.5, min = 0.0, max = 1.0)
  - create:
      box: rp_meter
      name: Meter
      frame: { x: 40.0, y: 260.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          val width = (gain * 300).toInt()
          display("main", "<div style='width:${width}px;height:14px;background:#4a90d9'></div><p>gain ${"%.2f".format(gain)}</p>")
  - connect: { parent: rp_gain, child: rp_meter }
  - execute: { box: rp_gain, property: code }
  - execute: { box: rp_meter, property: code }
  - await: {}
  - wait: { frames: 10 }
