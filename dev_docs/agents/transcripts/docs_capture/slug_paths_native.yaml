name: slug_paths_native
description: Launch a renderer and canonical_graphics lesson 5e (Slug filled paths), read from its sidecars, for the slug_paths native screenshot.
operations:
- create:
    box: slug_renderer
    name: Slug renderer
    frame:
      x: 70.0
      y: 70.0
      w: 350.0
      h: 100.0
    properties:
      code: |
        prop<Window>(window)
        prop<Renderer>(renderer)
        once.renderer {
            window = Window("Field · Slug filled paths")
            Renderer(window)
        }
        start(renderer::run)
- create:
    box: slug_paths
    name: 5e. Slug filled paths
    frame:
      x: 70.0
      y: 270.0
      w: 350.0
      h: 100.0
    properties:
      code: |
        import afield.graphics.text.slug.*
        import org.lwjgl.vulkan.VK10.*

        /*
        5e. Slug filled paths: an FLine filled on the GPU with the Slug coverage algorithm.
        Parent: window. SlugPath.compile turns the path into curve and band data; the vertex and fragment
        shaders (open them with the editor's property switcher) draw one quad covering the path and compute
        per-pixel coverage from that data, so edges stay sharp at any zoom.
        Compiling needs the native helper; build it once with: bash native/field-slug/build.sh
        */
        name = "5e. Slug filled paths"
        val path =
            FLine().moveTo(-1, -1).lineTo(1, -1).cubicTo(vec(1.4, 0, 0), vec(0.8, 1.3, 0), vec(0, 1, 0)).lineTo(-1, 1).close()
        // Clockwise inner contour cuts a hole in the counterclockwise outer contour.
        path.moveTo(-0.3, -0.3).lineTo(-0.3, 0.3).lineTo(0.3, 0.3).lineTo(0.3, -0.3).close()
        val prepared = SlugPath.compile(path, "field-slug".file)

        // `//%-` is Field's execution break: the path is prepared above it, before the GPU setup below.
        //%-
        val module = moduleHere {
            primitiveType = triangles
            srcAlpha = VK_BLEND_FACTOR_ONE
            depthWrite = false
        }
        val mesh = Mesh()
        module += "slug" to mesh
        renderer += module
        // Six vertices: the two triangles of the covering quad.
        mesh.resize(6)
        val data = SlugBuffer(renderer, prepared)

        // When the box is re-run or stopped, remove the mesh first, then free the atlas it reads.
        RunScope.current()!!.own(policy = ReleasePolicy.RUNNING) {
            if (module.current.meshes["slug"] === mesh) module.current.meshes.remove("slug")
            data.close()
        }

        // Push constants, matched by name to the shaders' SlugPC block.
        mesh.slugData = { data }
        val camera = Camera()
        camera.at = vec(0, 0, -4)

        mesh.mvp = { Matrix4f(camera.p.evaluateUniform()).mul(camera.modelView()) }
        mesh.viewport = {
            val extent = renderer.swapChain.swapChainExtent
            vec(extent.width(), extent.height())
        }
        var tint = vec(0.9, 0.9, 0.9, 0.8)
        mesh.tint = { tint }

        // Focus the renderer window: WASD/arrows move, E/C rise/fall, R resets.
        var kc by keyCamera(camera = camera)

        // Tint and camera can change without preparing the geometry again. To change the geometry, prepare a
        // new SlugPath and call data.replace(newPath) on the render thread.
      vertex: |
        #version 450
        #extension GL_EXT_buffer_reference : require
        // Adapted Slug core: Copyright (c) 2026 AlphaPixel LLC. See LICENSE-slughorn.
        layout(std430, buffer_reference, buffer_reference_align = 4) readonly buffer SlugData { uint words[]; };
        layout(push_constant) uniform SlugPC {
            mat4 mvp;
            SlugData slugData;
            vec2 viewport;
            vec4 tint;
        } pc;
        vec4 data4(uint at) {
            return uintBitsToFloat(uvec4(pc.slugData.words[at], pc.slugData.words[at+1],
                pc.slugData.words[at+2], pc.slugData.words[at+3]));
        }
        layout(location=0) out vec2 emCoord;
        const vec2 corners[6] = vec2[6](vec2(0,0), vec2(1,0), vec2(1,1), vec2(0,0), vec2(1,1), vec2(0,1));
        void main() {
            vec4 bounds = data4(8u);
            // A closed SlugBuffer's empty atlas: nothing to cover, so put every corner outside the clip volume.
            if (!(bounds.z > bounds.x && bounds.w > bounds.y)) {
                emCoord = vec2(0.0);
                gl_Position = vec4(0.0, 0.0, 2.0, 1.0);
                return;
            }
            vec2 corner = corners[gl_VertexIndex % 6];
            vec2 q = mix(bounds.xy, bounds.zw, corner);
            vec2 normal = 2.0 * corner - 1.0;
            mat4 matrix = pc.mvp;
            vec4 position = matrix * vec4(q, 0.0, 1.0);
            // Lengyel's perspective-dependent dilation, expressed in homogeneous vectors.
            // normal is the corner bisector scaled so both incident sides expand equally.
            vec4 direction = matrix * vec4(normalize(normal), 0.0, 0.0);
            float s = position.w;
            float t = direction.w;
            vec2 uv = pc.viewport * (s*direction.xy - t*position.xy);
            float denominator = length(uv) - s*t;
            float distance = denominator > 1e-12 ? s*s / denominator : 0.0;
            q += distance * normal;
            emCoord = q;
            gl_Position = matrix * vec4(q, 0.0, 1.0);
        }
      fragment: "#version 450\n#extension GL_EXT_buffer_reference : require\n// Adapted Slug core: Copyright (c) 2026 AlphaPixel LLC. See LICENSE-slughorn.\nlayout(std430, buffer_reference, buffer_reference_align\
        \ = 4) readonly buffer SlugData { uint words[]; };\nlayout(push_constant) uniform SlugPC {\n    mat4 mvp;\n    SlugData slugData;\n    vec2 viewport;\n    vec4 tint;\n} pc;\nvec4 data4(uint at)\
        \ {\n    return uintBitsToFloat(uvec4(pc.slugData.words[at], pc.slugData.words[at+1],\n        pc.slugData.words[at+2], pc.slugData.words[at+3]));\n}\nlayout(location=0) in vec2 emCoord;\nlayout(location=0)\
        \ out vec4 fragColor;\n#define TEX_WIDTH 9\n#define SLUG_INDIRECTION_SIZE 32\nuvec4 bandFetch(ivec2 xy) {\n    uint i = pc.slugData.words[7] + uint(xy.y * 512 + xy.x);\n    uint pair = pc.slugData.words[i];\n\
        \    return uvec4(pair & 65535u, pair >> 16u, 0u, 0u);\n}\nvec4 curveFetch(ivec2 xy) {\n    uint i = pc.slugData.words[6] + 4u * uint(xy.y * 512 + xy.x);\n    return data4(i);\n}\nuint slug_CalcRootCode(float\
        \ y1, float y2, float y3) {\n\tuint i1 = floatBitsToUint(y1) >> 31u;\n\tuint i2 = floatBitsToUint(y2) >> 30u;\n\tuint i3 = floatBitsToUint(y3) >> 29u;\n\n\tuint shift = (i2 & 2u) | (i1 & ~2u);\n\
        \tshift = (i3 & 4u) | (shift & ~4u);\n\n\treturn ((0x2E74u >> shift) & 0x0101u);\n}\n\nvec2 slug_SolveHorizPoly(vec4 p12, vec2 p3) {\n\tvec2 a = p12.xy - p12.zw * 2.0 + p3;\n\tvec2 b = p12.xy -\
        \ p12.zw;\n\tfloat ra = 1.0 / a.y;\n\tfloat rb = 0.5 / b.y;\n\tfloat d = sqrt(max(b.y * b.y - a.y * p12.y, 0.0));\n\tfloat t1 = (b.y - d) * ra;\n\tfloat t2 = (b.y + d) * ra;\n\tif(abs(a.y) < 1.0\
        \ / 65536.0) { t1 = p12.y * rb; t2 = t1; }\n\treturn vec2(\n\t\t(a.x * t1 - b.x * 2.0) * t1 + p12.x,\n\t\t(a.x * t2 - b.x * 2.0) * t2 + p12.x\n\t);\n}\n\nvec2 slug_SolveVertPoly(vec4 p12, vec2 p3)\
        \ {\n\tvec2 a = p12.xy - p12.zw * 2.0 + p3;\n\tvec2 b = p12.xy - p12.zw;\n\tfloat ra = 1.0 / a.x;\n\tfloat rb = 0.5 / b.x;\n\tfloat d = sqrt(max(b.x * b.x - a.x * p12.x, 0.0));\n\tfloat t1 = (b.x\
        \ - d) * ra;\n\tfloat t2 = (b.x + d) * ra;\n\tif(abs(a.x) < 1.0 / 65536.0) { t1 = p12.x * rb; t2 = t1; }\n\treturn vec2(\n\t\t(a.y * t1 - b.y * 2.0) * t1 + p12.y,\n\t\t(a.y * t2 - b.y * 2.0) * t2\
        \ + p12.y\n\t);\n}\n\nivec2 slug_CalcBandLoc(ivec2 glyphLoc, uint offset) {\n\tivec2 bandLoc = ivec2(glyphLoc.x + int(offset), glyphLoc.y);\n\tbandLoc.y += bandLoc.x >> TEX_WIDTH;\n\tbandLoc.x &=\
        \ (1 << TEX_WIDTH) - 1;\n\treturn bandLoc;\n}\n\n// Location of a curve's later texel, wrapping to the next row of the 512-wide data layout the same\n// way slug_CalcBandLoc() does, since a curve's\
        \ texels may straddle a row boundary.\nivec2 slug_CalcCurveLoc(ivec2 curveLoc, int offset) {\n\tivec2 loc = ivec2(curveLoc.x + offset, curveLoc.y);\n\tloc.y += loc.x >> TEX_WIDTH;\n\tloc.x &= (1\
        \ << TEX_WIDTH) - 1;\n\treturn loc;\n}\n\nfloat slug_CalcCoverage(float xcov, float ycov, float xwgt, float ywgt) {\n\tfloat coverage = max(\n\t\tabs(xcov * xwgt + ycov * ywgt) / max(xwgt + ywgt,\
        \ 1.0 / 65536.0),\n\t\tmin(abs(xcov), abs(ycov))\n\t);\n\treturn clamp(coverage, 0.0, 1.0);\n}\n\nfloat slug_Render(vec2 renderCoord, vec4 bandTransform, ivec2 glyphLoc, ivec2 bandMax) {\n\tvec2\
        \ emsPerPixel = fwidth(renderCoord);\n\tvec2 pixelsPerEm = 1.0 / emsPerPixel;\n\n\t// O(1) band index via indirection tables (2 fetches per axis).\n\tint qY = clamp(int(renderCoord.y * bandTransform.y\
        \ + bandTransform.w), 0, SLUG_INDIRECTION_SIZE - 1);\n\tint qX = clamp(int(renderCoord.x * bandTransform.x + bandTransform.z), 0, SLUG_INDIRECTION_SIZE - 1);\n\tint bandY = int(bandFetch(ivec2(glyphLoc.x\
        \ + qY, glyphLoc.y)).r);\n\tint bandX = int(bandFetch(ivec2(glyphLoc.x + SLUG_INDIRECTION_SIZE + qX, glyphLoc.y)).r);\n\n\t// Horizontal bands -- headers at glyphLoc + 2*IS + bandY\n\tfloat xcov\
        \ = 0.0, xwgt = 0.0;\n\tuvec2 hbandData = bandFetch(ivec2(glyphLoc.x + 2 * SLUG_INDIRECTION_SIZE + bandY, glyphLoc.y)).xy;\n\n\tfor(int ci = 0; ci < int(hbandData.x); ci++) {\n\t\t// Compute each\
        \ curve index's location separately, so a band's curve list may span\n\t\t// more than one row of the data layout.\n\t\tivec2 hbandLoc = slug_CalcBandLoc(glyphLoc, hbandData.y + uint(ci));\n\t\t\
        ivec2 curveLoc = ivec2(bandFetch(hbandLoc).xy);\n\t\tvec4 p12 = curveFetch(curveLoc) - vec4(renderCoord, renderCoord);\n\n\t\t// A curve's third control point is the next texel. Connected curves\
        \ share endpoint\n\t\t// texels, so that texel can sit at the start of the next row.\n\t\tvec2 p3 = curveFetch(slug_CalcCurveLoc(curveLoc, 1)).xy - renderCoord;\n\n\t\tif(max(max(p12.x, p12.z),\
        \ p3.x) * pixelsPerEm.x < -0.5) break;\n\n\t\tuint code = slug_CalcRootCode(p12.y, p12.w, p3.y);\n\t\tif(code != 0u) {\n\t\t\tvec2 r = slug_SolveHorizPoly(p12, p3) * pixelsPerEm.x;\n\t\t\tif((code\
        \ & 1u) != 0u) { xcov += clamp(r.x + 0.5, 0.0, 1.0); xwgt = max(xwgt, clamp(1.0 - abs(r.x) * 2.0, 0.0, 1.0)); }\n\t\t\tif(code > 1u) { xcov -= clamp(r.y + 0.5, 0.0, 1.0); xwgt = max(xwgt, clamp(1.0\
        \ - abs(r.y) * 2.0, 0.0, 1.0)); }\n\t\t}\n\t}\n\n\t// Vertical bands -- headers at glyphLoc + 2*IS + numHBands + bandX\n\tfloat ycov = 0.0, ywgt = 0.0;\n\tuvec2 vbandData = bandFetch(ivec2(glyphLoc.x\
        \ + 2 * SLUG_INDIRECTION_SIZE + bandMax.y + 1 + bandX, glyphLoc.y)).xy;\n\n\tfor(int ci = 0; ci < int(vbandData.x); ci++) {\n\t\t// See the matching comment in the horizontal-band loop above.\n\t\
        \tivec2 vbandLoc = slug_CalcBandLoc(glyphLoc, vbandData.y + uint(ci));\n\t\tivec2 curveLoc = ivec2(bandFetch(vbandLoc).xy);\n\t\tvec4 p12 = curveFetch(curveLoc) - vec4(renderCoord, renderCoord);\n\
        \n\t\t// See the matching comment in the horizontal-band loop above.\n\t\tvec2 p3 = curveFetch(slug_CalcCurveLoc(curveLoc, 1)).xy - renderCoord;\n\n\t\tif(max(max(p12.y, p12.w), p3.y) * pixelsPerEm.y\
        \ < -0.5) break;\n\n\t\tuint code = slug_CalcRootCode(p12.x, p12.z, p3.x);\n\t\tif(code != 0u) {\n\t\t\tvec2 r = slug_SolveVertPoly(p12, p3) * pixelsPerEm.y;\n\t\t\tif((code & 1u) != 0u) { ycov\
        \ -= clamp(r.x + 0.5, 0.0, 1.0); ywgt = max(ywgt, clamp(1.0 - abs(r.x) * 2.0, 0.0, 1.0)); }\n\t\t\tif(code > 1u) { ycov += clamp(r.y + 0.5, 0.0, 1.0); ywgt = max(ywgt, clamp(1.0 - abs(r.y) * 2.0,\
        \ 0.0, 1.0)); }\n\t\t}\n\t}\n\n\treturn slug_CalcCoverage(xcov, ycov, xwgt, ywgt);\n}\n\n\n// The fill colour. Replace it with any procedural fill; coverage is computed independently of it.\nvec3\
        \ shade(vec2 q) { return pc.tint.rgb * (0.7 + 0.3*cos(vec3(0,2,4)+q.x*4.0+q.y*3.0)); }\nvoid main() {\n    ivec2 loc = ivec2(pc.slugData.words[16], pc.slugData.words[17]);\n    ivec2 bandMax = ivec2(pc.slugData.words[18],\
        \ pc.slugData.words[19]);\n    float coverage = slug_Render(emCoord, data4(12u), loc, bandMax);\n    if (coverage <= 0.0) discard;\n    // Straight alpha; use a source-alpha blending pipeline. Convert\
        \ explicitly for\n    // premultiplied-alpha targets. Neither atlas data nor coverage are sRGB colors.\n    fragColor = vec4(shade(emCoord), coverage * pc.tint.a);\n}\n"
- connect:
    parent: slug_renderer
    child: slug_paths
- launch:
    box: slug_renderer
    property: code
    type: code
- wait:
    frames: 3
- launch:
    box: slug_paths
    property: code
    type: code
- wait:
    frames: 4
