name: box_graph_connect
description: |
  Setup for `public/docs/box_graph.md`, "A child reads what its parent publishes". "Garden" declares
  `prop<Int>(petals)` and sets 5; "Flower", connected beneath it, reads it. Both run once; the page
  captures Flower's output.
operations:
  - create:
      box: bg_garden
      name: Garden
      frame: { x: 40.0, y: 40.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          prop<Int>(petals) = 5
  - create:
      box: bg_flower
      name: Flower
      frame: { x: 40.0, y: 200.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          markdown("Flower sees petals = $petals")
  - connect: { parent: bg_garden, child: bg_flower }
  - execute: { box: bg_garden, property: code }
  - execute: { box: bg_flower, property: code }
  - await: {}
  - wait: { frames: 10 }
