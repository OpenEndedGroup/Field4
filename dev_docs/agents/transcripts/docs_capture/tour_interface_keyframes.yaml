name: tour_interface_keyframes
description: >
  The keyframe-browser figure on `public/docs/tour_interface.md`: one box, glow, saves
  four real looks of a three-uniform glow pass as keys in a folder inside the document, then
  shows the keyframe browser over that folder in its output panel. Capture-only.
operations:
  - create:
      box: tour_keys
      name: glow
      frame: { x: 60.0, y: 60.0, w: 160.0, h: 60.0 }
      properties:
        code: |
          // Four looks for a glow pass, each saved as a key in the document's glow-looks folder.
          val dir = FileManager.current().path("glow-looks")
          java.nio.file.Files.createDirectories(dir)
          val glow = Structure()
          val scope = KeyframeScope()
          scope.target("glow@radius", glow)
          scope.target("glow@intensity", glow)
          scope.target("glow@falloff", glow)
          [
              Triple("soft", [3f, 0.20f, 1.5f], "first pass"),
              Triple("hot", [9f, 0.80f, 0.6f], "too much"),
              Triple("mid", [6f, 0.50f, 1.0f], "between the two"),
              Triple("wide", [12f, 0.35f, 2.2f], "for the long shot"),
          ].forEach { (name, v, note) ->
              glow.bind("radius") { v[0] }
              glow.bind("intensity") { v[1] }
              glow.bind("falloff") { v[2] }
              scope.capture().save(dir.resolve(name), note)
          }
          keyframeBrowser(dir, scope = scope, width = 760, height = 330)
  - execute:
      box: tour_keys
      property: code
  - wait:
      millis: 1500
