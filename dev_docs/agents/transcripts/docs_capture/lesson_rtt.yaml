name: lesson_rtt
description: >
  The render-to-texture lessons of canonical_graphics, rebuilt from their sidecars: window, 5. RTT, 5. draw rtt. 5. RTT draws into an offscreen target; its child 5. draw rtt samples that target on a quad in the window.
docs:
  - page: afield_four_graphics.md
    why: "Rebuilds the lesson chain this page captures, from the canonical_graphics sidecars."
operations:
  - create:
      box: lesson_rtt_0
      name: 'window'
      frame: { x: 40.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          The renderer window: the parent box every graphics lesson runs beneath.

          It opens a native Window, builds a Renderer for it and runs the frame loop. Connect a lesson box below
          this one and that box can use `renderer` directly; the two `prop` lines below publish `window` and
          `renderer` to every box beneath this one in the graph.
          */
          import afield.graphics.vulkan.util.Options

          prop<Window>(window)
          prop<Renderer>(renderer)

          // Ask for an HDR swapchain where the display supports one.
          Options.enableHDR = true

          // `once` builds the Window and Renderer the first time this box runs and keeps them on later runs, so
          // re-running the box does not open a second window.
          once.renderer {
              window = Window("Field", initialDimensions = Rect(80.0, 80.0, 640.0, 393.0))
              Renderer(window)
          }

          // Run the renderer's frame loop until this box is stopped.
          start(renderer::run)
  - create:
      box: lesson_rtt_1
      name: '5. RTT'
      frame: { x: 40.0, y: 200.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          Render to texture: drawing offscreen.

          A RenderToTexture is an offscreen image a module can draw into instead of the window. This box
          publishes it as `target`; a child box can then republish it under the sampler name its own
          fragment shader declares and draw it. Run this box beneath the renderer (`window`) box.
          */
          import org.lwjgl.vulkan.VK10.*

          prop<RenderToTexture>(target) = RenderToTexture {
              clearFirst = false
              useDepth = true
              // A disabled alternative: a 16-bit float colour format for the target.
              //  format = VK_FORMAT_R16G16B16A16_SFLOAT
          }

          // Schedule the offscreen pass as part of every frame.
          renderer.renderList += "target" to target

          var module = moduleHere {
              // Match the module's pipeline (colour format, depth) to the target it draws into.
              +target
              // A disabled alternative: a 16-bit float colour format for the module.
              //  imageFormat = VK_FORMAT_R16G16B16A16_SFLOAT
          }
          var m = Mesh()

          module += "mainMesh" to m
          // Draw into the target rather than into the window.
          target += "boo" to module

          val camera = Camera()
          m.p = camera.p
          m.m = camera.m

          // Target parameters stay live: this can be changed while the box runs.
          target.parameters.clearFirst = true

          var kc by keyCamera(camera = camera)
          // loop runs its body once per frame, rebuilding one large triangle each time. The body's value
          // (the trailing `true`) is not used.
          loop {
              m.set(3, 1) {
                  val z = Math.random() * 0.0
                  pos.add(-3, 1, -1 + z, 1.0, -20.3, z, 3, 3, z)
                  tri.add(0, 1, 2)
              }
              true
          }
        vertex: |
          #version 450
          layout (location = 0) in vec3 pos;

          layout(push_constant) uniform matrices {
              mat4 p;
              mat4 m;
          } pc;

          void main()
          {
              gl_Position = pc.p * pc.m * vec4(pos, 1);
          }
        fragment: |
          #version 450
          layout(location = 0) out vec4 uFragColor;

          layout(push_constant) uniform matrices {
              mat4 p;
              mat4 m;
          } pc;

          void main()
          {
              uFragColor = vec4(1,1,1,1);
          }
  - create:
      box: lesson_rtt_2
      name: '5. draw rtt'
      frame: { x: 40.0, y: 360.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          /*
          5. draw rtt: draws the offscreen target from `5. RTT` onto a quad in the window.
          Parent chain: window -> 5. RTT. The parent publishes `target`, a RenderToTexture it draws into.
          The fragment shader (open it with the editor's property switcher) declares `sampler2D bbc`;
          publishing the target under the same name `bbc` is what binds it to that sampler.
          */
          prop<RenderToTexture>(bbc) = target

          // A module beneath the window renderer, holding one mesh.
          var module = moduleHere()
          var mesh = Mesh()
          module += "mainMesh" to mesh
          renderer += "boo" to module

          val camera = Camera()
          // The quad runs from (-1, -1) to (1, 1): close enough that it fills the window.
          camera.at = vec(0, 0, -1.2)
          mesh.p = camera.p
          mesh.m = camera.m

          // Focus the renderer window to move the camera with the keyboard.
          var kc by keyCamera(camera = camera)
          mesh.set(4, 2) {
              // A 2x2 quad at z = 0: 4 vertices with texture coordinates, 2 triangles.
              val z = 0.0
              pos.add(
                  -1,
                  -1,
                  z,
                  1.0,
                  -1.0,
                  z,
                  1,
                  1,
                  z,
                  -1.0,
                  1,
                  z,
              )
              tc.add(0, 0, 1, 0, 1, 1, 0, 1)
              tri.add(0, 1, 2)
              tri.add(0, 2, 3)
          }
        vertex: |
          #version 450
          layout (location = 0) in vec3 pos;
          layout (location = 1) in vec2 tc;

          layout (location = 1) out vec2 ftc;

          layout(push_constant) uniform matrices {
              mat4 p;
              mat4 m;
          } pc;

          void main()
          {
              gl_Position = pc.p * pc.m * vec4(pos, 1);
              ftc = tc;
          }
        fragment: |
          #version 450
          layout(location = 0) out vec4 uFragColor;
          layout(location = 1) in vec2 ftc;

          layout(set=0, binding = 0) uniform sampler2D bbc;

          void main()
          {
              // .yx swaps the texture coordinates, so the target appears transposed on the quad.
              vec4 c = texture(bbc, ftc.yx);
              uFragColor = vec4(c.rgb, 1.0);
          }
  - connect: { parent: lesson_rtt_0, child: lesson_rtt_1 }
  - connect: { parent: lesson_rtt_1, child: lesson_rtt_2 }
  - launch: { box: lesson_rtt_0, property: code, strand: renderer }
  - await: {}
  - launch: { box: lesson_rtt_1, property: code }
  - await: {}
  - launch: { box: lesson_rtt_2, property: code }
  - await: {}
