name: vec2_gestures
description: A live controlGroup vec2 pad for the XY-pad interaction capture in visualizers.md.
operations:
  - create:
      box: vec2_gestures
      name: vec2 gestures
      frame: { x: 80.0, y: 100.0, w: 230.0, h: 105.0 }
      properties:
        code: |
          val trail = mutableListOf<Vector2f>()
          fun showTrail(v: Vector2f) {
              trail += Vector2f(v)
              val dots = fline {
                  for (p in trail.takeLast(60)) circle(150 + p.x * 130, 150 - p.y * 130, 3)
                  filled = true
                  stroked = false
                  color = vec(0.05, 0.78, 0.93, 1.0)
              }
              lines(
                  dots,
                  channel = "what the box received",
                  w = 300.0,
                  h = 300.0,
                  framing = LinesFraming.fixed(0.0, 0.0, 300.0, 300.0),
              )
              markdown("coordinates", "(${v.x.f2}, ${v.y.f2})")
          }
          controlGroup("controls") {
              vec2Control("orbit", initialValue = Vector2f(0.0f, 0.0f), step = 0.01) { v -> showTrail(v) }
          }
          displayOpen("controls")
          displayOpen("what the box received")
  - launch: { box: vec2_gestures }
  - wait:
      millis: 800
