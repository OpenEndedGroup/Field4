name: context_why_graph
description: |
  Setup for `public/docs/why.md`. Four boxes: "Settings" holds a `speed` property; under it
  "Fast" leaves a Kotlin variable `speed = 3.0`; beside Fast, "Slow" leaves `speed = 0.5`; and
  "Mover", a child of Fast and then of Slow, asks `ContextResolution.explain(thisBox, "speed")`
  and displays the answer. Fast and Slow are the same distance from Mover and disagree, so the
  answer is a tie settled by parents order; Settings, two edges up, is shadowed. The capture is
  Mover's output panel.
operations:
  - create:
      box: why_settings
      name: Settings
      frame: { x: 40.0, y: 40.0, w: 200.0, h: 60.0 }
      properties:
        speed: "0.25"
        code: |
          // holds the property `speed`
  - create:
      box: why_fast
      name: Fast
      frame: { x: 40.0, y: 180.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          val speed = 3.0
  - create:
      box: why_slow
      name: Slow
      frame: { x: 400.0, y: 180.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          val speed = 0.5
  - create:
      box: why_mover
      name: Mover
      frame: { x: 220.0, y: 340.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          val why = ContextWhy.plain(ContextResolution.explain(thisBox, "speed")) as Map<*, *>
          fun named(key: String) = (why[key] as List<*>).map { c ->
              val m = c as Map<*, *>
              ((m["supplier"] ?: m) as Map<*, *>)["name"]
          }
          val supplier = why["supplier"] as Map<*, *>

          display("main", "<pre style='white-space:pre-wrap;max-width:720px'>" +
              "supplier   ${supplier["name"]}, ${why["matchKind"]} ${why["matchedName"]} = ${why["value"]}\n" +
              "path       ${named("path").joinToString(" → ")}\n" +
              "competing  ${named("competing")}\n" +
              "shadowed   ${named("shadowed")}\n" +
              "the walk   fromContextWithNameOrNull&lt;Double&gt;(\"speed\") = ${fromContextWithNameOrNull<Double>("speed")}\n\n" +
              "${why["summary"]}</pre>")
  - connect: { parent: why_settings, child: why_fast }
  - connect: { parent: why_fast, child: why_mover }
  - connect: { parent: why_slow, child: why_mover }
  - execute: { box: why_fast, property: code }
  - execute: { box: why_slow, property: code }
  - execute: { box: why_mover, property: code }
  - await: {}
  - wait: { frames: 10 }
