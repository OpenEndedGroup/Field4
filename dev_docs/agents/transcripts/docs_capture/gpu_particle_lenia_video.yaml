name: gpu_particle_lenia_video
description: >
  The video of particle_lenia.md's GPU section: the scene of particle_lenia_gpu on a smaller
  window, so the native recording keeps a smooth frame rate. A renderer box and 6400 Particle
  Lenia particles (64 clusters of 100, rotator rule) settling into creatures that turn and merge.
docs:
  - page: particle_lenia.md
    why: "Builds the GPU video in the Thousands of particles on the GPU section."
operations:
  - create:
      box: plv_renderer
      name: renderer
      frame: { x: 40.0, y: 40.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          import afield.graphics.vulkan.util.Options

          prop<Window>(window)
          prop<Renderer>(renderer)
          Options.enableHDR = false
          Options.profiling = false
          once.renderer {
              window = Window("Particle Lenia", initialDimensions = Rect(80.0, 80.0, 640.0, 360.0))
              Renderer(window)
          }
          println("renderer ready")
          start(renderer::run)
  - create:
      box: plv_lenia
      name: "6400 Particle Lenia particles"
      frame: { x: 40.0, y: 200.0, w: 300.0, h: 100.0 }
      properties:
        code: |
          import afield.simulation.physics.ShaderParticleLenia

          prop<ShaderParticleLenia>(lenia)

          // 64 clusters of 100 particles under the rotator rule: 6400 particles, one creature per cluster.
          once.lenia {
              val grid = GpuNeighbourGrid(
                  capacity = 6400,
                  cellsPerSide = 40,
                  domainMin = Vector2f(-120f, -120f),
                  domainSize = 240f,
                  renderer = renderer,
                  name = "leniaGrid",
              )
              ShaderParticleLenia(grid, 6400, renderer, ParticleLeniaParams(sigmaK = 0.6, cRep = 0.3), name = "lenia")
                  .also {
                      it.reset(creatures = 64, perCreature = 100, side = 8.5f, spacing = 26f, seed = 1)
                      it.install(renderer.renderList.others)
                      it.installDrawInto()
                  }
          }

          lenia.substeps = 20
          lenia.pointSize = 2f
          lenia.viewScale = 110f
          println("particles: " + lenia.count + ", cutoff " + lenia.cutoff + ", cell " + lenia.grid.cellSize)
  - connect: { parent: plv_renderer, child: plv_lenia }
  - launch: { box: plv_renderer, property: code, strand: renderer }
  - await: { wait: pending }
  - launch: { box: plv_lenia, property: code }
  - await: { wait: pending }
