name: box_graph_diamond
description: |
  Setup for `public/docs/box_graph.md`, "Nearer wins" and "Two parents". Garden sets petals = 5.
  Left (petals = 7) and Right (petals = 9) are its children; Sibling is a third child that only
  reads. Bloom has two parents, connected Right first, then Left. Every box runs once, parents
  first; the page captures Sibling and Bloom, and the whole canvas.
operations:
  - create:
      box: bgd_garden
      name: Garden
      frame: { x: 200.0, y: 40.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          prop<Int>(petals) = 5
  - create:
      box: bgd_left
      name: Left
      frame: { x: 40.0, y: 180.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          petals = 7
  - create:
      box: bgd_right
      name: Right
      frame: { x: 360.0, y: 180.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          petals = 9
  - create:
      box: bgd_sibling
      name: Sibling
      frame: { x: 600.0, y: 180.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          markdown("Sibling sees petals = $petals")
  - create:
      box: bgd_bloom
      name: Bloom
      frame: { x: 200.0, y: 320.0, w: 200.0, h: 60.0 }
      properties:
        code: |
          markdown("Bloom sees petals = $petals")
  - connect: { parent: bgd_garden, child: bgd_left }
  - connect: { parent: bgd_garden, child: bgd_right }
  - connect: { parent: bgd_garden, child: bgd_sibling }
  - connect: { parent: bgd_right, child: bgd_bloom }
  - connect: { parent: bgd_left, child: bgd_bloom }
  - execute: { box: bgd_garden, property: code }
  - execute: { box: bgd_left, property: code }
  - execute: { box: bgd_right, property: code }
  - execute: { box: bgd_sibling, property: code }
  - execute: { box: bgd_bloom, property: code }
  - await: {}
  - wait: { frames: 10 }
