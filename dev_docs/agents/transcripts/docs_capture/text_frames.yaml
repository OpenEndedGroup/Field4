name: text_frames_docs
description: Real text frames, a FileManager-resolved image, and a live custom marking menu for the public guide.
operations:
  - create:
      box: prepare_image
      name: prepare image
      frame: { x: 1300.0, y: 55.0, w: 100.0, h: 40.0 }
      properties:
        code: |
          val drawing = java.io.File("public/docs/assets/text_frames/diagram.svg").readText()
          files.file("%document/frame-diagram.svg").writeText(drawing)
  - execute: { box: prepare_image, property: code }
  - create:
      box: writing
      name: Research notes
      frame: { x: 50.0, y: 55.0, w: 440.0, h: 370.0 }
      properties:
        box_kind: text-frame
        default_property: contents
        contents_language: markdown
        textFrame: |
          fontSize: 16
          sizing: grow
          reflow: false
        contents: |
          # A place to think

          Write **on the canvas**. Connect an observation to the next question.

          ![Observe, write, connect](%document/frame-diagram.svg)

          - Keep the evidence close.
          - Turn a thought into a connected frame.

          The source stays ordinary Markdown.
  - create:
      box: next_thought
      name: Next question
      frame: { x: 50.0, y: 490.0, w: 440.0, h: 145.0 }
      properties:
        box_kind: text-frame
        default_property: contents
        contents_language: markdown
        textFrame: |
          fontSize: 16
          sizing: grow
          reflow: false
        contents: |
          ## What happens next?

          Another frame, the same width, already connected.
  - connect: { parent: writing, child: next_thought }
  - create:
      box: menu_example
      name: Draft
      frame: { x: 720.0, y: 270.0, w: 160.0, h: 65.0 }
      properties:
        code: |
          markingMenu {
              item("N", "Rename") { name = "Revised draft" }
              submenu("E", "Status") {
                  item("N", "Ready") { name = "Ready" }
                  item("S", "Needs work") { name = "Needs work" }
                  submenu("E", "More") {
                      item("S", "Archive") { name = "Archived" }
                  }
              }
          }
  - execute: { box: menu_example, property: code }
