name: audio_ai_codec
description: >
  Loadable executable companion to public/docs/audio_ai_codec.md. It exercises the real
  afield.audio.ai.CodecVisualization renderer with committed real music, EnCodec tokens, reconstruction and measured errors.
  The files are exported from the isolated GPU service by tools/capture_elsewhere_audio.py.
operations:
  - create:
      box: encodec_reconstruction_microscope
      name: EnCodec reconstruction microscope
      frame: { x: 80.0, y: 80.0, w: 340.0, h: 100.0 }
      properties:
        code: |
          import java.io.File

          val json = FieldAudioClient.json
          val folder = File("public/docs/assets/audio_ai_codec")
          val result = json.decodeFromString<CodecReconstructionResult>(File(folder, "result.json").readText())
          val data = CodecVisualization.load(
              result,
              File(folder, "source.wav").toPath(),
              File(folder, "reconstruction.wav").toPath(),
              File(folder, "tokens.npy").toPath(),
          )
          display("main", CodecVisualization.renderHtml(data, width = 1040))
  - execute: { box: encodec_reconstruction_microscope }
