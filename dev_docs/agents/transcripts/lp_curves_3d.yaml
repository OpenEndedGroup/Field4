name: lp_curves_3d
description: >
  Linear-programming algorithms as curve generators in three dimensions — the companion to
  `public/docs/lp_curves.md` (In three dimensions). Two boxes over `LpPolytope`
  (src/jvmMain/kotlin/afield/geometry/spatial/lp_polytope.kt), both drawing through `three { }`, so
  no Window and no Renderer: the solid and the routes are FLines and a TriMesh in the Three.js viewer.

    1. lp3_routes — the convex hull of a seeded point cloud and one objective direction, with four
       routes to the same vertex: the central path, the primal-dual iterates, the simplex walk along
       the hull's edges and a PDHG spiral. Change `c` or the seed and re-run; orbit the view.
    2. lp3_fan — the same hull with a fan of central paths, one per direction spread over the
       sphere, turning on a turntable. Change `directions` or the cloud and re-run.
docs:
  - page: lp_curves.md#in-three-dimensions
    why: "The section these LpPolytope boxes accompany."
operations:
  - create:
      box: lp3_routes
      name: every route to one vertex, in 3-D
      frame: { x: 80.0, y: 80.0, w: 420.0, h: 120.0 }
      properties:
        code: |
          val random = kotlin.random.Random(11)
          val cloud = List(70) {
              vec(random.nextDouble(-1.6, 1.6), random.nextDouble(-1.0, 1.0), random.nextDouble(-1.0, 1.0))
          }
          val polytope = LpPolytope.hull(cloud)
          val c = vec(1.0, 0.5, 0.3)
          val far = polytope.vertices.indexOf(polytope.optimalVertex(vec(-1.0, -0.5, -0.3)))

          val central = polytope.centralPath(c)
          val pd = polytope.primalDual(c)
          val walk = polytope.simplexWalk(c, startVertex = far)
          val spiral = polytope.pdhg(c, iterations = 800, tau = 0.25, sigma = 0.25)

          three(name = "routes", width = 760, height = 470) {
              mesh(polytope.toMesh(), wireframe = false, opacity = 0.1, cullBackFaces = false)
              lines(polytope.toFLine(vec(0.62, 0.70, 0.80, 0.5)))
              lines(
                  central.toFLine(vec(1.0, 0.72, 0.32, 1.0), 2.4),
                  pd.toFLine(vec(0.55, 0.9, 0.6, 1.0), 1.6),
                  walk.toFLine(vec(0.6, 0.75, 1.0, 1.0), 3.0),
                  spiral.trajectory.toFLine(vec(1.0, 0.55, 0.85, 0.8), 1.0),
              )
              camera(yaw = 20.0, pitch = 20.0)
              title("${polytope.vertices.size} hull vertices, ${polytope.constraintCount} faces")
              caption("orange: central path · green: primal-dual, ${pd.samples.size - 1} steps · blue: simplex, ${walk.samples.size - 1} pivots · pink: PDHG")
          }
          "every route ends at %s".format(polytope.optimalVertex(c))
  - create:
      box: lp3_fan
      name: a fan of central paths, turning
      frame: { x: 80.0, y: 640.0, w: 420.0, h: 120.0 }
      properties:
        code: |
          val random = kotlin.random.Random(11)
          val cloud = List(70) {
              vec(random.nextDouble(-1.6, 1.6), random.nextDouble(-1.0, 1.0), random.nextDouble(-1.0, 1.0))
          }
          val polytope = LpPolytope.hull(cloud)
          val directions = 120
          val fan = polytope.centralFan(directions = directions, samples = 80)

          three(name = "fan", width = 700, height = 470) {
              mesh(polytope.toMesh(), wireframe = false, opacity = 0.12, cullBackFaces = false)
              lines(polytope.toFLine())
              lines(fan.toFLines(alpha = 0.85, thickness = 1.2))
              camera(yaw = 32.0, pitch = 24.0)
              title("${fan.size} central paths over a ${polytope.constraintCount}-face hull")
              turntable(degreesPerSecond = 20.0)
          }
          "${fan.size} paths"
  - execute:
      box: lp3_routes
  - execute:
      box: lp3_fan
