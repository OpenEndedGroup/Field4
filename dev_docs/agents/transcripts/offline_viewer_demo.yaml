# The saved drawing is restored by the final root-property operation.
name: "offline_viewer_demo"
description: >
  Three boxes for the offline viewer and the drawing layer: a small flock on a ring,
  an SVG alignment chart, and a sketch that annotates both boxes. The saved drawing
  is visible before running anything; re-run sketch in Field to replace its marks.
  Pure CPU, no native renderer or network.
docs:
  - page: drawing_and_notation.md
    why: "The drawing layer, box-owned marks, and the offline viewer."
operations:
  - create:
      box: "995d4515-cba7-425d-a369-cc80dd953245"
      name: "flock"
      frame: { x: 40.0, y: 40.0, w: 260.0, h: 120.0 }
      properties:
        "autorun": false
        "code": |
          // A flock in one dimension: n birds on a ring, each nudging toward the mean heading of its
          // neighbours. Prints how aligned the flock is after each round.
          val n = 24
          val rnd = java.util.Random(4)
          var heading = DoubleArray(n) { rnd.nextDouble() * 2 * Math.PI }
          fun alignment(h: DoubleArray) = Math.hypot(h.sumOf { Math.cos(it) }, h.sumOf { Math.sin(it) }) / h.size
          for (round in 0..6) {
              println("round $round: alignment ${(alignment(heading)).f3}")
              heading =
                  DoubleArray(n) { i ->
                      val l = heading[(i + n - 1) % n]
                      val r = heading[(i + 1) % n]
                      val me = heading[i]
                      Math.atan2(Math.sin(l) + Math.sin(me) + Math.sin(r), Math.cos(l) + Math.cos(me) + Math.cos(r))
                  }
          }
        "notes": |
          # Flock

          Twenty-four birds sit on a ring. Each round, every bird turns toward the **mean heading** of
          itself and its two neighbours. `alignment` is the length of the average heading vector: 0 when the
          birds point every which way, 1 when they all agree.

          Run it and watch the number climb. Neighbours only ever see neighbours, yet the whole ring comes
          to agree.
  - create:
      box: "b4fffaa4-cf67-48c0-8108-2cd3b969a7df"
      name: "chart"
      frame: { x: 440.0, y: 40.0, w: 260.0, h: 120.0 }
      properties:
        "autorun": false
        "code": |
          // Draws alignment against round as an SVG polyline in the box's output.
          val values = [0.468, 0.609, 0.665, 0.702, 0.732, 0.757, 0.779]
          val pts = values.mapIndexed { i, v -> "${20 + i * 40},${120 - v * 100}" }.joinToString(" ")
          display(
              "main",
              """<svg width="290" height="140" style="background:#111">
            <polyline points="$pts" fill="none" stroke="#48c9ff" stroke-width="2"/>
            <text x="20" y="135" fill="#888" font-size="11">round 0 .. 6</text>
          </svg>""",
          )
          println("drew ${values.size} points")
        "notes": |
          # Chart

          The numbers `flock` prints, drawn as a line.

          | round | alignment |
          | ---: | :--- |
          | 0 | 0.468 |
          | 3 | 0.702 |
          | 6 | 0.779 |

          > The values are typed in rather than read from `flock`, to keep this box independent.
  - create:
      box: "74a7be47-7f7c-421a-ad3f-10afab498c12"
      name: "sketch"
      frame: { x: 240.0, y: 340.0, w: 200.0, h: 80.0 }
      properties:
        "autorun": false
        "code": |
          /*
          Writes this document's drawing layer: a frame around the two boxes, an arrow between them,
          a heading, and a hand-drawn underline. The marks belong to this box: run it again and they
          are replaced in place.
          */
          val flock = inside.boxes.values.first { it.name == "flock" }
          val chart = inside.boxes.values.first { it.name == "chart" }
          notation {
              roughness = 0.0
              text("reading a flock", 40, -70, size = 28)
              stroke((0..40).map { vec(40 + it * 6.5, -28 + 4 * sin(it / 3.0)) }, stroke = "#e03131")
              rect(20, 0, 700, 200, stroke = "#1971c2")
              arrow(from = flock, to = chart, label = "plots")
              ellipse(410, 230, 220, 70, label = "converges", fill = "#b2f2bb", fillStyle = "hachure")
              diamond(60, 230, 140, 80, label = "ring", fill = "#ffec99")
          }
          println("${notation.mine.size} marks")
        "layers": "default,annotation"
        "notes": |
          # Sketch

          This box writes the document's **drawing layer** from code with `notation { ... }`: a frame, an
          arrow from `flock` to `chart`, a heading and a freehand underline. In Field you can also draw on
          the layer by hand (Alt+D).

          The offline viewer draws the same scene, in the same world coordinates, under the boxes.

          - the frame is a `rect`
          - the arrow follows the boxes when they move
          - the underline is a `stroke`, the same kind of mark as one drawn with the pen
