name: ray_reconstruction
description: Compare raw RTXDI, spatial filtering, DLAA and DLSS Ray Reconstruction at 1080p.
docs:
  - page: ray_reconstruction.md
    why: "Explains the Ray Reconstruction denoiser this document runs."
  - page: reconstruction_plumbing.md
    why: "Shows how to wire its inputs from your own modules."
operations:
- create:
    box: agent_graphics_context
    name: renderer
    frame:
      x: 40.0
      y: 40.0
      w: 300.0
      h: 100.0
    properties:
      code: "import afield.graphics.vulkan.util.Options\n\nprop<Window>(window)\nprop<Renderer>(renderer)\n\nOptions.enableVR = false\nOptions.enableHDR = false\nOptions.profiling = false\n\nonce.renderer {\n    window = Window(\"Field\")\n    Renderer(window)\n}\n\nprintln(\"agent graphics renderer ready\")\nstart(renderer::run)\n"
- launch:
    box: agent_graphics_context
    property: code
    type: code
    strand: renderer
    code: "import afield.graphics.vulkan.util.Options\n\nprop<Window>(window)\nprop<Renderer>(renderer)\n\nOptions.enableVR = false\nOptions.enableHDR = false\nOptions.profiling = false\n\nonce.renderer {\n    window = Window(\"Field\")\n    Renderer(window)\n}\n\nprintln(\"agent graphics renderer ready\")\nstart(renderer::run)\n"
- wait:
    frames: 3
- create:
    box: ray_reconstruction
    name: ray reconstruction
    frame:
      x: 400.0
      y: 160.0
      w: 420.0
      h: 100.0
    properties:
      code: |-
        import afield.media.reconstruction.*

        prop<RayReconstructionDemo>(lab)
        fromContextWithNameOrNull<RayReconstructionDemo>("lab")?.close()
        NgxSupport.rayReconstructionAvailability(renderer.device).getOrThrow()
        lab = RayReconstructionDemo(renderer)
        var requested = 3
        var animate = true
        var camera = true
        var cut = false
        controlGroup("ray reconstruction") {
            slider("0: Raw · 1: Spatial · 2: Spatial + DLAA · 3: RR", min = 0.0, max = 3.0, step = 1.0, initialValue = 3.0) {
                requested = it.toInt()
            }
            checkbox("Move light", initialValue = true) { animate = it }
            checkbox("Move camera", initialValue = true) { camera = it }
            button("Cut / reset history") { if (it) cut = true }
        }
        displayOpen("ray reconstruction")
        println("1920 × 1080. RR consumes raw RTXDI. The spatial filter and DLAA are alternative paths.")
        frames {
            while (true) {
                lab.path = RayReconstructionDemo.Path.entries[requested]
                lab.animate = animate
                lab.cameraMotion = camera
                if (cut) {
                    lab.time += 4
                    lab.reset("live cut")
                    cut = false
                }
                frame()
            }
        }
            .end { lab.close() }
- connect:
    parent: agent_graphics_context
    child: ray_reconstruction
- launch:
    box: ray_reconstruction
    property: code
    type: code
    strand: scene
    code: |-
      import afield.media.reconstruction.*

      prop<RayReconstructionDemo>(lab)
      fromContextWithNameOrNull<RayReconstructionDemo>("lab")?.close()
      NgxSupport.rayReconstructionAvailability(renderer.device).getOrThrow()
      lab = RayReconstructionDemo(renderer)
      var requested = 3
      var animate = true
      var camera = true
      var cut = false
      controlGroup("ray reconstruction") {
          slider("0: Raw · 1: Spatial · 2: Spatial + DLAA · 3: RR", min = 0.0, max = 3.0, step = 1.0, initialValue = 3.0) {
              requested = it.toInt()
          }
          checkbox("Move light", initialValue = true) { animate = it }
          checkbox("Move camera", initialValue = true) { camera = it }
          button("Cut / reset history") { if (it) cut = true }
      }
      displayOpen("ray reconstruction")
      println("1920 × 1080. RR consumes raw RTXDI. The spatial filter and DLAA are alternative paths.")
      frames {
          while (true) {
              lab.path = RayReconstructionDemo.Path.entries[requested]
              lab.animate = animate
              lab.cameraMotion = camera
              if (cut) {
                  lab.time += 4
                  lab.reset("live cut")
                  cut = false
              }
              frame()
          }
      }
          .end { lab.close() }
- wait:
    frames: 12
