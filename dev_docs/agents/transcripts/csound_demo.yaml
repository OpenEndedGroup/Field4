name: csound_demo
description: |
  **Csound inside Field.** A Kotlin root whose children are Csound, three Csound boxes holding `.csd`
  text, and five Kotlin boxes that talk to Csound in every direction. Needs libcsound:
  `./gradlew buildCsoundNative` once (cmake, flex, bison, libsndfile, and the network the first time).

    - **csound** (the root, Kotlin) — where libcsound was found. Its `mainLanguage` makes the three
      boxes under it Csound.
    - **pluck** (Csound) — a plucked-string instrument through a global reverb on a `chnmix` bus, a
      MIDI-played `Key` instrument, and a short score. Launch it (Alt-0). Then, while it plays, put the
      cursor on one of the last two score lines and press Alt-Enter to play that note now; or edit
      the `butterlp` line in `instr Pluck` and press Alt-Enter anywhere inside the instrument to
      recompile it live. Rest the cursor on `instr Pluck` to see how many events the score gives it.
    - **fx** (Csound) — a reverb whose input is the a-rate channel `in`. Launch it, then launch
      **Field into fx**.
    - **typo** (Csound) — `oscilx` for `oscili`; launching it marks that line.
    - **talk to pluck** (Kotlin) — while **pluck** plays: k- and S-channels both ways, score events
      with p-fields from Kotlin values, and `outvalue` callbacks from the orchestra.
    - **keys** (Kotlin, launch) — MIDI notes into **pluck**'s `massign`ed `Key` instrument.
    - **Field into fx** (Kotlin, launch) — a Field sawtooth into **fx**, and fx's reverb tail back out
      as a Field signal, played by Field.
    - **through Csound, measured** (Kotlin) — offline: a Field sine through a Csound `butterlp` and
      back, its attenuation compared with the filter's, and both drawn.
    - **a table from Kotlin** (Kotlin) — a wavetable computed in Kotlin, written into an ftable,
      played by `poscil`, read back and drawn.
operations:
  - create:
      box: cs_root
      name: "csound — children of this box are Csound"
      frame: { x: 40.0, y: 40.0, w: 420.0, h: 80.0 }
      properties:
        mainLanguage: csound
        isCsoundRoot: true
        code: |
          // This root stays Kotlin; its `mainLanguage` makes the boxes under it Csound.
          println(afield.csound.CsoundLibrary.describe())
  - create:
      box: cs_pluck
      name: "pluck"
      frame: { x: 40.0, y: 180.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Csound
        code: |
          <CsoundSynthesizer>
          <CsOptions>
          -m0
          </CsOptions>
          <CsInstruments>
          ; sr, ksmps, nchnls and 0dbfs come from Field: 48000, 32, 2 and 1.

          chn_k "cutoff", 1, 3, 2400, 200, 8000   ; written by Field, read here
          chn_k "level",  2                       ; written here, read by Field
          chn_S "voice",  3

          massign 0, "Key"                        ; MIDI notes, from any channel

          instr Pluck                             ; p4 MIDI note, p5 level in dBFS
            icps  =         cpsmidinn(p4)
            asig  pluck     ampdbfs(p5), icps, icps, 0, 1
            kcut  chnget    "cutoff"
            kcut  port      kcut, 0.02
            asig  butterlp  asig, kcut
            aenv  linsegr   1, p3, 1, 0.3, 0
            asig  =         asig * aenv
                  chnmix    asig * 0.25, "reverb"
                  outs      asig, asig
          endin

          instr Key
            inote notnum
                  prints    "Key %d\n", inote
            icps  cpsmidi
            iamp  ampmidi   0.3
            asig  pluck     iamp, icps, icps, 0, 1
            aenv  madsr     0.005, 0.1, 0.6, 0.4
                  chnmix    asig * aenv * 0.25, "reverb"
                  outs      asig * aenv, asig * aenv
          endin

          instr Reverb
            ain     chnget    "reverb"
            aL, aR  reverbsc  ain, ain, 0.85, 10000
                    outs      aL, aR
                    chnclear  "reverb"
            krms    rms       aL + ain
                    chnset    krms, "level"
                    outvalue  "level", krms
            Svoice  chnget    "voice"
                    outvalue  "said", Svoice
          endin
          </CsInstruments>
          <CsScore>
          i "Reverb" 0 z
          i "Pluck"  0    0.5  57  -12
          i .        +    .    60  .
          i .        +    .    64  .
          i .        +    1.5  67  -9
          ; Alt-Enter one of these while the box plays:
          i "Pluck"  0    1    69  -9
          i "Pluck"  0    2    45  -6
          </CsScore>
          </CsoundSynthesizer>
  - create:
      box: cs_fx
      name: "fx"
      frame: { x: 230.0, y: 180.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Csound
        code: |
          <CsoundSynthesizer>
          <CsInstruments>
          ; The a-rate channel "in" is fed by Field: launch "Field into fx".
          chn_a "in",  1
          chn_a "wet", 2

          instr Space
            ain     chnget    "in"
            aL, aR  reverbsc  ain, ain, 0.9, 8000
                    outs      ain * 0.5 + aL * 0.5, ain * 0.5 + aR * 0.5
                    chnset    aL, "wet"
          endin
          </CsInstruments>
          <CsScore>
          i "Space" 0 z
          </CsScore>
          </CsoundSynthesizer>
  - create:
      box: cs_typo
      name: "typo"
      frame: { x: 420.0, y: 180.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Csound
        code: |
          <CsoundSynthesizer>
          <CsInstruments>
          instr Beep
            asig  oscilx  0.2, 440       ; there is no oscilx: Csound's error lands on this line
                  outs    asig, asig
          endin
          </CsInstruments>
          <CsScore>
          i "Beep" 0 1
          </CsScore>
          </CsoundSynthesizer>
  - create:
      box: cs_talk
      name: "talk to pluck"
      frame: { x: 40.0, y: 320.0, w: 160.0, h: 80.0 }
      properties:
        code: |
          // Launch "pluck" first. Every line here talks to the Csound it is playing.
          val pluck = csoundOf("pluck").csound

          pluck.setChannel("cutoff", 900)                 // chnget "cutoff" reads it next k-cycle
          pluck.setStringChannel("voice", "from Kotlin")  // an S channel; Reverb outvalues it back
          println("level now: ${"%.4f".format(pluck.channel("level"))}")

          // Score events with p-fields from Kotlin values: a rising arpeggio, half a second apart.
          listOf(57, 60, 64, 69).forEachIndexed { k, note ->
              pluck.event("i \"Pluck\" ${k * 0.5} 0.5 $note -12")
          }

          // outvalue calls back on Field's main thread.
          pluck.onOutvalue("said") { println("Csound said: $it") }
          var n = 0
          pluck.onOutvalue("level") { v -> if (n++ % 40 == 0) display("level", "<div style='padding:8px'>Reverb rms ${"%.4f".format(v as Double)}</div>") }
  - create:
      box: cs_keys
      name: "keys"
      frame: { x: 230.0, y: 320.0, w: 160.0, h: 80.0 }
      properties:
        code: |
          // Launch "pluck" first, then launch this: MIDI notes into its massign'ed instr Key.
          val pluck = csoundOf("pluck").csound
          val notes = listOf(62, 65, 69, 72, 69, 65)
          var i = 0
          loop {
              val note = notes[i++ % notes.size]
              pluck.noteOn(0, note, 90)
              delay(220)
              pluck.noteOff(0, note)
              delay(30)
          }
  - create:
      box: cs_into_fx
      name: "Field into fx"
      frame: { x: 420.0, y: 320.0, w: 160.0, h: 80.0 }
      properties:
        code: |
          // Launch "fx" first. A Field sawtooth goes into its a-rate channel "in"; the reverb's
          // left channel, chnset into "wet", comes back as a Field signal that Field plays.
          val fx = csoundOf("fx")
          val saw = SawOsc(Param(110f)) * Param(0.15f)
          fx.node.connect("in", saw)
          fx.node.audioOut("wet").pan(-0.5f)
  - create:
      box: cs_measured
      name: "through Csound, measured"
      frame: { x: 610.0, y: 320.0, w: 160.0, h: 80.0 }
      properties:
        code: |
          // Offline: a Field 1 kHz sine through Csound's butterlp at 500 Hz, and back.
          val cs = afield.csound.CsoundInstance("""
          instr Filter
            ain   chnget    "in"
            alow  butterlp  ain, 500
                  chnset    alow, "low"
          endin
          """, "i \"Filter\" 0 z")
          val node = cs.node(audioIn = mapOf("in" to SineOsc(Param(1000f))))
          val (dry, low) = renderSignalsOffline(0.5, SineOsc(Param(1000f)), node.audioOut("low"))
          cs.close()

          fun rms(x: FloatArray) = sqrt(x.drop(4800).sumOf { it.toDouble() * it } / (x.size - 4800))
          val expected = 1.0 / sqrt(1.0 + 16.0)    // a 2nd-order Butterworth at twice its cutoff
          println("in rms ${"%.4f".format(rms(dry))}, out rms ${"%.4f".format(rms(low))}: gain ${"%.4f".format(rms(low) / rms(dry))}, Butterworth says ${"%.4f".format(expected)}")
          val window = 4800 until 5040
          showSignals("Field sine" to window.map { dry[it] }, "after Csound's butterlp" to window.map { low[it] },
              x = window.map { it / 48.0 }, channel = "signals", title = "1 kHz in, butterlp 500 Hz, back to Field", xTitle = "ms")
  - create:
      box: cs_table
      name: "a table from Kotlin"
      frame: { x: 610.0, y: 180.0, w: 160.0, h: 80.0 }
      properties:
        code: |
          // A wavetable computed in Kotlin, copied into ftable 1, played by poscil, and read back.
          val cs = afield.csound.CsoundInstance("""
          giWave  ftgen  1, 0, 4096, 10, 1
          instr Play
            asig  poscil  0.3, 220, giWave
                  outs    asig, asig
          endin
          """, "i \"Play\" 0 0.1")
          val partials = listOf(1.0, 0.0, 0.33, 0.0, 0.2, 0.0, 0.14)     // odd harmonics: a square-ish wave
          val wave = DoubleArray(cs.tableLength(1)) { i ->
              val ph = 2 * PI * i / 4096
              partials.withIndex().sumOf { (k, a) -> a * sin((k + 1) * ph) }
          }
          cs.writeTable(1, wave)
          val back = cs.table(1)!!
          val (left, _) = cs.renderOffline()
          cs.close()
          println("wrote ${wave.size} values; read back equal: ${wave.contentEquals(back)}; rendered ${left.size} frames, peak ${"%.3f".format(left.maxOf { abs(it) })}")
          showSignals("ftable 1, read back" to (0 until 4096 step 8).map { back[it] }, channel = "table", title = "ftable 1, written from Kotlin")
          showSignals("poscil 220 Hz" to (0 until 480).map { left[it] }, channel = "played", title = "what poscil plays from it")
  - connect: { parent: cs_root, child: cs_pluck }
  - connect: { parent: cs_root, child: cs_fx }
  - connect: { parent: cs_root, child: cs_typo }
  - execute: { box: cs_root, property: code }
  - await: {}
