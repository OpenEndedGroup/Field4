name: lua_demo
description: |
  **Lua inside Field, over LuaJIT.** A Kotlin root whose children are Lua, eleven Lua boxes, and one
  Kotlin box that reads the Lua boxes' line notes. Needs LuaJIT: `brew install luajit` (the root
  says whether it was found). Run each box on its own; the two marked *launch* want Launch, not Run.

    - **status** (the root, Kotlin) — where LuaJIT was found, or how to install it.
    - **hello** — five lines. Run it, then rest the cursor on a line: its note says what the line came to.
    - **this box** — `box.<property>` reads and writes the box's own properties; `box.parents`,
      `box.children` and `field.named` reach the others. Run it twice: the counter persists.
    - **drawing** — `line()` and `lines(...)`: FLines from Lua, drawn in the box's `lines` panel.
    - **wave** (launch) — `update(dt)` runs every frame until you stop the box.
    - **spawned** (launch) — `spawn` a function that `wait`s between steps.
    - **an error** — the error is marked red on line 3, after what the box printed.
    - **runaway** — `while true do end` stopped after one second, on its own line.
    - **jit** — the same loop interpreted and compiled, timed. The JIT starts off in a Lua box so the
      runaway guard works; `jit.on()` opts in for code you trust to finish.
    - **accumulates** — one Lua state per box, kept across runs: run the first line, then the second.
    - **controls** — `slider(...)` from Lua; moving it calls back into the box's Lua.
    - **sequencer** — Lua picks eight notes from a scale; `field.render` shows and measures them
      offline, and `play` loops them through Field's pattern voice until the box stops.
    - **line notes** (Kotlin) — prints the notes Field keeps for **hello**; run **hello** first.
operations:
  - create:
      box: lua_root
      name: "status — children of this box are Lua"
      frame: { x: 40.0, y: 40.0, w: 460.0, h: 80.0 }
      properties:
        mainLanguage: lua
        isLuaRoot: true
        code: |
          // This root stays Kotlin; its `mainLanguage` makes the boxes under it Lua.
          println(afield.lua.LuaLibrary.describe())
  - create:
      box: lua_hello
      name: "hello"
      frame: { x: 40.0, y: 180.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Lua
        code: |
          -- Run the box, or select one line and run just that.
          local greeting = "hello from " .. field.version
          print(greeting)
          x = 6 * 7
          print("x is", x)
  - create:
      box: lua_thisbox
      name: "this box"
      frame: { x: 230.0, y: 180.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Lua
        code: |
          -- box is this box; its properties read and write by name. Run it twice.
          box.counter = (box.counter or 0) + 1
          print("run", box.counter, "of", tostring(box))
          for _, parent in ipairs(box.parents) do print("a parent:", parent.name, "with", #parent.children, "children") end
          print("the drawing box is at x =", field.named("drawing").frame.x)
  - create:
      box: lua_drawing
      name: "drawing"
      frame: { x: 40.0, y: 460.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Lua
        code: |
          -- FLines from Lua: line() builds one, lines(...) draws them in the box's output.
          local shapes = {}
          for k = 0, 23 do
            local a = k * math.pi / 12
            local r = (k % 2 == 0) and 130 or 80
            shapes[#shapes + 1] = line()
              :moveTo(200, 150)
              :lineTo(200 + r * math.cos(a), 150 + r * math.sin(a))
              :color(k / 23, 0.45, 1 - k / 23)
              :width(3)
          end
          shapes[#shapes + 1] = line():circle(200, 150, 42):color(1, 0.8, 0.2, 0.9):fill()
          shapes[#shapes + 1] = line():rect(20, 20, 360, 260):color(0.6, 0.6, 0.6):width(1)
          lines(shapes, {w = 400, h = 300})
  - create:
      box: lua_wave
      name: "wave"
      frame: { x: 560.0, y: 460.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Lua
        code: |
          -- Launch this box: update(dt) runs every frame until you stop it.
          local t = 0
          function update(dt)
            t = t + dt
            local l = line()
            for i = 0, 100 do
              local x, y = i * 4, 100 + 60 * math.sin(i / 8 + t * 3)
              if i == 0 then l:moveTo(x, y) else l:lineTo(x, y) end
            end
            lines(l:color(0.3, 0.8, 1):width(2), {w = 400, h = 200})
          end
  - create:
      box: lua_spawned
      name: "spawned"
      frame: { x: 40.0, y: 320.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Lua
        code: |
          -- Launch this box: spawn runs a function as a coroutine, wait(s) pauses it.
          spawn(function()
            for i = 1, 4 do
              print("tick", i, "frame", field.frame())
              wait(0.5)
            end
            print("done")
          end)
  - create:
      box: lua_error
      name: "an error"
      frame: { x: 800.0, y: 180.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Lua
        code: |
          local t = {}
          print("before the error")
          print(t.missing.field)
          print("never printed")
  - create:
      box: lua_runaway
      name: "runaway"
      frame: { x: 230.0, y: 320.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Lua
        code: |
          -- A loop that never ends is stopped after field.budget seconds (5 unless you say).
          field.budget = 1
          local n = 0
          while true do n = n + 1 end
  - create:
      box: lua_jit
      name: "jit"
      frame: { x: 420.0, y: 180.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Lua
        code: |
          -- The JIT starts off so the runaway guard works. Turn it on for code you trust to finish.
          local function work(n) local s = 0 for i = 1, n do s = s + i % 7 end return s end
          local t0 = os.clock(); work(3e7); local interpreted = os.clock() - t0
          jit.on()
          t0 = os.clock(); work(3e7); local compiled = os.clock() - t0
          jit.off()
          print(string.format("interpreted %.3f s, compiled %.3f s: %.0fx", interpreted, compiled, interpreted / compiled))
  - create:
      box: lua_accumulate
      name: "accumulates"
      frame: { x: 610.0, y: 180.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Lua
        code: |
          -- One Lua state per box, kept across runs. Select line 2 and run it, then line 3.
          function greet(who) return "hello, " .. who end
          greet("Field")
  - create:
      box: lua_controls
      name: "controls"
      frame: { x: 990.0, y: 180.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Lua
        code: |
          -- A slider made from Lua: move it and the circle follows. slider() returns its first value.
          local function draw(r)
            local frame = line():rect(0, 0, 300, 200):color(0.5, 0.5, 0.5):width(1)
            lines(frame, line():circle(150, 100, r):color(1, 0.5, 0.2):fill(), {w = 300, h = 200})
          end
          draw(slider("radius", 5, 90, 40, draw))
  - create:
      box: lua_sequencer
      name: "sequencer"
      frame: { x: 40.0, y: 900.0, w: 160.0, h: 80.0 }
      properties:
        code_language: Lua
        code: |
          -- Lua makes the notes, Field's pattern voice plays them (the norns shape). Run it to hear the
          -- sequence loop; run it again for new notes, stop the box for silence.
          local scale = {0, 2, 3, 5, 7, 8, 10}
          local notes = {}
          for i = 1, 8 do notes[i] = 57 + scale[math.random(#scale)] + (i % 4 == 0 and 12 or 0) end
          print("notes", table.concat(notes, " "))
          local heard = field.render(notes, {cps = 0.5, wave = "triangle", decay = 0.3})
          print(string.format("%.0f s, peak %.2f, rms %.3f", heard.seconds, heard.peak, heard.rms))
          play(notes, {cps = 0.5, wave = "triangle", decay = 0.3})
  - create:
      box: lua_notes
      name: "line notes"
      frame: { x: 420.0, y: 320.0, w: 160.0, h: 80.0 }
      properties:
        code: |
          // Kotlin: what Field recorded for each line of "hello" when it last ran. Run "hello" first.
          val hello = root.children.first { it.name == "hello" }
          val code = hello.getPropertyRaw("code") as String
          code.lines().forEachIndexed { i, _ ->
              afield.stdlib.LineNotes.note(hello, "code", code, i + 1)?.let { println("line ${i + 1}: ${it.caption}") }
          }
  - connect: { parent: lua_root, child: lua_hello }
  - connect: { parent: lua_root, child: lua_thisbox }
  - connect: { parent: lua_root, child: lua_drawing }
  - connect: { parent: lua_root, child: lua_wave }
  - connect: { parent: lua_root, child: lua_spawned }
  - connect: { parent: lua_root, child: lua_error }
  - connect: { parent: lua_root, child: lua_runaway }
  - connect: { parent: lua_root, child: lua_jit }
  - connect: { parent: lua_root, child: lua_accumulate }
  - connect: { parent: lua_root, child: lua_controls }
  - connect: { parent: lua_root, child: lua_sequencer }
  - execute: { box: lua_root, property: code }
  - await: {}
