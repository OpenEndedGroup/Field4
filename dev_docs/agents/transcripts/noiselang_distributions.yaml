name: noiselang_distributions
description: >
  Every value a probability distribution: afield.math.distribution, a Kotlin take on NoiseLang
  (manualmeida.dev/articles/noiselang). A name is one node of a lazy graph, so x - x is exactly 0;
  iid() and draws(n, d) make independent copies; P / E / Var / quantile sample the graph and answer
  with a standard error; given / observed condition them on evidence; d.pat() and d.param() play
  them; gp.dists() turns a Gaussian process into them. Nine pure-compute boxes, no renderer:
    1. noise_spike_to_triangle — LAUNCH it. A Dirac spike at 5, one die, and 5 + d6 + d6, each drawn
                    by the inline ᛟ.distribution visualizer: the bars fill in under the exact pmf
                    (orange ticks) while the running mean of S settles on 12 inside its ±2 SE band.
    2. noise_queries — run it. The card's queries as one-shot estimates: E(S), P(X + Y < 10), the
                    23-person birthday problem (≈ 0.507), 4·P(inside the unit circle) ≈ π, a
                    variance and a quantile — each printed beside its exact value and its z-score.
    3. noise_density — LAUNCH it. Samples of N(0,1) + N(2, 0.5) settling under the exact density of
                    the sum (a normal with sd √1.25), and a squared normal under a kernel estimate,
                    dashed, because that one has no closed form here.
    4. noise_walks — run it. A distribution of FLines: a random walk whose heading drifts by an
                    independent normal at each of 40 steps is ONE Dist graph; 120 joint samples of
                    it are drawn as 120 paths, and the endpoint distance — another node of the same
                    graph — is estimated with its SE and drawn as a distribution.
    5. noise_posterior — LAUNCH it. Conditioning: the mean of a measurement given three readings, and
                    a coin's bias given seven heads in ten, each drawn as a posterior with its prior
                    as a dashed outline and the effective sample size in the footer.
    6. noise_weighted_scale — run it. A weighted pentatonic as a pattern, d.pat().segment(8): a
                    piano roll of four cycles and an offline-rendered player.
    7. noise_five_in_sixteen — run it. Sixteen coin flips conditioned on exactly five heads, played
                    as hats over a kick: any five steps, a new five each cycle (steps.given + steps.pat).
    8. noise_live_pitch — LAUNCH it, sound on. d.param(trigger = clock): a sine's pitch drawn at each
                    pulse of an 8 Hz clock on the audio thread, and the pitches heard drawn live
                    under the scale's exact pmf. Not launched by the replay (it needs a device).
    9. noise_gp_curves — run it. A Gaussian process fitted to five readings as correlated
                    distributions (gp.dists): forty whole curves as FLines, P(the curve tops 1.2),
                    and the two-humped distribution of where its peak is (argmax).
  Replay into a fresh Field (field_run_transcript), then edit a distribution and re-run: the
  visualizer starts again whenever the expression changes. GPU parity is the jvm-main smoke
  four.noiselang.gpu-parity (needs a renderer, so it is not a box here).
docs:
  - page: distributions.md
    why: "The page for afield.math.distribution: the DSL, its queries, the visualizer and the GPU lowering."
operations:
  - create:
      box: noise_spike_to_triangle
      name: 1 · spike, die, two dice — launch me
      frame: { x: 40.0, y: 40.0, w: 420.0, h: 100.0 }
      properties:
        code: |
          import afield.math.distribution.*

          val a = Dist.dirac(5)
          val d1 = die(6)
          val d2 = die(6)
          val s = a + d1 + d2

          loop {
              __m("spike").distribution(a, batch = 500, title = "A = 5, a Dirac spike")
              __m("die").distribution(d1, batch = 500, title = "D1, a fair die")
              __m("sum").distribution(s, batch = 500, title = "S = A + D1 + D2", exact = 12.0)
              frame()
          }
  - create:
      box: noise_queries
      name: 2 · P, E, Var and quantiles, with standard errors
      frame: { x: 40.0, y: 180.0, w: 420.0, h: 100.0 }
      properties:
        code: |
          import afield.math.distribution.*

          fun show(label: String, e: Estimate, exact: Double) =
              println("%-24s %-28s exact %.5f   z = %+.2f".format(label, e, exact, e.zFrom(exact)))

          val x = die(6)
          val y = die(6)
          show("E(5 + X + Y)", E(5 + x + y), 12.0)
          show("P(X + Y < 10)", P(x + y lt 10), 30.0 / 36)
          show("E(X - X)", E(x - x), 0.0)
          show("Var(X - X')", Var(x - x.iid()), 35.0 / 6)

          val birthday = draws(23, uniformInt(1, 365))
          val noShared = (0 until 23).fold(1.0) { p, k -> p * (365.0 - k) / 365.0 }
          show("P(shared birthday)", P(hasDuplicates(birthday)), 1 - noShared)

          val u = uniform(-1, 1)
          val v = uniform(-1, 1)
          show("4 P(u² + v² < 1)", P(u * u + v * v lt 1) * 4, Math.PI)
          show("median of exp(1)", quantile(exponential(1), 0.5), kotlin.math.ln(2.0))
  - create:
      box: noise_density
      name: 3 · samples settling under a density — launch me
      frame: { x: 500.0, y: 40.0, w: 420.0, h: 100.0 }
      properties:
        code: |
          import afield.math.distribution.*

          val sum = normal(0, 1) + normal(2, 0.5)
          val squared = normal(0, 1).squared()

          loop {
              __m("sum").distribution(sum, batch = 400, title = "N(0,1) + N(2,0.5)", exact = 2.0)
              __m("sq").distribution(squared, batch = 400, title = "Z², no closed form here", exact = 1.0)
              frame()
          }
  - create:
      box: noise_walks
      name: 4 · a distribution of FLines
      frame: { x: 500.0, y: 180.0, w: 420.0, h: 100.0 }
      properties:
        code: |
          import afield.math.distribution.*

          // One graph: heading drifts by an independent normal each step; x and y accumulate.
          val steps = 40
          var heading: Dist = Dist.dirac(0)
          var x: Dist = Dist.dirac(0)
          var y: Dist = Dist.dirac(0)
          val xs = ArrayList<Dist>()
          val ys = ArrayList<Dist>()
          for (k in 0 until steps) {
              heading = heading + normal(0, 0.25)
              x = x + heading.cos() * 4
              y = y + heading.sin() * 4
              xs += x
              ys += y
          }
          val reach = (x * x + y * y).sqrt()

          // 120 joint draws of every node: each sample is one whole path.
          val walks = 120
          val drawn = jointSamples(*(xs + ys).toTypedArray(), n = walks, seed = 7)
          val paths =
              (0 until walks).map { w ->
                  fline {
                      moveTo(200, 150)
                      for (k in 0 until steps) lineTo(200 + drawn[k][w], 150 - drawn[steps + k][w])
                      color = vec(0.0, 0.67, 1.0, 0.35)
                  }
              }
          lines(paths, channel = "walks", w = 400.0, h = 300.0)

          println("E(reach) = ${E(reach, n = 50_000)}   (a straight line would be ${steps * 4})")
          __m("reach").distribution(reach, batch = 20_000, title = "distance from the start after $steps steps")
  - create:
      box: noise_posterior
      name: 5 · a posterior, given readings and coin flips — launch me
      frame: { x: 40.0, y: 320.0, w: 420.0, h: 100.0 }
      properties:
        code: |
          import afield.math.distribution.*

          val mu = normal(0, 10)
          val reading = mu given observed(normal(mu, 1), 2.9, 3.3, 3.1)

          val p = uniform(0, 1)
          val coin = p given observed(bernoulli(p), 1, 1, 0, 1, 1, 1, 0, 1, 1, 0)

          loop {
              __m("reading").distribution(reading, batch = 2000, title = "mu given three readings", exact = 9.3 / 3.01)
              __m("coin").distribution(coin, batch = 2000, title = "bias given 7 heads in 10", exact = 8.0 / 12)
              frame()
          }
  - create:
      box: noise_weighted_scale
      name: 6 · a weighted scale as a pattern, heard
      frame: { x: 500.0, y: 320.0, w: 420.0, h: 100.0 }
      properties:
        code: |
          import afield.math.distribution.*

          val scale = categorical(listOf(0, 3, 5, 7, 10, 12), listOf(4, 1, 2, 3, 1, 2))
          val tune = (60 + scale).pat().segment(8).texts()

          showPatRollOf("60 + scale" to tune, title = "eight draws a cycle from a weighted pentatonic", cycles = 4, pitched = true)
          showPatAudio(tune, cycles = 4, cps = 0.5, voice = patVoice(wave = PatWave.TRIANGLE, decay = 0.05, sustain = 0.7), channel = "audio")
  - create:
      box: noise_five_in_sixteen
      name: 7 · a rhythm conditioned to five hits in sixteen
      frame: { x: 40.0, y: 460.0, w: 420.0, h: 100.0 }
      properties:
        code: |
          import afield.math.distribution.*

          val steps = List(16) { bernoulli(0.4) }
          val rhythm = steps.given(steps.sum() eq 5)
          val hats = struct(rhythm.pat().map { it != 0.0 }, pat("hh"))
          val beat = stack(hats, pat("bd"))

          showPatRollOf("kick" to pat("bd"), "hats" to hats, title = "five hits in sixteen, a new five each cycle", cycles = 4)
          showPatAudio(beat, cycles = 4, cps = 0.5, voice = patVoice(wave = PatWave.TRIANGLE, decay = 0.03, sustain = 0.3), channel = "audio")
  - create:
      box: noise_live_pitch
      name: 8 · a sine whose pitch is a distribution — launch me, sound on
      frame: { x: 500.0, y: 460.0, w: 420.0, h: 100.0 }
      properties:
        code: |
          import afield.math.distribution.*

          // LAUNCH me (sound on). The weighted pentatonic from box 6, as frequencies, picks the pitch of a sine
          // at every rising edge of an 8 Hz pulse; the same pulse gates the envelope. The view under `heard`
          // is the pitches you are hearing, settling onto the scale's exact probabilities. Change the weights
          // or the clock and re-launch.
          val scale = categorical(listOf(0, 3, 5, 7, 10, 12), listOf(4, 1, 2, 3, 1, 2))
          val hz = 220 * (scale * (kotlin.math.ln(2.0) / 12)).exp()

          val clock = PulseOsc(freq = Param(8f), width = Param(0.35f))
          val pitch = hz.param(trigger = clock)
          val env = ADSR(gate = clock, attack = Param(0.004f), decay = Param(0.06f), sustain = Param(0.35f), release = Param(0.08f))
          val voice = SineOsc(freq = pitch) * env * 0.5f

          audio(voice) + loop {
              __m("heard").distribution(pitch, title = "heard")
              frame()
          }
  - create:
      box: noise_gp_curves
      name: 9 · a Gaussian process as distributions — where is its peak?
      frame: { x: 40.0, y: 600.0, w: 420.0, h: 100.0 }
      properties:
        code: |
          import afield.math.distribution.*
          import afield.math.gp.*

          val xs = doubleArrayOf(0.5, 2.0, 3.5, 6.0, 7.5)
          val ys = doubleArrayOf(0.2, 1.1, 0.4, 0.9, -0.3)
          val gp = gp1D(xs, ys, GpKernels.rbf(lengthScale = 1.0), noiseStd = 0.1)

          val grid = DoubleArray(41) { it * 0.2 }
          val f = gp.dists(grid)

          fun px(x: Double) = 20 + x * 45
          fun py(y: Double) = 150 - y * 70
          val curves = jointSamples(*f.toTypedArray(), n = 40, seed = 3)
          val drawn = (0 until 40).map { c ->
              fline {
                  moveTo(px(grid[0]), py(curves[0][c]))
                  for (i in 1 until grid.size) lineTo(px(grid[i]), py(curves[i][c]))
                  color = vec(0.0, 0.67, 1.0, 0.3)
              }
          }
          val readings = xs.indices.map { i ->
              fline { circle(px(xs[i]), py(ys[i]), 4.0) }.apply { filled = true; color = vec(1.0, 0.67, 0.0, 1.0) }
          }
          lines(drawn + readings, channel = "curves", w = 400.0, h = 260.0)

          val peakAt = argmax(f) * 0.2
          println("P(tops 1.2 somewhere) = ${P(maximum(f) gt 1.2)}")
          println("E(where the peak is)  = ${E(peakAt)}")
          display("peak", distributionSvg(Progressive(peakAt).draw(20_000), title = "x of the curve's highest point"))
  - launch:
      box: noise_spike_to_triangle
      property: code
  - execute:
      box: noise_queries
      property: code
  - launch:
      box: noise_density
      property: code
  - execute:
      box: noise_walks
      property: code
  - launch:
      box: noise_posterior
      property: code
  - execute:
      box: noise_weighted_scale
      property: code
  - execute:
      box: noise_five_in_sixteen
      property: code
  - execute:
      box: noise_gp_curves
      property: code
