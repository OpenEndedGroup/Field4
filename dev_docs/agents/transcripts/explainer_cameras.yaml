          fun draw() {
              val parts =
                  stops.indices.map { k ->
                      val r = 38.0 / sqrt(2.0).pow(k)
                      fline {
                          for (s in 0..48) {
                              val t = 2 * PI * s / 48
                              if (s == 0) moveTo(40 + 80 * k + r, 60 + 0.0) else lineTo(40 + 80 * k + r * cos(t), 60 + r * sin(t))
                          }
                          filled = true
                          color = if (k == chosen) orange else cyan
                      }
                  }
              showPlane(
                  parts,
                  channel = "openings",
                  width = 600,
                  height = 112,
                  padding = 0.0,
                  window = Rect(0.0, 0.0, 640.0, 120.0),
