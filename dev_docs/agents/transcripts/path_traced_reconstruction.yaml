name: path_traced_reconstruction
description: Compare raw multi-bounce path tracing, progressive accumulation and Ray Reconstruction.
operations:
- create:
    box: agent_graphics_context
    name: renderer
    frame:
      x: 40.0
      y: 40.0
      w: 300.0
      h: 100.0
    properties:
      code: "import afield.four.util.Options\n\nprop<Window>(window)\nprop<Renderer>(renderer)\n\nOptions.enableRayTracing\
        \ = true\nOptions.enableVR = false\nOptions.enableHDR = false\nOptions.profiling = false\n\nonce.renderer\
        \ {\n    window = Window(\"Field\")\n    Renderer(window)\n}\n\nprintln(\"agent graphics renderer ready\"\
        )\nstart(renderer::run)\n"
- launch:
    box: agent_graphics_context
    property: code
    type: code
    strand: renderer
    code: "import afield.four.util.Options\n\nprop<Window>(window)\nprop<Renderer>(renderer)\n\nOptions.enableRayTracing\
      \ = true\nOptions.enableVR = false\nOptions.enableHDR = false\nOptions.profiling = false\n\nonce.renderer\
      \ {\n    window = Window(\"Field\")\n    Renderer(window)\n}\n\nprintln(\"agent graphics renderer ready\"\
      )\nstart(renderer::run)\n"
- wait:
    frames: 3
- create:
    box: path_traced_reconstruction
    name: path traced reconstruction
    frame:
      x: 400.0
      y: 160.0
      w: 420.0
      h: 100.0
    properties:
      code: "import afield.controlGroup\nimport afield.displayOpen\nimport afield.four.fabricated.*\nimport afield.four.reconstruction.*\n\
        import afield.four.modules.fromContextWithNameOrNull\nimport afield.stdlib.linalg.Vector3f\n\nprop<PathTracedReconstruction>(lab)\n\
        fromContextWithNameOrNull<PathTracedReconstruction>(\"lab\")?.close()\nNgxSupport.rayReconstructionAvailability(renderer.device).getOrThrow()\n\
        val scene=PathTraceScene().apply {\n    val floor=material(PathTraceMaterial.diffuse(.45f,.5f,.55f))\n \
        \   val red=material(PathTraceMaterial.plastic(.65f,.055f,.025f,.22f))\n    val gold=material(PathTraceMaterial.metal(.95f,.7f,.3f,.12f))\n\
        \    val blue=material(PathTraceMaterial.metal(.3f,.5f,.8f,.5f))\n    val light=material(PathTraceMaterial.emissive(12f,8f,5f))\n\
        \    quad(Vector3f(-15f,0f,-15f),Vector3f(-15f,0f,15f),Vector3f(15f,0f,15f),Vector3f(15f,0f,-15f),floor)\n\
        \    sphere(Vector3f(-1.7f,.8f,0f),.8f,red,48,24)\n    sphere(Vector3f(0f,.8f,0f),.8f,gold,48,24)\n    sphere(Vector3f(1.7f,.8f,0f),.8f,blue,48,24)\n\
        \    quad(Vector3f(-2f,4f,-1f),Vector3f(0f,4f,-1f),Vector3f(0f,4f,1f),Vector3f(-2f,4f,1f),light)\n}\nval\
        \ camera=Camera(renderer).also {\n    it.at.set(3.5f,2.4f,7.5f);it.target.set(0f,.65f,0f);it.p.fov=.62\n\
        }\n// Keep the tracer uninstalled: lab records trace -> raw guides -> NGX in one ordered pass.\nval tracer=PathTracingRenderer(renderer,scene,PathTraceEnvironment.constant(.08f,.1f,.15f),1920,1080,camera)\n\
        lab=PathTracedReconstruction(tracer).install()\nvar view=2\nvar move=false\nvar cut=false\nvar samples=1\n\
        controlGroup(\"path-traced reconstruction\") {\n    slider(\"0: Raw · 1: Progressive · 2: RR\",min=0.0,max=2.0,step=1.0,initialValue=2.0)\
        \ { view=it.toInt() }\n    slider(\"Samples per frame\",min=1.0,max=8.0,step=1.0,initialValue=1.0) { samples=it.toInt()\
        \ }\n    checkbox(\"Move camera\",initialValue=false) { move=it }\n    button(\"Cut camera and reset\")\
        \ { if(it)cut=true }\n}\ndisplayOpen(\"path-traced reconstruction\")\nprintln(\"1920 × 1080. RR receives\
        \ each frame's raw multi-bounce lighting and measured surface guides. Opaque surfaces; pinhole camera.\"\
        )\nframes {\n    var phase=0.0\n    while(true) {\n        lab.view=PathTracedReconstruction.View.entries[view];tracer.samplesPerFrame=samples\n\
        \        if(move) { phase+=.015;camera.at.x=(3.5+kotlin.math.sin(phase)*1.2).toFloat() }\n        if(cut)\
        \ { camera.at.z=if(camera.at.z>7)6f else 7.5f;lab.reset(\"camera cut\");cut=false }\n        frame()\n \
        \   }\n}.end { lab.close() }\n"
- connect:
    parent: agent_graphics_context
    child: path_traced_reconstruction
- launch:
    box: path_traced_reconstruction
    property: code
    type: code
    strand: scene
    code: "import afield.controlGroup\nimport afield.displayOpen\nimport afield.four.fabricated.*\nimport afield.four.reconstruction.*\n\
      import afield.four.modules.fromContextWithNameOrNull\nimport afield.stdlib.linalg.Vector3f\n\nprop<PathTracedReconstruction>(lab)\n\
      fromContextWithNameOrNull<PathTracedReconstruction>(\"lab\")?.close()\nNgxSupport.rayReconstructionAvailability(renderer.device).getOrThrow()\n\
      val scene=PathTraceScene().apply {\n    val floor=material(PathTraceMaterial.diffuse(.45f,.5f,.55f))\n   \
      \ val red=material(PathTraceMaterial.plastic(.65f,.055f,.025f,.22f))\n    val gold=material(PathTraceMaterial.metal(.95f,.7f,.3f,.12f))\n\
      \    val blue=material(PathTraceMaterial.metal(.3f,.5f,.8f,.5f))\n    val light=material(PathTraceMaterial.emissive(12f,8f,5f))\n\
      \    quad(Vector3f(-15f,0f,-15f),Vector3f(-15f,0f,15f),Vector3f(15f,0f,15f),Vector3f(15f,0f,-15f),floor)\n\
      \    sphere(Vector3f(-1.7f,.8f,0f),.8f,red,48,24)\n    sphere(Vector3f(0f,.8f,0f),.8f,gold,48,24)\n    sphere(Vector3f(1.7f,.8f,0f),.8f,blue,48,24)\n\
      \    quad(Vector3f(-2f,4f,-1f),Vector3f(0f,4f,-1f),Vector3f(0f,4f,1f),Vector3f(-2f,4f,1f),light)\n}\nval camera=Camera(renderer).also\
      \ {\n    it.at.set(3.5f,2.4f,7.5f);it.target.set(0f,.65f,0f);it.p.fov=.62\n}\n// Keep the tracer uninstalled:\
      \ lab records trace -> raw guides -> NGX in one ordered pass.\nval tracer=PathTracingRenderer(renderer,scene,PathTraceEnvironment.constant(.08f,.1f,.15f),1920,1080,camera)\n\
      lab=PathTracedReconstruction(tracer).install()\nvar view=2\nvar move=false\nvar cut=false\nvar samples=1\n\
      controlGroup(\"path-traced reconstruction\") {\n    slider(\"0: Raw · 1: Progressive · 2: RR\",min=0.0,max=2.0,step=1.0,initialValue=2.0)\
      \ { view=it.toInt() }\n    slider(\"Samples per frame\",min=1.0,max=8.0,step=1.0,initialValue=1.0) { samples=it.toInt()\
      \ }\n    checkbox(\"Move camera\",initialValue=false) { move=it }\n    button(\"Cut camera and reset\") {\
      \ if(it)cut=true }\n}\ndisplayOpen(\"path-traced reconstruction\")\nprintln(\"1920 × 1080. RR receives each\
      \ frame's raw multi-bounce lighting and measured surface guides. Opaque surfaces; pinhole camera.\")\nframes\
      \ {\n    var phase=0.0\n    while(true) {\n        lab.view=PathTracedReconstruction.View.entries[view];tracer.samplesPerFrame=samples\n\
      \        if(move) { phase+=.015;camera.at.x=(3.5+kotlin.math.sin(phase)*1.2).toFloat() }\n        if(cut)\
      \ { camera.at.z=if(camera.at.z>7)6f else 7.5f;lab.reset(\"camera cut\");cut=false }\n        frame()\n   \
      \ }\n}.end { lab.close() }\n"
- wait:
    frames: 12
