name: fn_differentiable_fit_demo
description: >
  Self-contained demo of the differentiable fitter (afield.stdlib.fitBest / fitGradient) — the
  gradient-descent counterpart to the genetic evolve(). The target is a *product* of two
  oscillators, cos(2)*sin(1.5, ...), and the seed has deliberately-wrong frequencies
  (cos(3.4)*sin(1.0, ...)). A single fitGradient stalls in a frequency local-minimum (RMSE ~0.19),
  so the demo uses fitBest, which runs jittered restarts and lands in the global basin
  (RMSE ~0.72 -> ~0.006). On execute the box plots the target (channel "1 target") and the fitted
  curve (channel "2 fitted"), and returns the FnFitRun — Field renders it as a compact RMSE
  before->after summary with a loss-trajectory sparkline. Open/replay this into a fresh Field4 and
  look at the box: the fitted plot should sit right on top of the target.
operations:
  - create:
      box: fn_fit_demo
      name: differentiable Fn fit
      frame: { x: 80.0, y: 60.0, w: 520.0, h: 520.0 }
      properties:
        code: |
          import afield.stdlib.Functions
          import afield.stdlib.fitBest

          with(Functions) {
              val target = cos(2) * sin(1.5, amplitude = 0.8, offset = 0.2)
              val seed   = cos(3.4) * sin(1.0, amplitude = 2.0)

              // fitBest = jittered restarts; escapes the frequency local-minimum a single
              // fitGradient would stall in. domain defaults to 0..1; no Functions.Domain(...) needed.
              val run = fitBest(target, seed, restarts = 16)

              plot(target,     channel = "1 target", title = "target  cos·sin")
              plot(run.fitted, channel = "2 fitted", title = "gradient-fitted (best of 16 restarts)")

              run   // Field renders the FnFitRun: RMSE before -> after + a loss sparkline
          }
  - execute:
      box: fn_fit_demo
      property: code
      type: fragment
      code: |
          import afield.stdlib.Functions
          import afield.stdlib.fitBest

          with(Functions) {
              val target = cos(2) * sin(1.5, amplitude = 0.8, offset = 0.2)
              val seed   = cos(3.4) * sin(1.0, amplitude = 2.0)

              val run = fitBest(target, seed, restarts = 16)

              plot(target,     channel = "1 target", title = "target  cos·sin")
              plot(run.fitted, channel = "2 fitted", title = "gradient-fitted (best of 16 restarts)")

              run
          }

  - await:
      wait: pending
  - wait:
      millis: 400
