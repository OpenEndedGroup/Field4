name: fn_differentiable_fit_demo
description: >
  Self-contained demo of fitGradient — the differentiable counterpart to the genetic
  evolve(). One box builds a target sine (a*sin(freq*x)+b), a deliberately-wrong seed of the
  same shape, then runs Adam descent over the seed's numeric leaves to match the target. On
  execute the box plots the target (channel "1 target") and the gradient-fitted curve
  (channel "2 fitted"), and its text output reports RMSE before vs after — which should
  collapse from ~1.0 to ~0.01. Open/replay this into a fresh Field4 and look at the box:
  the fitted plot should sit right on top of the target's shape.
operations:
  - create:
      box: fn_fit_demo
      name: differentiable Fn fit
      frame: { x: 80.0, y: 60.0, w: 520.0, h: 520.0 }
      properties:
        code: |
          import afield.stdlib.Functions
          import afield.stdlib.fitGradient

          with(Functions) {
              val d = Domain(0.0, 1.0)
              val target = sin(1.5, amplitude = 0.8, offset = 0.2).withName("target")
              val seed = sin(1.0, amplitude = 1.0, offset = 0.0).withName("seed")

              val run = fitGradient(target, seed, domain = d, iterations = 300, lr = 0.05)

              plot(target, channel = "1 target", sampleDomain = d, title = "target  a·sin(freq·x)+b")
              plot(
                  run.fitted.withName("fitted"),
                  channel = "2 fitted",
                  sampleDomain = d,
                  title = "gradient-fitted (Adam)"
              )

              "differentiable fit: RMSE %.4f -> %.4f over %d Adam steps (%d evals)"
                  .format(run.initialRmse, run.finalRmse, run.iterations, run.evaluations)
          }
  - execute:
      box: fn_fit_demo
      property: code
      type: fragment
      code: |
          import afield.stdlib.Functions
          import afield.stdlib.fitGradient

          with(Functions) {
              val d = Domain(0.0, 1.0)
              val target = sin(1.5, amplitude = 0.8, offset = 0.2).withName("target")
              val seed = sin(1.0, amplitude = 1.0, offset = 0.0).withName("seed")

              val run = fitGradient(target, seed, domain = d, iterations = 300, lr = 0.05)

              plot(target, channel = "1 target", sampleDomain = d, title = "target  a·sin(freq·x)+b")
              plot(
                  run.fitted.withName("fitted"),
                  channel = "2 fitted",
                  sampleDomain = d,
                  title = "gradient-fitted (Adam)"
              )

              "differentiable fit: RMSE %.4f -> %.4f over %d Adam steps (%d evals)"
                  .format(run.initialRmse, run.finalRmse, run.iterations, run.evaluations)
          }

  - await:
      wait: pending
  - wait:
      millis: 400
