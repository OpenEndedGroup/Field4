name: eagle_flow_explorer
description: >
  The flow topology of a 1930s film of a golden eagle landing on a falconer's fist, from tracked
  particles. The first box scrubs the 306 frames and switches what counts as standing still: the
  raw flow, whose topology is the film weaving in the gate and sweeps across the sky, or the flow
  with the camera's motion fitted and removed, which leaves only the eagle. The second renders the
  whole clip in the raw look to a movie. Plain Kotlin; the movie needs FFmpeg.
operations:
  - create:
      box: eagle_flow_live
      name: 1 - Two frames of reference
      frame: { x: 60.0, y: 60.0, w: 420.0, h: 120.0 }
      properties:
        code: |
          import afield.geometry.topology.vectorfield.*

          // The eagle's flow (one grid of 4-pixel cells per frame) and the film it was tracked from.
          val flow = loadParticleFlow("public/docs/assets/vector_field_topology/eagle.flow.gz")
          val film = videoFrames("public/docs/assets/vector_field_topology/eagle.mp4", width = 480).toList()
          val cameras = CameraMotion.entries
          var frame = 270; var camera = CameraMotion.KEEP; var minSpeed = 0.0

          // Streamlines, separatrices and critical points of one frame's flow, over the darkened film.
          fun show() {
              val topology = VectorFieldTopology.compute(flow.at(frame, window = 1, camera = camera), minStrength = 0.02, maxLength = 300.0)
              val lines = topology.streamlines(spacing = 1.5, length = 14.0, minSpeed = minSpeed) + topology.toFLines() + topology.criticalPointsFLine(6.0)
              val picture = film[frame]
              val dark = Img(picture.width, picture.height, 3, FloatArray(picture.width * picture.height * 3))
              showImgGrid("frame $frame, camera ${camera.name.lowercase()}" to
                  picture.overlay(dark, 0.55).drawFLines(lines.map { it * flow.cell.toDouble() }, scale = 2.0), columns = 1, cellSide = 960)
          }
          // camera: 0 keeps the camera's motion, 1 removes its median shift, 2 its fitted affine motion.
          // min speed: draw streamlines only where the flow is faster than this, in pixels per frame.
          controlGroup("eagle") {
              slider("frame", min = 0.0, max = flow.frameCount - 1.0, step = 1.0, initialValue = 270.0) { frame = it.toInt(); show() }
              slider("camera", min = 0.0, max = 2.0, step = 1.0, initialValue = 0.0) { camera = cameras[it.toInt()]; show() }
              slider("min speed", min = 0.0, max = 3.0, step = 0.1, initialValue = 0.0) { minSpeed = it; show() }
          }
          show()
  - create:
      box: eagle_flow_movie
      name: 2 - The whole clip as a movie
      frame: { x: 560.0, y: 60.0, w: 420.0, h: 120.0 }
      properties:
        code: |
          import afield.geometry.topology.vectorfield.*
          import afield.tools.docs.FFMPEG
          import java.io.File

          // Launch this one: every frame drawn in the raw look, encoded at the film's 18 frames per second.
          val flow = loadParticleFlow("public/docs/assets/vector_field_topology/eagle.flow.gz")
          val out = File("build/eagle_flow/eagle_flow_raw.mp4")

          suspend fun render() {
              val pngs = File(out.parentFile, "frames").apply { deleteRecursively(); mkdirs() }
              for ((frame, picture) in videoFrames("public/docs/assets/vector_field_topology/eagle.mp4", width = 480).withIndex()) {
                  if (frame >= flow.frameCount) break
                  val topology = VectorFieldTopology.compute(flow.at(frame, window = 1, camera = CameraMotion.KEEP), minStrength = 0.02, maxLength = 300.0)
                  val lines = topology.streamlines(spacing = 1.5, length = 14.0) + topology.toFLines() + topology.criticalPointsFLine(6.0)
                  val dark = Img(picture.width, picture.height, 3, FloatArray(picture.width * picture.height * 3))
                  picture.overlay(dark, 0.55).drawFLines(lines.map { it * flow.cell.toDouble() }, scale = 2.0).savePng(File(pngs, "%03d.png".format(frame)).path)
                  if (frame % 30 == 0) println("frame $frame of ${flow.frameCount}")
              }
              val encode = ProcessBuilder(FFMPEG, "-v", "error", "-y", "-framerate", "18", "-i", File(pngs, "%03d.png").path,
                  "-c:v", "libx264", "-preset", "slow", "-crf", "28", "-pix_fmt", "yuv420p", out.path).inheritIO().start()
              check(encode.waitFor() == 0) { "ffmpeg failed" }
              println("wrote ${out.absolutePath}")
          }
          start(::render)
  - execute: { box: eagle_flow_live }
