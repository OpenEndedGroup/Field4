name: optical_flow
description: Hardware image motion, cost inspection and feedback advection from a pair of Field images.
operations:
- create:
    box: agent_graphics_context
    name: renderer
    frame:
      x: 40.0
      y: 40.0
      w: 300.0
      h: 100.0
    properties:
      code: "import afield.four.util.Options\n\nprop<Window>(window)\nprop<Renderer>(renderer)\n\nOptions.enableVR\
        \ = false\nOptions.enableHDR = false\nOptions.profiling = false\n\nonce.renderer {\n    window = Window(\"\
        Field\")\n    Renderer(window)\n}\n\nprintln(\"agent graphics renderer ready\")\nstart(renderer::run)\n"
- launch:
    box: agent_graphics_context
    property: code
    type: code
    strand: renderer
    code: "import afield.four.util.Options\n\nprop<Window>(window)\nprop<Renderer>(renderer)\n\nOptions.enableVR\
      \ = false\nOptions.enableHDR = false\nOptions.profiling = false\n\nonce.renderer {\n    window = Window(\"\
      Field\")\n    Renderer(window)\n}\n\nprintln(\"agent graphics renderer ready\")\nstart(renderer::run)\n"
- wait:
    frames: 3
- create:
    box: optical_flow
    name: optical flow
    frame:
      x: 400.0
      y: 160.0
      w: 420.0
      h: 100.0
    properties:
      code: "import afield.controlGroup\nimport afield.displayOpen\nimport afield.four.vision.*\nimport afield.four.modules.fromContextWithNameOrNull\n\
        \nprop<OpticalFlowDemo>(lab)\nfromContextWithNameOrNull<OpticalFlowDemo>(\"lab\")?.close()\ncheck(renderer.device.supportsOpticalFlow)\
        \ { \"This device has no enabled VK_NV_optical_flow; other Field rendering is unaffected.\" }\nlab=OpticalFlowDemo(renderer)\n\
        var gain=1f\nvar damping=.98f\nvar cost=80f\nvar deform=true\nvar reset=false\ncontrolGroup(\"optical flow\"\
        ) {\n    slider(\"Advection gain\",min=0.0,max=3.0,initialValue=1.0) { gain=it.toFloat() }\n    slider(\"\
        Feedback retention\",min=0.0,max=.995,initialValue=.98) { damping=it.toFloat() }\n    slider(\"Reject cost\
        \ above\",min=0.0,max=600.0,initialValue=80.0) { cost=it.toFloat() }\n    checkbox(\"Consecutive-frame wiggle\"\
        ,initialValue=true) { deform=it;reset=true }\n    button(\"Reset feedback and motion hints\") { if(it)reset=true\
        \ }\n}\ndisplayOpen(\"optical flow\")\nprintln(\"Top: consecutive frames. Below: motion/cost and advected\
        \ feedback. Turn off wiggle for the (+12, -8) translation check.\")\nframes {\n    var time=0f\n    while(true)\
        \ {\n        lab.dx=if(deform)0f else 12f;lab.dy=if(deform)0f else -8f;lab.displayRange=if(deform)3f else\
        \ 20f;lab.gain=gain;lab.damping=damping;lab.costThreshold=cost;lab.deformation=deform\n        lab.update(time,reset);reset=false;time+=lab.pairStep\n\
        \        frame()\n    }\n}.end { lab.close() }\n"
- connect:
    parent: agent_graphics_context
    child: optical_flow
- launch:
    box: optical_flow
    property: code
    type: code
    strand: scene
    code: "import afield.controlGroup\nimport afield.displayOpen\nimport afield.four.vision.*\nimport afield.four.modules.fromContextWithNameOrNull\n\
      \nprop<OpticalFlowDemo>(lab)\nfromContextWithNameOrNull<OpticalFlowDemo>(\"lab\")?.close()\ncheck(renderer.device.supportsOpticalFlow)\
      \ { \"This device has no enabled VK_NV_optical_flow; other Field rendering is unaffected.\" }\nlab=OpticalFlowDemo(renderer)\n\
      var gain=1f\nvar damping=.98f\nvar cost=80f\nvar deform=true\nvar reset=false\ncontrolGroup(\"optical flow\"\
      ) {\n    slider(\"Advection gain\",min=0.0,max=3.0,initialValue=1.0) { gain=it.toFloat() }\n    slider(\"\
      Feedback retention\",min=0.0,max=.995,initialValue=.98) { damping=it.toFloat() }\n    slider(\"Reject cost\
      \ above\",min=0.0,max=600.0,initialValue=80.0) { cost=it.toFloat() }\n    checkbox(\"Consecutive-frame wiggle\"\
      ,initialValue=true) { deform=it;reset=true }\n    button(\"Reset feedback and motion hints\") { if(it)reset=true\
      \ }\n}\ndisplayOpen(\"optical flow\")\nprintln(\"Top: consecutive frames. Below: motion/cost and advected\
      \ feedback. Turn off wiggle for the (+12, -8) translation check.\")\nframes {\n    var time=0f\n    while(true)\
      \ {\n        lab.dx=if(deform)0f else 12f;lab.dy=if(deform)0f else -8f;lab.displayRange=if(deform)3f else\
      \ 20f;lab.gain=gain;lab.damping=damping;lab.costThreshold=cost;lab.deformation=deform\n        lab.update(time,reset);reset=false;time+=lab.pairStep\n\
      \        frame()\n    }\n}.end { lab.close() }\n"
- wait:
    frames: 12
