name: controls_surface
description: >
  A performer's control surface built from the controlGroup DSL, and the gestures the 2026-10-29
  controls renewal added. Box 1 is a surface: a log-law cutoff slider, an XY pad, a toggle, a
  name and a colour, drawing a live figure from what the box received. Click the pad, then use the
  arrow keys (shift x10), Backspace or double-click to reset, shift-drag to ease it into place.
  Click a slider, then turn the wheel. Box 2 re-renders its own slider mid-drag (its callback
  rebuilds the group once past 0.5): the drag carries on. Replay with
  `field_backdoor.py --command 'macro write controls_surface --file dev_docs/agents/demos/controls_surface/build.yaml' --command 'macro run controls_surface'`.
operations:
  - create:
      box: surface
      name: 1 - A performer's surface
      frame: { x: 60.0, y: 60.0, w: 260.0, h: 110.0 }
      properties:
        code: |
          var cutoff = 800.0
          var orbit = Vector2f(0.3f, 0.2f)
          var armed = true
          var title = "orbit"
          var tint = Vector4f(0.05f, 0.78f, 0.93f, 1f)
          fun draw() {
              val radius = 10 + 40 * kotlin.math.log10(cutoff / 20.0) / 3.0
              val x = 150 + orbit.x * 120
              val y = 150 - orbit.y * 120
              val arm = fline {
                  moveTo(150, 150)
                  lineTo(x, y)
                  color = vec(0.075, 0.38, 0.47, 1.0)
              }
              val disc = fline {
                  circle(x, y, radius)
                  filled = true
                  stroked = false
                  color = Vector4f(tint)
              }
              val figure: List<FLine> = if (armed) [arm, disc] else [arm]
              lines(
                  figure,
                  channel = "figure",
                  w = 300.0,
                  h = 300.0,
                  framing = LinesFraming.fixed(0.0, 0.0, 300.0, 300.0),
              )
              markdown("caption", "**$title** · cutoff `${cutoff.toInt()} Hz`")
          }
          controlGroup("controls") {
              slider("cutoff", min = 20.0, max = 20000.0, initialValue = 800.0, law = ControlLaw.LOGARITHMIC) {
                  cutoff = it
                  draw()
              }
              vec2Control("orbit", initialValue = Vector2f(0.3f, 0.2f), step = 0.01) {
                  orbit = it
                  draw()
              }
              checkbox("armed", initialValue = true) {
                  armed = it
                  draw()
              }
              stringInput("title", initialValue = "orbit") {
                  title = it
                  draw()
              }
              colorPicker("tint", initialValue = Vector4f(0.05f, 0.78f, 0.93f, 1f)) {
                  tint = it
                  draw()
              }
          }
          displayOpen("controls")
          draw()
          displayOpen("figure")
  - create:
      box: rerender
      name: 2 - A slider that rebuilds itself mid-drag
      frame: { x: 680.0, y: 60.0, w: 260.0, h: 110.0 }
      properties:
        code: |
          // Drag "gain" from left to right. When it passes 0.5 the callback rebuilds this group,
          // replacing the slider's DOM under the pointer; the drag continues on the new one.
          var rebuilt = 0
          fun surface() {
              controlGroup("controls") {
                  slider("gain", 0.0, 1.0, 0.01, 0.2) {
                      display(
                          "seen",
                          "<div style='font:18px Iosevka,monospace;color:#0cc8ed'>gain ${it.f2}  rebuilt $rebuilt</div>",
                      )
                      if (it > 0.5 && rebuilt == 0) {
                          rebuilt++
                          surface()
                      }
                      if (it < 0.3) rebuilt = 0
                  }
              }
          }
          surface()
          displayOpen("controls")
  - launch: { box: surface }
  - launch: { box: rerender }
  - wait:
      millis: 800
