name: three_handles
description: >
  Drag handles in three { } scenes. Two boxes: a cubic curve shaped by four free handles, and a slab
  whose height runs on a vertical rail (axis) with a post that slides only across its top (normal).
  Every drag reaches the box's callback, which draws the scene again; the same handles are draggable
  in the browser viewer and, with a pinch, in the visionOS viewer.

  This transcript is what built `dev_docs/agents/demos/three_handles/metadata.edn`; re-running it
  rebuilds that document. See the "Drag handles" section of `public/docs/three_output.md`.
operations:
  - create:
      box: curve
      name: 1 - A curve you shape
      frame: { x: 60.0, y: 60.0, w: 420.0, h: 136.0 }
      properties:
        code: |
          /*
          Drag the four yellow points. The curve, its control polygon and the length at its end
          follow every move, because each drag calls draw() again with the point where it was put.
          */
          val points = mutableListOf(vec(-60, 0, 0), vec(-30, 60, 30), vec(30, -50, -30), vec(60, 20, 0))

          fun draw() {
              three(name = "curve", height = 480) {
                  val curve = fline {
                      moveTo(points[0])
                      cubicTo(points[1], points[2], points[3])
                  }
                  val polygon = fline {
                      moveTo(points[0])
                      lineTo(points[1])
                      lineTo(points[2])
                      lineTo(points[3])
                      color = vec(1.0, 1.0, 1.0, 0.3)
                  }
                  lines([curve, polygon])
                  val end = points[3]
                  label(vec(end.x, end.y + 14, end.z), "%.1f long".format(curve.length()), style = "tag")
                  points.forEachIndexed { i, p ->
                      handle("p$i", at = p, label = "p$i") { drag ->
                          points[i] = drag.position
                          draw()
                      }
                  }
              }
          }
          draw()
  - create:
      box: slab
      name: 2 - A slab and a post
      frame: { x: 60.0, y: 720.0, w: 420.0, h: 136.0 }
      properties:
        code: |
          /*
          The blue handle runs on a vertical rail (axis = y): it sets the slab's height. The orange
          one slides only across the slab's top (normal = y), carrying the post with it. Field holds
          each handle to its line or plane before the callback sees the position.
          */
          var height = 20.0
          var post = vec(20, 0, 10)

          fun draw() {
              three(name = "slab", height = 480) {
                  mesh(
                      boxMesh(120, height, 60).translated(0.0, height / 2, 0.0),
                      id = "slab",
                      wireframe = false,
                      material = ThreeSurfaceMaterial(color = floatArrayOf(0.85f, 0.55f, 0.3f)),
                  )
                  mesh(
                      boxMesh(6, 40, 6).translated(post.x.toDouble(), height + 20, post.z.toDouble()),
                      id = "post",
                      wireframe = false,
                  )
                  handle(
                      "height",
                      at = vec(-60.0, height, 30.0),
                      label = "height %.0f".format(height),
                      axis = vec(0, 1, 0),
                      color = "#4fc3f7",
                  ) { drag ->
                      height = maxOf(2.0, drag.position.y.toDouble())
                      draw()
                  }
                  handle(
                      "post",
                      at = vec(post.x.toDouble(), height, post.z.toDouble()),
                      label = "post",
                      normal = vec(0, 1, 0),
                      color = "#ff8a65",
                  ) { drag ->
                      post = drag.position
                      draw()
                  }
              }
          }
          draw()
