version: 1

# Ordinary OperationTranscript boxes are compact labels: see OPERATION_TRANSCRIPT.md.
# Two kinds of box earn an entry, and the reason should say which: a `docs_capture/` capture subject whose
# rectangle is part of the intended screenshot, and a saved `metadata.edn` demo box that displays a wide
# graphic into its own output area, where compacting the frame would clip the figure rather than tidy it.
# The guard requires one reason per file#box and rejects entries that no longer point at an oversized frame.
#
# Six entries left on 2026-09-13, when the ordinary ceiling moved from 520 x 120 to 620 x 170: the
# completion-header and four-panel-lifecycle cards are 620 x 150 and 560 x 150, so they now fit under it
# and need no exemption. Their frames did not change — only the ceiling did.
largeFrames:
  docs_capture/keybindings_inspect.yaml#agent_keybindings_inspect: Box dimensions are part of the keybindings-panel screenshot framing.
  docs_capture/remote_ar_kotlin_plane.yaml#agent_remote_ar_plane_head: Box height reserves the documented Remote AR capture composition.
  docs_capture/remote_ar_kotlin_plane.yaml#agent_remote_ar_plane: Box dimensions are part of the Remote AR editor screenshot composition.
  docs_capture/remote_ar_fline_triangle.yaml#remote_ar_fline_box: Box dimensions are part of the Remote AR FLine-triangle editor screenshot composition.
  docs_capture/threejs_editable_fill_pixels.yaml#fill_editable_planes: Large box is the visual subject of the editable-fill comparison capture.
  docs_capture/threejs_editable_fill_pixels.yaml#fill_editable_overlap: Large box is the visual subject of the editable-fill comparison capture.
  docs_capture/threejs_editable_fill_pixels.yaml#fill_static_planes: Large box is the visual subject of the editable-fill comparison capture.
  docs_capture/threejs_editable_fill_pixels.yaml#stroke_editable_curve: Large box is the visual subject of the editable-stroke comparison capture.
  interaction_nets_lambda/metadata.edn#lambda-normalise: Saved demo document rather than a transcript; the box holds the eight-term table it prints, which is 80 columns wide.
  interaction_nets_lambda/metadata.edn#lambda-reduction: Saved demo document; the box holds the five-panel reduction figure, which is ~1300px of graphic by design.
  interaction_nets_lambda/metadata.edn#lambda-oracle: Saved demo document; the box holds the 25-row corpus table and its four-scheduler summary.
  madp_score.yaml#madp_score_playhead: The playhead is a 12-wide line whose height is the score's span; playScore resizes it to that span every run.
  demo_document.yaml#demo_timeline: The timeline is a 40-wide time slider whose height spans the boxes it scrubs; dragging it sideways starts each box it enters and stops each box it leaves.
  docs_capture/renderer_column.yaml#browse_renderer: Capture subject for visualizers.md; 820 wide so the renderer's column browser shows several columns side by side (84e89cf6e).
  renderer_browsing.yaml#browse_renderer: Same column browser as the renderer_column capture; the width is what gives the columns room (84e89cf6e).
  spreadsheet_tour.yaml#spreadsheet_tour_sheet: The sheet box is 640 wide, 20 over the ceiling, as it landed in 0a037a857; the sheet shows its columns in the box's own output area.
