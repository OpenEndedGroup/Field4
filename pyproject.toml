[project]
name = "field4-agent-tools"
version = "0.1.0"
description = "Python tool dependencies for Field agent automation and documentation builds."
requires-python = ">=3.12"
dependencies = [
    "codealmanac>=0.4.7",
]

[dependency-groups]
backdoor = [
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "websockets>=15.0.0",
]
docs = [
    "jedi>=0.19.2",
    "jep==4.3.1",
    "pillow>=10.0.0",
    "pymdown-extensions>=11.0.0",
    "pyyaml>=6.0.0",
    "websockets>=15.0.0",
    "zensical>=0.0.47",
]

[tool.uv]
package = false
