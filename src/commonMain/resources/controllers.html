<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Field Controllers</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/controllers.css">
    <!-- The law module comes first: `controllers.js` renders the same ControllerControl records the
         desktop output area does, so the two surfaces share one mapping from travel to value. -->
    <script defer src="/controlLaws.js?v=20260813-control-laws"></script>
    <script defer src="/controllers.js?v=20260813-control-laws"></script>
  </head>
  <body>
    <main class="controller-shell" aria-label="Field touch controller">
      <header class="controller-top">
        <div class="status-line">
          <span id="connection">offline</span>
          <span id="readout">x 0.500 y 0.500</span>
        </div>
        <div id="pad-controls" class="controls" aria-label="Controller options">
          <div class="segmented" role="group" aria-label="Value axis">
            <button type="button" class="segment active" data-axis="y">Y</button>
            <button type="button" class="segment" data-axis="x">X</button>
            <button type="button" class="segment" data-axis="xy">XY</button>
          </div>
          <div class="segmented" role="group" aria-label="Send mode">
            <button type="button" class="segment active" data-mode="absolute">ABS</button>
            <button type="button" class="segment" data-mode="delta">DELTA</button>
            <button type="button" class="segment" data-mode="both">BOTH</button>
          </div>
          <div class="command-cluster" role="group" aria-label="Editor commands">
            <button type="button" class="icon-button" id="save-value" aria-label="Save current number" title="Save current number">↓</button>
            <button type="button" class="icon-button" id="restore-value" aria-label="Restore saved number" title="Restore saved number">↩</button>
            <button type="button" class="icon-button" id="lock-binding" aria-label="Lock current number binding" title="Lock current number binding">⌖</button>
            <button type="button" class="icon-button" id="unlock-binding" aria-label="Unlock number binding" title="Unlock number binding">⌫</button>
            <button type="button" class="icon-button" id="launch" aria-label="Launch selected box" title="Launch">▶</button>
            <button type="button" class="icon-button" id="stop" aria-label="Stop selected box" title="Stop">■</button>
          </div>
        </div>
      </header>
      <section id="touch-area" class="touch-area controller-page active" data-controller-page="pad" aria-label="Touch surface">
        <div class="crosshair crosshair-x"></div>
        <div class="crosshair crosshair-y"></div>
        <div id="thumb" class="thumb" role="slider" aria-label="Touch position" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="500" tabindex="0"></div>
      </section>
      <section id="group-page" class="control-page controller-page" data-controller-page="controls" aria-label="Selected box controls">
        <div id="group-state" class="group-state">No selected control group</div>
        <div id="group-controls" class="group-controls"></div>
      </section>
      <section id="outputs-page" class="control-page controller-page" data-controller-page="outputs" aria-label="Selected box outputs">
        <div id="outputs-state" class="group-state">No selected output areas</div>
        <div id="outputs-controls" class="group-controls"></div>
        <div id="outputs-list" class="phone-outputs"></div>
      </section>
      <section id="chat-page" class="remote-page controller-page" data-controller-page="chat" aria-label="AI4 chat">
        <div id="chat-state" class="remote-state">Loading AI4 chat…</div>
        <div id="chat-frame-host" class="remote-frame-host"></div>
      </section>
      <section id="select-page" class="remote-page controller-page" data-controller-page="select" aria-label="Open anything">
        <div id="select-state" class="remote-state">Choose a box or property</div>
        <div id="select-frame-host" class="remote-frame-host"></div>
      </section>
      <section id="editor-page" class="remote-page controller-page" data-controller-page="editor" aria-label="Selected box editor">
        <div id="editor-state" class="remote-state">Select a box to edit</div>
        <div id="editor-frame-host" class="remote-frame-host"></div>
      </section>
      <nav class="page-tabs" aria-label="Controller page">
        <button type="button" class="controller-tab active" data-page="pad"><span aria-hidden="true">◎</span><b>Pad</b></button>
        <button type="button" class="controller-tab" data-page="controls"><span aria-hidden="true">≡</span><b>Group</b></button>
        <button type="button" class="controller-tab" data-page="outputs"><span aria-hidden="true">▤</span><b>Outputs</b></button>
        <button type="button" class="controller-tab" data-page="chat"><span aria-hidden="true">◇</span><b>Chat</b></button>
        <button type="button" class="controller-tab" data-page="select"><span aria-hidden="true">⌕</span><b>Select</b></button>
        <button type="button" class="controller-tab" data-page="editor"><span aria-hidden="true">⌨</span><b>Edit</b></button>
      </nav>
    </main>
  </body>
</html>
