<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>Completion Doc Polish</title>
    <link rel="preload" href="/iosevka-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/iosevka.css" as="style">
    <link rel="stylesheet" href="/iosevka.css">
    <style>
        :root {
            --bg: rgb(12, 12, 12);
            --panel: rgb(25, 25, 25);
            --panel-2: rgb(19, 19, 19);
            --border: rgba(230, 240, 245, 0.14);
            --border-strong: rgba(230, 240, 245, 0.32);
            --text: rgba(235, 242, 246, 0.95);
            --soft: rgba(168, 183, 192, 0.95);
            --accent: rgb(224, 241, 249);
            --danger: rgb(255, 120, 120);
            --ok: rgb(174, 240, 198);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Iosevka Web", ui-monospace, monospace;
            overflow: hidden;
        }

        body {
            padding: 20px;
        }

        main {
            width: min(1180px, calc(100vw - 40px));
            margin: 0 auto;
            display: grid;
            grid-template-rows: auto auto auto minmax(190px, 0.9fr) minmax(0, 1fr);
            gap: 12px;
            height: calc(100vh - 40px);
            min-height: 0;
        }

        header,
        section {
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: 8px;
        }

        header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            padding: 14px;
        }

        h1,
        h2 {
            margin: 0;
            font-weight: 400;
            letter-spacing: 0;
        }

        h1 {
            font-size: 20px;
        }

        h2 {
            color: var(--soft);
            font-size: 12px;
        }

        button,
        a.button {
            font: inherit;
            font-size: 12px;
            color: var(--text);
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 7px 9px;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover,
        a.button:hover {
            border-color: var(--border-strong);
        }

        button:disabled {
            color: var(--soft);
            cursor: default;
            opacity: 0.55;
        }

        .header-actions,
        .metrics,
        .activity-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .metric {
            display: grid;
            gap: 4px;
            min-width: 136px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--panel-2);
        }

        .metric-label,
        .activity-label {
            color: var(--soft);
            font-size: 10px;
            text-transform: lowercase;
        }

        .metric-value {
            color: var(--accent);
            font-size: 16px;
        }

        .overview {
            display: grid;
            gap: 12px;
            padding: 12px;
        }

        .status-line {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
            align-items: baseline;
            min-width: 0;
            font-size: 12px;
        }

        .status-value {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .status-value.running,
        .status-value.succeeded {
            color: var(--ok);
        }

        .status-value.failed {
            color: var(--danger);
        }

        .activity {
            display: grid;
            gap: 8px;
            padding: 12px;
            min-height: 0;
        }

        .activity-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            align-items: stretch;
            max-height: 190px;
            overflow: auto;
        }

        .activity-item {
            min-width: 0;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--panel-2);
            color: var(--soft);
            font-size: 11px;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .activity-title {
            color: var(--text);
            font-size: 12px;
        }

        .activity-detail {
            margin-top: 3px;
            color: var(--soft);
            font-size: 10px;
        }

        .transcript {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: 8px;
            padding: 12px;
            min-height: 0;
        }

        .edits {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: 8px;
            padding: 12px;
            min-height: 0;
        }

        .edit-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 10px;
            min-height: 0;
            overflow: auto;
        }

        .edit-card {
            min-width: 0;
            display: grid;
            grid-template-rows: auto auto auto;
            gap: 8px;
            align-content: start;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--panel-2);
        }

        .edit-card-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            align-items: baseline;
        }

        .edit-file {
            min-width: 0;
            color: var(--accent);
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-kind {
            color: var(--soft);
            font-size: 10px;
            white-space: nowrap;
        }

        .edit-doc {
            color: var(--text);
            font-size: 12px;
            line-height: 1.45;
        }

        .edit-doc p {
            margin: 0 0 6px;
        }

        .edit-doc ul {
            margin: 4px 0 0;
            padding-left: 18px;
        }

        .edit-doc code {
            padding: 0 3px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: rgb(8, 8, 8);
            color: var(--accent);
        }

        .edit-code {
            max-height: 210px;
            overflow: auto;
        }

        .edit-code code {
            display: block;
            white-space: pre;
            font: 11px/1.42 "Iosevka Web", ui-monospace, monospace;
        }

        .tok-comment {
            color: rgb(137, 155, 166);
        }

        .tok-keyword {
            color: rgb(232, 232, 232);
        }

        .tok-string {
            color: rgb(174, 240, 198);
        }

        .tok-number {
            color: rgb(205, 220, 230);
        }

        .tok-type {
            color: rgb(188, 208, 220);
        }

        .empty-edit {
            padding: 12px;
            border: 1px dashed var(--border);
            border-radius: 7px;
            color: var(--soft);
            font-size: 12px;
        }

        pre {
            margin: 0;
            min-height: 0;
            overflow: auto;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: rgb(6, 6, 6);
            color: var(--text);
            font: 12px/1.45 "Iosevka Web", ui-monospace, monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        @media (max-width: 760px) {
            body {
                padding: 10px;
                overflow: auto;
            }

            main {
                width: calc(100vw - 20px);
                height: auto;
                min-height: calc(100vh - 20px);
                grid-template-rows: auto;
            }

            header,
            .edit-card-header,
            .status-line {
                grid-template-columns: 1fr;
            }

            .edit-list {
                grid-template-columns: 1fr;
                max-height: 60vh;
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>Completion Doc Polish</h1>
            <h2 id="subtitle">checking</h2>
        </div>
        <div class="header-actions">
            <button id="run-polish" type="button">Run polish</button>
            <button id="refresh" type="button">Refresh</button>
            <a class="button" href="/welcome" target="_self">Welcome</a>
        </div>
    </header>

    <section class="overview">
        <div class="metrics">
            <div class="metric">
                <span class="metric-label">docs ready</span>
                <span id="docs-ready" class="metric-value">0</span>
            </div>
            <div class="metric">
                <span class="metric-label">files ready</span>
                <span id="files-ready" class="metric-value">0</span>
            </div>
            <div class="metric">
                <span class="metric-label">cache</span>
                <span id="cache-size" class="metric-value">missing</span>
            </div>
            <div class="metric">
                <span class="metric-label">task</span>
                <span id="task-state" class="metric-value">idle</span>
            </div>
        </div>
        <div class="status-line">
            <span class="activity-label">message</span>
            <span id="message" class="status-value">checking</span>
        </div>
        <div class="status-line">
            <span class="activity-label">cache path</span>
            <span id="cache-path" class="status-value"></span>
        </div>
    </section>

    <section class="activity">
        <h2>Activity</h2>
        <div id="activity-list" class="activity-list"></div>
    </section>

    <section class="edits">
        <h2>Edits</h2>
        <div id="edit-list" class="edit-list"></div>
    </section>

    <section class="transcript">
        <h2>Terminal output</h2>
        <pre id="transcript"></pre>
    </section>
</main>

<script>
    let latestStatus = null;
    let socket = null;
    let refreshTimer = null;

    function countLabel(value, singular, plural = `${singular}s`) {
        const n = Number(value) || 0;
        return n === 1 ? `1 ${singular}` : `${n} ${plural}`;
    }

    function bytesLabel(value) {
        const n = Number(value) || 0;
        if (n <= 0) return "missing";
        if (n < 1024) return `${n} B`;
        if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KiB`;
        return `${(n / 1024 / 1024).toFixed(1)} MiB`;
    }

    function websocketUrl() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        return `${protocol}//${window.location.host}/welcome-events`;
    }

    function compactFile(path) {
        const text = String(path || "");
        if (!text) return "";
        const parts = text.split(/[\\/]+/).filter(Boolean);
        if (parts.length <= 3) return text;
        return `${parts.slice(-3).join("/")}`;
    }

    function firstMatch(text, pattern) {
        const match = pattern.exec(text);
        return match ? match[1] : "";
    }

    function escapeHtml(text) {
        return String(text || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function parseJsonPayload(line) {
        const text = String(line || "");
        const start = text.indexOf("{");
        const end = text.lastIndexOf("}");
        if (start < 0 || end <= start) return null;
        try {
            return JSON.parse(text.slice(start, end + 1));
        } catch (_) {
            return null;
        }
    }

    function commonPrefixLength(a, b) {
        const limit = Math.min(a.length, b.length);
        let i = 0;
        while (i < limit && a[i] === b[i]) i += 1;
        return i;
    }

    function commonSuffixLength(a, b, prefixLength) {
        const limit = Math.min(a.length, b.length) - prefixLength;
        let i = 0;
        while (i < limit && a[a.length - 1 - i] === b[b.length - 1 - i]) i += 1;
        return i;
    }

    function insertedText(oldText, newText) {
        const oldValue = String(oldText || "");
        const newValue = String(newText || "");
        if (!newValue) return "";
        if (oldValue && newValue.includes(oldValue)) {
            return newValue.replace(oldValue, "").trim();
        }
        const prefix = commonPrefixLength(oldValue, newValue);
        const suffix = commonSuffixLength(oldValue, newValue, prefix);
        return newValue.slice(prefix, newValue.length - suffix).trim();
    }

    function kdocBlocks(text) {
        const blocks = [];
        const pattern = /\/\*\*[\s\S]*?\*\//g;
        let match;
        while ((match = pattern.exec(String(text || ""))) !== null) {
            blocks.push(match[0]);
        }
        return blocks;
    }

    function kdocToMarkdown(block) {
        return String(block || "")
            .replace(/^\/\*\*\s*/, "")
            .replace(/\s*\*\/$/, "")
            .split(/\r?\n/)
            .map((line) => line.replace(/^\s*\*\s?/, "").trimEnd())
            .join("\n")
            .trim();
    }

    function renderMarkdown(markdown) {
        const lines = String(markdown || "").split(/\r?\n/);
        const parts = [];
        let list = [];

        function flushList() {
            if (!list.length) return;
            parts.push(`<ul>${list.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</ul>`);
            list = [];
        }

        lines.forEach((line) => {
            const trimmed = line.trim();
            if (!trimmed) {
                flushList();
                return;
            }
            const bullet = /^[-*]\s+(.+)$/.exec(trimmed);
            if (bullet) {
                list.push(bullet[1]);
                return;
            }
            flushList();
            parts.push(`<p>${inlineMarkdown(trimmed)}</p>`);
        });
        flushList();
        return parts.join("") || "<p>No rendered documentation text.</p>";
    }

    function inlineMarkdown(text) {
        return escapeHtml(text)
            .replace(/`([^`]+)`/g, "<code>$1</code>")
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function highlightKotlin(code) {
        const escaped = escapeHtml(code);
        const pattern = /(\/\*\*[\s\S]*?\*\/|\/\/[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:fun|val|var|class|object|interface|data|return|if|else|when|for|while|import|package|private|public|internal|override|operator|inline|suspend|tailrec|const|lateinit|by|in|is|null|true|false)\b|\b[A-Z][A-Za-z0-9_]*\b|\b\d+(?:\.\d+)?\b)/g;
        return escaped.replace(pattern, (token) => {
            if (token.startsWith("/")) return `<span class="tok-comment">${token}</span>`;
            if (token.startsWith("&quot;") || token.startsWith("&#39;")) return `<span class="tok-string">${token}</span>`;
            if (/^\d/.test(token)) return `<span class="tok-number">${token}</span>`;
            if (/^[A-Z]/.test(token)) return `<span class="tok-type">${token}</span>`;
            return `<span class="tok-keyword">${token}</span>`;
        });
    }

    function extractEditRequests(logText) {
        const lines = String(logText || "").split(/\r?\n/);
        const edits = [];
        const seen = new Set();
        lines.forEach((line) => {
            if (!line.includes("ReplaceInFileRequest")) return;
            const payload = parseJsonPayload(line);
            if (!payload || typeof payload.file !== "string" || typeof payload.newText !== "string") return;
            const key = `${payload.file}\n${payload.newText}`;
            if (seen.has(key)) return;
            seen.add(key);
            const added = insertedText(payload.oldText || "", payload.newText);
            const docs = kdocBlocks(added).length ? kdocBlocks(added) : kdocBlocks(payload.newText);
            edits.push({
                file: payload.file,
                expectedOccurrences: payload.expectedOccurrences || 1,
                added,
                newText: payload.newText,
                docs: docs.map(kdocToMarkdown).filter(Boolean)
            });
        });
        return edits.slice(-12);
    }

    function renderEdits(logText) {
        const list = document.getElementById("edit-list");
        const edits = extractEditRequests(logText);
        if (!edits.length) {
            list.innerHTML = `<div class="empty-edit">No source-documentation edits have appeared yet.</div>`;
            return;
        }
        list.innerHTML = edits.map(() => `
            <article class="edit-card">
                <div class="edit-card-header">
                    <div class="edit-file"></div>
                    <div class="edit-kind"></div>
                </div>
                <div class="edit-doc"></div>
                <pre class="edit-code"><code></code></pre>
            </article>
        `).join("");
        list.querySelectorAll(".edit-card").forEach((card, index) => {
            const edit = edits[index];
            card.querySelector(".edit-file").textContent = compactFile(edit.file);
            card.querySelector(".edit-kind").textContent = `${edit.expectedOccurrences} match`;
            card.querySelector(".edit-doc").innerHTML = edit.docs.length
                ? edit.docs.map(renderMarkdown).join("")
                : renderMarkdown("No KDoc block found in this edit.");
            card.querySelector(".edit-code code").innerHTML = highlightKotlin(edit.added || edit.newText);
        });
    }

    function summarizeActivityLine(line) {
        let text = String(line || "").trim();
        if (!text) return null;

        if (text.startsWith("[completion-doc-polish]")) {
            text = text.replace(/^\[completion-doc-polish\]\s*/, "").trim();
        }
        text = text.replace(/^\[[^\]]+\]\s*/, (prefix) => {
            return prefix.includes("progress") ? "[progress] " : "";
        }).trim();

        if (text.startsWith("[progress]")) {
            const body = text.replace(/^\[progress\]\s*/, "");
            if (body.startsWith("Using ReplaceInFileRequest")) {
                const file = compactFile(firstMatch(body, /"file"\s*:\s*"([^"]+)"/));
                return {
                    title: "Preparing source edit",
                    detail: file || "ReplaceInFileRequest"
                };
            }
            if (body.startsWith("ReplaceInFileRequest finished")) {
                return {
                    title: "Source edit finished",
                    detail: body.replace(/^ReplaceInFileRequest finished:\s*/, "")
                };
            }
            return {
                title: body.replace(/:.*/, "").trim() || "Progress",
                detail: body.includes(":") ? body.replace(/^[^:]+:\s*/, "").trim() : ""
            };
        }

        if (text.includes("tool: name=ReplaceInFileRequest")) {
            const file = compactFile(firstMatch(text, /"file"\s*:\s*"([^"]+)"/));
            return {
                title: "Editing source file",
                detail: file || "ReplaceInFileRequest"
            };
        }

        if (text.includes("tool: result name=ReplaceInFileRequest")) {
            return {
                title: "Edit result received",
                detail: "ReplaceInFileResponse"
            };
        }

        if (text.includes("creating response")) {
            return {
                title: "Model is responding",
                detail: text.replace(/^.*creating response\s*/, "").trim()
            };
        }

        if (text.startsWith("Completion doc cache:")) {
            return {
                title: "Loaded generated-doc cache",
                detail: text.replace(/^Completion doc cache:\s*/, "")
            };
        }
        if (text.startsWith("Source root:")) {
            return {
                title: "Scanning source root",
                detail: text.replace(/^Source root:\s*/, "")
            };
        }
        if (text.startsWith("Model:")) {
            return {
                title: "Using model",
                detail: text.replace(/^Model:\s*/, "")
            };
        }
        if (text.startsWith("Removed consumed completion doc cache:")) {
            return {
                title: "Consumed cache removed",
                detail: text.replace(/^Removed consumed completion doc cache:\s*/, "")
            };
        }
        if (text.startsWith("Preserved generated completion doc cache for later passes:")) {
            return {
                title: "Cache preserved",
                detail: text.replace(/^Preserved generated completion doc cache for later passes:\s*/, "")
            };
        }
        if (text.startsWith("Only cache entries explicitly edited")) {
            return {
                title: "No implicit cache cleanup",
                detail: text
            };
        }
        if (text.startsWith("Starting ./gradlew")) {
            return {
                title: "Started Gradle task",
                detail: text
            };
        }
        if (text.startsWith("> Task")) {
            return {
                title: text.replace(/^>\s*/, ""),
                detail: ""
            };
        }
        return null;
    }

    function activityItems(logText) {
        const lines = String(logText || "")
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean);
        const seen = new Set();
        const items = [];
        lines.forEach((line) => {
            const item = summarizeActivityLine(line);
            if (!item) return;
            const key = `${item.title}\n${item.detail}`;
            if (seen.has(key)) return;
            seen.add(key);
            items.push(item);
        });
        return items.slice(-8);
    }

    function render(status) {
        latestStatus = status || {};
        const cache = latestStatus.cache || {};
        const docs = Number(cache.pendingDocCount) || 0;
        const files = Number(cache.pendingSourceFileCount) || 0;
        const state = latestStatus.status || "idle";
        const transcript = document.getElementById("transcript");
        const wasNearBottom = transcript.scrollTop + transcript.clientHeight >= transcript.scrollHeight - 24;

        document.getElementById("subtitle").textContent = cache.message || latestStatus.message || "ready";
        document.getElementById("docs-ready").textContent = countLabel(docs, "doc");
        document.getElementById("files-ready").textContent = countLabel(files, "file");
        document.getElementById("cache-size").textContent = bytesLabel(cache.sizeBytes);
        document.getElementById("task-state").textContent = state;
        document.getElementById("task-state").className = `metric-value ${state}`;
        document.getElementById("message").textContent = latestStatus.message || cache.message || "";
        document.getElementById("message").className = `status-value ${state}`;
        document.getElementById("cache-path").textContent = cache.cachePath || "";

        const runButton = document.getElementById("run-polish");
        runButton.disabled = !!latestStatus.running || docs <= 0;
        runButton.textContent = latestStatus.running ? "Running..." : "Run polish";

        const activity = activityItems(latestStatus.logTail);
        document.getElementById("activity-list").innerHTML = activity.length
            ? activity.map(() => `<div class="activity-item"><div class="activity-title"></div><div class="activity-detail"></div></div>`).join("")
            : `<div class="activity-item">No task output yet.</div>`;
        document.querySelectorAll(".activity-item").forEach((node, index) => {
            const item = activity[index];
            if (!item) return;
            node.querySelector(".activity-title").textContent = item.title || "";
            node.querySelector(".activity-detail").textContent = item.detail || "";
        });

        renderEdits(latestStatus.logTail);
        transcript.textContent = latestStatus.logTail || "No conversation yet.";
        if (wasNearBottom || latestStatus.running) {
            transcript.scrollTop = transcript.scrollHeight;
        }
    }

    async function refresh() {
        try {
            const response = await fetch("/api/completion-doc-polish", { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            render(await response.json());
        } catch (error) {
            render({
                status: "failed",
                message: error?.message || "Could not load polish status.",
                cache: latestStatus?.cache || {},
                logTail: latestStatus?.logTail || ""
            });
        }
    }

    async function runPolish() {
        document.getElementById("run-polish").disabled = true;
        try {
            const response = await fetch("/api/completion-doc-polish", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                cache: "no-store",
                body: JSON.stringify({ dryRun: false })
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
            render(payload);
        } catch (error) {
            render({
                ...(latestStatus || {}),
                status: "failed",
                message: error?.message || "Could not start polish task."
            });
        }
    }

    function connectEvents() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
        try {
            socket = new WebSocket(websocketUrl());
        } catch (_) {
            setTimeout(connectEvents, 1500);
            return;
        }
        socket.addEventListener("message", refresh);
        socket.addEventListener("close", () => {
            socket = null;
            setTimeout(connectEvents, 1500);
        });
        socket.addEventListener("error", () => {
            try {
                socket.close();
            } catch (_) {
            }
        });
    }

    document.getElementById("run-polish").addEventListener("click", runPolish);
    document.getElementById("refresh").addEventListener("click", refresh);
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") refresh();
    });

    refresh();
    connectEvents();
    refreshTimer = setInterval(() => {
        if (document.visibilityState === "visible") refresh();
    }, 2000);
</script>
</body>
</html>
