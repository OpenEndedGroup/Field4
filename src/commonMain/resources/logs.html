<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Log Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The `logs(...)` embed (afield/outputs.kt -> /logs, server side afield/server/logstream.kt). -->
    <link rel="stylesheet" href="/iosevka.css">
    <link rel="stylesheet" href="/field.css">
    <style>
        :root{
            --bg: var(--field-surface, #000);
            --panel: var(--field-surface, #111);
            --fg: var(--field-fg, #e7e7e7);
            --muted: var(--field-fg-dim, #9aa0a6);
            --accent: rgb(var(--field-accent-rgb, 127,208,255));
            --warn: rgb(var(--field-warning-rgb, 255,198,109));
            --error: rgb(var(--field-danger-rgb, 255,138,128));
            --border: #000;
            --sep: rgba(255,255,255,0.08);
            --sb-size: 8px;
            --sb-thumb: rgba(255,255,255,.22);
            --sb-thumb-hover: rgba(255,255,255,.35);
        }
        *{ box-sizing:border-box; font-family:"Iosevka Web", system-ui, sans-serif; }
        body{ margin:0; background:rgba(0,0,0,1); color:var(--fg); font-weight:300; font-size:12px; line-height:1.25; }
        #chrome{ padding:6px; display:flex; flex-direction:column; gap:6px; background:transparent; }
        #bar{ display:flex; align-items:center; gap:6px; }
        #filters{ display:flex; flex-wrap:wrap; gap:6px; flex:0 1 auto; min-width:0; }
        #bar #find{ flex:1 1 120px; }
        /* A narrow panel puts the message under its time and channel instead of squeezing it out. */
        @media (max-width: 520px){
            .row{ grid-template-columns: max-content minmax(0, 1fr); }
            .row .msg{ grid-column: 1 / -1; }
        }
        #find{
            flex:0 1 180px; min-width:80px; background:rgba(255,255,255,0.06); color:var(--fg);
            border:1px solid transparent; border-radius:3px; padding:2px 6px; font-size:11px; outline:none;
        }
        #find:focus{ border-color: rgba(var(--field-accent-rgb, 72,201,255), .5); }
        .tool{ background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:11px; padding:2px 4px; }
        .tool:hover{ color:var(--fg); }
        #jump{ display:none; color:var(--accent); }
        #jump.show{ display:inline-block; }
        #conn{ color:var(--muted); font-size:10px; }
        #conn.bad{ color:var(--error); }
        .row.hidden, .block-group.hidden{ display:none; }
        .pill{
            padding: 2px 6px;
            color: var(--muted);
            border:1px solid var(--sep); border-radius:999px; white-space:nowrap;
            font-size: 10px;
        }
        #log{
            /*border:2px solid var(--border); border-radius:6px;*/
            background:var(--panel); min-height:120px; max-height:calc( 100vh - 16px );
            overflow:auto;
            /*padding:6px;*/
        }
        .row{
            display:grid; grid-template-columns: max-content minmax(0, max-content) minmax(0, 1fr); gap:2px 8px;
            padding:6px 6px; border-bottom:1px solid var(--sep);
            align-items:flex-start;
        }
        .row.block{ border-left:2px solid rgba(255,255,255,0.12); }
        .row.empty{ display:block; color:var(--muted); font-style:italic; }
        .row.block-level-1{ margin-left:24px; }
        .row.block-level-2{ margin-left:40px; }
        .row.block-level-3{ margin-left:56px; }
        .row.block-level-4{ margin-left:72px; }
        .row.block-level-5{ margin-left:88px; }
        .block-group{
            border-left:2px solid rgba(255,255,255,0.22);
            margin:6px 0 10px 0;
            padding-left:10px;
            border-radius:6px;
            background:rgba(255,255,255,0.02);
        }
        .block-group > .row:first-child{
            background:rgba(255,255,255,0.05);
            border-radius:4px;
        }
        .row:last-child{ border-bottom:none; }
        .ts{ color:var(--muted); font-variant-numeric: tabular-nums; }
        .ch{ color:var(--accent); }
        .msg{ white-space:pre-wrap; word-break:break-word; }
        .msg.boundary{ color:var(--muted); }
        .msg.error{ color:var(--error); }
        .msg.warn{ color:var(--warn); }
        .badge{
            display:inline-block; padding:2px 6px; border-radius:999px; border:1px solid var(--sep);
            background:rgba(255,255,255,0.04); font-size:10px; color:var(--muted);
            margin-left:4px;
        }
        .badge.block { background:rgba(255,255,255,0.08); color:var(--muted); }
        #log, #log *{ scrollbar-width: thin; scrollbar-color: var(--sb-thumb) transparent; }
        #log::-webkit-scrollbar{ width: var(--sb-size); height: var(--sb-size); }
        #log::-webkit-scrollbar-thumb{ background-color: var(--sb-thumb); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
        #log::-webkit-scrollbar-thumb:hover{ background-color: var(--sb-thumb-hover); }

        html[data-afield-output-iframe="true"] #log{
            max-height: none;
            overflow: visible;
        }
    </style>
</head>
<body>
<div id="chrome">
    <div id="bar">
        <div id="filters"></div>
        <input id="find" type="search" placeholder="find  /" aria-label="Show only rows containing" spellcheck="false">
        <button class="tool" id="jump" title="Scroll to the newest row">↓ 0 new</button>
        <button class="tool" id="clear" title="Clear (k)">clear</button>
        <span id="conn">connecting…</span>
    </div>
    <div id="log" aria-live="polite"></div>
</div>
<script src="/iframe_autosize.js"></script>
<script>
(function(){
    const qs = new URLSearchParams(location.search);
    const subId = qs.get("subId") || `logs-${Math.random().toString(36).slice(2)}`;
    const latestOnly = qs.get("latestOnly") === "true";
    const parseBool = (k, def=false) => {
        const v = qs.get(k);
        return v === null ? def : v.toLowerCase() === "true";
    };
    const parseNum = (k) => {
        const v = qs.get(k); return v ? Number(v) : null;
    };
    const channels = qs.get("channels") ? qs.get("channels").split(",").filter(Boolean) : null;
    const filter = {
        channels,
        messageContains: qs.get("messageContains"),
        messageRegex: qs.get("messageRegex"),
        blockId: qs.get("blockId"),
        includeBlockChildren: parseBool("includeBlockChildren", false),
        sinceEpochMs: parseNum("sinceEpochMs"),
        afterSeq: parseNum("afterSeq"),
        limit: qs.get("limit") ? Number(qs.get("limit")) : (latestOnly ? 1 : 500),
        tail: parseBool("tail", true)
    };

    const logEl = document.getElementById("log");
    const filtersEl = document.getElementById("filters");
    let autoScroll = true;

    function pill(label){
        const el = document.createElement("div");
        el.className = "pill";
        el.textContent = label;
        filtersEl.appendChild(el);
    }

    if (channels) pill("channels: " + channels.join(","));
    if (filter.messageContains) pill("msg contains: " + filter.messageContains);
    if (filter.messageRegex) pill("msg regex: " + filter.messageRegex);
    if (filter.blockId) pill("block: " + filter.blockId);
    if (latestOnly) pill("latest only");

    const wsProto = document.location.protocol === "https:" ? "wss" : "ws";
    let ws = null;
    let open = false;

    function escape(text){
        const el = document.createElement("div");
        el.textContent = text;
        return el.innerHTML;
    }

    function classifyChannel(ch){
        const lc = ch.toLowerCase();
        if (lc.includes("error")) return "error";
        if (lc.includes("warn")) return "warn";
        return "";
    }

    // A block id is data, not a pattern: "(1)" or "a+b" must not throw or match something else.
    function reEscape(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
    function blockLevel(indent){
        if (!indent) return 0;
        const tokens = indent.split(/\t/).map(s => s.trim()).filter(Boolean);
        return Math.min(5, tokens.length);
    }

    function cleanBeginMessage(msg, blockId){
        let out = msg.replace(/^BEGIN\s+/i, "");
        if (blockId) out = out.replace(new RegExp(`-\\s*['"]?${reEscape(blockId)}['"]?$`), "").trim();
        return out;
    }

    function stripBlockId(msg, blockId){
        if (!blockId) return msg;
        const re = new RegExp(`^['"]?${reEscape(blockId)}['"]?\\s*[:\\-]?\\s*`, "i");
        return msg.replace(re, "").trim();
    }

    const blockGroups = new Map();

    function addRow(evt){
        if (latestOnly) logEl.innerHTML = "";
        const shouldStick = autoScroll || latestOnly;
        const level = blockLevel(evt.indent);
        const ts = new Date(evt.timestampEpochMs);
        const boundaryText = evt.boundary && evt.boundary !== "BEGIN" ? evt.boundary + " " : "";

        if (evt.boundary === "END" && evt.blockId) {
            blockGroups.delete(evt.blockId);
            return;
        }

        const row = document.createElement("div");
        row.className = (evt.blockId || level) ? `row block block-level-${level}` : "row";
        const messageText = (evt.boundary === "BEGIN" && evt.blockId)
            ? cleanBeginMessage(evt.message, evt.blockId)
            : stripBlockId(evt.message, evt.blockId);
        row.innerHTML = `
            <div class="ts">${ts.toLocaleTimeString()}</div>
            <div class="ch">${escape(evt.channel)}</div>
            <div class="msg ${evt.boundary ? "boundary" : ""} ${classifyChannel(evt.channel)}">${escape(boundaryText + messageText)}</div>
        `;

        if (evt.boundary === "BEGIN" && evt.blockId) {
            const group = document.createElement("div");
            group.className = "block-group";
            group.dataset.blockId = evt.blockId;
            group.appendChild(row);
            blockGroups.set(evt.blockId, group);
            logEl.appendChild(group);
        } else if (evt.blockId && blockGroups.has(evt.blockId)) {
            const group = blockGroups.get(evt.blockId);
            if (group) {
                group.appendChild(row);
                // Keep the active block together and bumped to the bottom as new rows arrive
                logEl.appendChild(group);
            }
        } else {
            logEl.appendChild(row);
        }

        if (!latestOnly) {
            const max = filter.limit || 500;
            while (logEl.children.length > max) logEl.removeChild(logEl.firstChild);
        }
        logEl.querySelector(":scope > .row.empty")?.remove();
        applyFind(row);
        if (shouldStick) {
            logEl.scrollTop = logEl.scrollHeight;
        } else {
            unseen++; showJump();
        }
    }
    const findEl = document.getElementById("find");
    const jumpEl = document.getElementById("jump");
    const connEl = document.getElementById("conn");
    let unseen = 0;
    function showJump(){ jumpEl.textContent = `↓ ${unseen} new`; jumpEl.classList.toggle("show", unseen > 0); }
    jumpEl.addEventListener("click", () => { logEl.scrollTop = logEl.scrollHeight; autoScroll = true; unseen = 0; showJump(); });
    function applyFind(row){
        const q = findEl.value.trim().toLowerCase();
        row.classList.toggle("hidden", !!q && !row.textContent.toLowerCase().includes(q));
    }
    findEl.addEventListener("input", () => {
        logEl.querySelectorAll(".row").forEach(applyFind);
        logEl.querySelectorAll(".block-group").forEach(g => g.classList.toggle("hidden", !g.querySelector(".row:not(.hidden)")));
    });
    findEl.addEventListener("keydown", (e) => { e.stopPropagation(); if (e.key === "Escape"){ findEl.value = ""; findEl.dispatchEvent(new Event("input")); findEl.blur(); } });
    document.getElementById("clear").addEventListener("click", () => { logEl.innerHTML = ""; blockGroups.clear(); unseen = 0; showJump(); });
    function showEmpty(){
        if (logEl.children.length) return;
        const row = document.createElement("div"); row.className = "row empty";
        row.textContent = "No log events yet" + (filtersEl.children.length ? " matching this filter." : ".");
        logEl.appendChild(row);
    }

    logEl.addEventListener("scroll", () => {
        const nearBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8;
        autoScroll = nearBottom;
        if (nearBottom && unseen){ unseen = 0; showJump(); }
    });

    function addSeparator(){
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<div class="ts"></div><div class="ch"></div><div class="msg"><hr style="border:0;border-top:1px solid var(--sep);"></div>`;
        logEl.appendChild(row);
        if (autoScroll) logEl.scrollTop = logEl.scrollHeight;
    }

    window.addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === "/") {
            e.preventDefault(); findEl.focus();
        } else if (e.key === "k") {
            logEl.innerHTML = ""; blockGroups.clear();
        } else if (e.key === "t") {
            addSeparator();
        }
    });

    // Reconnects (and re-subscribes) when the socket drops, e.g. across a Field restart.
    function connect(){
        ws = new WebSocket(`${wsProto}://${document.location.host}/ws`);
        ws.addEventListener("open", () => {
            open = true;
            connEl.textContent = ""; connEl.classList.remove("bad");
            ws.send(JSON.stringify({type:"logs/subscribe", subId, filter}));
            setTimeout(showEmpty, 1500);
        });
        ws.addEventListener("message", (ev) => {
            try {
                const msg = JSON.parse(ev.data);
                if (!msg.type || !msg.type.startsWith("logs/")) return; // ignore non-log traffic on the shared socket
                if (msg.subId && msg.subId !== subId) return;
                if (msg.type === "logs/event") addRow(msg);
            } catch (_){
                // ignore parse errors from other traffic
            }
        });
        ws.addEventListener("close", () => {
            open = false;
            connEl.textContent = "disconnected — retrying"; connEl.classList.add("bad");
            setTimeout(connect, 1500);
        });
    }
    function cleanClose(){
        if (open) {
            try { ws.send(JSON.stringify({type:"logs/unsubscribe", subId})); } catch(_){}
        }
    }
    connect();
    window.addEventListener("beforeunload", () => { cleanClose(); try { ws.close(); } catch(_){} });
    window.logsEmbedState = () => ({
        rows: logEl.querySelectorAll(".row:not(.empty)").length,
        visible: logEl.querySelectorAll(".row:not(.empty):not(.hidden)").length,
        last: Array.from(logEl.querySelectorAll(".row:not(.empty) .msg")).slice(-5).map(m => m.textContent),
        conn: connEl.textContent,
    });
})();
</script>
</body>
</html>
