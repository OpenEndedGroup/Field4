<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Keyframe Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: dark;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: transparent;
            color: #e8ebf5;
        }

        body {
            margin: 0;
            min-height: 0;
            background: transparent;
            padding: 0;
        }

        #editor-host {
            width: 100%;
            background: transparent;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<div id="editor-host"></div>

<script src="/iframe_autosize.js"></script>
<script type="module">
        import { KeyframeEditor, BUILTIN_KEYFRAME_TYPES } from "./keyframe_editor.js";

        const host = document.getElementById('editor-host');
        const timeRange = [0, 4];
        const valueRange = [0, 1];

        const syncState = {
                ws: null,
                reconnectTimer: null,
                isApplyingRemote: false,
                lastPlayheadPush: 0,
                playheadThrottleMs: 50,
        };
        const urlParams = new URLSearchParams(window.location.search);
        const clientUid = (urlParams.get('uid') || '').trim() || 'anonymous';
        console.log('Client UID:', clientUid, urlParams);
        // Use the host's actual width so the editor fills the iframe
        const hostWidth = Math.max(host.clientWidth || 500, 200);
        const editor = new KeyframeEditor(host, {
                width: hostWidth,
                height: 200,
                timeRange,
                valueRange,
                padding: 0,
                keyframes: [],
                types: {
                        ...BUILTIN_KEYFRAME_TYPES,
                },
                evaluateGraph(keyframes, ctx) {
                        return evaluateSketch(keyframes, ctx);
                },
                onChange() {
                        broadcastKeyframes('change');
                        shareExtent();
                },
                onPreview(keyframes) {
                        // Shapes for a drag in progress: the box answers with a 'segments' message.
                        sendMessage({ type: 'preview', keyframes });
                },
                // Linked lanes: the other editors in this box share one time axis.
                onViewChange(range) {
                        linkState.manual = true;
                        postLink({ kind: 'view', range });
                },
                onFit() {
                        linkState.manual = false;
                        postLink({ kind: 'auto' });
                        applyLinkedView();
                },
                onHover(time) {
                        postLink({ kind: 'hover', time });
                },
                // A moment selected across the lanes, and moved or deleted together.
                onBandSelect(t0, t1, additive) {
                        postLink({ kind: 'band', t0, t1, additive });
                },
                onLinkedClear() {
                        postLink({ kind: 'linked-clear' });
                },
                onShift(dt, phase) {
                        postLink({ kind: 'shift', dt, phase });
                },
                onLinkedDelete() {
                        postLink({ kind: 'linked-delete' });
                },
                // Simplify across the lanes that share this run's key times.
                onLinkedSimplify(request, done) {
                        linkedSimplify(request, done);
                },
                onLinkedSimplifyCommit(session) {
                        postLink({ kind: 'simplify-commit', session });
                },
        });

        // ── Linked lanes ───────────────────────────────────────────────────────────────
        // Every editor of one box (or one channel group within it) is on a BroadcastChannel named
        // for that group. Until someone pans or zooms, each frames the time span of all their keys
        // together, which comes out the same in every lane; a pan or zoom in any lane is then
        // adopted by the others, and Frame curve returns them all to framing everything.
        const linkGroup = (urlParams.get('group') || '').trim();
        const link = linkGroup && typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('kf-link:' + linkGroup) : null;
        const linkState = { manual: false, extents: new Map() };

        function postLink(message) {
                if (link) link.postMessage({ ...message, from: clientUid });
        }

        function linkedTimes() {
                const times = [];
                linkState.extents.forEach((extent, from) => {
                        if (from !== clientUid && Array.isArray(extent)) times.push(...extent);
                });
                return times;
        }

        function applyLinkedView() {
                editor.linkedTimes = linkedTimes();
                if (!linkState.manual) {
                        editor.fitToKeyframes();
                        editor.render();
                }
        }

        function shareExtent() {
                const extent = editor.keyTimeExtent();
                linkState.extents.set(clientUid, extent);
                postLink({ kind: 'extent', extent });
        }

        // Linked Simplify. The lane whose slider moved asks every lane which times it would keep with
        // [pins] kept, makes the union of the answers the new pins, and asks again until nothing is
        // added; each lane then keeps exactly the pins. The union only grows, so this ends, and a lane
        // without keys at all of the run's times does not take part.
        const simplifyRounds = new Map();
        let simplifyToken = 0;

        function linkedSimplify({ session, times, amount, kept }, done) {
                const token = ++simplifyToken;
                if (!link || amount <= 0) {
                        postLink({ kind: 'simplify-show', session, times, amount, pins: [] });
                        setTimeout(() => done([], 1), 0);
                        return;
                }
                const peers = [...linkState.extents.keys()].filter((from) => from !== clientUid).length;
                let pins = [];
                const ask = (round) => {
                        const id = token + ':' + round;
                        const own = kept(pins);
                        const answers = [own];
                        let waiting = peers;
                        const finish = () => {
                                if (!simplifyRounds.has(id)) return;
                                simplifyRounds.delete(id);
                                clearTimeout(timer);
                                if (token !== simplifyToken) return;
                                const union = [...new Map(answers.flat().map((t) => [Math.round(t / 1e-6), t])).values()]
                                        .sort((a, b) => a - b);
                                if (union.length > pins.length && round < 64) {
                                        pins = union;
                                        ask(round + 1);
                                        return;
                                }
                                postLink({ kind: 'simplify-show', session, times, amount, pins });
                                done(pins, answers.length);
                        };
                        // A lane that has closed without saying so must not hold the slider up.
                        const timer = setTimeout(finish, 250);
                        simplifyRounds.set(id, {
                                session,
                                answer(kept) {
                                        if (kept) answers.push(kept);
                                        if (--waiting <= 0) finish();
                                },
                        });
                        postLink({ kind: 'simplify-ask', session, round: id, times, amount, pins });
                        if (peers === 0) setTimeout(finish, 0);
                };
                ask(0);
        }

        if (link) {
                link.onmessage = ({ data }) => {
                        if (!data || data.from === clientUid) return;
                        switch (data.kind) {
                                case 'hello':
                                        // A lane has just opened: tell it our keys, and our view if it is chosen.
                                        shareExtent();
                                        if (linkState.manual) postLink({ kind: 'view', range: editor.viewTimeRange });
                                        break;
                                case 'extent':
                                        linkState.extents.set(data.from, data.extent);
                                        applyLinkedView();
                                        break;
                                case 'view':
                                        if (!Array.isArray(data.range)) break;
                                        linkState.manual = true;
                                        editor.setViewTimeRange(data.range, { render: false });
                                        editor.render();
                                        break;
                                case 'auto':
                                        linkState.manual = false;
                                        applyLinkedView();
                                        break;
                                case 'hover':
                                        editor.setLinkedCursor(data.time);
                                        break;
                                case 'band':
                                        editor.applyLinkedBand(data.t0, data.t1, !!data.additive);
                                        break;
                                case 'linked-clear':
                                        editor.clearLinkedSelection();
                                        break;
                                case 'shift':
                                        editor.applyLinkedShift(data.dt, data.phase);
                                        break;
                                case 'linked-delete':
                                        editor.deleteLinkedSelection();
                                        break;
                                case 'simplify-ask':
                                        postLink({
                                                kind: 'simplify-kept', to: data.from, session: data.session, round: data.round,
                                                kept: editor.linkedSimplifyKept(data.session, data.times, data.amount, data.pins),
                                        });
                                        break;
                                case 'simplify-kept': {
                                        if (data.to !== clientUid) break;
                                        const round = simplifyRounds.get(data.round);
                                        if (round && round.session === data.session) round.answer(data.kept);
                                        break;
                                }
                                case 'simplify-show':
                                        editor.linkedSimplifyShow(data.session, data.times, data.amount, data.pins);
                                        break;
                                case 'simplify-commit':
                                        editor.linkedSimplifyCommit(data.session);
                                        break;
                                case 'bye':
                                        linkState.extents.delete(data.from);
                                        applyLinkedView();
                                        break;
                        }
                };
                window.addEventListener('pagehide', () => postLink({ kind: 'bye' }));
                postLink({ kind: 'hello' });
        }

        // Resize the editor when the iframe / container is resized
        if (typeof ResizeObserver !== 'undefined') {
                const ro = new ResizeObserver(() => {
                        const w = host.clientWidth;
                        if (w > 0 && Math.abs(w - editor.options.width) > 2) {
                                editor.resize(w, editor.options.height);
                        }
                });
                ro.observe(host);
        }

        // No playhead until the box sets one (setTime): a curve nobody is playing has none.
        let playhead = null;


        connectWebSocket();

        function evaluateSketch(keyframes, ctx) {
                const path = buildFunctionalPath(ctx);
                const overlayPath = buildSampleOverlay(keyframes, ctx);
                return overlayPath ? { path, elements: [overlayPath] } : { path };
        }

        function buildFunctionalPath(ctx) {
                const samples = typeof ctx.sampleCurve === 'function' ? ctx.sampleCurve({ stepsPerSegment: 48 }) : [];
                if (!samples.length) return '';
                const keyFor = (a, b) => `${a.time.toFixed(6)}:${a.value.toFixed(6)}:${b.time.toFixed(6)}:${b.value.toFixed(6)}`;
                const breakKeys = new Set((ctx.breakSegments ?? []).map(([start, end]) => keyFor(start, end)));
                const commands = [];
                let move = true;
                for (let i = 0; i < samples.length; i += 1) {
                        const sample = samples[i];
                        const x = ctx.timeToX(sample.time);
                        const y = ctx.valueToY(sample.value);
                        commands.push(`${move ? 'M' : 'L'} ${x.toFixed(2)} ${y.toFixed(2)}`);
                        move = false;
                        if (i < samples.length - 1) {
                                const next = samples[i + 1];
                                if (breakKeys.has(keyFor(sample, next))) {
                                        move = true;
                                }
                        }
                }
                return commands.join(' ');
        }

        function buildSampleOverlay(keyframes, ctx) {
                const breaks = ctx.breakSegments ?? [];
                if (!breaks.length) return null;
                const commands = breaks
                    .map(([start, end]) => {
                            const sx = ctx.timeToX(start.time);
                            const sy = ctx.valueToY(start.value);
                            const ex = ctx.timeToX(end.time);
                            const ey = ctx.valueToY(end.value);
                            return `M ${sx.toFixed(2)} ${sy.toFixed(2)} L ${ex.toFixed(2)} ${ey.toFixed(2)}`;
                    })
                    .join(' ');
                return ctx.createElement('path', {
                        d: commands,
                        stroke: '#ffab47',
                        'stroke-width': '2',
                        'stroke-dasharray': '4 4',
                        fill: 'none',
                });
        }

        function connectWebSocket() {
                const url = buildWsUrl();
                const socket = new WebSocket(url);
                syncState.ws = socket;

                socket.addEventListener('open', () => {
                        clearTimeout(syncState.reconnectTimer);
                        syncState.reconnectTimer = null;
                        sendMessage({ type: 'hello', source: 'keyframe-editor', capabilities: ['keyframes', 'playhead', 'requestState'] });
                        // broadcastKeyframes('ws-open');
                        // broadcastPlayhead(editor.getPlayhead(), { force: true, reason: 'ws-open' });
                });

                socket.addEventListener('message', (event) => handleIncomingMessage(event));

                socket.addEventListener('close', () => {
                        scheduleReconnect();
                });

                socket.addEventListener('error', () => {
                        socket.close();
                });
        }

        function scheduleReconnect() {
                if (syncState.reconnectTimer) return;
                syncState.reconnectTimer = window.setTimeout(() => {
                        syncState.reconnectTimer = null;
                        connectWebSocket();
                }, 1000);
        }

        function buildWsUrl() {
                const override = urlParams.get('ws');
                if (override) return override;
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const overrideHost = urlParams.get('wsHost');
                const hostBase = overrideHost ?? window.location.host;
                const needsPort = !hostBase.includes(':') && window.location.port;
                const host = needsPort ? `${hostBase}:${window.location.port}` : hostBase;
                const path = urlParams.get('wsPath') ?? '/ws';
                return `${protocol}//${host}${path}`;
        }

        function sendMessage(payload) {
                if (!payload) return;
                if (!syncState.ws || syncState.ws.readyState !== WebSocket.OPEN) return;
                try {
                        const message = { debug_uid: clientUid, ...payload };
                        syncState.ws.send(JSON.stringify(message));
                } catch (error) {
                        console.warn('WebSocket send failed', error);
                }
        }

        function broadcastKeyframes(reason = 'change') {
                if (syncState.isApplyingRemote) return;
                sendMessage({
                        type: 'keyframes',
                        keyframes: editor.toJSON(),
                        playhead: editor.getPlayhead(),
                        reason,
                });
        }

        function broadcastPlayhead(time, { force = false, reason = 'tick' } = {}) {
                if (syncState.isApplyingRemote) return;
                const now = performance.now();
                if (!force && now - syncState.lastPlayheadPush < syncState.playheadThrottleMs) return;
                syncState.lastPlayheadPush = now;
                sendMessage({
                        type: 'playhead',
                        time,
                        reason,
                });
        }

        function handleIncomingMessage(event) {
                let message = null;
                try {
                        message = JSON.parse(event.data);
                } catch (error) {
                        console.warn('Ignoring non-JSON WebSocket message', error);
                        return;
                }
                if (message?.uid && message.uid === clientUid) {
                        return;
                }

                if (message.type === 'requestState') {
                        broadcastKeyframes('requested');
                        return;
                }

                if (message.type === 'segments') {
                        editor.setCustomSegments(message.segments);
                        return;
                }

                if (Array.isArray(message.keyframes) || message.type === 'keyframes' || message.type === 'state') {
                        // Custom key types first: a key of an unknown type would be read as linear.
                        if (Array.isArray(message.types)) editor.setCustomTypes(message.types);
                        if (Array.isArray(message.segments)) editor._customSegments = message.segments;
                        applyRemoteKeyframes(message.keyframes, message.playhead);
                        return;
                }

                if (message.type === 'playhead' && typeof message.time === 'number') {
                        applyRemotePlayhead(message.time);
                        return;
                }

                // Backend overlay curves
                if (message.type === 'overlay') {
                        const id = message.id ?? 'default';
                        editor.setOverlay(
                            id,
                            message.samples ?? [],
                            message.color ?? '#00e5ff',
                            message.strokeWidth ?? 1.5,
                            message.dashArray ?? '6 3'
                        );
                        return;
                }

                if (message.type === 'clearOverlay') {
                        editor.removeOverlay(message.id ?? 'default');
                        return;
                }

                if (message.type === 'clearAllOverlays') {
                        editor.clearAllOverlays();
                        return;
                }
        }

        function applyRemoteKeyframes(keyframes = [], playheadOverride) {
                if (!Array.isArray(keyframes)) return;
                syncState.isApplyingRemote = true;
                editor.keyframes = keyframes.map((kf) => editor.prepareKeyframe(kf));
                // A bezier key that arrives without handles (keys = listOf(Keyframe(...)) in a box)
                // gets the handles the editor would give it, from its neighbours. They go back to
                // the box once, so the curve it evaluates is the curve drawn here.
                let derived = false;
                keyframes.forEach((source, i) => {
                        const kf = editor.keyframes[i];
                        if (!source.handles && editor.getHandleModeForType(kf.type)) {
                                editor.initializeHandlesFromNeighbors(kf);
                                editor.applyHandleMode(kf);
                                derived = true;
                        }
                });
                if (link) {
                        // A linked lane frames all the lanes' keys, unless someone has chosen a view.
                        editor.linkedTimes = linkedTimes();
                        if (!linkState.manual) fitViewToKeyframes(editor.keyframes);
                } else {
                        fitViewToKeyframes(editor.keyframes);
                }
                editor.refresh({ notify: false });
                syncState.isApplyingRemote = false;
                if (derived) editor.refresh({ record: false });
                // Keys from the box (a run, or setKeys from code) are where undo starts.
                editor.resetHistory();
                shareExtent();
                if (typeof playheadOverride === 'number') {
                        applyRemotePlayhead(playheadOverride);
                }
        }

        function applyRemotePlayhead(time) {
                if (!Number.isFinite(time)) return;
                syncState.isApplyingRemote = true;
                playhead = time;
                editor.setPlayhead(time);
                syncState.lastPlayheadPush = performance.now();
                syncState.isApplyingRemote = false;
        }

        function fitViewToKeyframes(keyframes) {
                if (!Array.isArray(keyframes) || !keyframes.length) return;
                editor.fitToKeyframes();
        }

</script>
</body>
</html>
