<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Keyframe browser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      field.css is what owns `field-md`, and `field-md` is what KeyDiff.toHTML and the `.h`
      cards render into. Without it the diff panel arrives as an unstyled slab — that is the
      one thing a standalone iframe does not get for free from the output area.
    -->
    <link rel="stylesheet" href="/field.css">
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            color: #d8dbe4;
            font-size: 12px;
            line-height: 1.45;
        }

        #kb {
            padding: 10px 12px 14px;
        }

        .kb-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }

        .kb-title {
            font-family: var(--field-mono-font, ui-monospace, monospace);
            font-size: 13px;
            color: #eef1f8;
        }

        .kb-dim {
            color: #7e838f;
        }

        .kb-badge {
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.09);
            color: #9aa0ac;
        }

        .kb-badge.kb-warn {
            background: rgba(239, 159, 39, 0.13);
            border-color: rgba(239, 159, 39, 0.3);
            color: #f0b866;
        }

        .kb-sub {
            color: #6e737e;
            font-size: 11px;
            margin-bottom: 10px;
        }

        .kb-problems {
            border-left: 2px solid #e24b4a;
            background: rgba(226, 75, 74, 0.08);
            padding: 5px 8px;
            margin: 0 0 10px;
            border-radius: 0;
            color: #f0a3a2;
            font-size: 11px;
        }

        /* --- file chips: the diff selector, and the legend for the range marks --- */
        .kb-files {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .kb-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #b8bdc8;
            cursor: pointer;
            user-select: none;
        }

        .kb-chip:hover {
            border-color: rgba(255, 255, 255, 0.22);
        }

        /* Amber is "selected", everywhere: the chip and the datapoints it lights up in every row
           are the same fact, so they are the same colour. */
        .kb-chip.kb-on {
            border-color: #EF9F27;
            background: rgba(239, 159, 39, 0.13);
            color: #f3ce96;
        }

        .kb-chip-n {
            font-family: var(--field-mono-font, ui-monospace, monospace);
            color: #6e737e;
        }

        .kb-chip.kb-on .kb-chip-n {
            color: #EF9F27;
        }

        .kb-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .kb-btn {
            font: inherit;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: transparent;
            color: #c6cbd6;
            cursor: pointer;
        }

        .kb-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .kb-btn:disabled {
            opacity: 0.34;
            cursor: default;
        }

        /* --- the slot table --- */
        .kb-grid {
            display: grid;
            grid-template-columns: minmax(120px, 1.5fr) 70px 46px minmax(140px, 3fr) minmax(88px, 1fr);
            gap: 0;
            font-size: 12px;
        }

        .kb-grid > .kb-hdr {
            font-size: 11px;
            color: #6e737e;
            padding: 0 8px 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        }

        .kb-row {
            display: grid;
            grid-column: 1 / -1;
            grid-template-columns: subgrid;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.045);
        }

        .kb-row:hover {
            background: rgba(255, 255, 255, 0.035);
        }

        .kb-row.kb-open {
            background: rgba(102, 204, 255, 0.06);
        }

        .kb-row > * {
            padding: 4px 8px 4px 0;
            min-width: 0;
        }

        .kb-name {
            font-family: var(--field-mono-font, ui-monospace, monospace);
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .kb-name.kb-scope-only {
            color: #f0b866;
        }

        .kb-name.kb-mixed {
            color: #f0b866;
        }

        .kb-type,
        .kb-count {
            font-size: 11px;
            color: #7e838f;
        }

        .kb-count.kb-partial {
            color: #f0b866;
        }

        .kb-count.kb-none {
            color: #e88;
        }

        .kb-spread {
            text-align: right;
            font-family: var(--field-mono-font, ui-monospace, monospace);
            font-size: 11px;
            color: #8f949f;
            padding-right: 0;
        }

        /* --- range strips --- */
        .kb-strip {
            /* Block, not the span default: an inline box takes no height, so the strip collapses and
               every absolutely-positioned mark stacks on its left edge. */
            display: block;
            position: relative;
            height: 14px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 2px;
        }

        .kb-strip + .kb-strip {
            margin-top: 2px;
        }

        .kb-strip-fill {
            position: absolute;
            inset: 0;
            background: rgba(102, 204, 255, 0.16);
            border-radius: 2px;
        }

        .kb-mark {
            position: absolute;
            top: 1px;
            bottom: 1px;
            width: 2px;
            margin-left: -1px;
            background: #6cf;
            border-radius: 1px;
        }

        /* An unselected mark is the cool default; the selected key's is warm and wider, so it
           reads out of a crowd of marks without needing the others dimmed. */
        .kb-mark-sel {
            background: #EF9F27;
            width: 3px;
            margin-left: -1.5px;
            top: -1px;
            bottom: -1px;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
            z-index: 2;
        }

        .kb-brushable {
            cursor: ew-resize;
        }

        .kb-brush {
            position: absolute;
            top: -1px;
            bottom: -1px;
            background: rgba(239, 159, 39, 0.16);
            border-left: 1px solid rgba(239, 159, 39, 0.7);
            border-right: 1px solid rgba(239, 159, 39, 0.7);
            pointer-events: none;
            z-index: 1;
        }

        .kb-brushnote {
            font-size: 11px;
            color: #f0b866;
            margin-top: 8px;
        }

        .kb-brushnote code {
            font-family: var(--field-mono-font, ui-monospace, monospace);
        }

        .kb-brushnote a {
            color: #8f949f;
            margin-left: 6px;
        }

        .kb-variant {
            cursor: pointer;
        }

        /* Two classes deep on purpose: this block sits above `.kb-variant`, whose `border`
           shorthand would otherwise win the tie on source order and swallow the accent. */
        .kb-variant.kb-variant-sel {
            border-color: #EF9F27;
            background: rgba(239, 159, 39, 0.14);
            color: #f3ce96;
        }

        .kb-key-stamp {
            font-size: 10px;
            margin-bottom: 6px;
        }

        .kb-strip-label {
            position: absolute;
            left: 4px;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            font-size: 9px;
            color: #6e737e;
            font-family: var(--field-mono-font, ui-monospace, monospace);
            pointer-events: none;
        }

        /* Two columns — a plot over the two bands that made it — then |v| across the bottom. */
        .kb-quad {
            display: flex;
            gap: 6px;
            margin-bottom: 2px;
        }

        .kb-quad-col {
            display: block;
            flex: 1;
            min-width: 0;
        }

        .kb-quad-col .kb-strip {
            margin-top: 2px;
        }

        .kb-plot {
            display: block;
            position: relative;
            flex: 1;
            min-width: 0;
            height: 38px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 2px;
        }

        /* Dots are positioned in HTML rather than drawn in SVG. An SVG scatter that fills a
           responsive width needs preserveAspectRatio="none", which scales x and y differently and
           turns every circle into an ellipse — measured at ~1.9x horizontally in the slot table. */
        .kb-pt {
            position: absolute;
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.45);
            cursor: pointer;
        }

        .kb-pt-sel {
            width: 9px;
            height: 9px;
            margin: -4.5px 0 0 -4.5px;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
            z-index: 2;
        }

        .kb-axis {
            position: absolute;
            font-size: 8px;
            color: #63676f;
            font-family: var(--field-mono-font, ui-monospace, monospace);
            pointer-events: none;
        }

        .kb-axis {
            left: 3px;
            top: 0;
        }

        .kb-variants {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .kb-variant {
            font-size: 10px;
            font-family: var(--field-mono-font, ui-monospace, monospace);
            padding: 1px 6px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #a9aeb9;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* The most common variant is named by its own count, so it gets no border of its own:
           the border means "selected" and nothing else, or the two read as the same thing. */
        .kb-variant.kb-top {
            color: #cfd4de;
        }

        .kb-scatter {
            display: block;
            position: relative;
            height: 34px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 2px;
        }

        .kb-scatter-path {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .kb-note {
            font-size: 11px;
            color: #7e838f;
        }

        .kb-note.kb-warn {
            color: #f0b866;
        }

        /* --- detail + result panels --- */
        .kb-panel {
            grid-column: 1 / -1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.045);
            padding: 4px 0 10px;
        }

        .kb-detail-head {
            font-size: 11px;
            color: #9aa0ac;
            margin: 4px 0 6px;
        }

        .kb-detail-sub {
            margin-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding-top: 8px;
        }

        .kb-values {
            border-collapse: collapse;
            width: 100%;
            font-size: 11px;
        }

        .kb-values th {
            text-align: left;
            font-weight: 400;
            color: #7e838f;
            font-family: var(--field-mono-font, ui-monospace, monospace);
            vertical-align: top;
            padding: 3px 10px 3px 0;
            white-space: nowrap;
            width: 1%;
        }

        .kb-values td {
            vertical-align: top;
            padding: 3px 0;
        }

        .kb-missing {
            color: #6e737e;
            font-style: italic;
        }

        .kb-src {
            margin: 2px 0;
            padding: 4px 6px;
            border-left: 2px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.04);
            white-space: pre-wrap;
            font-size: 11px;
            color: #cdd2dc;
        }

        .kb-history {
            margin: 6px 0;
        }

        .kb-history-name {
            font-size: 10px;
            color: #7e838f;
            font-family: var(--field-mono-font, ui-monospace, monospace);
        }

        .kb-history-rail {
            display: flex;
            gap: 2px;
            align-items: stretch;
            height: 14px;
            margin: 2px 0;
        }

        .kb-tick {
            width: 7px;
            background: rgba(102, 204, 255, 0.5);
            border-radius: 1px;
            cursor: help;
        }

        .kb-tick:hover {
            background: #6cf;
        }

        .kb-tick-absent {
            background: rgba(255, 255, 255, 0.08);
        }

        .kb-history-range {
            font-size: 10px;
        }

        .kb-out {
            margin-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.09);
            padding-top: 10px;
        }

        .kb-code {
            margin: 4px 0 0;
            padding: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            white-space: pre;
            overflow-x: auto;
            font-size: 11px;
            color: #cdd2dc;
        }

        .kb-status {
            font-size: 11px;
            color: #7e838f;
            padding: 8px 0;
        }

        .kb-status.kb-bad {
            color: #f0a3a2;
        }

        .kb-empty {
            max-width: 560px;
            color: #9aa0ac;
        }

        .kb-empty-head {
            font-size: 13px;
            color: #eef1f8;
            margin-bottom: 8px;
        }

        .kb-empty p {
            margin: 8px 0;
        }

        .kb-empty code {
            font-family: var(--field-mono-font, ui-monospace, monospace);
            color: #cdd2dc;
        }

        /* Let the value cards from `.h` sit in a table cell without their app-level margins. */
        .kb-values .field-md {
            margin: 0;
        }
    </style>
</head>
<body>
<div id="kb">
    <div class="kb-status" id="status">connecting…</div>
</div>

<script src="/iframe_autosize.js"></script>
<script>
    const ROOT_TOKEN = new URLSearchParams(location.search).get('root');
    const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
    const CHANNEL = "__keyframe_browser__";

    const kbEl = document.getElementById('kb');

    let ws = null;
    let reqSeq = 1;
    const pending = new Map();

    let collection = null;
    const selected = new Set();   // file ids, for diff / apply / code
    let openSlot = null;          // slot name whose detail panel is showing
    let outPanel = null;          // { title, html } or { title, text }
    let brush = null;             // { slot, band, a, b, label, range, hits, total }
    let suppressRowClick = false; // a drag that ended on a row must not also expand it

    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
            { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
        ));
    }

    function sendReq(op, payload = {}) {
        const reqId = String(reqSeq++);
        return new Promise((resolve, reject) => {
            if (!ws || ws.readyState !== 1) {
                reject(new Error("socket not connected"));
                return;
            }
            pending.set(reqId, { resolve, reject });
            ws.send(JSON.stringify({ channel: CHANNEL, reqId, op, root: ROOT_TOKEN, ...payload }));
        });
    }

    function status(text, bad) {
        kbEl.innerHTML = `<div class="kb-status${bad ? ' kb-bad' : ''}">${esc(text)}</div>`;
    }

    /**
     * What you see having typed this URL rather than arriving from a box. Not an error: there is no
     * query string that would have worked, because the token is minted per call and carries a live
     * reference to the KeyframeScope that Apply writes through. So this says what to run instead.
     */
    function noToken() {
        kbEl.innerHTML = `
            <div class="kb-empty">
              <div class="kb-empty-head">Keyframe browser</div>
              <p>This page is opened from a box, not by its URL. Run one of these and it will appear
                 in that box's output area:</p>
              <pre class="kb-code">keyframeBrowser("looks")

// with the live scope, which adds Apply and shows
// slots the scope watches that no key file holds
keyframeBrowser("looks", scope = myScope)</pre>
              <p><code>?root=</code> is a token minted by that call. It records which directory and
                 glob you are browsing, and holds a weak reference to the scope — so it is not a path
                 you could type here, and there is no URL that reaches a collection without it.</p>
            </div>`;
    }

    // ---------------------------------------------------------------- strips

    /**
     * A file id's position among a display's marks, or -1. Every display ships a `fileIds` array
     * parallel to its marks/colors/points, so "is this datapoint the selected key" is an index
     * lookup rather than anything the server has to be asked again.
     */
    function selIndices(fileIds) {
        const out = new Set();
        if (!fileIds) return out;
        fileIds.forEach((id, i) => { if (selected.has(id)) out.add(i); });
        return out;
    }

    function fileName(id) {
        const f = collection && collection.files.find((x) => x.id === id);
        return f ? f.relative : "";
    }

    function bandValueAt(band, fraction) {
        return band.lo + fraction * (band.hi - band.lo);
    }

    function stripHtml(band, fileIds, showLabel, slotName, bandIndex) {
        const sel = selIndices(fileIds);
        // Selected marks are emitted last so they paint over an unselected mark sitting at the same
        // value — two keys agreeing on a number is common, and the highlight has to win that overlap.
        const order = band.marks.map((m, i) => i).sort((a, b) => (sel.has(a) ? 1 : 0) - (sel.has(b) ? 1 : 0));
        const marks = order.map((i) => {
            const m = band.marks[i];
            const id = fileIds ? fileIds[i] : null;
            const on = sel.has(i);
            const title = `${fileName(id)}\n${band.label} = ${fmt(bandValueAt(band, m))}`;
            return `<span class="kb-mark${on ? " kb-mark-sel" : ""}" data-file="${id}"` +
                ` style="left:${(m * 100).toFixed(2)}%" title="${esc(title)}"></span>`;
        }).join("");
        const degenerate = band.lo === band.hi;
        const fill = degenerate ? "" : `<span class="kb-strip-fill"></span>`;
        const label = showLabel ? `<span class="kb-strip-label">${esc(band.label)}</span>` : "";
        // The brush overlay for this band, when the current brush is on it.
        let brushEl = "";
        if (brush && brush.slot === slotName && brush.band === bandIndex) {
            const l = Math.min(brush.a, brush.b), w = Math.abs(brush.b - brush.a);
            brushEl = `<span class="kb-brush" style="left:${(l * 100).toFixed(2)}%;width:${(w * 100).toFixed(2)}%"></span>`;
        }
        const brushable = !degenerate && fileIds && fileIds.length > 1;
        return `<span class="kb-strip${brushable ? " kb-brushable" : ""}"` +
            ` data-slot="${esc(slotName)}" data-band="${bandIndex}">${fill}${label}${brushEl}${marks}</span>`;
    }

    function fmt(v) {
        if (!isFinite(v)) return String(v);
        if (v === Math.round(v) && Math.abs(v) < 1e6) return String(Math.round(v));
        return Number(v.toPrecision(4)).toString();
    }

    function scatterHtml(points, fileIds) {
        // Plan view; y is flipped so +z reads as "away" going up, the way a top-down sketch does.
        // The travel line stays in a stretched SVG underneath — a line is still the right line in a
        // stretched space — while the dots are positioned in HTML so they stay round at any width.
        const sel = selIndices(fileIds);
        const path = points.length > 1
            ? `<svg class="kb-scatter-path" viewBox="0 0 100 100" preserveAspectRatio="none">` +
              `<polyline points="${points.map((p) => `${(6 + p[0] * 88).toFixed(1)},${(88 - p[1] * 76).toFixed(1)}`).join(" ")}"` +
              ` fill="none" stroke="#7F77DD" stroke-width="0.7" opacity="0.55" vector-effect="non-scaling-stroke"/></svg>`
            : "";
        const order = points.map((p, i) => i).sort((a, b) => (sel.has(a) ? 1 : 0) - (sel.has(b) ? 1 : 0));
        const dots = order.map((i) => {
            const p = points[i];
            const id = fileIds[i];
            const on = sel.has(i);
            return `<span class="kb-pt${on ? " kb-pt-sel" : ""}" data-file="${id}" title="${esc(fileName(id))}"` +
                ` style="left:${(6 + p[0] * 88).toFixed(2)}%;top:${(88 - p[1] * 76).toFixed(2)}%;` +
                `background:${on ? "#EF9F27" : "#7F77DD"}"></span>`;
        }).join("");
        return `<span class="kb-scatter">${path}${dots}</span>`;
    }

    function scatter2d(points, fileIds, ax, ay, colors, bands, compIdx) {
        const sel = selIndices(fileIds);
        const order = points.map((p, i) => i).sort((a, b) => (sel.has(a) ? 1 : 0) - (sel.has(b) ? 1 : 0));
        const dots = order.map((i) => {
            const p = points[i];
            const id = fileIds[i];
            const on = sel.has(i);
            const bx = bands[compIdx[0]], by = bands[compIdx[1]];
            const tip = `${fileName(id)}\n${ax} = ${fmt(bandValueAt(bx, bx.marks[i]))}` +
                `\n${ay} = ${fmt(bandValueAt(by, by.marks[i]))}`;
            const fill = on ? "#EF9F27" : (colors ? colors[i] : "#7F77DD");
            return `<span class="kb-pt${on ? " kb-pt-sel" : ""}" data-file="${id}" title="${esc(tip)}"` +
                ` style="left:${(6 + p[0] * 88).toFixed(2)}%;top:${(88 - p[1] * 76).toFixed(2)}%;background:${esc(fill)}"></span>`;
        }).join("");
        // One label per plot rather than a letter in each of two corners: a component that barely
        // varies bunches every dot against one edge, and whichever corner the letter sat in would be
        // the one covered. The tooltip names each axis with its value, so the label only has to say
        // which pair this is.
        return `<span class="kb-plot"><span class="kb-axis">${esc(ax)}·${esc(ay)}</span>${dots}</span>`;
    }

    function displayHtml(slot) {
        const d = slot.display;
        switch (d.type) {
            case "range":
                return stripHtml(d.band, d.fileIds, false, slot.name, 0);
            case "components":
                return d.bands.map((b, i) => stripHtml(b, d.fileIds, true, slot.name, i)).join("");
            case "vec4plot": {
                // Two columns, each a plot over the two bands it is made of, then |v| across the
                // bottom. The pairing is only a suggestion — a vec4 is very often four unrelated
                // things packed for a shader — so every component gets its own brushable band and
                // sits directly under the plot that used it. Band indices are 0..3 for x/y/z/w and
                // 4 for the magnitude; `bandOf` reads them back the same way.
                const col = (pts, ax, ay, ci) =>
                    `<span class="kb-quad-col">` +
                    scatter2d(pts, d.fileIds, ax, ay, d.colors, d.bands, ci) +
                    stripHtml(d.bands[ci[0]], d.fileIds, true, slot.name, ci[0]) +
                    stripHtml(d.bands[ci[1]], d.fileIds, true, slot.name, ci[1]) +
                    `</span>`;
                return `<span class="kb-quad">` +
                    col(d.xy, "x", "y", [0, 1]) +
                    col(d.zw, "z", "w", [2, 3]) +
                    `</span>` +
                    stripHtml(d.length, d.fileIds, true, slot.name, 4);
            }
            case "poses":
                return scatterHtml(d.points, d.fileIds);
            case "variants":
                // A variant is already a dedup: `variantsOf` groups by value text and counts. Clicking
                // one selects every key that holds it, which is the categorical answer to brushing.
                return `<span class="kb-variants">` + d.variants.map((v, i) => {
                    const on = v.fileIds.some((id) => selected.has(id));
                    return `<span class="kb-variant${i === 0 ? " kb-top" : ""}${on ? " kb-variant-sel" : ""}"` +
                        ` data-files="${v.fileIds.join(",")}" title="${esc(v.text)}">` +
                        `${esc(v.preview || "(empty)")} ×${v.count}</span>`;
                }).join("") + `</span>`;
            case "note":
                return `<span class="kb-note${d.severity === "warn" ? " kb-warn" : ""}">${esc(d.text)}</span>`;
            default:
                return "";
        }
    }

    // ---------------------------------------------------------------- selection

    /**
     * Selection is an arbitrary set, not a max-of-two. A plain click means "just this one", a
     * shift-click adds or removes, and a brush replaces the whole set with whatever fell inside it.
     *
     * The panel below follows from the *size*: one key shows its contents, two show a diff (which
     * already puts both sides' values on screen, so it subsumes the contents view), and more than
     * two show neither — but every datapoint in every row stays highlighted, which is the point of
     * a wide selection.
     */
    function selectOnly(ids) {
        selected.clear();
        ids.forEach((id) => selected.add(id));
        afterSelectionChange();
    }

    function selectToggle(ids) {
        const allOn = ids.every((id) => selected.has(id));
        ids.forEach((id) => { if (allOn) selected.delete(id); else selected.add(id); });
        afterSelectionChange();
    }

    function afterSelectionChange() {
        outPanel = null;
        render();
        refreshSelectionPanel();
    }

    /** Fetch whatever panel the current selection size calls for. */
    async function refreshSelectionPanel() {
        const ids = [...selected];
        try {
            if (ids.length === 1) {
                const res = await sendReq("key", { fileId: ids[0] });
                if (sameSelection(ids)) outPanel = { title: res.title, html: res.html };
            } else if (ids.length === 2) {
                const res = await sendReq("diff", { fileId: ids[0], otherId: ids[1] });
                if (sameSelection(ids)) outPanel = { title: res.title, html: res.html };
            } else {
                return;
            }
        } catch (e) {
            if (sameSelection(ids)) outPanel = { title: "failed", text: String(e.message || e) };
        }
        render();
    }

    /** Guards against a slow reply landing after the selection has moved on. */
    function sameSelection(ids) {
        return ids.length === selected.size && ids.every((id) => selected.has(id));
    }

    function bandOf(slotName, index) {
        const slot = collection && collection.slots.find((s) => s.name === slotName);
        if (!slot) return null;
        const d = slot.display;
        if (d.type === "range") return { band: d.band, fileIds: d.fileIds };
        if (d.type === "components") return { band: d.bands[index], fileIds: d.fileIds };
        // 0..3 are x/y/z/w, 4 is |v|. The plots themselves are not brushable: a 1D drag cannot
        // express a region of a 2D scatter, and the component bands underneath cover the cases a
        // box brush would — including the common one where the four numbers are unrelated.
        if (d.type === "vec4plot") {
            return { band: index === 4 ? d.length : d.bands[index], fileIds: d.fileIds };
        }
        return null;
    }

    // ---------------------------------------------------------------- render

    function render() {
        if (!collection) return;
        const c = collection;
        const parts = [];

        parts.push(`<div class="kb-head">`);
        parts.push(`<span class="kb-title">${esc(c.pattern)}</span>`);
        parts.push(`<span class="kb-dim">${c.fileCount} keys · ${c.versionCount} versions · ${c.slotCount} slots</span>`);
        if (c.schemaVersions.length > 1) {
            parts.push(`<span class="kb-badge kb-warn">schema ${c.schemaVersions.join(", ")}</span>`);
        } else if (c.schemaVersions.length === 1) {
            parts.push(`<span class="kb-badge">schema ${c.schemaVersions[0]}</span>`);
        }
        if (!c.hasScope) {
            parts.push(`<span class="kb-badge">read-only — no scope</span>`);
        }
        parts.push(`</div>`);

        const stamp = [c.latestAgo ? `last save ${c.latestAgo}` : null,
            c.latestNote ? `"${c.latestNote}"` : null].filter(Boolean).join(" · ");
        parts.push(`<div class="kb-sub" title="${esc(c.latestTimestamp || "")}">` +
            `${esc(c.root)}${stamp ? " · " + esc(stamp) : ""}</div>`);

        if (c.problems.length) {
            parts.push(`<div class="kb-problems">` + c.problems.map(esc).join("<br>") + `</div>`);
        }

        if (!c.fileCount) {
            parts.push(`<div class="kb-status">No key files matched. Save one with <code>scope.saveKey(path, key)</code>.</div>`);
            kbEl.innerHTML = parts.join("");
            return;
        }

        parts.push(`<div class="kb-files">`);
        c.files.forEach((f) => {
            const on = selected.has(f.id);
            const title = [f.relative, `schema ${f.schemaVersion}`, `${f.slotCount} slots`,
                `${f.versions} saves`, f.ago, f.timestamp, f.note].filter(Boolean).join("\n");
            parts.push(
                `<span class="kb-chip${on ? " kb-on" : ""}" data-file="${f.id}" title="${esc(title)}">` +
                `<span class="kb-chip-n">${f.id + 1}</span>${esc(f.relative)}</span>`
            );
        });
        parts.push(`</div>`);

        const n = selected.size;
        parts.push(`<div class="kb-actions">`);
        parts.push(`<button class="kb-btn" id="kb-apply" ${n === 1 && c.hasScope ? "" : "disabled"}>Apply</button>`);
        parts.push(`<button class="kb-btn" id="kb-code" ${n === 1 ? "" : "disabled"}>Copy updateCode</button>`);
        parts.push(`<button class="kb-btn" id="kb-clear" ${n ? "" : "disabled"}>Clear</button>`);
        parts.push(`<button class="kb-btn" id="kb-reload">Reload</button>`);
        parts.push(`<span class="kb-dim">${selectionHint(n)}</span>`);
        parts.push(`</div>`);

        parts.push(`<div class="kb-grid">`);
        parts.push(`<span class="kb-hdr">slot</span><span class="kb-hdr">type</span><span class="kb-hdr">in</span>`);
        parts.push(`<span class="kb-hdr">range across keys</span><span class="kb-hdr kb-spread">spread</span>`);

        c.slots.forEach((slot) => {
            const isOpen = openSlot === slot.name;
            const nameCls = slot.kind === "absent" && slot.inScope ? " kb-scope-only"
                : slot.kind === "mixed" ? " kb-mixed" : "";
            const countCls = slot.presentIn === 0 ? " kb-none"
                : slot.presentIn < slot.total ? " kb-partial" : "";
            parts.push(`<div class="kb-row${isOpen ? " kb-open" : ""}" data-slot="${esc(slot.name)}">`);
            parts.push(`<span class="kb-name${nameCls}" title="${esc(slot.name)}">${esc(slot.name)}</span>`);
            parts.push(`<span class="kb-type">${esc(slot.typeLabel)}</span>`);
            parts.push(`<span class="kb-count${countCls}">${slot.presentIn}/${slot.total}</span>`);
            parts.push(`<span>${displayHtml(slot)}</span>`);
            parts.push(`<span class="kb-spread">${esc(slot.summaryText)}</span>`);
            parts.push(`</div>`);
            if (isOpen && slot.detailHtml) {
                parts.push(`<div class="kb-panel">${slot.detailHtml}</div>`);
            } else if (isOpen) {
                parts.push(`<div class="kb-panel"><div class="kb-status">loading…</div></div>`);
            }
        });
        parts.push(`</div>`);

        if (brush) {
            parts.push(`<div class="kb-brushnote">brushed <code>${esc(brush.slot)}</code>` +
                ` ${esc(brush.label)} — ${esc(brush.range)} · ${brush.hits} of ${brush.total} keys` +
                ` <a href="#" id="kb-unbrush">clear brush</a></div>`);
        }

        if (outPanel) {
            parts.push(`<div class="kb-out">`);
            parts.push(`<div class="kb-detail-head">${esc(outPanel.title)}`);
            if (outPanel.copied) parts.push(` <span class="kb-dim">— copied to clipboard</span>`);
            parts.push(`</div>`);
            parts.push(outPanel.html ? outPanel.html : `<pre class="kb-code">${esc(outPanel.text)}</pre>`);
            parts.push(`</div>`);
        } else if (selected.size > 2) {
            parts.push(`<div class="kb-out"><div class="kb-status">` +
                `${selected.size} keys selected — their values are highlighted in every row above. ` +
                `Narrow to one for its contents, two for a diff.</div></div>`);
        }

        kbEl.innerHTML = parts.join("");
        wire();
    }

    function selectionHint(n) {
        if (n === 0) return "click a key for its contents · shift-click a second for a diff · drag across a range to brush";
        if (n === 1) return "1 selected — shift-click another for a diff";
        if (n === 2) return "2 selected — diff below";
        return `${n} selected`;
    }

    function wire() {
        kbEl.querySelectorAll(".kb-chip").forEach((el) => {
            el.addEventListener("click", (ev) => {
                const id = Number(el.dataset.file);
                brush = null;
                if (ev.shiftKey) selectToggle([id]);
                else if (selected.size === 1 && selected.has(id)) selectOnly([]);
                else selectOnly([id]);
            });
        });

        // A datapoint inside a row is a handle on the key that produced it.
        kbEl.querySelectorAll(".kb-pt").forEach((el) => {
            el.addEventListener("click", (ev) => {
                ev.stopPropagation();
                const id = Number(el.dataset.file);
                brush = null;
                if (ev.shiftKey) selectToggle([id]); else selectOnly([id]);
            });
        });

        kbEl.querySelectorAll(".kb-variant").forEach((el) => {
            el.addEventListener("click", (ev) => {
                ev.stopPropagation();
                const ids = String(el.dataset.files || "").split(",").filter(Boolean).map(Number);
                brush = null;
                if (ev.shiftKey) selectToggle(ids); else selectOnly(ids);
            });
        });

        kbEl.querySelectorAll(".kb-brushable").forEach((el) => wireBrush(el));

        kbEl.querySelectorAll(".kb-row").forEach((el) => {
            el.addEventListener("click", async (ev) => {
                // A drag that started on a strip must not also be read as "expand this slot".
                if (suppressRowClick) { suppressRowClick = false; return; }
                if (ev.target.closest(".kb-strip, .kb-plot, .kb-variant, .kb-scatter")) return;
                const name = el.dataset.slot;
                if (openSlot === name) { openSlot = null; render(); return; }
                openSlot = name;
                render();
                const slot = collection.slots.find((s) => s.name === name);
                if (slot && !slot.detailHtml) {
                    try {
                        const res = await sendReq("slot", { slot: name });
                        slot.detailHtml = res.html;
                    } catch (e) {
                        slot.detailHtml = `<div class="kb-status kb-bad">${esc(e.message || e)}</div>`;
                    }
                    if (openSlot === name) render();
                }
            });
        });

        const on = (id, fn) => {
            const el = document.getElementById(id);
            if (el) el.addEventListener("click", fn);
        };

        on("kb-reload", () => { void open(); });
        on("kb-clear", () => { brush = null; selectOnly([]); });
        on("kb-unbrush", (ev) => { ev.preventDefault(); brush = null; selectOnly([]); });

        on("kb-apply", async () => {
            const [a] = [...selected];
            try {
                const res = await sendReq("apply", { fileId: a });
                outPanel = { title: res.title, text: res.text };
            } catch (e) {
                outPanel = { title: "apply failed", text: String(e.message || e) };
            }
            render();
        });

        on("kb-code", async () => {
            const [a] = [...selected];
            try {
                const res = await sendReq("code", { fileId: a });
                let copied = false;
                try { await navigator.clipboard.writeText(res.text); copied = true; } catch {
                    // Clipboard access can be refused in an iframe; the code is on screen either way.
                }
                outPanel = { title: res.title, text: res.text, copied };
            } catch (e) {
                outPanel = { title: "updateCode failed", text: String(e.message || e) };
            }
            render();
        });
    }

    /**
     * Drag across a numeric strip to keep only the keys whose value falls inside.
     *
     * The comparison happens in the strip's own 0..1 space, because that is what `band.marks`
     * already is — so brushing needs no unit conversion and no second request. The value range in
     * the note is the inverse map back through `lo..hi`, purely for the label.
     */
    function wireBrush(el) {
        const slotName = el.dataset.slot;
        const bandIndex = Number(el.dataset.band);
        let startX = null;
        let overlay = null;

        const fractionOf = (clientX) => {
            const r = el.getBoundingClientRect();
            return Math.min(1, Math.max(0, (clientX - r.left) / r.width));
        };

        el.addEventListener("mousedown", (ev) => {
            if (ev.button !== 0) return;
            ev.preventDefault();
            ev.stopPropagation();
            startX = fractionOf(ev.clientX);
            overlay = document.createElement("span");
            overlay.className = "kb-brush";
            el.appendChild(overlay);

            const move = (e2) => {
                const f = fractionOf(e2.clientX);
                const l = Math.min(startX, f), w = Math.abs(f - startX);
                overlay.style.left = (l * 100).toFixed(2) + "%";
                overlay.style.width = (w * 100).toFixed(2) + "%";
            };
            const up = (e2) => {
                window.removeEventListener("mousemove", move);
                window.removeEventListener("mouseup", up);
                const f = fractionOf(e2.clientX);
                const a = Math.min(startX, f), b = Math.max(startX, f);
                suppressRowClick = true;
                // A click rather than a drag: too narrow to mean an interval, so treat it as "clear".
                if (b - a < 0.01) { brush = null; selectOnly([]); return; }
                applyBrush(slotName, bandIndex, a, b);
            };
            window.addEventListener("mousemove", move);
            window.addEventListener("mouseup", up);
        });
    }

    function applyBrush(slotName, bandIndex, a, b) {
        const found = bandOf(slotName, bandIndex);
        if (!found) {
            // Reachable only if a display grows a strip without teaching bandOf about it, which is
            // exactly the bug the vec4 magnitude band shipped with. Say so rather than no-op.
            console.warn("[keyframe-browser] no brushable band for", slotName, bandIndex);
            return;
        }
        const { band, fileIds } = found;
        const hits = [];
        band.marks.forEach((m, i) => { if (m >= a && m <= b) hits.push(fileIds[i]); });
        brush = {
            slot: slotName, band: bandIndex, a, b, label: band.label,
            range: `${fmt(bandValueAt(band, a))} – ${fmt(bandValueAt(band, b))}`,
            hits: hits.length, total: fileIds.length
        };
        selectOnly(hits);
    }

    async function open() {
        const res = await sendReq("open");
        collection = res;
        // Drop selections and open panels that no longer name anything, so a Reload after a save
        // does not leave the buttons acting on a file that has gone.
        [...selected].forEach((id) => { if (!collection.files.some((f) => f.id === id)) selected.delete(id); });
        if (openSlot && !collection.slots.some((s) => s.name === openSlot)) openSlot = null;
        brush = null;
        outPanel = null;
        render();
    }

    function connect() {
        if (!ROOT_TOKEN) {
            // The page opened with no `?root=`, which is what you get from typing the URL. Say what
            // the token is for rather than only that it is missing: it is not a path you could have
            // guessed and typed, it is a registration that also carries the weak scope reference
            // Apply needs, so there is no URL that would have worked here.
            noToken();
            return;
        }
        ws = new WebSocket(WS_URL);
        ws.onopen = async () => {
            try {
                await open();
            } catch (e) {
                status(`failed: ${e.message || e}`, true);
            }
        };
        ws.onmessage = (ev) => {
            let msg;
            try { msg = JSON.parse(ev.data); } catch { return; }
            if (!msg || !msg.reqId) return;
            const p = pending.get(String(msg.reqId));
            if (!p) return;
            pending.delete(String(msg.reqId));
            if (msg.ok === false) p.reject(new Error(msg.error || "request failed"));
            else p.resolve(msg);
        };
        ws.onclose = () => {
            pending.forEach((p) => p.reject(new Error("socket closed")));
            pending.clear();
            if (!collection) status("disconnected — retrying", true);
            setTimeout(connect, 1500);
        };
        ws.onerror = () => { if (!collection) status("socket error", true); };
    }

    connect();
</script>
</body>
</html>
