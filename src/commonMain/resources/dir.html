<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Field·4 Workspace Search</title>
    <link rel="preload" href="/woff2/iosevka-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/iosevka.css" as="style">
    <link rel="stylesheet" href="/iosevka.css">
    <style>
        :root {
            --field-bg: rgba(20, 20, 20, 1);
            --field-panel: rgba(0, 0, 0, 0.32);
            --field-border: rgba(72, 201, 255, 0.18);
            --field-border-strong: rgba(72, 201, 255, 0.45);
            --field-cyan: rgb(72, 201, 255);
            --field-text: rgba(220, 235, 244, 0.95);
            --field-text-soft: rgba(164, 193, 210, 0.95);
            --field-danger: #ff6f6f;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--field-bg);
            color: var(--field-text);
            font-family: "Iosevka Web", system-ui, sans-serif;
            font-weight: 300;
        }

        body {
            padding: 16px;
        }

        a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px dashed rgba(180, 220, 245, 0.42);
        }

        .page {
            width: min(1100px, 96vw);
            margin: 0 auto;
            display: grid;
            gap: 12px;
        }

        .panel {
            border: 5px solid black;
            background: #222;
            padding: 12px;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
        }

        .hero-title {
            font-size: 20px;
            color: var(--field-cyan);
        }

        .hero-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .hero-links a {
            padding: 8px 10px;
            border: 1px solid var(--field-border);
            border-bottom-style: solid;
        }

        .search-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
        }

        #searchBox {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: var(--field-cyan);
            border: 1px solid rgba(72, 201, 255, 0.35);
            padding: 10px;
            font: inherit;
        }

        #searchBox:focus {
            outline: none;
            border-color: var(--field-cyan);
        }

        #status {
            color: var(--field-text-soft);
            font-size: 12px;
            white-space: nowrap;
        }

        #status.error {
            color: var(--field-danger);
        }

        #results {
            display: grid;
            gap: 8px;
        }

        .doc-entry {
            border-bottom: 1px solid black;
            padding: 6px 2px 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: start;
        }

        .doc-entry:hover .doc-name {
            color: white;
        }

        .doc-name {
            font-size: 14px;
        }

        .doc-meta {
            font-size: 10px;
            color: var(--field-text-soft);
            text-align: right;
            white-space: nowrap;
        }

        .doc-body {
            display: grid;
            gap: 6px;
        }

        .match-list {
            display: grid;
            gap: 4px;
        }

        .match {
            border-left: 1px solid rgba(72, 201, 255, 0.16);
            padding-left: 8px;
        }

        .match-meta {
            font-size: 10px;
            color: var(--field-text-soft);
            text-transform: lowercase;
        }

        .match-snippet {
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        mark {
            background: rgba(72, 201, 255, 0.18);
            color: white;
            padding: 0 2px;
        }

        .empty-state {
            padding: 16px;
            color: var(--field-text-soft);
            border: 1px dashed rgba(72, 201, 255, 0.35);
        }

        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .search-row {
                grid-template-columns: 1fr;
            }

            .doc-entry {
                grid-template-columns: 1fr;
            }

            .doc-meta {
                text-align: left;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <section class="panel hero">
        <div class="hero-title">Workspace Search</div>
        <div class="hero-links">
            <a href="/welcome">/welcome</a>
            <a href="/index.html?file=welcome">open `welcome`</a>
        </div>
    </section>

    <section class="panel">
        <div class="search-row">
            <input id="searchBox" type="text" autocomplete="off" autofocus placeholder="search workspace text or document name">
            <div id="status" aria-live="polite"></div>
        </div>
    </section>

    <section class="panel">
        <div id="results"></div>
    </section>
</main>

<script>
    const state = {
        welcomeDocs: [],
        searchResults: [],
        query: "",
        truncated: false
    };
    let searchController = null;
    let searchTimer = null;

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function escapeRegExp(text) {
        return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightQuery(text, query) {
        if (!query) return escapeHtml(text);
        const safe = escapeHtml(text);
        return safe.replace(new RegExp(`(${escapeRegExp(query)})`, "ig"), "<mark>$1</mark>");
    }

    function formatDuration(ms) {
        const abs = Math.max(0, Math.floor(ms));
        if (abs < 1000) return "just now";
        const minutes = Math.floor(abs / 60000);
        if (minutes < 1) return `${Math.floor(abs / 1000)}s ago`;
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ago`;
        const days = Math.floor(hours / 24);
        if (days < 7) return `${days}d ago`;
        const weeks = Math.floor(days / 7);
        if (weeks < 6) return `${weeks}wk ago`;
        const months = Math.floor(days / 30);
        if (months < 24) return `${months}mo ago`;
        const years = Math.floor(days / 365);
        return `${years}y ago`;
    }

    function renderRecentDocuments() {
        const resultsNode = document.getElementById("results");
        const statusNode = document.getElementById("status");
        const docs = state.welcomeDocs;

        if (!docs.length) {
            resultsNode.innerHTML = `
                <div class="empty-state">
                    No documents found in this workspace.
                </div>
            `;
            statusNode.textContent = "";
            statusNode.classList.remove("error");
            return;
        }

        resultsNode.innerHTML = docs.map((doc) => {
            const boxes = doc.numBoxes === 1 ? "1 box" : `${doc.numBoxes} boxes`;
            const meta = `${boxes} · ${formatDuration(doc.lastModifiedAgoMs)}`;
            return `
                <div class="doc-entry">
                    <div class="doc-body">
                        <a class="doc-name" href="/index.html?file=${encodeURIComponent(doc.filename)}">${escapeHtml(doc.filename)}</a>
                    </div>
                    <div class="doc-meta">${escapeHtml(meta)}</div>
                </div>
            `;
        }).join("");

        statusNode.textContent = `${docs.length} documents`;
        statusNode.classList.remove("error");
    }

    function renderSearchResults() {
        const resultsNode = document.getElementById("results");
        const statusNode = document.getElementById("status");
        const docs = state.searchResults;
        const query = state.query.trim();

        if (!docs.length) {
            resultsNode.innerHTML = `
                <div class="empty-state">
                    No workspace matches for <code>${escapeHtml(query)}</code>.
                </div>
            `;
            statusNode.textContent = "no matches";
            statusNode.classList.remove("error");
            return;
        }

        resultsNode.innerHTML = docs.map((doc) => {
            const boxes = doc.numBoxes === 1 ? "1 box" : `${doc.numBoxes} boxes`;
            const meta = `${boxes} · ${formatDuration(doc.lastModifiedAgoMs)}`;
            const matches = (doc.matches || []).map((match) => {
                const property = match.property === "document" ? "document name" : match.property;
                const linePart = match.line > 0 ? ` line ${match.line}` : "";
                return `
                    <div class="match">
                        <div class="match-meta">${escapeHtml(match.boxName || "(unnamed box)")} · ${escapeHtml(property)}${escapeHtml(linePart)}</div>
                        <div class="match-snippet">${highlightQuery(match.snippet || "", query)}</div>
                    </div>
                `;
            }).join("");

            return `
                <div class="doc-entry">
                    <div class="doc-body">
                        <a class="doc-name" href="/index.html?file=${encodeURIComponent(doc.filename)}">${highlightQuery(doc.filename, query)}</a>
                        <div class="match-list">${matches}</div>
                    </div>
                    <div class="doc-meta">${escapeHtml(meta)}</div>
                </div>
            `;
        }).join("");

        const matchCount = docs.reduce((sum, doc) => sum + ((doc.matches || []).length), 0);
        statusNode.textContent = state.truncated ? `${matchCount}+ matches shown` : `${matchCount} matches`;
        statusNode.classList.remove("error");
    }

    function render() {
        if (state.query.trim()) {
            renderSearchResults();
        } else {
            renderRecentDocuments();
        }
    }

    async function loadRecentDocuments() {
        try {
            const response = await fetch("/api/welcome-docs", { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const payload = await response.json();
            state.welcomeDocs = Array.isArray(payload.documents) ? payload.documents : [];
            render();
        } catch (error) {
            console.error("Failed to load workspace documents", error);
            const statusNode = document.getElementById("status");
            statusNode.textContent = "could not load documents";
            statusNode.classList.add("error");
        }
    }

    async function runSearch(query) {
        if (searchController) searchController.abort();
        searchController = new AbortController();

        const statusNode = document.getElementById("status");
        statusNode.textContent = "searching…";
        statusNode.classList.remove("error");

        try {
            const params = new URLSearchParams({
                q: query,
                maxDocuments: "75",
                maxMatchesPerDocument: "5"
            });
            const response = await fetch(`/api/workspace-search?${params.toString()}`, {
                cache: "no-store",
                signal: searchController.signal
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const payload = await response.json();
            state.searchResults = Array.isArray(payload.documents) ? payload.documents : [];
            state.truncated = !!payload.truncated;
            render();
        } catch (error) {
            if (error?.name === "AbortError") return;
            console.error("Workspace search failed", error);
            const statusNode = document.getElementById("status");
            statusNode.textContent = "search failed";
            statusNode.classList.add("error");
        }
    }

    function queueSearch(query) {
        clearTimeout(searchTimer);
        state.query = query;

        if (!query.trim()) {
            if (searchController) {
                searchController.abort();
                searchController = null;
            }
            state.searchResults = [];
            state.truncated = false;
            render();
            return;
        }

        searchTimer = setTimeout(() => runSearch(query.trim()), 180);
    }

    document.getElementById("searchBox").addEventListener("input", (event) => {
        queueSearch(event.target.value || "");
    });

    loadRecentDocuments();
</script>
</body>
</html>
