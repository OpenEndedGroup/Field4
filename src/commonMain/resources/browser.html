<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Inspector — Columns</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The `column(...)` embed (afield/outputs.kt -> /browse, protocol in afield/server/browsing.kt):
      a Finder-style column view. Rows arrive as [name, id, kind, type, summary, flag, path]; path is
      the row's afield.graphquery address from the root. `p` copies it; a column filter containing
      / * or | runs graphPaths(...) from the root (op "query") and lists the matching paths.
    -->
    <link rel="stylesheet" href="/iosevka.css">
    <link rel="stylesheet" href="/field.css">
    <style>

        /* ===== unified palette & spacing (matches tree.html) ===== */
        :root{
            --col-w:260px; --col-min-w:170px; --gap:3px;

            --bg:        var(--field-bg, #141414);
            --fg:        var(--field-fg, #ddd);
            --fg-hover:  var(--field-fg-strong, #fff);
            --muted:     var(--field-fg-dim, rgba(255,255,255,.53));
            --soft:      var(--field-fg-soft, rgba(255,255,255,.74));
            --accent:    rgb(var(--field-accent-rgb, 72,201,255));
            --danger:    rgb(var(--field-danger-rgb, 255,80,80));
            --warning:   rgb(var(--field-warning-rgb, 235,150,70));
            --border:    rgba(255,255,255,0.08);
            --header-bg: var(--field-surface, #000);
            --header-hover: rgba(255,255,255,0.07);
            --selected:  rgba(var(--field-accent-rgb, 72,201,255), 0.16);
            --maxh:      420px;

            --sep:       rgba(255,255,255,0.04);

            --pad-x:10px; --pad-y:8px;

            /* row feel (sync with tree) */
            --row-pad-y: 4px;
            --row-pad-x: 8px;
            --row-min-h: 24px;

            /* thin scrollbars (sync with tree) */
            --sb-size: 8px;
            --sb-thumb: rgba(255,255,255,.22);
            --sb-thumb-hover: rgba(255,255,255,.35);
        }

        *{ box-sizing:border-box; font-family:"Iosevka Web",ui-monospace,Menlo,monospace; }

        /* Match tree: transparent surface (can sit on any background) */
        body{
            margin:0; background:black; color:var(--fg);
            font-weight:300;
            font-size:12px; line-height:1.15;
        }

        /* ==== Columns layout =================================================== */
        #columns{
            display:flex; gap:var(--gap); padding:var(--gap);
            overflow-x:auto; overflow-y:visible;
            align-items:flex-start; outline:none;
        }

        .column{
            flex:0 0 var(--col-w);
            min-width:var(--col-min-w);
            display:flex; flex-direction:column;
            max-height: calc(100vh - 2*var(--gap));
            overflow:hidden;                     /* inner scrollers own scroll */
            background: var(--header-bg);
            border: 2px solid var(--border);     /* thinner to match tree */
            border-radius:5px;
            background-clip: padding-box;
            min-height:0; outline:none;
            color: var(--fg);
        }

        /* column header — same weight/height as tree rows */
        .col-header{
            padding: var(--row-pad-y) var(--row-pad-x);
            border-bottom:1px solid var(--border);
            background: var(--header-bg);
            font-weight:650;
            min-height: var(--row-min-h);
            display:flex; align-items:center;
        }
        .column.active .col-header{ background: var(--header-hover); }

        /* inner scrollers */
        .list, .leaf{
            flex:1 1 auto; min-height:0;
            overflow:auto; outline:none;
            background: var(--header-bg);
        }

        /* list items: compact, with thin separators & hover backdrop */
        .item{
            width:100%; text-align:left; background:transparent; color:var(--fg);
            padding: var(--row-pad-y) var(--row-pad-x);
            border:none; border-radius:0; cursor:pointer; display:block;
            border-bottom:1px solid var(--sep);
            min-height: var(--row-min-h);
            outline:none;
        }
        .item:last-child{ border-bottom:none; }
        .item:hover{ background: var(--header-hover); }
        .item:active{ background: rgba(255,255,255,0.14); }

        /* left selection stripe (sync with tree) */
        .item.selected{ position:relative; }
        .column.active .item.selected::before{
            content:""; position:absolute; left:0; top:0; bottom:0; width:2px;
            background: var(--fg);
        }

        /* inactive columns (kept, but gentler) */
        .column { transition: filter .12s ease, box-shadow .12s ease; }
        .column:not(.active){ filter: brightness(.92) contrast(.98); }
        .column:not(.active) .item.selected{
            border-right: 2px solid rgba(255,255,255,0.45);
        }

        /* resizer */
        .sep{ flex:0 0 6px; align-self:stretch; position:relative; cursor:col-resize; background:transparent; }
        .sep::before{
            content:""; position:absolute; top:8px; bottom:8px; left:2px; width:2px;
            background: var(--border); border-radius:1px;
        }
        .sep:hover::before{ background: rgba(255,255,255,0.6); }
        .sep.is-left-of-active::before{ background: rgba(255,255,255,0.6); }

        body.noselect{ user-select:none; }
        #columns.resizing, #columns.resizing *{ cursor:col-resize !important; }

        /* leaf (HTML) — same box feel as tree leaves */
        .leaf{
            white-space:normal;
            padding: 6px 8px; margin-top:0;
            font-family:"Iosevka Web",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
            color: var(--fg);
            border-top: 0;
        }
        .leaf > .html, .leaf pre, .leaf div{
            border: 1px solid var(--border);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.0);
            padding: 0px;
            margin: 0 0 2px 0;
        }

        /* In an output panel the iframe is as wide as the panel, so #columns must stay the horizontal
           scroller (keyboard navigation scrolls it to reveal the active column); only its height is
           natural, with each list scrolling itself up to --maxh. */
        html[data-afield-output-iframe="true"] #columns{
            overflow-x: auto; overflow-y: hidden;
        }
        html[data-afield-output-iframe="true"] .column{
            max-height: none;
            overflow: visible;
        }
        html[data-afield-output-iframe="true"] .list,
        html[data-afield-output-iframe="true"] .leaf{
            overflow: visible;
        }

        .error{ color:#ffb0a8; }
        .hint{ color:var(--fg); opacity:.55; font-size:10px; padding:6px var(--row-pad-x); border-bottom:1px dashed var(--border); }

        /* syntax token accents (unchanged, kept verbatim) */
        .tostr .tok { opacity: .96 }
        .tostr .tok.word  { color: rgba(255,255,255,.92);  }
        .tostr .tok.sym   { color: rgba(220,230,255,.85);  text-decoration: none; }
        .tostr .tok.num   { color: rgba(255,235,200,.95);  }
        .tostr .tok.punc  { opacity: .7;  }

        /* flash on push (disabled) */
        @keyframes flashUpdate {
            0%   { box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); filter: brightness(1.06); }
            100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0);   filter: none; }
        }
        .column.flash-update { /* animation: flashUpdate 220ms ease-out 1; */ }

        /* thin scrollbars like tree (scoped) */
        #columns, #columns * { scrollbar-width: thin; scrollbar-color: var(--sb-thumb) transparent; }
        #columns::-webkit-scrollbar,
        .list::-webkit-scrollbar,
        .leaf::-webkit-scrollbar{ width: var(--sb-size); height: var(--sb-size); }
        #columns::-webkit-scrollbar-thumb,
        .list::-webkit-scrollbar-thumb,
        .leaf::-webkit-scrollbar-thumb{
            background-color: var(--sb-thumb);
            border-radius: 6px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        #columns::-webkit-scrollbar-thumb:hover,
        .list::-webkit-scrollbar-thumb:hover,
        .leaf::-webkit-scrollbar-thumb:hover{
            background-color: var(--sb-thumb-hover);
        }
        #columns::-webkit-scrollbar-track, .list::-webkit-scrollbar-track, .leaf::-webkit-scrollbar-track,
        #columns::-webkit-scrollbar-corner, .list::-webkit-scrollbar-corner, .leaf::-webkit-scrollbar-corner{ background: transparent; }

        /* ==== Cheatsheet overlay (unchanged styling, just colors synced) ======= */
        #helpOverlay{ position:fixed; inset:0; display:none; align-items:center; justify-content:center;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(6px) brightness(.9); z-index: 1000; }
        #helpOverlay.show{ display:flex; }
        #helpCard{
            min-width: 420px; max-width: 640px;
            border:2px solid var(--border); border-radius:5px;
            background: rgba(255,255,255,0.08); color: var(--fg);
            box-shadow: 0 6px 24px rgba(0,0,0,.45);
        }
        #helpCard header{
            display:flex; align-items:center; justify-content:space-between;
            padding:10px 12px; border-bottom:1px solid var(--border);
            background: var(--header-bg); border-radius: 5px 5px 0 0; font-weight:650;
        }
        #helpList{ padding: 8px 12px 12px; }
        .kb{ display:flex; gap:12px; padding:4px 0; }
        .kb .leftKey{ width: 170px; text-align:right; font-variant-caps: all-small-caps; opacity:.9; }
        .kb .rightKey{ opacity:.75; }
        kbd{
            display:inline-block; padding:2px 6px; border-radius:4px;
            border:1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08);
            font-family: inherit; font-size: 12px;
        }
        #helpClose{
            border:1px solid rgba(255,255,255,.15); background: transparent;
            color: var(--fg); border-radius:4px; padding:2px 6px; cursor: pointer;
        }
        /* ==== rows with type + summary ======================================== */
        .item{ display:flex !important; align-items:baseline; gap:6px; white-space:nowrap; }
        .item .nm{ flex:0 0 auto; }
        .item .ty{ flex:0 0 auto; color:var(--muted); font-size:10px; }
        .item .sm{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; color:var(--soft); }
        .item[data-kind="dir"]::after{ content:"›"; color:var(--muted); flex:0 0 auto; margin-left:auto; }
        .item[data-flag="cycle"] .sm{ color:var(--warning); }
        .item[data-flag="error"] .sm, .item[data-flag="error"] .nm{ color:var(--danger); }
        .item.selected{ background: var(--selected); }
        .item.more .nm{ color:var(--accent); }
        .item.filtered-out{ display:none !important; }
        .col-header{ gap:6px; white-space:nowrap; position:sticky; top:0; z-index:2; }
        .col-filter{ position:sticky; top:var(--row-min-h); z-index:2; }
        .col-filter.query{ color:var(--accent); }
        .qlist .item .nm{ color:var(--fg-hover); }
        .qhead{ color:var(--muted); font-size:10px; padding:4px var(--row-pad-x); border-bottom:1px solid var(--sep); }
        .qhead.error{ color:var(--danger); white-space:pre-wrap; }
        .column.querying > .list{ display:none; }
        .col-header .ttl{ overflow:hidden; text-overflow:ellipsis; }
        .col-header .meta{ color:var(--muted); font-weight:300; font-size:10px; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; }
        .col-header .copybtn{ border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:10px; }
        .col-header .copybtn:hover{ color:var(--fg-hover); }
        .col-filter{ margin:0; padding:2px 6px; border:none; border-bottom:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--fg); font-size:11px; outline:none; }
        .inspector-error{ color:var(--danger); }
        html[data-afield-output-iframe="true"] .column .list,
        html[data-afield-output-iframe="true"] .column .leaf{ max-height: var(--maxh); overflow:auto; }
    </style>
</head>
<body>
<div class="status" style="display:none" id="status">disconnected</div>
<div id="columns" tabindex="0" aria-label="Inspector columns"></div>
<div id="helpOverlay" aria-hidden="true">
    <div id="helpCard" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
        <header>
            <div>Keyboard shortcuts</div>
            <button id="helpClose" aria-label="Close">esc</button>
        </header>
        <div id="helpList"></div>
    </div>
</div>

<script src="/iframe_autosize.js"></script>
<script>
        const PARAMS = new URLSearchParams(location.search);
        const ROOT_TOKEN = PARAMS.get('root');
        if (PARAMS.get('maxh')) document.documentElement.style.setProperty('--maxh', parseInt(PARAMS.get('maxh'), 10) + 'px');

        (() => {
                const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${document.location.host}/ws`;
                const CHANNEL = "__browsing__";

                const columnsEl = document.getElementById('columns');
                const statusEl  = document.getElementById('status');

                /* ---------- resize handles (unchanged) ---------- */
                const MIN_W = 160;
                function setWidth(col, px){ const v = Math.max(MIN_W, Math.round(px)); col.style.flex = `0 0 ${v}px`; col.style.width = `${v}px`; }
                function makeSep(){
                        const sep = document.createElement('div'); sep.className = 'sep';
                        sep.addEventListener('pointerdown', (e) => {
                                const left  = sep.previousElementSibling && sep.previousElementSibling.classList.contains('column') ? sep.previousElementSibling : null;
                                const right = sep.nextElementSibling && sep.nextElementSibling.classList.contains('column') ? sep.nextElementSibling : null;
                                if (!left) return;
                                const startX = e.clientX;
                                const L0 = left.getBoundingClientRect().width;
                                const R0 = right ? right.getBoundingClientRect().width : 0;
                                columnsEl.classList.add('resizing'); document.body.classList.add('noselect'); sep.setPointerCapture(e.pointerId);
                                const onMove = (ev) => {
                                        const dx = ev.clientX - startX;
                                        if (ev.altKey && right) { const total = L0 + R0; const newL = Math.min(total - MIN_W, Math.max(MIN_W, L0 + dx)); const newR = total - newL; setWidth(left, newL); setWidth(right, newR); }
                                        else { setWidth(left, L0 + dx); }
                                };
                                const onUp = () => { sep.releasePointerCapture(e.pointerId); columnsEl.classList.remove('resizing'); document.body.classList.remove('noselect'); window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); };
                                window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp);
                        });
                        return sep;
                }

                function appendColumn(col, {activate=true, autoselectFirst=true, width=null} = {}) {
                        const hasAnyColumn = !!columnsEl.querySelector('.column');
                        if (hasAnyColumn) columnsEl.appendChild(makeSep());
                        columnsEl.appendChild(col);
                        if (width != null) setWidth(col, width);
                        columnsEl.scrollLeft = columnsEl.scrollWidth;
                        if (activate) {
                                setActiveColumn(col, { focus:true });
                                if (autoselectFirst) {
                                        const first = col.querySelector('.item');
                                        if (first) selectRow(first, {scroll:false});
                                }
                        }
                        if (col.dataset.nodeId) openIds.add(col.dataset.nodeId);
                }

                // what we need to rebuild deterministically
                function snapshotState() {
                        const cols = [...columnsEl.querySelectorAll('.column')];
                        const names = [];          // the selected item text per dir column
                        const widths = [];         // current pixel widths per column
                        let activeIdx = cols.findIndex(c => c.classList.contains('active'));
                        if (activeIdx < 0) activeIdx = cols.length - 1;

                        cols.forEach(col => {
                                widths.push(col.getBoundingClientRect().width);
                                const sel = selectedIn(col);
                                if (sel) names.push(sel.dataset.name);
                        });
                        return { names, widths, activeIdx };
                }

                function clearAllColumns() {
                        [...columnsEl.querySelectorAll('.column')].forEach(c => {
                                const id = c.dataset.nodeId;
                                if (id) { openIds.delete(id); fireAndForget('unsubscribe', { id }); }
                        });
                        columnsEl.innerHTML = "";
                }

                // map pairs -> objects once
                const mapEntries = pairs => (pairs || []).map(p => ({ name: p[0], id: p[1], kind: p[2] || null, type: p[3] || '', summary: p[4] ?? '', flag: p[5] || '', path: p[6] ?? null }));

                async function refreshAll() {
                        const { names, widths, activeIdx } = snapshotState();
                        clearAllColumns();

                        // 1) start fresh at roots
                        const rootResp = await sendReq('getRoots', ROOT_TOKEN ? { root: ROOT_TOKEN } : {});
                        if (!rootResp || !rootResp.ok) { showError(rootResp?.error || 'refresh failed'); return; }

                        if (rootResp.type === 'dir') {
                                const mapped = mapEntries(rootResp.entries);
                                renderDir(
                                    { id: rootResp.id || null, heading: rootResp.heading || 'Root', entries: mapped, resp: rootResp },
                                    null,
                                    { activate:true, autoselectFirst:false, width: widths[0] }
                                );
                                if (rootResp.id) fireAndForget('open', { id: rootResp.id, watch: true });
                        } else if (rootResp.type === 'leaf') {
                                renderLeaf({ id: rootResp.nodeId, html: rootResp.html, value: rootResp.value, type: rootResp.valueType, title: rootResp.valueType || 'value' },
                                    null, { activate:true, width: widths[0] });
                                return;
                        }

                        // 2) replay the selection path (match by title)
                        for (let depth = 0; depth < names.length; depth++) {
                                const col = columnsEl.querySelectorAll('.column')[depth];
                                if (!col) break;
                                const want = names[depth];
                                if (!want) break;

                                const btn = [...col.querySelectorAll('.item')].find(b => b.dataset.name === want);
                                if (!btn) break;

                                selectRow(btn, { scroll:false });
                                const id = btn.dataset.id;
                                if (!id) break;

                                const resp = await sendReq('open', { id, watch: true });
                                if (!resp || !resp.ok) break;

                                if (resp.type === 'dir') {
                                        renderDir(
                                            { id, heading: want, entries: mapEntries(resp.entries), resp },
                                            depth,
                                            { activate:true, autoselectFirst:false, width: widths[depth+1] }
                                        );
                                } else if (resp.type === 'leaf') {
                                        renderLeaf({ id, html: resp.html, value: resp.value, type: resp.valueType, title: want }, depth,
                                            { activate:true, width: widths[depth+1] });
                                        break;
                                }
                        }

                        // 3) restore active column
                        const colsNow = columnsEl.querySelectorAll('.column');
                        const idx = Math.min(activeIdx, colsNow.length - 1);
                        if (colsNow[idx]) setActiveColumn(colsNow[idx], { smooth:false, focus:false });
                }

                function clearRightOfColumn(colIndex){
                        const cols = [...columnsEl.querySelectorAll('.column')];
                        for (let i = cols.length - 1; i > colIndex; i--) {
                                const c = cols[i];
                                const id = c.dataset.nodeId;
                                if (id) { openIds.delete(id); fireAndForget('unsubscribe', { id }); }
                                const sepBefore = c.previousElementSibling;
                                if (sepBefore && sepBefore.classList.contains('sep')) sepBefore.remove();
                                c.remove();
                        }
                }
                function colIndexOf(colEl){ return [...columnsEl.querySelectorAll('.column')].indexOf(colEl); }
                function columnFor(id){ return columnsEl.querySelector(`.column[data-node-id="${id}"]`); }

                /* ---------- selection & keyboard ---------- */
                function highlightLeftSep(col) {
                        columnsEl.querySelectorAll('.sep.is-left-of-active').forEach(el => el.classList.remove('is-left-of-active'));
                        const sep = col && col.previousElementSibling;
                        if (sep && sep.classList.contains('sep')) sep.classList.add('is-left-of-active');
                }
                function scrollColumnIntoView(col, {smooth=true} = {}) {
                        const r = col.getBoundingClientRect();
                        const cr = columnsEl.getBoundingClientRect();
                        const targetLeft = columnsEl.scrollLeft + (r.left - cr.left) - (cr.width - r.width)/2;
                        columnsEl.scrollTo({ left: Math.max(0, targetLeft), behavior: smooth ? 'smooth' : 'auto' });
                }
                function setActiveColumn(col, {smooth=true, focus=false} = {}) {
                        [...columnsEl.querySelectorAll('.column')].forEach(c => c.classList.remove('active'));
                        if (!col) return;
                        col.classList.add('active');
                        highlightLeftSep(col);
                        if (focus) columnsEl.focus({ preventScroll:true });
                        scrollColumnIntoView(col, {smooth});
                }
                function itemsIn(col){ return Array.from(col.querySelectorAll('.item')).filter(b => !b.classList.contains('filtered-out')); }
                function selectedIn(col){ return col.querySelector('.item.selected'); }
                /* Scroll the row's own list vertically, by hand: scrollIntoView would also scroll
                   #columns (and the page around the iframe), and the smooth column scroll that
                   setActiveColumn starts next cancels it. */
                function revealRow(btn){
                        const list = btn.closest('.list, .leaf'); if (!list) return;
                        const r = btn.getBoundingClientRect(), lr = list.getBoundingClientRect();
                        if (r.top < lr.top) list.scrollTop -= (lr.top - r.top);
                        else if (r.bottom > lr.bottom) list.scrollTop += (r.bottom - lr.bottom);
                }
                function selectRow(btn, {scroll=true} = {}){
                        const col = btn.closest('.column');
                        itemsIn(col).forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        if (scroll) revealRow(btn);
                        setActiveColumn(col, { focus:true });
                        return btn;
                }
                function moveSelection(col, delta){
                        const list = itemsIn(col); if (!list.length) return null;
                        let idx = list.findIndex(b => b.classList.contains('selected')); if (idx < 0) idx = 0;
                        idx = Math.max(0, Math.min(list.length - 1, idx + delta));
                        return selectRow(list[idx]);
                }
                function neighborColumn(col, dir){
                        if (dir < 0) { const sep = col.previousElementSibling; return sep && sep.previousElementSibling && sep.previousElementSibling.classList.contains('column') ? sep.previousElementSibling : null; }
                        else { const sep = col.nextElementSibling; return sep && sep.nextElementSibling && sep.nextElementSibling.classList.contains('column') ? sep.nextElementSibling : null; }
                }

                document.addEventListener('keydown', (e) => {
                        const ov = document.getElementById('helpOverlay');
                        if (ov.classList.contains('show')) {
                                if (e.key === 'Escape') { e.preventDefault(); toggleHelp(false); }
                                return;
                        }
                        if ((e.key === '?' || (e.key === '/' && e.shiftKey)) ||
                            (e.key.toLowerCase() === 'h' && !e.ctrlKey && !e.metaKey && !e.altKey)) {
                                e.preventDefault();
                                toggleHelp(true);
                                return;
                        }
                        if (columnsEl.classList.contains('resizing')) return;
                        if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;

                        const active = columnsEl.querySelector('.column.active') || columnsEl.querySelector('.column:last-of-type');
                        if (!active) return;

                        switch (e.key) {
                                case 'ArrowDown': e.preventDefault(); moveSelection(active, +1); break;
                                case 'ArrowUp':   e.preventDefault(); moveSelection(active, -1); break;
                                case 'ArrowRight':
                                case 'Enter': {
                                        const sel = selectedIn(active) || moveSelection(active, 0);
                                        if (sel) { e.preventDefault(); sel.click(); }
                                        break;
                                }
                                case 'ArrowLeft': {
                                        const prev = neighborColumn(active, -1);
                                        if (prev) { e.preventDefault(); setActiveColumn(prev, {smooth:true, focus:true}); const sel = selectedIn(prev) || prev.querySelector('.item'); if (sel) selectRow(sel); }
                                        break;
                                }
                                case 'r': { e.preventDefault(); refreshAll(); break; }
                                case '/': { e.preventDefault(); openColumnFilter(active); break; }
                                case 'p': {
                                        e.preventDefault();
                                        const sel = selectedIn(active);
                                        copyPath_(sel ? sel.dataset.path : active.dataset.path, null);
                                        break;
                                }
                                case 'c': {
                                        e.preventDefault();
                                        const sel = selectedIn(active);
                                        const right = neighborColumn(active, +1);
                                        if (active.dataset.value != null && !active.querySelector('.list')) copyText_(active.dataset.value, active.querySelector('.copybtn'));
                                        else if (right && right.dataset.value != null) copyText_(right.dataset.value, right.querySelector('.copybtn'));
                                        else if (sel) copyText_(`${sel.dataset.name}: ${sel.querySelector('.sm')?.textContent || ''}`);
                                        break;
                                }
                                case 'Home': { e.preventDefault(); const l = itemsIn(active); if (l.length) selectRow(l[0]); break; }
                                case 'End':  { e.preventDefault(); const l = itemsIn(active); if (l.length) selectRow(l[l.length-1]); break; }
                                default: break;
                        }
                });

                columnsEl.addEventListener('pointerdown', () => columnsEl.focus({preventScroll:true}));

                /* ---------- websocket & live updates ---------- */
                let ws; let reqSeq = 1; const pending = new Map();
                const openIds = new Set();

                function connect(){
                        ws = new WebSocket(WS_URL);
                        statusEl.textContent = "connecting…";
                        ws.onopen = () => { statusEl.textContent = "connected"; getRoots(); };
                        ws.onmessage = (ev) => {
                                let msg; try { msg = JSON.parse(ev.data); } catch { return; }
                                if (msg.reqId && pending.has(msg.reqId)) { const resolve = pending.get(msg.reqId); pending.delete(msg.reqId); resolve(msg); return; }
                                if (msg.type === "changed" && msg.nodeId) { reopenNode(msg.nodeId, msg.version); }
                        };
                        ws.onclose = () => { statusEl.textContent = "disconnected"; openIds.clear(); setTimeout(connect, 1200); };
                        ws.onerror = () => { statusEl.textContent = "error"; };
                }

                function sendReq(op, payload = {}){
                        const reqId = String(reqSeq++);
                        const msg = { channel: CHANNEL, op, reqId, ...payload };
                        return new Promise((resolve) => { pending.set(reqId, resolve); ws.send(JSON.stringify(msg)); });
                }

                function fireAndForget(op, payload = {}){
                        const reqId = String(reqSeq++);
                        const msg = { channel: CHANNEL, op, reqId, ...payload };
                        try { ws && ws.readyState === 1 && ws.send(JSON.stringify(msg)); } catch {}
                }

                const lastVersion = new Map();
                const reopenBusy  = new Set();
                const reopenAgain = new Set();

                async function reopenNode(id, version) {
                        const last = lastVersion.get(id);
                        if (typeof version === 'number' && typeof last === 'number' && version <= last) return;

                        if (reopenBusy.has(id)) { reopenAgain.add(id); return; }
                        reopenBusy.add(id);

                        const col = columnFor(id);
                        if (!col) { reopenBusy.delete(id); reopenAgain.delete(id); return; }

                        const width      = col.getBoundingClientRect().width;
                        const wasActive  = col.classList.contains('active');
                        const colIdx     = colIndexOf(col);

                        clearRightOfColumn(colIdx);

                        const resp = await sendReq('open', { id, watch: true });

                        if (resp && resp.ok) {
                                if (resp.type === 'dir') {
                                        const mapped = mapEntries(resp.entries);
                                        rebuildDirColumn(col, { heading: resp.heading, entries: mapped, resp });
                                } else if (resp.type === 'leaf') {
                                        const title = col.dataset.title || 'Leaf';
                                        rebuildLeafColumn(col, { title, html: resp.html, value: resp.value, type: resp.valueType });
                                }

                                setWidth(col, width);
                                col.classList.add('flash-update');
                                setTimeout(() => col.classList.remove('flash-update'), 260);

                                if (typeof resp.version === 'number') lastVersion.set(id, resp.version);

                                if (wasActive) setActiveColumn(col, { smooth: false, focus:false });
                                const sel = selectedIn(col) || col.querySelector('.item');
                                if (sel) selectRow(sel, { scroll: false });
                        }

                        reopenBusy.delete(id);
                        if (reopenAgain.delete(id)) reopenNode(id, lastVersion.get(id) ?? undefined);
                }

                function headerFor(title, meta, copyText, path){
                        const header = document.createElement('div'); header.className = 'col-header';
                        const ttl = document.createElement('span'); ttl.className = 'ttl'; ttl.textContent = title ?? '…';
                        if (path) ttl.title = path;
                        const m = document.createElement('span'); m.className = 'meta'; m.textContent = meta || '';
                        header.append(ttl, m);
                        if (path) {
                                const b = document.createElement('button'); b.className = 'copybtn pathbtn'; b.textContent = 'path'; b.title = 'Copy graphPath (p)';
                                b.addEventListener('click', (e) => { e.stopPropagation(); copyPath_(path, b); });
                                header.appendChild(b);
                        }
                        if (copyText != null) {
                                const b = document.createElement('button'); b.className = 'copybtn'; b.textContent = 'copy'; b.title = 'Copy value (c)';
                                b.addEventListener('click', (e) => { e.stopPropagation(); copyText_(copyText, b); });
                                header.appendChild(b);
                        }
                        return header;
                }
                async function copyText_(text, btn){
                        try { await navigator.clipboard.writeText(text); }
                        catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch {} ta.remove(); }
                        window.__lastCopied = text;
                        if (btn) { btn.textContent = 'copied'; setTimeout(() => btn.textContent = 'copy', 900); }
                }
                async function copyPath_(path, btn){
                        if (!path) { statusFlash('no path reaches this row'); return; }
                        await copyText_(path, null);
                        if (btn) { btn.textContent = 'copied'; setTimeout(() => btn.textContent = 'path', 900); }
                }
                function statusFlash(text){
                        const col = columnsEl.querySelector('.column.active'); const h = col?.querySelector('.col-header .meta');
                        if (!h) return; const was = h.textContent; h.textContent = text; setTimeout(() => { h.textContent = was; }, 1500);
                }
                function dirMeta(resp){
                        if (!resp) return '';
                        const t = (resp.valueType && resp.valueType !== resp.heading) ? resp.valueType : '';
                        const n = resp.total != null ? `${resp.total} ${resp.total === 1 ? 'entry' : 'entries'}` : '';
                        return [t, n].filter(Boolean).join(' · ');
                }
                function itemButton(col, e){
                        const btn = document.createElement('button');
                        btn.className = 'item'; btn.tabIndex = -1; btn.dataset.id = e.id; btn.dataset.name = e.name;
                        if (e.path != null) btn.dataset.path = e.path;
                        if (e.path) btn.title = e.path;
                        if (e.kind) btn.dataset.kind = e.kind;
                        if (e.flag) btn.dataset.flag = e.flag;
                        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = e.name;
                        const ty = document.createElement('span'); ty.className = 'ty'; ty.textContent = e.type || '';
                        const sm = document.createElement('span'); sm.className = 'sm'; sm.textContent = e.summary || ''; sm.title = e.summary || '';
                        btn.append(nm, ty, sm);
                        btn.addEventListener('click', () => openItem(col, btn, e));
                        return btn;
                }
                async function openItem(col, btn, e){
                        selectRow(btn);
                        const idx = colIndexOf(col);
                        const resp = await sendReq('open', { id: e.id, watch: true });
                        if (!resp.ok) { showError(resp.error, idx); return; }
                        if (resp.type === 'dir') {
                                renderDir({ id: e.id, heading: e.name, entries: mapEntries(resp.entries), resp, path: e.path }, idx);
                        } else if (resp.type === 'leaf') {
                                renderLeaf({ id: e.id, html: resp.html, value: resp.value, type: resp.valueType, title: e.name, path: e.path }, idx);
                        }
                }
                function moreButton(col, list, resp, shown){
                        const btn = document.createElement('button');
                        btn.className = 'item more'; btn.tabIndex = -1; btn.dataset.name = '__more__';
                        const nm = document.createElement('span'); nm.className = 'nm';
                        nm.textContent = resp.total != null ? `show more — ${shown} of ${resp.total}` : `show more — ${shown} shown`;
                        btn.appendChild(nm);
                        btn.addEventListener('click', async () => {
                                const r = await sendReq('more', { id: resp.id, offset: shown });
                                if (!r || !r.ok) { showError(r?.error || 'more failed', colIndexOf(col)); return; }
                                btn.remove();
                                const added = mapEntries(r.entries);
                                added.forEach(e => list.appendChild(itemButton(col, e)));
                                if (r.more) list.appendChild(moreButton(col, list, r, shown + added.length));
                                applyColumnFilter(col);
                                const first = list.querySelector(`.item[data-id="${CSS.escape(added[0]?.id || '')}"]`);
                                if (first) selectRow(first);
                                btn.dispatchEvent(new Event('afield-more-done'));
                        });
                        return btn;
                }
                function fillDirColumn(col, { heading, entries, resp, path }) {
                        col.innerHTML = '';
                        col.dataset.title = heading || '';
                        if (path != null) col.dataset.path = path;
                        col.appendChild(headerFor(heading, dirMeta(resp), null, col.dataset.path));
                        if (!entries.length) {
                                const hint = document.createElement('div'); hint.className = 'hint'; hint.textContent = 'empty';
                                col.appendChild(hint); return;
                        }
                        const list = document.createElement('div'); list.className = 'list';
                        entries.forEach(e => list.appendChild(itemButton(col, e)));
                        if (resp && resp.more) list.appendChild(moreButton(col, list, resp, (resp.offset || 0) + entries.length));
                        col.appendChild(list);
                }
                function fillLeafColumn(col, { title, html, value, type, path }) {
                        if (title) col.dataset.title = title;
                        if (path != null) col.dataset.path = path;
                        col.innerHTML = '';
                        col.appendChild(headerFor(title ?? 'value', type || '', value ?? '', col.dataset.path));
                        const div = document.createElement('div'); div.className = 'leaf'; div.innerHTML = String(html ?? '');
                        col.dataset.value = value ?? '';
                        col.appendChild(div);
                }

                function renderDir(spec, fromColIndex, opts = {}) {
                        const { skipClear = false } = opts;
                        if (!skipClear && Number.isInteger(fromColIndex)) clearRightOfColumn(fromColIndex);
                        const col = document.createElement('section'); col.className = 'column';
                        if (spec.id) col.dataset.nodeId = spec.id;
                        fillDirColumn(col, spec);
                        appendColumn(col, opts);
                }

                function rebuildDirColumn(col, spec) {
                        const prevSel = selectedIn(col)?.dataset.name;
                        const list0 = col.querySelector('.list'); const top = list0 ? list0.scrollTop : 0;
                        fillDirColumn(col, { ...spec, heading: col.dataset.title || spec.heading });
                        const list = col.querySelector('.list'); if (list) list.scrollTop = top;
                        if (prevSel) { const b = [...col.querySelectorAll('.item')].find(x => x.dataset.name === prevSel); if (b) b.classList.add('selected'); }
                        applyColumnFilter(col);
                }

                function rebuildLeafColumn(col, spec) {
                        const prevLeaf = col.querySelector('.leaf');
                        const savedScroll = prevLeaf ? { left: prevLeaf.scrollLeft, top: prevLeaf.scrollTop } : { left: 0, top: 0 };
                        fillLeafColumn(col, spec);
                        const div = col.querySelector('.leaf');
                        // restore scroll so user-kept horizontal/vertical position stays put on updates
                        if (div && (savedScroll.left || savedScroll.top)) { div.scrollLeft = savedScroll.left; div.scrollTop = savedScroll.top; }
                }

                function renderLeaf(spec, fromColIndex, opts = {}) {
                        const { skipClear = false } = opts;
                        if (!skipClear && Number.isInteger(fromColIndex)) clearRightOfColumn(fromColIndex);
                        const col = document.createElement('section'); col.className = 'column';
                        if (spec.id) col.dataset.nodeId = spec.id;
                        fillLeafColumn(col, spec);
                        appendColumn(col, opts);
                }

                /* ---------- per-column filter ("/") ---------- */
                // Text with / * or | is a graphPaths() pattern run from the root; anything else filters.
                const isQuery = (q) => /[\/*|]/.test(q);
                let queryTimer = null, querySeq = 0;
                function rootNodeId(){ return columnsEl.querySelector('.column')?.dataset.nodeId || null; }
                function endQuery(col){
                        col.classList.remove('querying');
                        col.querySelector('.qlist')?.remove();
                        col.querySelector('.col-filter')?.classList.remove('query');
                }
                function runQuery(col, q){
                        clearTimeout(queryTimer);
                        col.classList.add('querying');
                        col.querySelector('.col-filter')?.classList.add('query');
                        queryTimer = setTimeout(async () => {
                                const mine = ++querySeq;
                                const resp = await sendReq('query', { id: rootNodeId(), query: q });
                                const f = col.querySelector('.col-filter');
                                if (mine !== querySeq || !f || !isQuery(f.value.trim())) return;
                                col.querySelector('.qlist')?.remove();
                                const list = document.createElement('div'); list.className = 'list qlist';
                                const head = document.createElement('div'); head.className = 'qhead';
                                list.appendChild(head);
                                if (!resp || !resp.ok) { head.classList.add('error'); head.textContent = resp?.error || 'query failed'; col.appendChild(list); return; }
                                const n = resp.matches.length;
                                head.textContent = resp.total === 0 ? `no paths match ${q}`
                                    : `${resp.total} ${resp.total === 1 ? 'match' : 'matches'}${n < resp.total ? `, first ${n}` : ''}${resp.truncated ? ' (walk stopped early)' : ''} — Enter reveals`;
                                resp.matches.forEach(m => {
                                        const btn = document.createElement('button');
                                        btn.className = 'item qitem'; btn.tabIndex = -1; btn.dataset.name = m[0]; btn.dataset.path = m[0]; btn.dataset.kind = m[1] || 'leaf';
                                        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = m[0];
                                        const ty = document.createElement('span'); ty.className = 'ty'; ty.textContent = m[2] || '';
                                        const sm = document.createElement('span'); sm.className = 'sm'; sm.textContent = m[3] || ''; sm.title = m[3] || '';
                                        btn.append(nm, ty, sm);
                                        btn.addEventListener('click', () => revealPath(m[0]));
                                        list.appendChild(btn);
                                });
                                col.appendChild(list);
                                const first = list.querySelector('.item'); if (first) { first.classList.add('selected'); }
                        }, 180);
                }
                /** Rebuild the columns along a graphPath from the root, paging until each segment appears. */
                async function revealPath(path){
                        const segs = path.split('/');
                        const root = columnsEl.querySelector('.column');
                        if (!root) return false;
                        endQuery(root); clearRightOfColumn(0);
                        columnsEl.querySelectorAll('.col-filter').forEach(f => f.remove());
                        for (let i = 0; i < segs.length; i++) {
                                const col = columnsEl.querySelectorAll('.column')[i];
                                if (!col) return false;
                                const want = segs.slice(0, i + 1).join('/').toLowerCase();
                                const find = () => [...col.querySelectorAll('.list .item')].find(b => (b.dataset.path || '').toLowerCase() === want);
                                let btn = find();
                                for (let pages = 0; !btn && pages < 100; pages++) {
                                        const more = col.querySelector('.list .item.more'); if (!more) break;
                                        await new Promise(res => { more.addEventListener('afield-more-done', res, { once:true }); more.click(); setTimeout(res, 3000); });
                                        btn = find();
                                }
                                if (!btn) { statusFlash(`not found: ${segs.slice(0, i + 1).join('/')}`); return false; }
                                if (i < segs.length - 1) await openItem(col, btn, { id: btn.dataset.id, name: btn.dataset.name, path: btn.dataset.path });
                                else selectRow(btn);
                        }
                        return true;
                }
                window.inspectorRevealPath = revealPath;
                function applyColumnFilter(col){
                        const f = col.querySelector('.col-filter'); const raw = (f?.value || '').trim();
                        if (isQuery(raw)) return;
                        const q = raw.toLowerCase();
                        col.querySelectorAll('.item').forEach(b => {
                                if (b.classList.contains('more')) return;
                                const hay = (b.dataset.name + ' ' + (b.querySelector('.sm')?.textContent || '') + ' ' + (b.querySelector('.ty')?.textContent || '')).toLowerCase();
                                b.classList.toggle('filtered-out', !!q && !hay.includes(q));
                        });
                }
                function openColumnFilter(col){
                        let f = col.querySelector('.col-filter');
                        if (!f) {
                                f = document.createElement('input'); f.className = 'col-filter'; f.type = 'search'; f.placeholder = 'filter'; f.spellcheck = false;
                                col.querySelector('.col-header')?.after(f);
                                f.placeholder = 'filter, or **/name';
                                f.title = 'Text filters this column; a pattern with / * or | runs graphPaths from the root';
                                f.addEventListener('input', () => {
                                        const q = f.value.trim();
                                        if (isQuery(q)) runQuery(col, q); else { endQuery(col); applyColumnFilter(col); }
                                });
                                f.addEventListener('keydown', (e) => {
                                        e.stopPropagation();
                                        if (e.key === 'Escape') { endQuery(col); f.remove(); applyColumnFilter(col); columnsEl.focus(); return; }
                                        const ql = col.querySelector('.qlist');
                                        if (ql && col.classList.contains('querying')) {
                                                const items = [...ql.querySelectorAll('.item')];
                                                const cur = ql.querySelector('.item.selected'); const i = Math.max(0, items.indexOf(cur));
                                                const pick = (j) => { items.forEach(b => b.classList.remove('selected')); const b = items[j]; if (b) { b.classList.add('selected'); revealRow(b); } };
                                                if (e.key === 'ArrowDown') { e.preventDefault(); pick(Math.min(items.length - 1, i + 1)); }
                                                if (e.key === 'ArrowUp') { e.preventDefault(); pick(Math.max(0, i - 1)); }
                                                if (e.key === 'Enter' && cur) { e.preventDefault(); revealPath(cur.dataset.path); }
                                                return;
                                        }
                                        if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); const b = itemsIn(col)[0]; if (b) selectRow(b); }
                                });
                        }
                        f.focus(); f.select();
                }
                function showError(err, fromColIndex){
                        if (Number.isInteger(fromColIndex)) clearRightOfColumn(fromColIndex);
                        const col = document.createElement('section'); col.className = 'column';
                        const header = document.createElement('div'); header.className = 'col-header error'; header.textContent = 'Error';
                        const pre = document.createElement('pre'); pre.className = 'leaf'; pre.textContent = String(err ?? 'unknown');
                        col.appendChild(header); col.appendChild(pre); appendColumn(col);
                }

                async function getRoots(){
                        const resp = await sendReq('getRoots', ROOT_TOKEN ? { root: ROOT_TOKEN } : {});
                        if (!resp.ok) { showError(resp.error); return; }

                        if (resp.type === 'dir') {
                                const mapped = mapEntries(resp.entries);
                                renderDir({ id: resp.id, heading: resp.heading || 'Root', entries: mapped, resp }, undefined);
                                if (resp.id) fireAndForget('open', { id: resp.id, watch: true });
                                if (document.documentElement.dataset.afieldOutputIframe === "true") {
                                        const first = columnsEl.querySelector('.column .item');
                                        if (first) first.click();
                                }
                        } else if (resp.type === 'leaf') {
                                renderLeaf({ id: resp.nodeId, html: resp.html, value: resp.value, type: resp.valueType, title: resp.valueType || 'value' }, undefined);
                                if (resp.nodeId) fireAndForget('open', { id: resp.nodeId, watch: true });
                        }
                }

                // unsubscribe everything on unload
                window.addEventListener('beforeunload', () => {
                        openIds.forEach(id => fireAndForget('unsubscribe', { id }));
                        openIds.clear();
                });

                document.addEventListener('DOMContentLoaded', () => { columnsEl.focus({preventScroll:true}); connect(); });
                // Probe for agents and UI regressions.
                window.inspectorColumnsState = () => [...columnsEl.querySelectorAll('.column')].map(c => ({
                        title: c.dataset.title, meta: c.querySelector('.col-header .meta')?.textContent || '',
                        items: [...c.querySelectorAll('.item')].filter(b => !b.classList.contains('filtered-out')).map(b => [b.dataset.name, b.dataset.kind || '', b.querySelector('.ty')?.textContent || '', b.querySelector('.sm')?.textContent || '']).slice(0, 60),
                        count: c.querySelectorAll('.item:not(.more)').length,
                        leaf: c.dataset.value != null ? c.dataset.value.slice(0, 200) : null,
                        path: c.dataset.path ?? null,
                        selected: c.querySelector('.item.selected')?.dataset.path ?? null,
                        query: c.querySelector('.qlist') ? [...c.querySelectorAll('.qlist .qhead, .qlist .item .nm')].map(x => x.textContent).slice(0, 40) : null,
                }));

                /* ==== Cheatsheet data + helpers ======================================= */
                const CHEATS = [
                        ['↑ / ↓',          'Move selection'],
                        ['←',              'Focus previous column'],
                        ['→  /  Enter',    'Open selected item'],
                        ['R',              'Refresh all open columns'],
                        ['/',              'Filter the active column'],
                        ['C',              'Copy the selected value'],
                        ['P',              'Copy the selected row\'s graphPath'],
                        ['Home / End',     'First / last row'],
                        ['Alt + drag',     'Resize left/right columns together'],
                        ['?  /  H',        'Toggle this help'],
                        ['Esc',            'Close this help']
                ];

                function makeKeyHTML(label){
                        if (label.includes(' / ')) return label.split(' / ').map(s => `<kbd>${s.trim()}</kbd>`).join(' / ');
                        if (label.includes(' + ')) return label.split(' + ').map(s => `<kbd>${s.trim()}</kbd>`).join(' + ');
                        return `<kbd>${label}</kbd>`;
                }

                function renderCheats(){
                        const list = document.getElementById('helpList');
                        list.innerHTML = '';
                        CHEATS.forEach(([key, desc]) => {
                                const row = document.createElement('div'); row.className = 'kb';
                                const left = document.createElement('div'); left.className = 'leftKey';
                                const right = document.createElement('div'); right.className = 'rightKey';
                                left.innerHTML = makeKeyHTML(key);
                                right.textContent = desc;
                                row.appendChild(left); row.appendChild(right);
                                list.appendChild(row);
                        });
                }

                function toggleHelp(show){
                        const ov = document.getElementById('helpOverlay');
                        const open = ov.classList.contains('show');
                        const want = (show === undefined) ? !open : !!show;
                        if (want) { renderCheats(); ov.classList.add('show'); ov.setAttribute('aria-hidden', 'false'); }
                        else { ov.classList.remove('show'); ov.setAttribute('aria-hidden', 'true'); columnsEl && columnsEl.focus({preventScroll:true}); }
                }

                document.addEventListener('click', (e) => {
                        const ov = document.getElementById('helpOverlay');
                        if (!ov.classList.contains('show')) return;
                        if (e.target === ov) toggleHelp(false);
                });
                document.getElementById('helpClose').addEventListener('click', () => toggleHelp(false));

        })();
</script>
</body>
</html>
