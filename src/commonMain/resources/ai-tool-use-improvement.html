<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>AI Tool Use Improvement</title>
    <script>
        document.title = "AI Tool Use Improvement";
    </script>
    <link rel="preload" href="/woff2/iosevka-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/iosevka.css" as="style">
    <link rel="stylesheet" href="/iosevka.css">
    <style>
        :root {
            --bg: rgb(12, 12, 12);
            --panel: rgb(25, 25, 25);
            --panel-2: rgb(19, 19, 19);
            --border: rgba(230, 240, 245, 0.14);
            --border-strong: rgba(230, 240, 245, 0.32);
            --text: rgba(235, 242, 246, 0.95);
            --soft: rgba(168, 183, 192, 0.95);
            --accent: rgb(224, 241, 249);
            --danger: rgb(255, 120, 120);
            --ok: rgb(174, 240, 198);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Iosevka Web", ui-monospace, monospace;
            font-weight: 300;
            overflow: hidden;
        }

        body {
            padding: 20px;
        }

        main {
            position: relative;
            z-index: 1;
            width: min(1180px, calc(100vw - 40px));
            height: calc(100vh - 40px);
            min-height: 0;
            margin: 0 auto;
            display: grid;
            grid-template-rows: auto auto auto auto minmax(210px, 0.9fr) minmax(180px, 0.7fr);
            gap: 12px;
        }

        header,
        section {
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: 8px;
        }

        header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            padding: 14px;
        }

        h1,
        h2 {
            margin: 0;
            font-weight: 400;
            letter-spacing: 0;
        }

        h1 {
            font-size: 20px;
        }

        h2 {
            color: var(--soft);
            font-size: 12px;
        }

        button,
        a.button {
            font: inherit;
            font-size: 12px;
            color: var(--text);
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 7px 9px;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover,
        a.button:hover {
            border-color: var(--border-strong);
        }

        button:disabled {
            color: var(--soft);
            cursor: default;
            opacity: 0.55;
        }

        .header-actions,
        .metrics {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .metrics,
        .paths,
        .activity {
            padding: 12px;
        }

        .metric {
            display: grid;
            gap: 4px;
            min-width: 136px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--panel-2);
        }

        .metric-label,
        .path-label {
            color: var(--soft);
            font-size: 10px;
            text-transform: lowercase;
        }

        .metric-value {
            color: var(--accent);
            font-size: 16px;
        }

        .metric-value.failed {
            color: var(--danger);
        }

        .metric-value.succeeded {
            color: var(--ok);
        }

        .paths,
        .worktrees {
            display: grid;
            gap: 8px;
        }

        .worktree-list {
            display: grid;
            gap: 8px;
        }

        .worktree-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--panel-2);
        }

        .worktree-title {
            display: flex;
            gap: 8px;
            align-items: baseline;
            min-width: 0;
        }

        .worktree-id {
            color: var(--accent);
            white-space: nowrap;
        }

        .worktree-status {
            color: var(--soft);
        }

        .worktree-path {
            margin-top: 4px;
            color: var(--soft);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .worktree-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .path-row {
            display: grid;
            grid-template-columns: 120px minmax(0, 1fr);
            gap: 10px;
            align-items: baseline;
            min-width: 0;
        }

        .path-value {
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .activity {
            min-height: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: 8px;
        }

        .artifacts {
            min-height: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: 8px;
            padding: 12px;
        }

        .artifact-header {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
        }

        .artifact-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .artifact-tabs button.active {
            border-color: var(--border-strong);
            color: var(--accent);
        }

        #artifact-body {
            min-height: 0;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgb(6, 6, 6);
            padding: 14px;
            font-size: 12px;
            line-height: 1.45;
        }

        #artifact-body.empty {
            color: var(--soft);
        }

        .markdown h1,
        .markdown h2,
        .markdown h3 {
            margin: 0.8em 0 0.35em;
            color: var(--accent);
            font-weight: 500;
        }

        .markdown h1:first-child,
        .markdown h2:first-child,
        .markdown h3:first-child,
        .markdown p:first-child {
            margin-top: 0;
        }

        .markdown p {
            margin: 0.5em 0;
        }

        .markdown ul {
            margin: 0.4em 0 0.7em 1.4em;
            padding: 0;
        }

        .markdown code {
            color: var(--accent);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 0 3px;
        }

        .markdown pre,
        .patch-view {
            margin: 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: var(--text);
        }

        .markdown pre {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--panel-2);
        }

        #message {
            color: var(--soft);
        }

        #transcript {
            min-height: 0;
            margin: 0;
            padding: 12px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgb(6, 6, 6);
            color: var(--text);
            white-space: pre-wrap;
            font: inherit;
            font-size: 12px;
            line-height: 1.35;
        }
    </style>
</head>
<body class="field-webgl-page">
<script src="/fieldWebglBackground.js"></script>
<script>
    window.FieldWebGLBackground?.install(document.body, { fixed: true });
</script>
<main>
    <header>
        <div>
            <h1>AI Tool Use Improvement</h1>
            <h2 id="subtitle">checking logs</h2>
        </div>
        <div class="header-actions">
            <button id="run-review" type="button">Review logs</button>
            <button id="run-apply" type="button">Generate proposal</button>
            <button id="clear-reviewed" type="button">Mark reviewed</button>
            <a class="button" href="/welcome">Welcome</a>
        </div>
    </header>

    <section class="metrics">
        <div class="metric"><span class="metric-label">recent logs</span><span id="recent-logs" class="metric-value">0</span></div>
        <div class="metric"><span class="metric-label">all logs</span><span id="all-logs" class="metric-value">0</span></div>
        <div class="metric"><span class="metric-label">size</span><span id="log-size" class="metric-value">0 B</span></div>
        <div class="metric"><span class="metric-label">state</span><span id="task-state" class="metric-value">idle</span></div>
    </section>

    <section class="paths">
        <div class="path-row"><span class="path-label">log dir</span><span id="log-dir" class="path-value"></span></div>
        <div class="path-row"><span class="path-label">report</span><span id="report-path" class="path-value"></span></div>
        <div class="path-row"><span class="path-label">dry patch</span><span id="patch-path" class="path-value"></span></div>
    </section>

    <section class="worktrees">
        <div class="path-row"><span class="path-label">worktrees</span><span id="worktree-summary" class="path-value">none</span></div>
        <div id="worktree-list" class="worktree-list"></div>
    </section>

    <section class="artifacts">
        <div class="artifact-header">
            <div>
                <h2>review output</h2>
                <div id="next-step" class="path-label">Run a review to generate a report and patch.</div>
            </div>
            <div class="artifact-tabs">
                <button id="show-report" type="button" class="active">Report</button>
                <button id="show-patch" type="button">Patch</button>
            </div>
        </div>
        <div id="artifact-body" class="empty">No report yet.</div>
    </section>

    <section class="activity">
        <div id="message">Ready.</div>
        <pre id="transcript">No task output yet.</pre>
    </section>
</main>

<script>
    const REFRESH_MS = 1200;
    let latestStatus = null;
    let socket = null;
    let artifactMode = "report";

    function websocketUrl() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        return `${protocol}//${window.location.host}/welcome-events`;
    }

    function countLabel(value, singular, plural = `${singular}s`) {
        const n = Number(value) || 0;
        return n === 1 ? `1 ${singular}` : `${n} ${plural}`;
    }

    function bytesLabel(value) {
        const n = Number(value) || 0;
        if (n < 1024) return `${n} B`;
        if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
        return `${(n / (1024 * 1024)).toFixed(1)} MB`;
    }

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#39;"
        }[ch]));
    }

    function inlineMarkdown(text) {
        return escapeHtml(text)
            .replace(/`([^`]+)`/g, "<code>$1</code>")
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderMarkdown(markdown) {
        const lines = String(markdown || "").split(/\r?\n/);
        const parts = [];
        let list = [];
        let code = [];
        let inCode = false;

        function flushList() {
            if (!list.length) return;
            parts.push(`<ul>${list.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</ul>`);
            list = [];
        }

        function flushCode() {
            if (!code.length) return;
            parts.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
            code = [];
        }

        lines.forEach((line) => {
            const trimmed = line.trim();
            if (trimmed.startsWith("```")) {
                if (inCode) {
                    inCode = false;
                    flushCode();
                } else {
                    flushList();
                    inCode = true;
                }
                return;
            }
            if (inCode) {
                code.push(line);
                return;
            }
            if (!trimmed) {
                flushList();
                return;
            }
            const heading = /^(#{1,3})\s+(.+)$/.exec(trimmed);
            if (heading) {
                flushList();
                const level = heading[1].length;
                parts.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
                return;
            }
            const bullet = /^[-*]\s+(.+)$/.exec(trimmed);
            if (bullet) {
                list.push(bullet[1]);
                return;
            }
            flushList();
            parts.push(`<p>${inlineMarkdown(trimmed)}</p>`);
        });
        flushList();
        if (inCode || code.length) flushCode();
        return parts.join("") || "<p>No report text.</p>";
    }

    function renderArtifacts(status) {
        const body = document.getElementById("artifact-body");
        const next = document.getElementById("next-step");
        const reportButton = document.getElementById("show-report");
        const patchButton = document.getElementById("show-patch");
        const report = status?.reportMarkdown || "";
        const patch = status?.dryRunPatch || "";
        reportButton.classList.toggle("active", artifactMode === "report");
        patchButton.classList.toggle("active", artifactMode === "patch");

        if (status?.running) {
            next.textContent = status.dryRun
                ? "Review is running. The report and patch will appear here when it finishes."
                : "A proposal worktree is running. When it is ready, review it below and use Merge to apply it.";
        } else if ((status?.worktrees || []).some((proposal) => proposal.status === "ready")) {
            next.textContent = "Next: inspect the ready proposal below, then use Merge to apply it to a clean checkout.";
        } else if (report || patch) {
            next.textContent = "Next: use Generate proposal for a real worktree, or apply the dry-run patch manually from the path above.";
        } else {
            next.textContent = "Run Review logs to generate a formatted report and dry-run patch.";
        }

        if (artifactMode === "patch") {
            body.className = patch ? "" : "empty";
            body.innerHTML = patch
                ? `<pre class="patch-view">${escapeHtml(patch)}</pre>`
                : "No dry-run patch yet.";
        } else {
            body.className = report ? "markdown" : "empty";
            body.innerHTML = report ? renderMarkdown(report) : "No report yet.";
        }
    }

    function render(status) {
        latestStatus = status || {};
        const logs = latestStatus.logs || {};
        const transcript = document.getElementById("transcript");
        const wasNearBottom = transcript.scrollTop + transcript.clientHeight >= transcript.scrollHeight - 24;
        const state = latestStatus.status || "idle";

        document.getElementById("subtitle").textContent = logs.message || latestStatus.message || "ready";
        document.getElementById("recent-logs").textContent = countLabel(logs.recentLogCount, "log");
        document.getElementById("all-logs").textContent = countLabel(logs.logCount, "log");
        document.getElementById("log-size").textContent = bytesLabel(logs.sizeBytes);
        document.getElementById("task-state").textContent = state;
        document.getElementById("task-state").className = `metric-value ${state}`;
        document.getElementById("message").textContent = latestStatus.message || logs.message || "";
        document.getElementById("log-dir").textContent = logs.logDir || "";
        document.getElementById("report-path").textContent = logs.reportPath || "";
        document.getElementById("patch-path").textContent = logs.dryRunPatchPath || "";
        renderWorktrees(latestStatus.worktrees || []);
        renderArtifacts(latestStatus);

        const recent = Number(logs.recentLogCount) || 0;
        const reviewButton = document.getElementById("run-review");
        const applyButton = document.getElementById("run-apply");
        const clearButton = document.getElementById("clear-reviewed");
        reviewButton.disabled = !!latestStatus.running || recent <= 0;
        applyButton.disabled = !!latestStatus.running || recent <= 0;
        clearButton.disabled = !!latestStatus.running || recent <= 0;
        reviewButton.textContent = latestStatus.running && latestStatus.dryRun ? "Reviewing..." : "Review logs";
        applyButton.textContent = latestStatus.running && !latestStatus.dryRun ? "Generating..." : "Generate proposal";

        transcript.textContent = latestStatus.logTail || "No task output yet.";
        if (wasNearBottom || latestStatus.running) {
            transcript.scrollTop = transcript.scrollHeight;
        }
    }

    function renderWorktrees(worktrees) {
        const summary = document.getElementById("worktree-summary");
        const list = document.getElementById("worktree-list");
        const proposals = Array.isArray(worktrees) ? worktrees : [];
        summary.textContent = proposals.length ? countLabel(proposals.length, "proposal") : "none";
        list.innerHTML = proposals.map((proposal) => {
            const id = escapeHtml(proposal.id || "");
            const label = escapeHtml(proposal.label || proposal.taskName || "generated proposal");
            const status = escapeHtml(proposal.status || "created");
            const branch = escapeHtml(proposal.branch || "");
            const path = escapeHtml(proposal.path || "");
            const message = escapeHtml(proposal.message || "");
            const canMerge = status !== "merged";
            return `
                <div class="worktree-row">
                    <div>
                        <div class="worktree-title">
                            <span class="worktree-id">${id}</span>
                            <span>${label}</span>
                            <span class="worktree-status">${status}</span>
                        </div>
                        <div class="worktree-path">${path}</div>
                        <div class="worktree-path">${branch}${message ? ` · ${message}` : ""}</div>
                    </div>
                    <div class="worktree-actions">
                        <button type="button" data-worktree-action="restart" data-worktree-id="${id}">Try</button>
                        <button type="button" data-worktree-action="merge" data-worktree-id="${id}" ${canMerge ? "" : "disabled"}>Merge</button>
                        <button type="button" data-worktree-action="delete" data-worktree-id="${id}">Delete</button>
                    </div>
                </div>
            `;
        }).join("");
    }

    async function refresh() {
        try {
            const response = await fetch("/api/ai-tool-use-improvement", { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            render(await response.json());
        } catch (error) {
            render({
                status: "failed",
                message: error?.message || "Could not load AI tool-use improvement status.",
                logs: latestStatus?.logs || {},
                logTail: latestStatus?.logTail || ""
            });
        }
    }

    async function run(dryRun) {
        const button = dryRun ? document.getElementById("run-review") : document.getElementById("run-apply");
        button.disabled = true;
        try {
            const response = await fetch("/api/ai-tool-use-improvement", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                cache: "no-store",
                body: JSON.stringify({ dryRun: !!dryRun, proposalCount: 1 })
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
            render(payload);
        } catch (error) {
            render({
                ...(latestStatus || {}),
                status: "failed",
                message: error?.message || "Could not start AI tool-use improvement."
            });
        }
    }

    async function clearReviewedLogs() {
        const logs = latestStatus?.logs || {};
        const recent = Number(logs.recentLogCount) || 0;
        if (recent <= 0) return;
        if (!window.confirm(`Move the ${recent} most recent reviewed AI tool I/O log(s) into an archive folder?`)) return;
        const button = document.getElementById("clear-reviewed");
        button.disabled = true;
        try {
            const response = await fetch("/api/ai-tool-use-improvement/clear-reviewed", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                cache: "no-store",
                body: JSON.stringify({ recentOnly: true })
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
            render(payload);
        } catch (error) {
            render({
                ...(latestStatus || {}),
                status: "failed",
                message: error?.message || "Could not move reviewed AI tool I/O logs."
            });
        }
    }

    async function worktreeAction(action, id) {
        if (!id) return;
        if (action === "delete" && !window.confirm(`Delete generated worktree ${id}?`)) return;
        if (action === "merge" && !window.confirm(`Fast-forward merge generated worktree ${id} into this checkout?`)) return;
        if (action === "restart" && !window.confirm(`Restart Field from generated worktree ${id}?`)) return;
        try {
            const response = await fetch(`/api/agent-worktrees/${encodeURIComponent(action)}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                cache: "no-store",
                body: JSON.stringify({ id })
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
            await refresh();
        } catch (error) {
            render({
                ...(latestStatus || {}),
                status: "failed",
                message: error?.message || `Could not ${action} generated worktree.`
            });
        }
    }

    function connectEvents() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
        try {
            socket = new WebSocket(websocketUrl());
        } catch (_) {
            setTimeout(connectEvents, 1500);
            return;
        }
        socket.addEventListener("message", refresh);
        socket.addEventListener("close", () => {
            socket = null;
            setTimeout(connectEvents, 1500);
        });
        socket.addEventListener("error", () => {
            try { socket?.close(); } catch (_) {}
        });
    }

    document.getElementById("run-review").addEventListener("click", () => run(true));
    document.getElementById("run-apply").addEventListener("click", () => run(false));
    document.getElementById("clear-reviewed").addEventListener("click", clearReviewedLogs);
    document.getElementById("show-report").addEventListener("click", () => {
        artifactMode = "report";
        renderArtifacts(latestStatus || {});
    });
    document.getElementById("show-patch").addEventListener("click", () => {
        artifactMode = "patch";
        renderArtifacts(latestStatus || {});
    });
    document.getElementById("worktree-list").addEventListener("click", (event) => {
        const button = event.target.closest("[data-worktree-action]");
        if (!button) return;
        worktreeAction(button.getAttribute("data-worktree-action") || "", button.getAttribute("data-worktree-id") || "");
    });
    refresh();
    connectEvents();
    setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
