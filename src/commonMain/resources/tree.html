<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Inspector — Tree</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The `tree(...)` embed (afield/outputs.kt -> /tree, protocol in afield/server/browsing.kt).
      Entries arrive as [name, id, kind, type, summary, flag, path]; kind lets a row draw its twisty
      without opening the child, and a directory longer than one page ends in a "more" row. path is
      the row's afield.graphquery address from the root ("" when none reaches it): `p` copies it, and
      a filter containing / * or | is run server-side as graphPaths(...) (op "query").
      Colours come from field.css tokens so the embed matches the panel it sits in.
    -->
    <link rel="stylesheet" href="/iosevka.css">
    <link rel="stylesheet" href="/field.css">
    <style>
        :root{
            --bg:        var(--field-surface, #000);
            --fg:        var(--field-fg, #ddd);
            --fg-strong: var(--field-fg-strong, #fff);
            --muted:     var(--field-fg-dim, rgba(255,255,255,.53));
            --soft:      var(--field-fg-soft, rgba(255,255,255,.74));
            --accent:    rgb(var(--field-accent-rgb, 72,201,255));
            --danger:    rgb(var(--field-danger-rgb, 255,80,80));
            --warning:   rgb(var(--field-warning-rgb, 235,150,70));
            --hover:     rgba(255,255,255,0.07);
            --selected:  rgba(var(--field-accent-rgb, 72,201,255), 0.14);
            --sep:       rgba(255,255,255,0.05);
            --rail:      rgba(255,255,255,0.12);
            --indent:    14px;
            --sb-thumb:  rgba(255,255,255,.22);
            --maxh:      520px;
        }
        *{ box-sizing:border-box; font-family:"Iosevka Web",ui-monospace,Menlo,monospace; outline:none; }
        body{ margin:0; background:var(--bg); color:var(--fg); font-weight:300; font-size:12px; line-height:1.2; }

        /* The header stays at the top of whatever scrolls: the page itself when /tree is opened on
           its own, and the rows below it (#tree, capped at --maxh) inside an output panel. */
        #bar{
            display:flex; align-items:center; gap:8px; padding:4px 6px; border-bottom:1px solid var(--sep);
            position:sticky; top:0; z-index:3; background:var(--bg);
        }
        #rootType{ color:var(--accent); white-space:nowrap; flex:0 0 auto; }
        /* Never squeezed to "6 e…": the filter gives way first. */
        #rootSummary{ color:var(--muted); white-space:nowrap; flex:0 0 auto; }
        #filter{
            flex:0 1 200px; min-width:70px; margin-left:auto; background:rgba(255,255,255,0.06); color:var(--fg);
            border:1px solid transparent; border-radius:3px; padding:2px 6px; font-size:11px;
        }
        #filter:focus{ border-color: rgba(var(--field-accent-rgb, 72,201,255), .5); }
        #status{ color:var(--muted); font-size:10px; white-space:nowrap; }
        #status.bad{ color:var(--danger); }

        #tree, #results{ list-style:none; margin:0; padding:2px 0; max-height:calc(100vh - 30px); overflow:auto; }
        html[data-afield-output-iframe="true"] #tree,
        html[data-afield-output-iframe="true"] #results{ max-height: var(--maxh); }
        #tree[hidden], #results[hidden]{ display:none; }
        .qrow .name{ color:var(--fg-strong); }
        .qhead{ color:var(--muted); font-size:10px; padding:3px 8px; }
        #filter.query{ color:var(--accent); }
        #tree, #tree *, #results, #results *{ scrollbar-width:thin; scrollbar-color:var(--sb-thumb) transparent; }
        ul.children{ list-style:none; margin:0; padding:0; position:relative; }
        li.node{ list-style:none; margin:0; padding:0; }
        li.node.filtered-out{ display:none; }

        .row{
            position:relative; display:flex; align-items:baseline; gap:6px;
            padding:3px 8px 3px calc(8px + var(--depth, 0) * var(--indent));
            min-height:22px; cursor:default; user-select:none; white-space:nowrap;
        }
        .row:hover{ background:var(--hover); }
        .row.selected{ background:var(--selected); }
        .row.selected::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--accent); }
        .row[data-depth]:not([data-depth="0"])::after{
            content:""; position:absolute; top:0; bottom:0; width:1px; background:var(--rail);
            left: calc(12px + (var(--depth) - 1) * var(--indent));
        }

        .tw{ flex:0 0 10px; width:10px; height:10px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); }
        .row[data-kind="dir"] .tw::before{
            content:""; border-top:4px solid transparent; border-bottom:4px solid transparent; border-left:6px solid currentColor;
            transition: transform .12s ease;
        }
        .row.open[data-kind="dir"] .tw::before{ transform: rotate(90deg); }
        .row[data-kind="leaf"] .tw::before{ content:"·"; }
        .row:hover .tw{ color:var(--fg-strong); }

        .name{ color:var(--fg); flex:0 0 auto; }
        .row[data-kind="dir"] .name{ color:var(--fg-strong); }
        .type{ color:var(--muted); font-size:10px; flex:0 0 auto; }
        .summary{ color:var(--soft); overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; min-width:0; }
        .row.open .summary{ color:var(--muted); }
        .row[data-flag="cycle"] .summary{ color:var(--warning); }
        .row[data-flag="error"] .summary, .row[data-flag="error"] .name{ color:var(--danger); }

        .copy{
            flex:0 0 auto; visibility:hidden; border:none; background:transparent; color:var(--muted);
            cursor:pointer; font-size:10px; padding:0 2px;
        }
        .row:hover .copy, .row.selected .copy{ visibility:visible; }
        .row:not([data-path]) .copy.path, .row[data-path=""] .copy.path{ display:none; }
        .copy:hover{ color:var(--fg-strong); }
        .copy.done{ color:var(--accent); visibility:visible; }

        .leaf{
            margin:2px 8px 6px calc(26px + var(--depth, 0) * var(--indent));
            padding:4px 6px; border-left:2px solid var(--rail);
            background:rgba(255,255,255,0.03); color:var(--fg);
            max-height:240px; overflow:auto; font-size:11px; white-space:pre-wrap; word-break:break-word;
        }
        .more{ color:var(--accent); cursor:pointer; }
        .more:hover{ text-decoration:underline; }
        .hint{ color:var(--muted); font-style:italic; padding:3px 8px 3px calc(26px + var(--depth, 0) * var(--indent)); }
        .err{ color:var(--danger); padding:6px 8px; white-space:pre-wrap; }
        .inspector-error{ color:var(--danger); }

        .tostr .tok.word { color: var(--fg); }
        .tostr .tok.sym  { color: rgba(220,230,255,.85); }
        .tostr .tok.num  { color: rgba(255,235,200,.95); }
        .tostr .tok.punc { opacity:.7; }
    </style>
</head>
<body>
<div id="bar">
    <span id="rootType"></span><span id="rootSummary"></span>
    <input id="filter" type="search" placeholder="filter, or **/name  /" aria-label="Filter rows, or a graphPaths query" title="Text filters this level; a pattern with / * or | runs graphPaths from the root" spellcheck="false">
    <span id="status">connecting…</span>
</div>
<ul id="tree" role="tree" tabindex="0" aria-label="Inspector tree"></ul>
<ul id="results" role="listbox" tabindex="0" aria-label="Query matches" hidden></ul>

<script src="/iframe_autosize.js"></script>
<script>
(() => {
    const params = new URLSearchParams(location.search);
    const ROOT_TOKEN = params.get('root');
    if (params.get('maxh')) document.documentElement.style.setProperty('--maxh', parseInt(params.get('maxh'), 10) + 'px');

    const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
    const CHANNEL = "__browsing__";
    const treeEl = document.getElementById('tree');
    const statusEl = document.getElementById('status');
    const filterEl = document.getElementById('filter');
    const rootTypeEl = document.getElementById('rootType');
    const rootSummaryEl = document.getElementById('rootSummary');
    const resultsEl = document.getElementById('results');

    let ws, reqSeq = 1, rootId = null;
    const pending = new Map();
    const watched = new Set();

    function setStatus(text, bad=false){ statusEl.textContent = text; statusEl.classList.toggle('bad', bad); }

    function connect(){
        ws = new WebSocket(WS_URL);
        setStatus('connecting…');
        ws.onopen = () => { setStatus(''); refreshAll(); };
        ws.onmessage = (ev) => {
            let msg; try { msg = JSON.parse(ev.data); } catch { return; }
            if (msg.reqId && pending.has(msg.reqId)) { const r = pending.get(msg.reqId); pending.delete(msg.reqId); r(msg); return; }
            if (msg.type === 'changed' && msg.nodeId) onChanged(msg.nodeId);
        };
        ws.onclose = () => { setStatus('disconnected — retrying', true); watched.clear(); setTimeout(connect, 1200); };
        ws.onerror = () => setStatus('connection error', true);
    }
    function sendReq(op, payload = {}){
        const reqId = String(reqSeq++);
        return new Promise((resolve) => {
            pending.set(reqId, resolve);
            try { ws.send(JSON.stringify({ channel: CHANNEL, op, reqId, ...payload })); }
            catch (e) { pending.delete(reqId); resolve({ ok:false, error:String(e) }); }
        });
    }
    function fireAndForget(op, payload = {}){
        try { ws && ws.readyState === 1 && ws.send(JSON.stringify({ channel: CHANNEL, op, reqId: String(reqSeq++), ...payload })); } catch {}
    }
    async function open(id){
        const resp = await sendReq('open', { id, watch: true });
        if (resp && resp.ok) watched.add(id);
        return resp;
    }
    function unwatch(id){ if (watched.delete(id)) fireAndForget('unsubscribe', { id }); }

    const entry = (p) => ({ name: p[0], id: p[1], kind: p[2] || null, type: p[3] || '', summary: p[4] ?? '', flag: p[5] || '', path: p[6] ?? null });

    // ---------------------------------------------------------------- rows
    function makeRow(e, depth){
        const li = document.createElement('li'); li.className = 'node';
        const row = document.createElement('div'); row.className = 'row';
        row.dataset.id = e.id; row.dataset.name = e.name; row.dataset.depth = String(depth);
        if (e.path != null) row.dataset.path = e.path;
        row.style.setProperty('--depth', depth);
        if (e.kind) row.dataset.kind = e.kind;
        if (e.flag) row.dataset.flag = e.flag;
        row.setAttribute('role', 'treeitem'); row.setAttribute('aria-level', String(depth + 1));
        if (e.kind === 'dir') row.setAttribute('aria-expanded', 'false');

        const tw = document.createElement('span'); tw.className = 'tw';
        const name = document.createElement('span'); name.className = 'name'; name.textContent = e.name;
        const type = document.createElement('span'); type.className = 'type'; type.textContent = e.type;
        const summary = document.createElement('span'); summary.className = 'summary'; summary.textContent = e.summary;
        summary.title = e.summary;
        if (e.path) name.title = e.path;
        const copy = document.createElement('button'); copy.className = 'copy'; copy.textContent = 'copy'; copy.title = 'Copy value (c)';
        const copyPath = document.createElement('button'); copyPath.className = 'copy path'; copyPath.textContent = 'path'; copyPath.title = 'Copy graphPath (p)';
        row.append(tw, name, type, summary, copyPath, copy);
        li.appendChild(row);

        tw.addEventListener('click', (ev) => { ev.stopPropagation(); selectRow(row); toggleRow(row); });
        row.addEventListener('click', () => selectRow(row));
        row.addEventListener('dblclick', () => toggleRow(row));
        copy.addEventListener('click', (ev) => { ev.stopPropagation(); copyRow(row); });
        copyPath.addEventListener('click', (ev) => { ev.stopPropagation(); copyPathOf(row); });
        if (!e.kind) probeKind(row);
        return li;
    }
    async function probeKind(row){
        // Servers older than the [name,id,kind,...] rows send pairs; ask the child what it is.
        const resp = await sendReq('open', { id: row.dataset.id, watch: false });
        if (resp && resp.ok) row.dataset.kind = resp.type === 'dir' ? 'dir' : 'leaf';
    }
    const liOf = (row) => row.closest('li.node');
    const rowFor = (id) => treeEl.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
    const isOpen = (row) => row.classList.contains('open');

    function selectRow(row, {focus=true} = {}){
        treeEl.querySelectorAll('.row.selected').forEach(r => r.classList.remove('selected'));
        row.classList.add('selected');
        row.scrollIntoView({ block:'nearest' });
        if (focus) treeEl.focus({ preventScroll:true });
    }

    function fillDir(ul, resp, depth, append=false){
        if (!append) ul.innerHTML = '';
        ul.querySelector(':scope > li.more-li')?.remove();
        const entries = (resp.entries || []).map(entry);
        if (!entries.length && !append){
            const hint = document.createElement('li'); hint.className = 'hint'; hint.style.setProperty('--depth', depth); hint.textContent = 'empty';
            ul.appendChild(hint);
        }
        entries.forEach(e => ul.appendChild(makeRow(e, depth)));
        if (resp.more){
            const shown = (resp.offset || 0) + entries.length;
            const li = document.createElement('li'); li.className = 'node more-li';
            const row = document.createElement('div'); row.className = 'row more-row'; row.style.setProperty('--depth', depth);
            row.dataset.more = resp.id; row.dataset.offset = String(shown); row.dataset.depth = String(depth);
            const tw = document.createElement('span'); tw.className = 'tw';
            const label = document.createElement('span'); label.className = 'more';
            label.textContent = resp.total != null ? `show more — ${shown} of ${resp.total}` : `show more — ${shown} shown`;
            row.append(tw, label);
            row.addEventListener('click', () => loadMore(row, ul));
            li.appendChild(row); ul.appendChild(li);
        }
        applyFilter();
    }
    async function loadMore(moreRow, ul){
        const resp = await sendReq('more', { id: moreRow.dataset.more, offset: parseInt(moreRow.dataset.offset, 10) });
        if (!resp || !resp.ok){ setStatus(resp?.error || 'more failed', true); return; }
        const added = (resp.entries || []).length;
        fillDir(ul, resp, parseInt(moreRow.dataset.depth, 10), true);
        if (added){ const rows = ul.querySelectorAll(':scope > li > .row:not(.more-row)'); selectRow(rows[rows.length - added]); }
    }

    async function expandRow(row){
        const li = liOf(row);
        const resp = await open(row.dataset.id);
        if (!resp || !resp.ok){ showLeaf(row, `<span class="inspector-error">${escapeHtml(resp?.error || 'failed')}</span>`, ''); row.classList.add('open'); return; }
        const depth = parseInt(row.dataset.depth, 10);
        row.classList.add('open'); row.setAttribute('aria-expanded', 'true');
        if (resp.type === 'dir'){
            row.dataset.kind = 'dir';
            let ul = li.querySelector(':scope > ul.children');
            if (!ul){ ul = document.createElement('ul'); ul.className = 'children'; ul.setAttribute('role', 'group'); li.appendChild(ul); }
            fillDir(ul, resp, depth + 1);
        } else {
            row.dataset.kind = 'leaf';
            showLeaf(row, resp.html ?? '', resp.value ?? '');
        }
    }
    function showLeaf(row, html, value){
        const li = liOf(row);
        let lv = li.querySelector(':scope > .leaf');
        if (!lv){ lv = document.createElement('div'); lv.className = 'leaf'; li.appendChild(lv); }
        lv.style.setProperty('--depth', row.dataset.depth);
        lv.innerHTML = String(html);
        row.dataset.value = value;
    }
    function collapseRow(row){
        const li = liOf(row);
        li.querySelectorAll('.row').forEach(r => { if (r.dataset.id) unwatch(r.dataset.id); });
        li.querySelector(':scope > ul.children')?.remove();
        li.querySelector(':scope > .leaf')?.remove();
        row.classList.remove('open');
        if (row.dataset.kind === 'dir') row.setAttribute('aria-expanded', 'false');
    }
    function toggleRow(row){ if (row.dataset.more) return; isOpen(row) ? collapseRow(row) : expandRow(row); }

    // ---------------------------------------------------------------- copy
    async function copyRow(row){
        let text = row.dataset.value;
        if (text == null || text === ''){
            if (row.dataset.kind === 'leaf'){
                const resp = await sendReq('open', { id: row.dataset.id, watch: false });
                text = resp && resp.ok ? (resp.value ?? '') : '';
            } else {
                text = `${row.dataset.name}: ${row.querySelector('.summary')?.textContent || ''}`;
            }
        }
        try { await navigator.clipboard.writeText(text); }
        catch {
            const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch {} ta.remove();
        }
        const b = row.querySelector('.copy'); if (b){ b.textContent = 'copied'; b.classList.add('done'); setTimeout(() => { b.textContent = 'copy'; b.classList.remove('done'); }, 900); }
        window.__lastCopied = text;
    }

    async function writeClipboard(text){
        try { await navigator.clipboard.writeText(text); }
        catch {
            const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch {} ta.remove();
        }
        window.__lastCopied = text;
    }
    async function copyPathOf(row){
        const path = row.dataset.path;
        if (!path){ setStatus('no path reaches this row'); setTimeout(() => setStatus(''), 1500); return; }
        await writeClipboard(path);
        const b = row.querySelector('.copy.path'); if (b){ b.textContent = 'copied'; b.classList.add('done'); setTimeout(() => { b.textContent = 'path'; b.classList.remove('done'); }, 900); }
    }

    // ---------------------------------------------------------------- query (graphPaths)
    // Text with / * or | is a graphPaths() pattern, run from the root; anything else filters rows.
    const isQuery = (q) => /[\/*|]/.test(q);
    let queryTimer = null, querySeq = 0;
    function showResults(on){
        resultsEl.hidden = !on; treeEl.hidden = on;
        filterEl.classList.toggle('query', on);
    }
    function runQuery(q){
        clearTimeout(queryTimer);
        queryTimer = setTimeout(async () => {
            const mine = ++querySeq;
            const resp = await sendReq('query', { id: rootId, query: q });
            if (mine !== querySeq || !isQuery(filterEl.value.trim())) return;
            resultsEl.innerHTML = '';
            const head = document.createElement('li'); head.className = 'qhead';
            if (!resp || !resp.ok){
                head.className = 'err'; head.textContent = resp?.error || 'query failed';
                resultsEl.appendChild(head); return;
            }
            const n = resp.matches.length;
            head.textContent = resp.total === 0 ? `no paths match ${q}`
                : `${resp.total} ${resp.total === 1 ? 'match' : 'matches'}${n < resp.total ? `, first ${n}` : ''}${resp.truncated ? ' (walk stopped early)' : ''} — Enter reveals`;
            resultsEl.appendChild(head);
            resp.matches.forEach(m => {
                const li = document.createElement('li'); li.className = 'node';
                const row = document.createElement('div'); row.className = 'row qrow'; row.dataset.path = m[0]; row.dataset.kind = m[1] || 'leaf';
                row.style.setProperty('--depth', 0); row.setAttribute('role', 'option');
                const tw = document.createElement('span'); tw.className = 'tw';
                const name = document.createElement('span'); name.className = 'name'; name.textContent = m[0];
                const type = document.createElement('span'); type.className = 'type'; type.textContent = m[2] || '';
                const summary = document.createElement('span'); summary.className = 'summary'; summary.textContent = m[3] || ''; summary.title = m[3] || '';
                const copyPath = document.createElement('button'); copyPath.className = 'copy path'; copyPath.textContent = 'path'; copyPath.title = 'Copy graphPath (p)';
                row.append(tw, name, type, summary, copyPath);
                row.addEventListener('click', () => selectResult(row));
                row.addEventListener('dblclick', () => revealResult(row));
                copyPath.addEventListener('click', (ev) => { ev.stopPropagation(); copyPathOf(row); });
                li.appendChild(row); resultsEl.appendChild(li);
            });
            const first = resultsEl.querySelector('.qrow'); if (first) selectResult(first, {focus:false});
        }, 180);
    }
    function selectResult(row, {focus=true} = {}){
        resultsEl.querySelectorAll('.row.selected').forEach(r => r.classList.remove('selected'));
        row.classList.add('selected'); row.scrollIntoView({ block:'nearest' });
        if (focus) resultsEl.focus({ preventScroll:true });
    }
    async function revealResult(row){
        const path = row.dataset.path;
        filterEl.value = ''; showResults(false); applyFilter();
        await revealPath(path);
    }
    /** Open the tree along a graphPath, paging a long directory until the next segment appears. */
    async function revealPath(path){
        const segs = path.split('/');
        let scope = treeEl, row = null;
        for (let i = 0; i < segs.length; i++){
            const want = segs.slice(0, i + 1).join('/').toLowerCase();
            const find = () => Array.from(scope.querySelectorAll(':scope > li > .row')).find(r => (r.dataset.path || '').toLowerCase() === want);
            row = find();
            for (let pages = 0; !row && pages < 100; pages++){
                const more = scope.querySelector(':scope > li.more-li > .row');
                if (!more) break;
                await loadMore(more, scope);
                row = find();
            }
            if (!row){ setStatus(`not found: ${segs.slice(0, i + 1).join('/')}`, true); return false; }
            if (i < segs.length - 1){
                if (!isOpen(row)) await expandRow(row);
                const next = liOf(row).querySelector(':scope > ul.children');
                if (!next) return false;
                scope = next;
            }
        }
        if (row) selectRow(row);
        return true;
    }
    window.inspectorRevealPath = revealPath;

    // ---------------------------------------------------------------- filter
    function applyFilter(){
        const raw = filterEl.value.trim();
        if (isQuery(raw)){ showResults(true); return; }
        showResults(false);
        const q = raw.toLowerCase();
        treeEl.querySelectorAll('li.node').forEach(li => li.classList.remove('filtered-out'));
        if (!q) return;
        // A row stays when it, or anything opened beneath it, matches. Deepest first.
        const lis = Array.from(treeEl.querySelectorAll('li.node')).reverse();
        const keep = new Set();
        for (const li of lis){
            const row = li.querySelector(':scope > .row');
            if (!row || row.dataset.more) { keep.add(li); continue; }
            const hay = (row.dataset.name + ' ' + (row.querySelector('.summary')?.textContent || '') + ' ' + (row.querySelector('.type')?.textContent || '')).toLowerCase();
            const childKept = Array.from(li.querySelectorAll(':scope > ul.children > li.node:not(.more-li)')).some(c => keep.has(c));
            if (hay.includes(q) || childKept) keep.add(li); else li.classList.add('filtered-out');
        }
    }
    filterEl.addEventListener('input', () => { applyFilter(); const q = filterEl.value.trim(); if (isQuery(q)) runQuery(q); });
    filterEl.addEventListener('keydown', (e) => {
        if (e.key === 'Escape'){ filterEl.value = ''; applyFilter(); treeEl.focus(); e.preventDefault(); }
        if (!resultsEl.hidden){
            const sel = resultsEl.querySelector('.row.selected') || resultsEl.querySelector('.qrow');
            if (e.key === 'Enter' && sel){ e.preventDefault(); revealResult(sel); }
            if (e.key === 'ArrowDown' && sel){ e.preventDefault(); selectResult(sel); }
            return;
        }
        if (e.key === 'Enter' || e.key === 'ArrowDown'){ const r = visibleRows()[0]; if (r) selectRow(r); e.preventDefault(); }
    });

    // ---------------------------------------------------------------- live update
    const busy = new Set(), again = new Set();
    async function onChanged(id){
        if (id === rootId){ return refreshAll(); }
        const row = rowFor(id);
        if (!row || !isOpen(row)) return;
        if (busy.has(id)){ again.add(id); return; }
        busy.add(id);
        try { await reopen(row); } finally { busy.delete(id); }
        if (again.delete(id)) onChanged(id);
    }
    function openPaths(container){
        // Names of the open rows beneath `container`, as paths, so a re-list can re-open them.
        const out = [];
        container.querySelectorAll('.row.open').forEach(r => {
            const names = []; let li = liOf(r);
            while (li && container.contains(li) && li !== container){
                names.unshift(li.querySelector(':scope > .row').dataset.name);
                li = li.parentElement?.closest('li.node');
                if (li && !container.contains(li)) break;
            }
            out.push(names);
        });
        return out;
    }
    async function reopenUnder(ul, paths){
        for (const p of paths.sort((a,b) => a.length - b.length)){
            let scope = ul;
            for (const nm of p){
                const row = Array.from(scope.querySelectorAll(':scope > li > .row')).find(r => r.dataset.name === nm);
                if (!row) break;
                if (!isOpen(row)) await expandRow(row);
                const next = liOf(row).querySelector(':scope > ul.children');
                if (!next) break;
                scope = next;
            }
        }
    }
    async function reopen(row){
        const li = liOf(row);
        const ul = li.querySelector(':scope > ul.children');
        const paths = ul ? openPaths(ul) : [];
        const sel = treeEl.querySelector('.row.selected')?.dataset.id;
        const scroll = treeEl.scrollTop;
        await expandRow(row);
        const ul2 = li.querySelector(':scope > ul.children');
        if (ul2) await reopenUnder(ul2, paths);
        if (sel){ const r = rowFor(sel); if (r) selectRow(r, {focus:false}); }
        treeEl.scrollTop = scroll;
    }

    // ---------------------------------------------------------------- roots
    let firstLoad = true;
    async function refreshAll(){
        const paths = openPaths(treeEl);
        const selName = treeEl.querySelector('.row.selected')?.dataset.name;
        const scroll = treeEl.scrollTop;
        Array.from(watched).forEach(id => unwatch(id));
        const resp = await sendReq('getRoots', ROOT_TOKEN ? { root: ROOT_TOKEN } : {});
        if (!resp || !resp.ok){ showError(resp?.error || 'failed to load'); return; }
        treeEl.innerHTML = '';
        rootTypeEl.textContent = resp.valueType || '';
        if (resp.type === 'dir'){
            rootId = resp.id;
            if (resp.id){ fireAndForget('open', { id: resp.id, watch: true }); watched.add(resp.id); }
            rootSummaryEl.textContent = resp.total != null ? `${resp.total} ${resp.total === 1 ? 'entry' : 'entries'}` : '';
            fillDir(treeEl, resp, 0);
            if (paths.length) await reopenUnder(treeEl, paths);
            else if (firstLoad && (resp.entries || []).length === 1){
                const only = treeEl.querySelector('.row');
                if (only && only.dataset.kind === 'dir') await expandRow(only);
            }
        } else {
            rootId = resp.nodeId;
            rootSummaryEl.textContent = '';
            const leaf = document.createElement('div'); leaf.className = 'leaf'; leaf.style.margin = '4px 8px';
            leaf.innerHTML = String(resp.html ?? ''); treeEl.appendChild(leaf);
        }
        firstLoad = false;
        const sel = selName && Array.from(treeEl.querySelectorAll('.row')).find(r => r.dataset.name === selName);
        const target = sel || treeEl.querySelector('.row');
        if (target) selectRow(target, {focus:false});
        treeEl.scrollTop = scroll;
    }
    function showError(err){
        treeEl.innerHTML = '';
        const d = document.createElement('div'); d.className = 'err'; d.textContent = String(err ?? 'unknown error');
        treeEl.appendChild(d);
        setStatus('error', true);
    }

    // ---------------------------------------------------------------- keyboard
    const visibleRows = () => Array.from(treeEl.querySelectorAll('.row')).filter(r => r.offsetParent !== null);
    function step(from, delta){
        const rows = visibleRows(); if (!rows.length) return null;
        let i = rows.indexOf(from); if (i < 0) i = 0;
        return rows[Math.max(0, Math.min(rows.length - 1, i + delta))];
    }
    function parentRow(row){ return liOf(row)?.parentElement?.closest('li.node')?.querySelector(':scope > .row') || null; }

    document.addEventListener('keydown', async (e) => {
        if (e.target === filterEl) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const sel = treeEl.querySelector('.row.selected') || visibleRows()[0];
        if (e.key === '/'){ e.preventDefault(); filterEl.focus(); filterEl.select(); return; }
        if (!resultsEl.hidden){
            const rs = Array.from(resultsEl.querySelectorAll('.qrow'));
            const cur = resultsEl.querySelector('.row.selected');
            const i = Math.max(0, rs.indexOf(cur));
            switch (e.key){
                case 'ArrowDown': e.preventDefault(); if (rs.length) selectResult(rs[Math.min(rs.length - 1, i + 1)]); break;
                case 'ArrowUp':   e.preventDefault(); if (rs.length) selectResult(rs[Math.max(0, i - 1)]); break;
                case 'Enter': case 'ArrowRight': e.preventDefault(); if (cur) revealResult(cur); break;
                case 'p': e.preventDefault(); if (cur) copyPathOf(cur); break;
                case 'Escape': e.preventDefault(); filterEl.value = ''; applyFilter(); treeEl.focus(); break;
            }
            return;
        }
        if (!sel) return;
        switch (e.key){
            case 'ArrowDown': e.preventDefault(); { const n = step(sel, +1); if (n) selectRow(n); } break;
            case 'ArrowUp':   e.preventDefault(); { const n = step(sel, -1); if (n) selectRow(n); } break;
            case 'Home':      e.preventDefault(); { const r = visibleRows()[0]; if (r) selectRow(r); } break;
            case 'End':       e.preventDefault(); { const rs = visibleRows(); if (rs.length) selectRow(rs[rs.length-1]); } break;
            case 'ArrowRight': e.preventDefault();
                if (sel.dataset.more) { sel.click(); break; }
                if (!isOpen(sel)) await expandRow(sel);
                else { const c = liOf(sel).querySelector(':scope > ul.children > li > .row'); if (c) selectRow(c); }
                break;
            case 'Enter': e.preventDefault(); sel.dataset.more ? sel.click() : toggleRow(sel); break;
            case 'ArrowLeft': e.preventDefault();
                if (isOpen(sel)) collapseRow(sel); else { const p = parentRow(sel); if (p) selectRow(p); }
                break;
            case 'c': e.preventDefault(); if (!sel.dataset.more) copyRow(sel); break;
            case 'p': e.preventDefault(); if (!sel.dataset.more) copyPathOf(sel); break;
            case 'r': e.preventDefault(); refreshAll(); break;
            case 'Escape': if (filterEl.value){ filterEl.value = ''; applyFilter(); } break;
        }
    });

    function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    window.addEventListener('beforeunload', () => { watched.forEach(id => fireAndForget('unsubscribe', { id })); });
    // Probe for agents and UI regressions.
    window.inspectorTreeState = () => ({
        rows: treeEl.querySelectorAll('.row:not(.more-row)').length,
        visible: visibleRows().filter(r => !r.dataset.more).length,
        more: Array.from(treeEl.querySelectorAll('.more')).map(m => m.textContent),
        watched: watched.size,
        status: statusEl.textContent,
        root: rootTypeEl.textContent + ' ' + rootSummaryEl.textContent,
        rowsByName: Object.fromEntries(Array.from(treeEl.querySelectorAll('.row:not(.more-row)')).slice(0, 60).map(r =>
            [r.dataset.name, { kind: r.dataset.kind, type: r.querySelector('.type')?.textContent, summary: r.querySelector('.summary')?.textContent, flag: r.dataset.flag || '', path: r.dataset.path ?? null }])),
        selected: treeEl.querySelector('.row.selected')?.dataset.path ?? null,
        query: resultsEl.hidden ? null : Array.from(resultsEl.children).map(li => li.querySelector('.name')?.textContent || li.textContent).slice(0, 40),
    });
    connect();
})();
</script>
</body>
