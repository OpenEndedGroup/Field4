<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Field presenter controls</title><link rel="stylesheet" href="/iosevka.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#eee;font-family:'Iosevka Web',Iosevka,monospace;padding:24px}h1{font-size:18px;font-weight:400;margin:0 0 24px}button{font:inherit;background:#111;border:1px solid #555;color:#eee;padding:12px 16px;cursor:pointer}button:hover{background:#222}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:2px solid white}#status{color:#aaa;margin:20px 0}#slides{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}#slides button.active{background:#eee;color:#000}[hidden]{display:none!important}.row{display:flex;flex-wrap:wrap;gap:8px}#error{color:#ff9b9b;white-space:pre-wrap}#interactive-guide{margin-top:12px}
</style></head><body><h1 id="title">FIELD / PRESENT</h1><div id="status">Opening guide…</div><div class="row"><button id="previous">← Previous</button><button id="next">Next →</button><button id="reload">Refresh slide</button><button id="show-audience">Show audience</button><button id="fullscreen">Fullscreen audience</button></div><div id="slides"></div><div id="field-actions" class="row" hidden><button id="show-guide">Document notes</button><button id="run-macro" disabled>Run cue macro</button></div><div id="interactive-guide" class="row" hidden><button id="start-guide">Start document guide</button><button id="guide-previous">← Guide back</button><button id="guide-next">Guide next →</button><button id="stop-guide">Close document guide</button></div><p id="error"></p><script src="/presentation-control.js"></script></body></html>
