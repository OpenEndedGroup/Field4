<!doctype html>
<html><head><meta charset="utf-8"><title>Field presenter</title><link rel="stylesheet" href="/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#eee;font-family:'Iosevka Web',Iosevka,monospace;padding:24px;display:flex;flex-direction:column;height:100vh}h1{font-size:18px;font-weight:400;margin:0 0 16px}button,input{font:inherit;background:#111;border:1px solid #555;color:#eee;padding:10px 14px}button{cursor:pointer}button:hover,summary:hover{background:#222}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid white;outline-offset:-2px}#status{color:#aaa;margin:0 0 16px}[hidden]{display:none!important}.row{display:flex;flex-wrap:wrap;gap:8px;flex-shrink:0}#error{color:#ff9b9b;white-space:pre-wrap;margin:8px 0;flex-shrink:0}#field-actions,#interactive-guide{margin-top:12px}.picker{margin-top:20px;display:flex;flex-direction:column;min-height:100px;flex:1;border-top:1px solid #333}.search-row{display:flex;align-items:center;gap:12px;padding:12px 0;flex-shrink:0}.search-row label{color:#aaa}.search-row input{flex:1;min-width:80px}#slide-matches{color:#888;white-space:nowrap;font-size:13px}#slides{overflow:auto;min-height:0;padding-right:6px}#slides details{border-left:1px solid #333;margin-left:10px;padding-left:12px}#slides>details{margin-left:0}#slides summary{padding:10px 8px;cursor:pointer;color:#aaa}#slides summary.contains-current{color:#fff}#slides summary span:first-child{margin-left:6px}.section-range{float:right;color:#777;font-size:13px}#slides button.slide{display:flex;align-items:baseline;gap:14px;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;color:#bbb}#slides button.slide:hover{background:#191919}#slides button.slide.active{background:#eee;color:#000}.slide-number{font-size:13px;color:#777;min-width:3ch;font-variant-numeric:tabular-nums}#slides button.active .slide-number{color:#444}
</style></head><body><h1 id="title">FIELD / PRESENT</h1><div id="status" role="status">Opening guide…</div><div class="row"><button id="previous">← Previous</button><button id="next">Next →</button><button id="reload">Refresh slide</button><button id="show-audience">Show audience</button><button id="fullscreen">Fullscreen audience</button></div><div id="field-actions" class="row" hidden><button id="show-guide">Document notes</button><button id="run-macro" disabled>Run cue macro</button></div><div id="interactive-guide" class="row" hidden><button id="start-guide">Start document guide</button><button id="guide-previous">← Guide back</button><button id="guide-next">Guide next →</button><button id="stop-guide">Close document guide</button></div><div id="lesson-actions" class="row" style="margin-top:12px" hidden><button id="reset-checkpoint" hidden>Reset experiment</button><button id="run-cue" hidden>Run cue again</button></div><p id="error" role="alert"></p><nav class="picker" aria-label="Slide outline"><div class="search-row"><label for="slide-search">Find slide</label><input id="slide-search" type="search" placeholder="Title, section or number" autocomplete="off"><span id="slide-matches" role="status"></span></div><div id="slides"></div></nav><script src="/presentation-control.js"></script></body></html>
