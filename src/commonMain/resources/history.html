            function renderRailBranches(width, positions) {
                if (!transitions.length) return;
                const svg = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg",
                );
                svg.classList.add("branch-layer");
                svg.setAttribute("width", String(width));
                svg.setAttribute("height", String(RAIL_HEIGHT));
                svg.setAttribute("viewBox", `0 0 ${width} ${RAIL_HEIGHT}`);
                svg.setAttribute("preserveAspectRatio", "xMinYMin meet");
                transitions.slice(-40).forEach((transition, i) => {
                    const from = positions.get(transition.fromIndex);
                    const to = positions.get(transition.toIndex);
                    if (from == null || to == null || Math.abs(from - to) < 2)
                        return;
                    const lane = i % 3;
                    const y = RAIL_AXIS_Y;
                    const lift = 18 + lane * 8;
                    const path = document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "path",
                    );
                    path.setAttribute(
                        "d",
                        `M ${from} ${y} C ${from} ${y - lift}, ${to} ${y - lift}, ${to} ${y}`,
                    );
                    path.setAttribute("fill", "none");
                    path.setAttribute("stroke", "#4a4a4a");
                    path.setAttribute("stroke-width", "1");
                    path.setAttribute("stroke-dasharray", "3 4");
                    svg.appendChild(path);
                });
                railEl.insertBefore(svg, railEl.firstChild);
            }

            function renderNamedVersions() {
                const list = document.getElementById("named-list");
                list.innerHTML = "";
                const named = versions.filter(
                    (v) => v.message && v.message !== "Current",
                );
                if (!named.length) {
                    list.innerHTML = `<div class="empty">No named versions yet.</div>`;
                    return;
                }
                named.forEach((version) => {
                    const row = document.createElement("div");
                    row.className = "named-item";
                    row.innerHTML = `<span>#${version.index}</span><strong></strong><span class="version-meta"></span>`;
                    row.querySelector("strong").textContent = version.message;
                    row.querySelector(".version-meta").textContent =
                        versionMeta(version);
                    row.addEventListener("click", () =>
                        selectVersionByNumber(version.index),
                    );
                    list.appendChild(row);
                });
            }

            function renderTransitions() {
                const list = document.getElementById("transition-list");
                list.innerHTML = "";
                if (!transitions.length) {
                    list.innerHTML = `<div class="empty">No restore jumps recorded.</div>`;
                    return;
                }
                transitions
                    .slice(-12)
                    .reverse()
                    .forEach((transition) => {
                        const version = versions.find(
                            (candidate) =>
                                candidate.index === transition.toIndex,
                        );
                        const row = document.createElement("div");
                        row.className = "transition-item";
                        row.innerHTML = `<span>#${transition.fromIndex}</span><strong>#${transition.toIndex}</strong><span class="version-meta"></span>`;
                        row.querySelector(".version-meta").textContent = version
                            ? versionMeta(version)
                            : formatDuration(
                                  Date.now() -
                                      (Number(transition.timestamp) || 0),
                              );
                        row.addEventListener("click", () =>
                            selectVersionByNumber(transition.toIndex),
                        );
                        list.appendChild(row);
                    });
            }

            function selectVersion(index, options = {}) {
                selectedIndex = Math.max(
                    0,
                    Math.min(index, versions.length - 1),
                );
                selectedBoxes.clear();
                selectedProps.clear();
                renderVersions();
                requestDiffSoon();
                if (options.ensureVisible) {
                    ensureSelectedRailVisible();
                }
            }

            function selectVersionByNumber(versionIndex, options = {}) {
                const found = versions.findIndex(
                    (version) => version.index === versionIndex,
                );
                selectVersion(found >= 0 ? found : selectedIndex, options);
            }

            function textEditingShortcutTarget(target) {
                if (!target) return false;
                const tag = String(target.tagName || "").toLowerCase();
                if (tag === "input" || tag === "textarea" || tag === "select")
                    return true;
                if (target.isContentEditable) return true;
                return !!target.closest?.("[contenteditable='true']");
            }

            function stepDisplayedVersion(direction) {
                const visible = displayedVersions();
                if (!visible.length || !direction) return false;

                const currentVersionIndex = selectedVersionNumber();
                const currentVisibleIndex = visible.findIndex(
                    (version) => version.index === currentVersionIndex,
                );
                let nextVisibleIndex = currentVisibleIndex + direction;

                if (currentVisibleIndex < 0) {
                    const globalIndexByVersion = new Map(
                        versions.map((version, index) => [version.index, index]),
                    );
                    const currentGlobalIndex =
                        globalIndexByVersion.get(currentVersionIndex) ??
                        selectedIndex;
                    const firstAfter = visible.findIndex(
                        (version) =>
                            (globalIndexByVersion.get(version.index) ??
                                Number.POSITIVE_INFINITY) > currentGlobalIndex,
                    );
                    nextVisibleIndex =
                        direction > 0
                            ? firstAfter >= 0
                                ? firstAfter
                                : visible.length - 1
                            : firstAfter > 0
                              ? firstAfter - 1
                              : 0;
                }

                nextVisibleIndex = clamp(
                    nextVisibleIndex,
                    0,
                    visible.length - 1,
                );
                const nextVersion = visible[nextVisibleIndex];
                if (!nextVersion || nextVersion.index === currentVersionIndex)
                    return false;
                selectVersionByNumber(nextVersion.index, { ensureVisible: true });
                return true;
            }

            function handleHistoryKeydown(event) {
                if (
                    disposed ||
                    event.defaultPrevented ||
                    event.metaKey ||
                    event.ctrlKey ||
                    event.altKey ||
                    textEditingShortcutTarget(event.target)
                ) {
                    return;
                }
                const direction =
                    event.key === "ArrowLeft" || event.key === "["
                        ? -1
                        : event.key === "ArrowRight" || event.key === "]"
                          ? 1
                          : 0;
                if (!direction) return;
                if (stepDisplayedVersion(direction)) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            }

            function lineStatsText(stats) {
                const s = stats || {};
                const parts = [];
                if (s.added)
                    parts.push(`<span class="plus">+${s.added}</span>`);
                if (s.removed)
                    parts.push(`<span class="minus">-${s.removed}</span>`);
                if (s.moved) parts.push(`<span class="move">${s.moved}</span>`);
                if (s.changed)
                    parts.push(`<span class="changed">${s.changed}</span>`);
                return parts.length ? parts.join(" ") : "0";
            }

            function sumClientLineStats(items) {
                return (items || []).reduce(
                    (acc, item) => {
                        const stats = item || {};
                        acc.added += stats.added || 0;
                        acc.removed += stats.removed || 0;
                        acc.moved += stats.moved || 0;
                        acc.changed += stats.changed || 0;
                        return acc;
                    },
                    { added: 0, removed: 0, moved: 0, changed: 0 },
                );
            }

            function visibleProperties(box) {
                return (box.properties || []).filter(
                    (prop) => prop.status !== "present-only",
                );
            }

            function screenshotUrl(ref) {
                return `/history-screenshot?file=${encodeURIComponent(filename)}&path=${encodeURIComponent(ref.path || "")}`;
            }

            function renderScreenshotStrip(refs) {
                const unique = [];
                const seen = new Set();
                (refs || []).forEach((ref) => {
                    const key = `${ref.channel}\u0000${ref.path}`;
                    if (!ref.path || seen.has(key)) return;
                    seen.add(key);
                    unique.push(ref);
                });
                if (!unique.length) return null;

                const strip = document.createElement("div");
                strip.className = "screenshot-strip";
                unique.forEach((ref) => {
                    const link = document.createElement("a");
                    link.className = "screenshot-thumb";
                    link.href = screenshotUrl(ref);
                    link.target = "_blank";
                    link.rel = "noreferrer";
                    link.title = `${ref.channel} · ${ref.width || "?"}×${ref.height || "?"}`;

                    const img = document.createElement("img");
                    img.loading = "lazy";
                    img.decoding = "async";
                    img.src = link.href;
                    img.alt = ref.channel;

                    const label = document.createElement("span");
                    label.textContent = ref.channel;
                    link.appendChild(img);
                    link.appendChild(label);
                    strip.appendChild(link);
                });
                return strip;
            }

            function renderDiff() {
                if (!currentDiff) {
                    changeListEl.innerHTML = `<div class="empty">${diffPlaceholderText}</div>`;
                    document.getElementById("metric-boxes").textContent = "0";
                    document.getElementById("metric-props").textContent = "0";
                    document.getElementById("metric-lines").textContent = "0";
                    document.getElementById("change-caption").textContent =
                        "No diff loaded";
                    updateSelectionMetrics();
                    return;
                }

                const boxes = currentDiff.boxes || [];
                const visibleProps = boxes.flatMap((box) =>
                    visibleProperties(box),
                );
                const beforeCreation = isBeforeSelectedCreation();
                const floor = selectedCreationFloor();
                document.getElementById("metric-boxes").textContent =
                    currentDiff.changedBoxCount ?? boxes.length;
                document.getElementById("metric-props").textContent =
                    visibleProps.length;
                document.getElementById("metric-lines").innerHTML =
                    lineStatsText(
                        sumClientLineStats(
                            visibleProps.map((prop) => prop.lineStats),
                        ),
                    );
                document.getElementById("change-caption").textContent =
                    beforeCreation && versions[floor]
                        ? `Selected boxes first all exist at version #${versions[floor].index}`
                        : diffBasis === "previous"
                          ? `${boxes.length} boxes changed since the previous version`
                          : `${boxes.length} boxes differ from the live document`;
                const screenshotStrip = renderScreenshotStrip(
                    selectedVersion()?.activityStats?.screenshots || [],
                );

                if (!boxes.length) {
                    changeListEl.innerHTML = "";
                    if (screenshotStrip)
                        changeListEl.appendChild(screenshotStrip);
                    const empty = document.createElement("div");
                    empty.className = "empty";
                    empty.textContent = "No changes at this scrub point.";
                    changeListEl.appendChild(empty);
                    updateSelectionMetrics();
                    return;
                }

                changeListEl.innerHTML = "";
                if (screenshotStrip) changeListEl.appendChild(screenshotStrip);
                if (beforeCreation && versions[floor]) {
                    const warning = document.createElement("div");
                    warning.className = "creation-warning";
                    warning.textContent = `This selected-box scrub point is before one or more selected boxes were created. Editor previews and cherry-pick are held at version #${versions[floor].index}, where the selection first exists.`;
                    changeListEl.appendChild(warning);
                }
                boxes.forEach((box) =>
                    changeListEl.appendChild(renderBoxChange(box)),
                );
                updateSelectionMetrics();
            }

            function renderBoxChange(box) {
                const card = document.createElement("div");
                card.className = `box-card ${box.status}`;
                card.dataset.uid = box.uid;

                const head = document.createElement("div");
                head.className = "box-head";
                head.innerHTML = `
            <input type="checkbox" class="box-check">
            <div class="box-title"><strong></strong></div>
            <span class="box-uid" title="${escapeAttr(box.uid)}">${box.uid}</span>
            <span class="pill ${box.status}">${statusLabel(box.status)}</span>
            <button class="inspect-btn">Inspect</button>
        `;
                head.querySelector("strong").textContent = box.name || box.uid;
                const boxCheck = head.querySelector(".box-check");
                boxCheck.checked = selectedBoxes.has(box.uid);
                boxCheck.addEventListener("change", () => {
                    if (boxCheck.checked) {
                        selectedBoxes.add(box.uid);
                        selectedProps.delete(box.uid);
                    } else {
                        selectedBoxes.delete(box.uid);
                    }
                    renderDiff();
                });
                head.querySelector(".inspect-btn").addEventListener(
                    "click",
                    () => inspectBox(box.uid, firstTextProperty(box), box),
                );
                head.addEventListener("mouseenter", () => {
                    highlightParentDiff(box.uid);
                    showEditorPreviewForBox(box);
                });
                card.appendChild(head);

                const props = document.createElement("div");
                props.className = "props";
                visibleProperties(box).forEach((prop) =>
                    props.appendChild(renderPropertyRow(box, prop)),
                );
                card.appendChild(props);
                return card;
            }

            function renderPropertyRow(box, prop) {
                const row = document.createElement("div");
                row.className = "prop-row";
                const checked =
                    selectedBoxes.has(box.uid) ||
                    (selectedProps.get(box.uid)?.has(prop.property) ?? false);
                row.innerHTML = `
            <input type="checkbox" class="prop-check">
            <div class="prop-name"></div>
            <div class="prop-kind">${prop.kind}</div>
            <div class="line-stats">${lineStatsText(prop.lineStats)}</div>
            <div class="preview"></div>
            <button class="prop-inspect">Open</button>
        `;
                row.querySelector(".prop-name").textContent = prop.property;
                renderPropertyPreview(row.querySelector(".preview"), box, prop);
                const check = row.querySelector(".prop-check");
                check.checked = checked;
                check.disabled = selectedBoxes.has(box.uid);
                check.addEventListener("change", () => {
                    const set = selectedProps.get(box.uid) || new Set();
                    if (check.checked) set.add(prop.property);
                    else set.delete(prop.property);
                    if (set.size) selectedProps.set(box.uid, set);
                    else selectedProps.delete(box.uid);
                    updateSelectionMetrics();
                });
                row.querySelector(".prop-inspect").addEventListener(
                    "click",
                    () => inspectBox(box.uid, prop.property, box, prop),
                );
                row.addEventListener("mouseenter", () => {
                    highlightParentDiff(box.uid);
                    showEditorPreviewForProperty(box, prop, false);
                });
                return row;
            }

            function renderPropertyPreview(container, box, prop) {
                if (prop.kind === "frame") {
                    container.classList.add("frame-preview");
                    container.innerHTML = "";
                    container.appendChild(
                        frameStateElement("", box.currentFrame),
                    );
                    const arrow = document.createElement("span");
                    arrow.className = "frame-arrow";
                    const arrowText = document.createElement("span");
                    arrowText.textContent = "->";
                    arrow.appendChild(arrowText);
                    container.appendChild(arrow);
                    container.appendChild(
                        frameStateElement("", box.targetFrame),
                    );
                    return;
                }
                container.innerHTML = "";
                container.appendChild(
                    previewValueElement(
                        prop.currentPreview || "(missing)",
                        prop.kind === "text" ? prop.currentText : "",
                    ),
                );
                const arrow = document.createElement("span");
                arrow.className = "preview-arrow";
                arrow.textContent = "->";
                container.appendChild(arrow);
                container.appendChild(
                    previewValueElement(
                        prop.targetPreview || "(missing)",
                        prop.kind === "text" ? prop.targetText : "",
                    ),
                );
            }

            function previewValueElement(text, fullText = "") {
                const value = document.createElement("span");
                value.className = "preview-value";
                const rendered = searchSnippetParts(fullText || text, text);
                if (!rendered) {
                    value.textContent = text;
                    return value;
                }
                rendered.forEach((part) => {
                    const span = document.createElement("span");
                    if (part.hit) span.className = "preview-hit";
                    span.textContent = part.text;
                    value.appendChild(span);
                });
                return value;
            }

            function compactPreviewText(text) {
                return String(text || "").replace(/\s+/g, " ");
            }

            function searchSnippetParts(fullText, fallback) {
                const term = historySearchQuery.trim();
                if (!term) return null;
                const source = String(fullText || "");
                const lower = source.toLowerCase();
                const index = lower.indexOf(term.toLowerCase());
                if (index < 0) return null;

                const beforeStart = Math.max(0, index - 44);
                const afterEnd = Math.min(
                    source.length,
                    index + term.length + 72,
                );
                const before = `${beforeStart > 0 ? "... " : ""}${compactPreviewText(source.slice(beforeStart, index))}`;
                const hit = compactPreviewText(
                    source.slice(index, index + term.length),
                );
                const after = `${compactPreviewText(source.slice(index + term.length, afterEnd))}${afterEnd < source.length ? " ..." : ""}`;
                const parts = [];
                if (before) parts.push({ text: before, hit: false });
                if (hit) parts.push({ text: hit, hit: true });
                if (after) parts.push({ text: after, hit: false });
                return parts.length ? parts : [{ text: fallback, hit: false }];
            }

            function frameStateElement(label, frame) {
                const wrap = document.createElement("span");
                wrap.className = "frame-state";

                if (label) {
                    const labelEl = document.createElement("span");
                    labelEl.className = "frame-label";
                    labelEl.textContent = label;
                    wrap.appendChild(labelEl);
                }

                const valueEl = document.createElement("span");
                valueEl.className = "frame-value";
                valueEl.textContent = formatFrame(frame);
                wrap.appendChild(valueEl);

                return wrap;
            }

            function formatFrame(frame) {
                if (!frame) return "(missing)";
                return `x ${formatFrameNumber(frame.x)} y ${formatFrameNumber(frame.y)} | ${formatFrameNumber(frame.w)} x ${formatFrameNumber(frame.h)}`;
            }

            function formatFrameNumber(value) {
                if (value == null || Number.isNaN(Number(value))) return "?";
                const number = Number(value);
                if (Math.abs(number - Math.round(number)) < 0.001)
                    return String(Math.round(number));
                return number.toFixed(1);
            }

            function escapeAttr(text) {
                return String(text || "").replace(/"/g, "&quot;");
            }

            function statusLabel(status) {
                if (diffBasis === "previous") {
                    if (status === "target-only") return "added";
                    if (status === "present-only") return "removed";
                    return "changed";
                }
                if (status === "target-only") return "missing now";
                if (
                    status === "present-only" &&
                    selectedOnly &&
                    isBeforeSelectedCreation()
                )
                    return "not created";
                if (status === "present-only") return "new since then";
                return "changed";
            }

            function selectedCreationFloor() {
                const uids = selectedParentUids();
                if (!selectedOnly || !uids.length || !versions.length) return 0;
                for (let i = 0; i < versions.length; i++) {
                    const ids = versions[i]?.boxIds;
                    if (!Array.isArray(ids)) return 0;
                    if (uids.every((uid) => ids.includes(uid))) return i;
                }
                return Math.max(0, versions.length - 1);
            }

            function isBeforeSelectedCreation() {
                const floor = selectedCreationFloor();
                return selectedOnly && floor > 0 && selectedIndex < floor;
            }

            function selectedBoxMissingAtScrub(box) {
                if (!selectedOnly || !isBeforeSelectedCreation()) return false;
                return (
                    selectedParentUids().includes(box.uid) &&
                    box.status === "present-only"
                );
            }

            function firstTextProperty(box) {
                const prop = (box.properties || []).find(
                    (p) => p.kind === "text",
                );
                return prop ? prop.property : "code";
            }

            function inspectBox(uid, property, box = null, prop = null) {
                try {
                    if (
                        window.parent &&
                        typeof window.parent.navigateToBoxProperty ===
                            "function"
                    ) {
                        window.parent.navigateToBoxProperty(
                            uid,
                            property || "code",
                            null,
                            null,
                        );
                        const resolvedBox =
                            box ||
                            (currentDiff?.boxes || []).find(
                                (b) => b.uid === uid,
                            );
                        const resolvedProp =
                            prop ||
                            (resolvedBox?.properties || []).find(
                                (p) => p.property === (property || "code"),
                            );
                        if (resolvedBox && resolvedProp) {
                            window.setTimeout(
                                () =>
                                    showEditorPreviewForProperty(
                                        resolvedBox,
                                        resolvedProp,
                                        true,
                                    ),
                                180,
                            );
                        }
                    }
                } catch (error) {
                    console.warn("Unable to inspect parent box", error);
                }
            }

            function showRelevantEditorPreview() {
                const selected = parentSelectedContext();
                if (selected) {
                    const box = (currentDiff?.boxes || []).find(
                        (candidate) => candidate.uid === selected.uid,
                    );
                    const prop = (box?.properties || []).find(
                        (candidate) =>
                            candidate.property === selected.property &&
                            candidate.kind === "text",
                    );
                    if (box && prop) {
                        showEditorPreviewForProperty(box, prop, false);
                        return;
                    }
                }
                if ((currentDiff?.boxes || []).length === 1) {
                    showEditorPreviewForBox(currentDiff.boxes[0]);
                } else {
                    clearParentEditorPreview();
                }
            }

            function parentSelectedContext() {
                try {
                    const selected = Array.from(
                        window.parent?.currentSelectedCode ||
                            window.parent?.selectedList ||
                            [],
                    );
                    if (selected.length !== 1) return null;
                    const uid = selected[0]?.uid;
                    const property =
                        window.parent?.currentSelectedProperty ||
                        window.parent?.selectedProperty ||
                        "code";
                    return uid ? { uid, property } : null;
                } catch (_) {
                    return null;
                }
            }

            function showEditorPreviewForBox(box) {
                const selected = parentSelectedContext();
                const prop =
                    (box.properties || []).find(
                        (candidate) =>
                            candidate.kind === "text" &&
                            (!selected ||
                                selected.property === candidate.property),
                    ) ||
                    (box.properties || []).find(
                        (candidate) => candidate.kind === "text",
                    );
                if (prop) showEditorPreviewForProperty(box, prop, false);
            }

            function showEditorPreviewForProperty(box, prop, force) {
                if (!prop || prop.kind !== "text") {
                    if (force) clearParentEditorPreview();
                    return;
                }
                if (selectedBoxMissingAtScrub(box)) {
                    clearParentEditorPreview();
                    return;
                }
                try {
                    const parent = window.parent;
                    const editor = parent?.globalEditor;
                    const aidiff = parent?.AIDiff;
                    const monaco = parent?.globalMonaco || parent?.monaco;
                    if (!editor || !aidiff || !monaco) return;
                    const selected = parentSelectedContext();
                    if (
                        !force &&
                        (!selected ||
                            selected.uid !== box.uid ||
                            selected.property !== prop.property)
                    )
                        return;
                    const key = `${box.uid}::${prop.property}::${currentDiff?.versionIndex}::${diffBasis}`;
                    const targetText = prop.targetText ?? "";
                    if (
                        historyEditorPreview?.key === key &&
                        historyEditorPreview?.text === targetText
                    )
                        return;
                    historyEditorPreview = { key, text: targetText };
                    const options = { monaco, readOnly: true };
                    aidiff.apply(editor, targetText, options);
                } catch (error) {
                    console.warn(
                        "Unable to show history editor preview",
                        error,
                    );
                }
            }

            function clearParentEditorPreview() {
                if (!historyEditorPreview) return;
                historyEditorPreview = null;
                try {
                    const parent = window.parent;
                    if (parent?.AIDiff && parent?.globalEditor) {
                        parent.AIDiff.clear(parent.globalEditor);
                        parent.dispatchEvent?.(
                            new CustomEvent("provisional-change"),
                        );
                    }
                } catch (_) {}
            }

            function updateSelectionMetrics() {
                let count = selectedBoxes.size;
                selectedProps.forEach((set, uid) => {
                    if (!selectedBoxes.has(uid)) count += set.size;
                });
                document.getElementById("metric-selected").textContent = count;
                document
                    .getElementById("select-all-btn")
                    .setAttribute("aria-pressed", count > 0 ? "true" : "false");
                document.getElementById("cherry-pick-btn").disabled =
                    count === 0 || cherryInFlight || isBeforeSelectedCreation();
            }

            function selectionPayload() {
                const payload = [];
                selectedBoxes.forEach((uid) =>
                    payload.push({ uid, properties: [] }),
                );
                selectedProps.forEach((props, uid) => {
                    if (!selectedBoxes.has(uid) && props.size) {
                        payload.push({
                            uid,
                            properties: Array.from(props).sort(),
                        });
                    }
                });
                return payload;
            }

            function findParentBox(uid) {
                try {
                    const boxes = Array.from(
                        window.parent.document.body.getElementsByClassName(
                            "box",
                        ),
                    );
                    return boxes.find((box) => box && box.uid === uid) || null;
                } catch (_) {
                    return null;
                }
            }

            function ensureParentOverlay() {
                try {
                    const doc = window.parent.document;
                    let root = doc.getElementById(
                        "field-history-highlight-layer",
                    );
                    if (!root) {
                        root = doc.createElement("div");
                        root.id = "field-history-highlight-layer";
                        root.style.cssText =
                            "position:fixed;inset:0;pointer-events:none;z-index:12040";
                        doc.body.appendChild(root);
                    }
                    return root;
                } catch (_) {
                    return null;
                }
            }

            function clearParentHighlights(stopTracking = false) {
                if (stopTracking && highlightRaf != null) {
                    window.cancelAnimationFrame(highlightRaf);
                    highlightRaf = null;
                }
                if (stopTracking) {
                    activeHighlightUid = null;
                    highlightSignatureCache = "";
                }
                try {
                    const root = window.parent.document.getElementById(
                        "field-history-highlight-layer",
                    );
                    if (root) {
                        if (stopTracking) root.remove();
                        else root.innerHTML = "";
                    }
                } catch (_) {}
            }

            function disposeHistoryBrowser() {
                if (disposed) return;
                disposed = true;
                clearTimeout(diffTimer);
                clearTimeout(historyRefreshTimer);
                clearTimeout(reconnectTimer);
                clearTimeout(lineBlameTimer);
                if (parentSelectionPoll != null) {
                    clearInterval(parentSelectionPoll);
                    parentSelectionPoll = null;
                }
                if (historyStatsRenderRaf != null) {
                    cancelAnimationFrame(historyStatsRenderRaf);
                    historyStatsRenderRaf = null;
                }
                try {
                    window.parent?.removeEventListener?.(
                        "field-selection-changed",
                        syncParentSelectionChanged,
                    );
                } catch (_) {}
                window.removeEventListener("wheel", handleRailWheel, {
                    capture: true,
                });
                window.removeEventListener(
                    "gesturestart",
                    handleRailGestureStart,
                    { capture: true },
                );
                window.removeEventListener(
                    "gesturechange",
                    handleRailGestureChange,
                    { capture: true },
                );
                document.removeEventListener("keydown", handleHistoryKeydown, {
                    capture: true,
                });
                clearParentHighlights(true);
                clearParentEditorPreview();
                try {
                    if (ws) {
                        ws.onopen = null;
                        ws.onmessage = null;
                        ws.onclose = null;
                        if (
                            ws.readyState === WebSocket.OPEN ||
                            ws.readyState === WebSocket.CONNECTING
                        ) {
                            ws.close();
                        }
                    }
                } catch (_) {}
            }

            window.disposeHistoryBrowser = disposeHistoryBrowser;
            window.clearParentHighlights = clearParentHighlights;
            window.clearParentEditorPreview = clearParentEditorPreview;

            function highlightParentDiff(onlyUid = null) {
                activeHighlightUid = onlyUid;
                renderParentHighlights(onlyUid);
                startHighlightTracking();
            }

            function renderParentHighlights(onlyUid = null) {
                clearParentHighlights(false);
                if (!currentDiff) return;
                const root = ensureParentOverlay();
                if (!root) return;

                const doc = window.parent.document;
                const svg = doc.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg",
                );
                svg.setAttribute("width", "100%");
                svg.setAttribute("height", "100%");
                svg.setAttribute(
                    "viewBox",
                    `0 0 ${window.parent.innerWidth} ${window.parent.innerHeight}`,
                );
                root.appendChild(svg);

                const boxes = (currentDiff.boxes || [])
                    .filter((box) => !onlyUid || box.uid === onlyUid)
                    .slice(0, 180);
                boxes.forEach((box) => drawBoxHighlight(svg, box));
            }

            function startHighlightTracking() {
                if (highlightRaf != null) return;
                const tick = () => {
                    if (!currentDiff) {
                        highlightRaf = null;
                        return;
                    }
                    const next = highlightSignature(activeHighlightUid);
                    if (next !== highlightSignatureCache) {
                        highlightSignatureCache = next;
                        renderParentHighlights(activeHighlightUid);
                    }
                    highlightRaf = window.requestAnimationFrame(tick);
                };
                highlightSignatureCache = "";
                highlightRaf = window.requestAnimationFrame(tick);
            }

            function highlightSignature(onlyUid = null) {
                try {
                    const parts = [
                        `${window.parent.innerWidth}x${window.parent.innerHeight}`,
                    ];
                    (currentDiff?.boxes || [])
                        .filter((box) => !onlyUid || box.uid === onlyUid)
                        .slice(0, 180)
                        .forEach((box) => {
                            const el = findParentBox(box.uid);
                            if (!el) {
                                parts.push(`${box.uid}:missing`);
                                return;
                            }
                            const r = el.getBoundingClientRect();
                            parts.push(
                                `${box.uid}:${Math.round(r.left)}:${Math.round(r.top)}:${Math.round(r.width)}:${Math.round(r.height)}`,
                            );
                        });
                    return parts.join("|");
                } catch (_) {
                    return String(Date.now());
                }
            }

            function drawBoxHighlight(svg, box) {
                const currentEl = findParentBox(box.uid);
                const currentRect = currentEl
                    ? currentEl.getBoundingClientRect()
                    : null;
                const targetRect = targetScreenRect(box, currentRect);
                const label = propertyBadgeText(box);
                if (currentRect)
                    drawRect(
                        svg,
                        currentRect,
                        "#e7b36a",
                        false,
                        box.status === "present-only" ? "removed" : label,
                        0.55,
                    );
                if (targetRect)
                    drawRect(svg, targetRect, "#e7b36a", true, label, 1);
                if (
                    currentRect &&
                    targetRect &&
                    (Math.abs(currentRect.left - targetRect.left) > 2 ||
                        Math.abs(currentRect.top - targetRect.top) > 2)
                ) {
                    drawLine(svg, currentRect, targetRect);
                }
            }

            function propertyBadgeText(box) {
                const props = (box.properties || []).map(
                    (prop) => prop.property,
                );
                if (!props.length) return statusLabel(box.status);
                const shown = props.slice(0, 3).join(", ");
                return props.length > 3
                    ? `${shown} +${props.length - 3}`
                    : shown;
            }

            function targetScreenRect(box, currentRect) {
                if (!box.targetFrame) return null;
                if (currentRect && box.currentFrame) {
                    const scaleX = box.currentFrame.w
                        ? currentRect.width / box.currentFrame.w
                        : 1;
                    const scaleY = box.currentFrame.h
                        ? currentRect.height / box.currentFrame.h
                        : 1;
                    return {
                        left:
                            currentRect.left +
                            (box.targetFrame.x - box.currentFrame.x) * scaleX,
                        top:
                            currentRect.top +
                            (box.targetFrame.y - box.currentFrame.y) * scaleY,
                        width: box.targetFrame.w * scaleX,
                        height: box.targetFrame.h * scaleY,
                    };
                }
                try {
                    const anyBox =
                        window.parent.document.body.querySelector(".box");
                    const container = anyBox?.parentElement;
                    const cr = container?.getBoundingClientRect();
                    if (!cr) return null;
                    return {
                        left: cr.left + box.targetFrame.x,
                        top: cr.top + box.targetFrame.y,
                        width: box.targetFrame.w,
                        height: box.targetFrame.h,
                    };
                } catch (_) {
                    return null;
                }
            }

            function drawRect(svg, rect, color, dashed, label, opacity = 1) {
                const r = svg.ownerDocument.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "rect",
                );
                r.setAttribute("x", rect.left - 8);
                r.setAttribute("y", rect.top - 8);
                r.setAttribute("width", Math.max(4, rect.width + 16));
                r.setAttribute("height", Math.max(4, rect.height + 16));
                r.setAttribute("rx", "7");
                r.setAttribute("ry", "7");
                r.setAttribute("fill", "none");
                r.setAttribute("stroke", color);
                r.setAttribute("stroke-width", dashed ? "3" : "2");
                r.setAttribute("opacity", String(opacity));
                if (dashed) r.setAttribute("stroke-dasharray", "7 4");
                svg.appendChild(r);
                if (label)
                    drawBadge(
                        svg,
                        rect.left + rect.width,
                        rect.top - 16,
                        label,
                        opacity,
                    );
            }

            function drawBadge(svg, x, y, text, opacity) {
                const doc = svg.ownerDocument;
                const safe = String(text || "").slice(0, 42);
                const width = Math.max(
                    44,
                    Math.min(240, safe.length * 6.3 + 16),
                );
                const group = doc.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "g",
                );
                group.setAttribute("opacity", String(opacity));
                const bg = doc.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "rect",
                );
                bg.setAttribute("x", x - width);
                bg.setAttribute("y", y);
                bg.setAttribute("width", width);
                bg.setAttribute("height", "20");
                bg.setAttribute("rx", "7");
                bg.setAttribute("ry", "7");
                bg.setAttribute("fill", "#e7b36a");
                const label = doc.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text",
                );
                label.setAttribute("x", x - width + 8);
                label.setAttribute("y", y + 14);
                label.setAttribute("fill", "#050505");
                label.setAttribute("font-size", "11");
                label.setAttribute("font-family", "Iosevka, monospace");
                label.textContent = safe;
                group.appendChild(bg);
                group.appendChild(label);
                svg.appendChild(group);
            }

            function drawLine(svg, from, to) {
                const line = svg.ownerDocument.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line",
                );
                line.setAttribute("x1", from.left + from.width / 2);
                line.setAttribute("y1", from.top + from.height / 2);
                line.setAttribute("x2", to.left + to.width / 2);
                line.setAttribute("y2", to.top + to.height / 2);
                line.setAttribute("stroke", "#e7b36a");
                line.setAttribute("stroke-width", "1");
                line.setAttribute("stroke-dasharray", "4 4");
                svg.appendChild(line);
            }

            document
                .getElementById("refresh-btn")
                .addEventListener("click", () => {
                    setHistoryActivity(true, "Refreshing");
                    requestHistory();
                });
            document.querySelectorAll(".axis-btn").forEach((button) => {
                button.addEventListener("pointerdown", (event) =>
                    event.stopPropagation(),
                );
                button.addEventListener("click", (event) => {
                    event.stopPropagation();
                    railAxisMode = button.dataset.axis || "saves";
                    updateAxisButtons();
                    renderRail({ preserveSelected: true, animate: true });
                });
            });
            document
                .querySelector(".axis-focus-btn")
                ?.addEventListener("pointerdown", (event) =>
                    event.stopPropagation(),
                );
            document
                .querySelector(".axis-focus-btn")
                ?.addEventListener("click", (event) => {
                    event.stopPropagation();
                    railFocusEnabled = !railFocusEnabled;
                    updateAxisButtons();
                    renderRail({ preserveSelected: true, animate: true });
                });
            document.querySelectorAll(".rail-zoom-btn").forEach((button) => {
                button.addEventListener("pointerdown", (event) =>
                    event.stopPropagation(),
                );
                button.addEventListener("click", (event) => {
                    event.stopPropagation();
                    const factor =
                        button.dataset.zoom === "out" ? 1 / 1.35 : 1.35;
                    zoomRailBy(
                        factor,
                        railShellEl.getBoundingClientRect().left +
                            railShellEl.clientWidth / 2,
                    );
                });
            });
            historySearchInput.addEventListener("pointerdown", (event) =>
                event.stopPropagation(),
            );
            historySearchInput.addEventListener("click", (event) =>
                event.stopPropagation(),
            );
            lineBlameButton.addEventListener("pointerdown", (event) =>
                event.stopPropagation(),
            );
            lineBlameButton.addEventListener("click", (event) => {
                event.stopPropagation();
                setLineBlameActive(!lineBlameActive);
            });
            historySearchInput.addEventListener("input", scheduleHistorySearch);
            historySearchInput.addEventListener("keydown", (event) => {
                event.stopPropagation();
                if (event.key === "Escape") {
                    historySearchInput.value = "";
                    scheduleHistorySearch();
                    historySearchInput.blur();
                }
            });
            function isRailWheelEvent(event) {
                try {
                    const path = event.composedPath?.() || [];
                    if (path.includes(railShellEl)) return true;
                } catch (_) {}
                return !!event.target?.closest?.(".rail-shell");
            }

            function handleRailWheel(event) {
                if (!isRailWheelEvent(event)) return;
                event.preventDefault();
                event.stopPropagation();

                const overAxisControls =
                    event.target?.closest?.(".axis-toggle");
                if (overAxisControls) return;
                const absX = Math.abs(event.deltaX || 0);
                const absY = Math.abs(event.deltaY || 0);

                if (absX > absY * 0.7) {
                    const maxScroll = Math.max(
                        0,
                        measuredRailWidth() - railShellEl.clientWidth,
                    );
                    railShellEl.scrollLeft = clamp(
                        railShellEl.scrollLeft + event.deltaX,
                        0,
                        maxScroll,
                    );
                }
                if (absY > 0) {
                    const pinchScale =
                        event.ctrlKey || event.metaKey ? 0.0048 : 0.0026;
                    const factor = Math.exp(-event.deltaY * pinchScale);
                    zoomRailBy(factor, railAnchorClientX(event.clientX));
                }
            }

            function handleRailGestureStart(event) {
                if (!isRailWheelEvent(event)) return;
                event.preventDefault();
                event.stopPropagation();
                railGestureScale = Number(event.scale) || 1;
            }

            function handleRailGestureChange(event) {
                if (!isRailWheelEvent(event)) return;
                event.preventDefault();
                event.stopPropagation();
                const scale = Number(event.scale) || 1;
                const factor = scale / Math.max(0.001, railGestureScale);
                railGestureScale = scale;
                zoomRailBy(factor, railAnchorClientX(event.clientX));
            }

            window.addEventListener("wheel", handleRailWheel, {
                passive: false,
                capture: true,
            });
            window.addEventListener("gesturestart", handleRailGestureStart, {
                passive: false,
                capture: true,
            });
            window.addEventListener("gesturechange", handleRailGestureChange, {
                passive: false,
                capture: true,
            });
            document.addEventListener("keydown", handleHistoryKeydown, {
                capture: true,
            });
            railShellEl.addEventListener("pointermove", (event) => {
                lastRailClientX = event.clientX;
            });
            railShellEl.addEventListener("mousemove", (event) => {
                lastRailClientX = event.clientX;
            });
            railShellEl.addEventListener("pointerdown", (event) => {
                if (event.button != null && event.button !== 0) return;
                railScrubbing = true;
                railShellEl.setPointerCapture?.(event.pointerId);
                selectNearestRailVersion(event);
                event.preventDefault();
            });
            railShellEl.addEventListener("pointermove", (event) => {
                if (!railScrubbing) return;
                selectNearestRailVersion(event);
                event.preventDefault();
            });
            railShellEl.addEventListener("pointerup", (event) => {
                railScrubbing = false;
                railShellEl.releasePointerCapture?.(event.pointerId);
            });
            railShellEl.addEventListener("pointercancel", () => {
                railScrubbing = false;
            });
            document
                .getElementById("selected-filter-btn")
                .addEventListener("click", () => {
                    selectedOnly = !selectedOnly;
                    document.getElementById("selected-filter-btn").textContent =
                        selectedOnly ? "Selected Boxes" : "Whole Document";
                    document
                        .getElementById("selected-filter-btn")
                        .setAttribute(
                            "aria-pressed",
                            selectedOnly ? "true" : "false",
                        );
	                    lastParentSelectionSignature = parentSelectionSignature();
	                    exactLineDeltaCache.clear();
	                    railLineStatsRequestSignature = "";
	                    renderVersions();
	                    requestDiffNow();
                });
            document
                .getElementById("diff-basis-btn")
                .addEventListener("click", () => {
                    diffBasis =
                        diffBasis === "current" ? "previous" : "current";
                    selectedBoxes.clear();
	                    selectedProps.clear();
	                    currentDiff = null;
	                    exactLineDeltaCache.clear();
	                    railLineStatsRequestSignature = "";
	                    clearParentEditorPreview();
                    renderVersions();
                    if (historySearchQuery.trim()) {
                        requestHistorySearchNow();
                    }
                    requestDiffNow();
                });
            document
                .getElementById("select-all-btn")
                .addEventListener("click", () => {
                    (currentDiff?.boxes || []).forEach((box) =>
                        selectedBoxes.add(box.uid),
                    );
                    selectedProps.clear();
                    renderDiff();
                });
            document
                .getElementById("clear-selection-btn")
                .addEventListener("click", () => {
                    selectedBoxes.clear();
                    selectedProps.clear();
                    renderDiff();
                });
            document
                .getElementById("name-save-btn")
                .addEventListener("click", () => {
                    if (namingInFlight || !versions[selectedIndex]) return;
                    namingInFlight = true;
                    nameInput.disabled = true;
                    const versionIndex = selectedVersionNumber();
                    send({
                        name: "name-history-version",
                        payload: {
                            versionIndex,
                            name: nameInput.value.trim(),
                        },
                    });
                });
            nameInput.addEventListener("keydown", (event) => {
                if (event.key === "Enter")
                    document.getElementById("name-save-btn").click();
            });
            document
                .getElementById("cherry-pick-btn")
                .addEventListener("click", () => {
                    const selections = selectionPayload();
                    if (!selections.length || cherryInFlight) return;
                    const versionIndex = selectedVersionNumber();
                    const ok = confirmHistoryAction(
                        `Cherry-pick ${selections.length} selection(s) from version #${versionIndex}?`,
                    );
                    if (!ok) return;
                    cherryInFlight = true;
                    updateSelectionMetrics();
                    send({
                        name: "cherry-pick-history-version",
                        payload: {
                            versionIndex,
                            selections,
                            includeTopology: true,
                        },
                    });
                });
            document
                .getElementById("full-restore-btn")
                .addEventListener("click", () => {
                    if (selectedIndex === versions.length - 1) return;
                    const versionIndex = selectedVersionNumber();
                    const ok = confirmHistoryAction(
                        `Restore the whole document to version #${versionIndex}?`,
                    );
                    if (!ok) return;
                    setHistoryActivity(true, "Restoring");
                    send({
                        name: "restore-history-version",
                        payload: { versionIndex },
                    });
                });
            document
                .getElementById("close-btn")
                .addEventListener("click", () => {
                    disposeHistoryBrowser();
                    try {
                        if (
                            window.parent &&
                            typeof window.parent.hideHistoryIframe ===
                                "function"
                        ) {
                            window.parent.hideHistoryIframe();
                            return;
                        }
                    } catch (_) {}
                    window.close();
                });
            window.addEventListener("beforeunload", () => {
                disposeHistoryBrowser();
            });
            try {
                window.parent?.addEventListener?.(
                    "field-selection-changed",
                    syncParentSelectionChanged,
                );
            } catch (_) {}
            lastParentSelectionSignature = parentSelectionSignature();
            parentSelectionPoll = setInterval(syncParentSelectionChanged, 300);

            connect();
        </script>
    </body>
</html>
