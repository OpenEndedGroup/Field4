            function zoomRailBy(factor, clientX) {
                if (!Number.isFinite(factor) || factor === 1) return;
                const shellRect = railShellEl.getBoundingClientRect();
                const anchorClientX = railAnchorClientX(clientX);
                const anchorX = clamp(
                    anchorClientX - shellRect.left,
                    0,
                    shellRect.width,
                );
                const oldWidth = measuredRailWidth();
                const oldWorldX = railShellEl.scrollLeft + anchorX;
                const oldFraction = oldWorldX / oldWidth;
                const nextZoom = clamp(railZoom * factor, 1, 18);
                if (Math.abs(nextZoom - railZoom) < 0.001) return;
                railZoom = nextZoom;
                renderRail();
                const newWidth = measuredRailWidth();
                const maxScroll = Math.max(
                    0,
                    newWidth - railShellEl.clientWidth,

                railShellEl.scrollLeft = clamp(
                    oldFraction * newWidth - anchorX,
                    0,
                    maxScroll,

            function railLeftForFraction(fraction, width) {
                return 10 + Math.max(0, Math.min(1, fraction)) * (width - 20);
            }

            function median(values) {
                const sorted = values
                    .filter((value) => Number.isFinite(value) && value > 0)
                    .sort((a, b) => a - b);
                if (!sorted.length) return 0;
                const middle = Math.floor(sorted.length / 2);
                return sorted.length % 2
                    ? sorted[middle]
                    : (sorted[middle - 1] + sorted[middle]) / 2;
            }

            function railIntervalModel(items, width) {
                railGapMarkers = [];
                const count = items.length;
                if (count <= 1) return [0];
                let weights = Array.from({ length: count - 1 }, () => 1);
                const compressed = [];

                if (railAxisMode === "time") {
                    const times = items.map(
                        (version) => Number(version.timestamp) || 0,
                    );
                    const gaps = times
                        .slice(1)
                        .map((time, index) => Math.max(0, time - times[index]));
                    const medianGap = median(gaps);
                    if (medianGap > 0) {
                        weights = gaps.map((gap, index) => {
                            if (gap > medianGap * 4) {
                                compressed.push({ index, gap });
                                return 1;
                            }
                            return Math.max(0.22, gap / medianGap);
                        });
                    }
                }

                if (railFocusEnabled) {
                    const selectedPosition = Math.max(
                        0,
                        items.findIndex(
                            (version) =>
                                version.index === selectedVersionNumber(),
                        ),
                    );
                    for (let i = 0; i < count - 1; i++) {
                        const midpointDistance = Math.abs(
                            i + 0.5 - selectedPosition,
                        );
                        const lift =
                            3.6 *
                            Math.exp(
                                -(midpointDistance * midpointDistance) / 8,
                            );
                        weights[i] *= 1 + lift;
                    }
                }

                if (compressed.length) {
                    const total =
                        weights.reduce((sum, value) => sum + value, 0) || 1;
                    const pxPerWeight = (width - 20) / total;
                    compressed.forEach(({ index }) => {
                        const minimumWeight = 20 / Math.max(1, pxPerWeight);
                        weights[index] = Math.max(
                            weights[index],
                            minimumWeight,
                        );
                    });
                }

                return { weights, compressed };
            }

            function railFractions(items, width) {
                const count = items.length;
                if (count <= 1) return [0];
                const model = railIntervalModel(items, width);
                const weights = model.weights || [];
                const total =
                    weights.reduce((sum, value) => sum + value, 0) || 1;
                const fractions = [0];
                let acc = 0;
                weights.forEach((weight) => {
                    acc += weight;
                    fractions.push(acc / total);
                });
                railGapMarkers = (model.compressed || []).map(
                    ({ index, gap }) => {
                        const middle =
                            (fractions[index] + fractions[index + 1]) / 2;
                        return { index, gap, fraction: middle };
                    },
                );
                return fractions;

            function computeRailPositions(width, items) {

                items.forEach((version, i) => {
                    const left =
                        count === 1

                            : railLeftForFraction(

                                  width,

            function lineChartPath(points) {

                    const point = points[0];
                    return point
                        ? `M ${point.x.toFixed(1)} ${point.y.toFixed(1)}`
                        : "";
                }
                const slopes = [];
                for (let i = 0; i < points.length - 1; i++) {
                    const dx = points[i + 1].x - points[i].x;
                    slopes.push(
                        Math.abs(dx) < 0.001
                            ? 0
                            : (points[i + 1].y - points[i].y) / dx,
                    );
                }

                const tangents = points.map((_, i) => {
                    if (i === 0) return slopes[0] || 0;
                    if (i === points.length - 1)
                        return slopes[slopes.length - 1] || 0;
                    const left = slopes[i - 1] || 0;
                    const right = slopes[i] || 0;
                    if (
                        left === 0 ||
                        right === 0 ||
                        Math.sign(left) !== Math.sign(right)
                    )
                        return 0;
                    return (2 * left * right) / (left + right);
                });

                const path = [
                    `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`,
                ];
                for (let i = 0; i < points.length - 1; i++) {
                    const from = points[i];
                    const to = points[i + 1];
                    const dx = to.x - from.x;
                    const c1 = {
                        x: from.x + dx / 3,
                        y: from.y + (tangents[i] * dx) / 3,
                    };
                    const c2 = {
                        x: to.x - dx / 3,
                        y: to.y - (tangents[i + 1] * dx) / 3,
                    };
                    path.push(
                        `C ${c1.x.toFixed(1)} ${c1.y.toFixed(1)}, ${c2.x.toFixed(1)} ${c2.y.toFixed(1)}, ${to.x.toFixed(1)} ${to.y.toFixed(1)}`,
                    );
                }
                return path.join(" ");
            }

            function timeGridUnit(spanMs, width) {
                const targetMs = spanMs / Math.max(1, width / 120);
                const units = [
                    { unit: "hour", step: 1, ms: 60 * 60 * 1000 },
                    { unit: "hour", step: 6, ms: 6 * 60 * 60 * 1000 },
                    { unit: "day", step: 1, ms: 24 * 60 * 60 * 1000 },
                    { unit: "week", step: 1, ms: 7 * 24 * 60 * 60 * 1000 },
                    { unit: "month", step: 1, ms: 31 * 24 * 60 * 60 * 1000 },
                    { unit: "month", step: 3, ms: 93 * 24 * 60 * 60 * 1000 },
                    { unit: "year", step: 1, ms: 365 * 24 * 60 * 60 * 1000 },
                ];
                return (
                    units.find((candidate) => candidate.ms >= targetMs) ||
                    units[units.length - 1]
                );
            }

            function floorGridTime(timestamp, grid) {
                const date = new Date(timestamp);
                date.setSeconds(0, 0);
                if (grid.unit === "hour") {
                    date.setMinutes(0);
                    date.setHours(Math.floor(date.getHours() / grid.step) * grid.step);
                } else if (grid.unit === "day") {
                    date.setHours(0, 0, 0, 0);
                } else if (grid.unit === "week") {
                    date.setHours(0, 0, 0, 0);
                    date.setDate(date.getDate() - date.getDay());
                } else if (grid.unit === "month") {
                    date.setHours(0, 0, 0, 0);
                    date.setDate(1);
                    date.setMonth(Math.floor(date.getMonth() / grid.step) * grid.step);
                } else {
                    date.setHours(0, 0, 0, 0);
                    date.setDate(1);
                    date.setMonth(0);
                }
                return date.getTime();
            }

            function addGridTime(timestamp, grid) {
                const date = new Date(timestamp);
                if (grid.unit === "hour") date.setHours(date.getHours() + grid.step);
                else if (grid.unit === "day") date.setDate(date.getDate() + grid.step);
                else if (grid.unit === "week") date.setDate(date.getDate() + 7 * grid.step);
                else if (grid.unit === "month") date.setMonth(date.getMonth() + grid.step);
                else date.setFullYear(date.getFullYear() + grid.step);
                return date.getTime();
            }

            function formatGridTime(timestamp, grid) {
                const date = new Date(timestamp);
                if (grid.unit === "hour") {
                    return date.toLocaleTimeString([], {
                        hour: "numeric",
                        minute: "2-digit",
                    });
                }
                if (grid.unit === "day" || grid.unit === "week") {
                    return date.toLocaleDateString([], {
                        month: "short",
                        day: "numeric",
                    });
                }
                if (grid.unit === "month") {
                    return date.toLocaleDateString([], {
                        month: "short",
                        year: "2-digit",
                    });
                }
                return String(date.getFullYear());
            }

            function timestampToRailX(timestamp, points) {
                if (!points.length) return null;
                if (timestamp <= points[0].time) return points[0].left;
                for (let i = 1; i < points.length; i++) {
                    const previous = points[i - 1];
                    const current = points[i];
                    if (timestamp <= current.time) {
                        const span = Math.max(1, current.time - previous.time);
                        const t = (timestamp - previous.time) / span;
                        return previous.left + (current.left - previous.left) * t;
                    }
                }
                return points[points.length - 1].left;
            }

            function renderRailTimeGrid(width, positions, items) {
                const points = items
                    .map((version) => ({
                        time: Number(version.timestamp) || 0,
                        left: positions.get(version.index),
                    }))
                    .filter((point) => point.time > 0 && point.left != null)
                    .sort((a, b) => a.time - b.time);
                if (points.length < 2) return;
                const minTime = points[0].time;
                const maxTime = points[points.length - 1].time;
                const span = maxTime - minTime;
                if (span <= 0) return;
                const grid = timeGridUnit(span, width);
                let time = addGridTime(floorGridTime(minTime, grid), grid);
                const svg = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg",
                );
                svg.classList.add("time-grid-layer");
                svg.setAttribute("width", String(width));
                svg.setAttribute("height", String(RAIL_HEIGHT));
                svg.setAttribute("viewBox", `0 0 ${width} ${RAIL_HEIGHT}`);
                svg.setAttribute("preserveAspectRatio", "xMinYMin meet");
                let count = 0;
                while (time < maxTime && count < 400) {
                    const left = timestampToRailX(time, points);
                    if (left != null && left >= 0 && left <= width) {
                        const line = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "line",
                        );
                        line.setAttribute("x1", left);
                        line.setAttribute("x2", left);
                        line.setAttribute("y1", "0");
                        line.setAttribute("y2", String(RAIL_HEIGHT));
                        line.setAttribute("stroke", "rgba(255,255,255,0.08)");
                        line.setAttribute("stroke-width", "1");
                        svg.appendChild(line);

                        const label = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "text",
                        );
                        label.setAttribute("x", left + 4);
                        label.setAttribute("y", String(RAIL_HEIGHT - 5));
                        label.setAttribute("fill", "rgba(255,255,255,0.28)");
                        label.setAttribute("font-size", "8");
                        label.textContent = formatGridTime(time, grid);
                        svg.appendChild(label);
                    }
                    time = addGridTime(time, grid);
                    count++;
                }
                railEl.appendChild(svg);
            }

            function selectedRailScreenAnchor() {
                const current = railPositions.find(
                    (position) =>
                        position.versionIndex === selectedVersionNumber(),
                );
                if (!current) return null;
                return current.left - railShellEl.scrollLeft;
            }

            function restoreSelectedRailScreenAnchor(anchor) {
                if (anchor == null) return;
                const current = railPositions.find(
                    (position) =>
                        position.versionIndex === selectedVersionNumber(),
                );
                if (!current) return;
                const maxScroll = Math.max(
                    0,
                    measuredRailWidth() - railShellEl.clientWidth,
                );
                railShellEl.scrollLeft = clamp(
                    current.left - anchor,
                    0,
                    maxScroll,
                );

            function renderRail(options = {}) {
                const previousPositions = new Map(
                    railPositions.map((position) => [
                        position.versionIndex,
                        position.left,
                    ]),
                );
                const anchor = options.preserveSelected
                    ? selectedRailScreenAnchor()
                    : null;
                railEl
                    .querySelectorAll(
                        ".dot,.dot-label,.branch-layer,.change-chart-layer,.activity-chart-layer,.edit-chart-layer,.time-grid-layer,.rail-unavailable,.rail-boundary,.gap-marker",
                    )
                    .forEach((node) => node.remove());
                const items = displayedVersions();
                const count = Math.max(1, items.length);
                const width = Math.max(
                    railWidthFor(count),
                    Math.ceil(railShellEl.clientWidth || 0),
                );
                railEl.style.width = `${width}px`;
                railEl.style.minWidth = `${width}px`;
                const positions = computeRailPositions(width, items);
	                const selectedCanvasUids = new Set(readParentSelectedUids());
	                const lineDeltaSelection =
	                    selectedOnly && selectedCanvasUids.size
	                        ? selectedCanvasUids
	                        : null;
	                const currentDeltas =
	                    diffBasis === "current"
	                        ? currentLineDeltaMap(lineDeltaSelection)
	                        : null;
                const positionsByIndex = new Map(
                    versions.map((version, index) => [version.index, index]),
                );
                const latestSelectionChanges =
                    diffBasis === "current"
                        ? latestSelectedChangePositions()
                        : new Map();
	                const lineDeltas = items.map((version) =>
	                    versionLineDelta(
	                        version,
	                        currentDeltas,
	                        lineDeltaSelection,
	                    ),
	                );

                railPositions = items.map((version) => ({
                    index: versions.findIndex(
                        (candidate) => candidate.index === version.index,
                    ),
                    versionIndex: version.index,
                    left: positions.get(version.index) ?? 0,
                }));

                renderRailTimeGrid(width, positions, items);
                renderRailFieldLaunchMarkers(width, positions, items);
	                renderRailActivityChart(
	                    width,
	                    positions,
	                    items,
	                    selectedOnly ? selectedCanvasUids : null,
	                );
                renderRailEditMoveChart(width, positions, items);
                renderRailBranches(width, positions);
                renderRailChangeChart(width, positions, items, lineDeltas);
                renderSelectedCreationBoundary(positions);
                renderRailGapMarkers(width);

                items.forEach((version, i) => {
                    const left =
                        positions.get(version.index) ??
                        (count === 1
                            ? 16
                            : 10 + (i / (count - 1)) * (width - 20));
                    const dot = document.createElement("button");
                    dot.className = "dot";
                    dot.type = "button";
                    dot.dataset.versionIndex = String(version.index);
                    dot.style.left = `${options.animate && previousPositions.has(version.index) ? previousPositions.get(version.index) : left}px`;
                    dot.title = versionMeta(version, true);
                    const delta = lineDeltas[i] || { added: 0, removed: 0 };
                    if (delta.added || delta.removed)
                        dot.title = `${dot.title} · +${delta.added} -${delta.removed}`;
                    const activity = activityTitle(version, selectedCanvasUids);
                    if (activity) dot.title = `${dot.title} · ${activity}`;
                    const touchesSelected = versionTouchesSelected(
                        version,
                        selectedCanvasUids,
                        latestSelectionChanges,
                        positionsByIndex,
                    );
                    const activityTouchesSelected = selectedActivityTouches(
                        version,
                        selectedCanvasUids,
                    );
                    if (touchesSelected || activityTouchesSelected) {
                        dot.classList.add("selection-change");
                        dot.title = `${dot.title} · selected box ${
                            activityTouchesSelected ? "active" : "changed"

            function selectNearestRailVersion(event) {
                if (!versions.length || !railPositions.length) return;
                const rect = railEl.getBoundingClientRect();
                const x = event.clientX - rect.left;
                let nearest = railPositions[0];
                let nearestDistance = Math.abs(x - nearest.left);
                for (const candidate of railPositions) {
                    const distance = Math.abs(x - candidate.left);
                    if (distance < nearestDistance) {
                        nearest = candidate;
                        nearestDistance = distance;
                    }
                }
                if (nearest && nearest.index !== selectedIndex) {
                    if (nearest.index >= 0) selectVersion(nearest.index);
                }
            }
