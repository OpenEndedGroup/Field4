<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document History</title>
    <style>
        @import url("/iosevka.css");

        :root {
            --bg: #1e1e1e;
            --fg: #ddd;
            --fg-dim: #999;
            --border: #444;
            --accent: var(--field-cyan, #25c0ff);
            --accent-dim: rgba(37, 192, 255, 0.3);
            --current: #80ff80;
            --restored: #ff9944;
            --transition: rgba(255, 255, 255, 0.2);
            --pos: #7ed87e;
            --neg: #ff7a7a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Iosevka Web", system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-size: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 12px;
            font-weight: 400;
            color: var(--fg);
            font-family: "Iosevka Web", system-ui, sans-serif;
        }

        .status {
            font-size: 9px;
            color: var(--fg-dim);
            padding: 2px 5px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
        }

        .status.connected {
            color: var(--current);
        }

        main {
            flex: 1;
            overflow: auto;
            padding: 10px 10px 10px 6px;
            display: flex;
            justify-content: flex-start;
        }

        #timeline-container {
            width: 1200px;
            min-width: 1200px;
        }

        svg {
            width: 1200px;
            height: auto;
        }

        .version-node {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .version-node:hover .version-circle {
            stroke-width: 3;
            r: 12;
        }

        .version-node:hover .version-label {
            font-weight: 400;
        }

        .version-circle {
            fill: var(--accent);
            stroke: var(--accent-dim);
            stroke-width: 2;
            transition: all 0.2s ease;
        }

        .version-circle.current {
            fill: var(--current);
            stroke: var(--current);
            stroke-width: 3;
        }

        .version-circle.restored {
            fill: var(--restored);
            stroke: var(--restored);
        }

        .version-label {
            fill: var(--fg);
            font-size: 14px;
            user-select: none;
        }

        .version-meta {
            fill: var(--fg-dim);
            font-size: 10px;
            user-select: none;
        }

        .pos-text {
            fill: var(--pos);
        }

        .neg-text {
            fill: var(--neg);
        }

        .tag-inverted {
            color: #000;
            background: #fff;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .timeline-line {
            stroke: var(--border);
            stroke-width: 2;
        }

        .transition-line {
            stroke: var(--transition);
            stroke-width: 1.5;
            stroke-dasharray: 4 4;
            fill: none;
        }

        .transition-arrow {
            fill: var(--transition);
        }

        .info-panel {
            position: fixed;
            right: 18px;
            top: 70px;
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            display: none;
            backdrop-filter: blur(10px);
        }

        .info-panel.show {
            display: block;
        }

        .info-panel h2 {
            font-size: 11px;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 10px;
        }

        .info-label {
            color: var(--fg-dim);
        }

        .info-value {
            color: var(--fg);
            font-weight: 400;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 400;
            margin-top: 10px;
            width: 100%;
            transition: all 0.2s ease;
            font-family: "Iosevka Web", system-ui, sans-serif;
        }

        button:hover {
            background: #5ab0ff;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            text-align: center;
            padding: 36px 18px;
            color: var(--fg-dim);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.9);
            color: var(--fg);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            z-index: 1000;
            display: none;
            white-space: nowrap;
            border: 1px solid var(--border);
        }

        .tooltip.show {
            display: block;
        }
    </style>
    <script src="/notify.js"></script>
</head>
<body>
    <header>
        <h1>Document History</h1>
        <div class="status" id="status">Disconnected</div>
    </header>

    <main>
        <div id="timeline-container">
            <div class="empty-state" id="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <p>Loading document history...</p>
            </div>
            <svg id="timeline-svg" style="display: none;"></svg>
        </div>
    </main>

    <div class="info-panel" id="info-panel">
        <h2>Version Details</h2>
        <div class="info-row">
            <span class="info-label">Version:</span>
            <span class="info-value" id="info-version">#0</span>
        </div>
        <div class="info-row">
            <span class="info-label">Timestamp:</span>
            <span class="info-value" id="info-timestamp">—</span>
        </div>
        <div class="info-row">
            <span class="info-label">Box Count:</span>
            <span class="info-value" id="info-boxes">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">File:</span>
            <span class="info-value" id="info-filename">—</span>
        </div>
        <div class="info-row">
            <span class="info-label">Name:</span>
            <input id="info-name-input" type="text" value="" placeholder="(unnamed)"
                   style="background: transparent; color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; width: 170px; font-family: inherit; font-size: 10px;">
        </div>
        <button id="restore-btn">Restore This Version</button>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${document.location.host}/ws`;
        const statusEl = document.getElementById('status');
        const emptyStateEl = document.getElementById('empty-state');
        const timelineSvg = document.getElementById('timeline-svg');
        const infoPanelEl = document.getElementById('info-panel');
        const tooltipEl = document.getElementById('tooltip');

        let ws = null;
        let versions = [];
    let transitions = [];
    let selectedVersion = null;
    let sessionEstablished = false;
    let namingInFlight = false;
    let reloadScheduled = false;
        const nameInput = document.getElementById('info-name-input');

        function isZeroDiff(stats) {
            const s = normalizeDiffStats(stats);
            if (!s) return false;
            return s.totalAdded === 0 &&
                s.totalRemoved === 0 &&
                s.fromNew === 0 &&
                s.fromDeleted === 0 &&
                s.fromChangesAdd === 0 &&
                s.fromChangesDel === 0 &&
                s.boxesAdded === 0 &&
                s.boxesDeleted === 0;
        }

        // Get document name from URL, fallback to 'default'
        const urlParams = new URLSearchParams(window.location.search);
        const filename = urlParams.get('file') || 'default';
        const username = urlParams.get('user') || 'viewer';

        // WebSocket connection
        function connect() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                statusEl.textContent = 'Connecting...';

                // First establish session with hello message
                send({
                    name: 'hello',
                    payload: {
                        filename: filename,
                        username: username
                    }
                });
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    handleMessage(message);
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            };

            ws.onclose = () => {
                statusEl.textContent = 'Disconnected';
                statusEl.classList.remove('connected');
                sessionEstablished = false;
                setTimeout(connect, 2000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function send(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(message));
            }
        }

        function handleMessage(message) {
            console.log('Received message:', message);

            // Check for hello acknowledgment or any successful response
            if (!sessionEstablished && message.name !== 'history-versions-list') {
                sessionEstablished = true;
                statusEl.textContent = 'Connected';
                statusEl.classList.add('connected');

                // Now request history data
                send({
                    name: 'list-history-versions',
                    payload: {}
                });
            }

            if (message.name === 'history-versions-list') {
                const payload = message.payload;
                versions = payload.versions || [];
                transitions = payload.transitions || [];
                renderTimeline();
            } else if (message.name === 'restore-version-success') {
                notify('Version restored. Resyncing the document…', 'history');
                // Reload history to show the new state
                send({
                    name: 'list-history-versions',
                    payload: {}
                });
                scheduleDocumentReload();
            } else if (message.name === 'restore-version-error') {
                const error = message.payload.error || 'Unknown error';
                notify('Failed to restore version: ' + error, 'error');
            } else if (message.name === 'name-history-version-success') {
                namingInFlight = false;
                nameInput.disabled = false;
                send({
                    name: 'list-history-versions',
                    payload: {}
                });
            } else if (message.name === 'name-history-version-error') {
                namingInFlight = false;
                nameInput.disabled = false;
                const error = message.payload?.error || 'Unknown error';
                notify('Failed to name version: ' + error, 'error');
            }
        }

        function scheduleDocumentReload() {
            if (reloadScheduled) return;
            reloadScheduled = true;
            setTimeout(() => {
                try {
                    if (window.opener && !window.opener.closed) {
                        window.opener.location.reload();
                        return;
                    }
                    if (window.parent && window.parent !== window) {
                        window.parent.location.reload();
                        return;
                    }
                } catch (e) {
                    console.warn('Unable to reload parent window after restore:', e);
                }
                window.location.reload();
            }, 300);
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString();
        }

        function formatRelativeTime(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `${days}d ago`;
            if (hours > 0) return `${hours}h ago`;
            if (minutes > 0) return `${minutes}m ago`;
            return `${seconds}s ago`;
        }

        function normalizeDiffStats(stats) {
            if (!stats) return null;
            return {
                totalAdded: stats.totalLinesAdded ?? 0,
                totalRemoved: stats.totalLinesRemoved ?? 0,
                fromNew: stats.linesAddedFromNew ?? 0,
                fromDeleted: stats.linesRemovedFromDeleted ?? 0,
                fromChangesAdd: stats.linesAddedFromChanges ?? 0,
                fromChangesDel: stats.linesRemovedFromChanges ?? 0,
                boxesAdded: stats.boxesAdded ?? 0,
                boxesDeleted: stats.boxesDeleted ?? 0
            };
        }

        function renderDiffLine(textEl, stats) {
            const normalized = normalizeDiffStats(stats);
            if (!normalized) {
                textEl.textContent = '—';
                return;
            }

            const tspan = (text, cls) => {
                const el = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
                if (cls) el.setAttribute('class', cls);
                el.textContent = text;
                textEl.appendChild(el);
            };
            const tspanNum = (value, prefix, cls) => {
                const useClass = value !== 0 ? cls : null;
                tspan(`${prefix}${value}`, useClass);
            };

            const {
                totalAdded,
                totalRemoved,
                fromNew,
                fromDeleted,
                fromChangesAdd,
                fromChangesDel,
                boxesAdded,
                boxesDeleted
            } = normalized;

            tspanNum(totalAdded, '+', 'pos-text');
            tspan(' / ');
            tspanNum(totalRemoved, '-', 'neg-text');
            tspan(' lines (');
            tspan('new ');
            tspanNum(fromNew, '+', 'pos-text');
            tspan(', del ');
            tspanNum(fromDeleted, '-', 'neg-text');
            tspan(', Δ ');
            tspanNum(fromChangesAdd, '+', 'pos-text');
            tspan('/');
            tspanNum(fromChangesDel, '-', 'neg-text');
            tspan(', boxes ');
            tspanNum(boxesAdded, '+', 'pos-text');
            tspan('/');
            tspanNum(boxesDeleted, '-', 'neg-text');
            tspan(')');
        }

        function renderTimeline() {
            let visibleVersions = versions.filter(v => !isZeroDiff(v.diffStats));
            if (visibleVersions.length === 0) {
                visibleVersions = versions;
            }

            if (visibleVersions.length === 0) {
                emptyStateEl.style.display = 'block';
                emptyStateEl.querySelector('p').textContent = 'No version history available yet.';
                timelineSvg.style.display = 'none';
                return;
            }

            emptyStateEl.style.display = 'none';
            timelineSvg.style.display = 'block';

            const width = 1200;
            const nodeRadius = 8;
            const nodeSpacing = 70;
            const leftMargin = 70;
            const topMargin = 30;
            const labelOffset = 80;

            const height = topMargin + (visibleVersions.length - 1) * nodeSpacing + 100;
            
            // Clear existing content
            timelineSvg.innerHTML = '';
            timelineSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);

            const currentVersionIndex = versions.length - 1;
            const visibleIndexMap = new Map();
            visibleVersions.forEach((v, idx) => visibleIndexMap.set(v.index ?? idx, idx));
            const visibleCurrentIndex = visibleIndexMap.get(currentVersionIndex) ?? (visibleVersions.length - 1);
            const visibleOrigIndices = visibleVersions.map(v => v.index ?? 0);

            const mapToVisible = (origIdx) => {
                const direct = visibleIndexMap.get(origIdx);
                if (direct !== undefined) return direct;
                // fallback: nearest visible index by original order
                let nearest = 0;
                let bestDelta = Number.MAX_SAFE_INTEGER;
                visibleOrigIndices.forEach((orig, i) => {
                    const delta = Math.abs(orig - origIdx);
                    if (delta < bestDelta) {
                        bestDelta = delta;
                        nearest = i;
                    }
                });
                return nearest;
            };

            // Draw main timeline segments (independent lines so we can cut specific spans)
            for (let i = 0; i < visibleVersions.length - 1; i++) {
                const seg = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                seg.setAttribute('id', `segment-${i + 1}`); // segment leading into index i+1
                seg.setAttribute('x1', leftMargin);
                seg.setAttribute('y1', topMargin + i * nodeSpacing);
                seg.setAttribute('x2', leftMargin);
                seg.setAttribute('y2', topMargin + (i + 1) * nodeSpacing);
                seg.setAttribute('class', 'timeline-line');
                timelineSvg.appendChild(seg);
            }

            // Draw transition curves
            transitions.forEach(trans => {
                const fromIdx = mapToVisible(trans.fromIndex);
                const toIdx = mapToVisible(trans.toIndex);
                if (trans.fromIndex >= 0 && trans.toIndex >= 0 && 
                    trans.fromIndex < versions.length && trans.toIndex < versions.length) {

                    // Cut straight line segments along the arc span
                    const cutStraightLine = (idx) => {
                        const original = document.getElementById(`segment-${idx}`);
                        if (original) {
                            timelineSvg.removeChild(original);
                        }
                    }

                    const fromY = topMargin + fromIdx * nodeSpacing;
                    const toY = topMargin + toIdx * nodeSpacing;
                    const curveOffset = 60;
                    
                    // Draw a curved line showing the transition
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const d = `M ${leftMargin} ${fromY} 
                               C ${leftMargin + curveOffset} ${fromY}, 
                                 ${leftMargin + curveOffset} ${toY}, 
                                 ${leftMargin} ${toY}`;
                    path.setAttribute('d', d);
                    path.setAttribute('class', 'transition-line');
                    timelineSvg.appendChild(path);
                    
                    // Add arrow at the end
                    const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    const arrowSize = 5;
                    arrow.setAttribute('points', 
                        `${leftMargin},${toY} 
                         ${leftMargin + arrowSize},${toY - arrowSize} 
                         ${leftMargin + arrowSize},${toY + arrowSize}`);
                    arrow.setAttribute('class', 'transition-arrow');
                    timelineSvg.appendChild(arrow);

                    // If this jump skips over linear history, cut the straight segment leading into the target
                    if (Math.abs(toIdx - fromIdx) > 1) {
                        // Cut the straight segment that would have connected into the target
                        cutStraightLine(Math.max(fromIdx, toIdx));
                    }
                }
            });

            // Draw version nodes
            visibleVersions.forEach((version, displayIndex) => {
                const originalIndex = version.index ?? displayIndex;
                const y = topMargin + displayIndex * nodeSpacing;
                
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.setAttribute('class', 'version-node');
                group.setAttribute('data-index', originalIndex);
                
                // Circle
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', leftMargin);
                circle.setAttribute('cy', y);
                circle.setAttribute('r', nodeRadius);
                circle.setAttribute('class', 'version-circle' + 
                    (originalIndex === currentVersionIndex ? ' current' : ''));
                group.appendChild(circle);

                // Label and metadata on one line
                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                label.setAttribute('x', leftMargin + labelOffset);
                label.setAttribute('y', y + 4);
                label.setAttribute('class', 'version-label');
                const labelTitle = (version.message && version.message.trim())
                    ? version.message.trim()
                    : `Version #${originalIndex}`;
                const parts = [labelTitle, '•', `${version.boxCount} boxes`, '•', formatRelativeTime(version.timestamp)];
                label.textContent = parts.join(' ');
                group.appendChild(label);

                const diffLine = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                diffLine.setAttribute('x', leftMargin + labelOffset);
                diffLine.setAttribute('y', y + 26);
                diffLine.setAttribute('class', 'version-meta');
                renderDiffLine(diffLine, version.diffStats);
                group.appendChild(diffLine);

                // Click handler
                group.addEventListener('click', () => selectVersion(originalIndex));

                // Hover handlers for tooltip
                group.addEventListener('mouseenter', (e) => {
                    tooltipEl.textContent = formatTimestamp(version.timestamp);
                    tooltipEl.classList.add('show');
                });

                group.addEventListener('mousemove', (e) => {
                    tooltipEl.style.left = (e.clientX + 15) + 'px';
                    tooltipEl.style.top = (e.clientY + 15) + 'px';
                });

                group.addEventListener('mouseleave', () => {
                    tooltipEl.classList.remove('show');
                });

                timelineSvg.appendChild(group);
            });
        }

        function selectVersion(index) {
            if (index < 0 || index >= versions.length) return;
            
            selectedVersion = versions[index];
            
            // Update info panel
            document.getElementById('info-version').textContent = `#${index}`;
            document.getElementById('info-timestamp').textContent = formatTimestamp(selectedVersion.timestamp);
            document.getElementById('info-boxes').textContent = selectedVersion.boxCount;
            document.getElementById('info-filename').textContent = selectedVersion.filename;
            nameInput.value = selectedVersion.message || '';

            // Show/hide restore button
            const restoreBtn = document.getElementById('restore-btn');
            const isCurrentVersion = index === versions.length - 1;
            restoreBtn.disabled = isCurrentVersion;
            restoreBtn.textContent = isCurrentVersion ? 'Current Version' : 'Restore This Version';

            infoPanelEl.classList.add('show');

            // Highlight selected node
            document.querySelectorAll('.version-node').forEach(node => {
                const nodeIndex = parseInt(node.getAttribute('data-index'));
                const circle = node.querySelector('.version-circle');
                if (nodeIndex === index) {
                    circle.setAttribute('stroke-width', '4');
                } else if (nodeIndex === versions.length - 1) {
                    circle.setAttribute('stroke-width', '3');
                } else {
                    circle.setAttribute('stroke-width', '2');
                }
            });
        }

        // Restore button handler
        document.getElementById('restore-btn').addEventListener('click', () => {
            if (!selectedVersion || document.getElementById('restore-btn').disabled) return;

            const index = versions.indexOf(selectedVersion);
            send({
                name: 'restore-history-version',
                payload: {
                    versionIndex: index
                }
            });
        });

        // Name input handler (on Enter)
        nameInput.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            if (!selectedVersion || namingInFlight) return;
            const index = versions.indexOf(selectedVersion);
            const name = nameInput.value.trim();
            namingInFlight = true;
            nameInput.disabled = true;
            send({
                name: 'name-history-version',
                payload: {
                    versionIndex: index,
                    name: name
                }
            });
        });

        // Initialize
        connect();
    </script>
</body>
</html>
