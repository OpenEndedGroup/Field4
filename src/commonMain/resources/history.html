<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>Document History</title>
        <style>
            @import url("/iosevka.css");

            :root {
                --bg: #111111;
                --shell: #000000;
                --panel: #1f1f1f;
                --panel-2: #242424;
                --panel-3: #181818;
                --fg: #d8d8d8;
                --muted: #8a8a8a;
                --dim: #5c5c5c;
                --line: #050505;
                --line-2: #101010;
                --accent: #d8d8d8;
                --field-cyan: rgb(72, 201, 255);
                --good: #8ee38e;
                --bad: #ff8585;
                --warn: #e7b36a;
                --info: #8bbdff;
                --gutter: 8px;
                --gap: 6px;
                --radius-panel: 8px;
                --radius-control: 6px;
                --radius-tight: 5px;
            }

            * {
                box-sizing: border-box;
                font-family: "Iosevka Web", "Iosevka", monospace;
            }

            *:focus,
            *:focus-visible {
                outline: none !important;
            }

            body {
                margin: 0;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                background: var(--shell);
                color: var(--fg);
                font-size: 10.2px;
            }

            button,
            input {
                font: inherit;
            }

            button {
                color: var(--fg);
                background: #050505;
                border: 1px solid #2b2b2b;
                border-radius: var(--radius-control);
                padding: 4px 8px;
                min-height: 28px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                line-height: 1;
                cursor: pointer;
                box-shadow: none;
            }

            button:hover {
                color: #f0f0f0;
                background: #101010;
                border-color: #464646;
            }

            button:disabled {
                color: var(--dim);
                border-color: #202020;
                cursor: default;
                box-shadow: none;
            }

            .picker-toggle {
                color: var(--muted);
                background: #0a0a0a;
            }

            .mode-toggle {
                color: var(--muted);
                background: transparent;
                border: 0;
                border-radius: 0;
                min-height: 28px;
                padding: 0 0 2px;
                box-shadow: none;
                border-bottom: 1px solid transparent;
            }

            .picker-toggle[aria-pressed="true"] {
                color: var(--fg);
                background: #1a1a1a;
                border-color: #4d3b22;
            }

            .mode-toggle[aria-pressed="true"] {
                color: var(--field-cyan);
                border-bottom-color: rgba(72, 201, 255, 0.55);
            }

            .picker-toggle:hover {
                background: #121212;
                border-color: #5e4628;
            }

            .mode-toggle:hover {
                color: var(--fg);
                background: transparent;
                border: 0;
                box-shadow: none;
            }

            .icon-button {
                width: 26px;
                height: 26px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                font-size: 17px;
                line-height: 1;
            }

            input[type="text"] {
                background: #050505;
                border: 1px solid #2b2b2b;
                border-radius: var(--radius-control);
                color: var(--fg);
                height: 28px;
                padding: 0 7px;
                min-width: 0;
                box-shadow: none;
                line-height: 1;
            }

            input[type="text"]:focus,
            input[type="search"]:focus {
                outline: none;
            }

            input[type="search"] {
                background: rgba(0, 0, 0, 0.55);
                border: 0;
                border-radius: var(--radius-tight);
                color: var(--fg);
                height: 18px;
                width: 110px;
                min-width: 0;
                padding: 0 6px;
                box-shadow: none;
                line-height: 1;
            }

            .app {
                display: grid;
                grid-template-rows: auto auto minmax(0, 1fr);
                height: 100vh;
                min-width: 760px;
                max-width: 100vw;
                overflow: hidden;
                padding: var(--gutter);
                gap: var(--gap);
                background: var(--shell);
                border-radius: var(--radius-panel);
            }

            header {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0;
                min-height: 28px;
                border: 0;
                border-radius: 0;
                background: var(--shell);
            }

            h1 {
                margin: 0;
                font-size: 11px;
                font-weight: 500;
                letter-spacing: 0;
                white-space: nowrap;
                line-height: 1;
                margin-right: 6px;
            }

            .spacer {
                flex: 1;
            }

            .activity-indicator {
                width: 20px;
                height: 20px;
                justify-self: center;
                position: relative;
                opacity: 0.38;
                transition: opacity 0.18s;
                pointer-events: none;
            }

            button.activity-indicator {
                flex: none;
                border: 0;
                border-radius: 50%;
                padding: 0;
                min-height: 20px;
                background: transparent;
                box-shadow: none;
                cursor: pointer;
                pointer-events: auto;
            }

            button.activity-indicator:hover {
                opacity: 0.78;
                background: transparent;
                box-shadow: none;
            }

            .activity-indicator::before,
            .activity-indicator::after {
                content: "";
                position: absolute;
                inset: 4px;
                border: 2px solid #303030;
                border-radius: 50%;
            }

            .activity-indicator::after {
                border-color: var(--warn) transparent transparent transparent;
                opacity: 0;
            }

            .activity-indicator.loading {
                opacity: 0.92;
            }

            .activity-indicator.loading::after {
                opacity: 1;
                animation: historyActivitySpin 0.8s linear infinite;
            }

            @keyframes historyActivitySpin {
                to {
                    transform: rotate(360deg);
                }
            }

            .timeline {
                position: relative;
                min-width: 0;
                max-width: 100%;
                overflow: hidden;
                padding: 0;
                border: 0;
                border-radius: 0;
                background: var(--shell);
            }

            .timeline-top {
                display: contents;
            }

            .history-chrome-meta {
                display: flex;
                align-items: center;
                gap: 18px;
                min-width: 0;
                min-height: 28px;
                margin-left: 10px;
            }

            .target-title {
                display: flex;
                gap: 8px;
                align-items: center;
                min-width: 0;
                min-height: 28px;
            }

            .target-title strong {
                font-size: 12px;
                font-weight: 500;
                white-space: nowrap;
                line-height: 1;
            }

            .target-title span {
                color: var(--muted);
                font-size: 9px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                line-height: 1;
            }

            .name-edit {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
                width: 100%;
                margin: 12px 0 0;
            }

            .name-edit input {
                flex: 1;
                font-size: 12px;
            }

            .history-actions {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-left: 12px;
            }

            .apply-actions {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-left: 14px;
            }

        .rail-shell {
            position: relative;
            width: 100%;
            min-width: 0;
            max-width: 100%;
                height: 74px;
                overflow-x: auto;
                overflow-y: hidden;
                border: 0;
                border-radius: var(--radius-panel);
                background: var(--panel-2);
                cursor: ew-resize;
                touch-action: none;
            user-select: none;
            contain: layout paint;
            scrollbar-color: #0b0b0b var(--panel-2);
            scrollbar-width: thin;
        }

        .rail-shell::-webkit-scrollbar {
            height: 5px;
        }

        .rail-shell::-webkit-scrollbar-track {
            background: var(--panel-2);
        }

        .rail-shell::-webkit-scrollbar-thumb {
            background: #0b0b0b;
            border-radius: 999px;
        }

        .rail-shell::-webkit-scrollbar-thumb:hover {
            background: #151515;
        }

        .history-progress {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 2px;
                z-index: 5;
                background: transparent;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.18s;
            }

            .history-progress.active {
                opacity: 1;
            }

            .history-progress-bar {
                display: block;
                width: 0%;
                height: 100%;
                background: var(--field-cyan);
                transition: width 0.16s linear;
            }

            .axis-toggle {
                position: absolute;
                left: 0px;
                top: 0px;
                z-index: 4;
                display: inline-flex;
                align-items: center;
                gap: 2px;
                padding: 0px;
                width: max-content;
                border-radius: 0 0 var(--radius-control) 0;
                background: rgba(0, 0, 0, 0.3);
                pointer-events: auto;
                backdrop-filter: blur(5px);
            }

            .axis-toggle button {
                min-height: 18px;
                padding: 2px 6px;
                border: 0;
                border-radius: var(--radius-tight);
                background: transparent;
                color: var(--muted);
                font-size: 8.5px;
            }

            .axis-toggle button[aria-pressed="true"] {
                color: var(--shell);
                background: var(--field-cyan);
            }

            .axis-toggle button:hover {
                color: var(--fg);
                background: #151515;
                border: 0;
            }

            .axis-toggle button[aria-pressed="true"]:hover {
                color: var(--shell);
                background: var(--field-cyan);
            }

            .axis-toggle input::placeholder {
                color: var(--dim);
            }

            .rail {
                position: relative;
                height: 72px;
                min-width: 0;
                max-width: none;
                flex: none;
            }

            .rail-line {
                position: absolute;
                left: 10px;
                right: 10px;
                top: 52px;
                height: 1px;
                background: #525252;
            }

            .branch-layer {
                position: absolute;
                left: 0;
                top: 0;
                height: 76px;
                pointer-events: none;
                overflow: visible;
            }

            .change-chart-layer {
                position: absolute;
                left: 0;
                top: 0;
                height: 76px;
                pointer-events: none;
                overflow: visible;
            }

            .activity-chart-layer,
            .edit-chart-layer,
            .time-grid-layer {
                position: absolute;
                left: 0;
                top: 0;
                height: 76px;
                pointer-events: none;
                overflow: visible;
            }

            .rail-unavailable {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 10px;
                background: rgba(255, 133, 133, 0.05);
                border-right: 2px solid #3e2020;
                pointer-events: none;
            }

            .rail-boundary {
                position: absolute;
                top: 6px;
                bottom: 6px;
                width: 1px;
                background: #633232;
                pointer-events: none;
            }

            .gap-marker {
                position: absolute;
                top: 44px;
                transform: translateX(-50%);
                padding: 0 5px 1px;
                border-radius: var(--radius-tight);
                background: var(--panel-2);
                color: var(--muted);
                font-size: 13px;
                line-height: 1;
                pointer-events: none;
                transition:
                    left 0.22s ease,
                    opacity 0.16s ease;
            }

            .dot {
                position: absolute;
                top: 52px;
                width: 7px;
                height: 7px;
                min-width: 0;
                min-height: 0;
                border-radius: 50%;
                border: 0;
                background: #8d8d8d;
                transform: translate(-50%, -50%);
                cursor: pointer;
                padding: 0;
                appearance: none;
                display: block;
                line-height: 0;
                transition:
                    left 0.22s ease,
                    opacity 0.16s ease;
            }

            .dot.named {
                width: 11px;
                height: 11px;
                background: #d0d0d0;
            }

            .dot.current {
                width: 13px;
                height: 13px;
                border: 2px solid #d0d0d0;
                background: #000;
            }

            .dot.active {
                background: var(--field-cyan);
            }

            .dot.selection-change {
                box-shadow: 0 0 0 3px rgba(231, 179, 106, 0.14);
            }

            .dot.selection-change::after {
                content: "";
                position: absolute;
                left: 50%;
                top: 50%;
                width: 15px;
                height: 15px;
                border-radius: 50%;
                border: 1px solid rgba(231, 179, 106, 0.34);
                transform: translate(-50%, -50%);
                pointer-events: none;
            }

            .dot-label {
                position: absolute;
                top: 5px;
                transform: translateX(-50%);
                color: var(--muted);
                font-size: 8.5px;
                white-space: nowrap;
                pointer-events: none;
                max-width: 130px;
                overflow: hidden;
                text-overflow: ellipsis;
                text-align: center;
                transition:
                    left 0.22s ease,
                    opacity 0.16s ease;
            }

            .content {
                min-height: 0;
                display: grid;
                grid-template-columns: 310px minmax(0, 1fr);
                gap: var(--gap);
                background: var(--shell);
            }

            aside {
                border: 0;
                border-radius: 0;
                background: var(--shell);
                min-height: 0;
                overflow: auto;
                padding: 0;
            }

            .summary-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0;
                border: 0;
                border-radius: var(--radius-control);
                background: var(--panel-2);
                overflow: hidden;
            }

            .metric {
                border: 0;
                border-right: 3px solid var(--shell);
                border-bottom: 3px solid var(--shell);
                border-radius: 0;
                background: transparent;
                padding: 6px 7px;
                min-height: 0;
                display: flex;
                gap: 6px;
                align-items: baseline;
                justify-content: space-between;
            }

            .metric:last-child {
                border-right: 0;
            }

            .metric:nth-child(2n) {
                border-right: 0;
            }

            .metric:nth-last-child(-n + 2) {
                border-bottom: 0;
            }

            .metric label {
                color: var(--muted);
                font-size: 8.5px;
                margin-bottom: 0;
            }

            .metric strong {
                font-size: 12px;
                font-weight: 500;
            }

            .section-title {
                margin: 12px 0 6px;
                color: var(--muted);
                font-size: 10px;
                text-transform: uppercase;
            }

            .named-list,
            .transition-list {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .named-item,
            .transition-item {
                display: grid;
                grid-template-columns: 44px minmax(0, 1fr) auto;
                gap: 6px;
                align-items: center;
                border: 0;
                border-radius: var(--radius-control);
                background: var(--panel-2);
                padding: 6px 8px;
                cursor: pointer;
            }

            .named-item:hover,
            .transition-item:hover {
                background: #2a2a2a;
            }

            .named-item span,
            .transition-item span {
                color: var(--muted);
            }

            .named-item strong,
            .transition-item strong {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-weight: 400;
            }

            .version-meta {
                color: var(--muted);
                font-size: 9px;
                white-space: nowrap;
                text-align: right;
            }

            .changes {
                min-width: 0;
                min-height: 0;
                display: grid;
                grid-template-rows: auto minmax(0, 1fr);
                background: var(--panel);
                border-radius: 0;
            }

            .change-toolbar {
                display: flex;
                gap: 7px;
                align-items: center;
                padding: 0 0 var(--gap);
                border-bottom: 0;
                background: var(--shell);
                border-radius: 0;
            }

            .change-toolbar .small {
                color: var(--muted);
            }

            .change-list {
                min-height: 0;
                overflow: auto;
                padding: 5px;
            }

            .screenshot-strip {
                display: flex;
                align-items: stretch;
                gap: 5px;
                margin-bottom: var(--gap);
                padding: 5px;
                overflow-x: auto;
                border: 4px solid var(--shell);
                border-radius: var(--radius-panel);
                background: var(--shell);
            }

            .screenshot-thumb {
                position: relative;
                flex: 0 0 132px;
                height: 78px;
                overflow: hidden;
                border: 4px solid var(--shell);
                border-radius: var(--radius-control);
                background: var(--panel-2);
                color: var(--text);
                text-decoration: none;
            }

            .screenshot-thumb img {
                width: 100%;
                height: 100%;
                display: block;
                object-fit: cover;
                opacity: 0.86;
            }

            .screenshot-thumb span {
                position: absolute;
                left: 0;
                bottom: 0;
                max-width: 100%;
                padding: 3px 5px;
                border-radius: 0 var(--radius-control) 0 0;
                background: var(--shell);
                color: var(--text);
                font-size: 9px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .empty {
                color: var(--muted);
                padding: 18px;
                border: 4px solid var(--shell);
                border-radius: var(--radius-panel);
                background: var(--panel-2);
            }

            .creation-warning {
                color: var(--warn);
                border: 4px solid var(--shell);
                border-radius: var(--radius-panel);
                background: #221b12;
                padding: 8px 10px;
                margin-bottom: 8px;
            }

            .box-card {
                border: 4px solid var(--shell);
                border-radius: var(--radius-panel);
                background: var(--shell);
                margin-bottom: var(--gap);
                overflow: hidden;
            }

            .box-card.target-only {
                box-shadow: inset 0 0 0 1px #315831;
            }

            .box-card.present-only {
                box-shadow: none;
            }

            .box-head {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr) minmax(
                        90px,
                        190px
                    ) auto auto;
                gap: 8px;
                align-items: center;
                padding: 9px 10px;
                border-bottom: 4px solid var(--shell);
                border-radius: var(--radius-control) var(--radius-control) 0 0;
                background: var(--shell);
            }

            .box-title {
                min-width: 0;
            }

            .box-title strong {
                display: block;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-weight: 500;
            }

            .box-uid {
                color: var(--muted);
                font-size: 10px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                text-align: right;
            }

            .pill {
                background: #111111;
                border: 2px solid var(--shell);
                border-radius: var(--radius-control);
                color: var(--muted);
                padding: 3px 5px;
                font-size: 10px;
                white-space: nowrap;
                box-shadow: inset 0 0 0 1px #2a2a2a;
            }

            .pill.target-only {
                color: var(--good);
                box-shadow: inset 0 0 0 1px #315831;
            }

            .pill.present-only {
                color: var(--bad);
                box-shadow: inset 0 0 0 1px #633232;
            }

            .props {
                display: flex;
                flex-direction: column;
                gap: 4px;
                background: var(--shell);
            }

            .prop-row {
                display: grid;
                grid-template-columns: auto minmax(
                        76px,
                        112px
                    ) 58px 104px minmax(0, 1fr) auto;
                gap: 8px;
                align-items: center;
                padding: 7px 10px;
                border-top: 0;
                background: var(--panel-2);
            }

            .prop-row:first-child {
                border-top: 0;
            }

            .prop-row:last-child {
                border-radius: 0 0 var(--radius-control) var(--radius-control);
            }

            .prop-name {
                color: var(--fg);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .prop-kind,
            .prop-status,
            .line-stats {
                color: var(--muted);
                font-size: 10px;
                white-space: nowrap;
            }

            .preview {
                color: var(--fg);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .preview-value {
                color: var(--muted);
            }

            .preview-hit {
                color: var(--fg);
                background: rgba(72, 201, 255, 0.22);
                border-radius: 3px;
                padding: 0 2px;
            }

            .preview-arrow,
            .frame-arrow {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: none;
                min-width: 28px;
                margin: 0 8px;
                padding: 1px 7px 2px;
                border-radius: var(--radius-control);
                background: var(--shell);
                color: var(--fg);
                font-weight: 700;
                letter-spacing: 0;
            }

            .preview.frame-preview {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
            }

            .frame-state {
                display: inline-flex;
                align-items: baseline;
                gap: 6px;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .frame-label {
                color: var(--dim);
                font-size: 10px;
            }

            .frame-value {
                color: var(--fg);
            }

            .frame-arrow {
                font-size: 10px;
            }

            .frame-arrow span {
                color: inherit;
            }

            .plus {
                color: var(--good);
            }

            .minus {
                color: var(--bad);
            }

            .move {
                color: var(--info);
            }

            .changed {
                color: var(--warn);
            }

            .busy {
                opacity: 0.55;
            }

            @media (max-width: 760px) {
                .app {
                    min-width: 0;
                }

                header {
                    gap: 6px;
                }

                .timeline-top,
                .content,
                .box-head,
                .prop-row {
                    grid-template-columns: minmax(0, 1fr);
                }

                .box-uid {
                    text-align: left;
                }
            }
        </style>
        <script src="/notify.js"></script>
    </head>
    <body>
        <div class="app">
            <header>
                <h1>Document History</h1>
                <button
                    id="refresh-btn"
                    class="activity-indicator"
                    aria-label="Refresh history"
                    title="Refresh history"
                ></button>
                <button
                    id="selected-filter-btn"
                    class="mode-toggle"
                    aria-pressed="false"
                >
                    Whole Document
                </button>
                <button
                    id="diff-basis-btn"
                    class="mode-toggle"
                    aria-pressed="true"
                    title="Diff selected versions against the current document"
                >
                    Against Current
                </button>
                <div class="history-chrome-meta">
                    <div class="target-title">
                        <strong id="target-version">#0</strong>
                        <span id="target-meta">Loading...</span>
                    </div>
                </div>
                <div class="spacer"></div>
                <div class="apply-actions">
                    <button id="cherry-pick-btn" disabled>
                        Apply &mdash; selected boxes
                    </button>
                    <button id="full-restore-btn">
                        Apply &mdash; full restore
                    </button>
                </div>
                <div class="history-actions">
                    <button
                        id="close-btn"
                        class="icon-button"
                        aria-label="Close"
                        title="Close"
                    >
                        &times;
                    </button>
                </div>
            </header>

            <section class="timeline">
                <div class="axis-toggle" role="group" aria-label="History axis">
                    <button
                        class="axis-btn"
                        data-axis="saves"
                        aria-pressed="true"
                    >
                        Saves
                    </button>
                    <button
                        class="axis-btn"
                        data-axis="time"
                        aria-pressed="false"
                    >
                        Time
                    </button>
                    <button class="axis-focus-btn" aria-pressed="false">
                        Focus
                    </button>
                    <button
                        class="rail-zoom-btn"
                        data-zoom="out"
                        aria-label="Zoom out"
                        title="Zoom out"
                    >
                        −
                    </button>
                    <button
                        class="rail-zoom-btn"
                        data-zoom="in"
                        aria-label="Zoom in"
                        title="Zoom in"
                    >
                        +
                    </button>
                    <button
                        id="line-blame-btn"
                        class="line-blame-btn"
                        aria-pressed="false"
                        title="Filter to versions that affected the current editor line"
                    >
                        Line
                    </button>
                    <input
                        id="history-search-input"
                        type="search"
                        placeholder="search changes"
                    />
                </div>
                <div class="rail-shell">
                    <div class="rail" id="rail">
                        <div class="rail-line"></div>
                    </div>
                </div>
                <div class="history-progress" id="history-progress">
                    <span
                        class="history-progress-bar"
                        id="history-progress-bar"
                    ></span>
                </div>
            </section>

            <section class="content">
                <aside>
                    <div class="summary-grid">
                        <div class="metric">
                            <label>Boxes</label
                            ><strong id="metric-boxes">0</strong>
                        </div>
                        <div class="metric">
                            <label>Properties</label
                            ><strong id="metric-props">0</strong>
                        </div>
                        <div class="metric">
                            <label>Lines</label
                            ><strong id="metric-lines">0</strong>
                        </div>
                        <div class="metric">
                            <label>Selected</label
                            ><strong id="metric-selected">0</strong>
                        </div>
                    </div>
                    <div class="section-title">Named Versions</div>
                    <div class="named-list" id="named-list"></div>
                    <div class="name-edit">
                        <input
                            id="name-input"
                            type="text"
                            placeholder="name this version"
                        />
                        <button id="name-save-btn">Name</button>
                    </div>
                    <div class="section-title">Version Jumps</div>
                    <div class="transition-list" id="transition-list"></div>
                </aside>

                <section class="changes">
                    <div class="change-toolbar">
                        <button
                            id="select-all-btn"
                            class="picker-toggle"
                            aria-pressed="false"
                        >
                            Pick Boxes
                        </button>
                        <button id="clear-selection-btn">Clear</button>
                        <span class="small" id="change-caption"
                            >No diff loaded</span
                        >
                    </div>
                    <div class="change-list" id="change-list">
                        <div class="empty">Loading document history...</div>
                    </div>
                </section>
            </section>
        </div>

        <script>
            const WS_URL = `${location.protocol === "https:" ? "wss" : "ws"}://${document.location.host}/ws`;
            const diffStatusEl = document.getElementById("refresh-btn");
            const railShellEl = document.querySelector(".rail-shell");
            const railEl = document.getElementById("rail");
            const nameInput = document.getElementById("name-input");
            const changeListEl = document.getElementById("change-list");
            const historySearchInput = document.getElementById(
                "history-search-input",
            );
            const lineBlameButton = document.getElementById("line-blame-btn");
            const historyProgressEl =
                document.getElementById("history-progress");
            const historyProgressBarEl = document.getElementById(
                "history-progress-bar",
            );
            const RAIL_HEIGHT = 76;
            const RAIL_AXIS_Y = 52;
            const RAIL_CHART_UP_RANGE = 24;
            const RAIL_CHART_DOWN_RANGE = 18;
            const RAIL_ACTIVITY_TOP = 7;
            const RAIL_ACTIVITY_HEIGHT = 16;
            const RAIL_EDIT_TOP = 28;
            const RAIL_EDIT_HEIGHT = 12;

            const urlParams = new URLSearchParams(window.location.search);
            const filename = urlParams.get("file") || "default";
            const username = urlParams.get("user") || "viewer";

            let ws = null;
            let versions = [];
            let transitions = [];
            let selectedIndex = 0;
            let currentDiff = null;
            let selectedOnly = false;
            let diffBasis = "current";
            let sessionEstablished = false;
            let diffTimer = null;
            let historyRefreshTimer = null;
            let preserveNextHistorySelection = false;
            let namingInFlight = false;
            let cherryInFlight = false;
            let activeHighlightUid = null;
            let highlightRaf = null;
            let highlightSignatureCache = "";
            let historyEditorPreview = null;
            let railPositions = [];
            let railScrubbing = false;
            let railAxisMode = "saves";
            let railFocusEnabled = false;
            let railGapMarkers = [];
            let railZoom = 1;
            let railGestureScale = 1;
            let lastRailClientX = null;
            let historySearchQuery = "";
            let historySearchTimer = null;
            let historySearchMatches = null;
            let lineBlameActive = false;
            let lineBlameContext = null;
            let lineBlameMatches = null;
            let lineBlameRequestSignature = "";
            let lineBlameTimer = null;
            let historyStatsLoading = false;
            let historyRequestInFlight = false;
            let historyRefreshPending = false;
            let pendingDiffAfterStats = false;
            let historyStatsRenderRaf = null;
            let diffPlaceholderText = "Diffing...";
            let lastParentSelectionSignature = "";
            let parentSelectionPoll = null;
            let reconnectTimer = null;
	            let disposed = false;
	            let electronScreenshotInFlight = false;
	            let electronScreenshotPendingVersion = null;
	            let railLineStatsRequestSignature = "";
	            let railLineStatsTimer = null;
	            const selectedBoxes = new Set();
	            const selectedProps = new Map();
	            const exactLineDeltaCache = new Map();

            function connect() {
                if (disposed) return;
                ws = new WebSocket(WS_URL);
                ws.onopen = () => {
                    if (disposed) return;
                    setHistoryActivity(true, "Connecting");
                    send({ name: "hello", payload: { filename, username } });
                };
                ws.onmessage = (event) => {
                    if (disposed) return;
                    try {
                        handleMessage(JSON.parse(event.data));
                    } catch (error) {
                        console.error("history message parse failed", error);
                    }
                };
                ws.onclose = () => {
                    if (disposed) return;
                    sessionEstablished = false;
                    historyRequestInFlight = false;
                    historyRefreshPending = false;
                    historyStatsLoading = false;
                    clearParentHighlights(true);
                    clearParentEditorPreview();
                    setHistoryActivity(false, "Disconnected");
                    reconnectTimer = setTimeout(connect, 1500);
                };
            }

            function send(message) {
                if (!disposed && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify(message));
                }
            }

            function electronCaptureApi() {
                try {
                    if (window.fieldElectron?.captureHistoryScreenshot) {
                        return window.fieldElectron;
                    }
                    if (
                        window.parent &&
                        window.parent !== window &&
                        window.parent.fieldElectron?.captureHistoryScreenshot
                    ) {
                        return window.parent.fieldElectron;
                    }
                } catch (_) {}
                return null;
            }

            async function captureElectronHistoryScreenshot(versionIndex = -1) {
                const api = electronCaptureApi();
                if (!api || disposed) return;
                if (electronScreenshotInFlight) {
                    electronScreenshotPendingVersion = versionIndex;
                    return;
                }
                electronScreenshotInFlight = true;
                try {
                    const shot = await api.captureHistoryScreenshot();
                    if (!disposed && shot?.dataUrl) {
                        send({
                            name: "store-history-screenshot",
                            payload: {
                                channel: "electron-window",
                                dataUrl: shot.dataUrl,
                                versionIndex,
                                width: Number(shot.width) || 0,
                                height: Number(shot.height) || 0,
                            },
                        });
                    }
                } catch (error) {
                    console.warn("history screenshot capture failed", error);
                } finally {
                    electronScreenshotInFlight = false;
                    const pendingVersion = electronScreenshotPendingVersion;
                    electronScreenshotPendingVersion = null;
                    if (pendingVersion != null && !disposed) {
                        setTimeout(
                            () => captureElectronHistoryScreenshot(pendingVersion),
                            250,
                        );
                    }
                }
            }

            function confirmHistoryAction(message) {
                try {
                    if (
                        window.parent &&
                        window.parent !== window &&
                        typeof window.parent.confirm === "function"
                    ) {
                        return window.parent.confirm(message);
                    }
                } catch (_) {}
                return window.confirm(message);
            }

            function selectedVersion() {
                return versions[selectedIndex] || null;
            }

            function selectedVersionNumber() {
                return selectedVersion()?.index ?? selectedIndex;
            }

            function latestVersionNumber() {
                return versions[versions.length - 1]?.index ?? -1;
            }

            function selectedIsCurrentVersion() {
                return (
                    diffBasis === "current" &&
                    versions.length > 0 &&
                    selectedVersionNumber() === latestVersionNumber()
                );
            }

            function currentVersionNoDiff() {
                return {
                    versionIndex: selectedVersionNumber(),
                    currentIndex: latestVersionNumber(),
                    generatedAt: Date.now(),
                    basis: "current",
                    baselineIndex: latestVersionNumber(),
                    boxFilter: selectedParentUids(),
                    boxes: [],
                    changedBoxCount: 0,
                    propertyChangeCount: 0,
                    lineStats: {},
                };
            }

            function applyHistoryChanged(payload) {
                if (!payload || !versions.length) return false;
                const index = Number(payload.versionIndex);
                if (!Number.isFinite(index) || index < 0) return false;
                const wasAtLatest = selectedIndex >= versions.length - 1;
                const previousSelectedVersion = versions[selectedIndex]?.index;
                const current = versions[versions.length - 1] || {};
                const nextVersion = {
                    index,
                    filename: "metadata.edn",
                    timestamp: Number(payload.timestamp) || Date.now(),
                    boxCount: Number(payload.boxCount) || current.boxCount || 0,
                    byteSize: Number(payload.byteSize) || current.byteSize || 0,
                    boxIds: Array.isArray(payload.boxIds)
                        ? payload.boxIds
                        : current.boxIds || [],
                    message: "Current",
                    diffStats: null,
                    activityStats: null,
                };
                const existingIndex = versions.findIndex(
                    (version) => version.index === index,
                );
                versions = versions.map((version) =>
                    version.message === "Current"
                        ? { ...version, message: "" }
                        : version,
                );
                if (existingIndex >= 0) {
                    versions[existingIndex] = {
                        ...versions[existingIndex],
                        ...nextVersion,
                    };
                } else {
                    versions.push(nextVersion);
                }
                if (wasAtLatest) {
                    selectedIndex = versions.length - 1;
                } else {
                    const selectedAgain = versions.findIndex(
                        (version) => version.index === previousSelectedVersion,
                    );
                    selectedIndex = selectedAgain >= 0 ? selectedAgain : selectedIndex;
                }
                renderVersions();
                if (selectedIsCurrentVersion()) showCurrentVersionNoDiff();
                return true;
            }

            function showCurrentVersionNoDiff() {
                clearTimeout(diffTimer);
                pendingDiffAfterStats = false;
                diffPlaceholderText = "Diffing...";
                currentDiff = currentVersionNoDiff();
                renderDiff();
                clearParentHighlights(true);
                clearParentEditorPreview();
                setHistoryActivity(
                    historyStatsLoading,
                    historyStatsLoading ? "Loading history" : "Ready",
                );
                if (railFocusEnabled) {
                    ensureSelectedRailVisible();
                }
            }

            function displayedVersions() {
                let items = versions;
                if (historySearchQuery.trim() && historySearchMatches != null) {
                    items = items.filter((version) =>
                        historySearchMatches.has(version.index),
                    );
                }
                if (lineBlameActive && lineBlameMatches != null) {
                    items = items.filter((version) =>
                        lineBlameMatches.has(version.index),
                    );
                }
                if (selectedOnly) {
                    const selectedCanvasUids = new Set(readParentSelectedUids());
                    const hasIncrementalStats = items.some(
                        (version) => version.diffStats,
                    );
                    if (selectedCanvasUids.size && hasIncrementalStats) {
                        items = items.filter((version) =>
                            versionChangedSelectedIncrementally(
                                version,
                                selectedCanvasUids,
                            ),
                        );
                    }
                }
                return items;
            }

            function handleMessage(message) {
                if (
                    !sessionEstablished &&
                    message.name !== "history-versions-list"
                ) {
                    sessionEstablished = true;
                    requestHistory();
                }

                if (message.name === "history-versions-list") {
                    const previousSelectedVersion =
                        versions[selectedIndex]?.index;
                    const wasAtLatest =
                        !versions.length ||
                        selectedIndex >= versions.length - 1;
                    const preserveSelection = preserveNextHistorySelection;
	                    preserveNextHistorySelection = false;
	                    exactLineDeltaCache.clear();
	                    railLineStatsRequestSignature = "";
	                    versions = message.payload?.versions || [];
                    transitions = message.payload?.transitions || [];
                    if (preserveSelection && versions.length) {
                        if (wasAtLatest) {
                            selectedIndex = Math.max(0, versions.length - 1);
                        } else {
                            const found = versions.findIndex(
                                (version) =>
                                    version.index === previousSelectedVersion,
                            );
                            selectedIndex =
                                found >= 0
                                    ? found
                                    : Math.max(
                                          0,
                                          Math.min(
                                              selectedIndex,
                                              versions.length - 1,
                                          ),
                                      );
                        }
                    } else {
                        selectedIndex = Math.max(0, versions.length - 1);
                    }
                    selectedBoxes.clear();
                    selectedProps.clear();
                    historyStatsLoading = versions.length > 1;
                    pendingDiffAfterStats = false;
                    diffPlaceholderText = "Loading history...";
                    setHistoryProgress(
                        0,
                        Math.max(0, versions.length - 1),
                        historyStatsLoading,
                    );
                    renderVersions();
                    requestAnimationFrame(() => centerSelectedRailVersion());
                    if (historySearchQuery.trim()) requestHistorySearchNow();
                    if (selectedIsCurrentVersion()) {
                        showCurrentVersionNoDiff();
                    } else {
                        requestDiffNow();
                    }
                    return;
                }

                if (message.name === "history-version-stats-progress") {
                    const payload = message.payload || {};
                    mergeVersionStats(payload);
                    setHistoryProgress(
                        Number(payload.completed) || 0,
                        Number(payload.total) || 0,
                        !payload.done,
                    );
                    scheduleStatsRailRender();
                    if (payload.done) {
                        historyStatsLoading = false;
                        historyRequestInFlight = false;
                        setTimeout(() => setHistoryProgress(1, 1, false), 260);
                        if (pendingDiffAfterStats) {
                            pendingDiffAfterStats = false;
                            requestDiffNow();
                        } else if (selectedIsCurrentVersion()) {
                            showCurrentVersionNoDiff();
                        } else {
                            setHistoryActivity(false, "Ready");
                        }
                        if (historyRefreshPending) {
                            historyRefreshPending = false;
                            scheduleHistoryRefresh();
                        }
                    }
                    return;
                }

	                if (message.name === "history-changed") {
	                    exactLineDeltaCache.clear();
	                    railLineStatsRequestSignature = "";
                    lineBlameMatches = null;
                    lineBlameRequestSignature = "";
	                    captureElectronHistoryScreenshot(
                        Number(message.payload?.versionIndex ?? -1),
                    );
                    if (!applyHistoryChanged(message.payload)) {
                        scheduleHistoryRefresh();
                    }
                    return;
                }

                if (
                    message.name === "store-history-screenshot-success" ||
                    message.name === "history-screenshot-added"
                ) {
                    mergeScreenshotRef(message.payload);
                    return;
                }

                if (message.name === "history-version-diff") {
                    const diff = message.payload || {};
                    const expectedFilter = selectedParentUids().slice().sort();
                    const actualFilter = Array.isArray(diff.boxFilter)
                        ? diff.boxFilter.slice().sort()
                        : [];
                    if (
                        diff.versionIndex !== selectedVersionNumber() ||
                        (diff.basis || "current") !== diffBasis ||
                        expectedFilter.join("\u0000") !==
                            actualFilter.join("\u0000")
                    ) {
                        return;
	                    }
	                    currentDiff = diff;
	                    cacheExactLineDelta(diff);
	                    setHistoryActivity(false, "Ready");
	                    renderDiff();
	                    renderRail({ preserveSelected: true });
	                    highlightParentDiff();
	                    showRelevantEditorPreview();
	                    return;
	                }

	                if (message.name === "history-rail-line-stats-progress") {
	                    const payload = message.payload || {};
	                    if (!railLineStatsPayloadMatches(payload)) return;
	                    cacheExactRailLineStats(payload);
	                    scheduleStatsRailRender();
	                    return;
	                }

	                if (message.name === "history-search-results") {
                    if (
                        (message.payload?.query || "") !==
                            historySearchQuery.trim() ||
                        (message.payload?.basis || "previous") !== diffBasis
                    )
                        return;
                    applyHistorySearchMatches(
                        new Set(message.payload?.versionIndexes || []),
                    );
                    return;
                }

                if (message.name === "history-line-blame-results") {
                    const payload = message.payload || {};
                    if (
                        !lineBlameActive ||
                        !lineBlameContext ||
                        payload.uid !== lineBlameContext.uid ||
                        payload.property !== lineBlameContext.property ||
                        Number(payload.lineNumber) !==
                            Number(lineBlameContext.lineNumber) ||
                        (payload.lineText || "") !==
                            (lineBlameContext.lineText || "")
                    ) {
                        return;
                    }
                    applyLineBlameMatches(
                        new Set(payload.versionIndexes || []),
                    );
                    return;
                }

                if (message.name === "history-version-diff-error") {
                    setHistoryActivity(false, "Error");
                    notify(message.payload?.error || "Diff failed", "history");
                    return;
                }

                if (message.name === "name-history-version-success") {
                    namingInFlight = false;
                    nameInput.disabled = false;
                    requestHistory();
                    return;
                }

                if (message.name === "name-history-version-error") {
                    namingInFlight = false;
                    nameInput.disabled = false;
                    notify(
                        message.payload?.error || "Naming failed",
                        "history",
                    );
                    return;
                }

                if (message.name === "cherry-pick-history-success") {
                    cherryInFlight = false;
                    notify(
                        "Cherry-pick saved as a new current version",
                        "history",
                    );
                    selectedBoxes.clear();
                    selectedProps.clear();
                    requestHistory();
                    return;
                }

                if (message.name === "cherry-pick-history-error") {
                    cherryInFlight = false;
                    notify(
                        message.payload?.error || "Cherry-pick failed",
                        "history",
                    );
                    updateSelectionMetrics();
                }

                if (message.name === "restore-version-success") {
                    notify("Version restored", "history");
                    requestHistory();
                    return;
                }

                if (message.name === "restore-version-error") {
                    notify(
                        message.payload?.error || "Restore failed",
                        "history",
                    );
                    setHistoryActivity(false, "Error");
                }
            }

            function requestHistory(options = {}) {
                if (historyRequestInFlight) {
                    historyRefreshPending = true;
                    preserveNextHistorySelection =
                        preserveNextHistorySelection || !!options.preserveSelection;
                    return;
                }
                historyRequestInFlight = true;
                preserveNextHistorySelection = !!options.preserveSelection;
                send({ name: "list-history-versions", payload: {} });
            }

            function scheduleHistoryRefresh() {
                clearTimeout(historyRefreshTimer);
                if (historyRequestInFlight) {
                    historyRefreshPending = true;
                    return;
                }
                setHistoryActivity(true, "Refreshing after save");
                historyRefreshTimer = setTimeout(() => {
                    requestHistory({ preserveSelection: true });
                }, 160);
            }

            function selectedParentUids() {
                if (!selectedOnly) return [];
                return readParentSelectedUids();
            }

            function readParentSelectedUids() {
                try {
                    const list = Array.from(window.parent?.selectedList || []);
                    return list.map((box) => box?.uid).filter(Boolean);
                } catch (_) {
                    return [];
                }
            }

            function parentSelectionSignature() {
                let property = "code";
                try {
                    property =
                        window.parent?.currentSelectedProperty ||
                        window.parent?.selectedProperty ||
                        "code";
                } catch (_) {}
                const blame = lineBlameActive
                    ? `::${lineBlameContextSignature(currentEditorLineContext())}`
                    : "";
                return `${readParentSelectedUids().join("|")}::${property}${blame}`;
            }

            function syncParentSelectionChanged() {
                const signature = parentSelectionSignature();
	                if (signature === lastParentSelectionSignature) return;
	                lastParentSelectionSignature = signature;
	                exactLineDeltaCache.clear();
	                railLineStatsRequestSignature = "";
                if (lineBlameActive) {
                    lineBlameMatches = null;
                    lineBlameRequestSignature = "";
                    requestLineBlameSoon();
                }
	                renderRail();
                if (selectedOnly) {
                    selectedBoxes.clear();
                    selectedProps.clear();
                    renderVersions();
                    requestDiffNow();
                } else {
                    showRelevantEditorPreview();
                }
            }

            function requestDiffSoon() {
                clearTimeout(diffTimer);
                setHistoryActivity(true, "Scrubbing");
                diffTimer = setTimeout(requestDiffNow, 110);
            }

            function requestDiffNow() {
                if (!versions.length) return;
                if (selectedIsCurrentVersion()) {
                    showCurrentVersionNoDiff();
                    return;
                }
                if (historyStatsLoading) {
                    pendingDiffAfterStats = true;
                    diffPlaceholderText = "Loading history...";
                    currentDiff = null;
                    renderDiff();
                    clearParentEditorPreview();
                    setHistoryActivity(true, "Loading history");
                    if (railFocusEnabled) {
                        ensureSelectedRailVisible();
                    }
                    return;
                }
                setHistoryActivity(true, "Diffing");
                diffPlaceholderText = "Diffing...";
                currentDiff = null;
                renderDiff();
                clearParentEditorPreview();
                send({
                    name: "diff-history-version",
                    payload: {
                        versionIndex: selectedVersionNumber(),
                        boxIds: selectedParentUids(),
                        basis: diffBasis,
                    },
                });
                if (railFocusEnabled) {
                    ensureSelectedRailVisible();
                }
            }

            function requestHistorySearchNow() {
                const query = historySearchQuery.trim();
                if (!query) {
                    historySearchMatches = null;
                    renderRail({ preserveSelected: true, animate: true });
                    return;
                }
                send({
                    name: "search-history-versions",
                    payload: { query, basis: diffBasis },
                });
            }

            function currentEditorLineContext() {
                try {
                    const parentWindow = window.parent;
                    const selected = Array.from(
                        parentWindow?.selectedList || [],
                    );
                    if (selected.length !== 1) return null;
                    const editor = parentWindow?.globalEditor;
                    if (!editor || !editor.getPosition || !editor.getModel)
                        return null;
                    const property =
                        parentWindow?.currentSelectedProperty ||
                        parentWindow?.selectedProperty ||
                        "code";
                    const position = editor.getPosition();
                    const lineNumber = Math.max(
                        1,
                        Number(position?.lineNumber) || 1,
                    );
                    const model = editor.getModel();
                    const lineText =
                        model?.getLineContent?.(lineNumber) || "";
                    const propertyText = model?.getValue?.() || "";
                    return {
                        uid: selected[0]?.uid || "",
                        property,
                        lineNumber,
                        lineText,
                        propertyText,
                    };
                } catch (_) {
                    return null;
                }
            }

            function lineBlameContextSignature(context) {
                if (!context) return "";
                return [
                    context.uid,
                    context.property,
                    context.lineNumber,
                    context.lineText,
                ].join("\u0000");
            }

            function setLineBlameActive(active) {
                lineBlameActive = !!active;
                lineBlameButton.setAttribute(
                    "aria-pressed",
                    lineBlameActive ? "true" : "false",
                );
                if (!lineBlameActive) {
                    lineBlameContext = null;
                    lineBlameMatches = null;
                    lineBlameRequestSignature = "";
                    lineBlameButton.title =
                        "Filter to versions that affected the current editor line";
                    renderRail({ preserveSelected: true, animate: true });
                    return;
                }
                requestLineBlameNow();
            }

            function requestLineBlameNow() {
                if (!lineBlameActive) return;
                const context = currentEditorLineContext();
                if (!context || !context.uid || !context.property) {
                    lineBlameContext = null;
                    lineBlameMatches = new Set();
                    lineBlameRequestSignature = "";
                    lineBlameButton.title =
                        "Select one box and place the editor cursor on a line";
                    renderRail({ preserveSelected: true, animate: true });
                    return;
                }
                const previousSignature =
                    lineBlameContextSignature(lineBlameContext);
                const nextSignature = lineBlameContextSignature(context);
                lineBlameContext = context;
                lineBlameButton.title = `${context.property}:${context.lineNumber}`;
                if (previousSignature === nextSignature && lineBlameMatches)
                    return;
                if (lineBlameRequestSignature === nextSignature) return;
                lineBlameRequestSignature = nextSignature;
                lineBlameMatches = null;
                send({
                    name: "blame-history-line",
                    payload: {
                        uid: context.uid,

                    (shot) =>

            function versionLabel(version) {

            function formatDuration(ms) {
                const abs = Math.max(0, Math.floor(ms));
                if (abs < 1000) return "just now";
                const minutes = Math.floor(abs / 60000);
                if (minutes < 1) return `${Math.floor(abs / 1000)}s ago`;
                if (minutes < 60) return `${minutes}m ago`;
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return `${hours}h ago`;
                const days = Math.floor(hours / 24);
                if (days < 7) return `${days}d ago`;
                const weeks = Math.floor(days / 7);
                if (weeks < 6) return `${weeks}wk ago`;
                const months = Math.floor(days / 30);
                if (months < 24) return `${months}mo ago`;
                const years = Math.floor(days / 365);
                return `${years}y ago`;
            }

            function formatSpanDuration(ms) {
                const abs = Math.max(0, Math.floor(ms));
                const minutes = Math.floor(abs / 60000);
                if (minutes < 1)
                    return `${Math.max(1, Math.floor(abs / 1000))}s`;
                if (minutes < 60) return `${minutes}m`;
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return `${hours}h`;
                const days = Math.floor(hours / 24);
                if (days < 7) return `${days}d`;
                const weeks = Math.floor(days / 7);
                if (weeks < 6) return `${weeks}wk`;
                const months = Math.floor(days / 30);
                if (months < 24) return `${months}mo`;
                return `${Math.floor(days / 365)}y`;
            }

            function formatBytes(bytes) {
                const value = Number(bytes) || 0;
                if (value < 1024) return `${value} B`;
                const units = ["KB", "MB", "GB", "TB"];
                let n = value / 1024;
                let index = 0;
                while (n >= 1024 && index < units.length - 1) {
                    n /= 1024;
                    index += 1;
                }
                const rounded =
                    n >= 100
                        ? n.toFixed(0)
                        : n >= 10
                          ? n.toFixed(1)
                          : n.toFixed(2);
                return `${rounded} ${units[index]}`;
            }

            function versionMeta(version, includeLabel = false) {
                if (!version) return "No versions";
                const boxes =
                    version.boxCount === 1
                        ? "1 box"
                        : `${version.boxCount || 0} boxes`;
                const size = formatBytes(version.byteSize);
                const when = formatDuration(
                    Date.now() - (Number(version.timestamp) || 0),
                );
                const meta = `${boxes} · ${size} · ${when}`;
                return includeLabel
                    ? `${versionLabel(version)} · ${meta}`
                    : meta;
            }

	            function statsToChartDelta(stats) {

	            function lineDeltaCacheKey(

	            function cacheExactLineDelta(diff) {

	                exactLineDeltaCache.set(

	            function cacheExactRailLineStats(payload) {

	                    ? payload.boxFilter.slice().sort()

	            function selectedRailLineStatsSignature() {
	                if (!selectedOnly) return "";

	                if (!boxIds.length) return "";
	                const versionIndexes = displayedVersions().map(
	                    (version) => version.index,
	                );

	                return `${diffBasis}\u0000${boxIds.join("|")}\u0000${versionIndexes.join("|")}`;
	            }

	            function requestSelectedRailLineStatsNow() {
	                const signature = selectedRailLineStatsSignature();
	                if (!signature) {
	                    railLineStatsRequestSignature = "";
	                    return;
	                }
	                if (signature === railLineStatsRequestSignature) return;
	                railLineStatsRequestSignature = signature;
	                const parts = signature.split("\u0000");
	                const basis = parts[0] || diffBasis;
	                const boxIds = (parts[1] || "").split("|").filter(Boolean);
	                const versionIndexes = (parts[2] || "")
	                    .split("|")
	                    .filter(Boolean)
	                    .map((item) => Number(item))
	                    .filter((item) => Number.isFinite(item));

	            function railLineStatsPayloadMatches(payload) {
	                if (!selectedOnly || !payload) return false;
	                if ((payload.basis || "current") !== diffBasis) return false;
	                const expected = selectedParentUids().slice().sort();
	                const actual = Array.isArray(payload.boxFilter)
	                    ? payload.boxFilter.slice().sort()
	                    : [];
	                return (
	                    expected.length > 0 &&
	                    expected.join("\u0000") === actual.join("\u0000")

	            function sumSelectedBoxLineStats(stats, selectedCanvasUids) {
	                if (!selectedCanvasUids?.size) return null;
	                if (!Array.isArray(stats?.boxLineStats)) return null;
	                const total = { added: 0, removed: 0, moved: 0, changed: 0 };
	                stats.boxLineStats.forEach((boxStats) => {
	                    const uid = boxStats?.uid;
	                    if (!uid || !selectedCanvasUids.has(uid)) return;
	                    total.added += Number(boxStats.added || 0);
	                    total.removed += Number(boxStats.removed || 0);
	                    total.moved += Number(boxStats.moved || 0);
	                    total.changed += Number(boxStats.changed || 0);
	                });
	                return statsToChartDelta(total);
	            }

	            function incrementalLineDelta(version, selectedCanvasUids = null) {
	                const exact = exactLineDeltaCache.get(
	                    lineDeltaCacheKey(
	                        version?.index,
	                        "previous",
	                        selectedCanvasUids,
	                    ),
	                );
	                if (exact) return exact;
	                const stats = version?.diffStats || {};
	                const selectedDelta = sumSelectedBoxLineStats(
	                    stats,
	                    selectedCanvasUids,
	                );
	                if (selectedDelta) return selectedDelta;
	                const changed = Number(
	                    stats.changedLines || stats.totalLinesChanged || 0,
	                );
                return {
                    added: Number(stats.totalLinesAdded || 0) + changed,
                    removed: Number(stats.totalLinesRemoved || 0) + changed,
                };
            }

	            function currentLineDeltaMap(selectedCanvasUids = null) {
	                const deltas = new Map();
	                let added = 0;
	                let removed = 0;
                for (let i = versions.length - 1; i >= 0; i--) {
	                    const version = versions[i];
	                    const exact = exactLineDeltaCache.get(
	                        lineDeltaCacheKey(
	                            version.index,
	                            "current",
	                            selectedCanvasUids,
	                        ),
	                    );
	                    deltas.set(version.index, exact || { added, removed });
	                    if (i > 0) {
	                        const step = incrementalLineDelta(
	                            version,
	                            selectedCanvasUids,
	                        );
	                        added += step.added || 0;
	                        removed += step.removed || 0;
	                    }
                }
                return deltas;
            }

	            function versionLineDelta(
	                version,
	                currentDeltas = null,
	                selectedCanvasUids = null,
	            ) {

	                    return (

                            removed: 0,

	            function versionActivityDelta(version, selectedCanvasUids = null) {
	                const stats = version?.activityStats || {};
	                if (selectedCanvasUids?.size) {
	                    const selected = (stats.perBox || []).filter((box) =>
	                        selectedCanvasUids.has(box.uid),

	                    return {

            function versionEditMoveDelta(version) {
                const stats = version?.diffStats || {};
                const activity = version?.activityStats || {};

            function activityTitle(version, selectedCanvasUids = null) {
                const stats = version?.activityStats;
                if (!stats) return "";
                const parts = [];
                const executionDelta = Number(stats.executionDelta || 0);
                const launchDelta = Number(stats.launchDelta || 0);
                if (executionDelta || launchDelta) {
                    parts.push(`activity +${executionDelta} exec +${launchDelta} launch`);
                }
                const executions = Number(stats.executions || 0);
                const launches = Number(stats.launches || 0);
                if (executions || launches) {
                    parts.push(`session total ${executions} exec ${launches} launch`);
                }
                const editMove = versionEditMoveDelta(version);
                if (editMove.edited || editMove.moved) {
                    parts.push(`${editMove.edited} edit ${editMove.moved} move`);
                }
                if (selectedCanvasUids?.size) {
                    const selected = (stats.perBox || []).filter((box) =>
                        selectedCanvasUids.has(box.uid),
                    );
                    const selectedExec = selected.reduce(
                        (sum, box) => sum + Number(box.executionDelta || 0),
                        0,
                    );
                    const selectedLaunch = selected.reduce(
                        (sum, box) => sum + Number(box.launchDelta || 0),
                        0,
                    );
                    if (selectedExec || selectedLaunch) {
                        parts.push(`selected +${selectedExec} exec +${selectedLaunch} launch`);
                    }
                }
                const screenshots = stats.screenshots || [];
                if (screenshots.length) {
                    const channels = Array.from(
                        new Set(screenshots.map((shot) => shot.channel)),
                    ).join(", ");
                    parts.push(`screenshots ${channels}`);
                }
                return parts.join(" · ");

            function selectedActivityTouches(version, selectedCanvasUids) {
                if (!selectedCanvasUids.size) return false;
                return (version.activityStats?.perBox || []).some(

            function versionChangedSelectedIncrementally(

            function railWidthFor(count) {
                const base = Math.max(620, count * 13);
                const focused = railFocusEnabled
                    ? Math.max(base, count * 18)
                    : base;
                return Math.round(focused * railZoom);
            }

            function measuredRailWidth() {
                return Math.max(
                    1,

            function clamp(value, min, max) {

            function railAnchorClientX(clientX = null) {

                const fallback =

                const x =
                    Number.isFinite(clientX) && clientX > 0
