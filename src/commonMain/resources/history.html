<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Document History</title>
    <style>
        @import url("/iosevka.css");

        :root {
            --bg: #050505;
            --panel: #0b0b0b;
            --panel-2: #121212;
            --fg: #e8e8e8;
            --muted: #8d8d8d;
            --dim: #5e5e5e;
            --line: #242424;
            --line-2: #383838;
            --accent: #f4f4f4;
            --good: #8ee38e;
            --bad: #ff8585;
            --warn: #e7b36a;
            --info: #8bbdff;
        }

        * {
            box-sizing: border-box;
            font-family: "Iosevka Web", "Iosevka", monospace;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            font-size: 12px;
        }

        button,
        input {
            font: inherit;
        }

        button {
            color: var(--fg);
            background: #111;
            border: 1px solid var(--line-2);
            border-radius: 4px;
            padding: 5px 9px;
            cursor: pointer;
        }

        button:hover {
            border-color: var(--fg);
            background: #181818;
        }

        button:disabled {
            color: var(--dim);
            border-color: var(--line);
            cursor: default;
        }

        input[type="text"] {
            background: #070707;
            border: 1px solid var(--line-2);
            border-radius: 4px;
            color: var(--fg);
            padding: 5px 7px;
            min-width: 0;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--fg);
        }

        .app {
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            height: 100vh;
            min-width: 720px;
            border-top: 1px solid var(--line-2);
        }

        header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        h1 {
            margin: 0;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .spacer {
            flex: 1;
        }

        .status {
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 4px 7px;
            white-space: nowrap;
        }

        .status.connected {
            color: var(--good);
            border-color: #315831;
        }

        .timeline {
            padding: 8px 10px 10px;
            border-bottom: 1px solid var(--line);
            background: #070707;
        }

        .timeline-top {
            display: grid;
            grid-template-columns: minmax(160px, 1fr) minmax(240px, 420px) auto;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .target-title {
            display: flex;
            gap: 8px;
            align-items: baseline;
            min-width: 0;
        }

        .target-title strong {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .target-title span {
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .name-edit {
            display: flex;
            gap: 6px;
            min-width: 0;
        }

        .name-edit input {
            flex: 1;
        }

        .rail-shell {
            position: relative;
            height: 34px;
            overflow-x: auto;
            overflow-y: hidden;
            border: 1px solid var(--line);
            background: #030303;
        }

        .rail {
            position: relative;
            height: 32px;
            min-width: 100%;
        }

        .rail-line {
            position: absolute;
            left: 10px;
            right: 10px;
            top: 16px;
            height: 1px;
            background: var(--line-2);
        }

        .dot {
            position: absolute;
            top: 16px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #7a7a7a;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }

        .dot.named {
            width: 11px;
            height: 11px;
            background: var(--fg);
        }

        .dot.current {
            width: 13px;
            height: 13px;
            border: 1px solid var(--fg);
            background: #000;
        }

        .dot.active {
            outline: 2px solid var(--fg);
            outline-offset: 3px;
        }

        .dot-label {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            color: var(--muted);
            font-size: 10px;
            white-space: nowrap;
            pointer-events: none;
        }

        .content {
            min-height: 0;
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            background: var(--bg);
        }

        aside {
            border-right: 1px solid var(--line);
            background: var(--panel);
            min-height: 0;
            overflow: auto;
            padding: 10px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .metric {
            border: 1px solid var(--line);
            background: #080808;
            padding: 8px;
            min-height: 48px;
        }

        .metric label {
            display: block;
            color: var(--muted);
            font-size: 10px;
            margin-bottom: 4px;
        }

        .metric strong {
            font-size: 17px;
            font-weight: 500;
        }

        .section-title {
            margin: 12px 0 6px;
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
        }

        .named-list,
        .transition-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .named-item,
        .transition-item {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr);
            gap: 6px;
            align-items: center;
            border: 1px solid var(--line);
            background: #080808;
            padding: 5px 6px;
            cursor: pointer;
        }

        .named-item:hover,
        .transition-item:hover {
            border-color: var(--line-2);
        }

        .named-item span,
        .transition-item span {
            color: var(--muted);
        }

        .named-item strong,
        .transition-item strong {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 400;
        }

        .changes {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
        }

        .change-toolbar {
            display: flex;
            gap: 7px;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            background: #090909;
        }

        .change-toolbar .small {
            color: var(--muted);
        }

        .change-list {
            min-height: 0;
            overflow: auto;
            padding: 10px;
        }

        .empty {
            color: var(--muted);
            padding: 18px;
            border: 1px solid var(--line);
            background: #080808;
        }

        .box-card {
            border: 1px solid var(--line-2);
            background: var(--panel-2);
            margin-bottom: 8px;
        }

        .box-card.target-only {
            border-color: #315831;
        }

        .box-card.present-only {
            border-color: #633232;
        }

        .box-head {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--line);
        }

        .box-title {
            min-width: 0;
        }

        .box-title strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }

        .box-title span {
            display: block;
            color: var(--muted);
            font-size: 10px;
        }

        .pill {
            border: 1px solid var(--line-2);
            border-radius: 4px;
            color: var(--muted);
            padding: 3px 5px;
            font-size: 10px;
            white-space: nowrap;
        }

        .pill.target-only {
            color: var(--good);
            border-color: #315831;
        }

        .pill.present-only {
            color: var(--bad);
            border-color: #633232;
        }

        .props {
            display: flex;
            flex-direction: column;
        }

        .prop-row {
            display: grid;
            grid-template-columns: auto 108px 76px 120px minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
            padding: 6px 8px;
            border-top: 1px solid #1a1a1a;
        }

        .prop-row:first-child {
            border-top: 0;
        }

        .prop-name {
            color: var(--fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .prop-kind,
        .prop-status,
        .line-stats {
            color: var(--muted);
            font-size: 10px;
            white-space: nowrap;
        }

        .preview {
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .plus {
            color: var(--good);
        }

        .minus {
            color: var(--bad);
        }

        .move {
            color: var(--info);
        }

        .changed {
            color: var(--warn);
        }

        .busy {
            opacity: 0.55;
        }
    </style>
    <script src="/notify.js"></script>
</head>
<body>
<div class="app">
    <header>
        <h1>Document History</h1>
        <div class="status" id="status">Disconnected</div>
        <button id="refresh-btn">Refresh</button>
        <button id="selected-filter-btn">Whole Document</button>
        <div class="spacer"></div>
        <button id="full-restore-btn">Full Restore</button>
        <button id="close-btn">Close</button>
    </header>

    <section class="timeline">
        <div class="timeline-top">
            <div class="target-title">
                <strong id="target-version">#0</strong>
                <span id="target-meta">Loading...</span>
            </div>
            <div class="name-edit">
                <input id="name-input" type="text" placeholder="name this version">
                <button id="name-save-btn">Name</button>
            </div>
            <span class="status" id="diff-status">Idle</span>
        </div>
        <input id="scrubber" type="range" min="0" max="0" value="0">
        <div class="rail-shell">
            <div class="rail" id="rail">
                <div class="rail-line"></div>
            </div>
        </div>
    </section>

    <section class="content">
        <aside>
            <div class="summary-grid">
                <div class="metric"><label>Boxes</label><strong id="metric-boxes">0</strong></div>
                <div class="metric"><label>Properties</label><strong id="metric-props">0</strong></div>
                <div class="metric"><label>Lines</label><strong id="metric-lines">0</strong></div>
                <div class="metric"><label>Selected</label><strong id="metric-selected">0</strong></div>
            </div>
            <div class="section-title">Named Versions</div>
            <div class="named-list" id="named-list"></div>
            <div class="section-title">Version Jumps</div>
            <div class="transition-list" id="transition-list"></div>
        </aside>

        <section class="changes">
            <div class="change-toolbar">
                <button id="select-all-btn">Select Boxes</button>
                <button id="clear-selection-btn">Clear</button>
                <button id="cherry-pick-btn" disabled>Cherry Pick</button>
                <span class="small" id="change-caption">No diff loaded</span>
            </div>
            <div class="change-list" id="change-list">
                <div class="empty">Loading document history...</div>
            </div>
        </section>
    </section>
</div>

<script>
    const WS_URL = `${location.protocol === "https:" ? "wss" : "ws"}://${document.location.host}/ws`;
    const statusEl = document.getElementById("status");
    const diffStatusEl = document.getElementById("diff-status");
    const scrubberEl = document.getElementById("scrubber");
    const railEl = document.getElementById("rail");
    const nameInput = document.getElementById("name-input");
    const changeListEl = document.getElementById("change-list");

    const urlParams = new URLSearchParams(window.location.search);
    const filename = urlParams.get("file") || "default";
    const username = urlParams.get("user") || "viewer";

    let ws = null;
    let versions = [];
    let transitions = [];
    let selectedIndex = 0;
    let currentDiff = null;
    let selectedOnly = false;
    let sessionEstablished = false;
    let diffTimer = null;
    let namingInFlight = false;
    let cherryInFlight = false;
    const selectedBoxes = new Set();
    const selectedProps = new Map();

    function connect() {
        ws = new WebSocket(WS_URL);
        ws.onopen = () => {
            statusEl.textContent = "Connecting...";
            send({ name: "hello", payload: { filename, username } });
        };
        ws.onmessage = (event) => {
            try {
                handleMessage(JSON.parse(event.data));
            } catch (error) {
                console.error("history message parse failed", error);
            }
        };
        ws.onclose = () => {
            statusEl.textContent = "Disconnected";
            statusEl.classList.remove("connected");
            sessionEstablished = false;
            clearParentHighlights();
            setTimeout(connect, 1500);
        };
    }

    function send(message) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(message));
        }
    }

    function handleMessage(message) {
        if (!sessionEstablished && message.name !== "history-versions-list") {
            sessionEstablished = true;
            statusEl.textContent = "Connected";
            statusEl.classList.add("connected");
            requestHistory();
        }

        if (message.name === "history-versions-list") {
            versions = message.payload?.versions || [];
            transitions = message.payload?.transitions || [];
            selectedIndex = Math.max(0, versions.length - 1);
            selectedBoxes.clear();
            selectedProps.clear();
            renderVersions();
            requestDiffNow();
            return;
        }

        if (message.name === "history-version-diff") {
            currentDiff = message.payload;
            diffStatusEl.textContent = "Ready";
            renderDiff();
            highlightParentDiff();
            return;
        }

        if (message.name === "history-version-diff-error") {
            diffStatusEl.textContent = "Error";
            notify(message.payload?.error || "Diff failed", "history");
            return;
        }

        if (message.name === "name-history-version-success") {
            namingInFlight = false;
            nameInput.disabled = false;
            requestHistory();
            return;
        }

        if (message.name === "name-history-version-error") {
            namingInFlight = false;
            nameInput.disabled = false;
            notify(message.payload?.error || "Naming failed", "history");
            return;
        }

        if (message.name === "cherry-pick-history-success") {
            cherryInFlight = false;
            notify("Cherry-pick saved as a new current version", "history");
            selectedBoxes.clear();
            selectedProps.clear();
            requestHistory();
            return;
        }

        if (message.name === "cherry-pick-history-error") {
            cherryInFlight = false;
            notify(message.payload?.error || "Cherry-pick failed", "history");
            updateSelectionMetrics();
        }

        if (message.name === "restore-version-success") {
            notify("Version restored", "history");
            requestHistory();
        }
    }

    function requestHistory() {
        send({ name: "list-history-versions", payload: {} });
    }

    function selectedParentUids() {
        if (!selectedOnly) return [];
        try {
            const list = Array.from(window.parent?.selectedList || []);
            return list.map((box) => box?.uid).filter(Boolean);
        } catch (_) {
            return [];
        }
    }

    function requestDiffSoon() {
        clearTimeout(diffTimer);
        diffStatusEl.textContent = "Scrubbing...";
        diffTimer = setTimeout(requestDiffNow, 110);
    }

    function requestDiffNow() {
        if (!versions.length) return;
        diffStatusEl.textContent = "Diffing...";
        currentDiff = null;
        renderDiff();
        send({
            name: "diff-history-version",
            payload: {
                versionIndex: selectedIndex,
                boxIds: selectedParentUids()
            }
        });
    }

    function versionLabel(version) {
        const name = (version.message || "").trim();
        if (name && name !== "Current") return name;
        if (version.index === versions.length - 1) return "Current";
        return `Version #${version.index}`;
    }

    function formatTime(timestamp) {
        return new Date(timestamp).toLocaleString();
    }

    function formatRelative(timestamp) {
        const seconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);
        if (days) return `${days}d ago`;
        if (hours) return `${hours}h ago`;
        if (minutes) return `${minutes}m ago`;
        return `${seconds}s ago`;
    }

    function renderVersions() {
        scrubberEl.max = Math.max(0, versions.length - 1);
        scrubberEl.value = selectedIndex;
        updateTargetMeta();
        renderRail();
        renderNamedVersions();
        renderTransitions();
    }

    function updateTargetMeta() {
        const version = versions[selectedIndex];
        document.getElementById("target-version").textContent = version ? `#${version.index}` : "#0";
        document.getElementById("target-meta").textContent = version
            ? `${versionLabel(version)} | ${version.boxCount} boxes | ${formatTime(version.timestamp)}`
            : "No versions";
        nameInput.value = version?.message && version.message !== "Current" ? version.message : "";
        document.getElementById("full-restore-btn").disabled = !version || selectedIndex === versions.length - 1;
    }

    function renderRail() {
        railEl.querySelectorAll(".dot,.dot-label").forEach((node) => node.remove());
        const count = Math.max(1, versions.length);
        const width = Math.max(680, count * 13);
        railEl.style.width = `${width}px`;

        versions.forEach((version, i) => {
            const left = count === 1 ? 16 : 10 + (i / (count - 1)) * (width - 20);
            const dot = document.createElement("button");
            dot.className = "dot";
            dot.type = "button";
            dot.style.left = `${left}px`;
            dot.title = `${versionLabel(version)} | ${formatTime(version.timestamp)}`;
            if (version.message && version.message !== "Current") dot.classList.add("named");
            if (i === versions.length - 1) dot.classList.add("current");
            if (i === selectedIndex) dot.classList.add("active");
            dot.addEventListener("click", () => selectVersion(i));
            railEl.appendChild(dot);

            if ((version.message && version.message !== "Current") || i === versions.length - 1) {
                const label = document.createElement("div");
                label.className = "dot-label";
                label.style.left = `${left}px`;
                label.textContent = version.message && version.message !== "Current" ? version.message : "current";
                railEl.appendChild(label);
            }
        });
    }

    function renderNamedVersions() {
        const list = document.getElementById("named-list");
        list.innerHTML = "";
        const named = versions.filter((v) => v.message && v.message !== "Current");
        if (!named.length) {
            list.innerHTML = `<div class="empty">No named versions yet.</div>`;
            return;
        }
        named.forEach((version) => {
            const row = document.createElement("div");
            row.className = "named-item";
            row.innerHTML = `<span>#${version.index}</span><strong></strong>`;
            row.querySelector("strong").textContent = version.message;
            row.addEventListener("click", () => selectVersion(version.index));
            list.appendChild(row);
        });
    }

    function renderTransitions() {
        const list = document.getElementById("transition-list");
        list.innerHTML = "";
        if (!transitions.length) {
            list.innerHTML = `<div class="empty">No restore jumps recorded.</div>`;
            return;
        }
        transitions.slice(-12).reverse().forEach((transition) => {
            const row = document.createElement("div");
            row.className = "transition-item";
            row.innerHTML = `<span>#${transition.fromIndex}</span><strong>#${transition.toIndex} | ${formatRelative(transition.timestamp)}</strong>`;
            row.addEventListener("click", () => selectVersion(transition.toIndex));
            list.appendChild(row);
        });
    }

    function selectVersion(index) {
        selectedIndex = Math.max(0, Math.min(index, versions.length - 1));
        selectedBoxes.clear();
        selectedProps.clear();
        renderVersions();
        requestDiffSoon();
    }

    function lineStatsText(stats) {
        const s = stats || {};
        const parts = [];
        if (s.added) parts.push(`<span class="plus">+${s.added}</span>`);
        if (s.removed) parts.push(`<span class="minus">-${s.removed}</span>`);
        if (s.moved) parts.push(`<span class="move">${s.moved} moved</span>`);
        if (s.changed) parts.push(`<span class="changed">${s.changed} changed</span>`);
        return parts.length ? parts.join(" ") : "0";
    }

    function renderDiff() {
        if (!currentDiff) {
            changeListEl.innerHTML = `<div class="empty">Diffing...</div>`;
            document.getElementById("metric-boxes").textContent = "0";
            document.getElementById("metric-props").textContent = "0";
            document.getElementById("metric-lines").textContent = "0";
            document.getElementById("change-caption").textContent = "No diff loaded";
            updateSelectionMetrics();
            return;
        }

        const boxes = currentDiff.boxes || [];
        document.getElementById("metric-boxes").textContent = currentDiff.changedBoxCount ?? boxes.length;
        document.getElementById("metric-props").textContent = currentDiff.propertyChangeCount ?? 0;
        document.getElementById("metric-lines").innerHTML = lineStatsText(currentDiff.lineStats);
        document.getElementById("change-caption").textContent = `${boxes.length} boxes differ from the live document`;

        if (!boxes.length) {
            changeListEl.innerHTML = `<div class="empty">No changes at this scrub point.</div>`;
            updateSelectionMetrics();
            return;
        }

        changeListEl.innerHTML = "";
        boxes.forEach((box) => changeListEl.appendChild(renderBoxChange(box)));
        updateSelectionMetrics();
    }

    function renderBoxChange(box) {
        const card = document.createElement("div");
        card.className = `box-card ${box.status}`;
        card.dataset.uid = box.uid;

        const head = document.createElement("div");
        head.className = "box-head";
        head.innerHTML = `
            <input type="checkbox" class="box-check">
            <div class="box-title"><strong></strong><span>${box.uid}</span></div>
            <span class="pill ${box.status}">${statusLabel(box.status)}</span>
            <button class="inspect-btn">Inspect</button>
        `;
        head.querySelector("strong").textContent = box.name || box.uid;
        const boxCheck = head.querySelector(".box-check");
        boxCheck.checked = selectedBoxes.has(box.uid);
        boxCheck.addEventListener("change", () => {
            if (boxCheck.checked) {
                selectedBoxes.add(box.uid);
                selectedProps.delete(box.uid);
            } else {
                selectedBoxes.delete(box.uid);
            }
            renderDiff();
        });
        head.querySelector(".inspect-btn").addEventListener("click", () => inspectBox(box.uid, firstTextProperty(box)));
        head.addEventListener("mouseenter", () => highlightParentDiff(box.uid));
        card.appendChild(head);

        const props = document.createElement("div");
        props.className = "props";
        (box.properties || []).forEach((prop) => props.appendChild(renderPropertyRow(box, prop)));
        card.appendChild(props);
        return card;
    }

    function renderPropertyRow(box, prop) {
        const row = document.createElement("div");
        row.className = "prop-row";
        const checked = selectedBoxes.has(box.uid) || (selectedProps.get(box.uid)?.has(prop.property) ?? false);
        row.innerHTML = `
            <input type="checkbox" class="prop-check">
            <div class="prop-name"></div>
            <div class="prop-kind">${prop.kind}</div>
            <div class="line-stats">${lineStatsText(prop.lineStats)}</div>
            <div class="preview"></div>
            <button class="prop-inspect">Open</button>
        `;
        row.querySelector(".prop-name").textContent = prop.property;
        row.querySelector(".preview").textContent = `${prop.currentPreview || "(missing)"} -> ${prop.targetPreview || "(missing)"}`;
        const check = row.querySelector(".prop-check");
        check.checked = checked;
        check.disabled = selectedBoxes.has(box.uid);
        check.addEventListener("change", () => {
            const set = selectedProps.get(box.uid) || new Set();
            if (check.checked) set.add(prop.property);
            else set.delete(prop.property);
            if (set.size) selectedProps.set(box.uid, set);
            else selectedProps.delete(box.uid);
            updateSelectionMetrics();
        });
        row.querySelector(".prop-inspect").addEventListener("click", () => inspectBox(box.uid, prop.property));
        row.addEventListener("mouseenter", () => highlightParentDiff(box.uid));
        return row;
    }

    function statusLabel(status) {
        if (status === "target-only") return "missing now";
        if (status === "present-only") return "new since then";
        return "changed";
    }

    function firstTextProperty(box) {
        const prop = (box.properties || []).find((p) => p.kind === "text");
        return prop ? prop.property : "code";
    }

    function inspectBox(uid, property) {
        try {
            if (window.parent && typeof window.parent.navigateToBoxProperty === "function") {
                window.parent.navigateToBoxProperty(uid, property || "code", null, null);
            }
        } catch (error) {
            console.warn("Unable to inspect parent box", error);
        }
    }

    function updateSelectionMetrics() {
        let count = selectedBoxes.size;
        selectedProps.forEach((set, uid) => {
            if (!selectedBoxes.has(uid)) count += set.size;
        });
        document.getElementById("metric-selected").textContent = count;
        document.getElementById("cherry-pick-btn").disabled = count === 0 || cherryInFlight;
    }

    function selectionPayload() {
        const payload = [];
        selectedBoxes.forEach((uid) => payload.push({ uid, properties: [] }));
        selectedProps.forEach((props, uid) => {
            if (!selectedBoxes.has(uid) && props.size) {
                payload.push({ uid, properties: Array.from(props).sort() });
            }
        });
        return payload;
    }

    function findParentBox(uid) {
        try {
            const boxes = Array.from(window.parent.document.body.getElementsByClassName("box"));
            return boxes.find((box) => box && box.uid === uid) || null;
        } catch (_) {
            return null;
        }
    }

    function ensureParentOverlay() {
        try {
            const doc = window.parent.document;
            let root = doc.getElementById("field-history-highlight-layer");
            if (!root) {
                root = doc.createElement("div");
                root.id = "field-history-highlight-layer";
                root.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:17";
                doc.body.appendChild(root);
            }
            return root;
        } catch (_) {
            return null;
        }
    }

    function clearParentHighlights() {
        try {
            const root = window.parent.document.getElementById("field-history-highlight-layer");
            if (root) root.innerHTML = "";
        } catch (_) {}
    }

    function highlightParentDiff(onlyUid = null) {
        clearParentHighlights();
        if (!currentDiff) return;
        const root = ensureParentOverlay();
        if (!root) return;

        const doc = window.parent.document;
        const svg = doc.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "100%");
        svg.setAttribute("viewBox", `0 0 ${window.parent.innerWidth} ${window.parent.innerHeight}`);
        root.appendChild(svg);

        const boxes = (currentDiff.boxes || []).filter((box) => !onlyUid || box.uid === onlyUid).slice(0, 180);
        boxes.forEach((box) => drawBoxHighlight(svg, box));
    }

    function drawBoxHighlight(svg, box) {
        const currentEl = findParentBox(box.uid);
        const currentRect = currentEl ? currentEl.getBoundingClientRect() : null;
        const targetRect = targetScreenRect(box, currentRect);
        if (currentRect) drawRect(svg, currentRect, box.status === "present-only" ? "#ff8585" : "#e8e8e8", false);
        if (targetRect) drawRect(svg, targetRect, box.status === "target-only" ? "#8ee38e" : "#8bbdff", true);
        if (currentRect && targetRect && (Math.abs(currentRect.left - targetRect.left) > 2 || Math.abs(currentRect.top - targetRect.top) > 2)) {
            drawLine(svg, currentRect, targetRect);
        }
    }

    function targetScreenRect(box, currentRect) {
        if (!box.targetFrame) return null;
        if (currentRect && box.currentFrame) {
            return {
                left: currentRect.left + (box.targetFrame.x - box.currentFrame.x),
                top: currentRect.top + (box.targetFrame.y - box.currentFrame.y),
                width: box.targetFrame.w,
                height: box.targetFrame.h
            };
        }
        try {
            const anyBox = window.parent.document.body.querySelector(".box");
            const container = anyBox?.parentElement;
            const cr = container?.getBoundingClientRect();
            if (!cr) return null;
            return {
                left: cr.left + box.targetFrame.x,
                top: cr.top + box.targetFrame.y,
                width: box.targetFrame.w,
                height: box.targetFrame.h
            };
        } catch (_) {
            return null;
        }
    }

    function drawRect(svg, rect, color, dashed) {
        const r = svg.ownerDocument.createElementNS("http://www.w3.org/2000/svg", "rect");
        r.setAttribute("x", rect.left);
        r.setAttribute("y", rect.top);
        r.setAttribute("width", Math.max(4, rect.width));
        r.setAttribute("height", Math.max(4, rect.height));
        r.setAttribute("fill", "none");
        r.setAttribute("stroke", color);
        r.setAttribute("stroke-width", dashed ? "1.5" : "2");
        if (dashed) r.setAttribute("stroke-dasharray", "6 4");
        svg.appendChild(r);
    }

    function drawLine(svg, from, to) {
        const line = svg.ownerDocument.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", from.left + from.width / 2);
        line.setAttribute("y1", from.top + from.height / 2);
        line.setAttribute("x2", to.left + to.width / 2);
        line.setAttribute("y2", to.top + to.height / 2);
        line.setAttribute("stroke", "#8bbdff");
        line.setAttribute("stroke-width", "1");
        line.setAttribute("stroke-dasharray", "4 4");
        svg.appendChild(line);
    }

    scrubberEl.addEventListener("input", () => selectVersion(Number(scrubberEl.value)));
    document.getElementById("refresh-btn").addEventListener("click", requestHistory);
    document.getElementById("selected-filter-btn").addEventListener("click", () => {
        selectedOnly = !selectedOnly;
        document.getElementById("selected-filter-btn").textContent = selectedOnly ? "Selected Boxes" : "Whole Document";
        requestDiffNow();
    });
    document.getElementById("select-all-btn").addEventListener("click", () => {
        (currentDiff?.boxes || []).forEach((box) => selectedBoxes.add(box.uid));
        selectedProps.clear();
        renderDiff();
    });
    document.getElementById("clear-selection-btn").addEventListener("click", () => {
        selectedBoxes.clear();
        selectedProps.clear();
        renderDiff();
    });
    document.getElementById("name-save-btn").addEventListener("click", () => {
        if (namingInFlight || !versions[selectedIndex]) return;
        namingInFlight = true;
        nameInput.disabled = true;
        send({
            name: "name-history-version",
            payload: {
                versionIndex: selectedIndex,
                name: nameInput.value.trim()
            }
        });
    });
    nameInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") document.getElementById("name-save-btn").click();
    });
    document.getElementById("cherry-pick-btn").addEventListener("click", () => {
        const selections = selectionPayload();
        if (!selections.length || cherryInFlight) return;
        const ok = window.confirm(`Cherry-pick ${selections.length} selection(s) from version #${selectedIndex}?`);
        if (!ok) return;
        cherryInFlight = true;
        updateSelectionMetrics();
        send({
            name: "cherry-pick-history-version",
            payload: {
                versionIndex: selectedIndex,
                selections,
                includeTopology: true
            }
        });
    });
    document.getElementById("full-restore-btn").addEventListener("click", () => {
        if (selectedIndex === versions.length - 1) return;
        const ok = window.confirm(`Restore the whole document to version #${selectedIndex}?`);
        if (!ok) return;
        send({ name: "restore-history-version", payload: { versionIndex: selectedIndex } });
    });
    document.getElementById("close-btn").addEventListener("click", () => {
        clearParentHighlights();
        try {
            if (window.parent && typeof window.parent.hideHistoryIframe === "function") {
                window.parent.hideHistoryIframe();
                return;
            }
        } catch (_) {}
        window.close();
    });
    window.addEventListener("beforeunload", clearParentHighlights);

    connect();
</script>
</body>
</html>
