<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>Field | Offline Viewer</title>
    <link rel="preload" href="woff2/iosevka-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="iosevka.css" as="style">
    <link rel="stylesheet" href="iosevka.css">
    <link rel="stylesheet" href="outputareas.css">
    <style>
        .published-outputs { position:absolute; left:0; top:100%; padding-top:8px; cursor:auto; text-align:left; }
        .published-output { background:transparent; border:0; margin-bottom:6px; color:#ddd; }
        .published-output summary { position:relative; display:block; width:max-content; padding:4px 8px; min-height:24px; background:#000; cursor:pointer; font:italic 12px "Iosevka Web",monospace; }
        .published-output summary::-webkit-details-marker { display:none; }
        .published-output summary::before { content:''; position:absolute; left:-18px; top:8px; width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:7px solid #000; }
        .published-output[open] > summary::before { transform:rotate(90deg); }
        .published-output summary:hover { background:#191919; }
        .published-output summary:hover::before { border-left-color:#ddd; }
        .published-output:focus, .published-output summary:focus { outline:none; box-shadow:none; }
        .published-output iframe { display:block; width:100%; border:0; background:#000; }
        .published-output-warning { padding:6px 10px; max-width:640px; color:#aaa; font-size:12px; user-select:text; }
        body {
            font-family: "Iosevka Web", system-ui, Avenir, Helvetica, Arial, sans-serif;
            font-weight: 300;
            margin: 0;
            padding: 0;
            background: rgba(20, 20, 20, 1);
            overflow: hidden;
        }

        :root {
            --field-cyan-rgb: 72, 201, 255;
            --field-cyan: rgb(var(--field-cyan-rgb));
            --field-cyan-muted: rgba(var(--field-cyan-rgb), 0.4);
            --field-panel: rgba(0, 0, 0, 0.26);
            --field-text: #a9e6ff;
            --field-text-soft: #7fd4ff;
        }

        * {
            box-sizing: border-box;
        }

        /* no entry animation on boxes */

        #viewport {
            position: absolute;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #canvas {
            position: relative;
            min-width: 100vw;
            min-height: 100vh;
            transform-origin: 0 0;
            z-index: 1;
        }

        #connections {
            position: absolute;
            transform-origin: 0 0;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
            z-index: 0;
        }

        .box {
            position: absolute;
            color: rgb(255, 255, 255, 0.8);
            border-radius: 5px;
            backdrop-filter: blur(3px);
            border: 1px solid rgb(255, 255, 255, 0.0);
            background-color: rgb(50, 50, 50, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .box:hover {
            transform: none;
            box-shadow: none;
        }

        .box::before {
            content: " ";
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border: 5px solid rgba(0, 0, 0, 0.8);
            width: 100%;
            height: 100%;
            padding: 1px;
            border-radius: 5px;
            pointer-events: none;
        }

        .box.selected {
            border-color: rgba(var(--field-cyan-rgb), 0.9);
            box-shadow: none;
        }

        .box-name {
            padding: 8px;
            display: block;
            text-align: center;
            max-width: 100%;
            max-height: 100%;
            white-space: normal;
            overflow: hidden;
            overflow-wrap: anywhere;
            hyphens: manual;
        }

        .monaco-editor-container {
            position: fixed;
            top: 5px;
            right: 5px;
            height: calc(100vh - 10px);
            width: min(calc(70vw - 10px), 900px);
            max-width: calc(100vw - 10px);
            border: 5px solid black;
            border-radius: 5px;
            padding: 5px;
            background: #1e1e1e;
            z-index: 19;
            display: none;
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .monaco-editor-container.visible {
            display: flex;
            flex-direction: column;
            opacity: 1;
            transform: translateX(0);
        }

        #editor {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            font-family: "Iosevka Web", system-ui, Avenir, Helvetica, Arial, sans-serif !important;
        }

        #editor .monaco-editor { outline: none !important; }

        .editor-resize-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -5px;
            width: 10px;
            z-index: 22;
            cursor: ew-resize;
            touch-action: none;
            outline: none;
        }

        .editor-resize-handle::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #777;
            opacity: 0;
        }

        .editor-resize-handle:hover::after,
        .editor-resize-handle:focus-visible::after { opacity: 1; }
        html.editor-resizing, html.editor-resizing * { cursor: ew-resize !important; user-select: none !important; }

        .literate-view {
            display: none;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            font-family: "Iosevka Web", system-ui, Avenir, Helvetica, Arial, sans-serif;
            padding: 4px 6px;
            color: #e8f3ff;
            font-size: 12px;
        }

        .property-tabs {
            display: flex;
            gap: 3px;
            margin-bottom: 8px;
            padding: 2px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }

        .view-toggle {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 21;
        }

        .view-toggle button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 3px;
            background: transparent;
            border: 0;
            border-radius: 3px;
            color: #aaa;
            cursor: pointer;
            height: 23px;
            width: 24px;
        }

        .view-toggle button:hover, .view-toggle button[aria-pressed="true"] {
            color: #eee;
            background: rgba(255, 255, 255, 0.08);
        }
        .view-toggle button:focus-visible { outline: 1px solid #777; outline-offset: 2px; }

        .property-tab {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            color: var(--field-text-soft);
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
        }

        .property-tab:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .property-tab.active {
            background: var(--field-cyan);
            color: #000;
            border-color: var(--field-cyan);
        }

        #editor .margin { background:#000 !important; border-right:8px solid #000; }
        /* Small folio numbers, centred inside Monaco's own full-height line boxes. */
        .monaco-editor .margin-view-overlays .line-numbers {
            color: rgba(255, 255, 255, 0.63) !important;
            font-size:70% !important;
            display:flex;
            align-items:center;
            justify-content:flex-end;
        }

        .monaco-editor .margin-view-overlays .line-numbers.active-line-number {
            color: rgba(255, 255, 255, 0.9) !important;
        }

        .lit-code-block {
            margin: 3px 0 6px 0;
            padding: 6px 8px;
            background: #11161c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow-x: auto;
            font-size: 11.5px;
            line-height: 1.35;
        }

        .lit-comment {
            margin: 3px 0 6px 0;
            padding: 3px 0 3px 8px;
            color: #c9d9f2;
            line-height: 1.35;
        }

        .offline-banner {
            position: fixed;
            bottom: 10px;
            left: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--field-cyan);
            border-radius: 8px;
            color: var(--field-text);
            font-size: 12px;
            z-index: 20;
            backdrop-filter: blur(10px);
            max-width: 320px;
            white-space: normal;
            line-height: 1.35;
        }

        .open-local-button {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--field-cyan);
            border-radius: 8px;
            color: var(--field-text);
            font-size: 12px;
            line-height: 1.35;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(10px);
            transition: background 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .open-local-button:hover {
            background: rgba(var(--field-cyan-rgb), 0.22);
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--field-cyan);
            font-size: 18px;
            z-index: 100;
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid red;
            border-radius: 8px;
            color: white;
            z-index: 100;
            max-width: 80%;
        }

        /* The drawing layer: the root box's Excalidraw scene, in world coordinates under the boxes.
           Field shows the scene through Excalidraw's dark theme filter; so does the viewer. */
        .drawing-layer {
            position: absolute;
            overflow: visible;
            pointer-events: none;
            z-index: 0;
        }

        .drawing-theme {
            filter: invert(93%) hue-rotate(180deg);
        }

        .box {
            z-index: 1;
        }

        .box-notes-badge {
            position: absolute;
            top: 3px;
            right: 6px;
            font-size: 12px;
            color: var(--field-text-soft);
            opacity: 0.75;
            pointer-events: none;
        }

        .property-tabs {
            flex: 0 0 auto;
            flex-wrap: wrap;
            padding-right: 30px;
        }

        /* A box's notes, as Markdown, above its code. */
        .notes-view {
            display: none;
            flex: 0 1 auto;
            max-height: 48%;
            overflow: auto;
            margin: 0 0 8px 0;
            padding: 4px 14px 8px 12px;
            border-left: 2px solid var(--field-cyan-muted);
            color: #dbe8f5;
            font-size: 13px;
            line-height: 1.5;
        }

        .monaco-editor-container.no-code .notes-view {
            max-height: none;
            flex: 1 1 auto;
        }

        .notes-view h1, .notes-view h2, .notes-view h3, .notes-view h4 {
            color: var(--field-text);
            font-weight: 400;
            margin: 10px 0 6px 0;
            line-height: 1.25;
        }

        .notes-view h1 { font-size: 19px; }
        .notes-view h2 { font-size: 16px; }
        .notes-view h3, .notes-view h4 { font-size: 14px; }
        .notes-view p { margin: 6px 0; }
        .notes-view a { color: var(--field-cyan); }
        .notes-view img { max-width: 100%; border-radius: 4px; }
        .notes-view code {
            font-family: "Iosevka Web", monospace;
            background: rgba(255, 255, 255, 0.07);
            padding: 0 3px;
            border-radius: 3px;
            color: #f0d9a0;
        }

        .notes-view pre.md-code {
            background: #11161c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 6px 8px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.35;
        }

        .notes-view pre.md-code code { background: none; padding: 0; color: inherit; }
        .notes-view blockquote { margin: 6px 0; padding-left: 10px; border-left: 2px solid rgba(255,255,255,0.2); opacity: 0.85; }
        .notes-view ul, .notes-view ol { margin: 6px 0; padding-left: 22px; }
        .notes-view table { border-collapse: collapse; margin: 8px 0; font-size: 12px; }
        .notes-view th, .notes-view td { border: 1px solid rgba(255, 255, 255, 0.12); padding: 3px 7px; vertical-align: top; }
        .notes-view th { color: var(--field-text); font-weight: 400; background: rgba(255,255,255,0.04); }
        .notes-view hr { border: none; border-top: 1px solid rgba(255,255,255,0.15); }

        /* Zoom, drawing, layers and bookmarks. */
        .document-panel {
            position: fixed;
            top: 50px; /* tucked under "Open in Field·4" */
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 20;
            max-width: calc(30vw - 160px);
            min-width: 260px;
            font-size: 11px;
            color: var(--field-text);
        }

        .document-panel { min-width: 0; align-items: flex-start; }
        .doc-toggle {
            font: inherit;
            color: var(--field-text);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--field-cyan-muted);
            border-radius: 8px;
            padding: 4px 9px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        .doc-toggle:hover { background: rgba(var(--field-cyan-rgb), 0.2); }
        .doc-body { display: none; flex-direction: column; gap: 4px; min-width: 260px; }
        .document-panel.open .doc-body { display: flex; }

        .doc-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--field-cyan-muted);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .doc-row button {
            font: inherit;
            color: var(--field-text);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(var(--field-cyan-rgb), 0.3);
            border-radius: 5px;
            padding: 1px 7px;
            cursor: pointer;
        }

        .doc-row button:hover { background: rgba(var(--field-cyan-rgb), 0.2); }
        .doc-row button.active { background: var(--field-cyan); color: #000; }
        .doc-row label { cursor: pointer; margin-left: 4px; }
        .doc-label { opacity: 0.6; margin-right: 2px; }
        #zoom-readout { min-width: 38px; text-align: center; }
    </style>
</head>
<body>
    <div class="offline-banner">
        <span style="opacity: 0.7; font-size: 11px;">Loading…</span>
    </div>

    <div class="loading" id="loading">Loading Field document...</div>
    <div class="error-message" id="error" style="display: none;"></div>

    <div id="viewport">
        <div id="canvas"></div>
        <svg id="connections"></svg>
    </div>

    <div class="monaco-editor-container" id="editor-container">
        <div class="editor-resize-handle" id="editor-resize-handle" role="separator" aria-label="Resize editor" aria-orientation="vertical" aria-controls="editor-container" tabindex="0"></div>
        <div class="property-tabs" id="property-tabs"></div>
        <div class="view-toggle"><button id="literate-toggle" type="button" aria-label="Toggle reader view" aria-pressed="false" title="Show reader view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7c-2-2-6-2-9-1v14c3-1 7-1 9 1 2-2 6-2 9-1V6c-3-1-7-1-9 1Z"/><path d="M12 7v14"/></svg></button></div>
        <div class="notes-view" id="notes-view"></div>
        <div id="editor"></div>
        <div class="literate-view" id="literate-view"></div>
    </div>

    <div class="document-panel" id="document-panel"></div>

    <a class="open-local-button" id="open-local" style="display: none;">
        Open in Field·4
    </a>

    <script type="text/javascript" src="./min/vs/loader.js"></script>
    <script src="edn-parser.js"></script>
    <script src="offline-outputs.js"></script>
    <script src="offline-viewer.js"></script>
</body>
</html>
