// [viewer-region pick-thresholds] BEGIN
// How near a ray has to pass a LINE or a POINT SPRITE to count as hitting it.
//
// A `Mesh` is picked exactly — the ray either crosses a triangle or it does not — but a `Line` and a
// `Points` have no area, so three.js needs a radius, and the viewer's were the constants `0.06` and
// `1.5` world units. Fine numbers for a figure a couple of units across, and **nonsense** at model
// scale: on the millimetre panels the inspector was written for, 0.06 mm is sixty microns, and an
// FLine annotation in such a figure could not be clicked at all. It went unnoticed because until now
// the only things worth clicking in those figures were the *fills*, which are meshes and are picked
// exactly. Mixing a solid and its annotations made it impossible to ignore: the whole point of such a
// scene is to measure from one to the other, and one of the two was unhittable.
//
// ### The monotonicity claim, which is why this is a region
//
// This is the one edit in the mesh-picking work that changes **existing** behaviour, so the property
// that makes it safe is written as a function and asserted rather than argued in a comment:
//
//   * the result is never below the constant that was there before, at any bounds;
//   * it is *exactly* that constant — bit for bit — for every figure below the crossover, which is a
//     bounding diagonal of `0.06 / 0.005 = 12` for lines and `1.5 / 0.01 = 150` for points. Every
//     unit-scale FLine figure in the docs is far below both;
//   * it is non-decreasing in the diagonal, so no figure can be made *harder* to pick than it is today.
//
// `ThreePickThresholdTest` holds all three over a sweep that straddles both crossovers, plus the
// missing-bounds case — which has to fall back to the legacy constants, because a payload with no
// bounds is exactly the shape a caller that predates any of this sends.
const PICK_LINE_THRESHOLD_MIN = 0.06;
const PICK_POINT_THRESHOLD_MIN = 1.5;
const PICK_LINE_THRESHOLD_FRACTION = 0.005;
const PICK_POINT_THRESHOLD_FRACTION = 0.01;

/**
 * The bounding diagonal a threshold is scaled by.
 *
 * `1` for absent, degenerate or non-finite bounds — deliberately a *small* number, so the `max` below
 * returns the legacy constant and a payload that says nothing usable about its size is treated exactly
 * as it was before any of this existed. Four lines duplicated from `inspectorDiagonal`, because a
 * region has to be liftable on its own and a cross-region call would make both untestable in isolation.
 */
function pickThresholdDiagonal(bounds) {
    if (!bounds || !bounds.min || !bounds.max) return 1;
    const dx = bounds.max[0] - bounds.min[0];
    const dy = bounds.max[1] - bounds.min[1];
    const dz = bounds.max[2] - bounds.min[2];
    const diagonal = Math.sqrt(dx * dx + dy * dy + dz * dz);
    return isFinite(diagonal) && diagonal > 0 ? diagonal : 1;
}

/** The line-pick radius for a figure of these bounds. Never below `PICK_LINE_THRESHOLD_MIN`. */
function pickLineThreshold(bounds) {
    return Math.max(PICK_LINE_THRESHOLD_MIN, pickThresholdDiagonal(bounds) * PICK_LINE_THRESHOLD_FRACTION);
}

/** The point-sprite pick radius. Never below `PICK_POINT_THRESHOLD_MIN`. */
function pickPointThreshold(bounds) {
    return Math.max(PICK_POINT_THRESHOLD_MIN, pickThresholdDiagonal(bounds) * PICK_POINT_THRESHOLD_FRACTION);
}
// [viewer-region pick-thresholds] END

function applyPickThresholds(bounds) {
    raycaster.params.Line = { threshold: pickLineThreshold(bounds) };
    raycaster.params.Points = { threshold: pickPointThreshold(bounds) };
}

// The startup defaults, from the same function and therefore from the same constants — see the note by
// `const raycaster`. `null` bounds is the legacy pair, exactly.
applyPickThresholds(null);

function applyGeometry(payload) {
    if (!payload || payload.type !== 'three/geometry') return;
    requestRender();
    payloadState = payload;
    editorState.pointerDown = null;
    editorState.dragging = null;
    editorState.marquee = null;
    hideMarquee();

    updateMeta(payload.meta);
    applyPickThresholds(payload.bounds);
    editorState.scene = payload.scene ? JSON.parse(JSON.stringify(payload.scene)) : null;
    editorState.selection = new Set();
    if (!payload.editableEnabled) {
        editorState.mode = 'camera';
    }
    if (editorState.scene) rebuildEditableView();
    else renderPayloadGeometry(payload);
    updateEditableHud();
    publishFrameSize(payload);
    applyScenePanels(payload);
    if (payload.background) container.style.background = payload.background;
    // Absent means true — the field is omitted from every payload that predates it.
    const wantHelpers = payload.helpers !== false;
    grid.visible = wantHelpers;
    axes.visible = wantHelpers;
    if (!hasFramedInitialGeometry && payload.bounds && payload.autoFrame !== false) {
        frameBounds(payload.bounds);
        hasFramedInitialGeometry = true;
    }
    // An explicit camera spec beats auto-framing, and beats it on every payload rather than only the
    // first: a caller who named an angle means it, and a re-publish must not drift off it.
    if (payload.camera && payload.bounds && panelState.cameras.length <= 1) {
        camera.aspect = container.clientHeight > 0 ? container.clientWidth / container.clientHeight : 1;
        applyCameraSpec(camera, payload.camera, payload.bounds, true, fitPointsForPanel(-1));
        const derived = cameraPresetEye(payload.camera, payload.bounds);
        controls.target.set(derived.target[0], derived.target[1], derived.target[2]);
        controls.update();
        hasFramedInitialGeometry = true;
    }
    // Last, because it reads the geometry the steps above created and because framing the camera first
    // means the first dimension is offset across the view the user is actually going to see.
    inspectorCapture(payload);
    inspectorPartHud();
    viewerTools.sync(payload.toolModules || []).then(() => {
        if (payloadState !== payload) return;
        const review = payload.inspector?.review;
        if (review) inspectorRestore({...review, xray:review.xray ?? xrayState.enabled, xrayOpacity:review.xrayOpacity ?? xrayState.opacity});
        inspectorRefresh();
    }).catch(error => {
        const status = document.getElementById('glb-status');
        status.classList.add('is-error'); status.textContent = 'Viewer tool: ' + error.message;
    });
    inspectorUpdateHud();
    inspectorRefresh();
}

function buildWsUrl() {
    const override = urlParams.get('ws');
    if (override) return override;
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const overrideHost = urlParams.get('wsHost');
    const hostBase = overrideHost ?? window.location.host;
    const needsPort = !hostBase.includes(':') && window.location.port;
    const host = needsPort ? `${hostBase}:${window.location.port}` : hostBase;
    const path = urlParams.get('wsPath') ?? '/ws';
    return `${protocol}//${host}${path}`;
}

const clientUid = (urlParams.get('uid') || '').trim() || `three-${Math.random().toString(36).slice(2)}`;
const wsState = { ws: null, reconnectTimer: null };

function sendMessage(payload) {
    if (!wsState.ws || wsState.ws.readyState !== WebSocket.OPEN) return;
    const message = { channel: '__threejs__', debug_uid: clientUid, ...payload };
    wsState.ws.send(JSON.stringify(message));
}

function connectWs() {
    const ws = new WebSocket(buildWsUrl());
    wsState.ws = ws;
    ws.addEventListener('open', () => sendMessage({ type: 'hello' }));
    ws.addEventListener('message', (event) => {
        let message = null;
        try { message = JSON.parse(event.data); } catch (_) { return; }
        if(message.type==='three-review-ack'){featureSaving=false; featureHud(); featureMessage(message.message,!message.ok);return;}
        applyGeometry(message);
    });
    ws.addEventListener('close', () => {
        if(featureSaving){featureSaving=false;featureHud();featureMessage('Connection lost while saving. Check the inbox before retrying.',true);}
        if (!wsState.reconnectTimer) {
            wsState.reconnectTimer = window.setTimeout(() => {
                wsState.reconnectTimer = null;
                connectWs();
            }, 1200);
        }
    });
    ws.addEventListener('error', () => ws.close());
}

let pointerPanel = -1;
let pointerCamera = null;

// [viewer-region panel-pointer] BEGIN
/** CSS canvas coordinates, bottom-left origin; title bands and empty grid cells are not pickable. */
function panelPointerAt(x, y, viewports) {
    for (let i = 0; i < viewports.length; i++) {
        const v = viewports[i];
        if (x >= v.x && x < v.x + v.w && y >= v.y && y < v.y + v.h) {
            return { panel: i, x: (x - v.x) / v.w * 2 - 1, y: (y - v.y) / v.h * 2 - 1 };
        }
    }
    return null;
}
// [viewer-region panel-pointer] END

function entryInPointerPanel(entry) {
    return pointerPanel === -1 || (pointerPanel >= 0 && (entry.panel === undefined || entry.panel === -1 || entry.panel === pointerPanel));
}

function setPointerFromEvent(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointerCamera = camera;
    pointerPanel = -1;
    if (panelState.cameras.length > 1 && editorState.mode === 'camera') {
        updatePanelCameras();
        const x = (event.clientX - rect.left) / rect.width * container.clientWidth;
        const y = (rect.bottom - event.clientY) / rect.height * container.clientHeight;
        const hit = panelPointerAt(x, y, panelState.cameras.map((_, i) => panelViewport(i, panelState.cameras.length)));
        if (!hit) { pointerPanel = -2; pointer.set(2, 2); return; }
        pointerPanel = hit.panel;
        pointerCamera = panelState.cameras[hit.panel].camera;
        pointerCamera.updateMatrixWorld();
        pointer.set(hit.x, hit.y);
        return;
    }
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
}

function intersectEditableHit(event) {
    if (!editableHitObjects.length) return null;
    const rect = renderer.domElement.getBoundingClientRect();
    const canvasPoint = {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };
    let bestPointHit = null;
    editableHitObjects.forEach((entry) => {
        if (!entry.isScreenPointHandle) return;
        const item = entry.item;
        const projected = worldToCanvas([item.x, item.y, item.z]);
        if (!projected.visible) return;
        const selected = editorState.selection.has(item.key);
        const radius = Math.max(HANDLE_HIT_RADIUS_PX, handleSpriteSizePx(item, selected) * 0.65);
        const dx = projected.x - canvasPoint.x;
        const dy = projected.y - canvasPoint.y;
        const distance = Math.hypot(dx, dy);
        if (distance <= radius && (!bestPointHit || distance < bestPointHit.distance)) {
            bestPointHit = {
                distance,
                object: { userData: { itemKey: item.key } },
                point: new THREE.Vector3(item.x, item.y, item.z)
            };
        }
    });
    if (bestPointHit) return bestPointHit;

    const raycastObjects = editableHitObjects.filter((entry) => !entry.isScreenPointHandle);
    if (!raycastObjects.length) return null;
    setPointerFromEvent(event);
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(raycastObjects, false);
    return hits.length ? hits[0] : null;
}

function intersectPlaneFromEvent(event, plane) {
    setPointerFromEvent(event);
    raycaster.setFromCamera(pointer, camera);
    const target = new THREE.Vector3();
    const hit = raycaster.ray.intersectPlane(plane, target);
    return hit ? target.clone() : null;
}

function computeSelectionAnchor(refs) {
    const anchor = new THREE.Vector3();
    let count = 0;
    refs.forEach((ref) => {
        const point = resolveRefPoint(editorState.scene, ref);
        if (!point) return;
        anchor.add(vec3FromArray(point));
        count += 1;
    });
    if (!count) return null;
    return anchor.multiplyScalar(1 / count);
}

function worldToCanvas(point) {
    const rect = renderer.domElement.getBoundingClientRect();
    const projected = vec3FromArray(point).project(camera);
    return {
        x: (projected.x * 0.5 + 0.5) * rect.width,
        y: (-projected.y * 0.5 + 0.5) * rect.height,
        visible: projected.z >= -1 && projected.z <= 1
    };
}

function rectContainsPoint(rect, point) {
    return point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h;
}

function rectIntersectsProjectedPoints(rect, points) {
    const visible = points.map(worldToCanvas).filter((point) => point.visible);
    if (!visible.length) return false;
    let minX = visible[0].x;
    let minY = visible[0].y;
    let maxX = visible[0].x;
    let maxY = visible[0].y;
    visible.forEach((point) => {
        minX = Math.min(minX, point.x);
        minY = Math.min(minY, point.y);
        maxX = Math.max(maxX, point.x);
        maxY = Math.max(maxY, point.y);
    });
    return rect.x <= maxX && rect.x + rect.w >= minX && rect.y <= maxY && rect.y + rect.h >= minY;
}

function marqueeSelection(rect) {
    const keys = [];
    if (editorState.mask.point) {
        editorState.points.forEach((item) => {
            const projected = worldToCanvas([item.x, item.y, item.z]);
            if (projected.visible && rectContainsPoint(rect, projected)) keys.push(item.key);
        });
    }
    if (editorState.mask.edge) {
        editorState.edges.forEach((item) => {
            if (rectIntersectsProjectedPoints(rect, item.points)) keys.push(item.key);
        });
    }
    if (editorState.mask.face) {
        editorState.faces.forEach((item) => {
            if (rectIntersectsProjectedPoints(rect, item.boundary)) keys.push(item.key);
        });
    }
    return keys;
}

function showMarquee(marquee) {
    const rect = renderer.domElement.getBoundingClientRect();
    const x = Math.min(marquee.x0, marquee.x1);
    const y = Math.min(marquee.y0, marquee.y1);
    const w = Math.abs(marquee.x1 - marquee.x0);
    const h = Math.abs(marquee.y1 - marquee.y0);
    marqueeEl.style.left = `${rect.left + x}px`;
    marqueeEl.style.top = `${rect.top + y}px`;
    marqueeEl.style.width = `${w}px`;
    marqueeEl.style.height = `${h}px`;
    marqueeEl.style.display = 'block';
}

function hideMarquee() {
    marqueeEl.style.display = 'none';
}

function updateCursor(event = null) {
    if (editorState.mode !== 'edit') {
        renderer.domElement.style.cursor = '';
        return;
    }
    const hit = event ? intersectEditableHit(event) : null;
    renderer.domElement.style.cursor = hit ? 'pointer' : '';
}

modeGroupEl.querySelectorAll('[data-mode]').forEach((button) => {
    button.addEventListener('click', () => setMode(button.getAttribute('data-mode')));
});

maskGroupEl.querySelectorAll('[data-mask]').forEach((button) => {
    const mask = button.getAttribute('data-mask');
    button.addEventListener('click', () => {
        editorState.mask[mask] = !editorState.mask[mask];
        button.classList.toggle('is-active', !!editorState.mask[mask]);
        rebuildEditableView();
    });
});

renderer.domElement.tabIndex = 0;
renderer.domElement.addEventListener('keydown', (event) => {
    if (event.key !== 'e' && event.key !== 'E') return;
    const target = event.target;
    if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) return;
    editorState.uiVisible = !editorState.uiVisible;
    updateEditableHud();
    renderEditableOverlay();
    event.preventDefault();
    event.stopPropagation();
});

renderer.domElement.addEventListener('pointerdown', (event) => {
    renderer.domElement.focus();
    if (editorState.mode === 'camera') {
        cameraIsDragging = false;
        cameraPointerDown = { x: event.clientX, y: event.clientY };
        return;
    }
    if (editorState.mode !== 'edit' || !editorState.scene) return;
    const hit = intersectEditableHit(event);
    editorState.pointerDown = {
        pointerId: event.pointerId,
        startClientX: event.clientX,
        startClientY: event.clientY,
        startCanvasX: event.clientX - renderer.domElement.getBoundingClientRect().left,
        startCanvasY: event.clientY - renderer.domElement.getBoundingClientRect().top,
        hitKey: hit?.object?.userData?.itemKey || null,
        shiftKey: !!event.shiftKey
    };
    try { renderer.domElement.setPointerCapture(event.pointerId); } catch (_) {}
    event.preventDefault();
});

renderer.domElement.addEventListener('pointermove', (event) => {
    requestRender();
    setPointerFromEvent(event);
    if (editorState.mode === 'camera') {
        if (cameraPointerDown) {
            const dx = event.clientX - cameraPointerDown.x;
            const dy = event.clientY - cameraPointerDown.y;
            if (Math.hypot(dx, dy) >= DRAG_THRESHOLD_PX) cameraIsDragging = true;
        }
        return;
    }
    if (editorState.mode !== 'edit' || !editorState.scene) return;

    const down = editorState.pointerDown;
    if (!editorState.dragging && !editorState.marquee && down && down.pointerId === event.pointerId) {
        const dx = event.clientX - down.startClientX;
        const dy = event.clientY - down.startClientY;
        if (Math.hypot(dx, dy) >= DRAG_THRESHOLD_PX) {
            if (down.hitKey) {
                if (!editorState.selection.has(down.hitKey)) {
                    const next = new Set(editorState.selection);
                    next.add(down.hitKey);
                    editorState.selection = next;
                    rebuildEditableView();
                }
                let refs = selectionRefs(editorState);
                if (!refs.length) {
                    const item = editorState.items.get(down.hitKey);
                    refs = item ? uniqueRefs(item.pointRefs || []) : [];
                }
                const anchor = computeSelectionAnchor(refs);
                if (anchor && refs.length) {
                    const viewNormal = camera.getWorldDirection(new THREE.Vector3()).normalize();
                    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(viewNormal, anchor);
                    const hitPoint = intersectPlaneFromEvent(event, plane);
                    if (hitPoint) {
                        editorState.dragging = {
                            pointerId: event.pointerId,
                            refs,
                            plane,
                            lastPoint: hitPoint
                        };
                    }
                }
            } else {
                editorState.marquee = {
                    pointerId: event.pointerId,
                    x0: down.startCanvasX,
                    y0: down.startCanvasY,
                    x1: event.clientX - renderer.domElement.getBoundingClientRect().left,
                    y1: event.clientY - renderer.domElement.getBoundingClientRect().top,
                    additive: down.shiftKey
                };
                showMarquee(editorState.marquee);
            }
        }
    }

    if (editorState.dragging && editorState.dragging.pointerId === event.pointerId) {
        const hitPoint = intersectPlaneFromEvent(event, editorState.dragging.plane);
        if (hitPoint) {
            const delta = new THREE.Vector3().subVectors(hitPoint, editorState.dragging.lastPoint);
            if (delta.lengthSq() > 0) {
                translatePointRefs(editorState.scene, editorState.dragging.refs, delta.x, delta.y, delta.z);
                sendMessage({
                    type: 'fline-edit-translate',
                    sessionId: editorState.scene.sessionId,
                    points: uniqueRefs(editorState.dragging.refs),
                    dx: delta.x,
                    dy: delta.y,
                    dz: delta.z,
                    space: 'MODEL'
                });
                editorState.dragging.lastPoint = hitPoint;
                rebuildEditableView();
            }
        }
        event.preventDefault();
        return;
    }

    if (editorState.marquee && editorState.marquee.pointerId === event.pointerId) {
        editorState.marquee.x1 = event.clientX - renderer.domElement.getBoundingClientRect().left;
        editorState.marquee.y1 = event.clientY - renderer.domElement.getBoundingClientRect().top;
        showMarquee(editorState.marquee);
        event.preventDefault();
        return;
    }

    updateCursor(event);
});

function finishPointer(event) {
    requestRender();
    if (editorState.mode === 'camera') {
        cameraPointerDown = null;
        return;
    }
    const hadMarquee = !!(editorState.marquee && editorState.marquee.pointerId === event.pointerId);
    const hadDragging = !!(editorState.dragging && editorState.dragging.pointerId === event.pointerId);

    if (editorState.marquee && editorState.marquee.pointerId === event.pointerId) {
        const rect = {
            x: Math.min(editorState.marquee.x0, editorState.marquee.x1),
            y: Math.min(editorState.marquee.y0, editorState.marquee.y1),
            w: Math.abs(editorState.marquee.x1 - editorState.marquee.x0),
            h: Math.abs(editorState.marquee.y1 - editorState.marquee.y0)
        };
        const keys = marqueeSelection(rect);
        const additive = editorState.marquee.additive;
        editorState.marquee = null;
        hideMarquee();
        applySelection(keys, additive);
    }

    if (editorState.dragging && editorState.dragging.pointerId === event.pointerId) {
        editorState.dragging = null;
        rebuildEditableView();
        sendMessage({type: 'fline-edit-commit', sessionId: editorState.scene.sessionId});
    }

    const down = editorState.pointerDown;
    if (down && down.pointerId === event.pointerId && editorState.mode === 'edit' && editorState.scene) {
        if (!hadMarquee && !hadDragging) {
            if (down.hitKey) {
                if (down.shiftKey) toggleSelection(down.hitKey);
                else applySelection([down.hitKey], false);
            } else if (!down.shiftKey && editorState.selection.size > 0) {
                editorState.selection = new Set();
                rebuildEditableView();
            }
        }
        editorState.pointerDown = null;
    }

    try { renderer.domElement.releasePointerCapture(event.pointerId); } catch (_) {}
    updateCursor(event);
}

renderer.domElement.addEventListener('pointerup', finishPointer);
renderer.domElement.addEventListener('pointercancel', finishPointer);
renderer.domElement.addEventListener('pointerleave', () => {
    pointer.set(1e6, 1e6);
    requestRender();
});
renderer.domElement.addEventListener('click', (event) => {
    if (editorState.mode !== 'camera' || cameraIsDragging) return;
    if(featureModeEl.value==='region')return;
    if(featureModeEl.value!=='off' && !inspectorState.measuring) {
        const r=renderer.domElement.getBoundingClientRect();
        featurePick((event.clientX-r.left)/r.width,(event.clientY-r.top)/r.height,featureModeEl.value,true);return;
    }
    setPointerFromEvent(event);
    raycaster.setFromCamera(pointer, pointerCamera || camera);
    const meshes = interactiveObjects.filter(entryInPointerPanel).flatMap((entry) => entry.meshes).filter(mesh => mesh.visible);

    const hits = raycaster.intersectObjects(meshes, false);
    if (!hits.length) return;
    const hitObject = hits[0].object;
    const owner = interactiveObjects.find((entry) => entry.meshes.includes(hitObject)) || null;
    // Interactive entries do not carry a part id. Use the drawable slot that
    // owns the hit mesh, so a click produces an artifact-restorable selection.
    const part = payloadGeometrySlots.drawables.find(slot => slot.object === hitObject);
    inspectorState.selection=null;
    inspectorState.selectedPart = featureSources().find(s=>s.slot.object===hitObject)?.id || part?.partId || null;
    inspectorState.selectedTriangle = part && hitObject.isMesh ? (hits[0].faceIndex ?? null) : null;

    // The measure tool takes the click instead of the server callback: while you are measuring, a click
    // is a pick, not a `fline-click`. Two picks make a dimension, and a third starts over — the same
    // rhythm as every CAD measure tool, and the reason it is a *tool* rather than a modifier key.
    if (inspectorState.measuring) {
        const element = inspectorElementFromHit(owner, hits[0]);
        if (inspectorState.picked.length >= 2) inspectorState.picked = [];
        inspectorState.picked.push(element);
        inspectorRebuildOverlay();
        return;
    }

    if (owner && owner.callbackId) {
        if (owner.surface) {
            const record = surfaceIntersectionForHit(owner, hits[0]);
            if (record) sendMessage({ type: 'three-surface-click', callbackId: owner.callbackId, ...record });
        } else {
            sendMessage({ type: 'fline-click', callbackId: owner.callbackId, ...intersectionForHit(owner, hits[0]) });
        }
    }
});

/**
 * Tell the host how big this figure wants to be.
 *
 * The box output panel sizes itself to its content, and for an iframe it learns that size from an
 * `afield-iframe-size` event dispatched on the frame element (`outputareas2.js`,
 * `bindContentLoadEvents`). Other embedded viewers get this from `/iframe_autosize.js`; this one
 * cannot use it, because measuring a body that is `height: 100%` inside `overflow: hidden` only ever
 * reports back the size it already has. So the size travels in the payload instead and is republished
 * here verbatim.
 *
 * Silent when the payload does not carry one, which is every payload that predates it — so an FLine
 * viewer keeps filling its column exactly as before.
 */
function publishFrameSize(payload) {
    const width = Number(payload.frameWidth) || 0;
    const height = Number(payload.frameHeight) || 0;
    if (width <= 0 && height <= 0) return;
    const frame = window.frameElement;
    if (!frame) return;
    if (width > 0) frame.dataset.afieldIntrinsicWidth = String(width);
    if (height > 0) frame.dataset.afieldIntrinsicHeight = String(height);
    frame.dispatchEvent(new CustomEvent('afield-iframe-size', {
        detail: { width: width, height: height, reason: 'three/geometry', changed: true }
    }));
}

/**
 * Take the payload's panels and build a camera for each.
 *
 * A scene with no panels, or with one, keeps the single full-bleed camera and every behaviour the
 * viewer had before panels existed — this is a no-op for every FLine payload.
 */
function applyScenePanels(payload) {
    const panels = Array.isArray(payload.panels) ? payload.panels : [];
    const columns = Math.max(1, payload.columns || 1);
    // Geometry/selection updates must not consume the remaining orbit or zoom range.
    const sameLayout = panels.length > 1 && panels.length === panelState.panels.length && columns === panelState.columns;
    const orbitBase = sameLayout ? panelState.base : null;
    panelState.panels = panels;
    panelState.columns = columns;
    panelState.cameras = [];
    panelState.base = orbitBase;
    clearPanelLabels();

    // The scene-wide "N ln | N tri | N p" HUD sits top-right, which is exactly where a tiled layout
    // puts its last column's title — they overlapped, and both became unreadable. In a contact sheet
    // the per-panel chrome is the honest place for counts anyway, so the global one steps aside.
    document.getElementById('hud').classList.toggle('hidden', panels.length > 1);

    if (panels.length <= 1) {
        // One panel still carries chrome (a title, a caption, the fact line); it just does not carry
        // a viewport of its own.
        if (panels.length === 1) renderPanelChrome(panels, 1, false);
        return;
    }

    panels.forEach((p, index) => {
        const vp = panelViewport(index, panels.length);
        const cam = new THREE.PerspectiveCamera(45, vp.h > 0 ? vp.w / vp.h : 1, 0.01, 10000);
        const bounds = p.bounds || payload.bounds;
        if (bounds) applyCameraSpec(cam, p.camera || {}, bounds, true, fitPointsForPanel(index));
        panelState.cameras.push({
            camera: cam, spec: p.camera || {}, bounds: bounds, fitPoints: fitPointsForPanel(index)
        });
    });

    // The orbit delta every panel is offset from is captured on the FIRST FRAME, not here.
    //
    // `applyGeometry` runs `frameBounds` after this, which moves the main camera to frame the whole
    // scene — so a baseline taken now is the distance from before that move. The zoom ratio derived
    // from it is then wrong by however much framing changed, which is ~1 for unit-scale geometry and
    // enormous for anything else: extruded glyphs at extent 300 came out as dots, having been pushed
    // back a hundredfold, while spheres of radius 1 looked perfectly fine and hid the bug.
    // Existing layouts retain their baseline; only new layouts capture one on the first frame.
    renderPanelChrome(panels, panels.length, true);
}

/** Panel titles/captions live in the DOM over the canvas, not in the WebGL scene. */
function clearPanelLabels() {
    const old = document.getElementById('panel-chrome');
    if (old) old.remove();
    container.classList.remove('chrome-top', 'chrome-bottom', 'chrome-bottom-2');
}

function textCell(className, text) {
    const el = document.createElement('div');
    el.className = className;
    el.textContent = text;
    return el;
}

function renderPanelChrome(panels, count, tiled) {
    clearPanelLabels();
    if (!panels.some((p) => p && (p.title || p.caption || p.facts))) return;
    const host = document.createElement('div');
    host.id = 'panel-chrome';

    if (tiled) {
        host.classList.add('tiled');
        host.style.gridTemplateColumns = 'repeat(' + panelState.columns + ', minmax(0, 1fr))';
        panels.forEach((p) => {
            const cell = document.createElement('div');
            cell.className = 'panel-cell';
            if (p && p.title) cell.appendChild(textCell('panel-title', p.title));
            if (p && p.facts) cell.appendChild(textCell('panel-facts', p.facts));
            if (p && p.caption) cell.appendChild(textCell('panel-caption', p.caption));
            host.appendChild(cell);
        });
        document.body.appendChild(host);
        return;
    }

    // One panel: a band above and a band below, with the canvas inset to match, rather than an
    // overlay across the middle of the geometry.
    const p = panels[0] || {};
    host.classList.add('solo');
    const top = document.createElement('div');
    top.className = 'panel-cell';
    if (p.title) top.appendChild(textCell('panel-title', p.title));
    const bottom = document.createElement('div');
    bottom.className = 'panel-cell';
    if (p.facts) bottom.appendChild(textCell('panel-facts', p.facts));
    if (p.caption) bottom.appendChild(textCell('panel-caption', p.caption));
    host.appendChild(top);
    host.appendChild(bottom);
    document.body.appendChild(host);

    if (p.title) container.classList.add('chrome-top');
    const belowLines = (p.facts ? 1 : 0) + (p.caption ? 1 : 0);
    if (belowLines === 1) container.classList.add('chrome-bottom');
    else if (belowLines >= 2) container.classList.add('chrome-bottom-2');
    // The canvas just changed size, so the renderer and the camera aspect have to follow it.
    onResize();
}

/**
 * Reserved at the top of every tiled cell for its title and fact line.
 *
 * The chrome is a DOM overlay, so nothing stops the geometry being drawn underneath it — and once the
 * camera fits the mesh properly, it is drawn right up to the cell edge and the two collide. Taking the
 * band out of the *viewport* rather than nudging the camera keeps the fit honest: the mesh fills the
 * space it is actually given.
 */
const PANEL_CHROME_TOP_PX = 42;

/** The pixel rectangle panel [index] occupies, in CSS pixels with y measured from the bottom. */
function panelViewport(index, count) {
    const cols = Math.min(panelState.columns, count);
    const rows = Math.ceil(count / cols);
    const w = container.clientWidth / cols;
    const h = container.clientHeight / rows;
    const col = index % cols;
    const row = Math.floor(index / cols);
    // The band comes off the top of the cell; y is the cell's *bottom* edge, so it does not move.
    const inset = Math.min(PANEL_CHROME_TOP_PX, Math.max(0, h - 40));
    // WebGL's origin is bottom-left; the grid reads top-down, so the row is flipped.
    return { x: col * w, y: (rows - 1 - row) * h, w: w, h: h - inset };
}

/** Every panel's camera, re-derived from its own spec plus the shared orbit delta. */
function updatePanelCameras() {
    if (!panelState.cameras.length) return;
    if (!panelState.base) {
        panelState.base = {
            azimuth: controls.getAzimuthalAngle(),
            polar: controls.getPolarAngle(),
            distance: controls.getDistance()
        };
    }
    const dAzimuth = (controls.getAzimuthalAngle() - panelState.base.azimuth) * 180 / Math.PI;
    const dPolar = (controls.getPolarAngle() - panelState.base.polar) * 180 / Math.PI;
    const zoom = panelState.base.distance > 1e-9 ? controls.getDistance() / panelState.base.distance : 1;
    const count = panelState.cameras.length;
    panelState.cameras.forEach((entry, index) => {
        if (!entry.bounds) return;
        const spec = entry.spec || {};
        const vp = panelViewport(index, count);
        entry.camera.aspect = vp.h > 0 ? vp.w / vp.h : 1;
        applyCameraSpec(entry.camera, {
            // Dragging right raises the azimuth, which should turn the model the same way it turns
            // the single-panel camera — hence the plain addition rather than a subtraction.
            yawDegrees: (spec.yawDegrees || 0) + dAzimuth,
            // Polar is measured from +y down, so a positive polar delta is a *lower* pitch.
            pitchDegrees: (spec.pitchDegrees || 0) - dPolar,
            distance: spec.distance === undefined ? 2.7 : spec.distance,
            fieldOfViewDegrees: spec.fieldOfViewDegrees
        }, entry.bounds, true, entry.fitPoints);
        // Fit establishes the reference framing. Dolly afterwards so fitting cannot undo zoom.
        const focus = new THREE.Vector3(...entry.bounds.min).add(new THREE.Vector3(...entry.bounds.max)).multiplyScalar(0.5);
        entry.camera.position.sub(focus).multiplyScalar(zoom).add(focus);
        const distance = entry.camera.position.distanceTo(focus);
        entry.camera.near = Math.max(1e-5, distance * 0.01);
        entry.camera.far = Math.max(distance * 100, entry.camera.near + 1);
        entry.camera.updateProjectionMatrix();
    });
}

function inspectorDrawableVisible(slot, ordinal) {
    return !inspectorState.hidden.has(inspectorState.spec?.parts?.[slot.partId] ? slot.partId : `drawable:${ordinal}`);
}
/** Show only the drawables belonging to panel [index]; `panel === -1` means every panel. */
function setPanelVisibility(index) {
    payloadGeometrySlots.drawables.forEach((slot, ordinal) => {
        if (!slot || !slot.object) return;
        slot.object.visible = inspectorDrawableVisible(slot, ordinal) && (slot.panel === -1 || slot.panel === index);
    });
}

function onResize() {
    requestRender();
    const width = container.clientWidth;
    const height = container.clientHeight;
    renderer.setPixelRatio(getDpr());
    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    // A camera that was fitted to the frame has to be refitted when the frame changes shape —
    // including the resize the chrome bands trigger, which happens once on every mesh payload.
    if (!inspectorState.selection && payloadState && payloadState.camera && payloadState.bounds && panelState.cameras.length <= 1) {
        applyCameraSpec(camera, payloadState.camera, payloadState.bounds, true, fitPointsForPanel(-1));
        const derived = cameraPresetEye(payloadState.camera, payloadState.bounds);
        controls.target.set(derived.target[0], derived.target[1], derived.target[2]);
        controls.update();
    }
    if (pointMaterial && pointMaterial.uniforms) pointMaterial.uniforms.uPixelRatio.value = getDpr();
    if (editorState.marquee) showMarquee(editorState.marquee);
    if(inspectorState.selection?.region)featureRectangleBox(inspectorState.selection.region);
}
window.addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(container);

/** X-ray is presentation only. Leave source materials and the picking depth pass intact.
 * Fills fade; edges gain a little opacity and point sprites keep their authored contrast. No cloned geometry,
 * additional animation loop or permanently mutated material is needed.
 */
function renderGeometry(viewCamera) {
    if (!xrayState.enabled) { renderer.render(scene, viewCamera); return; }
    const saved = new Map(), edgeUniforms = new Map(), edgeOrder = new Map();
    baseGeometryRoot.traverse(object => {
        if (!object.isMesh && !object.isLine) return;
        // Ghosted faces must not wash out an otherwise fully opaque geometric edge.
        if (object.isLine) { edgeOrder.set(object, object.renderOrder); object.renderOrder = Math.max(1, object.renderOrder); }
        for (const material of (Array.isArray(object.material) ? object.material : [object.material])) {
            if (!material || saved.has(material)) continue;
            if (object.isMesh) {
                saved.set(material, {opacity:material.opacity, depthWrite:material.depthWrite});
                material.opacity *= xrayState.opacity;
                material.depthWrite = false;
            } else if (material.uniforms?.uXrayEdgeStrength) {
                const uniform = material.uniforms.uXrayEdgeStrength;
                if (!edgeUniforms.has(uniform)) { edgeUniforms.set(uniform, uniform.value); uniform.value = 1.6; }
            } else if (material.isLineBasicMaterial) {
                saved.set(material, {opacity:material.opacity});
                material.opacity = Math.min(1, material.opacity * 1.6);
            }
        }
    });
    try { renderer.render(scene, viewCamera); }
    finally {
        for (const [material, original] of saved) Object.assign(material, original);
        for (const [uniform, value] of edgeUniforms) uniform.value = value;
        for (const [object, order] of edgeOrder) object.renderOrder = order;
    }
}

function render() {
    controls.update();
    const interactivePointer = editorState.mode === 'camera' ? updateInteractiveHover() : false;
    if (editorState.mode === 'camera') renderer.domElement.style.cursor = interactivePointer ? 'pointer' : '';

    const count = panelState.cameras.length;
    if (count > 1) {
        updatePanelCameras();
        renderer.setScissorTest(true);
        for (let i = 0; i < count; i += 1) {
            const vp = panelViewport(i, count);
            renderer.setViewport(vp.x, vp.y, vp.w, vp.h);
            renderer.setScissor(vp.x, vp.y, vp.w, vp.h);
            setPanelVisibility(i);
            renderGeometry(panelState.cameras[i].camera);
        }
        renderer.setScissorTest(false);
        // Leave every drawable visible, so a payload that drops back to one panel is not left with
        // most of its geometry switched off.
        payloadGeometrySlots.drawables.forEach((slot, ordinal) => {
            if (slot && slot.object) slot.object.visible = inspectorDrawableVisible(slot, ordinal);
        });
    } else {
        renderer.setViewport(0, 0, container.clientWidth, container.clientHeight);
        renderGeometry(camera);
    }
}

// Capture also covers editor/inspector handlers that stop propagation. The queued
// paint runs after they have updated geometry, selection, clipping or hover state.
for (const type of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'wheel', 'click', 'keydown', 'input', 'change']) {
    document.addEventListener(type, requestRender, { capture: true, passive: true });
}
renderer.domElement.addEventListener('pointerleave', () => {
    pointer.set(2, 2);
    requestRender();
});

connectWs();
requestRender();
</script>
</body>
</html>
