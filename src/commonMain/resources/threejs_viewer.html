<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Three.js Geometry Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @import url("/iosevka.css");

        :root {
            --bg: #0f0f10;
            --ink: #e8f0fb;
            --muted: rgba(232, 240, 251, 0.65);
            --accent: #62d7ff;
            --border: rgba(255, 255, 255, 0.08);
            --selection: rgba(255, 211, 92, 0.95);
            --selection-soft: rgba(255, 211, 92, 0.22);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: "Iosevka Web", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 300;
            color: var(--ink);
            background: var(--bg);
        }

        #canvas-wrap {
            position: absolute;
            inset: 0;
        }

        #canvas-wrap canvas:focus,
        #canvas-wrap canvas:focus-visible {
            outline: none;
        }

        #hud {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            z-index: 10;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            pointer-events: none;
        }

        #hud-left,
        #hud-right {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        #hud-right {
            margin-left: auto;
            flex-direction: column;
            align-items: flex-end;
        }

        .hud-group {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px;
            border-radius: 6px;
            border: 1px solid rgba(98, 215, 255, 0.16);
            background: transparent;
            pointer-events: auto;
        }

        .hud-button {
            appearance: none;
            border: 1px solid rgba(98, 215, 255, 0.16);
            border-radius: 5px;
            background: transparent;
            color: #a7dfff;
            font: inherit;
            height: 22px;
            min-width: 22px;
            padding: 0 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .hud-button.is-icon {
            width: 22px;
            padding: 0;
        }

        .hud-button.is-active {
            color: #071015;
            background: var(--accent);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .hud-button svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.6;
        }

        .hud-label,
        .meta,
        .selection-status {
            font-size: 11px;
            color: var(--muted);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            text-align: right;
        }

        .meta b {
            color: var(--ink);
            font-weight: 700;
        }

        .meta span {
            font-weight: 100;
            letter-spacing: 0.04em;
        }

        .hidden {
            display: none !important;
        }

        .selection-status.is-empty {
            visibility: hidden;
        }

        /* The inspector's three controls. Deliberately the same visual language as the edit tools:
           the point of this pane is that measuring, sectioning and exploding are the same *kind* of
           thing as selecting a vertex, not a separate mode you have to go somewhere else for. */
        .hud-slider {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 0 6px;
            font-size: 10px;
            letter-spacing: 0.06em;
            color: var(--muted);
            white-space: nowrap;
        }

        .hud-slider input[type="range"] {
            width: 84px;
            height: 14px;
            accent-color: var(--accent);
            background: transparent;
            cursor: ew-resize;
        }

        .hud-slider b {
            color: var(--ink);
            font-weight: 400;
            min-width: 34px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        #inspector-status {
            font-size: 11px;
            color: var(--selection);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            text-align: right;
        }

        #marquee {
            position: absolute;
            z-index: 9;
            border: 1px dashed rgba(98, 215, 255, 0.86);
            background: rgba(98, 215, 255, 0.1);
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="marquee"></div>
<div id="hud">
    <div id="hud-left">
        <div class="hud-group hidden" id="mode-group" aria-label="Three.js viewer tools">
            <button type="button" class="hud-button is-icon is-active" data-mode="camera" aria-label="Camera tool" title="Camera tool">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M3 5.2h2.1l1-1.4h3.8l1 1.4H13a1.2 1.2 0 0 1 1.2 1.2v4.4A1.2 1.2 0 0 1 13 12H3a1.2 1.2 0 0 1-1.2-1.2V6.4A1.2 1.2 0 0 1 3 5.2Z"></path>
                    <circle cx="8" cy="8.5" r="2.2"></circle>
                </svg>
            </button>
            <button type="button" class="hud-button is-icon" data-mode="edit" aria-label="Edit tool" title="Edit tool">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M3 11.8 2.6 13.4 4.2 13l6.7-6.7-1.2-1.2L3 11.8Z"></path>
                    <path d="M8.9 4.9 10.1 3.7a1.1 1.1 0 0 1 1.6 0l.6.6a1.1 1.1 0 0 1 0 1.6l-1.2 1.2"></path>
                </svg>
            </button>
        </div>
        <div class="hud-group hidden" id="mask-group" aria-label="Selection masks">
            <button type="button" class="hud-button is-icon is-active" data-mask="point" aria-label="Toggle vertex selection" title="Vertex selection">
                <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.4"></circle></svg>
            </button>
            <button type="button" class="hud-button is-icon is-active" data-mask="edge" aria-label="Toggle edge selection" title="Edge selection">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 12.5 L13.5 3.5"></path></svg>
            </button>
            <button type="button" class="hud-button is-icon is-active" data-mask="face" aria-label="Toggle fill selection" title="Fill selection">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.4 L13.2 12.6 L2.8 12.6 Z"></path></svg>
            </button>
        </div>
        <div class="hud-group hidden" id="inspector-group" aria-label="Inspector tools">
            <button type="button" class="hud-button is-icon" data-inspector="measure" aria-label="Measure between two elements" title="Measure: click two elements">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M1.8 9.6 6.4 5l7.8 7.8-4.6 4.6z" transform="translate(0,-2.6)"></path>
                    <path d="M4.4 6.2 5.6 7.4M6.6 4 7.8 5.2M8.8 6.2 10 7.4"></path>
                </svg>
            </button>
            <button type="button" class="hud-button is-icon" data-inspector="section" aria-label="Section" title="Section: cut the figure">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M2.2 4.4h11.6L11 11.6H4.8z"></path>
                    <path d="M1 8h14"></path>
                </svg>
            </button>
            <span class="hud-slider hidden" id="section-slider-wrap">
                <input type="range" id="section-slider" min="0" max="1000" value="500" aria-label="Section position">
            </span>
            <span class="hud-slider" id="explode-slider-wrap">
                <span>explode</span>
                <input type="range" id="explode-slider" min="0" max="1000" value="0" aria-label="Explode amount">
                <b id="explode-readout">0</b>
            </span>
        </div>
    </div>
    <div id="hud-right">
        <div id="inspector-status"></div>
        <div class="selection-status is-empty hidden" id="selection-status"></div>
        <div class="meta" id="meta">waiting for data...</div>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('canvas-wrap');
const marqueeEl = document.getElementById('marquee');
const metaEl = document.getElementById('meta');
const selectionStatusEl = document.getElementById('selection-status');
const modeGroupEl = document.getElementById('mode-group');
const maskGroupEl = document.getElementById('mask-group');
const urlParams = new URLSearchParams(window.location.search);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
function getDpr() {
    const override = parseFloat(urlParams.get('dpr'));
    if (Number.isFinite(override) && override > 0) return override;
    return Math.max(2, window.devicePixelRatio || 1);
}
renderer.setPixelRatio(getDpr());
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.style.width = '100%';
renderer.domElement.style.height = '100%';
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 10000);
camera.position.set(1.4, 1.2, 2.3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.9;
controls.panSpeed = 0.6;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const keyLight = new THREE.DirectionalLight(0xffffff, 0.7);
keyLight.position.set(5, 8, 6);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x88ccff, 0.3);
rimLight.position.set(-6, -3, 4);
scene.add(rimLight);

const grid = new THREE.GridHelper(10, 20, 0x3a4d66, 0x273447);
grid.rotation.x = Math.PI / 2;
if (Array.isArray(grid.material)) {
    grid.material.forEach((mat) => {
        mat.opacity = 0.55;
        mat.transparent = true;
    });
} else {
    grid.material.opacity = 0.55;
    grid.material.transparent = true;
}
scene.add(grid);

const axes = new THREE.AxesHelper(0.9);
axes.material.depthTest = false;
axes.renderOrder = 1;
scene.add(axes);

const baseGeometryRoot = new THREE.Group();
const editorOverlayRoot = new THREE.Group();
scene.add(baseGeometryRoot);
scene.add(editorOverlayRoot);

let pointMaterial = null;
let interactiveObjects = [];
let editableHitObjects = [];
let payloadState = { editable: null };
const payloadGeometrySlots = {
    lines: null,
    fills: null,
    points: null,
    interactive: []
};
const editableGeometrySlots = {
    lines: [],
    points: [],
    faces: []
};
let cameraPointerDown = null;
let cameraIsDragging = false;
let hasFramedInitialGeometry = false;

const raycaster = new THREE.Raycaster();
raycaster.params.Line = { threshold: 0.06 };
raycaster.params.Points = { threshold: 1.5 };

const pointer = new THREE.Vector2();
const DRAG_THRESHOLD_PX = 4;
const HANDLE_ANCHOR_SIZE_PX = 8;
const HANDLE_CONTROL_SIZE_PX = 7;
const HANDLE_SELECTED_BONUS_PX = 2;
const HANDLE_HIT_RADIUS_PX = 9;

const editorState = {
    mode: 'camera',
    uiVisible: true,
    scene: null,
    selection: new Set(),
    mask: { point: true, edge: true, face: true },
    items: new Map(),
    points: [],
    edges: [],
    faces: [],
    pointerDown: null,
    dragging: null,
    marquee: null
};

function vec3FromArray(value) {
    return new THREE.Vector3(value[0], value[1], value[2]);
}

function arrayFromVec3(value) {
    return [value.x, value.y, value.z];
}

// [viewer-region cubic-sampling] BEGIN
//
// The second liftable region (see the `planar-tessellation` sentinels below for what that means):
// executed on GraalJS by `ViewerJavaScript.kt` and compared against `FLine.uniform_linearize_cubic`
// by `ThreeJsViewerCubicSamplingParityTest`. The two are *deliberately* separate implementations —
// `dev_docs/fline_fill_orientation.md` records the standing decision not to unify the independent
// flatteners — so the job of a test here is to pin that they agree, not to merge them.
//
// EDGE_SAMPLES lives here, rather than up with the interaction constants, because it is this
// region's only parameter and the region has to be liftable on its own. Moving a module-scope
// `const` is behaviour-neutral: its only reader is the default argument of `sampleCubic`, evaluated
// per call, long after the module has finished loading.
const EDGE_SAMPLES = 24;

function cubicPoint(a, c1, c2, b, t) {
    const mt = 1 - t;
    const mt2 = mt * mt;
    const t2 = t * t;
    return [
        (mt2 * mt * a[0]) + (3 * mt2 * t * c1[0]) + (3 * mt * t2 * c2[0]) + (t2 * t * b[0]),
        (mt2 * mt * a[1]) + (3 * mt2 * t * c1[1]) + (3 * mt * t2 * c2[1]) + (t2 * t * b[1]),
        (mt2 * mt * a[2]) + (3 * mt2 * t * c1[2]) + (3 * mt * t2 * c2[2]) + (t2 * t * b[2])
    ];
}

function sampleCubic(a, c1, c2, b, count = EDGE_SAMPLES) {
    const out = [];
    for (let i = 0; i <= count; i += 1) {
        out.push(cubicPoint(a, c1, c2, b, i / count));
    }
    return out;
}

// [viewer-region cubic-sampling] END

function pointRef(lineIndex, nodeIndex, handle) {
    return { lineIndex, nodeIndex, handle };
}

function pointRefKey(ref) {
    return `${ref.lineIndex}:${ref.nodeIndex}:${ref.handle}`;
}

function itemKey(kind, parts) {
    return `${kind}:${parts.join(':')}`;
}

function cloneRef(ref) {
    return { lineIndex: ref.lineIndex, nodeIndex: ref.nodeIndex, handle: ref.handle };
}

function uniqueRefs(refs) {
    const seen = new Set();
    const out = [];
    refs.forEach((ref) => {
        const key = pointRefKey(ref);
        if (!seen.has(key)) {
            seen.add(key);
            out.push(cloneRef(ref));
        }
    });
    return out;
}

function getNodePoint(node, handle) {
    if (handle === 'TO') return node.to;
    if (handle === 'C1') return node.c1;
    if (handle === 'C2') return node.c2;
    return null;
}

function resolveRefPoint(sceneData, ref) {
    const line = sceneData.lines[ref.lineIndex];
    if (!line) return null;
    const node = line.nodes[ref.nodeIndex];
    if (!node) return null;
    return getNodePoint(node, ref.handle);
}

function translatePointRefs(sceneData, refs, dx, dy, dz) {
    uniqueRefs(refs).forEach((ref) => {
        const point = resolveRefPoint(sceneData, ref);
        if (!point) return;
        point[0] += dx;
        point[1] += dy;
        point[2] += dz;
    });
}

function buildEditorItems(sceneData) {
    const items = new Map();
    const points = [];
    const edges = [];
    const faces = [];

    sceneData.lines.forEach((line) => {
        const pieces = [];
        let currentPiece = null;
        let previousAnchor = null;
        let firstAnchor = null;
        let previousAnchorPoint = null;

        function ensurePiece() {
            if (!currentPiece) {
                currentPiece = {
                    lineIndex: line.lineIndex,
                    pieceIndex: pieces.length,
                    nodeIndices: [],
                    pointRefs: [],
                    boundary: [],
                    closed: false
                };
                pieces.push(currentPiece);
            }
            return currentPiece;
        }

        function addPointItem(node, handle, role, point) {
            const ref = pointRef(line.lineIndex, node.nodeIndex, handle);
            const key = itemKey('point', [line.lineIndex, node.nodeIndex, handle]);
            const item = {
                kind: 'point',
                key,
                pointRefs: [ref],
                x: point[0],
                y: point[1],
                z: point[2],
                role
            };
            items.set(key, item);
            points.push(item);
            return ref;
        }

        function addAnchor(node, point) {
            const piece = ensurePiece();
            const ref = addPointItem(node, 'TO', 'anchor', point);
            piece.pointRefs.push(ref);
            piece.boundary.push(point.slice());
            if (!firstAnchor) firstAnchor = ref;
            previousAnchor = ref;
            previousAnchorPoint = point;
            return ref;
        }

        line.nodes.forEach((node) => {
            if (node.kind === 'move') {
                currentPiece = null;
                previousAnchor = null;
                firstAnchor = null;
                previousAnchorPoint = null;
                const movePiece = ensurePiece();
                movePiece.nodeIndices.push(node.nodeIndex);
                addAnchor(node, node.to);
                return;
            }

            if (node.kind === 'line') {
                const linePiece = ensurePiece();
                linePiece.nodeIndices.push(node.nodeIndex);
                const previousForLine = previousAnchor ? cloneRef(previousAnchor) : null;
                const startPoint = previousAnchorPoint ? previousAnchorPoint.slice() : null;
                const nextAnchor = addAnchor(node, node.to);
                if (previousForLine && startPoint) {
                    const edgeItem = {
                        kind: 'edge',
                        key: itemKey('edge', [line.lineIndex, linePiece.pieceIndex, linePiece.nodeIndices.length]),
                        pointRefs: [cloneRef(previousForLine), cloneRef(nextAnchor)],
                        points: [startPoint, node.to.slice()],
                        lineIndex: line.lineIndex
                    };
                    items.set(edgeItem.key, edgeItem);
                    edges.push(edgeItem);
                }
                previousAnchor = nextAnchor;
                previousAnchorPoint = node.to;
                return;
            }

            if (node.kind === 'cubic') {
                const cubicPiece = ensurePiece();
                cubicPiece.nodeIndices.push(node.nodeIndex);
                const previousForCubic = previousAnchor ? cloneRef(previousAnchor) : null;
                const startPoint = previousAnchorPoint ? previousAnchorPoint.slice() : null;
                const c1Ref = addPointItem(node, 'C1', 'control', node.c1);
                const c2Ref = addPointItem(node, 'C2', 'control', node.c2);
                cubicPiece.pointRefs.push(c1Ref, c2Ref);
                const endRef = addAnchor(node, node.to);
                if (previousForCubic && startPoint) {
                    const samples = sampleCubic(startPoint, node.c1, node.c2, node.to);
                    for (let i = 1; i < samples.length; i += 1) {
                        cubicPiece.boundary.push(samples[i].slice());
                    }
                    const edgeItem = {
                        kind: 'edge',
                        key: itemKey('edge', [line.lineIndex, cubicPiece.pieceIndex, cubicPiece.nodeIndices.length]),
                        pointRefs: [cloneRef(previousForCubic), cloneRef(c1Ref), cloneRef(c2Ref), cloneRef(endRef)],
                        points: samples,
                        lineIndex: line.lineIndex
                    };
                    items.set(edgeItem.key, edgeItem);
                    edges.push(edgeItem);
                }
                previousAnchor = endRef;
                previousAnchorPoint = node.to;
                return;
            }

            if (node.kind === 'close') {
                const closePiece = ensurePiece();
                closePiece.nodeIndices.push(node.nodeIndex);
                closePiece.closed = true;
                if (previousAnchor && firstAnchor && previousAnchorPoint) {
                    const firstPoint = resolveRefPoint(sceneData, firstAnchor);
                    if (firstPoint) {
                        const closeEdge = {
                            kind: 'edge',
                            key: itemKey('edge', [line.lineIndex, closePiece.pieceIndex, closePiece.nodeIndices.length]),
                            pointRefs: [cloneRef(previousAnchor), cloneRef(firstAnchor)],
                            points: [previousAnchorPoint.slice(), firstPoint.slice()],
                            lineIndex: line.lineIndex
                        };
                        items.set(closeEdge.key, closeEdge);
                        edges.push(closeEdge);
                    }
                }
                currentPiece = null;
                previousAnchor = null;
                firstAnchor = null;
                previousAnchorPoint = null;
            }
        });

        pieces.forEach((piece) => {
            if ((!piece.closed && !line.filled) || piece.boundary.length < 3) return;
            const faceItem = {
                kind: 'face',
                key: itemKey('face', [line.lineIndex, piece.pieceIndex]),
                pointRefs: uniqueRefs(piece.pointRefs),
                boundary: piece.boundary.map((point) => point.slice()),
                lineIndex: line.lineIndex
            };
            items.set(faceItem.key, faceItem);
            faces.push(faceItem);
        });
    });

    return { items, points, edges, faces };
}

function selectedItems(state) {
    return Array.from(state.selection).map((key) => state.items.get(key)).filter(Boolean);
}

function selectionRefs(state) {
    const refs = [];
    selectedItems(state).forEach((item) => refs.push(...(item.pointRefs || [])));
    return uniqueRefs(refs);
}

function updateSelectionStatus() {
    if (editorState.mode !== 'edit' || !editorState.scene || !editorState.uiVisible) {
        selectionStatusEl.classList.add('hidden');
        return;
    }
    const counts = { point: 0, edge: 0, face: 0 };
    selectedItems(editorState).forEach((item) => {
        counts[item.kind] = (counts[item.kind] || 0) + 1;
    });
    const parts = [];
    if (counts.point) parts.push(`${counts.point} point${counts.point === 1 ? '' : 's'}`);
    if (counts.edge) parts.push(`${counts.edge} edge${counts.edge === 1 ? '' : 's'}`);
    if (counts.face) parts.push(`${counts.face} face${counts.face === 1 ? '' : 's'}`);
    selectionStatusEl.classList.remove('hidden');
    if (parts.length) {
        selectionStatusEl.textContent = parts.join(' | ');
        selectionStatusEl.classList.remove('is-empty');
    } else {
        selectionStatusEl.textContent = '';
        selectionStatusEl.classList.add('is-empty');
    }
}

function applySelection(keys, additive) {
    const next = additive ? new Set(editorState.selection) : new Set();
    keys.forEach((key) => next.add(key));
    editorState.selection = next;
    rebuildEditableView();
}

function toggleSelection(key) {
    const next = new Set(editorState.selection);
    if (next.has(key)) next.delete(key);
    else next.add(key);
    editorState.selection = next;
    rebuildEditableView();
}

function updateMeta(meta) {
    if (!meta) {
        metaEl.textContent = 'no geometry';
        return;
    }
    metaEl.innerHTML = `<b>${meta.lineSegments}</b><span> ln</span> | <b>${meta.triangles}</b><span> tri</span> | <b>${meta.points}</b><span> p</span>`;
}

function disposeObject(obj) {
    obj.traverse((child) => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
            if (Array.isArray(child.material)) child.material.forEach((mat) => mat.dispose());
            else child.material.dispose();
        }
    });
}

function clearGroup(group) {
    group.children.forEach((child) => disposeObject(child));
    group.clear();
}

function typedArrayCtor(type) {
    if (type === 'Uint8Array') return Uint8Array;
    if (type === 'Uint16Array') return Uint16Array;
    if (type === 'Uint32Array') return Uint32Array;
    if (type === 'Int8Array') return Int8Array;
    if (type === 'Int16Array') return Int16Array;
    if (type === 'Int32Array') return Int32Array;
    if (type === 'Float64Array') return Float64Array;
    return Float32Array;
}

function typedArrayFromSpec(spec, fallbackType = 'Float32Array') {
    const Ctor = typedArrayCtor(spec?.type || fallbackType);
    return spec?.array instanceof Ctor ? spec.array : new Ctor(spec?.array || []);
}

function makeDynamicAttribute(spec, fallbackType = 'Float32Array') {
    const attribute = new THREE.BufferAttribute(
        typedArrayFromSpec(spec, fallbackType),
        spec.itemSize,
        !!spec.normalized
    );
    attribute.setUsage(THREE.DynamicDrawUsage);
    return attribute;
}

function markAttributeUpdated(attribute, count) {
    if (attribute.updateRange) {
        attribute.updateRange.offset = 0;
        attribute.updateRange.count = count;
    }
    attribute.needsUpdate = true;
}

function attributeSpec(itemSize, array, type = 'Float32Array', normalized = false) {
    return { itemSize, array, type, normalized };
}

function cloneGeometryDataWithDefaults(data, defaults = {}) {
    if (!data || !data.attributes || !data.attributes.position) return null;
    const attributes = { ...data.attributes };
    const vertexCount = Math.floor(attributes.position.array.length / attributes.position.itemSize);
    Object.entries(defaults).forEach(([name, spec]) => {
        if (attributes[name]) return;
        const itemSize = spec.itemSize || 1;
        const array = new Array(vertexCount * itemSize);
        for (let i = 0; i < vertexCount; i += 1) {
            for (let c = 0; c < itemSize; c += 1) {
                const fill = Array.isArray(spec.fill) ? spec.fill[Math.min(c, spec.fill.length - 1)] : spec.fill;
                array[i * itemSize + c] = fill;
            }
        }
        attributes[name] = attributeSpec(itemSize, array, spec.type || 'Float32Array', !!spec.normalized);
    });
    return { ...data, attributes };
}

function buildGeometry(data) {
    if (!data || !data.attributes || !data.attributes.position) return null;
    const geometry = new THREE.BufferGeometry();
    Object.entries(data.attributes).forEach(([name, spec]) => {
        geometry.setAttribute(name, makeDynamicAttribute(spec));
    });
    if (data.index && data.index.array && data.index.array.length) {
        const index = new THREE.BufferAttribute(typedArrayFromSpec(data.index, 'Uint32Array'), 1);
        index.setUsage(THREE.DynamicDrawUsage);
        geometry.setIndex(index);
    }
    const position = geometry.getAttribute('position');
    const count = data.index?.array?.length || position.count;
    geometry.setDrawRange(0, count);
    geometry.computeBoundingSphere();
    return geometry;
}

function canUpdateGeometryInPlace(geometry, data, allowExtraAttributes = []) {
    if (!geometry || !data || !data.attributes || !data.attributes.position) return false;
    const allowExtra = new Set(allowExtraAttributes);
    const incomingNames = Object.keys(data.attributes).sort().join('|');
    const existingNames = Object.keys(geometry.attributes).filter((name) => !allowExtra.has(name)).sort().join('|');
    if (incomingNames !== existingNames) return false;

    for (const [name, spec] of Object.entries(data.attributes)) {
        const attribute = geometry.getAttribute(name);
        if (!attribute) return false;
        if (attribute.itemSize !== spec.itemSize) return false;
        if (!!attribute.normalized !== !!spec.normalized) return false;
        if (attribute.array.length < spec.array.length) return false;
    }

    const incomingIndex = data.index?.array || null;
    const existingIndex = geometry.getIndex();
    if (!!incomingIndex !== !!existingIndex) return false;
    if (incomingIndex && existingIndex.array.length < incomingIndex.length) return false;
    return true;
}

function updateGeometryInPlace(geometry, data, computeNormals = false) {
    if (!canUpdateGeometryInPlace(geometry, data, computeNormals ? ['normal'] : [])) return false;
    Object.entries(data.attributes).forEach(([name, spec]) => {
        const attribute = geometry.getAttribute(name);
        attribute.array.set(spec.array, 0);
        attribute.count = Math.floor(spec.array.length / attribute.itemSize);
        markAttributeUpdated(attribute, spec.array.length);
    });

    const index = geometry.getIndex();
    if (data.index?.array && index) {
        index.array.set(data.index.array, 0);
        index.count = data.index.array.length;
        markAttributeUpdated(index, data.index.array.length);
    }

    const drawCount = data.index?.array?.length || geometry.getAttribute('position').count;
    geometry.setDrawRange(0, drawCount);
    if (computeNormals) geometry.computeVertexNormals();
    geometry.computeBoundingSphere();
    return true;
}

function removeSlot(slot) {
    if (!slot) return null;
    if (slot.object) {
        disposeObject(slot.object);
        slot.object.removeFromParent();
    }
    return null;
}

function removeInteractiveSlot(slot) {
    if (!slot) return null;
    slot.lines = removeSlot(slot.lines);
    slot.fills = removeSlot(slot.fills);
    slot.points = removeSlot(slot.points);
    return null;
}

function clearPayloadGeometrySlots() {
    payloadGeometrySlots.lines = removeSlot(payloadGeometrySlots.lines);
    payloadGeometrySlots.fills = removeSlot(payloadGeometrySlots.fills);
    payloadGeometrySlots.points = removeSlot(payloadGeometrySlots.points);
    payloadGeometrySlots.interactive.forEach((slot) => removeInteractiveSlot(slot));
    payloadGeometrySlots.interactive.length = 0;
}

function clearEditableGeometrySlots() {
    editableGeometrySlots.lines.forEach((slot) => removeSlot(slot));
    editableGeometrySlots.points.forEach((slot) => removeSlot(slot));
    editableGeometrySlots.faces.forEach((slot) => removeSlot(slot));
    editableGeometrySlots.lines.length = 0;
    editableGeometrySlots.points.length = 0;
    editableGeometrySlots.faces.length = 0;
}

function upsertGeometrySlot(slot, data, options) {
    const normalized = cloneGeometryDataWithDefaults(data, options.defaults || {});
    if (!normalized) return removeSlot(slot);

    if (slot && slot.object && slot.kind === options.kind && updateGeometryInPlace(slot.object.geometry, normalized, !!options.computeNormals)) {
        if (options.afterUpdate) options.afterUpdate(slot);
        return slot;
    }

    slot = removeSlot(slot);
    const geometry = buildGeometry(normalized);
    if (!geometry) return null;
    if (options.computeNormals) geometry.computeVertexNormals();
    const material = options.makeMaterial();
    const object = new options.ObjectClass(geometry, material);
    if (options.configureObject) options.configureObject(object, material);
    baseGeometryRoot.add(object);
    slot = { kind: options.kind, object, material };
    if (options.afterUpdate) options.afterUpdate(slot);
    return slot;
}

function geometryDataFromArrays(positions, colors = null, alphas = null, sizes = null, indices = null) {
    if (!positions || positions.length === 0) return null;
    const attributes = {
        position: attributeSpec(3, positions)
    };
    if (colors) attributes.color = attributeSpec(3, colors);
    if (alphas) attributes.alpha = attributeSpec(1, alphas);
    if (sizes) attributes.size = attributeSpec(1, sizes);
    let index = null;
    if (indices && indices.length) {
        let maxIndex = 0;
        indices.forEach((value) => { if (value > maxIndex) maxIndex = value; });
        index = {
            type: maxIndex > 65535 ? 'Uint32Array' : 'Uint16Array',
            array: indices
        };
    }
    return { attributes, index };
}

function ensureAttribute(geometry, name, itemSize, fillValue) {
    if (geometry.getAttribute(name)) return;
    const count = geometry.getAttribute('position').count;
    const array = new Float32Array(count * itemSize);
    if (Array.isArray(fillValue)) {
        for (let i = 0; i < count; i += 1) {
            for (let c = 0; c < itemSize; c += 1) {
                array[i * itemSize + c] = fillValue[Math.min(c, fillValue.length - 1)];
            }
        }
    } else {
        array.fill(fillValue);
    }
    geometry.setAttribute(name, new THREE.BufferAttribute(array, itemSize));
}

function makeLineMaterial() {
    return new THREE.ShaderMaterial({
        vertexShader: `
            attribute vec3 color;
            attribute float alpha;
            varying vec4 vColor;
            void main() {
                vColor = vec4(color, alpha);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            varying vec4 vColor;
            void main() {
                gl_FragColor = vColor;
            }
        `,
        transparent: true,
        depthWrite: false
    });
}

function makePointMaterial() {
    return new THREE.ShaderMaterial({
        uniforms: {
            uPixelRatio: { value: getDpr() }
        },
        vertexShader: `
            attribute float size;
            attribute vec3 color;
            attribute float alpha;
            varying vec4 vColor;
            uniform float uPixelRatio;
            void main() {
                vColor = vec4(color, alpha);
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = max(size * uPixelRatio, 1.0);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying vec4 vColor;
            void main() {
                vec2 uv = gl_PointCoord - vec2(0.5);
                float dist = dot(uv, uv);
                if (dist > 0.25) discard;
                float shapeAlpha = smoothstep(0.25, 0.02, dist);
                gl_FragColor = vec4(vColor.rgb, vColor.a * shapeAlpha);
            }
        `,
        transparent: true,
        depthWrite: false
    });
}

function makeFillMaterial() {
    const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        vertexColors: true,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 1.0,
        roughness: 0.6,
        metalness: 0.1,
        polygonOffset: true,
        polygonOffsetFactor: 1,
        polygonOffsetUnits: 1
    });
    material.depthWrite = false;
    material.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
            .replace('#include <color_pars_vertex>', '#include <color_pars_vertex>\nattribute float alpha;\nvarying float vAlpha;')
            .replace('#include <color_vertex>', '#include <color_vertex>\nvAlpha = alpha;');
        shader.fragmentShader = shader.fragmentShader
            .replace('#include <color_pars_fragment>', '#include <color_pars_fragment>\nvarying float vAlpha;')
            .replace('vec4 diffuseColor = vec4( diffuse, opacity );', 'vec4 diffuseColor = vec4( diffuse, opacity * vAlpha );');
    };
    material.customProgramCacheKey = () => 'vertex-alpha-v1';
    return material;
}

function makeInteractiveLineMaterial(hoverColor) {
    return new THREE.ShaderMaterial({
        uniforms: {
            uHover: { value: 0.0 },
            uHoverColor: { value: hoverColor ? new THREE.Color(hoverColor[0], hoverColor[1], hoverColor[2]) : new THREE.Color(1, 1, 1) },
            uHoverAlpha: { value: hoverColor ? hoverColor[3] : 1.0 }
        },
        vertexShader: `
            attribute vec3 color;
            attribute float alpha;
            varying vec4 vColor;
            void main() {
                vColor = vec4(color, alpha);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uHover;
            uniform vec3 uHoverColor;
            uniform float uHoverAlpha;
            varying vec4 vColor;
            void main() {
                vec3 c = mix(vColor.rgb, uHoverColor, uHover);
                float a = mix(vColor.a, uHoverAlpha, uHover);
                gl_FragColor = vec4(c, a);
            }
        `,
        transparent: true,
        depthWrite: false
    });
}

function makeInteractivePointMaterial(hoverColor) {
    return new THREE.ShaderMaterial({
        uniforms: {
            uPixelRatio: { value: getDpr() },
            uHover: { value: 0.0 },
            uHoverColor: { value: hoverColor ? new THREE.Color(hoverColor[0], hoverColor[1], hoverColor[2]) : new THREE.Color(1, 1, 1) },
            uHoverAlpha: { value: hoverColor ? hoverColor[3] : 1.0 }
        },
        vertexShader: `
            attribute float size;
            attribute vec3 color;
            attribute float alpha;
            varying vec4 vColor;
            uniform float uPixelRatio;
            void main() {
                vColor = vec4(color, alpha);
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = max(size * uPixelRatio, 1.0);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform float uHover;
            uniform vec3 uHoverColor;
            uniform float uHoverAlpha;
            varying vec4 vColor;
            void main() {
                vec2 uv = gl_PointCoord - vec2(0.5);
                float dist = dot(uv, uv);
                if (dist > 0.25) discard;
                float shapeAlpha = smoothstep(0.25, 0.02, dist);
                vec3 c = mix(vColor.rgb, uHoverColor, uHover);
                float a = mix(vColor.a, uHoverAlpha, uHover);
                gl_FragColor = vec4(c, a * shapeAlpha);
            }
        `,
        transparent: true,
        depthWrite: false
    });
}

function makeInteractiveFillMaterial(hoverColor) {
    const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        vertexColors: true,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 1.0,
        roughness: 0.6,
        metalness: 0.1,
        polygonOffset: true,
        polygonOffsetFactor: 1,
        polygonOffsetUnits: 1
    });
    material.depthWrite = false;
    const color = hoverColor ? new THREE.Color(hoverColor[0], hoverColor[1], hoverColor[2]) : null;
    const alpha = hoverColor ? hoverColor[3] : 1.0;
    material.onBeforeCompile = (shader) => {
        shader.uniforms.uHover = { value: 0.0 };
        shader.uniforms.uHoverColor = { value: color || new THREE.Color(1, 1, 1) };
        shader.uniforms.uHoverAlpha = { value: alpha };
        material.userData.shader = shader;
        shader.vertexShader = shader.vertexShader
            .replace('#include <color_pars_vertex>', '#include <color_pars_vertex>\nattribute float alpha;\nvarying float vAlpha;')
            .replace('#include <color_vertex>', '#include <color_vertex>\nvAlpha = alpha;');
        shader.fragmentShader = shader.fragmentShader
            .replace('#include <color_pars_fragment>', '#include <color_pars_fragment>\nvarying float vAlpha;\nuniform float uHover;\nuniform vec3 uHoverColor;\nuniform float uHoverAlpha;')
            .replace('vec4 diffuseColor = vec4( diffuse, opacity );', 'vec4 diffuseColor = vec4( diffuse, opacity * mix(vAlpha, uHoverAlpha, uHover) );')
            .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = mix(diffuseColor.rgb, uHoverColor, uHover);');
    };
    material.customProgramCacheKey = () => 'interactive-vertex-alpha-v1';
    return material;
}

function updateHoverMaterial(material, hoverColor) {
    const color = hoverColor ? new THREE.Color(hoverColor[0], hoverColor[1], hoverColor[2]) : new THREE.Color(1, 1, 1);
    const alpha = hoverColor ? hoverColor[3] : 1.0;
    const targets = [];
    if (material?.uniforms) targets.push(material.uniforms);
    if (material?.userData?.shader?.uniforms) targets.push(material.userData.shader.uniforms);
    targets.forEach((uniforms) => {
        if (uniforms.uHoverColor) uniforms.uHoverColor.value.copy(color);
        if (uniforms.uHoverAlpha) uniforms.uHoverAlpha.value = alpha;
        if (uniforms.uHover) uniforms.uHover.value = 0.0;
    });
}

function interactiveSlotOptions(kind, hoverColor) {
    if (kind === 'lines') {
        return {
            kind: 'interactive-lines',
            ObjectClass: THREE.LineSegments,
            defaults: {
                color: { itemSize: 3, fill: [1, 1, 1] },
                alpha: { itemSize: 1, fill: 1 }
            },
            makeMaterial: () => makeInteractiveLineMaterial(hoverColor),
            configureObject: (object, material) => { object.userData.interactiveMat = material; },
            afterUpdate: (slot) => updateHoverMaterial(slot.material, hoverColor)
        };
    }
    if (kind === 'fills') {
        return {
            kind: 'interactive-fills',
            ObjectClass: THREE.Mesh,
            computeNormals: true,
            defaults: {
                color: { itemSize: 3, fill: [1, 1, 1] },
                alpha: { itemSize: 1, fill: 1 }
            },
            makeMaterial: () => makeInteractiveFillMaterial(hoverColor),
            configureObject: (object, material) => { object.userData.interactiveMat = material; },
            afterUpdate: (slot) => updateHoverMaterial(slot.material, hoverColor)
        };
    }
    return {
        kind: 'interactive-points',
        ObjectClass: THREE.Points,
        defaults: {
            color: { itemSize: 3, fill: [1, 1, 1] },
            alpha: { itemSize: 1, fill: 1 },
            size: { itemSize: 1, fill: 3 }
        },
        makeMaterial: () => makeInteractivePointMaterial(hoverColor),
        configureObject: (object, material) => { object.userData.interactiveMat = material; },
        afterUpdate: (slot) => updateHoverMaterial(slot.material, hoverColor)
    };
}

function upsertInteractiveObject(slot, obj) {
    if (!obj) return removeInteractiveSlot(slot);
    const hoverColor = obj.hoverColor || null;
    const next = slot || {};
    next.lines = upsertGeometrySlot(next.lines, obj.lines, interactiveSlotOptions('lines', hoverColor));
    next.fills = upsertGeometrySlot(next.fills, obj.fills, interactiveSlotOptions('fills', hoverColor));
    next.points = upsertGeometrySlot(next.points, obj.points, interactiveSlotOptions('points', hoverColor));
    const meshes = [next.lines?.object, next.fills?.object, next.points?.object].filter(Boolean);
    if (!meshes.length) return removeInteractiveSlot(next);
    next.entry = interactiveEntry(obj, meshes, obj.vertices);
    return next;
}

// [viewer-region interactive-entry] BEGIN
// What a clickable object remembers about itself — written once, for both paths.
//
// This region exists because of a bug rather than a feature. `06352df08` taught the viewer to name the
// element under the pointer, and the naming needs three fields on the entry: `topology`, `lineIndex`
// and `label`. There were **two** places that built an entry — `makeInteractiveEntry` for editable
// scenes and an object literal inside `upsertInteractiveObject` for ordinary ones — and only the first
// was updated. `upsertInteractiveObject` is the one `renderPayloadGeometry` actually calls, so on the
// live non-editable path `entry.topology` was `undefined`, `flinePickClassify` was handed `null`, and
// every click came back with `kind` but `nodeIndex: -1` and no label. The feature was dead in the water
// on exactly the figures it was written for. Found 2026-08-11 while wiring pick-to-measure, which needs
// the same three fields.
//
// A third copy — `addInteractiveObject`, ~50 lines, no callers — had them all and was never reached.
// It has been deleted; it is what made the drift invisible.
//
// So: one constructor, marked, lifted and executed under test by
// `ThreeInteractiveEntryDifferentialTest`. Pure — the meshes and vertices come in as opaque values —
// so the fact that this cannot happen again is an assertion rather than a convention.
const INTERACTIVE_ENTRY_FIELDS = 8;

/** The line's segments and closed subpaths, as the server serialised them. Never throws. */
function parseFLineTopology(text) {
    if (!text) return null;
    try {
        return JSON.parse(text);
    } catch (error) {
        // Guarded because this region is also executed outside a browser, by the differential test.
        if (typeof console !== 'undefined' && console.warn) console.warn('unparsable FLine topology', error);
        return null;
    }
}

/** An editable scene's line, as the `{ index, position }` pairs an entry wants. */
function verticesForLine(line) {
    return line.nodes
        .filter((node) => node.kind !== 'close' && node.to)
        .map((node) => ({
            index: node.nodeIndex,
            position: node.to
        }));
}

/**
 * The one entry constructor.
 *
 * `source` is either an editable `ThreeEditableLine` or a `ThreeInteractiveObject`; the four fields it
 * is read for — `callbackId`, `hoverColor`, `lineIndex`, `label`, `topology` — are named identically on
 * both by the server, which is what makes one constructor possible at all.
 */
function interactiveEntry(source, meshes, vertices) {
    return {
        callbackId: source.callbackId || '',
        hoverColor: source.hoverColor || null,
        meshes: meshes,
        hovering: false,
        vertices: vertices || [],
        lineIndex: Number.isFinite(source.lineIndex) ? source.lineIndex : -1,
        label: typeof source.label === 'string' ? source.label : null,
        topology: parseFLineTopology(source.topology)
    };
}
// [viewer-region interactive-entry] END

function makeInteractiveEntry(line, meshes) {
    return interactiveEntry(line, meshes, verticesForLine(line));
}

// [viewer-region fline-hit-picking] BEGIN
// Naming a clicked element from a raycast hit — the three.js half of the FLine hit record.
//
// The server sends each clickable line's topology as the *same* string the interactive SVG puts in
// `data-fline-elements` (`flineTopologyJson`, someSkiko.kt), so the two outputs cannot describe a line
// differently. What differs is the picking, and it differs in the viewer's favour: three.js has already
// told us *which* geometry was hit — the line segments, the fill, or the point sprites — so the element
// kind needs no tolerance, and only the element itself has to be found. Which is a nearest-search in 3D
// over the topology, plus a plane projection for a face.
//
// Pure arithmetic, no THREE and no DOM, so `ViewerJavaScript` can lift it and
// `ThreeJsHitRecordDifferentialTest` can execute it against the same figures the 2D probe uses — and
// assert that the two implementations agree on a planar face rather than assuming it.
const FLINE_PICK_CUBIC_SAMPLES = 32;
const FLINE_PICK_DEGENERATE_EPS = 1e-9;

function flinePickCubicAt(seg, t) {
    const mt = 1 - t;
    const a = mt * mt * mt;
    const b = 3 * mt * mt * t;
    const c = 3 * mt * t * t;
    const d = t * t * t;
    const out = [];
    for (let i = 0; i < 3; i += 1) {
        out.push(a * seg.a[i] + b * seg.c1[i] + c * seg.c2[i] + d * seg.b[i]);
    }
    return out;
}

/** The point on a segment at parameter `t`, in 3D. */
function flinePickSegmentAt(seg, t) {
    if (seg.k === 'c' && seg.c1 && seg.c2) return flinePickCubicAt(seg, t);
    const out = [];
    for (let i = 0; i < 3; i += 1) out.push(seg.a[i] + (seg.b[i] - seg.a[i]) * t);
    return out;
}

/**
 * Nearest point on one segment to `p`, as `{ t, d2, point }`, all three dimensions this time.
 *
 * `u` is therefore the **Bézier parameter** of a cubic, not its arc length — the same quantity the 2D
 * path reports, deliberately, because it is the number that indexes back into the curve the author
 * wrote. See `dev_docs/fline_hit_records.md`.
 */
function flinePickNearestOnSegment(seg, p) {
    function at(t) {
        const q = flinePickSegmentAt(seg, t);
        const dx = p[0] - q[0];
        const dy = p[1] - q[1];
        const dz = p[2] - q[2];
        return { t: t, d2: dx * dx + dy * dy + dz * dz, point: q };
    }
    if (seg.k !== 'c' || !seg.c1 || !seg.c2) {
        const vx = seg.b[0] - seg.a[0];
        const vy = seg.b[1] - seg.a[1];
        const vz = seg.b[2] - seg.a[2];
        const lengthSquared = vx * vx + vy * vy + vz * vz;
        const raw = lengthSquared > 0
            ? ((p[0] - seg.a[0]) * vx + (p[1] - seg.a[1]) * vy + (p[2] - seg.a[2]) * vz) / lengthSquared
            : 0;
        return at(Math.min(1, Math.max(0, raw)));
    }
    let best = at(0);
    for (let i = 1; i <= FLINE_PICK_CUBIC_SAMPLES; i += 1) {
        const candidate = at(i / FLINE_PICK_CUBIC_SAMPLES);
        if (candidate.d2 < best.d2) best = candidate;
    }
    let span = 1 / FLINE_PICK_CUBIC_SAMPLES;
    for (let round = 0; round < 12; round += 1) {
        span *= 0.5;
        const lower = at(Math.max(0, best.t - span));
        const upper = at(Math.min(1, best.t + span));
        if (lower.d2 < best.d2) best = lower;
        if (upper.d2 < best.d2) best = upper;
    }
    return best;
}

/**
 * An orthonormal frame for a face's own plane, or `null` when the polygon has no plane at all.
 *
 * Newell's normal, so a slightly non-planar or a concave polygon still gets the area-weighted average
 * plane rather than whatever the first three corners happened to say. `null` — a zero-length normal or
 * no usable first edge — is the honest answer for a degenerate face (all corners coincident, or
 * collinear), and the callers turn it into "no face coordinates" rather than into a plausible number.
 */
function flinePickFaceFrame(pts) {
    let nx = 0;
    let ny = 0;
    let nz = 0;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        nx += (pts[j][1] - pts[i][1]) * (pts[j][2] + pts[i][2]);
        ny += (pts[j][2] - pts[i][2]) * (pts[j][0] + pts[i][0]);
        nz += (pts[j][0] - pts[i][0]) * (pts[j][1] + pts[i][1]);
    }
    const nLength = Math.sqrt(nx * nx + ny * ny + nz * nz);
    if (!(nLength > FLINE_PICK_DEGENERATE_EPS)) return null;
    const normal = [nx / nLength, ny / nLength, nz / nLength];

    let axisU = null;
    for (let i = 1; i < pts.length; i += 1) {
        const ex = pts[i][0] - pts[0][0];
        const ey = pts[i][1] - pts[0][1];
        const ez = pts[i][2] - pts[0][2];
        const length = Math.sqrt(ex * ex + ey * ey + ez * ez);
        if (length > FLINE_PICK_DEGENERATE_EPS) {
            axisU = [ex / length, ey / length, ez / length];
            break;
        }
    }
    if (!axisU) return null;
    const axisV = [
        normal[1] * axisU[2] - normal[2] * axisU[1],
        normal[2] * axisU[0] - normal[0] * axisU[2],
        normal[0] * axisU[1] - normal[1] * axisU[0]
    ];
    return { origin: pts[0], u: axisU, v: axisV, normal: normal };
}

/** A 3D point in the frame's plane coordinates, plus its signed distance off that plane. */
function flinePickToPlane(frame, p) {
    const dx = p[0] - frame.origin[0];
    const dy = p[1] - frame.origin[1];
    const dz = p[2] - frame.origin[2];
    return {
        s: dx * frame.u[0] + dy * frame.u[1] + dz * frame.u[2],
        t: dx * frame.v[0] + dy * frame.v[1] + dz * frame.v[2],
        off: dx * frame.normal[0] + dy * frame.normal[1] + dz * frame.normal[2]
    };
}

/** Even-odd point-in-polygon, on a polygon already flattened into `[s, t]` pairs. */
function flinePickPointInPolygon(flat, s, t) {
    let inside = false;
    for (let i = 0, j = flat.length - 1; i < flat.length; j = i++) {
        const si = flat[i][0];
        const ti = flat[i][1];
        const sj = flat[j][0];
        const tj = flat[j][1];
        if ((ti > t) !== (tj > t) && s < (sj - si) * (t - ti) / (tj - ti) + si) inside = !inside;
    }
    return inside;
}

/**
 * Where inside a face a point landed, as `{ u, v, mode }` — and `mode` is the point of it.
 *
 * `bilinear` for a four-corner face whose bilinear map actually inverts at this point: `u` runs corner
 * 0 → 1 and `v` corner 0 → 3, which is what makes them a position *on a panel*. The Newton solve is
 * **checked** rather than trusted — the forward map has to reproduce the point, and the result has to
 * land inside the patch — because on a non-convex quad it can converge to the fold, and a plausible
 * wrong coordinate is worse than an honest fallback.
 *
 * `bbox` for every other closed subpath: the point's position in the face's own bounding box, in the
 * face's plane. Well defined, monotone, and *not* a parameterisation, which is why it says so.
 *

function flinePickFaceCoords(flat, s, t) {
    if (flat.length === 4) {
        const p0 = flat[0];
        const p1 = flat[1];
        const p2 = flat[2];
        const p3 = flat[3];
        let u = 0.5;
        let v = 0.5;
        let converged = false;
        for (let round = 0; round < 24; round += 1) {
            const fs = (1 - u) * (1 - v) * p0[0] + u * (1 - v) * p1[0] + u * v * p2[0] + (1 - u) * v * p3[0] - s;
            const ft = (1 - u) * (1 - v) * p0[1] + u * (1 - v) * p1[1] + u * v * p2[1] + (1 - u) * v * p3[1] - t;
            const dsdu = (1 - v) * (p1[0] - p0[0]) + v * (p2[0] - p3[0]);
            const dtdu = (1 - v) * (p1[1] - p0[1]) + v * (p2[1] - p3[1]);
            const dsdv = (1 - u) * (p3[0] - p0[0]) + u * (p2[0] - p1[0]);
            const dtdv = (1 - u) * (p3[1] - p0[1]) + u * (p2[1] - p1[1]);
            const det = dsdu * dtdv - dsdv * dtdu;
            if (!isFinite(det) || Math.abs(det) < 1e-12) break;
            const du = (fs * dtdv - ft * dsdv) / det;
            const dv = (ft * dsdu - fs * dtdu) / det;
            u -= du;
            v -= dv;
            if (!isFinite(u) || !isFinite(v)) break;
            if (Math.abs(du) < 1e-9 && Math.abs(dv) < 1e-9) {
                converged = true;
                break;
            }
        }
        if (converged && u >= -1e-6 && u <= 1 + 1e-6 && v >= -1e-6 && v <= 1 + 1e-6) {
            // The check that makes it a measurement rather than a hope: does the map come back?
            const bs = (1 - u) * (1 - v) * p0[0] + u * (1 - v) * p1[0] + u * v * p2[0] + (1 - u) * v * p3[0];
            const bt = (1 - u) * (1 - v) * p0[1] + u * (1 - v) * p1[1] + u * v * p2[1] + (1 - u) * v * p3[1];
            let diagonal = 0;
            for (let i = 0; i < 4; i += 1) {
                for (let j = i + 1; j < 4; j += 1) {
                    diagonal = Math.max(diagonal, Math.hypot(flat[i][0] - flat[j][0], flat[i][1] - flat[j][1]));
                }
            }
            const tolerance = Math.max(1e-9, diagonal * 1e-6);
            if (Math.hypot(bs - s, bt - t) <= tolerance) {
                return { u: Math.min(1, Math.max(0, u)), v: Math.min(1, Math.max(0, v)), mode: 'bilinear' };

    let maxS = -Infinity;
    let minT = Infinity;
    let maxT = -Infinity;

        maxT = Math.max(maxT, flat[i][1]);

        u: maxS > minS ? (s - minS) / (maxS - minS) : 0,
        v: maxT > minT ? (t - minT) / (maxT - minT) : 0,
        mode: 'bbox'

}

/**
 * The element a raycast hit landed on.
 *
 * `role` is what three.js already knows — `edge`, `face` or `point` — so this never has to guess a
 * kind. `point3` is the hit position in the line's own coordinate space. Returns the fields of the hit
 * record that describe the element, or nulls when there is no topology to name it with.
 */

    const empty = {
        kind: role || '',
        nodeIndex: -1,
        subPathIndex: -1,
        elementIndex: -1,
        u: NaN,
        v: NaN,
        faceCoordinates: 'none',
        onElement: null
    };
    if (!topology) return empty;
    const segments = topology.segments || [];
    const faces = topology.faces || [];

    if (role === 'point') {
        let best = null;
        for (let i = 0; i < segments.length; i += 1) {
            const seg = segments[i];
            const ends = [[seg.a, seg.na], [seg.b, seg.nb]];
            for (let e = 0; e < ends.length; e += 1) {
                const q = ends[e][0];
                if (!q) continue;
                const d2 = (point3[0] - q[0]) * (point3[0] - q[0]) +
                    (point3[1] - q[1]) * (point3[1] - q[1]) +
                    (point3[2] - q[2]) * (point3[2] - q[2]);

        }
        if (!best) return empty;
        return {
            kind: 'point',
            nodeIndex: best.node,
            subPathIndex: best.p,
            elementIndex: best.node,
            u: NaN,
            v: NaN,
            faceCoordinates: 'none',
            onElement: best.point
        };
    }

    if (role === 'face') {
        let best = null;
        for (let i = 0; i < faces.length; i += 1) {
            const pts = faces[i].pts || [];
            if (pts.length < 3) continue;
            const frame = flinePickFaceFrame(pts);
            if (!frame) {
                if (!best) best = { face: faces[i], frame: null, off: Infinity, flat: null, at: null };
                continue;
            }
            const at = flinePickToPlane(frame, point3);
            const flat = pts.map((q) => {
                const projected = flinePickToPlane(frame, q);
                return [projected.s, projected.t];
            });
            const inside = flinePickPointInPolygon(flat, at.s, at.t);
            const score = Math.abs(at.off) + (inside ? 0 : 1e6);
            if (!best || score < best.score) best = { face: faces[i], frame: frame, flat: flat, at: at, score: score };
        }
        if (!best) return empty;
        if (!best.frame) {
            return {
                kind: 'face',
                nodeIndex: best.face.n,
                subPathIndex: best.face.p,
                elementIndex: best.face.e,
                u: NaN,
                v: NaN,
                faceCoordinates: 'none',
                onElement: point3

        const coords = flinePickFaceCoords(best.flat, best.at.s, best.at.t);
        // The point *on* the face: the hit projected onto the face's own plane.
        const onElement = [
            point3[0] - best.frame.normal[0] * best.at.off,
            point3[1] - best.frame.normal[1] * best.at.off,
            point3[2] - best.frame.normal[2] * best.at.off
        ];
        return {
            kind: 'face',
            nodeIndex: best.face.n,
            subPathIndex: best.face.p,
            elementIndex: best.face.e,
            u: coords.u,
            v: coords.v,
            faceCoordinates: coords.mode,
            onElement: onElement
        };
    }

    let best = null;
    for (let i = 0; i < segments.length; i += 1) {
        const near = flinePickNearestOnSegment(segments[i], point3);
        if (!best || near.d2 < best.near.d2) best = { seg: segments[i], near: near };
    }
    if (!best) return empty;
    return {
        kind: 'edge',
        nodeIndex: best.seg.n,
        subPathIndex: best.seg.p,
        elementIndex: best.seg.e,
        u: best.near.t,
        v: NaN,
        faceCoordinates: 'none',
        onElement: best.near.point
    };
}

// [viewer-region inspector-measure] BEGIN
// "How far apart are these two things" — the arithmetic half of the measure tool.
//
// The viewer can already name the element under the pointer (`flinePickClassify`, above). Naming two
// of them and reporting the distance between them is the next question anyone asks of a 3D preview of
// something that gets built, and it is the first one the viewer could not answer at all.
//
// An **element** here is one of three shapes, which is exactly what a hit record can resolve to:
// a `point` (a node), a `segment` (an edge — a straight one; a cubic is sampled into straight pieces
// by the caller before it gets here), or a `polygon` (a filled face, as its ring of corners).
//
// The distance is the true **closest approach**, not a centroid-to-centroid convenience, because on a
// panel drawing those are different numbers and only one of them is the one you would take to a saw.
// For two disjoint polygonal sets in 3D the minimum is always attained at a (vertex, other-element)
// pair or at an (edge, edge) pair, so enumerating exactly those three families is complete rather than
// approximate — no sampling, no iteration, no tolerance in the answer. `measureClosestApproach` is
// therefore exact to floating point: two squares built 2.5 apart come back as 2.5, and
// `ThreeInspectorMeasureDifferentialTest` asserts precisely that.
//
// Deliberate duplication, said out loud: `measurePolygonFrame` recomputes a Newell normal and an
// orthonormal plane frame that `flinePickFaceFrame` already computes 300 lines up. They are *not*
// shared, because a region has to be liftable on its own — `ViewerJavaScript` evaluates one region at
// a time, and a cross-region call would make each of them untestable in isolation. The cost is thirty
// lines said twice; the benefit is that both are executed under test. If a third region needs the same
// frame, that is the moment to make a `viewer-vector-math` region and have all three import it.
//
// No DOM, no THREE — `ViewerJavaScriptRegionTest` asserts both.
const MEASURE_EPS = 1e-12;

function measureSub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }

function measureScale(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function measureDot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function measureCross(a, b) {
    return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]

}

function measureDistance(a, b) { return measureLength(measureSub(a, b)); }

/** A unit vector, or `null` when there was no direction to normalise — never a NaN triple. */
function measureNormalize(a) {
    const length = measureLength(a);
    if (!(length > MEASURE_EPS)) return null;
    return [a[0] / length, a[1] / length, a[2] / length];

/**
 * The three shapes a picked element can take, normalised.
 *
 * `kind` is authoritative when it is given — the caller got it from a raycast, which already knows
 * whether the ray hit line geometry, a fill or a point sprite. The point-count fallback is only for a
 * caller that constructed an element by hand.

    const pts = (points || []).map((p) => [Number(p[0]), Number(p[1]), Number(p[2])]);
    if (kind === 'point' || (!kind && pts.length === 1)) return { kind: 'point', pts: pts.slice(0, 1) };
    if (kind === 'segment' || kind === 'edge' || (!kind && pts.length === 2)) {
        return { kind: 'segment', pts: pts.slice(0, 2) };
    }
    return { kind: 'polygon', pts: pts };

/** The closed ring of an element, as `[a, b]` pairs. A point has none; a segment has one. */
function measureEdges(element) {
    const pts = element.pts;
    if (element.kind === 'segment' && pts.length >= 2) return [[pts[0], pts[1]]];
    if (element.kind === 'polygon' && pts.length >= 2) {

/** The point of `[a, b]` nearest to `p`, with the parameter clamped to the segment. */

    const d = measureSub(b, a);
    const lengthSquared = measureDot(d, d);
    if (!(lengthSquared > MEASURE_EPS)) return a.slice();
    const t = Math.min(1, Math.max(0, measureDot(measureSub(p, a), d) / lengthSquared));
    return measureAdd(a, measureScale(d, t));

/**

 *
 * Newell's normal, so a slightly non-planar ring — which every real tessellated panel is — gets the
 * area-weighted average plane rather than whatever its first three corners happened to say. `null` for
 * a ring with no plane at all, and the callers then fall back to the boundary, which still has an
 * answer.

function measurePolygonFrame(pts) {
    if (!pts || pts.length < 3) return null;
    let n = [0, 0, 0];
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        n[0] += (pts[j][1] - pts[i][1]) * (pts[j][2] + pts[i][2]);
        n[1] += (pts[j][2] - pts[i][2]) * (pts[j][0] + pts[i][0]);
        n[2] += (pts[j][0] - pts[i][0]) * (pts[j][1] + pts[i][1]);

    for (let i = 1; i < pts.length && !axisU; i += 1) axisU = measureNormalize(measureSub(pts[i], pts[0]));

        const d = measureSub(q, origin);

/** `p` in the frame's plane coordinates, plus its signed distance off the plane. */
function measureToPlane(frame, p) {
    const d = measureSub(p, frame.origin);

/** Even-odd, on a ring already flattened into `[s, t]` pairs. */
function measurePointInPolygon(flat, s, t) {
    let inside = false;
    for (let i = 0, j = flat.length - 1; i < flat.length; j = i++) {
        const si = flat[i][0];
        const ti = flat[i][1];
        const sj = flat[j][0];
        const tj = flat[j][1];

/**
 * The point of an element nearest to `p`.
 *
 * For a polygon this is the perpendicular foot when the foot lands *inside* the ring, and the nearest
 * boundary point otherwise — which is the distinction that makes a face-to-face measurement mean what
 * a fabricator would mean by it, rather than collapsing to a corner-to-corner answer.
 *
 * `null` — never a plausible-looking origin — for an element with no geometry at all. An empty element
 * reaches this code when a cached viewer receives a topology it cannot parse, and answering `[0, 0, 0]`
 * would have reported the distance to the world origin as if it were a measurement.

    if (!element || !element.pts || !element.pts.length) return null;

    if (element.kind === 'segment' && element.pts.length < 2) return element.pts[0].slice();
    if (element.kind === 'segment') return measureNearestOnSegment(element.pts[0], element.pts[1], p);

}

/**

 *
 * The degenerate branches matter more here than they look: a "segment" in a real figure is often a
 * zero-length one, because a panel's ring can carry a repeated corner.

function measureSegmentSegment(p1, q1, p2, q2) {

    } else if (a <= MEASURE_EPS) {

    const b = measureAdd(to, shift);
    const mid = measureScale(measureAdd(a, b), 0.5);

// [viewer-region inspector-explode] BEGIN
// "How does it come apart" — the arithmetic of an exploded view.
//
// This exists because of one literal in the human's own document
// (`panel-cross-host-3d`, 2026-08-09):
//
//     showConduitRelaxationThree(relaxed, channelPrefix = "cross-host-assembled", explosionMm = 0.0, …)
//
// An exploded view already existed — as a number you retype and re-run the box for. The whole
// complaint is that it is not a *control*, so the displacement has to happen in the viewer, on the CPU,
// from a kept copy of the base positions. Which means the arithmetic is written twice — once here and
// once in `ThreeJsViewer.kt` — and that is exactly the situation the region harness exists for.
//
// The scene's batched geometry merges every FLine into one buffer, so each vertex carries a `group`
// attribute saying which assembly it belongs to. Everything below is over that pair of arrays.
//
// Two modes, because two different questions are being asked:
//
//  * `radial` — every group slides directly away from a common origin. This is the "show me the
//    fasteners" explode, and it is the one that reads well on an irregular assembly.
//  * `axis` — every group slides along one fixed direction, spaced by its **rank** in that direction
//    rather than by its distance. This is the layered-wall explode (`panel-plumbing-wall-floor`), where
//    the four skins of a wall are 12 mm apart in reality and have to be metres apart to be looked at.
//    Rank-spacing is what makes an even fan out of unevenly-spaced layers.
//
// The ranks are **centred**, so the middle of the assembly stays where it is and the view does not
// walk out of frame as the slider moves. That is a usability property with an arithmetic test.
//

const EXPLODE_EPS = 1e-12;

/** The centre of a payload's bounds — the natural origin for a radial explode. */
function explodeBoundsCentre(bounds) {
    if (!bounds || !bounds.min || !bounds.max) return [0, 0, 0];
    return [
        (bounds.min[0] + bounds.max[0]) * 0.5,
        (bounds.min[1] + bounds.max[1]) * 0.5,
        (bounds.min[2] + bounds.max[2]) * 0.5

/**
 * Each group's centroid and vertex count, from the flat position buffer and the per-vertex group index.
 *
 * A group with no vertices gets a `null` centroid rather than `[0, 0, 0]`, and every caller below
 * checks for it. `[0, 0, 0]` would be a plausible-looking answer that quietly drags an absent group's
 * neighbours toward the world origin, and an assembly usually *does* have empty groups — a line that is
 * stroked but not filled contributes nothing to the fill buffer.

    const count = Math.max(0, groupCount | 0);

        counts.push(0);

/**
 * The groups ordered along `axis`, as a rank per group — `-1` for a group that is not there.
 *

 * defined order rather than in whatever order the sort happened to produce this frame.

        ? [axis[0] / length, axis[1] / length, axis[2] / length]
        : [0, 1, 0];

    for (let g = 0; g < centroids.length; g += 1) {
        if (!centroids[g]) continue;
        const c = centroids[g];
        order.push({ g: g, at: c[0] * unit[0] + c[1] * unit[1] + c[2] * unit[2] });

    order.sort((a, b) => (a.at === b.at ? a.g - b.g : a.at - b.at));
    const ranks = centroids.map(() => -1);
    order.forEach((entry, index) => { ranks[entry.g] = index; });
    return { ranks: ranks, unit: unit, present: order.length };

/**
 * The displacement for each group: `[[dx, dy, dz], …]`, one per group, always the full length.
 *
 * `amount = 0` returns exact zeros in both modes, which is the assembled state and has to be *exactly*
 * the assembled state — the human's document passes `explosionMm = 0.0` and the geometry it draws must
 * be the geometry the server sent, bit for bit, not the geometry plus a rounding error.
 */

    const amount = spec && Number.isFinite(spec.amount) ? spec.amount : 0;
    const zero = centroids.map(() => [0, 0, 0]);
    if (amount === 0) return zero;

    if (mode === 'axis') {
        const ordering = explodeAxisRanks(centroids, (spec && spec.axis) || [0, 1, 0]);
        const middle = (ordering.present - 1) * 0.5;
        return centroids.map((c, g) => {
            if (!c || ordering.ranks[g] < 0) return [0, 0, 0];
            const step = (ordering.ranks[g] - middle) * amount;
            return [ordering.unit[0] * step, ordering.unit[1] * step, ordering.unit[2] * step];
        });
    }
    return centroids.map((c) => {
        if (!c) return [0, 0, 0];
        const dx = c[0] - origin[0];
        const dy = c[1] - origin[1];
        const dz = c[2] - origin[2];
        const length = Math.sqrt(dx * dx + dy * dy + dz * dz);
        // A group sitting exactly on the origin has no direction to go, and must not be given one.
        if (!(length > EXPLODE_EPS)) return [0, 0, 0];

/**
 * `base + offset[group]` for every vertex, written into `out`.
 *
 * `out` is reused between frames — this runs on a slider drag — so it is written into rather than
 * allocated. A vertex whose group index is out of range is *copied*, not dropped, because a geometry
 * that loses vertices when a slider moves is worse than one that fails to explode.
 */

    const target = out || new Array(base.length);
    const vertices = Math.floor(base.length / 3);
    for (let i = 0; i < vertices; i += 1) {
        const g = Math.round(groups ? groups[i] : -1);
        const offset = (g >= 0 && g < offsets.length) ? offsets[g] : null;
        if (offset) {
            target[i * 3] = base[i * 3] + offset[0];
            target[i * 3 + 1] = base[i * 3 + 1] + offset[1];
            target[i * 3 + 2] = base[i * 3 + 2] + offset[2];
        } else {
            target[i * 3] = base[i * 3];
            target[i * 3 + 1] = base[i * 3 + 1];
            target[i * 3 + 2] = base[i * 3 + 2];
        }

// [viewer-region inspector-explode] END

// [viewer-region inspector-section] BEGIN
// "What does this look like in section" — the cut plane, and the cut itself.
//
// three.js will hide half a figure for you: set `renderer.localClippingEnabled` and give the materials
// a `THREE.Plane`. That answers a *different* question. Hiding the front half shows you the inside of a
// shell; it does not draw the line where the knife went, and on a fabrication drawing the cut line is
// the entire content of a section — it is what tells you the wall is 240 thick here and 90 there.
//
// So this region does two things. `sectionPlane` turns a normal and a **fraction of the figure's own
// bounds** into a plane; and `sectionCutTriangles` / `sectionCutSegments` compute where that plane
// actually crosses the geometry, which the viewer then draws as a bright cut line over the clipped
// figure. The plane is the part three.js could have done. The crossings are the part it cannot.
//
// A fraction rather than a world coordinate, deliberately: a section at `0.42` means the same thing on
// a 3 m wall and on a 30 mm bracket, so a scrubber over it is meaningful without knowing the model's
// scale, and a section is portable between figures.
//
// ### The straddle test, which is the whole subtlety
//
// `(da > 0) !== (db > 0)` and not `da * db < 0`. They differ exactly when a vertex lies *on* the plane,
// which is the common case rather than the rare one: real geometry is built on round numbers and
// sections get put on round numbers. Under the product test a triangle with one vertex on the plane
// contributes one crossing instead of two, the segment is dropped, and the cut line comes out full of
// holes wherever the model was tidy. `ThreeInspectorSectionDifferentialTest` has that as a
// counterfactual, and the perturbed cut length is exactly zero.
//
// No DOM, no THREE.
const SECTION_EPS = 1e-9;

/**
 * The cut plane for a figure, as `n · p + d = 0` with `n` unit.
 *
 * `fraction` runs 0..1 across the figure's bounds *measured along the normal* — the eight corners are
 * projected and the extremes taken, so an oblique normal still gets the true extent rather than an
 * axis-aligned guess.
 *
 * `flip` swaps which half survives without changing where the cut is: `n` and `d` are both negated, and
 * `at` — the position of the plane along the *original* normal — is reported unchanged. That is why
 * flipping is a separate control from negating the normal, which would also reverse the fraction and
 * send the slider backwards under the user's hand.
 */
function sectionPlane(bounds, normal, fraction, flip) {
    const length = Math.sqrt(normal[0] * normal[0] + normal[1] * normal[1] + normal[2] * normal[2]);
    const n = length > SECTION_EPS
        ? [normal[0] / length, normal[1] / length, normal[2] / length]
        : [1, 0, 0];

    let hi = 0;
    if (bounds && bounds.min && bounds.max) {

        for (let corner = 0; corner < 8; corner += 1) {
            const p = [
                (corner & 1) ? bounds.max[0] : bounds.min[0],
                (corner & 2) ? bounds.max[1] : bounds.min[1],
                (corner & 4) ? bounds.max[2] : bounds.min[2]

            const at = p[0] * n[0] + p[1] * n[1] + p[2] * n[2];
            if (first) { lo = at; hi = at; first = false; }
            else { lo = Math.min(lo, at); hi = Math.max(hi, at); }

    const t = Number.isFinite(fraction) ? Math.min(1, Math.max(0, fraction)) : 0.5;
    const at = lo + (hi - lo) * t;
    if (flip) return { n: [-n[0], -n[1], -n[2]], d: at, at: at, lo: lo, hi: hi, flipped: true };
    return { n: n, d: -at, at: at, lo: lo, hi: hi, flipped: false };

/** Signed distance from the plane — positive on the side that survives clipping. */

    return plane.n[0] * p[0] + plane.n[1] * p[1] + plane.n[2] * p[2] + plane.d;
}

/**
 * Where the plane crosses a triangle mesh, as a flat array of segment endpoints.
 *
 * `[ax, ay, az, bx, by, bz, …]`, ready to become a `THREE.LineSegments` with no reshaping — this runs
 * on a slider drag over the whole fill buffer, so the output is the shape the consumer wants.
 *

 * fewer than two crossings contributes nothing: a triangle wholly on one side, and also the degenerate
 * case of a triangle lying *in* the plane, which would otherwise emit an arbitrary one of its edges.
 */

    const out = [];
    const triangles = index ? Math.floor(index.length / 3) : Math.floor(positions.length / 9);
    const crossing = [];
    for (let t = 0; t < triangles; t += 1) {
        const i0 = index ? index[t * 3] : t * 3;
        const i1 = index ? index[t * 3 + 1] : t * 3 + 1;
        const i2 = index ? index[t * 3 + 2] : t * 3 + 2;

            [positions[i0 * 3], positions[i0 * 3 + 1], positions[i0 * 3 + 2]],
            [positions[i1 * 3], positions[i1 * 3 + 1], positions[i1 * 3 + 2]],
            [positions[i2 * 3], positions[i2 * 3 + 1], positions[i2 * 3 + 2]]

        const d = [
            sectionSignedDistance(plane, corners[0]),
            sectionSignedDistance(plane, corners[1]),
            sectionSignedDistance(plane, corners[2])

        for (let e = 0; e < 3; e += 1) {
            const a = e;
            const b = (e + 1) % 3;

            // the plane still yields a crossing.
            if ((d[a] > 0) === (d[b] > 0)) continue;
            const span = d[a] - d[b];
            if (!(Math.abs(span) > SECTION_EPS)) continue;
            const s = d[a] / span;
            crossing.push([
                corners[a][0] + (corners[b][0] - corners[a][0]) * s,
                corners[a][1] + (corners[b][1] - corners[a][1]) * s,
                corners[a][2] + (corners[b][2] - corners[a][2]) * s

            crossing[0][0], crossing[0][1], crossing[0][2],
            crossing[1][0], crossing[1][1], crossing[1][2]

/**
 * Where the plane crosses a `LineSegments` buffer, as a flat array of **points**.
 *
 * A cut through a line is a point, not a segment, so these are drawn as marks rather than as a line —
 * which is what a section through a conduit run should look like: a row of dots where each pipe was
 * caught, at the height of the cut.

    const out = [];
    const pairs = Math.floor(positions.length / 6);
    for (let s = 0; s < pairs; s += 1) {

        const b = [positions[s * 6 + 3], positions[s * 6 + 4], positions[s * 6 + 5]];

        const db = sectionSignedDistance(plane, b);

/** Which of an interactive object's three geometries three.js says the ray hit. */
function flineRoleForObject(object) {

    if (object.isPoints) return 'point';
    if (object.isMesh) return 'face';
    if (object.isLineSegments || object.isLine) return 'edge';
    return '';

function intersectionForHit(entry, hit) {
    const p = hit && hit.point ? hit.point : new THREE.Vector3();
    let closestVertexIndex = -1;
    let bestDistance = Infinity;
    (entry.vertices || []).forEach((vertex) => {
        const position = vertex.position || [0, 0, 0];
        const dx = p.x - position[0];
        const dy = p.y - position[1];
        const dz = p.z - position[2];
        const d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < bestDistance) {
            bestDistance = d2;
            closestVertexIndex = vertex.index;
        }

    // geometry than the point on the ray; for a fill or a point sprite there is only `point`.
    const on = hit && hit.pointOnLine ? hit.pointOnLine : p;

    const element = flinePickClassify(entry.topology || null, role, [on.x, on.y, on.z]);

        closestVertexIndex,
        x: p.x,
        y: p.y,
        z: p.z,
        kind: element.kind,
