//
// Everything between this sentinel and its END is lifted verbatim, as text, and executed on GraalJS
// by `src/jvmTest/kotlin/afield/graphics/ViewerJavaScript.kt`, then compared ring-set by ring-set
// against `afield.graphics.PlanarTessellation` — the Kotlin it is a transliteration of — by
// `ThreeJsViewerTessellationParityTest`. The extractor fails loudly if either sentinel goes missing,
// so the seam cannot be quietly deleted. Two rules keep the region liftable, and both are asserted
// by `ViewerJavaScriptRegionTest`: no DOM, and no `THREE` beyond `Vector2` and
// `ShapeUtils.triangulateShape`.
//
// --- planar tessellation, ported from afield.graphics.PlanarTessellation --------------------
//
// Editable mode re-triangulates client-side, because the user drags points and the fill has to
// follow between server round-trips. It used to do that with a naive fan over each subpath's
// boundary — no holes, no projection, no concavity — so `editable = true` and `editable = false`
// could disagree about both the holes and the facing of the *same* FLine. This is the rule the
// server runs, so now they agree.
//
// Keep in step with `src/jvmMain/kotlin/afield/graphics/PlanarTessellation.kt`, and with the two
// tolerances in `Coplanarity`. Both are dimensionless: COPLANAR_SINE_OF_ANGLE is the sine of the
// angle between two rings' unit Newell normals — unsigned, so antiparallel counts as parallel,
// because a hole is normally wound against the ring it is a hole in — and COPLANAR_OFFSET_FRACTION
// is a fraction of the diagonal of the whole line's bounding box, so clustering is invariant under
// a uniform scale of the drawing.
const COPLANAR_SINE_OF_ANGLE = 1e-3;
const COPLANAR_OFFSET_FRACTION = 1e-3;
const RING_SANITIZE_EPS = 1e-5;

/** The server's ring sanitiser: drop consecutive duplicates in 3D, and a repeated final point. */
function sanitizeRing3D(ring) {
    const same = (a, b) => Math.abs(a[0] - b[0]) <= RING_SANITIZE_EPS
        && Math.abs(a[1] - b[1]) <= RING_SANITIZE_EPS
        && Math.abs(a[2] - b[2]) <= RING_SANITIZE_EPS;
    const out = [];
    ring.forEach((p) => { if (!out.length || !same(out[out.length - 1], p)) out.push(p.slice()); });
    if (out.length >= 2 && same(out[0], out[out.length - 1])) out.pop();
    return out;
}

function ringNewellNormal(ring) {
    let nx = 0, ny = 0, nz = 0;
    for (let i = 0; i < ring.length; i += 1) {
        const p = ring[i];
        const q = ring[(i + 1) % ring.length];
        nx += (p[1] - q[1]) * (p[2] + q[2]);
        ny += (p[2] - q[2]) * (p[0] + q[0]);
        nz += (p[0] - q[0]) * (p[1] + q[1]);
    }
    return [nx, ny, nz];
}

/**
 * Group `rings` (each an array of `[x, y, z]`) into coplanar planes, decide which rings are holes in
 * which *within* a plane, and triangulate each group on an orientation-preserving projected frame.
 *
 * Returns `[{ outer, holes, triangles }]`, where `outer` and each of `holes` index into `rings`, and
 * `triangles` is a flat list of `[ringIndex, vertexIndex]` pairs, three per triangle. Ordered by
 * `outer`, so the answer does not depend on the order the planes were discovered in.
 */
function tessellateCoplanarGroups(rings) {
    if (!rings.length) return [];
    const normals = rings.map(ringNewellNormal);

    let minX = Infinity, minY = Infinity, minZ = Infinity;
    let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    rings.forEach((ring) => ring.forEach((p) => {
        if (p[0] < minX) minX = p[0];
        if (p[0] > maxX) maxX = p[0];
        if (p[1] < minY) minY = p[1];
        if (p[1] > maxY) maxY = p[1];
        if (p[2] < minZ) minZ = p[2];
        if (p[2] > maxZ) maxZ = p[2];
    }));
    const dx = maxX - minX, dy = maxY - minY, dz = maxZ - minZ;
    const tolerance = COPLANAR_OFFSET_FRACTION * Math.sqrt(dx * dx + dy * dy + dz * dz);

    const planeHolds = (plane, ring) => ring.every((p) =>
        Math.abs(plane[0] * p[0] + plane[1] * p[1] + plane[2] * p[2] - plane[3]) <= tolerance);
    const sineBetween = (plane, u) => {
        const cx = plane[1] * u[2] - plane[2] * u[1];
        const cy = plane[2] * u[0] - plane[0] * u[2];
        const cz = plane[0] * u[1] - plane[1] * u[0];
        return Math.sqrt(cx * cx + cy * cy + cz * cz);
    };

    // Greedy: each ring joins the first plane it matches or seeds one, and a plane is represented by
    // the ring that seeded it — never a running average, so near-coplanarity does not accumulate
    // along a chain. A ring with no normal cannot seed a plane, and is placed only after every ring
    // that can has had its say.
    const groups = [];
    const withoutANormal = [];
    rings.forEach((ring, i) => {
        const n = normals[i];
        const length = Math.sqrt(n[0] * n[0] + n[1] * n[1] + n[2] * n[2]);
        if (!Number.isFinite(length) || length <= 0) { withoutANormal.push(i); return; }
        const u = [n[0] / length, n[1] / length, n[2] / length];
        const found = groups.find((g) => g.plane
            && sineBetween(g.plane, u) <= COPLANAR_SINE_OF_ANGLE && planeHolds(g.plane, ring));
        if (found) { found.members.push(i); return; }
        let cx = 0, cy = 0, cz = 0;
        ring.forEach((p) => { cx += p[0]; cy += p[1]; cz += p[2]; });
        const inv = 1 / ring.length;
        groups.push({
            plane: [u[0], u[1], u[2], u[0] * cx * inv + u[1] * cy * inv + u[2] * cz * inv],
            members: [i]
        });
    });
    withoutANormal.forEach((i) => {
        const found = groups.find((g) => g.plane && planeHolds(g.plane, rings[i]));
        if (found) found.members.push(i); else groups.push({ plane: null, members: [i] });
    });

    const out = [];
    groups.forEach((group) => fillCoplanarGroup(rings, normals, group.members, out));
    out.sort((a, b) => a.outer - b.outer);
    return out;
}

function fillCoplanarGroup(rings, normals, members, out) {
    // The axis, and the fallback hemisphere, from this plane's strongest ring.
    let axis = 2, strongest = 0, defaultFlipped = false;
    members.forEach((m) => {
        const n = normals[m];
        const l2 = n[0] * n[0] + n[1] * n[1] + n[2] * n[2];
        if (l2 <= strongest) return;
        strongest = l2;
        const ax = Math.abs(n[0]), ay = Math.abs(n[1]), az = Math.abs(n[2]);
        axis = (ax >= ay && ax >= az) ? 0 : (ay >= az ? 1 : 2);
        defaultFlipped = n[axis] < 0;
    });

    // The right-handed pair kept about `axis`: x -> (y, z), y -> (z, x), z -> (x, y). Earcut
    // normalises the winding of every ring it is handed, so the projected frame is the *only* thing
    // that decides which way the emitted triangles face; the mirror of this pair inverts all of them.
    const px = (p) => (axis === 0 ? p[1] : axis === 1 ? p[2] : p[0]);
    const py = (p) => (axis === 0 ? p[2] : axis === 1 ? p[0] : p[1]);

    const infos = members.map((m) => {
        const points = rings[m];
        let lo0 = px(points[0]), hi0 = lo0, lo1 = py(points[0]), hi1 = lo1;
        for (let i = 1; i < points.length; i += 1) {
            const a = px(points[i]), b = py(points[i]);
            if (a < lo0) lo0 = a;
            if (a > hi0) hi0 = a;
            if (b < lo1) lo1 = b;
            if (b > hi1) hi1 = b;
        }
        let sum = 0;
        for (let i = 0; i < points.length; i += 1) {
            const a = points[i], b = points[(i + 1) % points.length];
            sum += px(a) * py(b) - px(b) * py(a);
        }
        return { ring: m, points, area: 0.5 * sum, lo0, hi0, lo1, hi1 };
    });

    const inside = (points, p) => {
        let hit = false;
        let j = points.length - 1;
        const qx = px(p), qy = py(p);
        for (let i = 0; i < points.length; i += 1) {
            const xi = px(points[i]), yi = py(points[i]);
            const xj = px(points[j]), yj = py(points[j]);
            if (((yi > qy) !== (yj > qy)) && (qx < (xj - xi) * (qy - yi) / ((yj - yi) + 1e-12) + xi)) {
                hit = !hit;
            }
            j = i;
        }
        return hit;
    };

    // Bounding boxes, signed areas and containment all run in the *unflipped* frame. A mirror does
    // not change what is inside what, so the nesting is the same either way.
    //
    // A container is *strictly* larger than what it contains: geometrically free, and it is what makes
    // `parent` a forest rather than a graph that can cycle. Two overlapping rings of equal projected
    // area could otherwise each be chosen as the other's parent, and the depth walk below would spin
    // forever — freezing the tab on two overlapping subpaths. Keep in step with
    // `PlanarTessellation.fill`, and see `PlanarTessellationParentCycleTest`.
    const parent = infos.map((info, i) => {
        const test = info.points[0];
        const x = px(test), y = py(test);
        const own = Math.abs(info.area);
        let best = -1, bestArea = Infinity;
        infos.forEach((other, j) => {
            if (i === j) return;
            if (x < other.lo0 || x > other.hi0 || y < other.lo1 || y > other.hi1) return;
            if (!inside(other.points, test)) return;
            const a = Math.abs(other.area);
            if (a <= own) return;
            if (a < bestArea) { bestArea = a; best = j; }
        });
        return best;
    });
    const depth = infos.map((_, i) => {
        let d = 0, p = parent[i];
        while (p !== -1 && d <= infos.length) { d += 1; p = parent[p]; }
        return d;
    });

    infos.forEach((info, i) => {
        if (depth[i] % 2 !== 0) return;
        const holes = [];
        infos.forEach((_, j) => { if (parent[j] === i && depth[j] % 2 === 1) holes.push(j); });

        // This group is its own polygon, so it faces its own way: read the hemisphere from its own
        // outer ring, not from whichever ring in the plane happened to be biggest.
        const hemisphere = normals[info.ring][axis];
        const flipped = hemisphere === 0 ? defaultFlipped : hemisphere < 0;
        const project = (p) => (flipped
            ? new THREE.Vector2(py(p), px(p))
            : new THREE.Vector2(px(p), py(p)));

        // `refs` is built in exactly the index space `triangulateShape` returns: the contour, then
        // each hole in turn. The rings are pre-sanitised, so three.js's `removeDupEndPts` finds
        // nothing to pop and cannot shift those indices out from under us.
        const refs = [];
        const contour = [];
        info.points.forEach((p, v) => { refs.push([info.ring, v]); contour.push(project(p)); });
        const holeContours = holes.map((h) => {
            const hi = infos[h];
            const c = [];
            hi.points.forEach((p, v) => { refs.push([hi.ring, v]); c.push(project(p)); });
            return c;
        });
        if (refs.length < 3) return;

        let faces = null;
        try {
            faces = THREE.ShapeUtils.triangulateShape(contour, holeContours);
        } catch (error) {
            faces = null;
        }
        if (!faces || !faces.length) return;
        const triangles = [];
        faces.forEach((triangle) => triangle.forEach((at) => {
            if (refs[at]) triangles.push(refs[at]);
        }));
        if (triangles.length < 3) return;
        out.push({ outer: info.ring, holes: holes.map((h) => infos[h].ring), triangles });
    });
}

// [viewer-region planar-tessellation] END

function buildFaceGeometry(boundary) {
    if (!boundary || boundary.length < 3) return null;
    const positions = [];
    const indices = [];
    boundary.forEach((point) => positions.push(point[0], point[1], point[2]));
    for (let i = 1; i < boundary.length - 1; i += 1) {
        indices.push(0, i, i + 1);
    }
    if (!indices.length) return null;

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    geometry.computeBoundingSphere();
    return geometry;
}

function renderPayloadGeometry(payload) {
    clearEditableGeometrySlots();
    clearGroup(editorOverlayRoot);
    interactiveObjects = [];
    interactiveRevision += 1;
    editableHitObjects = [];
    if (payload.lines) addPayloadLines(payload.lines);
    else payloadGeometrySlots.lines = removeSlot(payloadGeometrySlots.lines);
    if (payload.fills) addPayloadFills(payload.fills);
    else payloadGeometrySlots.fills = removeSlot(payloadGeometrySlots.fills);
    if (payload.points) addPayloadPoints(payload.points);
    else payloadGeometrySlots.points = removeSlot(payloadGeometrySlots.points);
    addPayloadDrawables(payload.drawables);
    // Alongside the FLines, not instead of them. This one line is the fix the whole `surface-hit-picking`
    // region exists to serve: before it, `interactiveObjects` came only from `payload.interactive`,
    // which only the FLine half of a scene ever fills, and a solid was unhittable no matter what the
    // author asked for.
    payloadGeometrySlots.drawables.forEach((slot) => {
        if (slot && slot.entry) interactiveObjects.push(slot.entry);
    });

    const interactivePayload = payload.interactive || [];
    for (let i = 0; i < interactivePayload.length; i += 1) {
        payloadGeometrySlots.interactive[i] = upsertInteractiveObject(payloadGeometrySlots.interactive[i], interactivePayload[i]);
        const entry = payloadGeometrySlots.interactive[i]?.entry;
        if (entry) interactiveObjects.push(entry);
    }
    for (let i = interactivePayload.length; i < payloadGeometrySlots.interactive.length; i += 1) {
        removeInteractiveSlot(payloadGeometrySlots.interactive[i]);
    }
    payloadGeometrySlots.interactive.length = interactivePayload.length;
}

function renderEditableBaseGeometry() {
    clearPayloadGeometrySlots();
    interactiveObjects = [];
    interactiveRevision += 1;
    const sceneData = editorState.scene;
    if (!sceneData) return;

    sceneData.lines.forEach((line) => {
        const color = line.color;
        const interactive = !!(line.callbackId || line.hoverColor);
        const lineMeshes = [];
        if (line.stroked) {
            const positions = [];
            let previous = null;
            line.nodes.forEach((node) => {
                if (node.kind === 'move') {
                    previous = node.to;
                } else if (node.kind === 'line' && previous) {
                    positions.push(previous[0], previous[1], previous[2], node.to[0], node.to[1], node.to[2]);
                    previous = node.to;
                } else if (node.kind === 'line') {
                    previous = node.to;
                } else if (node.kind === 'cubic' && previous) {
                    const samples = sampleCubic(previous, node.c1, node.c2, node.to);
                    for (let i = 0; i < samples.length - 1; i += 1) {
                        const a = samples[i];
                        const b = samples[i + 1];
                        positions.push(a[0], a[1], a[2], b[0], b[1], b[2]);
                    }
                    previous = node.to;
                } else if (node.kind === 'close') {
                    previous = null;
                }
            });
            if (positions.length) {
                const vertexCount = positions.length / 3;
                const colors = new Array(vertexCount * 3);
                const alphas = new Array(vertexCount);
                for (let i = 0; i < vertexCount; i += 1) {
                    colors[i * 3] = color[0];
                    colors[i * 3 + 1] = color[1];
                    colors[i * 3 + 2] = color[2];
                    alphas[i] = color[3];
                }
                const data = geometryDataFromArrays(positions, colors, alphas);
                editableGeometrySlots.lines[line.lineIndex] = upsertGeometrySlot(editableGeometrySlots.lines[line.lineIndex], data, {
                    kind: 'editable-line',
                    ObjectClass: THREE.LineSegments,
                    makeMaterial: () => interactive ? makeInteractiveLineMaterial(line.hoverColor || null) : makeLineMaterial(),
                    configureObject: interactive ? ((object, material) => { object.userData.interactiveMat = material; }) : null,
                    afterUpdate: interactive ? ((slot) => updateHoverMaterial(slot.material, line.hoverColor || null)) : null
                });
                if (editableGeometrySlots.lines[line.lineIndex]?.object) {
                    lineMeshes.push(editableGeometrySlots.lines[line.lineIndex].object);
                }
            } else {
                editableGeometrySlots.lines[line.lineIndex] = removeSlot(editableGeometrySlots.lines[line.lineIndex]);
            }
        } else {
            editableGeometrySlots.lines[line.lineIndex] = removeSlot(editableGeometrySlots.lines[line.lineIndex]);
        }

        if (line.pointed) {
            const anchors = line.nodes.filter((node) => node.kind !== 'close' && node.to).map((node) => node.to);
            const positions = [];
            const colors = [];
            const alphas = [];
            const sizes = [];
            anchors.forEach((point) => {
                positions.push(point[0], point[1], point[2]);
                colors.push(color[0], color[1], color[2]);
                alphas.push(color[3]);
                sizes.push(Math.max(1.5, line.pointSize * 3.0));
            });
            const data = geometryDataFromArrays(positions, colors, alphas, sizes);
            editableGeometrySlots.points[line.lineIndex] = upsertGeometrySlot(editableGeometrySlots.points[line.lineIndex], data, {
                kind: 'editable-points',
                ObjectClass: THREE.Points,
                makeMaterial: () => interactive ? makeInteractivePointMaterial(line.hoverColor || null) : makePointMaterial(),
                configureObject: interactive ? ((object, material) => { object.userData.interactiveMat = material; }) : null,
                afterUpdate: (slot) => {
                    pointMaterial = slot.material;
                    if (interactive) updateHoverMaterial(slot.material, line.hoverColor || null);
                }
            });
            if (editableGeometrySlots.points[line.lineIndex]?.object) {
                lineMeshes.push(editableGeometrySlots.points[line.lineIndex].object);
            }
        } else {
            editableGeometrySlots.points[line.lineIndex] = removeSlot(editableGeometrySlots.points[line.lineIndex]);
        }

        if (interactive && lineMeshes.length) {
            interactiveObjects.push(makeInteractiveEntry(line, lineMeshes));
        }
    });

    // One fill mesh per *polygon*, not per subpath. The subpaths of a filled line are grouped into
    // planes and into outer-ring-plus-holes exactly as the server groups them, so a hole ring gets no
    // mesh of its own (it is part of its outer ring's) and a subpath in its own plane gets one.
    const fillByFaceIndex = new Map();
    const facesByLine = new Map();
    editorState.faces.forEach((face, faceIndex) => {
        const line = sceneData.lines[face.lineIndex];
        if (!line || !line.filled || !face.boundary || face.boundary.length < 3) return;
        if (!facesByLine.has(face.lineIndex)) facesByLine.set(face.lineIndex, []);
        facesByLine.get(face.lineIndex).push({ faceIndex, ring: sanitizeRing3D(face.boundary) });
    });
    facesByLine.forEach((entries) => {
        const rings = entries.map((entry) => entry.ring);
        tessellateCoplanarGroups(rings).forEach((polygon) => {
            const order = [polygon.outer].concat(polygon.holes);
            const base = new Map();
            const positions = [];
            let packed = 0;
            order.forEach((ring) => {
                base.set(ring, packed);
                rings[ring].forEach((point) => positions.push(point[0], point[1], point[2]));
                packed += rings[ring].length;
            });
            const indices = polygon.triangles.map((ref) => base.get(ref[0]) + ref[1]);
            fillByFaceIndex.set(entries[polygon.outer].faceIndex, { positions, indices });
        });
    });

    editorState.faces.forEach((face, faceIndex) => {
        const line = sceneData.lines[face.lineIndex];
        const fill = fillByFaceIndex.get(faceIndex);
        if (!line || !line.filled || !fill) {
            editableGeometrySlots.faces[faceIndex] = removeSlot(editableGeometrySlots.faces[faceIndex]);
            return;
        }
        const positions = fill.positions;
        const indices = fill.indices;
        const count = positions.length / 3;
        const colors = new Array(count * 3);
        const alphas = new Array(count);
        for (let i = 0; i < count; i += 1) {
            colors[i * 3] = line.color[0];
            colors[i * 3 + 1] = line.color[1];
            colors[i * 3 + 2] = line.color[2];
            alphas[i] = line.color[3];
        }
        const interactive = !!(line.callbackId || line.hoverColor);
        const data = geometryDataFromArrays(positions, colors, alphas, null, indices);
        editableGeometrySlots.faces[faceIndex] = upsertGeometrySlot(editableGeometrySlots.faces[faceIndex], data, {
            kind: 'editable-face',
            ObjectClass: THREE.Mesh,
            computeNormals: true,
            makeMaterial: () => interactive ? makeInteractiveFillMaterial(line.hoverColor || null) : makeFillMaterial(),
            configureObject: interactive ? ((object, material) => { object.userData.interactiveMat = material; }) : null,
            afterUpdate: interactive ? ((slot) => updateHoverMaterial(slot.material, line.hoverColor || null)) : null
        });
        if (interactive && editableGeometrySlots.faces[faceIndex]?.object) {
            interactiveObjects.push(makeInteractiveEntry(line, [editableGeometrySlots.faces[faceIndex].object]));
        }
    });
    for (let i = sceneData.lines.length; i < editableGeometrySlots.lines.length; i += 1) {
        editableGeometrySlots.lines[i] = removeSlot(editableGeometrySlots.lines[i]);
    }
    for (let i = sceneData.lines.length; i < editableGeometrySlots.points.length; i += 1) {
        editableGeometrySlots.points[i] = removeSlot(editableGeometrySlots.points[i]);
    }
    for (let i = editorState.faces.length; i < editableGeometrySlots.faces.length; i += 1) {
        editableGeometrySlots.faces[i] = removeSlot(editableGeometrySlots.faces[i]);
    }
    editableGeometrySlots.lines.length = sceneData.lines.length;
    editableGeometrySlots.points.length = sceneData.lines.length;
    editableGeometrySlots.faces.length = editorState.faces.length;
}

function hexToRgbArray(hex) {
    return [
        ((hex >> 16) & 255) / 255,
        ((hex >> 8) & 255) / 255,
        (hex & 255) / 255
    ];
}

function handleSpriteSizePx(item, selected) {
    const base = item.role === 'control' ? HANDLE_CONTROL_SIZE_PX : HANDLE_ANCHOR_SIZE_PX;
    return base + (selected ? HANDLE_SELECTED_BONUS_PX : 0);
}

function makeHandlePointMaterial() {
    return new THREE.ShaderMaterial({
        uniforms: {
            uPixelRatio: { value: getDpr() }
        },
        vertexShader: `
            attribute vec3 fillColor;
            attribute vec3 strokeColor;
            attribute float size;
            varying vec3 vFillColor;
            varying vec3 vStrokeColor;
            uniform float uPixelRatio;
            void main() {
                vFillColor = fillColor;
                vStrokeColor = strokeColor;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = max(size * uPixelRatio, 2.0);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying vec3 vFillColor;
            varying vec3 vStrokeColor;
            void main() {
                vec2 uv = gl_PointCoord - vec2(0.5);
                float radius = length(uv);
                float alpha = 1.0 - smoothstep(0.43, 0.5, radius);
                if (alpha <= 0.001) discard;
                float ring = smoothstep(0.31, 0.40, radius);
                vec3 color = mix(vFillColor, vStrokeColor, ring);
                gl_FragColor = vec4(color, alpha);
            }
        `,
        transparent: true,
        depthTest: false,
        depthWrite: false
    });
}

function createHandleSprites(items, selectedRefKeys) {
    if (!items.length) return;
    const positions = [];
    const fillColors = [];
    const strokeColors = [];
    const sizes = [];

    items.forEach((item) => {
        const refKey = pointRefKey(item.pointRefs[0]);
        const selected = selectedRefKeys.has(refKey) || editorState.selection.has(item.key);
        const fill = hexToRgbArray(item.role === 'control' ? 0x0f1a22 : 0x081117);
        const stroke = hexToRgbArray(selected ? 0xffd35c : 0x62d7ff);
        positions.push(item.x, item.y, item.z);
        fillColors.push(fill[0], fill[1], fill[2]);
        strokeColors.push(stroke[0], stroke[1], stroke[2]);
        sizes.push(handleSpriteSizePx(item, selected));
    });

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('fillColor', new THREE.Float32BufferAttribute(fillColors, 3));
    geometry.setAttribute('strokeColor', new THREE.Float32BufferAttribute(strokeColors, 3));
    geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
    geometry.computeBoundingSphere();

    const points = new THREE.Points(geometry, makeHandlePointMaterial());
    points.renderOrder = 30;
    editorOverlayRoot.add(points);
}

function renderEditableOverlay() {
    requestRender();
    clearGroup(editorOverlayRoot);
    editableHitObjects = [];
    if (editorState.mode !== 'edit' || !editorState.scene || !editorState.uiVisible) {
        updateSelectionStatus();
        return;
    }

    const selectedRefKeys = new Set(selectionRefs(editorState).map(pointRefKey));
    const visibleControls = editorState.mask.point || selectedRefKeys.size > 0;
    const sceneData = editorState.scene;

    editorState.faces.forEach((face) => {
        const geometry = buildFaceGeometry(face.boundary);
        if (!geometry) return;
        if (editorState.selection.has(face.key)) {
            const selectedMesh = new THREE.Mesh(geometry.clone(), new THREE.MeshBasicMaterial({
                color: new THREE.Color(1.0, 0.83, 0.36),
                transparent: true,
                opacity: 0.16,
                side: THREE.DoubleSide,
                depthTest: false,
                depthWrite: false
            }));
            selectedMesh.renderOrder = 20;
            editorOverlayRoot.add(selectedMesh);
        }
        if (editorState.mask.face) {
            const hitMesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.0, side: THREE.DoubleSide, depthWrite: false }));
            hitMesh.userData.itemKey = face.key;
            editableHitObjects.push(hitMesh);
            editorOverlayRoot.add(hitMesh);
        }
    });

    editorState.edges.forEach((edge) => {
        if (editorState.selection.has(edge.key)) {
            const geometry = buildSegmentsGeometry(edge.points, [1.0, 0.83, 0.36], 0.95);
            if (geometry) {
                const line = new THREE.LineSegments(geometry, makeLineMaterial());
                line.renderOrder = 21;
                line.material.depthTest = false;
                editorOverlayRoot.add(line);
            }
        }
        if (editorState.mask.edge) {
            const geometry = buildSegmentsGeometry(edge.points, [1, 1, 1], 0.0);
            if (geometry) {
                const hitLine = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({ transparent: true, opacity: 0.0 }));
                hitLine.userData.itemKey = edge.key;
                editableHitObjects.push(hitLine);
                editorOverlayRoot.add(hitLine);
            }
        }
    });

    if (visibleControls) {
        sceneData.lines.forEach((line) => {
            let previousAnchor = null;
            line.nodes.forEach((node) => {
                if (node.kind === 'move') {
                    previousAnchor = node.to;
                    return;
                }
                if (node.kind === 'line') {
                    previousAnchor = node.to;
                    return;
                }
                if (node.kind === 'cubic' && previousAnchor) {
                    const leftGeometry = buildSegmentsGeometry([previousAnchor, node.c1], [0.53, 0.75, 0.84], 0.42);
                    const rightGeometry = buildSegmentsGeometry([node.to, node.c2], [0.53, 0.75, 0.84], 0.42);
                    if (leftGeometry) editorOverlayRoot.add(new THREE.LineSegments(leftGeometry, makeLineMaterial()));
                    if (rightGeometry) editorOverlayRoot.add(new THREE.LineSegments(rightGeometry, makeLineMaterial()));
                    previousAnchor = node.to;
                } else if (node.kind === 'cubic') {
                    previousAnchor = node.to;
                } else if (node.kind === 'close') {
                    previousAnchor = null;
                }
            });
        });
    }

    if (visibleControls) {
        createHandleSprites(editorState.points, selectedRefKeys);
        editorState.points.forEach((item) => {
            if (editorState.mask.point) {
                editableHitObjects.push({ isScreenPointHandle: true, item });
            }
        });
    }

    updateSelectionStatus();
}

function rebuildEditableView() {
    if (!editorState.scene) {
        clearGroup(editorOverlayRoot);
        updateSelectionStatus();
        return;
    }
    const derived = buildEditorItems(editorState.scene);
    editorState.items = derived.items;
    editorState.points = derived.points;
    editorState.edges = derived.edges;
    editorState.faces = derived.faces;
    renderEditableBaseGeometry();
    renderEditableOverlay();
}

// ---------------------------------------------------------------------------------------------
// The inspector: measure, section, explode.
//
// Everything *geometric* below is a call into one of the three marked regions above
// (`inspector-measure`, `inspector-explode`, `inspector-section`), which are lifted out of this file
// and executed on GraalJS by the three `ThreeInspector*DifferentialTest`s. What is left here is the
// three.js and DOM plumbing that cannot be lifted: buffers, materials, sprites, sliders. That split is
// deliberate and it is where the honesty line sits — if the arithmetic is wrong, a test fails; if the
// *sprite* is empty, only a docs capture would notice, which is why `public/docs/three_inspector.md`
// carries a real screenshot rather than a claim.
// ---------------------------------------------------------------------------------------------

const inspectorRoot = new THREE.Group();
scene.add(inspectorRoot);

const inspectorGroupEl = document.getElementById('inspector-group');
const inspectorStatusEl = document.getElementById('inspector-status');
const explodeSliderEl = document.getElementById('explode-slider');
const explodeReadoutEl = document.getElementById('explode-readout');
const sectionSliderEl = document.getElementById('section-slider');
const sectionSliderWrapEl = document.getElementById('section-slider-wrap');

const DIMENSION_COLOR = 0xffd35c;
const CUT_COLOR = 0x62d7ff;

const inspectorState = {
    spec: null,
    bounds: null,
    diagonal: 1,
    // The geometry as the server sent it. Every explode is computed from *this*, never from the last
    // frame's positions — accumulating displacements is how a scrubbed slider drifts.
    base: { lines: null, fills: null, points: null },
    groups: { lines: null, fills: null, points: null },
    interactive: [],
    centroids: [],
    explodeAmount: 0,
    explodeMax: 1,
    sectionEnabled: false,
    sectionFraction: 0.5,
    cut: null,
    measuring: false,
    pending: null,
    picked: [],
    hidden: new Set(),
    assemblyStep: null,
    selectedPart: null,
    selectedTriangle: null,
    selection: null
};

function inspectorDiagonal(bounds) {
    if (!bounds || !bounds.min || !bounds.max) return 1;
    const dx = bounds.max[0] - bounds.min[0];
    const dy = bounds.max[1] - bounds.min[1];
    const dz = bounds.max[2] - bounds.min[2];
    return Math.max(1e-6, Math.sqrt(dx * dx + dy * dy + dz * dz));
}

/**
 * Take a copy of the geometry the server sent, and work out each assembly group's centroid once.
 *
 * The centroids are of the *assembled* figure and never change while the slider moves, so they are
 * computed here rather than per frame. They are also computed over every buffer at once — batched
 * lines, fills, points and each interactive object — because a group whose stroke is in one buffer and
 * whose fill is in another must have one centroid, not two.
 */
function inspectorCapture(payload) {
    featurePayload=payload; featureSourceCache=null; partSolo=null;
    const spec = payload.inspector || {enabled:false,artifactDigest:payload.revision,section:{},renderOrigin:[0,0,0]};
    const sameArtifact = spec && inspectorState.spec && spec.artifactDigest && spec.artifactDigest === inspectorState.spec.artifactDigest;
    if (!sameArtifact) { inspectorState.hidden = new Set(); inspectorState.assemblyStep = null; inspectorState.selectedPart = null; inspectorState.selectedTriangle = null; inspectorState.selection = null; featureNoteEl.value=''; }
    inspectorState.spec = spec;
    inspectorState.bounds = payload.bounds || null;
    inspectorState.diagonal = inspectorDiagonal(payload.bounds);
    inspectorState.picked = [];
    inspectorState.interactive = [];
    ['lines', 'fills', 'points'].forEach((key) => {
        const data = payload[key];
        const position = data && data.attributes && data.attributes.position;
        const group = data && data.attributes && data.attributes.group;
        inspectorState.base[key] = position ? Float32Array.from(position.array) : null;
        inspectorState.groups[key] = group ? Float32Array.from(group.array) : null;
    });
    (payload.interactive || []).forEach((obj, index) => {
        inspectorState.interactive.push({ index: index, group: Number.isFinite(obj.group) ? obj.group : -1 });
    });

    if (!spec || !spec.enabled) {
        inspectorState.centroids = [];
        return;
    }

    // one long buffer, so `explodeGroupCentroids` sees the whole assembly
    const allPositions = [];
    const allGroups = [];
    ['lines', 'fills', 'points'].forEach((key) => {
        const base = inspectorState.base[key];
        const groups = inspectorState.groups[key];
        if (!base || !groups) return;
        for (let i = 0; i < groups.length; i += 1) {
            allPositions.push(base[i * 3], base[i * 3 + 1], base[i * 3 + 2]);
            allGroups.push(groups[i]);
        }
    });
    (payload.interactive || []).forEach((obj) => {
        const group = Number.isFinite(obj.group) ? obj.group : -1;
        if (group < 0) return;
        ['lines', 'fills', 'points'].forEach((key) => {
            const array = obj[key] && obj[key].attributes && obj[key].attributes.position
                ? obj[key].attributes.position.array : null;
            if (!array) return;
            for (let i = 0; i + 2 < array.length; i += 3) {
                allPositions.push(array[i], array[i + 1], array[i + 2]);
                allGroups.push(group);
            }
        });
    });
    // Drawables contribute to their group's centroid too, or a solid grouped with an FLine annotation
    // would slide to the annotation's centroid rather than to the pair's.
    (payload.drawables || []).forEach((d) => {
        const group = Number.isFinite(d.group) ? d.group : -1;
        if (group < 0) return;
        const array = d.geometry && d.geometry.attributes && d.geometry.attributes.position
            ? d.geometry.attributes.position.array : null;
        if (!array) return;
        for (let i = 0; i + 2 < array.length; i += 3) {
            const point = new THREE.Vector3(array[i], array[i + 1], array[i + 2]);
            if (d.transform) point.applyMatrix4(new THREE.Matrix4().fromArray(d.transform));
            allPositions.push(point.x, point.y, point.z);
            allGroups.push(group);
        }
    });
    inspectorState.centroids = explodeGroupCentroids(
        allPositions, allGroups, (spec.groups || []).length
    ).centroids;
}

/** Every geometry the explode has to move, as `{ object, base, groups }`. */
function inspectorMovableSlots() {
    const out = [];
    ['lines', 'fills', 'points'].forEach((key) => {
        const slot = payloadGeometrySlots[key];
        if (!slot || !slot.object) return;
        out.push({ object: slot.object, base: inspectorState.base[key], groups: inspectorState.groups[key] });
    });
    return out;
}

/**
 * Every material a section has to cut: the fills, the strokes and the point sprites.
 *
 * The fills are `MeshStandardMaterial` and clip for free. The other two are custom `ShaderMaterial`s
 * and carry three.js's clipping chunks explicitly — see `makeLineMaterial`. Getting them all is the
 * difference between a section and a clipped fill with the wireframe still hanging in the air past the
 * cut.
 *
 * The inspector's own overlay (`inspectorRoot`) is deliberately *not* here: the cut line and the
 * dimensions are annotations about the section and must survive it.
 */
function inspectorClippableMaterials() {
    const out = [];
    ['lines', 'fills', 'points'].forEach((key) => {
        const slot = payloadGeometrySlots[key];
        if (slot && slot.material) out.push(slot.material);
    });
    payloadGeometrySlots.interactive.forEach((slot) => {
        if (!slot) return;
        ['lines', 'fills', 'points'].forEach((key) => {
            if (slot[key] && slot[key].material) out.push(slot[key].material);
        });
    });
    // And the drawables — the solids. Without this a section cut the FLine annotations and left the
    // mesh they annotate standing whole in front of them, which reads as the section being broken
    // rather than as the section not applying to meshes. The wireframe overlay is a separate material
    // on a child object and has to be told separately, or the cut face keeps its grid of triangles
    // floating past the plane.
    payloadGeometrySlots.drawables.forEach((slot) => {
        if (!slot) return;
        if (slot.material) out.push(slot.material);
        if (slot.wire && slot.wire.material) out.push(slot.wire.material);
    });
    return out;
}

/** Displace every buffer from its base copy. Idempotent, and exact at `amount = 0`. */
function inspectorApplyExplode() {
    const spec = inspectorState.spec;
    if (!spec || !spec.enabled) return;
    const explode = spec.explode || {};
    const offsets = explodeOffsets(
        inspectorState.centroids,
        explodeBoundsCentre(inspectorState.bounds),
        { amount: inspectorState.explodeAmount, mode: explode.mode || 'radial', axis: explode.axis || [0, 1, 0] }
    );
    inspectorMovableSlots().forEach((slot) => {
        if (!slot.base) return;
        const attribute = slot.object.geometry.getAttribute('position');
        if (!attribute) return;
        explodeApply(slot.base, slot.groups, offsets, attribute.array);
        attribute.needsUpdate = true;
        slot.object.geometry.computeBoundingSphere();
    });
    // A drawable's group is a single number on the whole drawable, exactly as an interactive object's
    // is, so it moves the same way — by `object.position` rather than by rewriting a vertex buffer.
    // Which is also the only way it *could* move: a drawable carries no per-vertex `group` attribute,
    // and before this it simply stood still while the FLines around it came apart.
    payloadGeometrySlots.drawables.forEach((slot) => {
        if (!slot || !slot.object) return;
        const group = Number.isFinite(slot.group) ? slot.group : -1;
        let offset = (group >= 0 && group < offsets.length) ? offsets[group] : [0, 0, 0];
        if (inspectorState.assemblyStep !== null && (spec.assembly || []).length) {
            const index = spec.assembly.findIndex(m => m.part === slot.partId || m.part === (spec.groups || [])[group]);
            if (index >= 0) {
                const fraction = Math.max(0, Math.min(1, index + 1 - inspectorState.assemblyStep));
                offset = spec.assembly[index].displacement.map(v => v * fraction);
            } else offset = [0,0,0];
        }
        if (slot.object.matrixAutoUpdate === false) {
            slot.object.matrix.copy(slot.baseMatrix);
            slot.object.matrix.elements[12] += offset[0];
            slot.object.matrix.elements[13] += offset[1];
            slot.object.matrix.elements[14] += offset[2];
            slot.object.matrixWorldNeedsUpdate = true;
        } else slot.object.position.set(offset[0], offset[1], offset[2]);
        slot.object.visible = !inspectorState.hidden.has(slot.partId);
    });
    // An interactive object is one FLine, so its group is uniform: move the whole object.
    inspectorState.interactive.forEach((entry) => {
        const slot = payloadGeometrySlots.interactive[entry.index];
        if (!slot) return;
        const offset = (entry.group >= 0 && entry.group < offsets.length) ? offsets[entry.group] : [0, 0, 0];
        [slot.lines, slot.fills, slot.points].forEach((piece) => {
            if (piece && piece.object) piece.object.position.set(offset[0], offset[1], offset[2]);
        });
    });
}

/** Turn clipping on or off, and recompute the plane from the current slider position. */
function inspectorApplySection() {
    const spec = inspectorState.spec;
    const section = (spec && spec.section) || {};
    const active = !!inspectorState.sectionEnabled;
    renderer.localClippingEnabled = active;
    inspectorState.cut = active
        ? sectionPlane(inspectorState.bounds, section.normal || [1, 0, 0], inspectorState.sectionFraction, !!section.flip)
        : null;
    const planes = inspectorState.cut
        ? [new THREE.Plane(
            new THREE.Vector3(inspectorState.cut.n[0], inspectorState.cut.n[1], inspectorState.cut.n[2]),
            inspectorState.cut.d
        )]
        : [];
    inspectorClippableMaterials().forEach((material) => {
        material.clippingPlanes = planes;
        material.clipShadows = false;
        material.needsUpdate = true;
    });
}

/**
 * A text label as a camera-facing sprite, drawn into a canvas.
 *
 * A sprite rather than a DOM overlay because a dimension belongs *in* the scene — it has to orbit with
 * the figure and end up on the docs capture, and an absolutely-positioned div does neither. `depthTest`
 * off and a high `renderOrder` because a dimension you cannot see behind the thing it dimensions is not
 * a dimension.
 */
function inspectorLabelSprite(text, height, color) {
    const scale = 4;
    const fontPx = 30;
    const canvas = document.createElement('canvas');
    const measurer = canvas.getContext('2d');
    measurer.font = `500 ${fontPx * scale}px "Iosevka Web", ui-monospace, Menlo, monospace`;
    const padding = 12 * scale;
    const width = Math.ceil(measurer.measureText(text).width) + padding * 2;
    canvas.width = width;
    canvas.height = Math.ceil(fontPx * scale * 1.6);
    const ctx = canvas.getContext('2d');
    ctx.font = `500 ${fontPx * scale}px "Iosevka Web", ui-monospace, Menlo, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(8, 12, 18, 0.82)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2 * scale;
    ctx.strokeRect(scale, scale, canvas.width - 2 * scale, canvas.height - 2 * scale);
    ctx.fillStyle = color;
    ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 2 * scale);
    const texture = new THREE.CanvasTexture(canvas);
    texture.anisotropy = 4;
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        depthWrite: false
    }));
    sprite.scale.set(height * (canvas.width / canvas.height), height, 1);
    sprite.renderOrder = 1000;
    return sprite;
}

function inspectorAddSegments(points, color, width) {
    if (!points.length) return;
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(Float32Array.from(points), 3));
    const line = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.95,
        depthTest: false,
        linewidth: width || 1
    }));
    line.renderOrder = 999;
    inspectorRoot.add(line);
}

/**
 * Draw one dimension: witness lines back to the geometry, the dimension line itself, end ticks and the
 * number.
 *
 * The geometry all comes from `measureAnnotation`, which is under differential test; what is added here
 * is only the tick length and the choice of colour.
 */
function inspectorDrawMeasurement(elementA, elementB, prefix) {
    const answer = measureClosestApproach(elementA, elementB);
    if (!answer || !answer.from || !isFinite(answer.distance)) return null;
    const spec = inspectorState.spec || {};
    const offset = inspectorState.diagonal * 0.07;
    const view = camera.getWorldDirection(new THREE.Vector3());
    const annotation = measureAnnotation(answer.from, answer.to, [view.x, view.y, view.z], offset);

    const points = [];
    annotation.witness.forEach((pair) => points.push(...pair[0], ...pair[1]));
    points.push(...annotation.a, ...annotation.b);
    // end ticks, along the measured direction, so the dimension reads as a dimension and not as a stray
    const tick = inspectorDiagonalTick();
    [annotation.a, annotation.b].forEach((end) => {
        points.push(
            end[0] - annotation.direction[0] * tick, end[1] - annotation.direction[1] * tick, end[2] - annotation.direction[2] * tick,
            end[0] + annotation.direction[0] * tick, end[1] + annotation.direction[1] * tick, end[2] + annotation.direction[2] * tick
        );
    });
    inspectorAddSegments(points, DIMENSION_COLOR);

    const text = (prefix || '') + measureFormat(annotation.distance, spec.units || '', spec.decimals);
    // 7.5% of the figure's diagonal. Sized against the *figure* rather than in pixels because the
    // label lives in the scene: a pixel size would grow as you dolly in and shrink to nothing as you
    // pull out, and the one thing a dimension has to stay is readable.
    const sprite = inspectorLabelSprite(text, inspectorState.diagonal * 0.075, '#ffd35c');
    sprite.position.set(annotation.label[0], annotation.label[1], annotation.label[2]);
    inspectorRoot.add(sprite);
    return text;
}

function inspectorDiagonalTick() {
    return inspectorState.diagonal * 0.012;
}

/** Where the plane crosses the figure, drawn over the clipped geometry. */
function inspectorDrawCut() {
    const spec = inspectorState.spec;
    const cut = inspectorState.cut;
    if (!cut || !spec || !(spec.section && spec.section.outline !== false)) return 0;
    const outline = [];
    const fills = payloadGeometrySlots.fills;
    if (fills && fills.object) {
        const geometry = fills.object.geometry;
        const position = geometry.getAttribute('position');
        const index = geometry.getIndex();
        outline.push(...sectionCutTriangles(position.array, index ? index.array : null, cut));
    }
    payloadGeometrySlots.interactive.forEach((slot) => {
        if (!slot || !slot.fills || !slot.fills.object) return;
        const geometry = slot.fills.object.geometry;
        const offset = slot.fills.object.position;
        const position = geometry.getAttribute('position');
        const index = geometry.getIndex();
        // the object may have been translated by the explode; the cut is in world space
        const moved = new Float32Array(position.array.length);
        for (let i = 0; i + 2 < moved.length; i += 3) {
            moved[i] = position.array[i] + offset.x;
            moved[i + 1] = position.array[i + 1] + offset.y;
            moved[i + 2] = position.array[i + 2] + offset.z;
        }
        outline.push(...sectionCutTriangles(moved, index ? index.array : null, cut));
    });
    // The solids. Same treatment as an interactive object's fills, and for the same reason: the cut is
    // in world space and the explode may have moved the object out from under it. Without this a
    // section through a scene with a mesh in it drew a cut line round the annotations and none round
    // the thing being annotated, which is the half that a fabricator cares about.
    payloadGeometrySlots.drawables.forEach((slot) => {
        if (!slot || !slot.object || slot.kindOfDraw !== 'surface' || inspectorState.hidden.has(slot.partId)) return;
        const geometry = slot.object.geometry;
        const position = geometry.getAttribute('position');
        if (!position) return;
        const index = geometry.getIndex();
        const offset = slot.object.position;
        const moved = new Float32Array(position.array.length);
        for (let i = 0; i + 2 < moved.length; i += 3) {
            moved[i] = position.array[i] + offset.x;
            moved[i + 1] = position.array[i + 1] + offset.y;
            moved[i + 2] = position.array[i + 2] + offset.z;
        }
        outline.push(...sectionCutTriangles(moved, index ? index.array : null, cut));
    });
    inspectorAddSegments(outline, CUT_COLOR, 2);

    const marks = [];
    const lines = payloadGeometrySlots.lines;
    if (lines && lines.object) {
        marks.push(...sectionCutSegments(lines.object.geometry.getAttribute('position').array, cut));
    }
    if (marks.length) {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(Float32Array.from(marks), 3));
        const dots = new THREE.Points(geometry, new THREE.PointsMaterial({
            color: CUT_COLOR, size: 7, sizeAttenuation: false, depthTest: false
        }));
        dots.renderOrder = 999;
        inspectorRoot.add(dots);
    }
    return sectionCutLength(outline);
}

/** An element the user picked, resolved through the hit-picking region when there is a topology. */
function inspectorElementFromHit(entry, hit) {
    const p = hit.point;
    // A solid resolves first, and to the *same three shapes*. This is where pick-to-measure stops
    // being an FLine feature: `measureClosestApproach` below is handed a polygon from a mesh triangle
    // and a polygon from an FLine face and has no idea the two came from different worlds.
    const found = surfaceHitFor(entry, hit);
    if (found) {
        const points = surfacePickElementPoints(found.tri, found.record);
        if (points) {
            const kind = points.length === 1 ? 'point' : (points.length === 2 ? 'segment' : 'polygon');
            return measureElement(kind, points);
        }
    }
    const role = flineRoleForObject(hit.object);
    const topology = entry && entry.topology;
    if (topology) {
        const record = flinePickClassify(topology, role, [p.x, p.y, p.z]);
        if (role === 'face') {
            const face = (topology.faces || []).find((f) => f.e === record.elementIndex);
            if (face && face.pts && face.pts.length >= 3) return measureElement('polygon', face.pts);
        }
        if (role === 'edge') {
            const segment = (topology.segments || []).find((s) => s.e === record.elementIndex);
            if (segment && segment.a && segment.b) return measureElement('segment', [segment.a, segment.b]);
        }
        if (record.onElement) return measureElement('point', [record.onElement]);
    }
    return measureElement('point', [[p.x, p.y, p.z]]);
}

function inspectorSetStatus(text) {
    inspectorStatusEl.textContent = text || '';
}

/** Rebuild every overlay: the authored dimensions, the picked one, the cut. */
function inspectorRebuildOverlay() {
    requestRender();
    clearGroup(inspectorRoot);
    const spec = inspectorState.spec;
    featureDraw(); featureHud();
    if (!spec || !spec.enabled) return;
    const lines = [];
    (spec.measurements || []).forEach((m) => {
        const text = inspectorDrawMeasurement(
            measureElement(m.a.kind, m.a.points),
            measureElement(m.b.kind, m.b.points),
            m.label
        );
        if (text) lines.push(text);
    });
    if (inspectorState.picked.length === 2) {
        const text = inspectorDrawMeasurement(inspectorState.picked[0], inspectorState.picked[1], '');

function frameBounds(bounds, pad = 1.25) {
    if (!bounds || !bounds.min || !bounds.max) return;
    const minV = new THREE.Vector3(...bounds.min);
    const maxV = new THREE.Vector3(...bounds.max);
    const size = new THREE.Vector3().subVectors(maxV, minV);
    const center = new THREE.Vector3().addVectors(minV, maxV).multiplyScalar(0.5);
    const maxDim = Math.max(size.x, size.y, size.z, 0.001);
    const fov = THREE.MathUtils.degToRad(camera.fov);
    const distance = (maxDim / (2 * Math.tan(fov / 2))) * pad;
    const direction = new THREE.Vector3(0.8, 0.9, 1.1).normalize();
    camera.position.copy(center.clone().add(direction.multiplyScalar(distance)));
    camera.near = Math.max(distance / 100, 0.001);
    camera.far = Math.max(distance * 100, camera.near + 1);
    camera.updateProjectionMatrix();
    controls.target.copy(center);
    controls.update();
}

// [viewer-region camera-preset] BEGIN
// A SECOND IMPLEMENTATION of VisionGeometryPreview.Camera, and marked as one.
//
// The CPU rasterizer and this viewer have to frame a mesh identically, or every docs figure shifts
// when it changes renderer and the diff is 60 subtly-recomposed pictures. The Kotlin original is
// `VisionGeometryPreview.renderPixels`; this is its transliteration, and
// `ThreeCameraPresetParityTest` runs this very text on GraalJS and holds the two to the same numbers.
//
// Two details that are easy to get wrong and are the reason this is tested rather than trusted:
//
//   * `radius` is half the bounding-box **diagonal**, not half its largest dimension. Using the
//     largest dimension frames a long thin mesh far too close.
//   * yaw drives sin() on x and cos() on z, so yaw 0 / pitch 0 puts the eye on +z looking down -z —
//     which is where the headset puts you, and what MeshView.turntable's angles assume.
function cameraPresetEye(spec, bounds) {
    const min = bounds.min;
    const max = bounds.max;
    const cx = (min[0] + max[0]) / 2;
    const cy = (min[1] + max[1]) / 2;
    const cz = (min[2] + max[2]) / 2;
    const dx = max[0] - min[0];
    const dy = max[1] - min[1];
    const dz = max[2] - min[2];
    const radius = Math.max(1e-4, 0.5 * Math.sqrt(dx * dx + dy * dy + dz * dz));

    const yaw = (spec.yawDegrees || 0) * Math.PI / 180;
    const pitch = (spec.pitchDegrees || 0) * Math.PI / 180;
    const eyeDistance = radius * (spec.distance === undefined ? 2.7 : spec.distance);

    return {
        eye: [
            cx + eyeDistance * Math.cos(pitch) * Math.sin(yaw),
            cy + eyeDistance * Math.sin(pitch),
            cz + eyeDistance * Math.cos(pitch) * Math.cos(yaw)
        ],
        target: [cx, cy, cz],
        radius: radius,
        // The rasterizer's near plane: a twentieth of the radius, which is always well in front of
        // the mesh and keeps the depth buffer's precision where the geometry actually is.
        near: Math.max(1e-5, radius * 0.05),
        far: Math.max(eyeDistance + radius * 4, radius * 0.05 + 1)
    };
}
// [viewer-region camera-preset] END

/**
 * Slide the camera along its own view direction until the geometry fills the frame.
 *
 * # Why this is not just the preset
 *
 * `cameraPresetEye` reproduces the rasterizer exactly, and the rasterizer could afford to be literal:
 * it *chose its own canvas*, so `MeshView(width = 760, height = 470)` really was the frame. A viewer
 * does not get that luxury. A box output is as wide as its column and the disclosure panel picks the
 * height, so the same figure arrives in a band nearer 3.8:1 — and a camera that frames the bounding
 * sphere vertically then leaves two thirds of the width empty and the mesh looking half the size it
 * used to.
 *
 * So the preset supplies the **direction**, and this supplies the **distance**: the smallest one at
 * which all eight corners of the bounding box are still inside the frustum, plus a margin. That is the
 * ordinary "zoom to fit", and it uses the frame that actually exists rather than the one the figure
 * was written against.
 *
 * Only ever applied when the payload named a camera — which is the mesh path. Every FLine payload
 * predates this and keeps auto-framing exactly as before, so no existing capture moves.
 *
 * Iterated rather than solved: moving the eye changes each corner's depth, so the ratio is only
 * locally linear. Four passes is comfortably enough to settle inside the 0.2% early-out.
 */
function fitCameraToBounds(cam, bounds, target, margin, points) {
    // Prefer the geometry's own points to the corners of its bounding box.
    //
    // The box is a bad stand-in for anything that is not a box. Fitting its eight corners makes a
    // cube fill its panel and an octahedron inscribed in the same box fill about half of it, which in
    // a gallery of Platonic solids reads as five shapes at five arbitrary sizes. The rasterizer had
    // the same weakness (it framed the bounding *sphere*) and the old figures show it.
    //
    // `points` is a strided sample capped at FIT_SAMPLE_LIMIT, so this stays cheap enough to run per
    // frame for every panel even when the mesh is the 108k-triangle toy car.
    const corners = [];
    if (points && points.length >= 3) {
        for (let i = 0; i + 2 < points.length; i += 3) {
            corners.push(new THREE.Vector3(points[i], points[i + 1], points[i + 2]));
        }
    } else {
        for (let i = 0; i < 8; i += 1) {
            corners.push(new THREE.Vector3(
                (i & 1) ? bounds.max[0] : bounds.min[0],
                (i & 2) ? bounds.max[1] : bounds.min[1],
                (i & 4) ? bounds.max[2] : bounds.min[2]
            ));
        }
    }
    const focus = new THREE.Vector3(target[0], target[1], target[2]);
    const tanV = Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2);
    const tanH = tanV * (cam.aspect || 1);
    const inverse = new THREE.Matrix4();
    const local = new THREE.Vector3();

    for (let pass = 0; pass < 4; pass += 1) {
        cam.updateMatrixWorld();
        inverse.copy(cam.matrixWorld).invert();
        let worst = 0;
        let behind = false;
        for (const corner of corners) {
            local.copy(corner).applyMatrix4(inverse);
            const depth = -local.z;
            if (depth <= 1e-9) { behind = true; break; }
            worst = Math.max(worst, Math.abs(local.x) / (tanH * depth), Math.abs(local.y) / (tanV * depth));
        }
        // A corner behind the eye means the fit is not meaningful yet; back off and try again.
        if (behind) worst = 2;
        if (worst <= 0) break;
        const scale = worst * margin;
        if (Math.abs(scale - 1) < 0.002) break;
        const direction = cam.position.clone().sub(focus);
        if (direction.lengthSq() < 1e-18) break;
        cam.position.copy(focus.clone().add(direction.multiplyScalar(scale)));
        cam.lookAt(focus);
    }

    const distance = cam.position.distanceTo(focus);
    cam.near = Math.max(1e-5, distance * 0.01);
    cam.far = Math.max(distance * 10, cam.near + 1);
    cam.updateProjectionMatrix();
}

/**
 * Point a camera at geometry using a ThreeCameraSpec. Returns the derived eye/target/radius.
 *
 * @param fit when true, [fitCameraToBounds] then pulls the distance in or out so the geometry fills
 * the frame the viewer was actually given. The spec's `distance` becomes the padding factor.
 */
function applyCameraSpec(cam, spec, bounds, fit, points) {
    if (!spec || !bounds || !bounds.min || !bounds.max) return null;
    const derived = cameraPresetEye(spec, bounds);
    cam.position.set(derived.eye[0], derived.eye[1], derived.eye[2]);
    cam.up.set(0, 1, 0);
    cam.lookAt(derived.target[0], derived.target[1], derived.target[2]);
    cam.fov = spec.fieldOfViewDegrees === undefined ? 40 : spec.fieldOfViewDegrees;
    cam.near = derived.near;
    cam.far = derived.far;
    cam.updateProjectionMatrix();
    if (fit) {
        // 2.7 is MeshView's default distance and frames the bounding sphere with a little air, so it
        // is the multiple that means "no extra padding" here.
        const requested = spec.distance === undefined ? 2.7 : spec.distance;
        fitCameraToBounds(cam, bounds, derived.target, Math.max(1.02, requested / 2.7 * 1.06), points);
    }
    return derived;
}

/** How many vertices a fit samples. Enough to pin a silhouette, small enough to run every frame. */
const FIT_SAMPLE_LIMIT = 512;

/** A strided sample of a geometry's positions, as a flat xyz array. */
function fitSampleOf(geometryData) {
    const source = geometryData?.attributes?.position?.array;
    if (!source || source.length < 3) return null;
    const vertexCount = Math.floor(source.length / 3);
    if (vertexCount <= FIT_SAMPLE_LIMIT) return Float32Array.from(source);
    const stride = Math.ceil(vertexCount / FIT_SAMPLE_LIMIT);
    const out = new Float32Array(Math.ceil(vertexCount / stride) * 3);
    let w = 0;
    for (let v = 0; v < vertexCount; v += stride) {
        out[w] = source[v * 3];
        out[w + 1] = source[v * 3 + 1];
        out[w + 2] = source[v * 3 + 2];
        w += 3;
    }
    return out.subarray(0, w);
}

/** Every fit sample belonging to [panelIndex], concatenated. `-1` drawables belong to every panel. */
function fitPointsForPanel(panelIndex) {
    const parts = payloadGeometrySlots.drawables
        .filter((s) => s && s.fitSample && (panelIndex < 0 || s.panel === -1 || s.panel === panelIndex))
        .map((s) => s.fitSample);
    if (!parts.length) return null;
    if (parts.length === 1) return parts[0];
    let total = 0;
    parts.forEach((p) => { total += p.length; });
    const out = new Float32Array(total);
    let at = 0;
    parts.forEach((p) => { out.set(p, at); at += p.length; });
    return out;
}
