<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Three.js XR - Grab Plane with Hand Input</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <script type="importmap">
      {
        "imports": {
          "three": "../build/three.module.js",
          "three/addons/": "./jsm/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        border: none;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { XRButton } from 'three/addons/webxr/XRButton.js';
      import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
      import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

      let camera, scene, renderer;
      let plane;
      let grabbed = false;
      const grabThreshold = 1.5; // distance threshold to detect a "grab"
      const tempVec1 = new THREE.Vector3();
      const tempVec2 = new THREE.Vector3();

      let hand1, hand2;
      let controllerGrip1, controllerGrip2;

      init();
      animate();

      function init() {
        // Container and scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        // Camera and controls (OrbitControls for debugging on desktop)
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
        camera.position.set(0, 1.6, 3);
        scene.add(camera);

        const controls = new OrbitControls(camera, document.body);
        controls.target.set(0, 1.6, 0);
        controls.update();

        // Renderer setup
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Enable XR with hand-tracking
        const sessionInit = { requiredFeatures: ['hand-tracking'] };
        document.body.appendChild(XRButton.createButton(renderer, sessionInit));

        // Add a simple floor for context
        const floorGeometry = new THREE.PlaneGeometry(4, 4);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x666666 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Basic lighting
        scene.add(new THREE.HemisphereLight(0xbcbcbc, 0xa5a5a5, 3));
        const light = new THREE.DirectionalLight(0xffffff, 3);
        light.position.set(0, 6, 0);
        light.castShadow = true;
        scene.add(light);

        // Create the textured plane (your original object)
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load('https://threejs.org/examples/textures/uv_grid_opengl.jpg');
        const geometry = new THREE.PlaneGeometry(1, 1);
        const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
        plane = new THREE.Mesh(geometry, material);
        plane.position.set(0.0, 1.6, 0.2);
        scene.add(plane);

        // Set up controller models for XR (from the cubes example)
        const controllerModelFactory = new XRControllerModelFactory();
        const handModelFactory = new XRHandModelFactory();

        // Hand 1 (left hand)
        hand1 = renderer.xr.getHand(0);
        hand1.add(handModelFactory.createHandModel(hand1));
        scene.add(hand1);

        // Hand 2 (right hand) – we use this one for grabbing the plane
        hand2 = renderer.xr.getHand(1);
        hand2.addEventListener('pinchstart', onPinchStart);
        hand2.addEventListener('pinchend', onPinchEnd);
        hand2.add(handModelFactory.createHandModel(hand2));
        scene.add(hand2);

        // Optionally add controller grips (for visualization)
        controllerGrip1 = renderer.xr.getControllerGrip(0);
        controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
        scene.add(controllerGrip1);

        controllerGrip2 = renderer.xr.getControllerGrip(1);
        controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
        scene.add(controllerGrip2);

        window.addEventListener('resize', onWindowResize);
      }

      // Check if the hand's index fingertip is close enough to the plane
      function isPlaneHit(hand) {
        const indexTip = hand.joints['index-finger-tip'];
        if (!indexTip) return false;
        indexTip.getWorldPosition(tempVec1);
        plane.getWorldPosition(tempVec2);
        let D = tempVec1.distanceTo(tempVec2)
        console.log("D = ", Math.abs(D))
        return D < grabThreshold;
      }

      // When pinch starts on the right hand, grab the plane if near enough
      function onPinchStart(event) {
        console.log("pinch start ", event, isPlaneHit(hand2), grabbed)
        if (!grabbed && isPlaneHit(hand2)) {
          // Attach the plane to the hand so it follows the hand movement
          console.log("attaching plane to hand2")
          hand2.joints['index-finger-tip'].attach(plane);
          console.log(hand2, plane)
          grabbed = true;
        }
      }

      // On pinch end, release the plane back into the scene
      function onPinchEnd(event) {
        console.log("pinch end ", event, grabbed)
        if (grabbed) {
          // Update world transform and reattach to scene
          plane.matrixWorld.decompose(plane.position, plane.quaternion, plane.scale);
          scene.add(plane);
          grabbed = false;
        }
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        renderer.setAnimationLoop(render);
      }

      function render() {
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
