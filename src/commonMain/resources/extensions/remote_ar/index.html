    <style>
        #touch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.0);
        }
    </style>

</head>

<body>

<a-scene
        xr-mode-ui="enabled: true;XRMode: ar"
        device-orientation-permission-ui="enabled: false"
        renderer="antialias: true; stencil: true;"
        webxr="requiredFeatures:hit-test,local-floor,dom-overlay;referenceSpaceType:local-floor;overlayElement:#overlay;">

    <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" shadow name='banana'></a-sphere>
    <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D" shadow></a-cylinder>
    <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" shadow></a-box>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" shadow></a-plane>
    <a-sphere id="hitter" radius="0.001" color="#4CC3D9" ar-hit-test2 aframe-injected></a-sphere>
</a-scene>

<div id="overlay">
    <div id="touch-overlay"></div>
</div>


<script>

        AFRAME.registerComponent('ar-hit-test2', {
                init: function () {
                        this.xrHitTestSource = null;
                        this.viewerSpace = null;
                        this.refSpace = null;

                        this.el.sceneEl.renderer.xr.addEventListener('sessionend', (ev) => {
                                this.viewerSpace = null;
                                this.refSpace = null;
                                this.xrHitTestSource = null;
                        });
                        this.el.sceneEl.renderer.xr.addEventListener('sessionstart', (ev) => {
                                let session = this.el.sceneEl.renderer.xr.getSession();

                                let element = this.el;
                                // session.addEventListener('select', function () {
                                //         let position = element.getAttribute('position');
                                //
                                //         document.getElementById('dino').setAttribute('position', position);
                                //         document.getElementById('light').setAttribute('position', {
                                //                 x: (position.x - 2),
                                //                 y: (position.y + 4),
                                //                 z: (position.z + 2)
                                //         });
                                // });

                                session.requestReferenceSpace('viewer').then((space) => {
                                        this.viewerSpace = space;
                                        session.requestHitTestSource({space: this.viewerSpace})
                                            .then((hitTestSource) => {
                                                    this.xrHitTestSource = hitTestSource;
                                            });
                                });

                                session.requestReferenceSpace('local-floor').then((space) => {
                                        this.refSpace = space;
                                });
                        });
                },
                tick: function () {
                        if (this.el.sceneEl.is('ar-mode')) {
                                if (!this.viewerSpace) return;

                                let frame = this.el.sceneEl.frame;
                                let xrViewerPose = frame.getViewerPose(this.refSpace);

                                if (this.xrHitTestSource && xrViewerPose) {
                                        let hitTestResults = frame.getHitTestResults(this.xrHitTestSource);
                                        if (hitTestResults.length > 0) {
                                                let pose = hitTestResults[0].getPose(this.refSpace);

                                                let inputMat = new THREE.Matrix4();
                                                inputMat.fromArray(pose.transform.matrix);

                                                let position = new THREE.Vector3();
                                                position.setFromMatrixPosition(inputMat);
                                                this.el.setAttribute('position', position);
                                        }
                                }
                        }
                }
        });

        function uuidv4() {
                return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
                    (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +c / 4).toString(16)
                );
        }

        id = uuidv4()

        _field.evalRequestWS(id, () => {
        })

        function initAFrame() {
                console.log("initAFrame")
                if (!window.AFRAME || !window.AFRAME.scenes || !window.AFRAME.scenes[0]) {
                        console.log("waiting for AFRAME to init")
                        setTimeout(initAFrame, 500);
                        return
                }
                AFRAME.scenes[0].object3D.traverse(function (object) {
                        object.frustumCulled = false;
                });

                enterScene(document.getElementsByTagName('a-scene')[0].object3D,
                    document.getElementsByTagName('a-scene')[0].camera, () => {
                    }, () => {
                    })

                // addTouchCallbacks(document.body, (E) => true)
                addTouchCallbacks(document.querySelector("#touch-overlay"), (E) => true)
                console.log("finished initAFrame")
        }

        initAFrame()

</script>

</body>

</html>
