<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:,">
    <title>Field Remote</title>

    <script src="vendor/aframe/1.8.0/aframe-v1.8.0.min.js"></script>
    <script src="vendor/tone/15.1.22/Tone.js"></script>

    <script src="field/errors.js"></script>
    <script src="field/runners.js"></script>
    <script src="field/maps.js"></script>
    <script src="field/asta.js"></script>
    <script src="field/js-object-pretty-print.js"></script>
    <script src="field/kv.js"></script>

    <script src="ar/portal-button.js"></script>
    <script src="ar/plyloader.js"></script>
    <script src="ar/files.js"></script>
    <script src="ar/tess2.js"></script>
    <script src="ar/graphics.js"></script>
    <script src="ar/fline.js"></script>

    <script src="field/completion.js"></script>
    <script src="field/field.js"></script>
    <script src="ar/webxr.js"></script>
    <script src="field/head.js"></script>

    <style>
        :root {
            color-scheme: dark;
            font-family: Iosevka, "Iosevka Web", ui-monospace, SFMono-Regular, Menlo, monospace;
            background: #000;
            color: #f2f2f2;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            touch-action: none;
        }

        #touch-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: transparent;
            touch-action: none;
        }

        #field-remote-status {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            left: max(10px, env(safe-area-inset-left));
            z-index: 3;
            display: none;
            padding: 5px 7px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            background: #000;
            color: #fff;
            font-size: 10px;
            line-height: 1.35;
            letter-spacing: 0.02em;
            white-space: pre;
            pointer-events: none;
        }

        html[data-debug="true"] #field-remote-status {
            display: block;
        }
    </style>
</head>
<body>
<a-scene
        embedded
        background="transparent: true"
        renderer="alpha: true; antialias: true; stencil: true; colorManagement: true"
        xr-mode-ui="enabled: true; XRMode: ar"
        device-orientation-permission-ui="enabled: false"
        webxr="requiredFeatures: local-floor; optionalFeatures: hit-test,dom-overlay,anchors; referenceSpaceType: local-floor; overlayElement: #touch-overlay">
    <a-entity id="field-xr-hit" field-xr-hit-test visible="false"></a-entity>
</a-scene>

<div id="touch-overlay" aria-label="Field remote interaction surface"></div>
<output id="field-remote-status" aria-live="polite">booting</output>

<script>
    (function () {
        "use strict";
        const parameters = new URL(window.location.href).searchParams;
        document.documentElement.dataset.debug = parameters.get("debug") === "1" ? "true" : "false";

        function uuid() {
            if (crypto.randomUUID) return crypto.randomUUID();
            return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (character) =>
                (+character ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +character / 4).toString(16)
            );
        }

        const scene = document.querySelector("a-scene");
        scene.addEventListener("loaded", function () {
            scene.object3D.traverse((object) => { object.frustumCulled = false; });
            enterScene(scene.object3D, scene.camera, function () {}, function () {});
            const canvas = scene.canvas || scene.querySelector("canvas");
            const overlay = document.getElementById("touch-overlay");
            addTouchCallbacks(canvas, () => true);
            addTouchCallbacks(overlay, () => true);
            _field.evalRequestWS(uuid(), function () {});
            __fieldRemoteHead.markReady();
        }, {once: true});
    })();
</script>
</body>
</html>
