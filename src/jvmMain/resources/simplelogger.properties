# Silence Ktor's default startup INFO logs (e.g. "Application started...", "Responding at ...").
org.slf4j.simpleLogger.log.io.ktor.server.Application=warn

# Smile's t-SNE logs its cost every tenth iteration at INFO (~75 lines a fit); smileTsne reports the final cost itself.
org.slf4j.simpleLogger.log.smile.manifold.TSNE=warn
