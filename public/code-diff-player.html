<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Diff Player</title>
  <link rel="stylesheet" href="iosevka.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/stackoverflow-dark.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #151822;
      --text: #e8ecf2;
      --accent: #5bd0ff;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Iosevka Web", "Iosevka", "IBM Plex Mono", "SFMono-Regular", "JetBrains Mono", "Menlo", "Consolas", system-ui, -apple-system, sans-serif;
      background: #1b1c1f;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 24px 64px;
    }

    button {
      border: none;
      background: transparent;
      color: inherit;
      padding: 0;
      border-radius: 0;
      font: inherit;
      letter-spacing: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0;
      box-shadow: none;
      transition: none;
    }

    button:hover { box-shadow: none; transform: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .shell {
      width: min(960px, 100%);
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
    }

    .top-bar { display: none; }

    .code-wrap {
      position: relative;
      padding: 0;
      background: transparent;
    }

    .code-actions-top {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 10px;
      z-index: 2;
    }

    .code-actions-bottom {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 2;
    }

    .action-btn {
      border: none;
      background: transparent;
      color: #d7dce2;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: none;
    }

    .action-btn:hover { background: rgba(255,255,255,0.05); }
    .action-btn:active { background: rgba(255,255,255,0.07); }

    .md-clipboard.md-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 8px;
      border: none;
      background: transparent;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="%23d7dce2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/><path d="M9 3h6"/></svg>');
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
    }

    .md-clipboard.md-icon:hover { background: rgba(255,255,255,0.05); }
    .md-clipboard.md-icon:active { background: rgba(255,255,255,0.07); }

    pre {
      margin: 0;
      border-radius: 6px;
      padding: 14px 16px;
      background: linear-gradient(to right, #1b1c1f 0, #1b1c1f 46px, #1f2023 46px, #1f2023 100%);
      position: relative;
      font-size: 15px;
      line-height: 1.4;
      overflow-x: auto;
      border: none;
      box-shadow: none;
      white-space: pre;
      font-family: "Iosevka Web", "Iosevka", "IBM Plex Mono", "SFMono-Regular", "JetBrains Mono", "Menlo", "Consolas", system-ui, -apple-system, sans-serif;
      isolation: isolate;
    }


    code {
          font-family: "Iosevka Web", "Iosevka", "IBM Plex Mono", "SFMono-Regular", "JetBrains Mono", "Menlo", "Consolas", system-ui, -apple-system, sans-serif;
          font-weight: 500;
    }

    pre.flash-insert { box-shadow: 0 0 0 2px rgba(91, 208, 255, 0.35); }
    pre.flash-delete { box-shadow: 0 0 0 2px rgba(255, 90, 95, 0.35); }

    /* mkdocs-like syntax colours */
    .hljs { color: #d7dce2; }
    .hljs-keyword, .hljs-built_in, .hljs-selector-tag { color: #7aa2f7; font-weight: 600; }
    .hljs-string, .hljs-attr { color: #8ccf7e; }
    .hljs-number, .hljs-literal { color: #ff6b6b; }
    .hljs-attribute, .hljs-title, .hljs-variable { color: #d7dce2; }
    .hljs-comment { font-style: italic; font-weight: 100; color: #7b8491; font-style: normal; opacity: 0.9; }
    
    .code-line {
      display: grid;
      grid-template-columns: 46px 1fr;
      align-items: flex-start;
      white-space: pre;
      margin: 0;
      padding: 0;
      line-height: 1.32;
      position: relative;
      overflow: visible;
    }

    .line-no {
      text-align: right;
      color: #5c6573;
      user-select: none;
      font-variant-numeric: tabular-nums;
      padding: 0 10px 0 6px;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: flex-start;
    }

    .code-text {
      display: block;
      white-space: pre;
      min-width: 0;
    }

    .code-line .hljs-comment {
      float: right;
      padding-left: 12px;
      margin-left: 12px;
    }

    .code-line .marker {
      position: absolute;
      left: 0px;
      top: 0;
      width: 8px;
      height: 18px;
      border-radius: 4px;
      background: rgba(91, 208, 255, 0.2);
    }
    .marker-insert { background: rgba(80, 200, 120, 0.25); }
    .marker-delete { background: rgba(255, 90, 95, 0.25); }
    .marker-replace { background: rgba(255, 200, 95, 0.22); }

    .code-line.inserted { animation: fadeIn 520ms ease; background: rgba(80, 200, 120, 0.18); }
    .code-line.deleting { animation: fadeOut 420ms ease; background: rgba(255, 90, 95, 0.16); }
    .code-line.closing { animation: collapse 240ms ease forwards; transform-origin: top; }

    .ch-ins { background: rgba(80, 200, 120, 0.25); }
    .ch-del { background: rgba(255, 90, 95, 0.25); text-decoration: line-through; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(0); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0.35; }
    }

    @keyframes collapse {
      from { opacity: 0.35; height: 1.32em; }
      to { opacity: 0; height: 0; margin: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top-bar"></div>

    <div class="code-wrap">
      <div class="code-actions-top">
        <button id="copy" style="padding:20px;" class="md-clipboard md-icon" title="Copy to clipboard" aria-label="Copy code"></button>
      </div>
      <div class="code-actions-bottom">
        <button id="play" class="action-btn" aria-label="Play diff">
          <span>▶</span>
        </button>
      </div>
      <pre><code id="code" class="hljs"></code></pre>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script type="module">
    // Pure JS Myers diff (line-based) to avoid ordering glitches.

    const codeStart = `
lines.clear() // clear the list of lines to draw


loop { // do this forever (or until we stop this box)
    
    var f = FLine()    // make a new line for our drawing

    while(stereo.controllerState().triggerValue > 0.0) { // while the trigger is down
    
        var at = stereo.controllerState().position // get its position

        f.lineTo(at) // extend the drawing to this position

        _print(at) // print out the position (so we know what's going on)

        lines["ourLine"] = f // put this line onto the screen under the name "ourLine"

        frame() // WAIT for a frame to come out of the screen
    }

    while(stereo.controllerState().triggerValue <= 0.0) { // while the trigger isn't down
        frame() // WAIT for a frame to come out of the screen
        _print("waiting...") // and print waiting so we know what's going on
    }
}`;

    const codeEnd = `
lines.clear() // clear the list of lines to draw


loop { // do this forever (or until we stop this box)
    
    var f = FLine()    // make a new line for our drawing

    while(stereo.controllerState().triggerValue > 0.0) { // while the trigger is down
    
        var at = stereo.controllerState().position // get its position

        f.lineTo(at + vec(0,0,0.1)) // extend the drawing to this position

        _print(at) // print out the position (so we know what's going on)

        lines["ourLine"] = f // put this line onto the screen under the name "ourLine"

    }

    while(stereo.controllerState().triggerValue <= 0.0) { // while the trigger isn't down
        frame() // WAIT for a frame to come out of the screen
        _print("waiting...") // and print waiting so we know what's going on
    }


    frame() // WAIT for a frame to come out of the screen

}
`;

    const codeEl = document.getElementById('code');
    const playBtn = document.getElementById('play');
    const copyBtn = document.getElementById('copy');

    const steps = buildSteps(codeStart, codeEnd);
    const markersPersistent = new Map();
    let stateLines = toLines(codeStart);
    let isPlaying = false;
    let currentStep = 0;
    let timer = null;

    // re-render once highlight.js finishes loading so first frame is styled
    const hlScript = document.querySelector('script[src*="highlight.min.js"]');
    if (hlScript) {
      hlScript.addEventListener('load', () => render(stateLines));
    } else if (window.hljs) {
      render(stateLines);
    }

    function toLines(text) {
      if (!text) return [];
      const arr = text.split('\n');
      if (arr.length && arr[0] === '') arr.shift();
      if (arr.length && arr[arr.length - 1] === '') arr.pop();
      return arr;
    }

    // Myers diff (line-based)
    function diffMyers(a, b) {
      const N = a.length;
      const M = b.length;
      const max = N + M;
      const offset = max;
      const V = new Array(2 * max + 1).fill(-1);
      const trace = [];

      V[offset + 1] = 0;

      for (let d = 0; d <= max; d++) {
        const Vd = V.slice();
        trace.push(Vd);
        for (let k = -d; k <= d; k += 2) {
          const idx = offset + k;
          let x;
          if (k === -d || (k !== d && V[idx - 1] < V[idx + 1])) {
            x = V[idx + 1];
          } else {
            x = V[idx - 1] + 1;
          }
          let y = x - k;
          while (x < N && y < M && a[x] === b[y]) {
            x += 1;
            y += 1;
          }
          V[idx] = x;
          if (x >= N && y >= M) {
            trace[trace.length - 1] = V.slice();
            return backtrack(trace, a, b, offset);
          }
        }
      }
      return [];
    }

    function backtrack(trace, a, b, offset) {
      let x = a.length;
      let y = b.length;
      const ops = [];

      for (let d = trace.length - 1; d >= 0; d--) {
        const V = trace[d];
        const k = x - y;
        const idx = offset + k;
        let prevK;
        if (k === -d || (k !== d && V[idx - 1] < V[idx + 1])) {
          prevK = k + 1; // from down (insert)
        } else {
          prevK = k - 1; // from right (delete)
        }
        const prevX = V[offset + prevK];
        const prevY = prevX - prevK;

        while (x > prevX && y > prevY) {
          ops.push({ type: 'equal', line: a[x - 1] });
          x -= 1;
          y -= 1;
        }

        if (d === 0) break;

        if (x === prevX) {
          ops.push({ type: 'insert', line: b[prevY] });
          y -= 1;
        } else {
          ops.push({ type: 'delete', line: a[prevX] });
          x -= 1;
        }
      }

      return ops.reverse();
    }

    function diffChars(a, b) {
      // simple LCS for chars to mark ins/del/eq
      const m = a.length;
      const n = b.length;
      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
      for (let i = m - 1; i >= 0; i--) {
        for (let j = n - 1; j >= 0; j--) {
          dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }

      const segs = [];
      let i = 0;
      let j = 0;
      while (i < m || j < n) {
        if (i < m && j < n && a[i] === b[j]) {
          segs.push({ type: 'eq', text: a[i] });
          i += 1; j += 1;
        } else if (j < n && (i === m || dp[i][j + 1] >= dp[i + 1][j])) {
          segs.push({ type: 'ins', text: b[j] });
          j += 1;
        } else {
          segs.push({ type: 'del', text: a[i] });
          i += 1;
        }
      }

      // coalesce adjacent segments of same type
      const merged = [];
      for (const s of segs) {
        if (merged.length && merged[merged.length - 1].type === s.type) {
          merged[merged.length - 1].text += s.text;
        } else {
          merged.push({ ...s });
        }
      }
      return merged;
    }

    function buildSteps(from, to) {
      const a = toLines(from);
      const b = toLines(to);
      const ses = diffMyers(a, b);

      const stepsOut = [];
      let cursor = 0;
      for (let i = 0; i < ses.length;) {
        const op = ses[i];
        if (op.type === 'equal') {
          cursor += 1;
          i += 1;
          continue;
        }

        const idx = cursor;
        const dels = [];
        const ins = [];

        while (i < ses.length && ses[i].type === 'delete') {
          dels.push(ses[i].line);
          i += 1;
        }
        while (i < ses.length && ses[i].type === 'insert') {
          ins.push(ses[i].line);
          i += 1;
        }

        if (dels.length && ins.length) {
          stepsOut.push({ kind: 'replace', index: idx, deletes: dels, inserts: ins });
          cursor += ins.length;
        } else if (dels.length) {
          stepsOut.push({ kind: 'delete', index: idx, deletes: dels });
          // cursor unchanged
        } else if (ins.length) {
          stepsOut.push({ kind: 'insert', index: idx, inserts: ins });
          cursor += ins.length;
        }
      }

      return stepsOut;
    }

    function render(lines, opts = {}) {
      const inserted = new Set(opts.inserted || []);
      const deleting = new Set(opts.deleting || []);
      const closing = new Set(opts.closing || []);
      const inline = opts.inline || new Map();
      const markers = new Map(markersPersistent);
      if (opts.markers) {
        for (const [k, v] of opts.markers.entries()) markers.set(k, v);
      }
      const language = 'kotlin';
      const useHl = Boolean(window.hljs);
      const highlightedLines = useHl
        ? lines.map(line => highlightLine(line, language))
        : null;

      const wrapped = lines
        .map((line, idx) => {
          const segments = inline.get(idx);
          let content;

          if (segments && segments.length) {
            const base = highlightedLines
              ? highlightedLines[idx]
              : escapeHtml(line === '' ? '\u00a0' : line);
            content = applyInlineToHighlighted(base, segments);
          } else if (highlightedLines) {
            const safe = highlightedLines[idx];
            content = safe === '' ? '&nbsp;' : safe;
          } else {
            content = escapeHtml(line === '' ? '\u00a0' : line);
          }

          let cls = 'code-line';
          if (closing.has(idx)) cls += ' closing';
          else if (deleting.has(idx)) cls += ' deleting';
          else if (inserted.has(idx)) cls += ' inserted';
          const marker = markers.get(idx) || '';
          const markerHtml = marker ? `<span class="marker ${marker}"></span>` : '';
          return `<div class="${cls}"><span class="line-no">${idx + 1}</span>${markerHtml}<span class="code-text">${content}</span></div>`;
        })
        .join('');

      codeEl.className = `hljs language-${language}`;
      codeEl.innerHTML = wrapped;
    }

    function highlightLine(line, language) {
      if (!window.hljs) return escapeHtml(line === '' ? '\u00a0' : line);
      const source = line === '' ? ' ' : line;
      const html = hljs.highlight(source, { language }).value;
      return line === '' ? html.replace(' ', '&nbsp;') : html;
    }

    function applyInlineToHighlighted(html, segments) {
      // Wrap inline ins/del spans while preserving existing syntax markup.
      const container = document.createElement('div');
      container.innerHTML = html === '' ? '&nbsp;' : html;
      let segIdx = 0;
      let segOffset = 0;

      function walk(node) {
        if (segIdx >= segments.length) return;
        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.nodeValue || '';
          const parts = [];
          let pos = 0;
          while (pos < text.length && segIdx < segments.length) {
            const seg = segments[segIdx];
            const remainingSeg = seg.text.length - segOffset;
            const remainingText = text.length - pos;
            const take = Math.min(remainingSeg, remainingText);
            const chunk = text.slice(pos, pos + take);

            if (seg.type === 'eq') {
              parts.push(document.createTextNode(chunk));
            } else {
              const span = document.createElement('span');
              span.className = seg.type === 'ins' ? 'ch-ins' : 'ch-del';
              span.textContent = chunk;
              parts.push(span);
            }

            pos += take;
            segOffset += take;
            if (segOffset >= seg.text.length) {
              segIdx += 1;
              segOffset = 0;
            }
          }
          if (pos < text.length) {
            parts.push(document.createTextNode(text.slice(pos)));
          }

          const parent = node.parentNode;
          if (parent) {
            for (const part of parts) parent.insertBefore(part, node);
            parent.removeChild(node);
          }
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          const children = Array.from(node.childNodes);
          for (const child of children) walk(child);
        }
      }

      walk(container);
      return container.innerHTML;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function flash(kind) {
      const pre = codeEl.parentElement;
      pre.classList.remove('flash-insert', 'flash-delete');
      if (kind) pre.classList.add(kind === 'insert' ? 'flash-insert' : 'flash-delete');
      setTimeout(() => pre.classList.remove('flash-insert', 'flash-delete'), 280);
    }

    function reset() {
      clearTimeout(timer);
      stateLines = toLines(codeStart);
      markersPersistent.clear();
      render(stateLines);
      isPlaying = false;
      playBtn.disabled = false;
      playBtn.textContent = 'Play';
      currentStep = 0;
    }

    function play() {
      if (isPlaying) return;
      if (currentStep >= steps.length) reset();
      isPlaying = true;
      playBtn.disabled = true;
      runStep(currentStep);
    }

    copyBtn?.addEventListener('click', async () => {
      const text = stateLines.join('\n');
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        // fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    });

    function logState(label) {
      console.log(label, stateLines.join('\n'));
    }

    function runStep(idx) {
      if (idx >= steps.length) {
        stateLines = toLines(codeEnd);
        render(stateLines);
        flash('insert');
        logState('[frame final]');
        isPlaying = false;
        playBtn.disabled = false;
        playBtn.textContent = 'Replay';
        return;
      }

      const step = steps[idx];

      const finish = (delay) => {
        currentStep = idx + 1;
        timer = setTimeout(() => runStep(currentStep), delay);
      };

      if (step.kind === 'delete') {
        const delIdx = Array.from({ length: step.deletes.length }, (_, k) => step.index + k);
        const markers = new Map(delIdx.map(i => [i, 'marker-delete']));
        delIdx.forEach(i => markersPersistent.set(i, 'marker-delete'));
        render(stateLines, { deleting: delIdx, markers });
        flash('delete');
        logState(`[frame ${idx + 1}/${steps.length}] ${step.kind}@${step.index}`);
        setTimeout(() => {
          render(stateLines, { closing: delIdx, markers });
          setTimeout(() => {
            stateLines.splice(step.index, step.deletes.length);
            // remove markers for deleted lines
            delIdx.forEach(i => markersPersistent.delete(i));
            shiftMarkers(step.index, step.deletes.length, 0);
            render(stateLines);
            finish(360);
          }, 240);
        }, 420);
        return;
      }

      if (step.kind === 'replace') {
        const inline = new Map();
        const overlap = Math.min(step.deletes.length, step.inserts.length);
        for (let k = 0; k < overlap; k++) {
          const oldLine = step.deletes[k];
          const newLine = step.inserts[k];
          inline.set(step.index + k, diffChars(oldLine, newLine));
        }

        // remove old markers in the replaced span
        for (let k = 0; k < step.deletes.length; k++) markersPersistent.delete(step.index + k);

        stateLines.splice(step.index, step.deletes.length, ...step.inserts);

        const insertedLines = [];
        for (let k = overlap; k < step.inserts.length; k++) {
          insertedLines.push(step.index + k);
        }

        shiftMarkers(step.index, step.deletes.length, step.inserts.length);

        for (let k = 0; k < overlap; k++) markersPersistent.set(step.index + k, 'marker-replace');
        for (const idxIns of insertedLines) markersPersistent.set(idxIns, 'marker-insert');

        render(stateLines, { inserted: insertedLines, inline });
        flash('insert');
        logState(`[frame ${idx + 1}/${steps.length}] ${step.kind}@${step.index}`);
        finish(520);
        return;
      }

      if (step.kind === 'insert') {
        stateLines.splice(step.index, 0, ...step.inserts);
        const anim = step.inserts.map((_, k) => step.index + k);
        shiftMarkers(step.index, 0, step.inserts.length);
        anim.forEach(i => markersPersistent.set(i, 'marker-insert'));
        render(stateLines, { inserted: anim });
        flash('insert');
        logState(`[frame ${idx + 1}/${steps.length}] ${step.kind}@${step.index}`);
        finish(480);
        return;
      }
    }

    playBtn.addEventListener('click', play);
    render(stateLines);

    function shiftMarkers(start, removed, added) {
      if (added === removed) return;
      const delta = added - removed;
      const entries = Array.from(markersPersistent.entries()).sort((a, b) => a[0] - b[0]);
      markersPersistent.clear();
      for (const [idx, val] of entries) {
        if (idx < start) {
          markersPersistent.set(idx, val);
        } else if (idx >= start + removed) {
          markersPersistent.set(idx + delta, val);
        }
        // indices inside removed range are skipped
      }
    }
  </script>
</body>
</html>
