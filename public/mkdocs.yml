site_name: OpenEndedGroup | Field·4

hooks:
  - docs_hooks.py

nav:
  - Home: index.md
  - Installation: installation.md
  - Survival Guide: survivalGuide.md
  - Feature Overview: funFeatures.md
  - AI Overview: aiFeatures.md
  - Kotlin Overview: kotlin_overview.md
  - Reference:
    - FLine Examples: fline_examples.md
    - Visualizers & Controls: visualizers.md
    - Staging area:
      - Interactive Guides: interactive_guides.md
      - Guide Chat: guide_chat.md
      - Some VR: vr_sketch2.md
      - Forth Examples: forth_examples.md
      - Nano Examples: nano_examples.md
      - Functions Examples: functions_examples.md
      - Timeseries Examples: timeseries_examples.md
      - Stats Examples: stats_examples.md
      - Smile Neighbors Examples: smile_neighbors_examples.md
      - Interpolants Examples: interpolants_examples.md
      - Colors Examples: colors_examples.md
      - Correlations Examples: correlations_examples.md
      - Graph Connectivity Examples: graph_connectivity_examples.md
      - Sorting Networks Examples: sorting_networks_examples.md
      - Boolean Networks Examples: boolean_networks_examples.md
      - Boolean Network Music Examples: boolean_network_music_examples.md

markdown_extensions:
  - pymdownx.superfences:         # required extension
      custom_fences:
        - name: diff
          class: code-diff-fence
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: diffstatic
          class: code-diff-fence-static
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
      use_pygments: true          # use pygments library    
      pygments_style: github-dark # use 'github-dark' style
  - pymdownx.inlinehilite         # style inline code
  - md_in_html
  - def_list
  - attr_list
  - pymdownx.inlinehilite

plugins:
    - mkdocs-jupyter:
        include_requirejs: true
        include_source: True
    - search
    - include_dir_to_nav:
        file_pattern: ".*[.md,.ipynb]"
        recurse: false

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: red
  font: false
  custom_dir: overrides
  features:
    - navigation.path
    # - navigation.expand
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - assets/code-diff-player/code-diff-player.css

extra_javascript:
  - assets/image-lightbox.js
  - assets/code-diff-player/fence-upgrade.js
  - assets/code-diff-player/code-diff-player.js
  - assets/code-diff-player/field-doc-export.js

site_url: http://openendedgroup.com/Field4/
site_dir: field4
  
