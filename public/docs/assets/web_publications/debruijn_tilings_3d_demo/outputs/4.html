&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;&lt;meta http-equiv=&quot;Content-Security-Policy&quot; content=&quot;default-src 'none'; script-src 'self' 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'&quot;&gt;&lt;script src=&quot;../../runtime/4b9adcf9fd51cc54895f/publication-font.js&quot;&gt;&lt;/script&gt;
    &lt;meta charset=&quot;utf-8&quot;&gt;
    &lt;title&gt;Three.js Geometry Viewer&lt;/title&gt;
    &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
    &lt;style&gt;
        

        :root {
            --bg: #0f0f10;
            --ink: #e8f0fb;
            --muted: rgba(232, 240, 251, 0.65);
            --accent: #62d7ff;
            --border: rgba(255, 255, 255, 0.08);
            --selection: rgba(255, 211, 92, 0.95);
            --selection-soft: rgba(255, 211, 92, 0.22);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: &quot;Iosevka Web&quot;, &quot;IBM Plex Mono&quot;, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 300;
            color: var(--ink);
            background: var(--bg);
        }

        #canvas-wrap {
            position: absolute;
            inset: 0;
        }

        /* In a presentation figure (index.html?figure=) the scene sits on the deck's own background
           (the figure host's colour, set on the root by inPresentationFigure), and the viewer's
           counters and tools are not part of the picture. On the canvas nothing changes. */
        body.in-figure { background: transparent; }
        body.in-figure #canvas-wrap:not([style*=&quot;background&quot;]) { background: transparent; }
        body.in-figure #hud { display: none !important; }

        #canvas-wrap canvas:focus,
        #canvas-wrap canvas:focus-visible {
            outline: none;
        }

        /* Panel chrome sits over the canvas rather than in the WebGL scene: text stays crisp at any
           DPR, and a caption does not have to be re-rendered when the camera moves.

           For a single panel it does NOT overlay the geometry — it takes a band off the top and the
           bottom and the canvas is inset to match, which is how the CPU rasterizer's figures were laid
           out (title above, fact line below). Overlaying instead cost the mesh the vertical space it
           was framed for, and a figure that changes renderer should not come out smaller. */
        #panel-chrome {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }

        #panel-chrome.tiled {
            display: grid;
        }

        #panel-chrome.solo {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #panel-chrome.solo .panel-cell {
            padding: 0;
        }

        #panel-chrome.solo .panel-title {
            padding: 5px 8px 0 8px;
        }

        #panel-chrome.solo .panel-facts,
        #panel-chrome.solo .panel-caption {
            padding: 0 8px 5px 8px;
        }

        #canvas-wrap.chrome-top { top: 26px; }
        #canvas-wrap.chrome-bottom { bottom: 22px; }
        #canvas-wrap.chrome-bottom-2 { bottom: 40px; }

        #panel-chrome .panel-cell {
            padding: 6px 8px;
            min-width: 0;
        }

        #panel-chrome .panel-title {
            color: var(--ink);
            font-size: 12px;
            font-weight: 600;
        }

        /* A tiled panel is narrow and its title is usually a call — `loopSubdivide(3)`,
           `laplacianSmooth(30) — deflates` — so it wraps to a second line rather than being cut off
           with an ellipsis. Two lines, then it really is too long. */
        #panel-chrome.tiled .panel-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.25;
        }

        #panel-chrome.solo .panel-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #panel-chrome .panel-facts {
            color: var(--muted);
            font-size: 10.5px;
            padding-top: 2px;
            line-height: 1.45;
        }

        #panel-chrome .panel-caption {
            color: var(--muted);
            font-size: 11px;
            padding-top: 3px;
            line-height: 1.45;
        }

        #hud {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            z-index: 10;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
            line-height: 1.4;
            pointer-events: none;
        }

        #hud-left,
        #hud-right {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        /* The title owns the reserved header band; tools belong inside the canvas below it. */
        #canvas-wrap.chrome-top ~ #hud { top: 32px; }

        #hud-right {
            margin-left: auto;
            flex-direction: column;
            align-items: flex-end;
        }

        .hud-group {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid rgba(98, 215, 255, 0.16);
            background: transparent;
            pointer-events: auto;
        }

        #hud-right { min-width: 0; max-width: calc(100% - 70px); }
        #part-inspector { flex-wrap: wrap; justify-content: flex-end; max-width: 100%; position: relative; }
        #part-inspector label { display: inline-flex; align-items: center; gap: 8px; }
        #part-inspector &gt; label { white-space: nowrap; padding: 0 6px; min-height: 28px; }
        #part-inspector input[type=&quot;range&quot;] { width: 72px; min-width: 0; accent-color: var(--accent); }
        #part-inspector input[type=&quot;checkbox&quot;] { margin: 0; flex-shrink: 0; accent-color: var(--accent); }
        #part-inspector &gt; details &gt; summary { cursor: pointer; padding: 6px 10px; border-radius: 6px; }
        #part-inspector &gt; details[open] &gt; summary { color: var(--accent); background: #242424; }
        #part-inspector .part-list {
            position: absolute; top: calc(100% + 8px); right: 0; width: min(360px, calc(100vw - 12px));
            max-height: min(65vh, calc(100vh - 240px), 560px); overflow: auto; padding: 12px; border-radius: 8px; background: #000;
        }
        #part-inspector .part-actions { padding: 4px 6px 12px; }
        #part-inspector .part-hint { color: var(--muted); margin: 8px 0 0; white-space: normal; }
        #part-inspector .part-children { margin-left: 14px; }
        #part-inspector .part-row { display: flex; align-items: center; gap: 4px; border-radius: 4px; }
        #part-inspector .part-row:hover { background: #181818; }
        #part-inspector .part-row label { flex: 1; min-width: 0; padding: 6px; cursor: pointer; overflow-wrap: anywhere; }
        #part-inspector .part-toggle { width: 20px; height: 28px; padding: 0; flex-shrink: 0; }
        #part-inspector .part-spacer { width: 20px; flex-shrink: 0; }
        #part-inspector .part-count { color: var(--muted); margin-left: auto; padding-left: 6px; white-space: nowrap; }
        #part-inspector .part-row[data-solo=&quot;true&quot;] &gt; label { color: var(--accent); }

        .hud-button {
            appearance: none;
            border: 1px solid rgba(98, 215, 255, 0.16);
            border-radius: 5px;
            background: transparent;
            color: #a7dfff;
            font: inherit;
            height: 28px;
            min-width: 28px;
            padding: 0 10px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .hud-button.is-icon {
            width: 28px;
            padding: 0;
        }

        .hud-button.is-active {
            color: #071015;
            background: var(--accent);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .hud-button svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.6;
        }

        .hud-label,
        .meta,
        .selection-status {
            font-size: 11px;
            color: var(--muted);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            text-align: right;
        }

        .meta b {
            color: var(--ink);
            font-weight: 700;
        }

        .meta span {
            font-weight: 100;
            letter-spacing: 0.04em;
        }

        .hidden {
            display: none !important;
        }

        .selection-status.is-empty {
            visibility: hidden;
        }

        /* The inspector's three controls. Deliberately the same visual language as the edit tools:
           the point of this pane is that measuring, sectioning and exploding are the same *kind* of
           thing as selecting a vertex, not a separate mode you have to go somewhere else for. */
        .hud-slider {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 0 6px;
            font-size: inherit;
            min-height: 28px;
            color: var(--muted);
            white-space: nowrap;
        }

        .hud-slider input[type=&quot;range&quot;] {
            width: 84px;
            height: 14px;
            accent-color: var(--accent);
            background: transparent;
            cursor: ew-resize;
        }

        .hud-slider b {
            color: var(--ink);
            font-weight: 400;
            min-width: 34px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        #inspector-status {
            font-size: 11px;
            color: var(--selection);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            text-align: right;
        }

        /* `#hud-right` is a flex column with an 8px gap, so an *empty* status line is not free -- it
           costs one gap and pushes the meta readout down by 8px on every figure in the docs, inspector
           or not. `tools/docs_capture_audit.py --repeat 2` classified three unrelated three.js captures
           as stale for exactly that reason before this rule existed. `:empty` takes it out of the flow,
           so a payload with no inspector renders as it did before any of this landed. */
        #inspector-status:empty {
            display: none;
        }

        /* Controls are chrome; notes, references and diagnostics remain copyable. */
        #hud, #feature-review { user-select: none; -webkit-user-select: none; }
        #feature-note, #feature-reference, #feature-message, #feature-description {
            user-select: text; -webkit-user-select: text;
        }
        #hud :focus, #feature-review :focus { outline: none; box-shadow: none; }
        #hud .hud-group, #hud .hud-button { border: 0; background: #000; }
        #hud button:focus-visible, #feature-review button:focus-visible,
        #hud select:focus-visible { color: var(--accent); }
        #hud #xray-toggle.is-active, #hud #camera-link.is-active { background: var(--accent); color: #000; }
        #xray-tools { flex-wrap: wrap; }
        #viewer-tools { display: contents; }
        .viewer-tool { user-select: none; }
        #hud .viewer-tool .hud-button.is-active { background: var(--accent); color: #000; }
        .viewer-tool input, .viewer-tool textarea, .viewer-tool [role=&quot;status&quot;] { user-select: text; }
        #glb-status { max-width: 28em; white-space: normal; user-select: text; -webkit-user-select: text; }
        #glb-status.is-error { color: #ff7777; }
        #feature-region-box { position: fixed; border: 1px dashed #fff; pointer-events: none; z-index: 8; }
        .viewer-tool select { font: inherit; color: var(--ink); background: #242424; border: 0; border-radius: 6px; }
        /* The two sides share the top row when the controls actually showing fit on it, and the right
           side moves to a row of its own when they do not. This used to be a 760px media query, which
           split the rows by frame width alone: a view that asked for few controls still wrapped as if
           it carried all of them. */
        #hud { flex-wrap: wrap; }
        #hud-left { flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
        #hud-right { flex-shrink: 1; }
        @media (max-width: 760px) { #hud-right { max-width: 100%; } }
        /* Published views have fewer tools, so both sides fit on the top row in a box. */
        @media (min-width: 440px) {
            body.publication #hud { flex-wrap: nowrap; }
            body.publication #hud-left, body.publication #hud-right { flex-basis: auto; }
            body.publication #hud-right { max-width: calc(100% - 70px); }
        }

    three.js is vendored in-repo rather than pulled from a CDN.

    It used to be `cdn.jsdelivr.net`, which was survivable while a handful of docs assets came from
    this viewer. It stopped being survivable when the mesh examples moved here: ~68 captures now go
    through this file, and a docs build that loses the network most of the way through fails with a
    blank iframe and nothing useful in the log.

    Since r16x the module build is split: `three.module.js` imports `./three.core.js`, and both have
    to be committed side by side. Vendoring only the first is exactly what left
    `extensions/remote_ar/vendor/super-three/` unloadable for as long as it existed — it is gone now,
    and A-Frame's browser bundle carries its own copy of that fork regardless.
--&gt;
