<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="590" viewBox="0 0 1600 590" role="img" aria-labelledby="title desc"><title id="title">Field reconstruction pass ordering</title><desc id="desc">SR uses raster color, depth and motion. RR uses raw RTXDI lighting and converted material guides. Both produce ordinary Field textures.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#67d9eb"/></marker></defs><rect width="1600" height="590" rx="18" fill="#10151f"/><g font-family="monospace" fill="#e1edf2"><text x="35" y="46" font-size="26" fill="#e1edf2">DLAA / SUPER RESOLUTION</text><rect x="35" y="72" width="285" height="125" rx="12" fill="#1b2635" stroke="#3c7285" stroke-width="2"/><text x="53" y="106" font-size="23" fill="#80e2ee">moduleHere()</text><text x="53" y="139" font-size="18" fill="#e1edf2">Your meshes + shaders</text><text x="53" y="164" font-size="18" fill="#e1edf2">Jittered rasterization</text><rect x="365" y="72" width="355" height="125" rx="12" fill="#1b2635" stroke="#3c7285" stroke-width="2"/><text x="383" y="106" font-size="23" fill="#80e2ee">RenderToTexture</text><text x="383" y="139" font-size="18" fill="#e1edf2">0: linear RGB</text><text x="383" y="164" font-size="18" fill="#e1edf2">1: depth   2: motion</text><rect x="770" y="72" width="375" height="125" rx="12" fill="#1b2635" stroke="#3c7285" stroke-width="2"/><text x="788" y="106" font-size="23" fill="#80e2ee">DlssReconstruction</text><text x="788" y="139" font-size="18" fill="#e1edf2">evaluate(command, inputs, frame)</text><text x="788" y="164" font-size="18" fill="#e1edf2">History belongs to this view</text><rect x="1200" y="72" width="360" height="125" rx="12" fill="#1b2635" stroke="#3c7285" stroke-width="2"/><text x="1218" y="106" font-size="23" fill="#80e2ee">output texture</text><text x="1218" y="139" font-size="18" fill="#e1edf2">Next module / tone map / UI</text><text x="1218" y="164" font-size="18" fill="#e1edf2">Or blitToScreen()</text><path d="M320 134L365 134" stroke="#67d9eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 134L770 134" stroke="#67d9eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M1145 134L1200 134" stroke="#67d9eb" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="272" font-size="26" fill="#e1edf2">RAY RECONSTRUCTION</text><rect x="35" y="299" width="285" height="125" rx="12" fill="#1b2635" stroke="#3c7285" stroke-width="2"/><text x="53" y="333" font-size="23" fill="#80e2ee">Fabricate G-buffer</text><text x="53" y="366" font-size="18" fill="#e1edf2">Scene surface data</text><text x="53" y="391" font-size="18" fill="#e1edf2">Unjittered geometric motion</text><rect x="365" y="282" width="355" height="125" rx="12" fill="#1b2635" stroke="#3c7285" stroke-width="2"/><text x="383" y="316" font-size="23" fill="#80e2ee">RTXDI</text><text x="383" y="349" font-size="18" fill="#e1edf2">Raw, unfiltered lighting RGB</text><text x="383" y="374" font-size="18" fill="#e1edf2">Same scene and frame</text><rect x="365" y="433" width="355" height="125" rx="12" fill="#1b2635" stroke="#3c7285" stroke-width="2"/><text x="383" y="467" font-size="23" fill="#80e2ee">moduleHere()</text><text x="383" y="500" font-size="18" fill="#e1edf2">Depth + motion conversion</text><text x="383" y="525" font-size="18" fill="#e1edf2">Albedos + normal/roughness</text><rect x="770" y="349" width="375" height="125" rx="12" fill="#1b2635" stroke="#3c7285" stroke-width="2"/><text x="788" y="383" font-size="23" fill="#80e2ee">DlssReconstruction</text><text x="788" y="416" font-size="18" fill="#e1edf2">evaluate(..., inputs, frame, guides)</text><text x="788" y="441" font-size="18" fill="#e1edf2">rayReconstruction = true</text><rect x="1200" y="349" width="360" height="125" rx="12" fill="#1b2635" stroke="#3c7285" stroke-width="2"/><text x="1218" y="383" font-size="23" fill="#80e2ee">output texture</text><text x="1218" y="416" font-size="18" fill="#e1edf2">Next module / tone map / UI</text><text x="1218" y="441" font-size="18" fill="#e1edf2">Or blitToScreen()</text><path d="M320 350L365 345" stroke="#67d9eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 381L365 490" stroke="#67d9eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 345L770 394" stroke="#67d9eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 490L770 434" stroke="#67d9eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M1145 410L1200 410" stroke="#67d9eb" stroke-width="3" marker-end="url(#arrow)"/></g></svg>