name: line_notes_python_setup
description: >
  Setup for the python.md and language_extensions.md line-note captures: a Python root and one child
  cell, run once so its line notes have a last run to read. The capture=ui drives then rest the caret on
  a line through the keyboard — and, for the "changed since the last run" figure, type into it.
operations:
  - create:
      box: line_notes_python_root
      name: python
      frame: { x: 80, y: 60, w: 120, h: 80 }
      properties: { mainLanguage: python }
  - create:
      box: line_notes_python
      name: line notes
      frame: { x: 80, y: 200, w: 640, h: 220 }
      properties:
        code: |
          # Rest the cursor on a statement: its note is what it came to.
          xs = [n * n for n in range(6)]
          total = sum(xs)
          def mean(v):
              return sum(v) / len(v)
          mean(xs)
  - connect: { parent: line_notes_python_root, child: line_notes_python }
  - wait:
      millis: 750
  - execute: { box: line_notes_python, property: code }
  - await: {}
