name: clojure_completion_setup
description: >
  Setup for the clojure.md completion capture: a Clojure root and one child box to type into.
  A capture=ui fence drives the live editor and creates no boxes of its own, so the language root
  a Clojure box needs has to be built here. Run before the drive op (see public/docs/clojure.md).
operations:
  - create:
      box: clojure_completion_root
      name: clojure
      frame: { x: 80, y: 60, w: 120, h: 80 }
      properties: { mainLanguage: clojure }
  - create:
      box: clojure_completion
      name: completion
      frame: { x: 80, y: 200, w: 640, h: 220 }
  - connect: { parent: clojure_completion_root, child: clojure_completion }
