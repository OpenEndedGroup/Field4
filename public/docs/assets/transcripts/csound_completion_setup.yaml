name: csound_completion_setup
description: >
  Setup for the csound.md completion capture: a Csound root and one Csound box to type into. A
  capture=ui fence drives the live editor and creates no boxes of its own, so the language root has
  to be built here. Completion reads the committed csound-vocabulary.json, so nothing is run.
operations:
  - create:
      box: csound_completion_root
      name: csound
      frame: { x: 80, y: 60, w: 120, h: 80 }
      properties: { mainLanguage: csound }
  - create:
      box: csound_completion
      name: completion
      frame: { x: 80, y: 200, w: 640, h: 220 }
      properties:
        code_language: Csound
        code: |
          instr Tone
          endin
  - connect: { parent: csound_completion_root, child: csound_completion }
