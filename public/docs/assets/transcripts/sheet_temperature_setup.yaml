name: sheet_temperature_setup
description: >
  Setup for the Celsius/Fahrenheit video on spreadsheets.md#solving-for-cells: one box holding the
  temperature sheet, run once so its sheet is on screen. The capture=ui drive then clicks into the
  sheet and types into B1 and then B2 with the real keyboard, so every number the video shows comes
  from the real Ceres solve. The code is the code shown on the page; change them together.
operations:
  - create:
      box: sheet_temperature
      name: Temperature
      frame: { x: 60, y: 60, w: 200, h: 50 }
      properties:
        code: |
          sheet(height = 200) {
              rows = 4
              cols = 2
              columnWidth("A", 140)
              this["A1"] = "Celsius"; formula("B1", "free(100)")
              this["A2"] = "Fahrenheit"; formula("B2", "free(212)")
              this["A3"] = "Kelvin"; formula("B3", "B1 + 273.15")
              this["A4"] = "F from C"; formula("B4", "B2 eq B1 * 9.0 / 5.0 + 32.0")
          }
  - wait:
      millis: 500
  - execute: { box: sheet_temperature, property: code }
  - await: {}
