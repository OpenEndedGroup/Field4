<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>Field | Offline Viewer</title>
    <link rel="preload" href="/woff2/iosevka-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/iosevka.css" as="style">
    <link rel="stylesheet" href="/iosevka.css">
    <link rel="stylesheet" href="/outputareas.css">
    <style>
        body {
            font-family: "Iosevka Web", system-ui, Avenir, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: rgba(20, 20, 20, 1);
            overflow: hidden;
        }

        :root {
            --field-cyan-rgb: 72, 201, 255;
            --field-cyan: rgb(var(--field-cyan-rgb));
            --field-cyan-muted: rgba(var(--field-cyan-rgb), 0.4);
            --field-panel: rgba(0, 0, 0, 0.26);
            --field-text: #a9e6ff;
            --field-text-soft: #7fd4ff;
        }

        * {
            box-sizing: border-box;
        }

        /* no entry animation on boxes */

        #viewport {
            position: absolute;
            width: 100vw;
            height: 100vh;
            overflow: auto;
        }

        #canvas {
            position: relative;
            min-width: 100vw;
            min-height: 100vh;
            transform-origin: 0 0;
            z-index: 1;
        }

        #connections {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
            z-index: 0;
        }

        .box {
            position: absolute;
            color: rgb(255, 255, 255, 0.8);
            border-radius: 5px;
            backdrop-filter: blur(4px);
            border: 1px solid rgb(255, 255, 255, 0.0);
            background-color: rgb(50, 50, 50, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .box:hover {
            transform: none;
            box-shadow: none;
        }

        .box::before {
            content: " ";
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border: 5px solid rgba(0, 0, 0, 0.8);
            width: 100%;
            height: 100%;
            padding: 1px;
            border-radius: 5px;
            pointer-events: none;
        }

        .box.selected {
            border-color: rgba(var(--field-cyan-rgb), 0.9);
            box-shadow: none;
        }

        .box-name {
            backdrop-filter: blur(5px) brightness(0.75);
            padding: 8px;
            display: block;
            text-align: center;
            white-space: nowrap;
            overflow: visible;
            word-break: normal;
            hyphens: manual;
        }

        .monaco-editor-container {
            position: fixed;
            top: 5px;
            right: 5px;
            height: calc(100vh - 10px);
            width: calc(70vw - 10px);
            border: 5px solid black;
            border-radius: 5px;
            padding: 5px;
            background: #1e1e1e;
            z-index: 19;
            display: none;
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .monaco-editor-container.visible {
            display: block;
            opacity: 1;
            transform: translateX(0);
        }

        .monaco-editor {
            width: 100%;
            height: calc(100% - 40px);
            font-family: "Iosevka Web", system-ui, Avenir, Helvetica, Arial, sans-serif !important;
        }

        .literate-view {
            display: none;
            width: 100%;
            height: calc(100% - 40px);
            overflow: auto;
            font-family: "Iosevka Web", system-ui, Avenir, Helvetica, Arial, sans-serif;
            padding: 4px 6px;
            color: #e8f3ff;
            font-size: 12px;
        }

        .property-tabs {
            display: flex;
            gap: 3px;
            margin-bottom: 8px;
            padding: 2px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }

        .view-toggle {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 21;
        }

        .view-toggle button {
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            color: var(--field-text);
            cursor: pointer;
            font-size: 10px;
            line-height: 1.1;
            height: 23px;
            min-width: 64px;
        }

        .view-toggle button:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .property-tab {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            color: var(--field-text-soft);
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
        }

        .property-tab:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .property-tab.active {
            background: var(--field-cyan);
            color: #000;
            border-color: var(--field-cyan);
        }

        /* Make Monaco line numbers lighter and smaller */
        .monaco-editor .margin-view-overlays .line-numbers {
            color: rgba(255, 255, 255, 0.3) !important;
            font-size: 10px !important;
            line-height: 1.2;
            transform: translateY(-1px);
        }

        .monaco-editor .margin-view-overlays .line-numbers.active-line-number {
            color: rgba(var(--field-cyan-rgb), 0.6) !important;
        }

        .lit-code-block {
            margin: 3px 0 6px 0;
            padding: 6px 8px;
            background: #11161c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow-x: auto;
            font-size: 11.5px;
            line-height: 1.35;
        }

        .lit-comment {
            margin: 3px 0 6px 0;
            padding: 3px 0 3px 8px;
            color: #c9d9f2;
            line-height: 1.35;
        }

        .offline-banner {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--field-cyan);
            border-radius: 8px;
            color: var(--field-text);
            font-size: 12px;
            z-index: 20;
            backdrop-filter: blur(10px);
            max-width: 320px;
            white-space: normal;
            line-height: 1.35;
        }

        .open-local-button {
            position: fixed;
            bottom: -5px;
            right: -5px;
            padding: 8px 14px;
            background: rgba(var(--field-cyan-rgb), 0.18);
            border: 1px solid var(--field-cyan);
            border-radius: 6px;
            color: var(--field-text);
            font-size: 12px;
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .open-local-button:hover {
            background: rgba(var(--field-cyan-rgb), 0.28);
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(var(--field-cyan-rgb), 0.25);
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--field-cyan);
            font-size: 18px;
            z-index: 100;
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid red;
            border-radius: 8px;
            color: white;
            z-index: 100;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div class="offline-banner">
        <span style="opacity: 0.7; font-size: 11px;">Loading…</span>
    </div>

    <div class="loading" id="loading">Loading Field document...</div>
    <div class="error-message" id="error" style="display: none;"></div>

    <div id="viewport">
        <div id="canvas"></div>
        <svg id="connections"></svg>
    </div>

    <div class="monaco-editor-container" id="editor-container">
        <div class="property-tabs" id="property-tabs"></div>
        <div class="view-toggle"><button id="literate-toggle">reader</button></div>
        <div class="monaco-editor" id="editor"></div>
        <div class="literate-view" id="literate-view"></div>
    </div>

    <a class="open-local-button" id="open-local" style="display: none;">
        Open in Field·4
    </a>

    <script type="text/javascript" src="./min/vs/loader.js"></script>
    <script src="edn-parser.js"></script>
    <script src="offline-viewer.js"></script>
</body>
</html>
