    - Running Code in a Box: running_code.md
    - Drawing with FLines: fline_examples.md
    - Frames, and What a Frame Is: animation_time_model.md
    # Quoted: the title has its own colon, and an unquoted one breaks the YAML scanner.
    - "Sound: the Pattern → Audio Path": sound.md
    - Letting an Agent Drive: automating_field.md
    # The exit ramp rather than a seventh step: a themed map of everything below, which is what
    # this page already was. Its framing paragraph still describes a staging area and needs a
    # rewrite; the filename stays put so its inbound link and its generated-artifact references
