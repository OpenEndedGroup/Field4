site_name: OpenEndedGroup | Field·4

# The docs runner (docs_hooks.py) is invoked directly by tools/build_zensical_docs.py,
# not through a config hook key — so there is no `hooks:` entry here.

nav:
  - Home: index.md
  # The front of the site, read in order: install it, learn the survival moves, learn enough Kotlin
  # to read an example, then take the Tour. The Tour is nested *inside* this section rather than
  # sitting beside it, because "Start Here" is the only heading a first-time reader goes looking
  # for, and an arc one heading over from it was an arc nobody found.
  - Start Here:
    - Installation: installation.md
    - Survival Guide: survivalGuide.md
    - Kotlin Syntax Overview: kotlin_overview.md
    # Above the Tour, not after it: "Where to Go Next" is the arc's exit ramp onto the rest of the
    # site, so nothing may follow it inside this section. A lookup table is also the one page here
    # that nobody reads in sequence, which makes it the cheapest thing to pass on the way in.
    - Keyboard Shortcuts: keybindings.md
    # A read-in-order arc, not a category: one faculty per page, and the order is the point.
    # running_code is the mechanic every later page rests on; autocomplete is the editor you meet
    # while typing that code, so it comes immediately after rather than being filed as an advanced
    # topic; and the last two hand the whole running document to something that is not you — a
    # phone first, then an agent. Every entry also stands alone. A page appears once in this nav
    # (Zensical resolves prev/next from position), so these are moved here rather than aliased, and
    # their former sections were rebalanced to suit.
    - A Tour:
      - What Field Is: funFeatures.md
      - Running Code in a Box: running_code.md
      # The ranking page follows the browser page because it answers the question the browser page
      # raises: why *this* candidate first. Flat rather than under an "Autocomplete" sub-heading —
      # this is already the third nav level, and a fourth buys a label at the cost of a click.
      - The Documentation Browser: completion_doc_browser.md
      - How Completions Are Ranked: completion_ranking.md
      - Drawing with FLines: fline_examples.md
      - Frames and the Animation Loop: animation_time_model.md
      # Quoted: the title has its own colon, and an unquoted one breaks the YAML scanner.
      - "Sound: the Pattern → Audio Path": sound.md
      # Before automating_field and after sound, because by this point in the arc there is a living
      # document worth reaching for: the phone drives the sliders, outputs and AI4 chat of the
      # thing the previous four pages built. Moved out of "AI & Agents", where it sat behind three
      # pages about Field's own AI and was found by nobody.
      - Field From Your Phone: mobile_controllers.md
      - Automating Field: automating_field.md
      # The exit ramp rather than another step: a themed map of everything below, which is what
      # this page already was. The filename stays put so its inbound link and its
      # generated-artifact references do not have to move.
      - Where to Go Next: staging.md
  - Working in a Document:
    - Spatial Navigation: spatial_navigation.md
    - Snapping: snapping.md
    - Drawing and Notation: drawing_and_notation.md
    - File Management: files_and_paths.md
    # Beside files_and_paths.md: that page answers "which file did this path mean", this one "which
    # box did this value come from", and both are lookups a person otherwise reverse-engineers.
    - Why Does This Value Resolve Here?: why.md
    # The three history pages together. history_lens.md used to sit below the two performance
    # pages, which put the inline view of a property's past two clicks away from the two pages
    # that explain what that past is; nothing about the split was deliberate.
    - Your History with Field: history_overview.md
    - Document History: document_history.md
    - Inline History (History Lens): history_lens.md
    - The Semantic Index: semantic_index.md
    - Simulation Time: simulation_clock.md
    - Flow Grain and Motion: flow_grain.md
    - Profiling Timeline: profiling_timeline.md
    # Beside profiling_timeline.md rather than under Internals, and the split between the two is
    # audience: that page is the panel's controls, this one is what the numbers under them mean and
    # what each of the three instruments structurally cannot see. Somebody whose piece is dropping
    # frames needs this one, and may never need to open the other. Last in the section, as the pair
    # you open when something is wrong rather than when you are working.
    - Holding a Frame Budget: frame_budget.md
  # "What happens when a box ends on a value" is a faculty of its own, and these five were spread
  # across Libraries & APIs and the staging area. Note that output_panel_sizing.md is deliberately
  # NOT here: see the comment on it under Internals, which places it beside server_surface.md as a
  # measurement contract rather than beside three_output.md as a knob.
  - Seeing Values:
    - Visualizers & Controls: visualizers.md
    - Field's 3D Output: three_output.md
    - Point to geometry and leave notes: geometry_review.md
    - Charts as FLines: chart.md
    - DataFrames in a Box: dataframe.md
    - Interactive Guides: interactive_guides.md
  - Drawing From Data:
    - Functions & Derivatives:
      - Functions Examples: functions_examples.md
      - Functions Domains: functions_domains.md
      - Differentiating Functions: autodiff_examples.md
    - Time & Signals:
      - Values Over Time (Interpolants & Keyframes): interpolants_examples.md
      # Directly after the interpolants page, which is the other half of the same subject: that
      # page is a value eased once to a target that stays put, this one is springs and a steering
      # model for a target that keeps moving. Filed under Time & Signals rather than beside
      # physics.md because nothing here is a solve — it is arithmetic on a value over time.
      - Springs & Character Movement: movement_examples.md
      # Short because the long title wrapped in the sidebar; the page's own H1 still says what a
      # keyframe is for (capturing, persisting and replaying live state).
      - Keyframes: keyframer_examples.md
      # Directly after the keyframes page, because it is that page's collection noun: one saved key
      # is a look, a directory of them is a space, and this is what explores the space overnight.
      - Sweeping a Keyframe Space Overnight: keyframe_autosweep.md
      - Timeseries Examples: timeseries_examples.md
      - State Estimation Examples: state_estimation_examples.md
      - Statistics & Dependence: statistics_examples.md
      - Spectral Examples: spectral_examples.md
    # Its own group rather than a sixth entry under "Time & Signals": the input to a projection is
    # a set of things and one distance per pair, which is neither a time series nor a signal. The
    # worked examples are words under an edit distance and curve samples under a graph distance.
    - Distances & Projections:
      - Placing Things by Distance (MDS, t-SNE): projection_examples.md
    # Beside the projections rather than under Functions & Derivatives: the input is an unordered
    # cloud and the output is a deformation of it, which is a shape problem rather than a calculus
    # one. The network it trains is incidental to what the page is for.
    - Clouds & Deformations:
      - Flow Matching: flow_matching.md
    - Colour & Images:
      - Colors Examples: colors_examples.md
      - Imaging & Computer Vision: imaging_examples.md
      - Depth & CLIP (ONNX): onnx.md
    - Geometry & Solids:
      - Meshes & 3D Geometry: mesh_examples.md
      - Solids & Booleans (Manifold): manifold.md
      - Tetrahedral Meshing (TetGen): tetgen.md
      - A Solid, Written Down (solidsl): solid_notation.md
      - Geometry From Disk (OBJ, STL, PLY, glTF): geometry_from_disk.md
      - Polytopes & the Conway Algebra: polytope_examples.md
      - Typography as Geometry: typography_examples.md
      - Voronoi, Contours & Clusters: spatial_geometry_examples.md
    # sound.md is the Tour's sound stop, so this group starts at the pattern language that feeds
    # it and continues into the paths that page only introduces. Deliberately not an ordinal —
    # the Tour has gained a stop twice now, and a comment that counts them goes stale silently.
    - Sound & Music:
      - Patterns & Rhythm: pattern_language.md
      - A Pattern as a Function Generator: marf.md
      - Making a Sound, Every Path There Is: sound_paths.md
      - A Pattern in Space (HRTF): pat_spatial.md
      - DoughDSP Sound Examples: dough_dsp_sound.md
      - Sonic Pi: sonic_pi.md
      - Faust: faust.md
      - Pure Data: pure_data.md
      # After the two engines Field talks to, because it is the general form of what they do: OSC
      # in and out of a box, for any peer — a phone, SuperCollider, Max, a touch table over TUIO.
      - OSC and TUIO: osc.md
    - Lighting:
      - "Driving Lights: Art-Net and sACN": dmx_lighting.md
    - Audio AI:
      - Field Audio AI: field_audio_ai.md
      - Field Audio Service Reference: field_audio_service_reference.md
      - Audio AI Gesture Board: audio_ai_gesture_board.md
      - Beat and Pitch Analysis: audio_ai_analysis.md
      - Speech-Reactive Learned Spaces: audio_ai_speech_embeddings.md
      - Short-Time Spectral Spaces: audio_ai_spectral_embeddings.md
      - Multi-Instrument Transcription: audio_ai_muscriptor.md
      - Corpus Microscope: audio_ai_corpus_microscope.md
      - Render Field Music, Then Analyse It: audio_render_analysis.md
      - Experiment in Terror with an Underfit LoRA: audio_ai_underfit_mancini.md
      - EnCodec Reconstruction Microscope: audio_ai_codec.md
  - Networks & Dynamics:
    - Sorting Networks Examples: sorting_networks_examples.md
    - Interaction Nets Examples: interaction_nets_examples.md
    - Petri Nets: petri_nets.md
    - Petri Cheatsheet: petri_cheatsheet.md
    - Boolean Networks Examples: boolean_networks_examples.md
    - Boolean Network Music Examples: boolean_network_music_examples.md
    - Wave Function Collapse Examples: wfc_examples.md
    - Spatial Artificial Life: alife_examples.md
    - Neighbors & Graphs Examples: graph_connectivity_examples.md
    - Graphs That Change While You Watch: dynamic_graph_systems_examples.md
  - Small Languages:
    - Datalog in a Box: datalog.md
    - FieldML Cheatsheet: fieldml_cheatsheet.md
    - FieldML Examples: fieldml_examples.md
    - FieldML JVM Bridge: fieldml_host_bridge.md
    - FieldML Stage by Stage: fieldml_stages.md
    - StackSL Cheatsheet: stacksl_cheatsheet.md
    - StackSL Examples: stacksl_examples.md
    - RectSL Cheatsheet: rectsl_cheatsheet.md
    - RectSL Examples: rectsl_examples.md
    - RectSL Inverse Animation: rectsl_inverse_animation.md
    - ForthField Examples: forth_examples.md
    - Python in a Box: python.md
    # Beside python.md rather than further down: the two pages answer the same question about two
    # guest languages that are hosted the same way — in Field's own process, sharing one namespace,
    # with the host's objects reachable directly — and a reader who has read one wants the contrast.
    - Clojure in a Box: clojure.md
    - Lua in a Box: lua.md
    - Nano Examples: nano_examples.md
    # The tail of this section is the three "make your own" pages, in ascending order of how much
    # machinery they ask for, after the gallery that already uses them: MorphoHDL is a language
    # brought in from outside, `rewrite { … }` is a syntax of your own with no language at all
    # behind it — a preprocessor in a box — and Language Extensions is how any of them earns
    # highlighting, diagnostics and a context lens in the editor. The last two arrived here from a
    # "Writing Code in a Box" section that no longer exists: they read as advanced Kotlin-editor
    # topics and are in fact the two pages this gallery is the evidence for.
    - Bridging Another Language (MorphoHDL): morpho_examples.md
    - Rewriting Your Own Syntax: pattern_rewrite.md
    - Language Extensions: language_extensions.md
  # Three pages here carry an in-page warning rather than a section-level one: vision.md opens
  # "work in progress", vision_geometry.md says it is written for code running inside that app, and
  # ray_tracing_examples.md says its four figures are placeholder cards because macOS exposes no
  # ray-tracing extension. A warning a reader meets on the page is more honest than a nav heading
  # nobody reads as a disclaimer, which is the whole argument for retiring the staging area.
  - Graphics, GPU & Headsets:
    - Rendering & GPU:
      - afield.four Graphics: afield_four_graphics.md
      - GPU Schemas: gpu_schema.md
      - Slug Filled Paths: slug_paths.md
      # Directly after the graphics contract and before the probes page, because it is the sequel
      # to one and the setup for the other: afield_four_graphics teaches the stateless compute
      # dispatch, this teaches what changes when the shader's input is its own last output, and
      # field_probes instruments exactly that kind of scene.
      - GPU State: gpu_state.md
      # The worked example of the two pages above it, and here rather than under "Working in a
      # Document" where it first landed: nothing on it is about working in a document. It is an
      # eight-box render-to-texture graph — four light bands, two reductions, two aperture filters
      # and a composite — and it says so itself, pointing at afield_four_graphics.md for the APIs
      # it uses. Third in this group so the order reads contract, then feedback, then a graph built
      # out of both.
      - Aperture Playground: aperture_playground.md
      - Puppet Browser: puppet_browser.md
      - Fabricate Renderer: fabricate_renderer.md
      - Direct Lighting: direct_lighting.md
      - Neural Reconstruction: neural_reconstruction.md
      - Ray Reconstruction: ray_reconstruction.md
      - Path-Traced Reconstruction: path_traced_reconstruction.md
      - Computed Ray Geometry: computed_ray_geometry.md
      - From Modules to Reconstruction: reconstruction_plumbing.md
      - Optical Flow: optical_flow.md
      - A Learned Shader Function: learned_shader.md
      - GPU Shader Learning: gpu_shader_learning.md
      - Progressive Path Tracing: path_tracing.md
      - Ray Tracing Examples: ray_tracing_examples.md
      - Particles, Cloth & Constraints: physics.md
      - Pressure Membranes: pressure_membranes.md
      # Directly after the hand-written particle systems, because it is the same compute-then-draw
      # shape with the rule replaced by a trained network — a velocity field in tier one, a Deep
      # Sets interaction over a GPU neighbour grid in tier two. Here rather than beside
      # flow_matching.md under "Clouds & Deformations": the CPU page fits a field to a cloud, this
      # one is about getting it onto the GPU and proving it is still the same network.
      - Neural Particle Systems: neural_particles.md
      - Field Probes: field_probes.md
    - Heads & Headsets:
      - RemoteJS & WebXR: ar_reference.md
      # Here rather than at the head of "Writing Code in a Box", where it was the first thing a
      # reader met about writing code in a box at all. It is not that: it is a box whose Kotlin is
      # cross-compiled to JavaScript in-process and shipped over a WebSocket to a browser tab or a
      # Vision Pro, which is useful only once you have a head to ship it to. It belongs directly
      # after the page above — same transport, real Kotlin instead of raw JS — and directly before
      # the two visionOS pages whose `visionmetal` profile it is the compile route for.
      - Kotlin in the Head: kotlin_in_the_head.md
      - Apple Vision Pro (WiP): vision.md
      - Geometry in the Headset: vision_geometry.md
      - ImGui as a VR Panel: imgui_vr_panel.md
  # Every other section here is a subsystem, and a reader who has finished one of them still has no
  # picture of how two of them meet. These pages are that picture: one object carried across three
  # or four subsystems, with each hop's output checked against the next stage's arithmetic. They sit
  # after the sections they draw on rather than inside any one of them, because no one of them owns
  # a chain — putting the polytope page under "Geometry & Solids" would file it away from the tracer
  # it ends at, and under "Rendering & GPU" away from the algebra it starts from.
  - Chains Across Subsystems:
    - A Polytope, Cut Open and Traced: chain_polytope_render.md
    - Particles, Welded and Traced: chain_physics_render.md
    - A Cellular Automaton You Can Hear: chain_ca_sound.md
    - A Pattern That Moves Particles: chain_pattern_particles.md
    - Three-Dimensional Life, Counted and Traced: chain_life3d_render.md
    - A RectSL Animation as a Solid: chain_rectsl_spacetime.md
    - A Polytope, Canonicalised and Sliced: chain_ceres_manifold_contours.md
    - A Photograph, Closed and Mounted: chain_photo_to_solid.md
    - A λ-Term You Can Hear: chain_lambda_sound.md
    - A Twisted Limb, Weighed and Traced: chain_skinned_volume.md
    - A Function, Played and Read Back: chain_fn_sound_roundtrip.md
    - A RectSL Scene on a Light Rig: chain_scene_to_light.md
    - A Drawn Score, Heard: chain_drawn_score.md
  - AI & Agents:
    - AI Overview: aiFeatures.md
    - Talking a Function into Existence: function_conversation.md
    - Talking a Shader into Existence: stacksl_conversation.md
    - Talking a Scene into Existence: rectsl_conversation.md
    - Talking to the StackSL in Your Shader: stackauto_conversation.md
    # After the four conversations rather than before them: those pages show a study being worked on,
    # and this one is the layer they share, which reads best once you have seen one.
    - Studies: studies.md
    - AI Tool-Use History: ai_tool_use_history.md
    - AI Documentation Polish: ai_doc_polish.md
    - Notes on the Documentation: docs_notes.md
    # mobile_controllers.md used to close this section. It is in the Tour now: a phone remote is a
    # way of reaching a running document, and only one of its six tabs is about AI at all.
    - Agent Transcript Gallery: agent_transcripts.md
  # Generated from source rather than written: extracted KDoc and codegen output. As finished as
  # the source it is read out of, which is why it never needed a maturity tier of its own.
  - Reference:
    - What's Already in the Box: reference/index.md
    - Codebase Reference:
      - Math: reference/math.md
      - Data: reference/data.md
      - Graphics: reference/graphics.md
      - Renderers: reference/renderers.md
      - Polytopes: reference/polytopes.md
      - Solvers: reference/solvers.md
      - Simulation: reference/simulation.md
      - Imaging: reference/imaging.md
      - ALife: reference/alife.md
      - Search: reference/search.md
      - Function: reference/function.md
      - Visualization: reference/visualization.md
      - Synthesis: reference/synthesis.md
      - Patterns: reference/patterns.md
      - Audio: reference/audio.md
      - Audio AI: reference/audio-ai.md
      - Languages: reference/languages.md
      - Workspace: reference/workspace.md
      - Machine learning: reference/machine-learning.md
    - Libraries & APIs:
      - Linear Algebra: linear_algebra.md
      - Generated Vector API: linear_algebra_api.md
      - Querying Object Graphs: graph_query.md
  # Internals: hand-written, and about mechanism rather than task. Read these when you are
  # extending Field or working out why it did something, not when you are writing a box.
  #
  # A top-level section rather than a subsection of Reference. Reference is generated from source —
  # "as finished as the source it is read out of", as the comment above it says — and none of these
  # is: they are prose about contracts that no KDoc states. Filing them under a generated tree
  # implied they were extracted, and buried the one audience they have.
  #
  # They stay in `public/docs` rather than moving to `dev_docs` for a mechanical reason as well as
  # an editorial one: `dev_docs/docs_capture_owners.json` covers 64 `public/docs/` captures and
  # zero under `dev_docs/`, so a page whose figure comes from a `diffstatic_runner` fence loses its
  # producer the moment it moves, and the figure becomes a committed asset nothing regenerates.
  - Internals:
    - What Field Exposes: server_surface.md
    # Beside server_surface.md rather than three_output.md, the only other page that touches panel
    # sizing: that page tells a `three` caller which knob to turn, this one is the measurement
    # contract itself, read by whoever is about to emit a new kind of output. This is also why it
    # did not move into "Seeing Values" when that section was formed.
    - Output Panel Sizing: output_panel_sizing.md
    # After the two runtime-contract pages and before the build one, because it is the artifact
    # boundary between them: the format `SavingContext.save` writes and the loader reads back. Not
    # under Reference for the same reason as its neighbours — nothing generates it — and it stays in
    # `public/docs` with a producer that survives here: its figure is emitted by
    # `examples.document-on-disk.smoke`, which asserts the page still carries it verbatim.
    - What a Document Is on Disk: document_on_disk.md
    # Internals on this section's own test: mechanism, hand-written, and read when you are working
    # out why Field did something rather than when you are writing a box. It is a sibling of
    # server_surface.md — that page says what Field exposes to a client, this one says where the
    # process's own output goes. Third of the runtime-surface four and before the build page,
    # because the terminal it describes is the one `building_and_testing.md` tells you to read.
    - Where Field's Output Goes: logging.md
    # Last of the runtime-surface four. It sits here rather than in "AI & Agents" on this section's
    # own test: mechanism, hand-written, and read when you are working out why Field did something
    # rather than when you are writing a box. Its sibling is logging.md — that page says where the
    # process's output goes, this one says how much of it a picture can hold, and both are things
    # you look up after something has already surprised you rather than while composing.
    - What a Capture Can and Cannot Show: capture_limits.md
    - Building & Testing: building_and_testing.md

markdown_extensions:
  - admonition                    # `!!! note` / `!!! warning` callouts
  - pymdownx.details              # `??? aside` — collapsed, margin-dwelling asides
  - pymdownx.superfences:         # required extension
      custom_fences:
        - name: diff
          class: code-diff-fence
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: diffstatic
          class: code-diff-fence-static
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
      use_pygments: true          # use pygments library    
      pygments_style: github-dark # use 'github-dark' style
  - pymdownx.inlinehilite         # style inline code
  - md_in_html
  - def_list
  - attr_list
  - pymdownx.inlinehilite

plugins:
    - search

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: red
  font: false
  custom_dir: overrides
  features:
    # navigation.path (breadcrumbs) disabled: rendered under the fixed frosted
    # header and redundant with the nav rail after the zensical port.
    # - navigation.path
    # - navigation.expand
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - assets/code-diff-player/code-diff-player.css

extra_javascript:
  # homepage-video.js must precede dot-grid.js: it sets the
  # data-field-homepage flag that dot-grid.js reads to suppress itself.
  - assets/homepage-video.js
  - assets/dot-grid.js
  - assets/header-brand.js
  # Before lesswrong-rail.js: the rail measures heading offsets, and this rewraps them.
  - assets/sticky-headings.js
  - assets/lesswrong-rail.js
  - assets/image-lightbox.js
  - assets/code-diff-player/fence-upgrade.js
  - assets/code-diff-player/code-diff-player.js
  - assets/code-diff-player/field-doc-export.js

site_url: http://openendedgroup.com/Field4/
site_dir: field4
  
