      - Querying Object Graphs: graph_query.md
  # Internals: hand-written, and about mechanism rather than task. Read these when you are
  # extending Field or working out why it did something, not when you are writing a box.
  #
  # A top-level section rather than a subsection of Reference. Reference is generated from source —
  # "as finished as the source it is read out of", as the comment above it says — and none of these
  # is: they are prose about contracts that no KDoc states. Filing them under a generated tree
  # implied they were extracted, and buried the one audience they have.
  #
  # They stay in `public/docs` rather than moving to `dev_docs` for a mechanical reason as well as
  # an editorial one: `dev_docs/docs_capture_owners.json` covers 64 `public/docs/` captures and
  # zero under `dev_docs/`, so a page whose figure comes from a `diffstatic_runner` fence loses its
  # producer the moment it moves, and the figure becomes a committed asset nothing regenerates.
  - Internals:
    - What Field Exposes: server_surface.md
    # Beside server_surface.md rather than three_output.md, the only other page that touches panel
    # sizing: that page tells a `three` caller which knob to turn, this one is the measurement
    # contract itself, read by whoever is about to emit a new kind of output. This is also why it
    # did not move into "Seeing Values" when that section was formed.
    - Output Panel Sizing: output_panel_sizing.md
    # After the two runtime-contract pages and before the build one, because it is the artifact
    # boundary between them: the format `SavingContext.save` writes and the loader reads back. Not
    # under Reference for the same reason as its neighbours — nothing generates it — and it stays in
    # `public/docs` with a producer that survives here: its figure is emitted by
    # `examples.document-on-disk.smoke`, which asserts the page still carries it verbatim.
    - What a Document Is on Disk: document_on_disk.md
    # Internals on this section's own test: mechanism, hand-written, and read when you are working
    # out why Field did something rather than when you are writing a box. It is a sibling of
    # server_surface.md — that page says what Field exposes to a client, this one says where the
    # process's own output goes. Last of the runtime-surface three and before the build page,
    # because the terminal it describes is the one `building_and_testing.md` tells you to read.
    - Where Field's Output Goes: logging.md
    - Building & Testing: building_and_testing.md

markdown_extensions:
  - admonition                    # `!!! note` / `!!! warning` callouts
  - pymdownx.details              # `??? aside` — collapsed, margin-dwelling asides
  - pymdownx.superfences:         # required extension
      custom_fences:
        - name: diff
          class: code-diff-fence
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: diffstatic
          class: code-diff-fence-static
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
      use_pygments: true          # use pygments library    
      pygments_style: github-dark # use 'github-dark' style
  - pymdownx.inlinehilite         # style inline code
  - md_in_html
  - def_list
  - attr_list
  - pymdownx.inlinehilite

plugins:
    - search

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: red
  font: false
  custom_dir: overrides
  features:
    # navigation.path (breadcrumbs) disabled: rendered under the fixed frosted
    # header and redundant with the nav rail after the zensical port.
    # - navigation.path
    # - navigation.expand
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - assets/code-diff-player/code-diff-player.css

extra_javascript:
  # homepage-video.js must precede dot-grid.js: it sets the
  # data-field-homepage flag that dot-grid.js reads to suppress itself.
  - assets/homepage-video.js
  - assets/dot-grid.js
  - assets/header-brand.js
  # Before lesswrong-rail.js: the rail measures heading offsets, and this rewraps them.
  - assets/sticky-headings.js
  - assets/lesswrong-rail.js
  - assets/image-lightbox.js
  - assets/code-diff-player/fence-upgrade.js
  - assets/code-diff-player/code-diff-player.js
  - assets/code-diff-player/field-doc-export.js

site_url: http://openendedgroup.com/Field4/
site_dir: field4
  
