  # drives all of them. Every entry here is a page that also stands alone, but the order is the
  # point — running_code is the mechanic the next four rest on, and automating_field is what hands
  # the whole sequence to an agent. A page appears once in this nav (Zensical resolves prev/next
  # from position), so these are moved here rather than aliased, and their former sections were
  # rebalanced to suit.
