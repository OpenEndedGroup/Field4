name: fieldcv_shared_memory
description: 'fieldcv in Field: a Python box runs point tracks and pose over a camera or movie on a worker thread;
  two graphics boxes under agent_graphics_context draw its frames and FLines straight from shared memory. Run graphics_renderer_launch
  first. FIELDCV_SOURCE picks the input (default: camera 0).'
operations:
- create:
    box: cv_python_root
    name: python
    frame:
      x: 40.0
      y: 200.0
      w: 200.0
      h: 60.0
    properties:
      mainLanguage: python
- create:
    box: cv_source
    name: fieldcv source
    frame:
      x: 40.0
      y: 300.0
      w: 300.0
      h: 100.0
    properties:
      code: |
        import os
        import fieldcv as cv4
        from fieldcv import field

        # a camera index, a movie file, or a glob of images; set FIELDCV_SOURCE before starting Field
        source = os.environ.get("FIELDCV_SOURCE", "0")
        movie = cv4.open_source(source, loop=True)
        pose = cv4.Pose(model="lite")
        camera = field.image("camera", 240, 360)
        tracks = field.lines("tracks")
        skeleton = field.lines("skeleton")

        def publish(r):
            camera.write(r["frame"].image)
            tracks.publish(r["tracks"])
            skeleton.publish(cv4.edges(r["poses"], pose.connections))

        p = cv4.Pipeline(movie, cv4.Tracks(), pose, on_result=publish).start()
- connect:
    parent: cv_python_root
    child: cv_source
- wait:
    seconds: 2
- execute:
    box: cv_source
    property: code
    type: fragment
    code: |
      import os
      import fieldcv as cv4
      from fieldcv import field

      # a camera index, a movie file, or a glob of images; set FIELDCV_SOURCE before starting Field
      source = os.environ.get("FIELDCV_SOURCE", "0")
      movie = cv4.open_source(source, loop=True)
      pose = cv4.Pose(model="lite")
      camera = field.image("camera", 240, 360)
      tracks = field.lines("tracks")
      skeleton = field.lines("skeleton")

      def publish(r):
          camera.write(r["frame"].image)
          tracks.publish(r["tracks"])
          skeleton.publish(cv4.edges(r["poses"], pose.connections))

      p = cv4.Pipeline(movie, cv4.Tracks(), pose, on_result=publish).start()
- wait:
    seconds: 2
- create:
    box: cv_camera_quad
    name: camera quad
    frame:
      x: 380.0
      y: 80.0
      w: 280.0
      h: 100.0
    properties:
      vertex: |
        #version 450
        layout(location = 0) in vec3 pos;
        layout(location = 1) in vec2 tc;
        layout(location = 0) out vec2 ftc;
        void main() { ftc = tc; gl_Position = vec4(pos, 1); }
      fragment: |
        #version 450
        layout(location = 0) in vec2 ftc;
        layout(location = 0) out vec4 uFragColor;
        layout(set = 0, binding = 0) uniform sampler2D camera;
        void main() { uFragColor = vec4(texture(camera, ftc).rgb, 1.0); }
      code: |
        import afield.python.NumpyShared

        prop<LoadedTexture>(camera) = NumpyShared.image("camera").texture()

        var module = moduleHere { }
        var m = Mesh()
        module += m named "camera quad"
        renderer += module

        // the image fills the window. Field's NDC is y-up, image v is y-down: v = 0 is the top edge
        m.set(4, 6) {
            pos.add(-1, -1, 0.9,  1, -1, 0.9,  1, 1, 0.9,  -1, 1, 0.9)
            tc.add(0, 1,  1, 1,  1, 0,  0, 0)
            tri.add(0, 1, 2,  0, 2, 3)
        }
- connect:
    parent: agent_graphics_context
    child: cv_camera_quad
- execute:
    box: cv_camera_quad
    property: code
    type: fragment
    code: |
      import afield.python.NumpyShared

      prop<LoadedTexture>(camera) = NumpyShared.image("camera").texture()

      var module = moduleHere { }
      var m = Mesh()
      module += m named "camera quad"
      renderer += module

      // the image fills the window. Field's NDC is y-up, image v is y-down: v = 0 is the top edge
      m.set(4, 6) {
          pos.add(-1, -1, 0.9,  1, -1, 0.9,  1, 1, 0.9,  -1, 1, 0.9)
          tc.add(0, 1,  1, 1,  1, 0,  0, 0)
          tri.add(0, 1, 2,  0, 2, 3)
      }
- create:
    box: cv_overlay_lines
    name: tracks and skeleton
    frame:
      x: 380.0
      y: 220.0
      w: 280.0
      h: 100.0
    properties:
      vertex: |
        #version 450
        layout(location = 0) in vec3 pos;
        layout(location = 1) in vec4 col;
        layout(location = 0) out vec4 fcol;
        void main() { fcol = col; gl_Position = vec4(pos, 1); }
      fragment: |
        #version 450
        layout(location = 0) in vec4 fcol;
        layout(location = 0) out vec4 uFragColor;
        void main() { uFragColor = fcol; }
      code: |
        import afield.python.NumpyShared

        val tracks = NumpyShared.lines("tracks")
        val skeleton = NumpyShared.lines("skeleton")

        var module = moduleHere { primitiveType = lines }
        var m = Mesh()
        module += m named "overlay"
        renderer += module

        // one segment per pair of consecutive nodes, coloured per source
        fun segments(l: List<FLine>) = l.flatMap { it.nodes.zipWithNext() }

        frames {
            while (frame()) {
                val green = segments(tracks.lines())
                val pink = segments(skeleton.lines())
                val n = green.size + pink.size
                if (n == 0) continue
                // a Mesh always draws through its index buffer, so a line list needs one index pair per segment
                m.set(2 * n, n) {
                    for ((segs, c) in listOf(green to vec(0.2, 1.0, 0.3, 1.0), pink to vec(1.0, 0.3, 0.8, 1.0)))
                        for ((a, b) in segs) {
                            // normalized image (u, v), y down, to Field's y-up NDC (2u - 1, 1 - 2v)
                            pos.add(2 * a.to.x - 1, 1 - 2 * a.to.y, 0.1, 2 * b.to.x - 1, 1 - 2 * b.to.y, 0.1)
                            col.add(c.x, c.y, c.z, c.w, c.x, c.y, c.z, c.w)
                        }
                    for (i in 0 until n) tri.add(2 * i, 2 * i + 1)
                }
            }
        }
- connect:
    parent: agent_graphics_context
    child: cv_overlay_lines
- launch:
    box: cv_overlay_lines
    property: code
    strand: overlay
    code: |
      import afield.python.NumpyShared

      val tracks = NumpyShared.lines("tracks")
      val skeleton = NumpyShared.lines("skeleton")

      var module = moduleHere { primitiveType = lines }
      var m = Mesh()
      module += m named "overlay"
      renderer += module

      // one segment per pair of consecutive nodes, coloured per source
      fun segments(l: List<FLine>) = l.flatMap { it.nodes.zipWithNext() }

      frames {
          while (frame()) {
              val green = segments(tracks.lines())
              val pink = segments(skeleton.lines())
              val n = green.size + pink.size
              if (n == 0) continue
              // a Mesh always draws through its index buffer, so a line list needs one index pair per segment
              m.set(2 * n, n) {
                  for ((segs, c) in listOf(green to vec(0.2, 1.0, 0.3, 1.0), pink to vec(1.0, 0.3, 0.8, 1.0)))
                      for ((a, b) in segs) {
                          // normalized image (u, v), y down, to Field's y-up NDC (2u - 1, 1 - 2v)
                          pos.add(2 * a.to.x - 1, 1 - 2 * a.to.y, 0.1, 2 * b.to.x - 1, 1 - 2 * b.to.y, 0.1)
                          col.add(c.x, c.y, c.z, c.w, c.x, c.y, c.z, c.w)
                      }
                  for (i in 0 until n) tri.add(2 * i, 2 * i + 1)
              }
          }
      }
