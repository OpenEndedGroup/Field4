# Manual release qualification: this pays for fresh source builds only when requested.
name: first-run
on:
  workflow_dispatch:
    inputs:
      os:
        description: Platform to qualify
        type: choice
        default: all
        options: [all, ubuntu-24.04, windows-latest, macos-14]
permissions:
  contents: read
concurrency:
  group: first-run-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: true
jobs:
  source-launch:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["ubuntu-24.04","windows-latest","macos-14"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Small setup helper tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            ./gradlew.bat -p tools/first-run test
          else
            ./gradlew -p tools/first-run test
          fi
      - name: Windows launcher build-result regression
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/test_field_ps1_launcher.ps1
      - name: Real launcher and default API protection
        env:
          # Private-repository Ubuntu runners have 8 GB RAM. Keep the compiler and JS build
          # from competing for a 10 GB compiler heap; the launcher and API defaults stay intact.
          GRADLE_OPTS: ${{ matrix.os == 'ubuntu-24.04' && '-Dorg.gradle.project.kotlin.daemon.jvmargs=-Xmx4g -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false' || '' }}
        run: python tools/ci_first_run.py --timeout 1800
      - name: Desktop GPU selection policy
        run: node --test electron/tests/gpu-policy.test.cjs
      - name: Retain startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run-${{ matrix.os }}
          path: |
            build/first-run-evidence/
            tools/first-run/build/test-results/
