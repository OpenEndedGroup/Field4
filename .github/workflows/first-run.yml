# Manual release qualification: this pays for fresh source builds only when requested.
name: first-run
on:
  workflow_dispatch:
    inputs:
      os:
        description: Platform to qualify
        type: choice
        default: all
        options: [all, ubuntu-24.04, windows-latest, macos-14]
      patchy:
        description: Also build the optional Patchy WebAssembly editor (large Qt/Emscripten downloads)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: first-run-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: true
jobs:
  source-launch:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["ubuntu-24.04","windows-latest","macos-14"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Small setup helper tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            ./gradlew.bat -p tools/first-run test
          else
            ./gradlew -p tools/first-run test
          fi
      - name: Check pinned Patchy source patch
        run: python tools/build_patchy_web.py --check-patch
      - name: Windows launcher build-result regression
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/test_field_ps1_launcher.ps1
      - name: Real launcher and default API protection
        env:
          # Private-repository Ubuntu runners have 8 GB RAM. Keep the compiler and JS build
          # from competing for a 10 GB compiler heap (4 GB stopped fitting in 2026-11); the launcher and API defaults stay intact.
          GRADLE_OPTS: ${{ matrix.os == 'ubuntu-24.04' && '-Dorg.gradle.project.kotlin.daemon.jvmargs=-Xmx6g -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false' || '' }}
        run: python tools/ci_first_run.py --timeout 1800
      - name: Desktop GPU selection policy
        run: node --test electron/tests/gpu-policy.test.cjs
      - name: Retain startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run-${{ matrix.os }}
          path: |
            build/first-run-evidence/
            tools/first-run/build/test-results/
  patchy-web:
    if: inputs.patchy
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["ubuntu-24.04","windows-latest","macos-14"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build optional Patchy Web editor
        run: python tools/build_patchy_web.py
      - name: Verify staged site
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import shutil
          site = Path.home() / '.field4/patchy-web/site'
          manifest = json.loads((site / 'field-patchy.json').read_text())
          for name, expected in manifest['assets'].items():
              assert hashlib.sha256((site / name).read_bytes()).hexdigest() == expected, name
          assert manifest['revision'] == json.loads(Path('optional/patchy-web/pin.json').read_text())['revision']
          assert manifest['iosevkaSha256'] == hashlib.sha256(Path('optional/patchy-web/iosevka-field-ui.ttf').read_bytes()).hexdigest()
          assert b'iosevka-field-ui.ttf' in (site / 'patchy.js').read_bytes()
          evidence = Path('build/first-run-evidence/patchy')
          evidence.mkdir(parents=True, exist_ok=True)
          shutil.copy2(site / 'field-patchy.json', evidence / 'field-patchy.json')
          print('Verified', len(manifest['assets']), 'Patchy site assets')
          PY
      - name: Retain Patchy build manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchy-web-${{ matrix.os }}
          path: build/first-run-evidence/patchy/field-patchy.json
