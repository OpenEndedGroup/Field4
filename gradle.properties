kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.daemon.jvmargs=-Xmx10g
isProduction=false
org.gradle.parallel=true
# 8g matches tools/field_backdoor.py GRADLE_JVMARGS; the lander hit "Java heap space" in citationGates at 2g.
# Keep daemons out of the macOS Dock: AWT loaded in a daemon otherwise gives it a Duke icon.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Djava.awt.headless=true -Dapple.awt.UIElement=true

# Share task outputs (Kotlin compile, source pages, ...) across worktrees through ~/.gradle/caches/build-cache-1.
org.gradle.caching=true
