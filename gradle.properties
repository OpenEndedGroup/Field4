kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.daemon.jvmargs=-Xmx10g
isProduction=false
org.gradle.parallel=true
# Keep daemons out of the macOS Dock: AWT loaded in a daemon otherwise gives it a Duke icon.
org.gradle.jvmargs=-Xmx2g -Djava.awt.headless=true -Dapple.awt.UIElement=true

# Share task outputs (Kotlin compile, source pages, ...) across worktrees through ~/.gradle/caches/build-cache-1.
org.gradle.caching=true
